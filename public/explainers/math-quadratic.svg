    <line x1="80" y1="300" x2="560" y2="300"/>
    <line x1="160" y1="40" x2="160" y2="320"/>
  </g>
  <path d="M100 60 Q320 520 540 60" stroke="#C2410C" stroke-width="4" fill="none"/>
