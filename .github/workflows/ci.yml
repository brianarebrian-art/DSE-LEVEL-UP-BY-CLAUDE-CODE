name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # 2026-09-15：build 設定守衛（快，擺喺長嘅 build 之前）。
      # · build 同 dev 一定要 --webpack（憲章 §3）：冇嘅話 Next 16 預設行 Turbopack，
      #   同 preview（3001，--webpack）行唔同嘅 bundler —— CI 綠唔代表本地行到。
      #   2026-09-15 發現 dev script 一直冇 --webpack，README 教人行嘅就係佢。
      # · middleware.ts：Next 16 見到佢同 proxy.ts 並存會喺 build throw；喺呢度
      #   先攔，錯誤訊息講明原因，唔使等 build 跑幾分鐘先知。
      - name: Build config guard (--webpack, no middleware.ts)
        run: |
          node -e "const s=require('./package.json').scripts; for (const k of ['build','dev']) if(!/--webpack/.test(s[k])){console.error('✗ package.json '+k+' 冇 --webpack：'+s[k]);process.exit(1)}"
          if [ -e middleware.ts ] || [ -e src/middleware.ts ]; then echo "✗ 唔可以有 middleware.ts —— Next 16 用 proxy.ts（見 proxy.ts 檔頭）"; exit 1; fi
          echo "✓ build 設定 OK"

      - run: npm test

      # 憲章 §15 五閘：term-guard（術語＋書面語）／validate-banks（題庫結構）／
      # i18n-guard（漏譯）／contrast-guard（淺字疊淺底）／claims-guard（對外宣稱）。
      # 以前只有本地手動跑，push 上嚟係冇人守。
      - name: QA gates (term-guard / validate-banks / i18n-guard / contrast-guard / claims-guard)
        run: npm run qa

      # 2026-08-20 補上：CI 由開波以嚟【從來冇跑過 eslint】，所以 3 個
      # react-hooks correctness error（喺 render 期間建立組件、喺 render 期間叫
      # 不純函數、用咗未宣告嘅變量）可以長期積落嚟冇人發現。修完之後喺呢度落閘，
      # 唔准再積返。warnings 唔阻 CI，只有 error 先會 fail。
      - name: Lint (errors block, warnings do not)
        run: npx eslint . --max-warnings=-1

      # 實測過：唔帶任何 env 都 build 得綠（SSG 唔喺 build time 讀 Supabase／Auth
      # 密鑰），所以 CI 唔使配 secrets。
      - name: Build check
        run: npm run build
