const DATA = [{"id":"math_fl_ap01","topic":"近似與誤差","difficulty":"basic","question":"將 $3.04982$ 捨入至 3 個有效數字。","options":["$3.0$","$3.05$","$3.050$","$3.04$"],"correctIndex":1,"explanation":"由左起第一個非零數字開始數 3 個有效數字，即 $3$、$0$、$4$；其後一位為 $9$，故第三位由 $4$ 進位為 $5$，得 $3.05$。寫成 $3.04$ 是把第四位截去而未進位；寫成 $3.050$ 多算了一個有效數字；$3.0$ 則只保留了 2 個有效數字。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap02","topic":"近似與誤差","difficulty":"basic","question":"將 $0.0069471$ 捨入至 2 位小數。","options":["$0.0069$","$0.007$","$0.01$","$0.00$"],"correctIndex":2,"explanation":"2 位小數即保留至百分位。百分位原為 $0$，其後一位為 $6$（大於或等於 $5$），故進位得 $0.01$。$0.007$ 是捨入至 3 位小數；$0.0069$ 是捨入至 4 位小數；$0.00$ 則是把第三位小數當成不足以進位。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap03","topic":"近似與誤差","difficulty":"intermediate","question":"某長度量得為 $24.6$ cm，準確至 $0.1$ cm。求該量度的最大絕對誤差。","options":["$0.01$ cm","$0.5$ cm","$0.1$ cm","$0.05$ cm"],"correctIndex":3,"explanation":"最大絕對誤差為量度單位的一半，即 $0.1 \\div 2 = 0.05$ cm。$0.1$ cm 是把量度單位本身當成誤差；$0.5$ cm 是誤把單位當成 $1$ cm；$0.01$ cm 則與所給的準確度無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap04","topic":"近似與誤差","difficulty":"intermediate","question":"一根木條的長度量得為 $15$ cm，準確至最接近的 cm。若其實際長度為 $l$ cm，求 $l$ 的範圍。","options":["$14.9 \\le l \u003c 15.1$","$14 \\le l \u003c 16$","$14.5 \\le l \u003c 15.5$","$14.5 \u003c l \\le 15.5$"],"correctIndex":2,"explanation":"量度單位為 $1$ cm，最大絕對誤差為 $0.5$ cm，故下限為 $15 - 0.5 = 14.5$、上限為 $15 + 0.5 = 15.5$。依捨入規則，恰好等於下限者會捨入至 $15$，故下限取等號；恰好等於上限者會捨入至 $16$，故上限不取等號。把等號放在上限一端是弄反了捨入方向；$14 \\le l \u003c 16$ 把誤差當成整個單位；$14.9 \\le l \u003c 15.1$ 則誤用了 $0.1$ cm 的準確度。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap05","topic":"近似與誤差","difficulty":"intermediate","question":"某物件的質量量得為 $250$ g，準確至最接近的 $10$ g。求該量度的相對誤差。","options":["$0.04$","$0.05$","$0.2$","$0.02$"],"correctIndex":3,"explanation":"最大絕對誤差為 $10 \\div 2 = 5$ g，相對誤差 $= \\dfrac{5}{250} = 0.02$。$0.04$ 是把絕對誤差取作 $10$ g；$0.2$ 是誤用 $\\dfrac{5}{25}$；$0.05$ 則把絕對誤差本身當成相對誤差。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap06","topic":"近似與誤差","difficulty":"intermediate","question":"某量的真確值為 $50$，而量得的值為 $48$。求百分誤差。","options":["$2\\%$","$96\\%$","$4.17\\%$","$4\\%$"],"correctIndex":3,"explanation":"絕對誤差 $= |48 - 50| = 2$，百分誤差 $= \\dfrac{2}{50} \\times 100\\% = 4\\%$。$2\\%$ 是把絕對誤差直接當作百分數；$4.17\\%$ 是誤以量得的值 $48$ 作分母；$96\\%$ 則是量得的值佔真確值的百分比，並非誤差。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap07","topic":"近似與誤差","difficulty":"intermediate","question":"一個正方形的邊長量得為 $8$ cm，準確至最接近的 cm。求其面積的最大可能值。","options":["$81 \\text{ cm}^2$","$64 \\text{ cm}^2$","$72.25 \\text{ cm}^2$","$68.25 \\text{ cm}^2$"],"correctIndex":2,"explanation":"邊長的上限為 $8 + 0.5 = 8.5$ cm，故面積的最大可能值為 $8.5^2 = 72.25 \\text{ cm}^2$。$64 \\text{ cm}^2$ 是用量得的值直接計算，並非最大值；$81 \\text{ cm}^2$ 是把邊長上限誤取為 $9$ cm；$68.25 \\text{ cm}^2$ 則是只把誤差加在面積之上（$64 + 4.25$），忽略了誤差經平方後的放大。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap08","topic":"近似與誤差","difficulty":"hard","question":"一個長方形的長及闊分別量得為 $20$ cm 及 $12$ cm，兩者均準確至最接近的 cm。求其周長的最大絕對誤差。","options":["$0.5$ cm","$1$ cm","$2$ cm","$4$ cm"],"correctIndex":2,"explanation":"長與闊的最大絕對誤差各為 $0.5$ cm。周長 $= 2(\\text{長} + \\text{闊})$，故周長的最大絕對誤差 $= 2 \\times (0.5 + 0.5) = 2$ cm。$1$ cm 是把兩個誤差相加而漏了乘以 $2$；$0.5$ cm 是只計一邊的誤差；$4$ cm 則是把每邊的誤差當成 $1$ cm。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ap09","topic":"近似與誤差","difficulty":"hard","question":"已知 $y$ 捨入至 2 位小數後為 $6.80$，而 $z$ 捨入至 1 位小數後為 $3.5$。求 $y - z$ 的最大可能值。","options":["$3.30$","$3.355$","$3.35$","$3.405$"],"correctIndex":1,"explanation":"差最大時，被減數取最大而減數取最小。$y$ 的上限為 $6.805$，$z$ 的下限為 $3.45$，故 $y - z$ 的最大可能值為 $6.805 - 3.45 = 3.355$。$3.35$ 是直接以量得的值相減；$3.30$ 是把兩者的誤差方向弄反；$3.405$ 則是把 $z$ 的下限誤取為 $3.4$。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns01","topic":"數系","difficulty":"basic","question":"下列哪一個數是有理數？","options":["$\\sqrt{7}$","$\\sqrt{20}$","$\\sqrt{2}$","$\\sqrt{16}$"],"correctIndex":3,"explanation":"$\\sqrt{16} = 4$，可寫成兩個整數之比，故為有理數。$\\sqrt{2}$、$\\sqrt{7}$ 及 $\\sqrt{20}$ 的被開方數均非完全平方數，三者皆為無理數。判別的關鍵在於根號能否化去，而非式子外觀是否有根號 —— $\\sqrt{20}$ 雖可化簡為 $2\\sqrt{5}$，但根號並未消失，仍屬無理數。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns02","topic":"數系","difficulty":"basic","question":"把循環小數 $0.\\dot{2}\\dot{7}$ 化成最簡分數。","options":["$\\dfrac{27}{100}$","$\\dfrac{3}{11}$","$\\dfrac{27}{90}$","$\\dfrac{3}{10}$"],"correctIndex":1,"explanation":"設 $x = 0.272727\\ldots$，則 $100x = 27.272727\\ldots$。兩式相減得 $99x = 27$，故 $x = \\dfrac{27}{99} = \\dfrac{3}{11}$。$\\dfrac{27}{100}$ 是把它當成有限小數 $0.27$；$\\dfrac{27}{90}$ 是誤用了「一位不循環、兩位循環」的分母；$\\dfrac{3}{10}$ 則是先捨入再化分數。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns03","topic":"數系","difficulty":"intermediate","question":"把循環小數 $0.\\dot{4}\\dot{5}$ 化成最簡分數。","options":["$\\dfrac{45}{100}$","$\\dfrac{5}{11}$","$\\dfrac{5}{9}$","$\\dfrac{9}{20}$"],"correctIndex":1,"explanation":"設 $x = 0.454545\\ldots$，則 $100x - x = 45$，得 $x = \\dfrac{45}{99}$。分子分母同除以 $9$，化簡得 $\\dfrac{5}{11}$。$\\dfrac{45}{100}$ 與 $\\dfrac{9}{20}$ 都是把它當成有限小數 $0.45$（後者已化簡）；$\\dfrac{5}{9}$ 則是誤用了單位循環的分母 $9$，該分母只適用於 $0.\\dot{5}$ 一類單位循環。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns04","topic":"數系","difficulty":"intermediate","question":"化簡 $\\sqrt{50}$。","options":["$25\\sqrt{2}$","$5\\sqrt{2}$","$2\\sqrt{5}$","$5\\sqrt{10}$"],"correctIndex":1,"explanation":"$50 = 25 \\times 2$，而 $25$ 為完全平方數，故 $\\sqrt{50} = \\sqrt{25} \\times \\sqrt{2} = 5\\sqrt{2}$。$2\\sqrt{5}$ 是把 $50$ 誤拆為 $4 \\times 5$ 一類；$25\\sqrt{2}$ 是開方時漏了取平方根；$5\\sqrt{10}$ 則是拆項之後未有把 $10$ 再作處理。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns05","topic":"數系","difficulty":"intermediate","question":"求 $(\\sqrt{3} + 1)(\\sqrt{3} - 1)$ 的值。","options":["$\\sqrt{3}$","$2\\sqrt{3}$","$4$","$2$"],"correctIndex":3,"explanation":"此為平方差公式：$(a+b)(a-b) = a^2 - b^2$，故原式 $= (\\sqrt{3})^2 - 1^2 = 3 - 1 = 2$。$4$ 是把 $(\\sqrt{3})^2$ 誤算為 $9$ 一類的錯誤；$2\\sqrt{3}$ 及 $\\sqrt{3}$ 都是誤以為平方差之後仍留有根號 —— 兩項的根號恰好相消，結果必為有理數，凡答案仍帶根號者即知運算有誤。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns06","topic":"數系","difficulty":"intermediate","question":"下列哪一個分數化成小數時為有限小數？","options":["$\\dfrac{7}{40}$","$\\dfrac{4}{15}$","$\\dfrac{2}{7}$","$\\dfrac{5}{12}$"],"correctIndex":0,"explanation":"一個最簡分數化成有限小數的條件，是其分母的質因數只有 $2$ 及 $5$。$40 = 2^3 \\times 5$，符合條件，$\\dfrac{7}{40} = 0.175$。$12 = 2^2 \\times 3$ 含質因數 $3$；$15 = 3 \\times 5$ 含質因數 $3$；$7$ 本身即為 $2$ 及 $5$ 以外的質數 —— 三者化成小數時均為循環小數。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns07","topic":"數系","difficulty":"intermediate","question":"化簡 $\\dfrac{\\sqrt{12} + \\sqrt{27}}{\\sqrt{3}}$。","options":["$5\\sqrt{3}$","$5$","$\\sqrt{13}$","$13$"],"correctIndex":1,"explanation":"先化簡分子：$\\sqrt{12} = 2\\sqrt{3}$、$\\sqrt{27} = 3\\sqrt{3}$，故分子 $= 5\\sqrt{3}$。除以 $\\sqrt{3}$ 得 $5$。$\\sqrt{13}$ 是把 $\\sqrt{12} + \\sqrt{27}$ 誤當成可以直接把被開方數相加；$5\\sqrt{3}$ 是化簡了分子而漏了除法；$13$ 則是在上述錯誤之上再把根號去掉。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns08","topic":"數系","difficulty":"hard","question":"下列哪一個數必定是無理數？","options":["$(\\sqrt{5})^2$","$\\sqrt{2} + (1 - \\sqrt{2})$","$\\sqrt{2} + 3$","$\\sqrt{2} \\times \\sqrt{8}$"],"correctIndex":2,"explanation":"有理數與無理數之和必為無理數，故 $\\sqrt{2} + 3$ 為無理數。其餘三項雖然式子帶有根號，但化簡之後根號全部消去：$\\sqrt{2} \\times \\sqrt{8} = \\sqrt{16} = 4$；$(\\sqrt{5})^2 = 5$；$\\sqrt{2} + (1 - \\sqrt{2}) = 1$ —— 三者皆為有理數。本題的考核重點正在於此：外觀有根號，不等於該數為無理數。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ns09","topic":"數系","difficulty":"hard","question":"已知 $x = 2 + \\sqrt{3}$，求 $x + \\dfrac{1}{x}$ 的值。","options":["$4$","$\\dfrac{1}{4}$","$4 + 2\\sqrt{3}$","$2 + \\sqrt{3}$"],"correctIndex":0,"explanation":"先把 $\\dfrac{1}{x}$ 的分母有理化：$\\dfrac{1}{2+\\sqrt{3}} = \\dfrac{2-\\sqrt{3}}{(2+\\sqrt{3})(2-\\sqrt{3})} = \\dfrac{2-\\sqrt{3}}{4-3} = 2 - \\sqrt{3}$。故 $x + \\dfrac{1}{x} = (2+\\sqrt{3}) + (2-\\sqrt{3}) = 4$。$2 + \\sqrt{3}$ 是漏算了 $\\dfrac{1}{x}$ 一項；$4 + 2\\sqrt{3}$ 是把 $\\dfrac{1}{x}$ 誤當成與 $x$ 相同；$\\dfrac{1}{4}$ 則是把整個式子誤作 $\\dfrac{1}{x + x}$ 一類的處理。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va01","topic":"變分","difficulty":"basic","question":"已知 $y$ 與 $x$ 成正變。當 $x = 6$ 時，$y = 15$。求當 $x = 10$ 時 $y$ 的值。","options":["$25$","$19$","$9$","$4$"],"correctIndex":0,"explanation":"設 $y = kx$。由 $15 = 6k$ 得 $k = 2.5$，故 $y = 2.5x$。當 $x = 10$ 時，$y = 2.5 \\times 10 = 25$。$19$ 是把 $x$ 的增量 $4$ 直接加在 $y$ 之上，誤把正變當成等量遞增；$9$ 是把兩者的關係當成反變；$4$ 則只是 $x$ 的變化量。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va02","topic":"變分","difficulty":"basic","question":"已知 $z$ 與 $w$ 成反變。當 $w = 4$ 時，$z = 9$。求當 $w = 6$ 時 $z$ 的值。","options":["$6$","$36$","$11$","$13.5$"],"correctIndex":0,"explanation":"設 $z = \\dfrac{k}{w}$。由 $9 = \\dfrac{k}{4}$ 得 $k = 36$，故 $z = \\dfrac{36}{w}$。當 $w = 6$ 時，$z = \\dfrac{36}{6} = 6$。$13.5$ 是把兩者的關係當成正變；$11$ 是把 $w$ 的增量加在 $z$ 之上；$36$ 則是把變分常數本身當成答案。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va03","topic":"變分","difficulty":"basic","question":"已知 $y$ 與 $x$ 成正變。若 $x$ 增加 $20\\%$，則 $y$ 增加多少百分比？","options":["$4\\%$","$20\\%$","$120\\%$","$40\\%$"],"correctIndex":1,"explanation":"設 $y = kx$。新值為 $k(1.2x) = 1.2kx$，即原值的 $1.2$ 倍，故 $y$ 增加 $20\\%$。正變之下，兩者的百分變化必定相同，與變分常數 $k$ 的大小無關。$40\\%$ 是誤把百分變化加倍；$4\\%$ 是誤取 $0.2^2$；$120\\%$ 則是新值佔原值的百分比，並非增加的百分比。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va04","topic":"變分","difficulty":"intermediate","question":"已知 $y$ 與 $x$ 的平方成正變。若 $x$ 變為原來的 $3$ 倍，則 $y$ 變為原來的多少倍？","options":["$9$ 倍","$3$ 倍","$6$ 倍","$27$ 倍"],"correctIndex":0,"explanation":"設 $y = kx^2$。當 $x$ 變為 $3x$ 時，新值為 $k(3x)^2 = 9kx^2$，即原來的 $9$ 倍。$3$ 倍是漏了平方；$6$ 倍是把平方誤作乘以 $2$；$27$ 倍則是誤用了立方。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va05","topic":"變分","difficulty":"intermediate","question":"已知 $z$ 與 $x$ 成正變，並與 $y$ 成反變。當 $x = 8$、$y = 2$ 時，$z = 20$。求當 $x = 6$、$y = 5$ 時 $z$ 的值。","options":["$4.8$","$6$","$7.5$","$50$"],"correctIndex":1,"explanation":"設 $z = \\dfrac{kx}{y}$。由 $20 = \\dfrac{8k}{2} = 4k$ 得 $k = 5$。故當 $x = 6$、$y = 5$ 時，$z = \\dfrac{5 \\times 6}{5} = 6$。$4.8$ 是把 $x$ 與 $y$ 的角色調轉；$7.5$ 是誤把 $k$ 取為 $\\dfrac{20}{8}$ 一類；$50$ 則是把兩者都當成正變。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va06","topic":"變分","difficulty":"intermediate","question":"已知 $y$ 為 $x$ 的部分變，即 $y = a + bx$，其中 $a$、$b$ 為常數。當 $x = 2$ 時 $y = 11$；當 $x = 5$ 時 $y = 20$。求 $a$ 的值。","options":["$3$","$5$","$1$","$11$"],"correctIndex":1,"explanation":"代入兩組數值得 $a + 2b = 11$ 及 $a + 5b = 20$。兩式相減得 $3b = 9$，即 $b = 3$；再代回得 $a = 11 - 2 \\times 3 = 5$。$3$ 是 $b$ 的值而非 $a$；$11$ 是把 $x = 2$ 時的 $y$ 值誤當成常數項；$1$ 則是相減時把 $b$ 誤算為 $\\dfrac{20-11}{5-2+3}$ 一類。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va07","topic":"變分","difficulty":"intermediate","question":"已知 $y$ 與 $\\sqrt{x}$ 成正變。當 $x = 9$ 時，$y = 12$。求當 $y = 20$ 時 $x$ 的值。","options":["$25$","$15$","$5$","$225$"],"correctIndex":0,"explanation":"設 $y = k\\sqrt{x}$。由 $12 = k\\sqrt{9} = 3k$ 得 $k = 4$。當 $y = 20$ 時，$20 = 4\\sqrt{x}$，故 $\\sqrt{x} = 5$，$x = 25$。$15$ 是把 $y$ 與 $x$ 當成直接成正變；$5$ 是求得 $\\sqrt{x}$ 之後漏了平方；$225$ 則是把 $\\sqrt{x}$ 誤取為 $15$。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va08","topic":"變分","difficulty":"hard","question":"已知 $z$ 與 $x$ 的平方成正變，並與 $y$ 成反變。若 $x$ 增加 $20\\%$ 而 $y$ 減少 $20\\%$，求 $z$ 的百分變化。","options":["增加 $44\\%$","增加 $80\\%$","減少 $10\\%$","增加 $20\\%$"],"correctIndex":1,"explanation":"設 $z = \\dfrac{kx^2}{y}$。新值 $= \\dfrac{k(1.2x)^2}{0.8y} = \\dfrac{1.44kx^2}{0.8y} = 1.8 \\times \\dfrac{kx^2}{y}$，即原值的 $1.8$ 倍，故 $z$ 增加 $80\\%$。增加 $44\\%$ 是只計了 $x$ 的影響而漏了 $y$；增加 $20\\%$ 是把平方及反變一併忽略；減少 $10\\%$ 則是把兩個百分變化直接相減。本題的關鍵在於：百分變化須以【倍數相乘】處理，不可相加或相減。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_va09","topic":"變分","difficulty":"hard","question":"已知 $y = \\dfrac{a}{x} + b$，其中 $a$、$b$ 為常數。當 $x = 1$ 時 $y = 7$；當 $x = 2$ 時 $y = 5$。求當 $x = 4$ 時 $y$ 的值。","options":["$2$","$3$","$5$","$4$"],"correctIndex":3,"explanation":"代入兩組數值得 $a + b = 7$ 及 $\\dfrac{a}{2} + b = 5$。兩式相減得 $\\dfrac{a}{2} = 2$，即 $a = 4$，再代回得 $b = 3$。故當 $x = 4$ 時，$y = \\dfrac{4}{4} + 3 = 4$。$3$ 是漏了 $\\dfrac{a}{x}$ 一項而只取常數 $b$；$2$ 是誤以為 $y$ 由 $5$ 繼續等量遞減；$5$ 則是把 $x = 2$ 時的值直接沿用。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg01","topic":"多邊形與角","difficulty":"basic","question":"一個正多邊形的每一個內角為 $156^{\\circ}$。求其邊數。","options":["$12$","$24$","$15$","$13$"],"correctIndex":2,"explanation":"每一個外角 $= 180^{\\circ} - 156^{\\circ} = 24^{\\circ}$。正多邊形的外角和恆為 $360^{\\circ}$，故邊數 $= \\dfrac{360^{\\circ}}{24^{\\circ}} = 15$。$13$ 是誤用內角和公式而未解方程；$24$ 是把外角的度數當成邊數；$12$ 則是把外角誤取為 $30^{\\circ}$。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg02","topic":"多邊形與角","difficulty":"intermediate","question":"一個多邊形的內角和為 $1440^{\\circ}$。求其邊數。","options":["$8$","$12$","$10$","$9$"],"correctIndex":2,"explanation":"內角和 $= (n-2) \\times 180^{\\circ}$。由 $(n-2) \\times 180^{\\circ} = 1440^{\\circ}$ 得 $n - 2 = 8$，故 $n = 10$。$8$ 是求得 $n - 2$ 之後漏了加回 $2$；$12$ 是誤用 $n + 2$；$9$ 則是誤用 $n \\times 180^{\\circ}$ 一類的公式。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg03","topic":"多邊形與角","difficulty":"intermediate","question":"一個正多邊形的每一個內角是每一個外角的 $4$ 倍。求其邊數。","options":["$10$","$8$","$4$","$5$"],"correctIndex":0,"explanation":"設每一個外角為 $x$，則內角為 $4x$。內角與外角互補，故 $x + 4x = 180^{\\circ}$，得 $x = 36^{\\circ}$。邊數 $= \\dfrac{360^{\\circ}}{36^{\\circ}} = 10$。$8$ 是誤解方程而取 $x = 45^{\\circ}$；$5$ 是把內角誤取為 $4 \\times 180^{\\circ} \\div 5$ 一類；$4$ 則是把題目中的倍數當成邊數。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg04","topic":"多邊形與角","difficulty":"intermediate","question":"一個五邊形其中四個內角分別為 $100^{\\circ}$、$120^{\\circ}$、$90^{\\circ}$ 及 $130^{\\circ}$。求第五個內角。","options":["$100^{\\circ}$","$110^{\\circ}$","$140^{\\circ}$","$80^{\\circ}$"],"correctIndex":0,"explanation":"五邊形的內角和 $= (5-2) \\times 180^{\\circ} = 540^{\\circ}$。四個已知內角之和 $= 100^{\\circ} + 120^{\\circ} + 90^{\\circ} + 130^{\\circ} = 440^{\\circ}$，故第五個內角 $= 540^{\\circ} - 440^{\\circ} = 100^{\\circ}$。$80^{\\circ}$ 是誤用外角和 $360^{\\circ}$ 作總和；$110^{\\circ}$ 是把總和誤取為 $550^{\\circ}$；$140^{\\circ}$ 則是誤用了六邊形的內角和。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg05","topic":"多邊形與角","difficulty":"intermediate","question":"一個凸多邊形的每一個內角均為 $150^{\\circ}$。求其對角線的數目。","options":["$12$","$27$","$54$","$66$"],"correctIndex":2,"explanation":"每一個外角 $= 180^{\\circ} - 150^{\\circ} = 30^{\\circ}$，故邊數 $n = \\dfrac{360^{\\circ}}{30^{\\circ}} = 12$。對角線數目 $= \\dfrac{n(n-3)}{2} = \\dfrac{12 \\times 9}{2} = 54$。$12$ 是求得邊數之後停手，未回應題目所問；$66$ 是誤用 $\\dfrac{n(n-1)}{2}$，該式數的是所有連線而非只數對角線；$27$ 則是漏了除以 $2$ 之後再減半一類的運算錯誤。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg06","topic":"多邊形與角","difficulty":"intermediate","question":"一個多邊形共有 $20$ 條對角線。求其邊數。","options":["$10$","$40$","$8$","$7$"],"correctIndex":2,"explanation":"由 $\\dfrac{n(n-3)}{2} = 20$ 得 $n^2 - 3n - 40 = 0$，即 $(n-8)(n+5) = 0$。邊數必為正，故 $n = 8$。$10$ 是誤用 $\\dfrac{n(n-1)}{2}$；$7$ 是解方程時算錯；$40$ 則是把對角線數目乘以 $2$ 而未解方程。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg07","topic":"多邊形與角","difficulty":"hard","question":"一個正多邊形的每一個內角比正六邊形的每一個內角大 $24^{\\circ}$。求該正多邊形的邊數。","options":["$10$","$8$","$12$","$15$"],"correctIndex":0,"explanation":"正六邊形的每一個內角 $= \\dfrac{(6-2) \\times 180^{\\circ}}{6} = 120^{\\circ}$。故所求多邊形的每一個內角 $= 120^{\\circ} + 24^{\\circ} = 144^{\\circ}$，每一個外角 $= 180^{\\circ} - 144^{\\circ} = 36^{\\circ}$，邊數 $= \\dfrac{360^{\\circ}}{36^{\\circ}} = 10$。$8$ 是把正六邊形的內角誤取為 $108^{\\circ}$（該值屬正五邊形）；$12$ 是把外角誤取為 $30^{\\circ}$；$15$ 則是把 $24^{\\circ}$ 本身當成外角。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_pg08","topic":"多邊形與角","difficulty":"hard","question":"已知正 $n$ 邊形的每一個內角與正 $2n$ 邊形的每一個內角相差 $30^{\\circ}$。求 $n$ 的值。","options":["$8$","$6$","$3$","$12$"],"correctIndex":1,"explanation":"正 $n$ 邊形的每一個內角 $= 180^{\\circ} - \\dfrac{360^{\\circ}}{n}$；正 $2n$ 邊形的每一個內角 $= 180^{\\circ} - \\dfrac{360^{\\circ}}{2n} = 180^{\\circ} - \\dfrac{180^{\\circ}}{n}$。兩者相差 $= \\dfrac{360^{\\circ}}{n} - \\dfrac{180^{\\circ}}{n} = \\dfrac{180^{\\circ}}{n}$。由 $\\dfrac{180^{\\circ}}{n} = 30^{\\circ}$ 得 $n = 6$。$12$ 是求得 $n$ 之後誤答 $2n$；$3$ 是把差誤取為 $\\dfrac{90^{\\circ}}{n}$；$8$ 則是把兩式相減時把常數項 $180^{\\circ}$ 一併算入。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss01","topic":"相似形與相似立體","difficulty":"basic","question":"兩個相似三角形的對應邊之比為 $3:5$。求其面積之比。","options":["$6:10$","$3:5$","$9:25$","$27:125$"],"correctIndex":2,"explanation":"相似圖形的面積之比等於對應邊之比的平方，故面積之比 $= 3^2 : 5^2 = 9:25$。$3:5$ 是把邊之比直接當成面積之比；$6:10$ 是把邊之比乘以 $2$；$27:125$ 則是誤用了立方 —— 立方適用於體積，不適用於面積。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss02","topic":"相似形與相似立體","difficulty":"basic","question":"兩個相似立體的體積之比為 $8:27$。求其對應邊之比。","options":["$\\sqrt{8}:\\sqrt{27}$","$8:27$","$4:9$","$2:3$"],"correctIndex":3,"explanation":"體積之比等於對應邊之比的立方，故對應邊之比 $= \\sqrt[3]{8} : \\sqrt[3]{27} = 2:3$。$4:9$ 是誤取平方根之後再平方；$8:27$ 是把體積之比直接當成邊之比；$\\sqrt{8}:\\sqrt{27}$ 則是誤用了平方根 —— 由體積回推邊長須取立方根。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss03","topic":"相似形與相似立體","difficulty":"basic","question":"兩個相似圓柱體的高之比為 $2:5$。求其表面積之比。","options":["$2:5$","$16:625$","$4:25$","$8:125$"],"correctIndex":2,"explanation":"相似立體的表面積之比等於對應長度之比的平方，故表面積之比 $= 2^2 : 5^2 = 4:25$。$2:5$ 是把長度之比直接當成面積之比；$8:125$ 是誤用立方（該式屬體積之比）；$16:625$ 則是誤用了四次方。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss04","topic":"相似形與相似立體","difficulty":"intermediate","question":"兩個相似三角形的面積分別為 $18 \\text{ cm}^2$ 及 $50 \\text{ cm}^2$。若較小者的一邊長 $6$ cm，求較大者對應邊的長度。","options":["$8$ cm","$10$ cm","$16\\dfrac{2}{3}$ cm","$15$ cm"],"correctIndex":1,"explanation":"面積之比 $= 18:50 = 9:25$，故對應邊之比 $= \\sqrt{9} : \\sqrt{25} = 3:5$。所求邊長 $= 6 \\times \\dfrac{5}{3} = 10$ cm。$16\\dfrac{2}{3}$ cm 是把面積之比直接當成邊之比（$6 \\times \\dfrac{50}{18}$）；$8$ cm 是把邊之比誤取為 $3:4$；$15$ cm 則是誤把 $6$ cm 當成較大者的邊長。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss05","topic":"相似形與相似立體","difficulty":"intermediate","question":"兩個相似立體的表面積之比為 $9:16$。若較小者的體積為 $54 \\text{ cm}^3$，求較大者的體積。","options":["$72 \\text{ cm}^3$","$128 \\text{ cm}^3$","$216 \\text{ cm}^3$","$96 \\text{ cm}^3$"],"correctIndex":1,"explanation":"表面積之比 $9:16$ 對應長度之比 $\\sqrt{9}:\\sqrt{16} = 3:4$，故體積之比 $= 3^3 : 4^3 = 27:64$。所求體積 $= 54 \\times \\dfrac{64}{27} = 128 \\text{ cm}^3$。$96 \\text{ cm}^3$ 是把表面積之比直接當成體積之比（$54 \\times \\dfrac{16}{9}$）；$72 \\text{ cm}^3$ 是誤用長度之比 $\\dfrac{4}{3}$；$216 \\text{ cm}^3$ 則是誤把長度之比取為 $1:2$ 而作立方。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss06","topic":"相似形與相似立體","difficulty":"intermediate","question":"一個圓錐被一平行於底面的平面截開，所得上方小圓錐的高為原圓錐的 $\\dfrac{1}{3}$。求小圓錐的體積與原圓錐體積之比。","options":["$1:6$","$1:3$","$1:27$","$1:9$"],"correctIndex":2,"explanation":"平行於底面的截面所得的小圓錐與原圓錐相似，長度之比為 $1:3$，故體積之比 $= 1^3 : 3^3 = 1:27$。$1:3$ 是把長度之比直接當成體積之比；$1:9$ 是誤用平方（該式屬表面積之比）；$1:6$ 則是把立方誤作乘以 $3$ 之後再加倍。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss07","topic":"相似形與相似立體","difficulty":"hard","question":"一個圓錐的高為 $12$ cm，被一平行於底面的平面在距離頂點 $8$ cm 處截開。求上方小圓錐的體積與下方平截頭體體積之比。","options":["$2:3$","$8:19$","$2:1$","$8:27$"],"correctIndex":1,"explanation":"小圓錐與原圓錐相似，高之比為 $8:12 = 2:3$，故體積之比 $= 2^3 : 3^3 = 8:27$。平截頭體為原圓錐減去小圓錐，其體積佔 $27 - 8 = 19$ 份，故所求之比 $= 8:19$。$8:27$ 是小圓錐與【原圓錐】之比，並非與平截頭體之比 —— 這是本題最常見的失分位；$2:1$ 是誤用高之比 $8:4$；$2:3$ 則是把高之比直接當成體積之比。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_fl_ss08","topic":"相似形與相似立體","difficulty":"hard","question":"兩個相似水樽的高之比為 $5:4$。若較大者可盛水 $500$ mL，求較小者可盛水多少？","options":["$400$ mL","$256$ mL","$625$ mL","$320$ mL"],"correctIndex":1,"explanation":"容量與體積同理，其比等於高之比的立方，即 $5^3 : 4^3 = 125:64$。故較小者可盛水 $500 \\times \\dfrac{64}{125} = 256$ mL。$400$ mL 是把高之比直接當成容量之比（$500 \\times \\dfrac{4}{5}$）；$320$ mL 是誤用平方 $\\dfrac{16}{25}$；$625$ mL 則是把比例的方向弄反，令較小者反而盛得更多 —— 答案大於 $500$ mL 即知有誤。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "math";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
// ── 審核用時自動記錄 ──────────────────────────────────────────────────────
// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "math-floor-batch1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "math-floor-batch1.decisions.json"; a.click();
});
counts();
</script></body></html>
