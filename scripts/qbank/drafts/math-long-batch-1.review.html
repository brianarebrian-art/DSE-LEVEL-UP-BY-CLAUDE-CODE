<script>
const DATA = [{"id":"math_long_b1_01","topic":"二次方程","difficulty":"basic","question":"已知二次方程 $x^2 - 7x + 12 = 0$ 的兩根為 $\\alpha$ 與 $\\beta$。\n(a) 求 $\\alpha + \\beta$ 及 $\\alpha\\beta$ 的值。\n(b) 由此求 $\\alpha^2 + \\beta^2$ 的值。","explanation":"本題考核根與係數的關係（韋達定理）及其在對稱式上的應用。常見扣分位有二：其一是把 $\\alpha + \\beta$ 的符號寫錯，忘記公式為 $-b/a$ 而非 $b/a$；其二是在 (b) 部分直接寫 $\\alpha^2 + \\beta^2 = (\\alpha + \\beta)^2$，遺漏 $-2\\alpha\\beta$ 一項。設計此題的用意，是讓考生即使無法解出兩根的實際數值，仍可憑對稱式完成作答。","type":"long","referenceAnswer":"(a) 由根與係數的關係：$\\alpha + \\beta = -\\dfrac{-7}{1} = 7$，$\\alpha\\beta = \\dfrac{12}{1} = 12$。\n(b) $\\alpha^2 + \\beta^2 = (\\alpha + \\beta)^2 - 2\\alpha\\beta = 7^2 - 2(12) = 49 - 24 = 25$。","markingScheme":"(a) A1 求得 $\\alpha + \\beta = 7$；A1 求得 $\\alpha\\beta = 12$。\n(b) M1 使用恆等式 $\\alpha^2 + \\beta^2 = (\\alpha + \\beta)^2 - 2\\alpha\\beta$；A1 求得 25。\n註：若考生先解出 $\\alpha = 3$、$\\beta = 4$ 再直接計算，(b) 部分可給予 M1 + A1，但 (a) 部分仍須明確寫出兩者之和與積。","suggestedMinutes":5,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_02","topic":"百分數與利率","difficulty":"basic","question":"某手提電腦的標價為 \\$8000。店舖先以標價的九折出售，其後因存貨過多，再在售價上減 15%。\n(a) 求最終售價。\n(b) 求最終售價相對標價的整體折扣百分率。","explanation":"本題考核連續折扣的計算。最常見的錯誤是把兩次折扣直接相加，得出 25% 的整體折扣，原因是忽略了第二次折扣的基數為第一次折扣後的售價，而非原標價。正確的整體折扣為 $1 - 0.9 \\times 0.85 = 0.235$，即 23.5%。此題的設計正是要讓兩種做法得出不同數值，使錯誤顯露出來。","type":"long","referenceAnswer":"(a) 第一次折扣後售價 $= 8000 \\times 0.9 = 7200$。\n第二次折扣後售價 $= 7200 \\times (1 - 0.15) = 7200 \\times 0.85 = 6120$。\n最終售價為 \\$6120。\n(b) 整體折扣百分率 $= \\dfrac{8000 - 6120}{8000} \\times 100\\% = \\dfrac{1880}{8000} \\times 100\\% = 23.5\\%$。","markingScheme":"(a) M1 計算第一次折扣後售價；M1 以第一次折扣後售價（而非標價）為基數計算第二次折扣；A1 求得 \\$6120。\n(b) M1 以「標價與最終售價之差除以標價」列式；A1 求得 23.5%。","suggestedMinutes":6,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_03","topic":"等差數列","difficulty":"basic","question":"某等差數列的第 3 項為 11，第 8 項為 31。\n(a) 求該數列的首項及公差。\n(b) 求首 20 項之和。","explanation":"本題考核等差數列通項與求和公式的基本運用。常見扣分位是把第 3 項誤寫成 $a + 3d$（正確為 $a + 2d$），即混淆了項數與公差的倍數；同類錯誤亦見於求和公式中把 $(n-1)$ 寫成 $n$。建議作答時先明確寫出通項公式 $T_n = a + (n-1)d$，再代入項數，可大幅減少此類失分。","type":"long","referenceAnswer":"(a) 設首項為 $a$、公差為 $d$。\n$a + 2d = 11$ …… (1)\n$a + 7d = 31$ …… (2)\n(2) $-$ (1)：$5d = 20$，故 $d = 4$。\n代回 (1)：$a + 8 = 11$，故 $a = 3$。\n(b) $S_{20} = \\dfrac{20}{2}\\left[2(3) + (20 - 1)(4)\\right] = 10(6 + 76) = 10 \\times 82 = 820$。","markingScheme":"(a) M1 以第 3 項及第 8 項列出兩條方程；A1 求得 $d = 4$；A1 求得 $a = 3$。\n(b) M1 正確代入求和公式 $S_n = \\dfrac{n}{2}[2a + (n-1)d]$；A1 求得 820。","suggestedMinutes":6,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_04","topic":"餘式與因式定理","difficulty":"intermediate","question":"設 $f(x) = 2x^3 + ax^2 - 5x + b$，其中 $a$ 與 $b$ 為常數。已知 $f(x)$ 被 $x - 1$ 除時餘 $-6$，且 $x + 2$ 為 $f(x)$ 的因式。\n(a) 求 $a$ 及 $b$ 的值。\n(b) 由此把 $f(x)$ 完全分解為一次因式。","explanation":"本題考核餘式定理與因式定理的聯立運用，以及其後的完全分解。常見扣分位有三：其一是混淆兩條定理的方向 —— 「被 $x - 1$ 除」對應 $f(1)$，「被 $x + 2$ 整除」對應 $f(-2) = 0$，代入的數值須為使該一次因式等於零的 $x$ 值；其二是在 (b) 停在二次因式便收筆，未達「完全分解」的要求；其三是分解 $2x^2 - x - 3$ 時忽略首項係數 2，誤寫成 $(x - 3)(x + 1)$。可用 $f(-1) = -2 + 3 + 5 - 6 = 0$ 自行檢驗 $x + 1$ 確為因式。","type":"long","referenceAnswer":"(a) 由餘式定理：$f(1) = 2 + a - 5 + b = -6$，即 $a + b = -3$ …… (1)\n由因式定理：$f(-2) = -16 + 4a + 10 + b = 0$，即 $4a + b = 6$ …… (2)\n(2) $-$ (1)：$3a = 9$，故 $a = 3$。\n代回 (1)：$3 + b = -3$，故 $b = -6$。\n(b) 即 $f(x) = 2x^3 + 3x^2 - 5x - 6$。\n以 $x + 2$ 作長除法：$f(x) = (x + 2)(2x^2 - x - 3)$。\n再分解二次因式：$2x^2 - x - 3 = (2x - 3)(x + 1)$。\n故 $f(x) = (x + 1)(x + 2)(2x - 3)$。","markingScheme":"(a) M1 由餘式定理列出 $f(1) = -6$；M1 由因式定理列出 $f(-2) = 0$；A1 求得 $a = 3$；A1 求得 $b = -6$。\n(b) M1 以 $x + 2$ 作長除法（或比較係數）求得二次因式；M1 分解 $2x^2 - x - 3$；A1 寫出完全分解 $(x + 1)(x + 2)(2x - 3)$。\n註：(b) 若只寫至 $(x + 2)(2x^2 - x - 3)$ 而未再分解，只得 M1，不得 A1 —— 題目要求「完全分解為一次因式」。","suggestedMinutes":9,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_05","topic":"坐標幾何","difficulty":"intermediate","question":"在直角坐標平面上，$A(-2, 1)$、$B(6, 7)$。\n(a) 求線段 $AB$ 的中點 $M$ 的坐標。\n(b) 求 $AB$ 的垂直平分線的方程。\n(c) 已知點 $P(k, 0)$ 與 $A$、$B$ 等距，求 $k$ 的值。","explanation":"本題考核中點公式、垂直線斜率關係，以及「垂直平分線即等距點軌跡」這一概念聯繫。(c) 部分是分數分水嶺：能認出等距條件等同於落在垂直平分線上的考生，可直接代入 (b) 的答案，數步完成；未能建立此聯繫的考生則須動用距離公式並平方展開，運算量大增，亦更易出錯。此設計旨在獎勵概念理解而非單純計算。","type":"long","referenceAnswer":"(a) $M = \\left(\\dfrac{-2 + 6}{2}, \\dfrac{1 + 7}{2}\\right) = (2, 4)$。\n(b) $AB$ 的斜率 $= \\dfrac{7 - 1}{6 - (-2)} = \\dfrac{6}{8} = \\dfrac{3}{4}$。\n垂直平分線的斜率 $= -\\dfrac{4}{3}$，且經過 $M(2, 4)$。\n方程：$y - 4 = -\\dfrac{4}{3}(x - 2)$，即 $4x + 3y - 20 = 0$。\n(c) 與 $A$、$B$ 等距的點必在 $AB$ 的垂直平分線上。把 $(k, 0)$ 代入：$4k + 0 - 20 = 0$，故 $k = 5$。","markingScheme":"(a) A1 求得 $(2, 4)$。\n(b) M1 求 $AB$ 的斜率；M1 取負倒數作為垂直平分線的斜率；A1 寫出經過中點的方程。\n(c) M1 指出等距點在垂直平分線上（或直接以距離公式列出 $PA = PB$）；A1 求得 $k = 5$。\n註：(c) 若考生以距離公式 $\\sqrt{(k+2)^2 + 1} = \\sqrt{(k-6)^2 + 49}$ 求解，同樣給予 M1 + A1。","suggestedMinutes":9,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_06","topic":"三角函數","difficulty":"intermediate","question":"在 $\\triangle ABC$ 中，$AB = 9$ cm，$AC = 12$ cm，$\\angle BAC = 60^\\circ$。\n(a) 求 $BC$ 的長度（準確至三位有效數字）。\n(b) 求 $\\triangle ABC$ 的面積（準確至三位有效數字）。","explanation":"本題考核餘弦定理與三角形面積公式。常見扣分位有二：其一是誤用正弦定理 —— 已知兩邊及其夾角時，正弦定理無法直接求出第三邊；其二是計算器仍設定為弳度（radian）模式，導致 $\\cos 60^\\circ$ 得出錯誤數值。作答前應先確認計算器處於角度（degree）模式，此習慣可避免整條題目全錯。","type":"long","referenceAnswer":"(a) 由餘弦定理：\n$BC^2 = 9^2 + 12^2 - 2(9)(12)\\cos 60^\\circ = 81 + 144 - 216 \\times 0.5 = 225 - 108 = 117$。\n$BC = \\sqrt{117} \\approx 10.8$ cm。\n(b) 面積 $= \\dfrac{1}{2}(9)(12)\\sin 60^\\circ = 54 \\times \\dfrac{\\sqrt{3}}{2} \\approx 46.8$ cm$^2$。","markingScheme":"(a) M1 正確引用餘弦定理並代入夾角；A1 求得 $BC \\approx 10.8$ cm。\n(b) M1 使用面積公式 $\\dfrac{1}{2}ab\\sin C$；A1 求得約 46.8 cm$^2$。\n註：答案須依題示準確至三位有效數字；中途四捨五入導致最終答案偏差者，最多扣一分。","suggestedMinutes":8,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_07","topic":"統計","difficulty":"intermediate","question":"某班 8 名學生一次測驗的分數如下：\n$52,\\ 58,\\ 61,\\ 64,\\ 64,\\ 70,\\ 73,\\ 90$\n(a) 求該組數據的中位數及平均數。\n(b) 其後發現最高分一名學生的分數應為 68 而非 90。試指出更正後中位數與平均數各自的變化，並解釋為何兩者的變化幅度不同。","explanation":"本題考核集中趨勢量數的選取及其對極端值的敏感度，屬統計科的核心說理題型。常見失分並非計算錯誤，而是說理不足 —— 只寫「中位數不受極端值影響」而未解釋原因，通常只能取得一半說理分。完整的解釋必須指出：中位數由排序位置決定，平均數由總和決定，兩者的定義差異才是敏感度不同的根源。","type":"long","referenceAnswer":"(a) 數據已由小至大排列，共 8 個。\n中位數 $= \\dfrac{64 + 64}{2} = 64$。\n平均數 $= \\dfrac{52 + 58 + 61 + 64 + 64 + 70 + 73 + 90}{8} = \\dfrac{532}{8} = 66.5$。\n(b) 更正後數據為 $52,\\ 58,\\ 61,\\ 64,\\ 64,\\ 68,\\ 70,\\ 73$。\n中位數仍為 $\\dfrac{64 + 64}{2} = 64$，並無改變。\n平均數 $= \\dfrac{510}{8} = 63.75$，下降了 2.75。\n原因：中位數只取決於數據排序後中間位置的數值，最大值由 90 改為 68 後，其排序位置仍在中間兩項之後，故中間兩項不變，中位數亦不變。平均數則由所有數值共同決定，任何一項改變都會直接影響總和，因此對極端值敏感。","markingScheme":"(a) A1 中位數 64；M1 正確列出總和除以項數；A1 平均數 66.5。\n(b) A1 指出中位數不變；A1 求得更正後平均數 63.75；L1 說明中位數只取決於中間位置的數值；L1 說明平均數由所有數值共同決定，故對極端值敏感。\n註：(b) 的解釋部分須同時觸及「位置」與「總和」兩個概念方可取得全部說理分。","suggestedMinutes":9,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_08","topic":"圓的幾何特性","difficulty":"intermediate","question":"在圓 $O$ 中，$AB$ 為直徑，$C$ 為圓周上一點（$C$ 不與 $A$、$B$ 重合），且 $\\angle CAB = 34^\\circ$。\n(a) 求 $\\angle ACB$，並說明理由。\n(b) 求 $\\angle ABC$。\n(c) 若 $AB = 20$ cm，求 $BC$ 的長度（準確至三位有效數字）。","explanation":"本題考核「角在半圓」這一圓的幾何特性，並將其與三角比結合。(a) 部分的關鍵在於必須寫出理由 —— 香港中學文憑試的幾何題慣例是「有理由方有分」，只填數值會失去說理分。(c) 部分的常見錯誤是把 $BC$ 當作鄰邊而使用餘弦：由於 $\\angle CAB$ 與 $BC$ 相對，$BC$ 是 $\\angle CAB$ 的對邊，故應使用正弦。作答前先標示斜邊與對邊，可有效避免此類混淆。","type":"long","referenceAnswer":"(a) $\\angle ACB = 90^\\circ$。理由：半圓上的圓周角為直角（角在半圓）。\n(b) 三角形內角和為 $180^\\circ$，故 $\\angle ABC = 180^\\circ - 90^\\circ - 34^\\circ = 56^\\circ$。\n(c) 在直角三角形 $ACB$ 中，$\\angle ACB = 90^\\circ$，$AB$ 為斜邊。\n$BC = AB \\sin(\\angle CAB) = 20 \\sin 34^\\circ \\approx 11.2$ cm。","markingScheme":"(a) A1 求得 $90^\\circ$；L1 引用正確理由「角在半圓」。\n(b) A1 求得 $56^\\circ$。\n(c) M1 辨認 $AB$ 為斜邊並選用正確的三角比；A1 求得約 11.2 cm。\n註：(a) 只寫數值而未列理由者，不得 L1；理由須為圓的幾何性質，寫「因為看似直角」不予給分。","suggestedMinutes":8,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_09","topic":"對數與指數","difficulty":"hard","question":"已知 $\\log_3 x + \\log_3 (x - 2) = 1$。\n(a) 解此方程。\n(b) 說明為何在 (a) 的解答過程中，必須檢驗所得的根是否可取，並指出哪一個根須予捨棄及其理由。","explanation":"本題考核對數運算法則及定義域意識，屬拉分題。核心陷阱在於：把兩個對數合併成一個的運算並非等價變換 —— 原方程要求 $x > 2$，合併後的二次方程卻對此毫無記錄，於是產生了 $x = -1$ 這個增根。多數考生能順利解出兩根，卻在未經檢驗下同時寫出兩個答案而失分。(b) 部分要求考生把這種「為何必須檢驗」的意識明確表達出來，正是區分「懂運算」與「懂概念」的位置。","type":"long","referenceAnswer":"(a) 由對數的積法則：$\\log_3\\left[x(x - 2)\\right] = 1$。\n故 $x(x - 2) = 3^1 = 3$，即 $x^2 - 2x - 3 = 0$。\n$(x - 3)(x + 1) = 0$，得 $x = 3$ 或 $x = -1$。\n檢驗：當 $x = -1$ 時，$\\log_3(-1)$ 無定義，故捨棄。\n當 $x = 3$ 時，$\\log_3 3 + \\log_3 1 = 1 + 0 = 1$，成立。\n故 $x = 3$。\n(b) 對數 $\\log_a N$ 只在 $N > 0$ 時有定義。把兩個對數合併為一個的一刻，原式對 $x > 0$ 及 $x - 2 > 0$ 的限制便不再顯現於方程之中，因此合併後的二次方程可能產生原式並不容許的根。$x = -1$ 同時令 $x$ 與 $x - 2$ 為負，兩個對數皆無定義，故必須捨棄。","markingScheme":"(a) M1 正確運用對數積法則合併；M1 化為指數形式並列出二次方程；A1 解得兩根；A1 檢驗後取 $x = 3$。\n(b) L1 指出對數只在真數為正時有定義；L1 指出合併對數會令定義域限制消失；L1 明確指出 $x = -1$ 須捨棄及其理由。\n註：(a) 若考生直接寫 $x = 3$ 而全無檢驗步驟，最多扣一分。","suggestedMinutes":11,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_long_b1_10","topic":"概率","difficulty":"hard","question":"一個袋內有 5 個紅球及 3 個藍球。從袋中不放回地連續抽出兩球。\n(a) 求兩球同色的概率。\n(b) 求第二球為紅球的概率。\n(c) 有同學認為「因為第一次抽球會改變袋內的組成，所以第二球為紅球的概率必然不等於第一球為紅球的概率」。試評論此說法是否正確，並解釋你的理由。","explanation":"本題考核不放回抽樣下的全概率計算，以及條件概率與無條件概率的區分。(c) 部分的說法之所以極具迷惑性，是因為它的前半句完全正確 —— 袋內組成的確改變了 —— 但由此推出的結論卻不成立。真正的關鍵在於是否已觀察到第一球的結果：未觀察時，各球位置對稱，第二球為紅的概率與第一球相同；已觀察時，才進入條件概率的範疇。此題設計為「半對半錯」的說理陷阱，正是為了迫使考生把兩種概率明確分開處理。","type":"long","referenceAnswer":"(a) $P(\\text{兩球同紅}) = \\dfrac{5}{8} \\times \\dfrac{4}{7} = \\dfrac{20}{56}$。\n$P(\\text{兩球同藍}) = \\dfrac{3}{8} \\times \\dfrac{2}{7} = \\dfrac{6}{56}$。\n$P(\\text{同色}) = \\dfrac{20 + 6}{56} = \\dfrac{26}{56} = \\dfrac{13}{28}$。\n(b) 分兩種情況：\n第一球為紅：$\\dfrac{5}{8} \\times \\dfrac{4}{7} = \\dfrac{20}{56}$。\n第一球為藍：$\\dfrac{3}{8} \\times \\dfrac{5}{7} = \\dfrac{15}{56}$。\n$P(\\text{第二球為紅}) = \\dfrac{20 + 15}{56} = \\dfrac{35}{56} = \\dfrac{5}{8}$。\n(c) 該說法不正確。第二球為紅球的概率為 $\\dfrac{5}{8}$，與第一球為紅球的概率相同。第一次抽球確實改變了袋內的組成，但在未觀察第一球結果的前提下，第二球屬於哪一顆球是完全對稱的 —— 每一顆球被抽作第二球的機會均等，而 8 顆球中有 5 顆為紅，故概率仍為 $\\dfrac{5}{8}$。該說法混淆了「條件概率」與「無條件概率」：已知第一球為紅時，第二球為紅的概率確為 $\\dfrac{4}{7}$，並不等於 $\\dfrac{5}{8}$；但若第一球結果未知，則兩者相等。","markingScheme":"(a) M1 分別計算兩球同紅及同藍的概率；A1 求得 $\\dfrac{13}{28}$。\n(b) M1 分兩種情況討論第一球顏色；M1 正確加總；A1 求得 $\\dfrac{5}{8}$。\n(c) A1 指出說法不正確；L1 指出第二球為紅的概率仍為 $\\dfrac{5}{8}$；L1 以對稱性或全概率說明理由；L1 明確區分條件概率 $\\dfrac{4}{7}$ 與無條件概率 $\\dfrac{5}{8}$。\n註：(c) 只寫「不正確」而無理由者不予給分；能指出兩者屬不同概率概念方可取得全部說理分。","suggestedMinutes":11,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "math";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  const out = { _meta: { source: "math-long-batch-1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Date().toISOString().slice(0,10) }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "math-long-batch-1.decisions.json"; a.click();
});
counts();
