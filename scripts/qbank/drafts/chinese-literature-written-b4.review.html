const DATA = [{"id":"clit_w4_01","topic":"先秦兩漢文學","difficulty":"basic","question":"《詩經》多用重章疊句，同一章節僅更換數字而反覆吟詠。試指出此一手法的兩項作用。","explanation":"答案須指出作用，而非只描述形式。常見失分是答「令詩歌好記」而止步 —— 易記是結果，須進一步說明重複與變字之間的關係如何產生意義。","type":"text","referenceAnswer":"作用一：以變字處推進情感或時序。\n各章格式相同，讀者的注意力自然集中於更換了的那幾個字。作者藉此逐層加深情感，或標示季節推移、距離遠近、程度輕重。形式上的不變，反而令變動處格外顯眼。\n作用二：形成迴環往復的節奏，配合歌唱。\n《詩經》本為樂歌，重章便於合樂與應和，眾人唱和之時，重複部分令參與者易於接續，而變動部分維持新意。節奏上的迴環亦使情感如浪推進，不致一次傾瀉而盡。\n（其他可接受的作用：藉反覆強化主旨，令感情顯得纏綿不絕；重複為口耳相傳提供便利，有助作品在文字書寫未普及時流傳。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_w4_02","topic":"唐詩","difficulty":"basic","question":"唐代律詩講求對仗。試說明對仗除了形式整齊之外，在表達上可以發揮的兩項功能。","explanation":"題目已排除「形式整齊」這一答案，故須從意義層面作答。高分答案會指出對仗可以並置兩種事物而不必明言其關係，讓讀者自行連繫。","type":"text","referenceAnswer":"功能一：並置兩事而不加說明，由讀者自行接合。\n對仗的上下句位置對等、詞性相對，讀者會自然把兩句放在一起比較。詩人因而可以只呈現兩幅畫面 —— 例如遠景與近景、他人與自身 —— 而不必寫出「因此」「然而」一類連接詞。關係由結構本身提示，語氣比直接議論含蓄。\n功能二：藉工整的形式承載強烈的內容，形成張力。\n對仗要求句式嚴整，而所寫之事可能是離亂、衰老或死別。愈是整齊的形式，愈顯出情感被約束，讀者感受到的不只是悲，還有克制。若改以散句直陳，情緒外露，反而失去這一層力量。\n（其他可接受的功能：對比兩種境況以凸顯落差；藉相近句式反覆申說同一事理，使論點更為周密。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_w4_03","topic":"宋詞","difficulty":"intermediate","question":"詞須依調填寫，句式長短不一。試說明長短句相對於整齊的五、七言，在抒情上有何優勢。","explanation":"本題須作比較，只稱讚長短句而不提整齊句式者，未完成題目要求。答案宜落在【節奏與語氣的貼合】之上，並可指出長短句亦有其限制，以示分寸。","type":"text","referenceAnswer":"優勢一：節奏可以隨情緒起伏而變化。\n整齊的五、七言每句長度固定，誦讀的停頓位置亦大致固定，語氣因而較為均勻。長短句則可在一句之內忽長忽短：短句急促，宜寫驚覺、頓悟或哽咽；長句舒緩，宜寫綿延的思念或景物的鋪展。情緒轉折之處，形式可以同步轉折。\n優勢二：更接近說話的自然語氣。\n長短參差本來就是口語的樣態。詞中常見的三字句、領字，以及句末的虛詞，令語氣近似低聲自語，親切而不莊重。此一語氣正合乎詞體多寫私情、閨怨、離別的內容。\n須補充的限制：詞須依調，每調的句式、字數與平仄早已規定，作者實際上是在既定框架內選擇，而非自由分行。所謂靈活，是【調與調之間】選擇的靈活，以及同一調內用字的靈活，並非全無約束。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_w4_04","topic":"元曲戲劇","difficulty":"intermediate","question":"元雜劇的曲辭中常見口語詞彙與市井事物，與詩詞的典雅語言不同。試說明此一語言取向與雜劇的演出性質有何關係。","explanation":"本題要求把語言特徵連繫到演出條件，答案若只指出「較為通俗」而不解釋原因，即未觸及核心。須考慮觀眾構成、一次過的聽覺接收、以及演出場地等因素。","type":"text","referenceAnswer":"關係一：觀眾當場一次過聽畢，無從回看。\n讀詩可以停下細想，遇上僻典可以查考；看戲則不能。曲辭一旦唱過即消失，觀眾必須即時聽懂。使用口語詞彙與常見事物，是確保意思在第一次聽到時就能傳達的必要條件。過於典雅或用典密集的句子，在舞台上等同無效。\n關係二：觀眾來自市井，並非只有讀書人。\n雜劇在勾欄瓦舍演出，聽眾包括商販、工匠、婦孺。作品若以士人的語言與趣味為準，便會失去大部分觀眾。取材於市井生活的比喻與器物，使不同階層的人都能接上。\n關係三：語言本身即人物塑造的手段。\n雜劇人物身分各異，語言必須隨身分而變。市井人物說市井話，才顯得是真人；若一律使用典雅語言，人物之間便失去區別。口語入曲，因而不只是遷就觀眾，亦是戲劇技術上的要求。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_w4_05","topic":"文學鑑賞","difficulty":"intermediate","question":"評賞作品時，有學生習慣先判定作者的生平遭遇，再據此解釋作品。試指出此一做法的一項合理之處與兩項風險。","explanation":"本題須三部分俱全。風險部分是重點：知人論世本身有其傳統，但若把作品化約為生平的註腳，則評賞失去對象。答案宜指出循環論證的問題。","type":"text","referenceAnswer":"合理之處：作品產生於特定處境，作者的經歷、所處時代與寫作緣由，往往能解釋作品中若干費解之處，例如為何反覆書寫某一主題，或為何對某類事物格外敏感。適度參照，可避免把作品讀成憑空之作。\n風險一：以生平剪裁作品，形成循環論證。\n若先認定作者一生失意，便容易把每一句都讀成牢騷，連寫景、寫友朋的段落也一併歸入。如此一來，作品不再能提供新的資訊 —— 讀者所得，只是自己原先已設定的結論。判斷變成不可能被推翻，即失去評賞的意義。\n風險二：忽略文學創作中的虛構與代言。\n作者可以代人立言，可以模擬他人口吻，亦可以寫並未親歷之事。把作品中的「我」一律等同作者本人，會誤讀大量作品。尤以詩詞中的閨怨、邊塞題材為然，作者往往並非當事人。\n（其他可接受的風險：生平資料本身未必可靠，後世附會甚多；過度倚賴背景，會令讀者忽略文本的語言與結構。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_w4_06","topic":"詩詞鑑賞・手法與意境","difficulty":"intermediate","question":"詩詞常以景語作結，不直接說明情感。試說明此一收結方式的效果，並指出評賞時須注意甚麼，方不致流於臆測。","explanation":"第二問是本題的分辨點。以景結情容易引發過度解讀 —— 讀者可以把任何情感投射到景物之上。答案須提出可供檢驗的依據，例如景物與前文的呼應。","type":"text","referenceAnswer":"效果：\n其一，情感不被說盡，餘味得以延長。作者若直言「我甚悲傷」，讀者接收一個結論即告終；改以景物作結，讀者須自行體會，感受因而在閱讀之後仍然持續。\n其二，景物承載情感，使抽象之情有可感的形體。月色、流水、落葉本身並無情緒，但置於通篇脈絡之末，即被賦予意味。此一手法令情感可見、可觸，而非只是陳述。\n其三，留白使不同讀者各有所得，作品的適用範圍因而擴大。\n評賞時須注意：\n其一，所指的情感必須與前文有承接關係。若全詩寫送別，結句的「江水東流」方可讀為別情之綿長；若前文並無此意，同一句便不能如此解讀。景語的意義由上下文賦予，不能孤立推斷。\n其二，須顧及景物本身的特徵。以「殘燈」結尾與以「朝陽」結尾，即使前文相同，語氣亦必不同。忽略景物的具體性質而空談意境，即屬臆測。\n其三，寧可承認多義，不可強作定論。若文本確實容許兩種讀法，指出其並存比硬定一說更為誠實。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_w4_07","topic":"風格比較・婉約與豪放","difficulty":"hard","question":"有論者把宋詞分為婉約與豪放兩派。試評論此一分法的作用與局限。","explanation":"本題要求評論分類本身，而非比較兩派作品。高分答案須指出：分類是後人為便於討論而設的工具，其價值在於提供比較的起點，其危險在於被當成作者的固定屬性。","type":"text","referenceAnswer":"分法的作用：\n其一，提供比較的座標。面對數量龐大的作品，先行分出兩類，讀者可以就題材、語言、節奏、情感強度等方面作系統對照，而不必逐首孤立處理。\n其二，凸顯詞體的擴展過程。詞原以寫男女之情、離別之思為主，其後題材擴及懷古、議論、邊事，此一分法把該項轉變標示出來，令文學史的線索清晰。\n其三，便於教學與入門。初學者藉此建立最初的判別能力，再逐步發現例外。\n局限：\n其一，以作者為單位分派，與實際作品不符。同一作者往往兼寫兩類：以豪放著稱者亦有極細膩的悼亡與閨情之作；以婉約著稱者亦有感時憂國之篇。把作者整體歸入一派，會令這些作品在討論中失去位置。\n其二，二分法排除了中間地帶。大量作品既不激昂亦不纖巧，或在同一首之內兼具兩種格調，此類作品在二分框架下無處安放，遂被視為「不典型」而受忽略。\n其三，容易由描述滑向評價。討論中常出現以一派為正宗、另一派為別調的傾向，但這是後人的取捨，並非作品本身的高下。\n其四，標籤會反過來限制閱讀。一旦預期某位作者豪放，讀者便傾向注意符合預期的作品，不符者被視為偶然，於是分類自我證成。\n結論：此一分法宜視為討論的起點而非結論。用以提出問題，如「此作何以不易歸類」，其價值最大；用以替作者貼上固定標籤，則反而遮蔽作品。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_w4_08","topic":"明清小說","difficulty":"hard","question":"明清長篇小說多由說書發展而來，保留了說書的痕跡，例如章回體例與敘述者的插話。試評論這些痕跡對現代讀者而言是負擔還是資源。","explanation":"題目設定為二擇一的評論，但最佳答案不必選邊，而應分辨在何種閱讀目的之下各自成立。若只單方面指出「影響流暢」或「別具風味」，論證皆嫌單薄。","type":"text","referenceAnswer":"視為負擔的理由：\n其一，敘述者插話打斷情節。說書人原須提醒聽眾前情、評點人物、預告下回，這些在現場有其功能；落成文字之後，讀者本可自行翻閱，插話遂成為多餘的干擾，並且往往先行給出評價，減損讀者自行判斷的餘地。\n其二，章回的固定套語造成重複。每回結尾以懸念收束、下回開首重述前事，在連續閱讀時顯得拖沓。\n其三，以韻文穿插描寫人物與場景，句式程式化，人物形象因而趨同。\n視為資源的理由：\n其一，章回提供天然的閱讀單位。長篇動輒百回，分回令讀者有明確的停頓點，反而便於現代零散時間的閱讀。\n其二，敘述者的存在造就獨特的敘事層次。當敘述者的評價與情節所示不符，讀者即察覺兩者之間的距離，這一距離本身可以產生反諷，是純粹客觀敘述所沒有的資源。\n其三，套語與韻文保存了說唱的節奏感，是該類作品的文體特徵，剷除之後作品即失去其面目。\n結論：判斷取決於閱讀目的。若求情節緊湊，這些痕跡確屬障礙；若把作品視為特定文體的產物，則它們是理解該文體的入口。更穩妥的說法是：它們既非純粹負擔，亦非自動成為資源，而是需要讀者調整閱讀方式之後，才顯出其作用。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "chinese-literature-written-b4.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "chinese-literature-written-b4.decisions.json"; a.click();
});
counts();
</script></body></html>
