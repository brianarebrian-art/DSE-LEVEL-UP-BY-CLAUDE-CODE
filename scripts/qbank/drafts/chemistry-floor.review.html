<script>
const DATA = [{"id":"chem_floor_01","topic":"氧化還原與平衡","difficulty":"basic","question":"在氧化還原反應中，一種物質被「氧化」，指的是甚麼？","options":["該物質失去電子，氧化數上升","該物質得到電子，氧化數下降","該物質與氧結合，氧化數不變","該物質的質量在反應後減少"],"correctIndex":0,"explanation":"氧化的現代定義是失去電子，還原則是得到電子，兩者必定同時發生。失電子之後，該原子所帶的正電荷增加，因此氧化數上升。要留意「氧化」一詞源於與氧結合，但現今的定義已擴展至不涉及氧的反應——例如鈉與氯化合成氯化鈉，鈉被氧化而全程沒有氧參與。記憶方法可用「失電子氧化、得電子還原」：失去的一方氧化數升，得到的一方氧化數降。至於質量，反應前後遵守質量守恆，不能作為判斷依據。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_02","topic":"氧化還原與平衡","difficulty":"basic","question":"單質（游離態元素，例如 $O_2$、$Fe$、$Cl_2$）中，該元素的氧化數是多少？","options":["0","$+1$","$-1$","視乎該元素而定"],"correctIndex":0,"explanation":"任何元素以單質形式存在時，氧化數一律為 0，因為分子中的原子完全相同，電子並無偏向任何一方。這條規則適用於單原子（如 $Fe$、$Cu$）與雙原子分子（如 $O_2$、$H_2$、$Cl_2$）。它是判斷氧化還原的起點：例如鐵生鏽，$Fe$ 由 0 升至 $+3$，即被氧化；而 $O_2$ 由 0 降至 $-2$，即被還原。留意氧在化合物中通常是 $-2$，但在單質 $O_2$ 中是 0，在過氧化氫中則是 $-1$——所以必須先看該元素以甚麼形式存在，才套用規則。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_03","topic":"氧化還原與平衡","difficulty":"basic","question":"化學平衡的「動態」性質，最準確的意思是甚麼？","options":["正逆反應仍在進行，速率相等","正逆反應都已完全停止進行","反應物與生成物的濃度必定相等","反應只會朝生成物方向繼續進行"],"correctIndex":0,"explanation":"達到平衡時，正反應與逆反應都沒有停止，只是兩者的速率相等，因此各物質的濃度不再變化。這正是「動態」二字的意思：表面靜止，微觀上仍在進行。要分清兩個常見誤解。其一，平衡不等於反應停止——若用同位素標記反應物，仍可在生成物中檢出，證明反應仍在進行。其二，平衡不等於濃度相等——各物質的濃度只是保持不變，數值可以相差很遠，具體取決於平衡常數。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_04","topic":"氧化還原與平衡","difficulty":"intermediate","question":"在高錳酸根離子 $MnO_4^-$ 中，錳 $Mn$ 的氧化數是多少？（$O$ 為 $-2$）","options":["$+7$","$+5$","$+2$","$-1$"],"correctIndex":0,"explanation":"多原子離子中，各原子氧化數的總和等於該離子的電荷。設錳為 $x$，四個氧各為 $-2$，總電荷為 $-1$：$x + 4(-2) = -1$，即 $x - 8 = -1$，所以 $x = +7$。$+5$ 是把總電荷誤當成 $+1$；$+2$ 是錳在 $Mn^{2+}$ 中的氧化數，並非本題；$-1$ 是整個離子的電荷而非錳的氧化數。這一步是計算氧化還原方程式配平的基礎——高錳酸鉀在酸性條件下由 $+7$ 降至 $+2$，共得 5 個電子，正是滴定計算的關鍵數字。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_05","topic":"氧化還原與平衡","difficulty":"intermediate","question":"在反應 $Zn + Cu^{2+} \\rightarrow Zn^{2+} + Cu$ 之中，哪一種物質是氧化劑？","options":["$Cu^{2+}$，它得到電子而被還原","$Zn$，它失去電子而被氧化","$Zn^{2+}$，它是反應的生成物","$Cu$，它是被析出的金屬"],"correctIndex":0,"explanation":"氧化劑是使別人被氧化的物質，而它自己必定被還原。$Cu^{2+}$ 由 $+2$ 降至 0，得到電子被還原，所以它是氧化劑；$Zn$ 由 0 升至 $+2$，失去電子被氧化，所以它是還原劑。這一對名稱最易記錯，因為直覺會把「被氧化的」當成氧化劑。可用一句話固定下來：氧化劑自己被還原，還原劑自己被氧化。至於 $Zn^{2+}$ 與 $Cu$ 都是生成物，反應中並無角色可言——判斷氧化劑與還原劑，永遠看反應物一邊。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_06","topic":"氧化還原與平衡","difficulty":"intermediate","question":"對於已達平衡的反應 $N_2 + 3H_2 \\rightleftharpoons 2NH_3$，若在恆溫下增加系統的壓力，平衡會如何移動？","options":["向右移動，因右方氣體莫耳數較少","向左移動，因左方氣體莫耳數較少","不移動，因壓力不影響平衡位置","不移動，因兩方的莫耳數本來相同"],"correctIndex":0,"explanation":"按勒沙特列原理，系統受壓力增加，平衡會朝氣體莫耳數較少的一方移動，以抵消壓力上升。左方為 $1 + 3 = 4$ 莫耳氣體，右方為 2 莫耳，所以平衡向右移動，氨的產量增加。這正是工業合成氨採用高壓的原因。要留意這條規則只適用於兩方氣體莫耳數不同的反應；若兩方相等，壓力改變便不會令平衡移動。另外，壓力增加會同時加快正逆反應的速率，令系統更快達到新的平衡，但決定移動方向的仍然是莫耳數的比較。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_07","topic":"氧化還原與平衡","difficulty":"intermediate","question":"向一個已達平衡的可逆反應加入催化劑，會產生甚麼效果？","options":["平衡位置不變，只是更快達到平衡","平衡向生成物方向移動，產率上升","平衡向反應物方向移動，產率下降","平衡常數的數值會隨之而上升"],"correctIndex":0,"explanation":"催化劑同等程度地降低正反應與逆反應的活化能，因此兩個方向的速率都加快，而且加快的倍數相同。既然正逆速率相等的那一點沒有改變，平衡位置與平衡常數都保持不變，改變的只是達到平衡所需的時間。這一點在工業上仍然十分重要：合成氨用鐵催化劑，並非為了提高產率，而是令反應在可接受的時間內達到平衡。要改變平衡位置，必須改變濃度、壓力或溫度；其中只有溫度會改變平衡常數的數值。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_08","topic":"氧化還原與平衡","difficulty":"intermediate","question":"對於已達平衡的反應 $A + B \\rightleftharpoons C + D$，若移走部分生成物 $C$，平衡會如何反應？","options":["向右移動，以補充被移走的 $C$","向左移動，以減少 $C$ 的生成量","不移動，因移走的只是生成物","反應立即停止，不再有任何變化"],"correctIndex":0,"explanation":"按勒沙特列原理，系統會朝抵消外來改變的方向移動。移走 $C$ 令生成物一方的濃度下降，平衡便向右移動以補回 $C$，同時消耗更多 $A$ 與 $B$。這個原理在工業上被主動運用：持續抽走生成物，可以令反應不斷向右進行，把產率推高至遠超一次平衡所能達到的水平，合成氨中把氨液化抽走正是此法。要留意平衡移動並不會把 $C$ 完全補回原來的濃度，只會部分抵消——「抵消」不等於「還原至原狀」，這是勒沙特列原理常被誇大的一點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_09","topic":"有機化學（高階）","difficulty":"basic","question":"烷烴（alkanes）的通式是甚麼？","options":["$C_nH_{2n+2}$","$C_nH_{2n}$","$C_nH_{2n-2}$","$C_nH_{n+2}$"],"correctIndex":0,"explanation":"烷烴是飽和烴，碳與碳之間全為單鍵，每個碳原子上的其餘價位都接氫，因此含氫量最高，通式為 $C_nH_{2n+2}$。驗證方法是代入：$n = 1$ 得 $CH_4$，$n = 2$ 得 $C_2H_6$，$n = 3$ 得 $C_3H_8$，全部正確。$C_nH_{2n}$ 是烯烴（含一個雙鍵）或環烷烴的通式；$C_nH_{2n-2}$ 是炔烴（含一個三鍵）的通式。三者相差的氫數正好反映不飽和度：每多一個雙鍵或一個環，就少 2 個氫。記住這個規律，遇上未見過的分子式亦可推斷其可能結構。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_10","topic":"有機化學（高階）","difficulty":"basic","question":"官能團 $-OH$ 屬於哪一類有機化合物？","options":["醇（alcohol）","羧酸（carboxylic acid）","酯（ester）","醛（aldehyde）"],"correctIndex":0,"explanation":"羥基 $-OH$ 接在碳鏈上即構成醇，例如乙醇 $C_2H_5OH$。羧酸的官能團是羧基 $-COOH$，當中同時含有 $-OH$，但必須連同羰基一併看，不能單以 $-OH$ 判定；酯的官能團是 $-COO-$；醛的官能團是 $-CHO$。辨認官能團是有機化學的入手處：同一類官能團的化合物有相似的化學性質，例如所有醇都可以被氧化，所有羧酸都能與醇發生酯化。答題時應先圈出官能團，再推該類物質的典型反應，比逐條記憶個別化合物的性質可靠得多。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_11","topic":"有機化學（高階）","difficulty":"basic","question":"分子式為 $C_3H_8$ 的烷烴，其名稱是甚麼？","options":["丙烷（propane）","乙烷（ethane）","丁烷（butane）","甲烷（methane）"],"correctIndex":0,"explanation":"烷烴的命名按碳原子數目：一個碳為甲烷 $CH_4$，兩個為乙烷 $C_2H_6$，三個為丙烷 $C_3H_8$，四個為丁烷 $C_4H_{10}$，其後為戊、己、庚、辛。$C_3H_8$ 含三個碳，故為丙烷，同時可驗證是否符合通式：$2n + 2 = 2(3) + 2 = 8$，與分子式相符。英文命名的前綴 meth-、eth-、prop-、but- 對應同一組數字，之後才是規律的 pent-、hex-。這組前綴在所有有機物命名中重複出現，包括醇與羧酸，值得一次過記牢。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_12","topic":"有機化學（高階）","difficulty":"intermediate","question":"乙烯 $C_2H_4$ 與溴 $Br_2$ 的反應，與乙烷 $C_2H_6$ 和溴在光照下的反應，其類型分別是甚麼？","options":["前者為加成反應，後者為取代反應","前者為取代反應，後者為加成反應","兩者同屬加成反應，速率不同","兩者同屬取代反應，條件不同"],"correctIndex":0,"explanation":"乙烯含碳碳雙鍵，雙鍵可以打開並在兩端各接一個溴原子，生成 $C_2H_4Br_2$，過程中沒有原子被取代，屬加成反應，而且在常溫下即可迅速進行，溴水褪色正是此反應的現象。乙烷是飽和烴，沒有可打開的雙鍵，溴只能在紫外光引發下取代其中一個氫，生成 $C_2H_5Br$ 並放出 $HBr$，屬取代反應，且需要光照條件。分辨兩者的關鍵在於是否有雙鍵：飽和只能取代，不飽和才可加成。這亦解釋了為何溴水可用作檢驗不飽和度的試劑。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_13","topic":"有機化學（高階）","difficulty":"intermediate","question":"分子式為 $C_3H_8O$ 的化合物，若只計醇類（不計醚），其結構異構體共有多少個？","options":["2 個","1 個","3 個","4 個"],"correctIndex":0,"explanation":"三個碳原子只能排成一條直鏈，羥基 $-OH$ 的位置有兩種選擇：接在末端碳上得丙-1-醇，接在中間碳上得丙-2-醇。因此醇類異構體共有 2 個。答 1 個是漏了羥基位置的差異；答 3 個或 4 個多數是把甲氧基乙烷等醚類一併計入，但題目已明言不計醚。這一題示範了寫異構體的固定次序：先定碳骨架（直鏈與支鏈），再逐一移動官能團的位置，最後檢查有沒有重複——同一個結構由不同方向數過去仍是同一個，這是最常見的重複計算來源。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_14","topic":"有機化學（高階）","difficulty":"intermediate","question":"乙醇在酸性重鉻酸鉀溶液中被完全氧化，最終產物是甚麼？","options":["乙酸（$CH_3COOH$）","乙醛（$CH_3CHO$）","乙烯（$C_2H_4$）","乙烷（$C_2H_6$）"],"correctIndex":0,"explanation":"初級醇的氧化分兩步：先被氧化成醛，醛再被氧化成羧酸。乙醇先變乙醛，乙醛再變乙酸。題目說明「完全氧化」，即進行至最後一步，所以產物是乙酸。若要停在乙醛，實驗上須採用蒸餾裝置把沸點較低的乙醛即時蒸出，令它未及進一步氧化；若採用回流裝置，產物則會是乙酸。反應現象是橙色的重鉻酸根 $Cr_2O_7^{2-}$ 轉為綠色的 $Cr^{3+}$，可用以判斷氧化是否發生。乙烯與乙烷都不是氧化產物——生成乙烯屬脫水反應，需要濃硫酸而非氧化劑。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_15","topic":"有機化學（高階）","difficulty":"intermediate","question":"乙酸與乙醇在濃硫酸催化下加熱，會發生哪一類反應？主要產物是甚麼？","options":["酯化反應，生成乙酸乙酯與水","中和反應，生成鹽與水","加成反應，生成一個較大分子","取代反應，生成氯乙烷與水"],"correctIndex":0,"explanation":"羧酸與醇在濃硫酸催化下加熱，發生酯化反應，生成酯與水。乙酸與乙醇生成乙酸乙酯 $CH_3COOC_2H_5$，並脫去一分子水。濃硫酸在此有兩個作用：既作催化劑加快反應，亦吸收生成的水而令平衡向右移動、提高產率。酯化是可逆反應，即使延長時間亦不能完全轉化，這是它與中和反應的重要分別——中和進行得快而完全。產物的氣味常被描述為果香，是實驗上判斷酯已生成的線索之一。反應中並無氯參與，亦沒有雙鍵可加成。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_16","topic":"有機化學（高階）","difficulty":"intermediate","question":"要檢驗一個未知的液態烴是否含有碳碳雙鍵，下列哪一項是最直接可行的測試？","options":["加入溴水，觀察橙色會否褪去","加入石蕊試紙，觀察顏色的變化","量度其沸點，與已知數值比較","點燃樣品，觀察火焰的明亮程度"],"correctIndex":0,"explanation":"含碳碳雙鍵的烴會與溴發生加成反應，把溴消耗掉，因此橙色的溴水會迅速褪色；飽和烴在同樣條件下不反應，顏色維持不變。這個測試現象明顯、器材簡單，是課程指定的不飽和度檢驗。石蕊試紙檢驗的是酸鹼性，烴類本身既非酸亦非鹼，不會有變化。沸點雖可協助辨認特定物質，但不同物質沸點可以相近，並非針對雙鍵的測試。燃燒時不飽和烴確實因含碳比例較高而火焰較明亮並帶煙，但這只是輔助觀察，明亮程度難以量化，不及溴水測試直接可靠。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_17","topic":"定量計算（高階）","difficulty":"basic","question":"$36\\,\\text{g}$ 水 $H_2O$（$M = 18\\,\\text{g mol}^{-1}$）的物質的量是多少？","options":["$2\\,\\text{mol}$","$0.5\\,\\text{mol}$","$18\\,\\text{mol}$","$648\\,\\text{mol}$"],"correctIndex":0,"explanation":"物質的量等於質量除以摩爾質量：$n = m \\div M = 36 \\div 18 = 2\\,\\text{mol}$。$0.5\\,\\text{mol}$ 是把分子分母倒轉；$18\\,\\text{mol}$ 是誤把摩爾質量當成答案；$648\\,\\text{mol}$ 是相乘而非相除。這條關係式是全部定量計算的入口，其餘公式都由它延伸：濃度是每公升的物質的量，氣體體積是物質的量乘以莫耳體積，反應中各物質的量之比等於方程式的係數比。做較長的計算題時，建議先把所有已知量統一換算成物質的量，之後的步驟便只是按係數比例換算，出錯機會大減。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_18","topic":"定量計算（高階）","difficulty":"basic","question":"把 $0.25\\,\\text{mol}$ 氯化鈉溶於水並稀釋至 $500\\,\\text{cm}^3$，所得溶液的濃度是多少？","options":["$0.5\\,\\text{M}$","$0.125\\,\\text{M}$","$2\\,\\text{M}$","$125\\,\\text{M}$"],"correctIndex":0,"explanation":"濃度等於物質的量除以體積，而體積必須以公升為單位：$500\\,\\text{cm}^3 = 0.5\\,\\text{dm}^3$，所以 $c = 0.25 \\div 0.5 = 0.5\\,\\text{M}$。$0.125\\,\\text{M}$ 是相乘而非相除；$2\\,\\text{M}$ 是把分子分母倒轉；$125\\,\\text{M}$ 是忘記把 $\\text{cm}^3$ 換算成 $\\text{dm}^3$。單位換算是這一課最密集的失分位：$1\\,\\text{dm}^3 = 1000\\,\\text{cm}^3$，滴定題所給的體積幾乎一律以 $\\text{cm}^3$ 表示，而濃度的定義用 $\\text{dm}^3$，所以每一題都要換算一次。養成先寫單位再代數的習慣，可以自動避開這一類錯誤。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_19","topic":"定量計算（高階）","difficulty":"basic","question":"二氧化碳 $CO_2$ 的摩爾質量是多少？（$Ar$：$C = 12$，$O = 16$）","options":["$44\\,\\text{g mol}^{-1}$","$28\\,\\text{g mol}^{-1}$","$32\\,\\text{g mol}^{-1}$","$56\\,\\text{g mol}^{-1}$"],"correctIndex":0,"explanation":"摩爾質量等於分子中各原子相對原子質量的總和。$CO_2$ 含一個碳與兩個氧：$12 + 2(16) = 12 + 32 = 44\\,\\text{g mol}^{-1}$。$28\\,\\text{g mol}^{-1}$ 是只算了一個氧（$12 + 16$）；$32\\,\\text{g mol}^{-1}$ 是只算了兩個氧而漏掉碳；$56\\,\\text{g mol}^{-1}$ 是把碳誤算了兩次。計算時最容易漏掉的是下標所代表的倍數，尤其在較複雜的化學式如 $Ca(OH)_2$ 之中，括號外的下標要乘進括號內每一個原子——$40 + 2(16 + 1) = 74$，而不是 $40 + 16 + 1 \\times 2$。逐個原子數清楚再相加，是最穩妥的做法。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_20","topic":"定量計算（高階）","difficulty":"intermediate","question":"在室溫及標準大氣壓下，$0.25\\,\\text{mol}$ 氧氣所佔的體積是多少？（莫耳體積 $= 24\\,\\text{dm}^3\\,\\text{mol}^{-1}$）","options":["$6\\,\\text{dm}^3$","$96\\,\\text{dm}^3$","$24\\,\\text{dm}^3$","$0.01\\,\\text{dm}^3$"],"correctIndex":0,"explanation":"氣體體積等於物質的量乘以莫耳體積：$V = 0.25 \\times 24 = 6\\,\\text{dm}^3$。$96\\,\\text{dm}^3$ 是相除而非相乘；$24\\,\\text{dm}^3$ 是直接抄了莫耳體積；$0.01\\,\\text{dm}^3$ 是把 $0.25$ 除以 $24$。莫耳體積有一個重要特性：在相同溫度與壓力下，它與氣體的種類無關——$0.25\\,\\text{mol}$ 氧氣與 $0.25\\,\\text{mol}$ 氫氣所佔體積相同，儘管兩者質量相差 16 倍。這正是亞佛加德羅定律的內容，亦是氣體反應中可以直接用體積比代替莫耳比的原因。要留意 $24\\,\\text{dm}^3\\,\\text{mol}^{-1}$ 只適用於室溫，題目若指定其他條件便須改用所給數值。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_21","topic":"定量計算（高階）","difficulty":"intermediate","question":"$0.3\\,\\text{mol}$ 鎂與 $0.2\\,\\text{mol}$ 氧氣反應：$2Mg + O_2 \\rightarrow 2MgO$。哪一種是限量試劑？可生成多少 $MgO$？","options":["鎂為限量試劑，生成 $0.3\\,\\text{mol}$","氧氣為限量試劑，生成 $0.2\\,\\text{mol}$","氧氣為限量試劑，生成 $0.4\\,\\text{mol}$","鎂為限量試劑，生成 $0.6\\,\\text{mol}$"],"correctIndex":0,"explanation":"方程式顯示 $2\\,\\text{mol}$ 鎂需配 $1\\,\\text{mol}$ 氧氣。$0.3\\,\\text{mol}$ 鎂只需 $0.15\\,\\text{mol}$ 氧氣，而現有 $0.2\\,\\text{mol}$，氧氣有餘，因此鎂是限量試劑。生成的 $MgO$ 按鎂計算，比例為 $2:2$ 即 $1:1$，故得 $0.3\\,\\text{mol}$。判斷限量試劑的標準方法是把每種反應物的物質的量除以其係數，數值最小者即為限量：鎂 $0.3 \\div 2 = 0.15$，氧氣 $0.2 \\div 1 = 0.2$，前者較小。最常見的錯誤是直接比較物質的量而忽略係數——本題若只看 $0.3$ 大於 $0.2$ 便判氧氣為限量，答案就會相反。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_22","topic":"化學式與式量","difficulty":"intermediate","question":"某氧化物按質量計含 $70\\%$ 鐵與 $30\\%$ 氧（$Ar$：$Fe = 56$，$O = 16$）。其實驗式是甚麼？","options":["$Fe_2O_3$","$FeO$","$Fe_3O_4$","$FeO_2$"],"correctIndex":0,"explanation":"先假設樣品共 $100\\,\\text{g}$，則含鐵 $70\\,\\text{g}$、氧 $30\\,\\text{g}$。各自除以相對原子質量求物質的量：鐵 $70 \\div 56 = 1.25$，氧 $30 \\div 16 = 1.875$。再同除以較小者：鐵 $1.25 \\div 1.25 = 1$，氧 $1.875 \\div 1.25 = 1.5$。比例為 $1 : 1.5$，同乘 2 化為整數得 $2 : 3$，故實驗式為 $Fe_2O_3$。最後一步「同乘以整數」最易被略過——見到 $1.5$ 就四捨五入成 2，會得出錯誤的 $FeO_2$。凡比值出現 $.5$、$.33$、$.25$，應分別乘以 2、3、4 化為整數，而不是取近似值。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chem_floor_23","topic":"化學式與式量","difficulty":"hard","question":"硫酸銅晶體 $CuSO_4 \\cdot 5H_2O$ 中，結晶水佔總質量的百分比約為多少？（$Ar$：$Cu = 64$，$S = 32$，$O = 16$，$H = 1$）","options":["約 $36\\%$","約 $28\\%$","約 $56\\%$","約 $64\\%$"],"correctIndex":0,"explanation":"先分別求兩部分的式量。無水部分 $CuSO_4$：$64 + 32 + 4(16) = 64 + 32 + 64 = 160$。結晶水部分 $5H_2O$：$5 \\times (2 + 16) = 5 \\times 18 = 90$。晶體總式量為 $160 + 90 = 250$。結晶水百分比 $= 90 \\div 250 = 36\\%$。$64\\%$ 是無水部分的百分比，方向相反；$28\\%$ 是誤用 $\\cdot$ 之後只計一個水分子；$56\\%$ 是把分母誤作 $160$。這一題的關鍵在於看清 $\\cdot 5H_2O$ 這個寫法——圓點並非乘號，而是表示晶體中結合了 5 個水分子，計算式量時必須把它們全部計入。加熱這種晶體會失去結晶水，藍色轉為白色，質量減少的比例正好就是本題的答案，實驗上可用以驗證計算。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
