<script>
const DATA = [{"id":"ph_w2_01","topic":"壓強與密度","difficulty":"basic","question":"一個底面積為 0.02 m² 的長方體木塊，質量 6.0 kg，平放於水平桌面上。\n(a) 計算木塊對桌面的壓強。\n(b) 若把同一木塊側放，令接觸面積減半，壓強如何變化？請說明理由。","explanation":"本題的失分位不在算術，而在於混淆「力」與「壓強」。木塊側放後重量並無改變，改變的只是接觸面積；因此壓強與面積成反比，面積減半即壓強加倍。常見錯誤是答「壓強不變，因為木塊沒有變重」—— 這句話對「力」而言正確，對「壓強」而言錯誤，正正是題目要分辨的地方。另一常見扣分是漏寫單位：壓強的單位為 Pa（即 N m⁻²），只寫數字不得分。","type":"text","referenceAnswer":"(a) 重量 W = mg = 6.0 × 10 = 60 N。\n壓強 p = F / A = 60 ÷ 0.02 = 3 000 Pa（即 3.0 × 10³ Pa）。\n\n(b) 壓強加倍，變為 6 000 Pa。\n理由：重量不變（仍為 60 N），而 p = F / A 中面積 A 減半，故壓強加倍。必須明確指出「力不變、面積改變」這一組對比，只寫「面積細了所以壓強大了」而不點明重量不變，說理並不完整。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ph_w2_02","topic":"功與能量","difficulty":"intermediate","question":"一部升降機連乘客總質量 800 kg，由靜止開始以等加速度 1.5 m s⁻² 向上加速 4.0 s。\n(a) 求升降機此段時間內上升的距離。\n(b) 求纜索的拉力。\n(c) 求纜索在此 4.0 s 內對升降機所做的功。\n(d) 有學生答「纜索所做的功等於升降機所增加的重力勢能」。此說法是否完整？請說明。","explanation":"(a)(b) 屬固定程序，扣分多數源於在 (b) 漏了重量：拉力必須同時克服重量與提供加速度，寫成 T = ma 是最常見的錯誤。\n(c) 功的定義為力乘以沿力方向的位移，此處應以拉力而非淨力計算 —— 題目問的是「纜索所做的功」。以淨力計算會得出動能增量，是另一個量。\n(d) 此問分辨的是能量去向。纜索所做的功同時轉化為重力勢能【與】動能，因為升降機在 4.0 s 後仍在運動。答「完整」者通常是把「等加速上升」默認成「等速上升」；等速時該說法才成立，而題目明確指出由靜止加速。","type":"long","referenceAnswer":"(a) s = ut + ½at² = 0 + ½ × 1.5 × 4.0² = 12 m。\n\n(b) 取向上為正：T − mg = ma\nT = m(g + a) = 800 × (10 + 1.5) = 9 200 N。\n\n(c) W = T × s = 9 200 × 12 = 1.104 × 10⁵ J（約 1.1 × 10⁵ J）。\n\n(d) 不完整。纜索所做的功轉化為兩部分：\n重力勢能增量 ΔE_p = mgh = 800 × 10 × 12 = 9.6 × 10⁴ J；\n動能增量 ΔE_k = ½mv²，其中 v = at = 6.0 m s⁻¹，故 ΔE_k = ½ × 800 × 6.0² = 1.44 × 10⁴ J。\n兩者之和 9.6 × 10⁴ + 1.44 × 10⁴ = 1.104 × 10⁵ J，正好等於 (c) 的答案。\n須指出升降機在 4.0 s 末仍在運動，故必然有動能項；該說法僅在等速上升時成立。","markingScheme":"(a) 1 分 —— 正確代入等加速度公式並得 12 m。\n(b) 2 分 —— 列出 T − mg = ma 或等效式（1）；9 200 N 連單位（1）。只寫 T = ma 得 0 分。\n(c) 2 分 —— 以【拉力】而非淨力計算（1）；1.1 × 10⁵ J 連單位（1）。\n(d) 3 分 —— 判斷「不完整」（1）；指出尚有動能一項並算出 1.44 × 10⁴ J（1）；說明兩項之和等於纜索所做的功，或指出該說法僅於等速時成立（1）。只答「不完整」而無理由不得分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":13,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ph_w2_03","topic":"波動","difficulty":"intermediate","question":"一列水波以 0.60 m s⁻¹ 的速率自深水區傳入淺水區。在深水區量得波長為 30 cm。\n(a) 求該波在深水區的頻率。\n(b) 進入淺水區後波速降至 0.40 m s⁻¹。求淺水區的波長，並說明頻率為何不變。\n(c) 若水波斜向射入深淺水交界，除波長改變外，還會觀察到甚麼現象？請以波速的改變解釋。","explanation":"(a)(b) 的算式不難，真正的判別點在於「頻率不變」的理由。正確理由是頻率由波源決定 —— 每秒有多少個波前離開波源，就有多少個波前到達任何一點，否則波前會在交界處堆積或消失。常見的錯誤答法是「因為 v = fλ，v 和 λ 同時變小所以 f 不變」，這是把結論當理由：v 與 λ 同比例改變本身正是因為 f 固定，而非相反。\n(c) 折射。須以「同一波前的兩端先後進入淺水區、速率不同」來解釋方向改變，只寫「因為速度變了所以折射」未有觸及機制。","type":"long","referenceAnswer":"(a) v = fλ，λ = 30 cm = 0.30 m。\nf = v / λ = 0.60 ÷ 0.30 = 2.0 Hz。\n\n(b) 頻率不變，仍為 2.0 Hz。\nλ′ = v′ / f = 0.40 ÷ 2.0 = 0.20 m（即 20 cm）。\n頻率不變的理由：頻率由波源的振動決定。每秒離開波源的波前數目固定，這些波前必須全部越過交界，否則波前會在交界處累積或消失。故 f 固定，v 減小時 λ 必按同一比例減小。\n\n(c) 會觀察到折射（傳播方向偏折，波前方向改變）。\n解釋：波前斜向射入時，同一波前先進入淺水區的一端速率先減慢，另一端仍在深水區以較高速率前進，令波前轉向，因而傳播方向偏向法線。","markingScheme":"(a) 2 分 —— 波長換算為 0.30 m（1）；2.0 Hz 連單位（1）。\n(b) 3 分 —— 指出頻率不變（1）；0.20 m 連單位（1）；理由回到「頻率由波源決定／波前數目守恆」（1）。以「v = fλ 所以 f 不變」作理由不得該分。\n(c) 3 分 —— 指出折射（1）；說明同一波前兩端先後進入淺水區（1）；由兩端速率不同推出方向偏折（1）。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":13,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ph_w2_04","topic":"光學","difficulty":"intermediate","question":"一束光由玻璃（折射率 1.50）射向玻璃與空氣的界面。\n(a) 計算此界面的臨界角。\n(b) 若入射角為 35°，光會否折射入空氣？請說明。\n(c) 若同一束光由空氣射向玻璃，入射角為 60°，會否出現全內反射？請說明。","explanation":"(c) 是本題的分辨點。全內反射只可能發生在光由光密介質射向光疏介質時；由空氣射入玻璃時，折射光線必定存在，無論入射角多大。答「會，因為 60° 大於臨界角」是把臨界角當成一個與方向無關的門檻 —— 臨界角本身只在光密到光疏的方向上才有定義。此錯誤在歷屆考卷反覆出現，而且往往出現在 (a)(b) 全對的答卷上。","type":"text","referenceAnswer":"(a) sin C = 1 / n = 1 / 1.50 = 0.6667\nC = 41.8°（約 42°）。\n\n(b) 會折射入空氣。入射角 35° 小於臨界角 41.8°，故光線折射射出，同時有部分反射。\n\n(c) 不會。全內反射只可能在光由光密介質（玻璃）射向光疏介質（空氣）時發生。由空氣射入玻璃屬光疏射向光密，折射光線必定存在，折射角小於入射角，無論入射角多大都不會出現全內反射。臨界角僅對玻璃射向空氣此一方向有定義。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ph_w2_05","topic":"力學","difficulty":"hard","question":"一個質量 0.50 kg 的小球以 12 m s⁻¹ 的速率水平擊中牆壁，並以 8.0 m s⁻¹ 沿反方向彈回。碰撞歷時 0.040 s。\n(a) 求小球動量的變化。\n(b) 求牆壁對小球的平均作用力。\n(c) 有學生答「牆壁受到的力較小，因為牆壁不動」。請評論此說法。\n(d) 若碰撞時間延長至 0.080 s 而速率變化相同，平均作用力如何改變？此結果與安全氣囊的設計原理有何關係？","explanation":"(a) 最高頻的失分是把動量變化當成 m(12 − 8) = 2.0 kg m s⁻¹。動量是向量，反彈代表方向相反，必須先定正方向再代入符號，正確值為 m(−8.0 − 12) = −10 kg m s⁻¹。此一步答錯，(b) 亦必然連帶錯。\n(c) 考的是牛頓第三定律。牆壁受到的力與小球受到的力大小相等、方向相反；牆壁不動是因為其質量極大（且與地面連結），加速度可忽略，而非因為受力較小。把「不動」誤讀為「受力細」是把第三定律與第二定律混為一談。\n(d) 由 F = Δp / Δt，Δp 不變而 Δt 加倍，平均作用力減半。安全氣囊正是以延長碰撞時間來降低作用力 —— 它並不能減少動量變化，乘客的動量無論如何都要歸零。","type":"long","referenceAnswer":"(a) 取撞向牆壁的方向為正。\n初動量 = 0.50 × 12 = 6.0 kg m s⁻¹\n末動量 = 0.50 × (−8.0) = −4.0 kg m s⁻¹\nΔp = −4.0 − 6.0 = −10 kg m s⁻¹\n即大小 10 kg m s⁻¹，方向與入射方向相反。\n\n(b) F = Δp / Δt = −10 ÷ 0.040 = −250 N\n即大小 250 N，方向與小球入射方向相反（指離牆壁）。\n\n(c) 說法錯誤。根據牛頓第三定律，牆壁對小球的作用力與小球對牆壁的作用力大小相等（250 N）、方向相反。牆壁近乎不動是因為其質量極大且與地面連結，由 a = F / m 可知加速度可忽略，並非因為所受的力較小。\n\n(d) F = Δp / Δt，Δp 不變（仍為 10 kg m s⁻¹），Δt 由 0.040 s 加倍至 0.080 s，故平均作用力減半，變為 125 N。\n安全氣囊的原理相同：氣囊延長乘客減速所需的時間，由 F = Δp / Δt 令平均作用力下降。須注意氣囊【不能】減少動量的變化 —— 乘客的動量最終同樣要由初值降至零，能改變的只有這個過程所用的時間。","markingScheme":"(a) 3 分 —— 明確設定正方向（1）；反彈速度代入負值（1）；10 kg m s⁻¹ 連方向（1）。答 2.0 kg m s⁻¹ 者 (a) 全失。\n(b) 2 分 —— 正確使用 F = Δp / Δt（1）；250 N 連單位及方向（1）。\n(c) 2 分 —— 指出說法錯誤並引牛頓第三定律說明兩力大小相等（1）；以質量極大／加速度可忽略解釋牆壁不動（1）。\n(d) 2 分 —— 減半至 125 N（1）；指出氣囊延長碰撞時間而【不能】減少動量變化（1）。只寫「氣囊較軟所以較安全」不得分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":15,"trapTypes":null,"dnaTag":null,"mother":null}];

}

    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "physics-written-b2.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "physics-written-b2.decisions.json"; a.click();
});
counts();
</script></body></html>
