<script>
const DATA = [{"id":"zh_w_nar_01","topic":"命題寫作・記敘抒情","difficulty":"basic","question":"試以「那一次，我沒有說出口」為題，寫作一篇記敘文。\n\n〔引導〕有些話在當下沒有說出來，此後便一直留在心裏。試記述一次這樣的經歷，並寫出當時未曾說出口的原因。","explanation":"本題考核【留白】的能力。記敘文的情感不宜由作者直接宣告，而應由讀者從細節推得。判別方法很簡單：把文中所有寫明情緒的句子刪去，若讀者仍能感受到那份情緒，即屬成功。留意題目中的「那一次」已限定為單一事件，鋪陳多件事會令焦點分散。","type":"long","referenceAnswer":"【核心命題】\n題目的重心在「沒有說出口」這一個空缺，而非事件本身的大小。全文要讓讀者感受到那句話一直存在，卻始終未被說出。\n\n【必達要求】\n一、須有一個具體場景，並交代該句話原本可以說出的時機。\n二、未說出口的原因須落在當時的處境，例如顧慮對方的反應、場合不合、或自覺不夠資格，而非事後的抽象解釋。\n三、情感須由細節承載：手上的動作、視線的移動、話到嘴邊的停頓，皆可用以代替直接申明。\n四、結尾宜保留那句話仍未說出的狀態，或說明如今是否仍會選擇沉默。\n\n【常見失分位】\n一、開篇即申明「我很後悔」，把結論放在最前，其後的敘述失去張力。\n二、事件過於籠統，只寫「有一次」而無具體時地人。\n三、結尾強行提煉道理，把記敘文寫成論說文。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":75,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_02","topic":"命題寫作・記敘抒情","difficulty":"basic","question":"試以「舊物」為題，寫作一篇記敘文。\n\n〔引導〕一件不再使用的舊物，往往連繫着一段時間、一個人或一件事。試以一件具體的舊物為線索，記述與它有關的經歷。","explanation":"本題屬【以物繫情】的傳統題型。要點在於「先實後虛」：物件必須先被寫得可觸可見，其所承載的情感才站得住。凡一開篇即說「這件舊物象徵着我的童年」者，等於未寫先說破，後文再無可寫。","type":"long","referenceAnswer":"【核心命題】\n舊物須貫串全文，作為情感的載體與結構的線索，而非只在開頭出現一次。\n\n【必達要求】\n一、須具體描寫該物的外形與使用痕跡，痕跡本身即可交代時間。\n二、須有至少兩個時間點：得到它的時候與如今，兩者之間的落差構成情感的來源。\n三、人物與物件之間須有實際互動，避免物件淪為背景。\n四、結尾宜回到物件本身，以物的狀態收束，而非直接抒情。\n\n【常見失分位】\n一、物件只在首尾出現，中段與它無關，線索斷裂。\n二、通篇抒發懷念之情，缺乏可感的細節。\n三、把舊物寫成象徵而未先寫實，象徵因而落空。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":75,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_03","topic":"命題寫作・記敘抒情","difficulty":"intermediate","question":"試以「等」為題，寫作一篇記敘文。\n\n〔引導〕等待的過程往往比結果更難捱。試記述一次漫長的等待，並寫出等待期間心境的變化。","explanation":"本題考核【時間的處理】。記敘文最難的往往不是寫事件，而是寫時間如何流過。可用的技法有二：一是以環境的細節標示時間推移；二是以句式長短的變化模擬心跳的節奏——焦躁時句子轉短，接受時句子轉長。","type":"long","referenceAnswer":"【核心命題】\n題目的核心是【變化】：等待之初與等待之末的心境必須不同，且變化須有依據。\n\n【必達要求】\n一、須把等待的時間感寫出來，可借助環境的細微推移，例如光線、聲響、周遭人流的變化。\n二、心境須有至少三個層次，例如：起初的篤定、中段的焦躁、最後的接受或麻木。\n三、變化的轉折須有觸發點，不可無故改變。\n四、結果可以不揭曉，但等待所留下的東西必須寫出。\n\n【常見失分位】\n一、只寫等待有多悶，全文情緒單一，未見變化。\n二、以大量心理獨白填塞篇幅，缺乏外在描寫作依託。\n三、結尾以「終於等到了」草草收結，前文的鋪排落空。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":80,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_04","topic":"命題寫作・記敘抒情","difficulty":"intermediate","question":"試以「換了位置之後」為題，寫作一篇記敘文。\n\n〔引導〕當人由一個位置轉到另一個位置——由學弟變成學長、由被照顧者變成照顧者——看事情的角度往往隨之改變。試記述一次這樣的轉變。","explanation":"本題屬【對照結構】的記敘文，成敗在於前後兩段是否構成真正的對照。實用做法是讓同一個細節在文中出現兩次：第一次被誤讀，第二次被讀懂。這種寫法不必言明轉變，讀者自會察覺。","type":"long","referenceAnswer":"【核心命題】\n全文須讓讀者看見同一件事在兩個位置上的不同面貌，轉變因而具體可感。\n\n【必達要求】\n一、須先建立轉變前的視角，並寫出當時對另一方的判斷。\n二、轉變後須有一個具體事件，使舊有判斷受到修正。\n三、修正不必徹底，保留部分未改變的看法反而真實。\n四、結尾宜以一個對照的細節收束，例如如今做着從前不理解的同一件事。\n\n【常見失分位】\n一、只寫身分改變而無視角改變，題旨落空。\n二、轉變寫得太快，缺乏具體事件支撐。\n三、結尾以「我終於明白了」總結，流於說教。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":80,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_05","topic":"命題寫作・記敘抒情","difficulty":"intermediate","question":"試以「第一次獨自」為題，寫作一篇記敘文。\n\n〔引導〕第一次獨自完成某件事，往往伴隨不安與新鮮感。試記述這樣的一次經歷，並寫出過程之中的心理起伏。","explanation":"本題易寫而難寫好。多數答卷會把重心放在事件是否完成，但題目關心的是【獨自】這個狀態。可以刻意安排一兩處「若有人在旁便不成問題」的細節，獨自的重量便自然浮現。","type":"long","referenceAnswer":"【核心命題】\n「獨自」是題眼：全文須讓讀者感受到身邊沒有人可以依靠這一事實，而非只交代事件經過。\n\n【必達要求】\n一、須交代此前一向由誰陪同，藉此突出這次的不同。\n二、須寫出至少一個判斷失據的時刻，以及當時如何自行處理。\n三、環境描寫宜配合心理：不安時感官放大，安定後細節減省。\n四、結尾宜寫出獨自完成之後所獲得的東西，而非僅寫成功與否。\n\n【常見失分位】\n一、通篇順利無阻，缺乏心理起伏，題旨無從顯現。\n二、把「獨自」寫成「孤單」，方向偏離。\n三、以大量事件流水帳填滿篇幅，未見重心。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":80,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_06","topic":"命題寫作・記敘抒情","difficulty":"hard","question":"試以「他變了」為題，寫作一篇記敘文。\n\n〔引導〕人與人之間的疏遠，往往不是由某一件大事造成，而是在許多細微之處逐漸發生。試記述一段這樣的經歷。","explanation":"本題屬記敘文之中的高階題型：以【並置】代替【說明】。技法上可借助重複——同一個場景、同一句問話、同一個地點，在不同時期各寫一次，讀者自會從差異中讀出改變。凡以「自從那件事之後，他就變了」一句帶過者，等於放棄了本題的全部難度。","type":"long","referenceAnswer":"【核心命題】\n本題要求寫【漸變】而非突變。全文的難度在於：既要讓讀者看見改變，又不可用一件大事一次交代。\n\n【必達要求】\n一、須以三至四個時間相隔的小場景構成，場景之間不必解釋，由排列本身顯示變化。\n二、每個場景須有一個可對照的細節，例如同一句話在不同時期的回應方式。\n三、敘述者自身的變化亦須有所交代，避免把責任全歸於對方。\n四、結尾不宜和解或決裂，保留關係的懸而未決反而更接近實情。\n\n【常見失分位】\n一、以一件大事解釋全部改變，與引導語的「細微之處」相違。\n二、通篇指責對方，敘述者自身缺席。\n三、把「變了」寫成道德評價，記敘文變成批評文。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":90,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_07","topic":"命題寫作・記敘抒情","difficulty":"hard","question":"試以「沉默的晚飯」為題，寫作一篇記敘文。\n\n〔引導〕有些場合，說話的人不多，氣氛卻十分沉重。試記述一次這樣的經歷，並透過細節寫出當時未被說出的內容。","explanation":"本題考核【克制】。愈是重大的情緒，愈需要以細小的事物承載——這是記敘文的基本規律。評卷時特別留意作者有否忍住不解釋：能忍住的答卷，通常在情感層次上高出一截。留意「沉默」不等於「甚麼都沒發生」，桌上必須有事情正在進行。","type":"long","referenceAnswer":"【核心命題】\n題目要求以【無聲】承載內容：全文對話宜少，而讀者須能感知到桌上發生了甚麼。\n\n【必達要求】\n一、須以動作與物件推進：碗筷的聲響、遞菜的手、開着卻無人看的電視。\n二、須有一兩句對話，且該對話表面尋常而實則另有所指。\n三、敘述者的視線移動可用作結構線索，由一人移到另一人，逐步交代關係。\n四、結尾宜以一個細小的動作收束，避免說明沉默的原因。\n\n【常見失分位】\n一、以大段心理獨白解釋各人所想，取消了沉默的效果。\n二、對話過多，與題目要求相反。\n三、結尾直接揭示矛盾成因，前文的克制盡失。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":90,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_08","topic":"命題寫作・記敘抒情","difficulty":"hard","question":"試以「回不去的地方」為題，寫作一篇記敘文。\n\n〔引導〕有些地方即使能夠再去，也已經不是記憶中的模樣。試記述一次重返舊地的經歷。","explanation":"本題屬【今昔對照】。要點在於：對照必須落在同一個具體位置上，例如同一級樓梯、同一扇窗。泛泛地寫「整條街都變了」，落差感反而稀薄。另須留意——最深的落差往往不在景物，而在於自己站在那裏時的感受已經不同。","type":"long","referenceAnswer":"【核心命題】\n本題的核心是【落差】：記憶中的地方與眼前的地方之間的距離，即是全文的情感所在。\n\n【必達要求】\n一、須具體寫出記憶中的樣貌，細節愈準確，落差愈有力。\n二、須寫出眼前的實況，並讓兩者在同一個位置上對照。\n三、須辨明改變的來源：地方確實改變了，抑或是自己改變了，兩者宜有所觸及。\n四、結尾宜承認回不去這一事實，而不必以釋懷作結。\n\n【常見失分位】\n一、只寫今昔對比而無情感依託，淪為描述。\n二、把改變全歸咎於發展或時代，個人經驗缺席。\n三、結尾強行釋懷，與題目的「回不去」相違。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而不堆砌；對話是否切合人物身分；標點與句式有否配合節奏。\n結構 12 分：開端有否確立情境；情感鋪排是否有層次；結尾有否留有餘地而非總結道理。\n建議篇幅：650 至 800 字。\n本題所列分數為本平台練習用尺度（內容 16／語文 12／結構 12），並非香港考試及評核局的分數分配。參考立意只列方向與判準，刻意不提供完整範文——寫作能力來自自行組織的過程，一旦提供成文範文，練習極易變成背誦。","suggestedMinutes":90,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_w_nar_09","topic":"命題寫作・記敘抒情","difficulty":"hard","question":"試以「一句話的重量」為題，寫作一篇記敘文。\n\n〔引導〕有些說話在當時聽來平常，日後回想才知分量。試記述一次這樣的經歷。","explanation":"本題與「他變了」同屬【重複與差異】的技法，但更集中：全文只圍繞一句話。要留意的是第一次出場必須寫得夠輕，輕到讀者初讀時不以為意——分量正是由後文一層層加上去的。這種寫法要求作者對整體結構有預先的安排。","type":"long","referenceAnswer":"【核心命題】\n全文須有一句貫串始終的話，並讓該句話的分量隨敘述推進而顯現。\n\n【必達要求】\n一、該句話首次出現時須寫得平淡，甚至容易被略過。\n二、須有後續事件，令該句話重新被想起。\n三、分量的變化須由處境變化帶出，而非由作者宣告。\n四、結尾可讓該句話第三次出現，此時無須解釋，讀者自能感受不同。\n\n【常見失分位】\n一、該句話一出場即被鄭重其事地標示，分量無從累積。\n二、只寫說話者如何重要，未寫話語本身如何發揮作用。\n三、以「我永遠記得這句話」作結，流於空泛。","markingScheme":"內容 16 分：事件是否具體可感；情感有否隨情節推進而變化；有否避免直接申明情緒而改以細節承載。\n語文 12 分：描寫用語是否準確而 const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "chinese-writing-b2.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "chinese-writing-b2.decisions.json"; a.click();
});
counts();
</script></body></html>
