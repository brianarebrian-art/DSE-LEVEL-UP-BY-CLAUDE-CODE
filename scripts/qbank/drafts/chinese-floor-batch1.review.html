<script>
const DATA = [{"id":"zh_fl_cc01","topic":"課外文言・比較閱讀","difficulty":"basic","question":"【選文】\n甲：宋人有耕田者，田中有株，兔走觸株，折頸而死。因釋其耒而守株，冀復得兔。兔不可復得，而身為宋國笑。\n乙：楚人有鬻盾與矛者，譽之曰：「吾盾之堅，物莫能陷也。」又譽其矛曰：「吾矛之利，於物無不陷也。」或曰：「以子之矛陷子之盾，何如？」其人弗能應也。\n\n甲、乙兩則故事在寫法上的共同之處是甚麼？","options":["都以人物前後態度的轉變，寫出其覺悟的過程","都以一個具體人物的可笑行為，帶出一項普遍的道理","都以兩個人物的正反對照，突顯其中一方的過失","都先直接說明道理，然後再舉出事例加以印證"],"correctIndex":1,"explanation":"兩則同屬先秦寓言的典型寫法：不作議論，只敘一事，讓讀者由那個人的行為自行推出道理。甲篇寫守株待兔者的僥倖，乙篇寫自相矛盾者的窘態，都是「以一人之愚，見一理之明」。兩篇均只有一個主要人物，並無正反對照；道理亦全部隱藏於敘事之中，未曾直接說出；而兩人由始至終都不曾覺悟 —— 守株者「身為宋國笑」，鬻矛盾者「弗能應」，皆止於此。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_cc02","topic":"課外文言・比較閱讀","difficulty":"basic","question":"【選文】\n甲：曾子之妻之市，其子隨之而泣。其母曰：「女還，顧反為女殺彘。」妻適市來，曾子欲捕彘殺之。妻止之曰：「特與嬰兒戲耳。」曾子曰：「嬰兒非與戲也。」遂烹彘也。\n乙：吳起出，遇故人而止之食。故人曰：「諾，期返而食。」起曰：「待公而食。」故人至暮不來，起不食待之。明日早，令人求故人，故人來，方與之食。\n\n甲、乙兩則故事共同強調的是甚麼？","options":["待人接物之時，宜以寬容化解彼此誤會","已經許下的承諾，即使代價不菲亦須履行","教導子女之時，身教遠比言語訓誡有效","與人交往之際，應當先行考慮自身得失"],"correctIndex":1,"explanation":"兩則的核心同在一個「信」字：曾子為一句哄孩子的話而真的殺豬，吳起為一個口頭之約而餓着等到翌日，兩人都付出了不相稱的代價去兌現承諾，正是要突顯守信本身不論對象、不計代價。身教只是甲篇一面的意思，乙篇並無教子情節；兩篇皆不計得失，與「先考慮自身得失」正好相反；而兩則之中亦無任何誤會需要化解。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_cc03","topic":"課外文言・比較閱讀","difficulty":"basic","question":"【選文】\n甲：齊人有馮諼者，貧乏不能自存，使人屬孟嘗君，願寄食門下。孟嘗君曰：「客何能？」曰：「客無能也。」孟嘗君笑而受之。\n乙：鮑叔既進管仲，以身下之。管仲曰：「生我者父母，知我者鮑子也。」\n\n就兩則所寫的「識人」而言，甲、乙兩篇的分別在於甚麼？","options":["甲寫識人於微時的眼光，乙寫用人唯親的弊端","甲寫用人不疑的胸襟，乙寫知恩圖報的情義","甲寫以財力籠絡門客，乙寫以言語打動君主","甲寫接納尚未顯露才能之人，乙寫成全已知其才之人"],"correctIndex":3,"explanation":"比較題的關鍵在於找出同中之異。兩篇同寫「識人」，但方向相反：孟嘗君所面對的是一個自稱「無能」、才具未見之人，他的選擇是先接納；鮑叔所面對的是一個他早已深知其才之人，他的選擇是讓賢而居其下。前者難在「未見而信」，後者難在「已見而讓」。甲篇並無以財力籠絡的描寫，乙篇亦不涉及打動君主；「知恩圖報」是管仲的反應而非鮑叔的作為；而乙篇所寫正是舉賢，與用人唯親相反。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_cc04","topic":"課外文言・比較閱讀","difficulty":"intermediate","question":"【選文】\n甲：楚人有涉江者，其劍自舟中墜於水，遽契其舟曰：「是吾劍之所從墜。」舟止，從其契者入水求之。舟已行矣，而劍不行，求劍若此，不亦惑乎！\n乙：鄭人有欲買履者，先自度其足而置之其坐。至之市而忘操之。已得履，乃曰：「吾忘持度。」反歸取之。及反，市罷，遂不得履。人曰：「何不試之以足？」曰：「寧信度，無自信也。」\n\n甲、乙兩人所犯的錯誤，其性質最接近下列哪一項？","options":["都因過分信賴他人的說法，而放棄了自己的判斷","都以一個固定的標記，取代了眼前不斷變化的實情","都因一時的疏忽大意，以致錯失了本可把握的時機","都因貪圖省事而走了捷徑，最終反而多費了工夫"],"correctIndex":1,"explanation":"兩人所執的都是一個曾經正確、此刻已經失效的「憑據」：刻痕記下的是劍墜下那一刻的船舷位置，量好的尺碼記下的是量度那一刻的腳；船在動、腳就在身上，實情都不再與憑據相符，而兩人仍以憑據為準。疏忽只是鄭人忘記帶尺的表層原因，不能解釋他為何寧可回家亦不試穿；兩人所信的都是自己所立的憑據，並非他人之說；而兩人的做法反而更費工夫，並非為了省事。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_cc05","topic":"課外文言・比較閱讀","difficulty":"intermediate","question":"【選文】\n甲：伯牙鼓琴，志在高山，鍾子期曰：「善哉，峨峨兮若泰山。」志在流水，曰：「善哉，洋洋兮若江河。」子期死，伯牙破琴絕絃，終身不復鼓琴。\n乙：管寧、華歆共園中鋤菜，見地有片金，管揮鋤與瓦石不異，華捉而擲去之。又嘗同席讀書，有乘軒冕過門者，寧讀如故，歆廢書出看。寧割席分坐，曰：「子非吾友也。」\n\n兩則同寫朋友關係的斷絕，其原因的分別在於甚麼？","options":["甲因技藝已無人能及而自感孤高，乙因對方德行有虧而斷交","甲寫友誼因外力而中斷，乙寫友誼因誤會而破裂","甲因悲傷過度以致無心再事琴藝，乙因一時氣憤而作出決定","甲因對方離世而無人能知其心，乙因察覺對方志趣與己不同"],"correctIndex":3,"explanation":"兩則的「斷」字所指不同。甲篇之斷出於外力 —— 子期死，世上再無人聽得懂琴中之意，伯牙破琴是因為彈奏已失去對象；乙篇之斷出於自願 —— 管寧從拾金與觀車兩件小事看出華歆心之所向，因而主動割席。前者是「無人可知」，後者是「所知非同道」。華歆擲金、出觀，皆非德行有虧之事，管寧所判的是志趣而非品格；伯牙破琴亦非因技藝孤高；而割席出於長期觀察，不屬一時之氣，更無誤會可言。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_cc06","topic":"課外文言・比較閱讀","difficulty":"intermediate","question":"【選文】\n甲：孟子曰：「魚，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍魚而取熊掌者也。」\n乙：莊子釣於濮水，楚王使大夫二人往先焉，曰：「願以境內累矣。」莊子持竿不顧，曰：「吾聞楚有神龜，死已三千歲矣。此龜者，寧其死為留骨而貴乎？寧其生而曳尾於塗中乎？」二大夫曰：「寧生而曳尾塗中。」莊子曰：「往矣，吾將曳尾於塗中。」\n\n甲、乙兩段在說理方法上的共同特點是甚麼？","options":["都以自身經歷為例，說明所持主張確實可以實行","都先提出明確的結論，然後逐層舉出理據加以支持","都借與他人的往復辯難，逐步駁倒對方的相反主張","都先設一個日常可解的比喻，再引出所要論述的抉擇"],"correctIndex":3,"explanation":"兩段同用比喻開路：孟子先說魚與熊掌，是人人都懂的取捨；莊子先說神龜寧曳尾於塗，是任誰都答得出的選擇。待對方在比喻之中已經表態，再把同一結構套回真正要談的問題之上，令對方無從否認。兩段皆是先喻後論，並非先立結論；乙篇雖有對話，但二大夫只作答而未提出相反主張，不構成辯難；而兩段所舉的魚與龜均非自身經歷。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_cc07","topic":"課外文言・比較閱讀","difficulty":"intermediate","question":"【選文】\n甲：陳康肅公善射，當世無雙，公亦以此自矜。嘗射於家圃，有賣油翁釋擔而立，睨之久而不去。見其發矢十中八九，但微頷之……翁曰：「無他，但手熟爾。」\n乙：庖丁為文惠君解牛……文惠君曰：「善哉！技蓋至此乎？」庖丁釋刀對曰：「臣之所好者道也，進乎技矣。」\n\n就兩位技藝高超者的自述而言，其分別在於甚麼？","options":["賣油翁重視工具之利，庖丁重視心神之專注","賣油翁自謙而不欲人知，庖丁則刻意誇示其本領","賣油翁把所長歸於熟練，庖丁則自言已由技進於道","賣油翁所述為天賦所限，庖丁所述為勤學所得"],"correctIndex":2,"explanation":"兩人同被問及何以能如此，答案卻分屬兩個層次。賣油翁把一切歸於「手熟」，即反覆操作所累積的熟練；庖丁則明言自己所追求的並非技術本身，而是循乎自然之理的「道」，並自言已超乎技的層次。一者止於技而不自居，一者由技而上溯於道。庖丁是應問而答，並非誇示；兩人皆未提及天賦；而賣油翁所重亦在手，不在工具。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_cc08","topic":"課外文言・比較閱讀","difficulty":"intermediate","question":"【選文】\n甲：塞翁失馬，其父曰：「此何遽不為福乎？」居數月，其馬將胡駿馬而歸。人皆賀之，其父曰：「此何遽不能為禍乎？」\n乙：孔子曰：「歲寒，然後知松柏之後彫也。」\n\n甲、乙兩則在觀察事物的角度上，共同之處是甚麼？","options":["都認為世事變化無從預料，因此不必為得失費心","都主張把眼前一時之見，放在較長的時間之中重新判斷","都強調應當在困厄之時堅持，等待時機自然來臨","都指出人的判斷必然受限於自身處境，難以客觀"],"correctIndex":1,"explanation":"兩則同樣要求把時間拉長之後再作判斷。塞翁不在事發當下論斷禍福，而是等後續發展揭曉；孔子則指出松柏之異於眾木，要到歲寒方才顯現。兩者都指向同一點：一時之見不足為據，時間會改變結論。塞翁篇並非叫人不理得失，而是叫人延後判斷；兩則皆未談及判斷受處境所限；而「等待時機」亦非兩則之意 —— 松柏所顯的是本性，並非等來的機會。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pf01","topic":"段落結構與作用","difficulty":"intermediate","question":"一篇散文寫童年舊居，中段忽然插入一段關於祖母生前習慣的敘述，其後再回到舊居的描寫。此一插敘段落在結構上的主要作用是甚麼？","options":["總結上文所寫內容，並為全篇作出初步的結論","轉換全篇的敘述角度，由第一人稱改為第三人稱","藉離題的閒筆調節節奏，與主線並無實質關聯","補足主線所缺的背景，使其後的描寫帶有情感依據"],"correctIndex":3,"explanation":"插敘的作用在於補入主線時序之外、卻為理解主線所必需的材料。祖母的習慣一段本身不屬舊居的描寫，但有了它，其後所寫的門檻、灶頭、窗台才不只是空間，而是承載着某個人的痕跡 —— 情感由此有了着落。插敘並不改變敘述人稱；位處中段而非結尾，亦不承擔總結之責；至於「與主線無關」，正是判斷插敘成敗的反面 —— 真正的閒筆不會被安排在此處。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pf02","topic":"段落結構與作用","difficulty":"intermediate","question":"議論文首段先詳細敘述一件近日的社會事件，其後各段才展開論證。此一首段的主要作用是甚麼？","options":["為全篇定下敘事文體的基調，其後各段依此展開","以具體事例引入議題，使抽象的論點有可依附的討論對象","藉事例直接證明作者的論點，令其後的論證可以省略","交代作者的寫作動機，以取信於讀者並拉近距離"],"correctIndex":1,"explanation":"議論文以事例開篇，作用在於「引入」而非「證明」：它把一個抽象的問題落實為一件讀者記得的事，令其後的論證有共同的討論對象。若以為舉了例便等於證明，正是議論文最常見的邏輯漏洞 —— 一個事例只能說明該事例本身。寫作動機屬次要作用，並非首段的結構功能；而議論文的文體不會因首段有敘事成分而改變。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pf03","topic":"段落結構與作用","difficulty":"intermediate","question":"記敘文結尾一段，作者不再交代事情的結果，只寫自己多年後重經舊地時所見的一個尋常景物。此一結尾的主要作用是甚麼？","options":["補敘先前未及交代的情節，使全篇的脈絡完整","轉入議論，直接點明全篇所要傳達的道理","藉時間的推移說明事件的影響已經完全消失","以景結情，把未曾說出的感受交由讀者自行體會"],"correctIndex":3,"explanation":"以景結情是記敘抒情文常見的收束方式：作者不把感受說破，而以一個具體景物承載它，讀者所感到的份量往往比直接抒情更重。此處既未補敘情節，亦無議論成分；而重經舊地本身正說明事情仍在心中，與「影響完全消失」相反 —— 若真已無所謂，便不會有這一段。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pf04","topic":"段落結構與作用","difficulty":"intermediate","question":"一篇說明文在兩個主要部分之間，安排了一段僅得兩句的短段落。此類短段落在篇章結構上的常見作用是甚麼？","options":["重複前文的要點，加深讀者對該部分的印象","提出與全篇立場相反的看法，以引起讀者思考","交代資料來源，說明其後所述內容的可靠程度","承上啟下，收束前一部分並帶出後一部分的內容"],"correctIndex":3,"explanation":"兩個主要部分之間的短段落，通常承擔過渡之責：它篇幅短是因為本身不負載新資訊，作用在於接榫 —— 上半句收前文，下半句起後文。判別方法很直接：把它刪去，前後兩部分會顯得突兀，但並無資訊流失。重複要點、提出反面看法、交代來源三者都會帶入新內容，篇幅亦不會僅得兩句。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pf05","topic":"段落結構與作用","difficulty":"hard","question":"一篇議論文的第三段提出了一項與作者立場相反的看法，並用了相當篇幅加以陳述，其後第四段才逐點回應。就結構而言，第三段的安排最能收到甚麼效果？","options":["藉篇幅的分配平衡雙方，使全篇維持中立不作抉擇","轉移讀者的注意，避開作者本身論證上的弱點","把最強的論點留待最後，以造成層層遞進的氣勢","先讓對方觀點充分成立，其後的回應方能顯出說服力"],"correctIndex":3,"explanation":"議論文中把對方觀點寫足，是一種計算過的安排：若只以三言兩語草草帶過再加駁斥，讀者會覺得作者所駁的並非對方真正的主張；唯有先讓它成立，其後的回應才有份量。此一寫法並不等於中立 —— 作者立場仍在，只是不迴避最強的反面；第三段所陳的是對方而非作者的論點，故不構成己方的層層遞進；至於轉移注意，方向剛好相反：正面迎向反對意見，恰恰是不迴避。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pr01","topic":"課外文言・篇章精讀","difficulty":"basic","question":"【選文】\n晉平公問於師曠曰：「吾年七十，欲學，恐已暮矣。」師曠曰：「何不炳燭乎？」平公曰：「安有為人臣而戲其君乎？」師曠曰：「盲臣安敢戲其君？臣聞之：少而好學，如日出之陽；壯而好學，如日中之光；老而好學，如炳燭之明。炳燭之明，孰與昧行乎？」平公曰：「善哉！」\n\n師曠所說的「炳燭之明，孰與昧行乎」，其意思是甚麼？","options":["點燭而行雖然光弱，總勝過摸黑而行","年老而學已經太遲，不如安然休息","燭光雖然微弱，卻比日光更為可貴","點燭需要花費，不如等待天亮再行"],"correctIndex":0,"explanation":"「孰與」是文言中的比較句式，意為「與……相比，哪一個較好」。師曠以三個時段作比：少學如朝陽，壯學如日中，老學如燭光 —— 燭光確不及日光，但相比之下，仍勝過完全不點而在黑暗中行走（昧行）。其意並非說燭光勝過日光，更非勸人不必再學；而句中亦全無花費與等待之意。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pr02","topic":"課外文言・篇章精讀","difficulty":"basic","question":"【選文】\n楚有祠者，賜其舍人卮酒。舍人相謂曰：「數人飲之不足，一人飲之有餘。請畫地為蛇，先成者飲酒。」一人蛇先成，引酒且飲之，乃左手持卮，右手畫蛇曰：「吾能為之足。」未成，一人之蛇成，奪其卮曰：「蛇固無足，子安能為之足？」遂飲其酒。\n\n那位最先畫成蛇的人，最終失去那杯酒的直接原因是甚麼？","options":["他在已經勝出之後，仍多此一舉為蛇添上腳","他飲酒的動作太慢，被後來者搶先一步","他違反了先前眾人所議定的比賽規則","他所畫的蛇形狀不像，因而不獲眾人承認"],"correctIndex":0,"explanation":"關鍵在於他本已勝出 —— 「一人蛇先成，引酒且飲之」，酒已在手。失去它的直接原因，是他多畫了蛇本來沒有的腳，令那條蛇不再是蛇，勝負因而被推翻。文中並無說他畫得不像，亦無人質疑其形狀；他慢的不是飲酒的動作，而是自己加了一道多餘的工序；而他亦未違反規則 —— 規則只說先成者飲，正是他自己把「已成」變回「未成」。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pr03","topic":"課外文言・篇章精讀","difficulty":"basic","question":"【選文】\n齊人有欲金者，清旦衣冠而之市，適鬻金者之所，因攫其金而去。吏捕得之，問曰：「人皆在焉，子攫人之金何？」對曰：「取金之時，不見人，徒見金。」\n\n文中「不見人，徒見金」一句，最能說明那人的甚麼情況？","options":["當時市集人煙稀少，故無人看見他的舉動","心神全被所欲之物佔據，以致對周遭渾然不覺","他事先仔細觀察環境，確定四周並無旁人","他天生視力不佳，未能看清身邊的情況"],"correctIndex":1,"explanation":"此句是全篇的關鍵，亦是一句心理描寫而非事實描述。吏所問的正是「人皆在焉」—— 人明明都在，可見並非無人。那人所答的是自己當時的狀態：欲念一起，注意力全部集中於金，其餘一概不入眼。故此句不能解為市集無人、事先觀察或視力有缺 —— 前者與吏所述相矛盾，後兩者則與「徒見金」所強調的失神狀態不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_pr04","topic":"課外文言・篇章精讀","difficulty":"intermediate","question":"【選文】\n孟子曰：「今有人日攘其鄰之雞者，或告之曰：『是非君子之道。』曰：『請損之，月攘一雞，以待來年然後已。』如知其非義，斯速已矣，何待來年？」\n\n孟子在此段所批評的，最主要是甚麼？","options":["那人不肯承認自己的行為在道理上並不正當","旁人的勸告過於婉轉，未能令那人真正醒悟","偷雞的次數由每日一隻減至每月一隻仍屬太多","明知不義卻只求減少，而不肯立即停止的態度"],"correctIndex":3,"explanation":"孟子所針對的並非數量，而是態度。文中那人已經接受「非君子之道」這個判斷 —— 他肯減，正說明他知道不對；孟子的反問「如知其非義，斯速已矣，何待來年」，直指其中的矛盾：既然已知不義，就應立刻停止，而不是安排一個逐步減少的時間表。把重點放在「一月一隻仍太多」，便是把質的問題誤讀為量的問題；那人並未否認不義；而勸告者的說法亦相當直接。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_lx01","topic":"文言實詞・一詞多義","difficulty":"intermediate","question":"下列各句中的「顧」，哪一項解作「回頭看」？","options":["三顧臣於草廬之中","莊子持竿不顧","顧不如蜀鄙之僧哉","顧念蓄劣物終無所用"],"correctIndex":1,"explanation":"「顧」在文言中至少有四個常見義項，須按句意分辨。「持竿不顧」寫莊子連頭也不回，正是「回頭看」的本義。「顧不如蜀鄙之僧哉」的「顧」是反問語氣詞，可解作「難道」；「三顧臣於草廬之中」的「顧」解作「探訪、拜訪」；「顧念蓄劣物終無所用」的「顧」則解作「只是、不過」，表示語意的轉折。判別方法是把各個義項代入原句，看句子是否讀得通。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_lx02","topic":"文言實詞・一詞多義","difficulty":"intermediate","question":"下列各句中的「亡」，哪一項解作「逃跑」？","options":["亡羊補牢，未為遲也","河曲智叟亡以應","今亡亦死，舉大計亦死","諸侯之所亡，與戰敗而亡者"],"correctIndex":2,"explanation":"「亡」的義項與讀音相關，須一併考慮。「今亡亦死」出自陳涉之語，指逃走亦是死路一條，解作「逃跑」。「諸侯之所亡」的「亡」解作「失去」；「亡羊補牢」的「亡」解作「丟失、走失」；「河曲智叟亡以應」的「亡」則通「無」，讀作 wú，解作「沒有」。最後一項屬通假，是文言閱讀中特別容易誤判的一類。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_lx03","topic":"文言實詞・一詞多義","difficulty":"hard","question":"下列各句中的「安」，其詞性與詞義跟其餘三項不同的是哪一項？","options":["燕雀安知鴻鵠之志哉","安能摧眉折腰事權貴","風雨不動安如山","君謂計將安出"],"correctIndex":2,"explanation":"本題須先分辨詞性，再分辨詞義。「風雨不動安如山」的「安」是形容詞，解作「安穩」，形容屋舍的狀態。其餘三項的「安」均屬疑問詞：「安能摧眉折腰」與「燕雀安知」皆表反問，解作「怎麼、哪裏」；「計將安出」則是疑問代詞，解作「從何處」。三者雖語氣略有差異，但同屬疑問性質，與第一項的形容詞用法分屬兩類。此類題目若只憑語感選擇，極易被「安能」與「安知」的相似外形誤導。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_mi01","topic":"課外文言・寓意推論","difficulty":"basic","question":"【選文】\n楚人有涉江者，其劍自舟中墜於水，遽契其舟曰：「是吾劍之所從墜。」舟止，從其契者入水求之。舟已行矣，而劍不行，求劍若此，不亦惑乎！\n\n本則故事的寓意是甚麼？","options":["做事之前必須先作記號，方能避免日後混淆","遺失財物之後應當立即尋找，不可有所拖延","乘船渡江時應當小心保管隨身攜帶的物品","處事須因應情況的變化，不可墨守既定的方法"],"correctIndex":3,"explanation":"寓言的寓意須由「錯在哪裏」推出。楚人刻記號本身並無不妥，錯在船已移動而他仍以那個記號為準 —— 即以靜止的憑據去應對已經變化的情況。若讀成「應立即尋找」，是把它當成一則講時機的故事，與船動劍不動的重點無關；「先作記號」更是把他的錯誤當成正確做法；至於保管物品，則只停留在情節表面，未觸及寓意。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_mi02","topic":"課外文言・寓意推論","difficulty":"basic","question":"【選文】\n宋人有閔其苗之不長而揠之者，芒芒然歸，謂其人曰：「今日病矣，予助苗長矣。」其子趨而往視之，苗則槁矣。\n\n本則故事的寓意是甚麼？","options":["做事應當親力親為，不宜假手於他人代勞","遇有困難之時應當求助於人，不可獨力硬撐","事物自有其成長規律，強求速成反而招致損害","農事須要勤加照料，稍有懈怠便會前功盡棄"],"correctIndex":2,"explanation":"寓意的關鍵在於那人的用力方向：他並非懶惰，反而「芒芒然歸」，累得很 —— 正因如此，這則故事所批評的不是不努力，而是努力用錯了地方：禾苗有其生長節奏，人力介入只能助其條件，不能替它生長。若讀成「勤加照料」，恰好與故事相反 —— 他正是做得太多；而親力親為與求助於人兩項，亦與文中情節無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"zh_fl_mi03","topic":"課外文言・寓意推論","difficulty":"basic","question":"【選文】\n齊宣王使人吹竽，必三百人。南郭處士請為王吹竽，宣王說之，廩食以數百人。宣王死，湣王立，好一一聽之，處士逃。\n\n本則故事的寓意是甚麼？","options":["君主的喜好時常改變，臣下難以長久迎合","為政者應當廣納人才，不宜限制樂隊的人數","沒有真才實學者，一旦逐一查核便無所遁形","群體合作之時，個人的努力往往難以被看見"],"correctIndex":2,"explanation":"故事的轉折全在兩位君主的聽法不同：宣王要三百人合奏，湣王要逐一獨奏。同一個南郭處士，在合奏之中混得過去，在獨奏之下只能逃走 —— 可見他一直沒有真本領，只是此前無從察覺。「廣納人才」與故事所寫相反，宣王正因人多而未能辨別；「努力難以被看見」把處士當成有才而被埋沒，與「處士逃」的結局不符；而湣王所改的是查核方式，並非喜好。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "chinese-floor-batch1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "chinese-floor-batch1.decisions.json"; a.click();
});
counts();
</script></body></html>
