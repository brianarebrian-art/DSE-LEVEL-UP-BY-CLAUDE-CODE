<script>
const DATA = [{"id":"el_w1_01","topic":"Literary Devices","difficulty":"basic","question":"Distinguish between a simile and a metaphor, then explain why the difference matters to a reader — that is, what changes in the reading experience when a writer chooses one rather than the other.","explanation":"Naming the device is the easy half and carries few marks. What examiners look for is effect: what the choice does to the reader. An answer that stops at \"a simile uses like or as\" has identified a grammatical feature, not a literary one.\n\nThe third point — that metaphors can be extended while similes are usually spent — is the one candidates rarely reach, and it explains why sustained imagery in poetry is almost always metaphorical. If you can name a device, always finish the sentence with \"which means the reader…\". That habit turns identification into analysis.","type":"text","referenceAnswer":"A simile states a comparison openly, using \"like\" or \"as\": the two things are held side by side and acknowledged to be separate. A metaphor asserts identity: one thing is spoken of as though it were the other, with no comparative marker.\n\nWhy the difference matters:\nFirst, distance. A simile keeps the reader aware that a comparison is being made, so the tenor and vehicle stay distinct. A metaphor collapses that gap, and for the length of the sentence the reader is asked to accept the substitution outright, which is a stronger claim.\nSecond, certainty. \"He was like a lion\" describes a resemblance the reader may weigh. \"He was a lion\" leaves nothing to weigh; the writer is not offering a comparison but making a statement, and the reader either takes it or does not.\nThird, extension. Because a metaphor asserts identity, its logic can be carried further through a passage — the lion may then hunt, prowl, be caged — while a simile tends to be spent once made.\n\nThe choice therefore controls how much interpretive work the reader is asked to do, and how far the image can travel.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"el_w1_02","topic":"Theme & irony","difficulty":"intermediate","question":"Dramatic irony occurs when the audience knows something a character does not.\n(a) Explain how dramatic irony differs from verbal irony and from situational irony.\n(b) Using one play you have studied, describe one moment of dramatic irony and explain what it achieves.\n(c) Dramatic irony requires the audience to be told something in advance. Explain what a dramatist gives up by doing this, and why it can still be worth the cost.","explanation":"Part (a) is a definitions question, but the marks go to the organising principle rather than to three separate definitions. Saying that the three ironies differ by where the gap sits — words, events, knowledge — shows the category is understood; listing them separately does not.\n\nPart (c) is what separates a competent answer from a strong one, and it rests on a habit worth developing: for any technique, ask what it costs. Every choice in a play forecloses something. Dramatic irony forecloses surprise, and recognising that trade-off is more analytically useful than praising the technique. The follow-through — that the audience’s raised vantage point is what makes tragedy feel inevitable — connects a device to a genre, which is the kind of link examiners reward.\n\nFor (b), one moment described precisely beats three mentioned in passing. Name the play, the moment, what the audience knows and what the character does not, then the effect.","type":"long","referenceAnswer":"(a) Verbal irony lies in the words: a speaker says one thing and means another, and the gap is between statement and intention. Situational irony lies in events: what happens is the opposite of what was expected or intended, and the gap is between expectation and outcome. Dramatic irony lies in knowledge: the audience holds information a character lacks, and the gap is between what is known on stage and what is known in the auditorium.\nThe three are distinguished by where the gap sits — in the words, in the events, or in the distribution of knowledge.\n\n(b) In Romeo and Juliet, the audience knows Juliet has taken a sleeping potion and is not dead. Romeo does not, and kills himself beside her.\nWhat it achieves: the audience cannot intervene and can only watch a preventable death approach, which converts suspense into something closer to grief. It also shifts the blame away from the characters — Romeo acts reasonably on what he knows — and towards the circumstances that kept him from knowing, which is where the play locates its tragedy. Every line he speaks over her body carries a second meaning for the audience that it cannot carry for him, so ordinary words become unbearable.\n\n(c) What is given up: surprise. Once the audience is told, the revelation can never land as a shock, and the scene loses whatever force a sudden reversal would have had.\nWhy it can still be worth it: surprise is brief, while dread lasts. A shock occupies a moment; knowing what is coming stretches tension across an entire scene, and the audience experiences the whole approach rather than a single instant.\nIt also changes the audience’s position. Surprise puts the audience level with the characters; dramatic irony raises it above them, and from that position the audience sees the pattern the characters cannot — how small accidents compound, how a misunderstanding hardens. That vantage point is what allows a tragedy to feel inevitable rather than merely unlucky.\nA dramatist therefore trades one strong moment for a sustained condition, and for a change in what the play is able to say.","markingScheme":"(a) 3 marks — one for each irony correctly distinguished, with a mark reserved for stating the organising principle (where the gap sits). Three unconnected definitions earn 2.\n(b) 4 marks — the play and moment identified precisely (1); what the audience knows and the character does not, made explicit (1); the effect on the audience (1); a further point on what the moment does for the play as a whole, such as where it places blame (1).\n(c) 3 marks — surprise identified as what is surrendered (1); dread sustained across a scene contrasted with a momentary shock (1); the change in the audience’s vantage point and its bearing on tragedy (1).\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":20,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"el_w1_03","topic":"Characterisation","difficulty":"intermediate","question":"Read the passage and answer the questions.\n\n\"She arrived four minutes early, as she always did, and stood outside until the hour. When she was shown in she thanked the assistant twice, sat without being asked a second time, and placed her folder squarely on her knees. Asked how she was, she said the traffic had been kind. She did not mention that she had been waiting since seven.\"\n\n(a) What impression of the character does the passage create? Support your answer with three details.\n(b) The narrator never states what the character is feeling. Explain how the passage conveys it nonetheless.\n(c) Rewrite the final sentence so that it states the feeling directly, then explain what is lost.","explanation":"Part (c) is unusual in asking you to write a worse version deliberately, and it is the most instructive part of the question. Producing the flat rewrite makes visible what the original was doing — you cannot describe the loss until you have seen the two side by side. It is worth doing this in your own reading whenever a passage strikes you: paraphrase it plainly, then ask what disappeared.\n\nIn (a) the three details must be quoted or specified, not summarised. \"She seems nervous because of how she behaves\" identifies the impression without evidencing it. Note also that the details are small on purpose; the passage works by accumulation, and an answer that seizes on one dramatic detail has missed the method.\n\nThe strongest point available in (b) is the one about omission, because it is the only device in the passage that operates on absence rather than presence. Show-not-tell is a familiar phrase; noticing that the passage also withholds is a further step.","type":"long","referenceAnswer":"(a) The impression is of someone anxious to give no trouble, and anxious in general — a person managing herself carefully in a situation she considers important.\nThree supporting details: arriving early \"as she always did\" and then waiting outside rather than going in, which shows she will not risk being either late or intrusive; thanking the assistant twice, a small excess that suggests nervousness rather than mere courtesy; and placing the folder \"squarely\" on her knees, a controlled gesture indicating she is holding herself in order.\n\n(b) The feeling is conveyed by three means.\nFirst, by behaviour rather than statement. Every detail is an action the reader can see, and the reader infers the state of mind from the pattern the actions form.\nSecond, by excess. Each action is slightly more than the situation requires — four minutes early, two thanks, a folder placed squarely. Any one alone would pass unnoticed; together they read as effort.\nThird, and most sharply, by omission. The last sentence tells us what she did not say. That she had been waiting since seven reveals how much the meeting mattered, and that she concealed it reveals she did not want that to show. The concealment is the characterisation: we learn both the feeling and her wish to hide it in a single stroke.\n\n(c) Direct version: \"She had been waiting since seven, but she was too anxious about seeming desperate to admit it.\"\nWhat is lost:\nThe reader’s work, and with it the reader’s conviction. In the original the reader assembles the inference and therefore owns it; in the rewrite the reader is handed a conclusion and can only accept or reject it.\nThe double meaning also collapses. The original reveals the fact and the concealment at once, and the concealment is what makes her particular. The rewrite states the fact and then explains it, so the two are separated and the explanation flattens the second into a motive.\nFinally, the restraint of the voice is lost. The narrator had been reporting only what could be observed, and that restraint mirrored the character’s own. Once the narrator names an emotion, the distance between narrator and character disappears, and the passage becomes a report about a nervous woman rather than a portrait of one.","markingScheme":"(a) 3 marks — a defensible overall impression (1) and up to two further marks for details that are specified and connected to that impression. Details listed without connection earn 1 in total.\n(b) 4 marks — behaviour rather than statement (1); the pattern of small excesses (1); the final sentence recognised as omission (1); the point that the concealment itself characterises her (1).\n(c) 2 marks — a rewrite that genuinely states the feeling (1); an explanation of the loss naming at least two of: the reader’s inferential work, the collapsed double meaning, the change in narrative distance (1).\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":18,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"el_w1_04","topic":"Poetry","difficulty":"intermediate","question":"Explain what enjambment is, and describe two distinct effects a poet can achieve with it. For each effect, say how the reader experiences it.","explanation":"Most answers give the momentum effect and stop there, which is why the question asks for two distinct effects — a second point that restates the first in different words will not count. The double-reading effect is the more valuable one to know, because it explains why poets choose particular words to end a line on: the last word before the break is briefly load-bearing in a way it would not be inside a sentence.\n\nThe instruction to say how the reader experiences each effect is doing real work. It is the difference between describing a technical feature and describing what the technique does, and marks in poetry questions consistently follow the second. When you analyse a poem, the test to apply is whether your sentence could be checked by someone reading the lines aloud.","type":"text","referenceAnswer":"Enjambment is the continuation of a sentence or clause past the end of a line of verse without a grammatical pause, so that the line break falls in the middle of a unit of sense.\n\nFirst effect: momentum. Because the sense is unfinished, the reader is carried across the break rather than resting at it, and the poem gathers pace. The reader experiences this as urgency or breathlessness — the eye is pulled down the page, and a passage of run-on lines can feel like speech that will not stop for punctuation.\n\nSecond effect: double reading. The end of an enjambed line can make momentary sense on its own before the next line revises it, so the reader holds one meaning for an instant and then replaces it. The reader experiences this as a small surprise, and the discarded first reading does not vanish — it colours the corrected one. A poet can use this to say two things with one phrase, which no unbroken sentence could do.\n\nThe two effects can operate together, but they are distinct: the first is about pace, the second about meaning.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"el_w1_05","topic":"Criticism","difficulty":"hard","question":"A reader argues: \"A text means whatever the reader takes it to mean. Since no two readers respond identically, there is no such thing as a wrong interpretation.\"\n\nWrite a response of about 350 words. You should:\n- identify what is right in the argument;\n- identify precisely where it goes too far;\n- distinguish between an interpretation being different and an interpretation being unsupported;\n- refer to at least one text you have studied.","explanation":"The instruction to identify what is right comes first for a reason. A response that opens by disagreeing has to spend the rest of its length defending a position it has already overstated, and it usually ends up claiming that texts have single fixed meanings — which is harder to defend than the view it set out to refute.\n\nThe decisive move is locating the exact step where the argument fails. It is not the premise (readers differ, which is true) and not the general direction (meaning involves the reader, also true) but the inference between them. Being able to point at one sentence and say \"this does not follow from that\" is what distinguishes a critical response from a disagreement.\n\nThe self-undermining point is worth having ready: any claim that no claim can be wrong applies to itself. Use it once and briefly — it is a clean observation, not a whole argument, and repeating it looks like a trick.\n\nThe textual reference is where most responses thin out. One specific example, with a line or a scene named, does more than a paragraph of general remarks about how interpretation works.","type":"long","referenceAnswer":"This task is self-assessed. What follows is what a strong response contains, so that you can compare your own work against it point by point.\n\nWhat is right in the argument. Meaning is not simply extracted from a text like a coin from a pocket; readers bring knowledge, experience and expectation, and these shape what they notice. Two readers of the same play will attend to different things and may reach different defensible readings. A text also outlives its author’s intentions, and later readers legitimately find in it what the author could not have meant. Conceding all of this early makes the rest of the response stronger, because it shows the objection is not being dodged.\n\nWhere it goes too far. The argument slides from \"readers differ\" to \"nothing constrains a reading\", and that step is unearned. Readers differ within limits set by the words on the page. A reading must account for what is there; where it ignores or contradicts the text, it is no longer an interpretation of that text but a substitution for it. The conclusion also undermines itself — if no interpretation can be wrong, this claim about texts cannot be wrong either, and the argument has removed the ground it stands on.\n\nDifferent versus unsupported. This is the distinction the argument collapses. Two readings of Macbeth — one that treats the witches as external agents, another that treats them as projections of an ambition already present — are different, and both can be argued from the text. A reading that holds Macbeth reluctant to the end is not different but unsupported, because the soliloquies show him deliberating and choosing. The test is not whether a reading is unusual but whether it survives contact with the evidence.\n\nA closing formulation. Texts underdetermine their meanings without abandoning them. There is a range of defensible readings, wider than a single \"correct\" answer and narrower than anything at all, and criticism is the activity of arguing within that range.\n\nCommon weaknesses: agreeing wholly with the reader, which leaves nothing to say; rejecting the argument outright and asserting one correct meaning, which is the opposite error; and referring to a text without quoting or citing anything specific, which leaves the crucial third point unevidenced.","markingScheme":"Self-assess against four areas. Nothing here is machine-marked; you decide where your work stands.\n\nEngagement with the argument — is the valid part conceded genuinely and early, or dismissed? Is the failing step located precisely, rather than the whole argument being rejected?\nThe central distinction — is \"different\" separated from \"unsupported\" with a criterion, namely whether the reading survives contact with the evidence?\nTextual support — is at least one text cited specifically, with a scene, speech or line that does actual work in the argument?\nWriting — about 350 words, one idea per paragraph, a position stated rather than circled.\n\nA fair self-check: could a reader who holds the opposite view read your response and recognise their own position in it before you answer it? If not, you have argued against a weaker opponent than the one the question set.\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":30,"trapTypes":null,"dnaTag":null,"mother":null}];

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "english-literature-written-b1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "english-literature-written-b1.decisions.json"; a.click();
});
counts();
</script></body></html>
