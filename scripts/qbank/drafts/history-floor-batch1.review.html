<script>
const DATA = [{"id":"hist_fl_so01","topic":"史料判讀","difficulty":"basic","question":"下列何者屬於研究 1930 年代香港社會的第一手史料？","options":["一齣 2010 年以 1930 年代香港為背景的電影","一份 2005 年出版的中學歷史教科書","1935 年香港政府發表的人口統計報告","一本 1990 年代出版的香港社會史專著"],"correctIndex":2,"explanation":"第一手史料指在事件發生的當時或由當事人所產生的材料。1935 年的官方統計報告正是在該時期產生，故屬第一手史料。其餘三者均為後人根據既有材料重新整理或創作而成，屬第二手材料；其中電影更經過藝術加工，須格外審慎。須留意：第一手不等於必然可靠，官方統計亦可能因統計方法或政治考慮而有偏差 —— 分辨一手與二手，只是判讀的第一步。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so02","topic":"史料判讀","difficulty":"basic","question":"歷史學家使用一份史料時，首先須確定的是甚麼？","options":["該史料是否經過翻譯以及譯本的出版年份","該史料的作者、產生時間及寫作目的","該史料的內容是否與現行教科書的敘述一致","該史料的篇幅長短及其行文是否流暢易讀"],"correctIndex":1,"explanation":"確定史料的來源（誰、何時、為何而寫）是判讀的起點，因為這三項直接決定該史料能回答甚麼問題、以及其局限所在。篇幅與可讀性與史料價值無關；而以「是否與教科書一致」為準更是本末倒置 —— 教科書本身即是根據史料寫成的第二手材料，若以它反過來裁決史料，等於取消了史料研究的意義。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so03","topic":"史料判讀","difficulty":"basic","question":"一份史料帶有明顯立場。對歷史學家而言，這意味著甚麼？","options":["該史料的價值取決於其立場是否合乎主流看法","該史料只可用於確立客觀事實，不可用於分析觀點","該史料完全不可信，凡帶立場者一律應予棄用","該史料仍有價值，因為它反映了持該立場者的想法"],"correctIndex":3,"explanation":"立場並非史料的缺陷，而是它所承載的資訊之一。一份帶有立場的材料未必能如實反映事件經過，卻能有效反映當時某一群體如何理解該事件 —— 這本身即是重要的歷史事實。因此不應棄用，而應調整所提的問題：由「事情如何發生」轉為「當時的人如何看待此事」。至於以之確立客觀事實，則正是帶立場史料最不可靠的用途。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so04","topic":"史料判讀","difficulty":"intermediate","question":"一名日本士兵於 1937 年寫給家人的私人書信，與同年日本官方發布的戰報相比，其史料價值的特點是甚麼？","options":["因只反映一名士兵所見的局部，故不具備史料價值","較少受官方宣傳規範，但仍受個人視角與戰時審查所限","因屬私人性質而不受規範，故其內容必然真實可靠","與官方戰報同樣經過審查，故兩者的價值完全相同"],"correctIndex":1,"explanation":"私人書信的長處在於它並非為公開宣傳而寫，故較少依循官方口徑。但兩項限制同時存在：一是視野有限，一名士兵所見僅為戰場一隅；二是戰時軍郵普遍設有審查，寫信者亦會自我約束。因此「私人即真實」是常見的誤解。至於認為單一視角毫無價值，則忽略了歷史研究正是靠多份局部材料互相參照而成。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so05","topic":"史料判讀","difficulty":"intermediate","question":"兩份來源不同的史料對同一事件的描述互相矛盾。歷史學家較恰當的處理是甚麼？","options":["採用成書時間較早的一份，因其距離事件較近","兩份一併棄用，改為只採信後世史家的研究結論","採用篇幅較長的一份，因其記述較為詳盡完整","分別考察兩者的來源與立場，並尋找其他史料印證"],"correctIndex":3,"explanation":"史料互相矛盾是常態而非例外。正確做法是先問「兩者分別由誰、為何而寫」，因為矛盾往往源自立場、位置或利害的差異，而非其中一方說謊。確定各自的局限之後，再以第三方材料互相印證。以成書早晚或篇幅長短作準，等於以與可信度無關的因素取代判斷；而兩份俱棄，則會令本可互相補足的材料一併流失。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so06","topic":"史料判讀","difficulty":"intermediate","question":"研究 1950 年代香港工業發展，一份當時工廠的工資紀錄冊最有助於回答下列哪一個問題？","options":["當時該廠工人的實際收入水平","港英政府的工業政策制定過程","香港工業品在海外市場的評價","工人對工作環境的主觀感受"],"correctIndex":0,"explanation":"史料判讀的核心，在於一份材料能回答甚麼問題，而非它是否「重要」。工資紀錄冊是廠方為結算而製的行政文件，故最能反映實際支付的工資數額。政策制定過程須查政府檔案；海外市場評價須查貿易或商會材料；工人的主觀感受則須靠口述歷史或私人紀錄 —— 三者皆非工資冊所能承載。須注意工資冊亦有其局限：未必記錄非正式用工或實物報酬。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so07","topic":"史料判讀","difficulty":"intermediate","question":"一幅政治漫畫作為史料，其主要價值在於甚麼？","options":["證明漫畫所繪的情節確曾實際發生","提供事件發生時的準確細節與具體經過","反映漫畫家及其預期讀者對事件的看法","提供不帶任何立場的中立客觀紀錄"],"correctIndex":2,"explanation":"政治漫畫以誇張、象徵與省略為手法，本質上是一種意見表達而非紀錄。故其價值不在於還原事實細節，而在於呈現當時的輿論氣氛：漫畫家選擇諷刺甚麼、假定讀者認得甚麼象徵，本身即反映該社會的共同認知。把漫畫所繪當成事實描述，是判讀此類史料最常見的失誤 —— 漫畫中出現的形象往往刻意失真，正是其表達手法的一部分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so08","topic":"史料判讀","difficulty":"intermediate","question":"某回憶錄由當事人於事發四十年後撰寫。此一時間距離對其史料價值的主要影響是甚麼？","options":["時間越久記憶越見沉澱，故回憶必然更為準確","記憶可能隨時間改變，且作者可能受其後的認識所影響","時間距離只影響文筆風格，對史料價值並無影響","回憶錄並非事發當時的紀錄，故根本不屬於史料"],"correctIndex":1,"explanation":"回憶錄的價值受兩重影響：一是記憶本身會隨時間淡化與重組；二是作者在其後四十年間會接觸到大量新資訊與新評價，這些認識可能無意中滲入其對當年的敘述，令回憶與後見之明混雜。這並不表示回憶錄不可用 —— 它仍是了解當事人如何理解自身經歷的重要材料，只是須與同期材料對照使用。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_so09","topic":"史料判讀","difficulty":"hard","question":"研究一場戰爭的死亡人數時，交戰雙方的官方公布數字往往差距甚大。歷史學家最恰當的做法是甚麼？","options":["採用戰勝一方所公布的數字，因其掌握較完整的戰場紀錄與後續統計","取雙方公布數字的平均值，以之作為較中立的結論","採用較低的一組數字，以免誇大戰爭的傷亡規模","並列雙方數字，說明各自的統計方法與可能動機，再參照第三方紀錄"],"correctIndex":3,"explanation":"數字上的分歧往往源於統計範圍不同（是否計入平民、失蹤者、戰後傷重不治者）以及各自的政治動機，而非單純的計算誤差。故取平均值只是把兩套不可比的口徑混在一起，得出一個誰都未曾主張過的數字。以勝方為準預設了勝方較誠實，並無根據；刻意取低則是以「審慎」之名作出另一個未經證實的判斷。恰當做法是把分歧本身呈現出來，並交代其成因。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si01","topic":"影響與意義評價","difficulty":"basic","question":"評價一項歷史事件的「意義」，主要是考察甚麼？","options":["該事件由開始至結束所持續的日數","該事件對其後發展所產生的影響及其持續程度","該事件發生時所涉及的人數與地域範圍","該事件在後世是否廣為人知並常被提及"],"correctIndex":1,"explanation":"「意義」是一個關於後果的概念：一件事是否重要，取決於它改變了甚麼、改變延續多久、以及影響及於多廣的範圍。規模大而後續影響有限的事件，意義未必高；規模小而觸發長遠轉變的事件，意義可以很大。至於是否為人熟知，反映的是後世的記憶與傳播，屬另一個問題 —— 知名度高低與歷史意義並不等同。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si02","topic":"影響與意義評價","difficulty":"basic","question":"聯合國成立的最主要意義在於甚麼？","options":["徹底消除了此後國與國之間的一切戰爭","使各成員國放棄本身的軍隊，並將兵力交由組織統一指揮","取代並解散了此前所有區域性國際組織","建立一個包含大國在內、常設的國際安全與合作機制"],"correctIndex":3,"explanation":"聯合國的意義在於制度層面：它提供了一個常設的、大國均參與其中的協商與集體安全機制，此點正是國際聯盟所欠缺的。評價其意義時須避免兩種極端：一是誇大為「消除戰爭」—— 戰後的地區衝突從未間斷；二是因其未能阻止衝突而全盤否定 —— 一個機制的價值不在於它是否萬能，而在於若無此機制，情況會否更差。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si03","topic":"影響與意義評價","difficulty":"basic","question":"香港於 1950 年代由轉口港轉向工業生產，其長遠意義在於甚麼？","options":["使香港即時取代倫敦成為國際金融中心","令香港的轉口貿易自此完全消失無存","使香港的經濟脫離對外部市場的依賴","為此後數十年的經濟結構與人口就業奠下基礎"],"correctIndex":3,"explanation":"此一轉向的長遠意義，在於它決定了此後數十年香港人口的就業形態、城市空間的分布，以至社會政策的走向。須留意三點常見的誇大：金融中心地位是 1970 年代之後逐步形成，並非即時出現；轉口貿易在工業化之後仍然存在，只是比重下降；而工業化本身即以出口為導向，對外部市場的依賴不減反增。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si04","topic":"影響與意義評價","difficulty":"intermediate","question":"有史家認為，第一次世界大戰的意義不止於戰場勝負。此說最有力的依據是甚麼？","options":["戰爭中出現了坦克、潛艇與毒氣等前所未見的新式武器","戰爭涉及歐洲以外的多個國家與殖民地","戰爭持續四年之久，遠超各方原先的預計","戰爭促成多個帝國瓦解、國際秩序重組與社會結構轉變"],"correctIndex":3,"explanation":"判斷一場戰爭的意義，須看它改變了甚麼結構，而非其軍事特徵。一戰之後，數個延續數百年的帝國解體，歐洲版圖重劃，新的國際機制出現，而女性大量進入生產部門亦推動了社會關係的轉變 —— 這些改變在戰爭結束後仍長期起作用。新式武器、持續年期與參戰國數目均屬戰爭本身的特徵，可說明其規模，卻不足以說明其後果。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si05","topic":"影響與意義評價","difficulty":"intermediate","question":"評價明治維新的意義時，只強調「日本富強」而不提其對外擴張，此一評價的主要問題是甚麼？","options":["只取其中一面，忽略了同一過程對鄰近地區所造成的後果","把明治維新與其後的大正時期完全混為一談","高估了明治維新推行各項制度改革所需要的實際時間長度","誇大了西方國家在明治維新之中所起的作用"],"correctIndex":0,"explanation":"同一段歷史過程對不同群體可以有完全不同的意義。明治維新使日本迅速工業化並躋身列強，此為事實；但同一過程亦以周邊地區為擴張對象，此亦為事實。只述其一而不及其二，並非事實錯誤，而是評價角度的殘缺 —— 評價歷史意義時，須交代「對誰而言」，否則一個群體的成就便會遮蓋另一個群體的代價。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si06","topic":"影響與意義評價","difficulty":"intermediate","question":"冷戰結束的意義，較全面的理解應包括甚麼？","options":["兩極格局終結，同時亦帶來新的地區衝突與秩序重整","所有社會主義國家在同一時間一併消失","美國自此不再介入其他國家的內部事務","世界自此再無任何形式的大規模國際武裝衝突發生"],"correctIndex":0,"explanation":"一個舊格局的結束並不等於問題的結束。冷戰終結固然解除了兩大陣營全面對抗的風險，但原被兩極結構壓抑的族群與地區矛盾隨即浮現，國際秩序亦須重新調整。評價任何「時代終結」時，須同時問「終結了甚麼」與「開啟了甚麼」，只答前者便會得出「從此天下太平」一類與史實不符的結論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si07","topic":"影響與意義評價","difficulty":"intermediate","question":"東南亞各國於第二次世界大戰後相繼獨立，此一過程的歷史意義在於甚麼？","options":["各國的經濟水平自此與前宗主國並駕齊驅而不再有差距","殖民體系瓦解，各國須自行處理建國、族群與發展等課題","各國自此斷絕與外國的一切經濟往來","殖民時期所遺留的一切影響即時消失"],"correctIndex":1,"explanation":"獨立的意義在於政治主權的轉移，以及隨之而來的責任轉移：殖民者留下的疆界、族群分布、經濟結構與行政體制並不會隨旗幟更換而消失，新政府須在這些既有條件之上建立國家認同並推動發展。把獨立理解為「一切重新開始」，便無法解釋為何多國於獨立後仍長期面對族群衝突與經濟依賴等問題。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_si08","topic":"影響與意義評價","difficulty":"intermediate","question":"判斷一項改革是否「成功」時，只以其有否達成當初宣稱的目標作準，可能出現甚麼問題？","options":["忽略了改革倡議者的個人生平、出身與學養","忽略了改革文件本身的篇幅、條文數目與行文體例上的差異","忽略了改革推行的確切年份及其先後次序安排","忽略了改革所產生的非預期後果及其對不同群體的不同影響"],"correctIndex":3,"explanation":"以宣稱目標為唯一標準，等於讓改革者自訂考卷。此一做法有兩重盲點：其一，重大改革幾乎必然產生倡議者未曾預見的後果，而這些後果有時比原定目標影響更深遠；其二，同一項改革對不同群體的影響可以相反 —— 對某一群體是成功，對另一群體可能是代價。故評價改革時，須同時問「達成了甚麼」、「另外造成了甚麼」以及「對誰而言」。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_ca01","topic":"因果分析・導火線與根源","difficulty":"basic","question":"歷史分析中，「導火線」與「根本原因」的分別在於甚麼？","options":["根本原因必定在導火線出現之後方才逐步形成，並於其後發揮作用","導火線是觸發事件的直接契機，根本原因是長期累積的結構性因素","導火線在解釋事件時必定比根本原因更為重要","兩者只是同一概念的不同稱呼，實質上並無分別"],"correctIndex":1,"explanation":"兩者的分別在於時間跨度與作用方式，而非重要程度。根本原因是長期積累、使事件成為可能的結構條件；導火線則是在既有條件之下把事件推向爆發的直接契機。一個常見誤解是以為導火線「較不重要」——事實上若無導火線，同樣的結構張力可能以另一種形式、於另一時間爆發；兩者是不同層次的解釋，缺一則因果鏈不完整。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_ca02","topic":"因果分析・導火線與根源","difficulty":"basic","question":"下列何者最適合稱為第二次世界大戰在歐洲爆發的「直接導火線」？","options":["1939 年德國入侵波蘭","1919 年《凡爾賽條約》的簽訂","1929 年開始的經濟大蕭條","1933 年希特拉出任德國總理"],"correctIndex":0,"explanation":"導火線須是在時序上緊接事件、並直接促成其爆發的具體行動。德國於 1939 年入侵波蘭，英法隨即對德宣戰，戰爭由此展開，符合此一定義。其餘三項均為時間上更早的因素：《凡爾賽條約》屬遠因，塑造了戰間期的德國處境；經濟大蕭條屬背景條件，助長了極端政治力量；希特拉上台則是關鍵的中介環節。三者皆重要，但都不是「直接」觸發點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_ca03","topic":"因果分析・導火線與根源","difficulty":"basic","question":"「經濟大蕭條導致納粹黨在德國崛起」一句，作為因果陳述的主要不足之處是甚麼？","options":["所述的兩項事件在史實上均不存在","把事件發生的先後時間次序完全弄錯","把一個涉及多項因素的過程簡化為單一原因","誤把事件的結果當成其原因來陳述"],"correctIndex":2,"explanation":"該句在時序與事實上均無錯誤 —— 經濟大蕭條確在納粹黨得票急升之前，而經濟崩潰亦確為其中一項重要因素。問題在於「導致」二字把一項條件寫成了充分原因：同期多國同樣遭遇經濟大蕭條而未出現同類結果，可見尚須配合威瑪政體的制度弱點、戰後的社會怨憤、各政治力量的策略選擇等因素，方能解釋為何德國走向此一結局。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_ca04","topic":"因果分析・導火線與根源","difficulty":"intermediate","question":"分析冷戰的起源時，若只歸因於「蘇聯的擴張野心」，其主要問題是甚麼？","options":["把冷戰的起訖年份及其主要階段的劃分弄錯","混淆了冷戰的長期對抗形態與第二次世界大戰期間的全面熱戰","過分高估核武器在冷戰形成過程之中的作用","只從一方視角出發，忽略了雙方互相猜疑與行動所形成的循環"],"correctIndex":3,"explanation":"單方歸因的問題不在於所述內容全屬虛構，而在於它把一個互動過程寫成單向行為。冷戰的形成過程中，雙方各自的防衞性舉措在對方眼中均構成威脅，從而引發進一步的戒備 —— 這種互相加強的循環，無法由任何一方的意圖單獨解釋。此一分析模式的更廣泛意義在於：凡涉及兩方或以上的長期對抗，只問「誰先起意」往往得不出完整答案。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_ca05","topic":"因果分析・導火線與根源","difficulty":"intermediate","question":"「若無某人，某事必不發生」一類的推論，在歷史因果分析中的主要限制是甚麼？","options":["它只適用於古代史而不適用於近現代史","它把事件的原因與結果的位置完全顛倒過來","它假定個人可以脫離當時的結構條件而獨力決定歷史走向","它在任何情況之下都必然低估個人在歷史之中所起的作用"],"correctIndex":2,"explanation":"此類推論並非全無價值 —— 設想「若無某人會如何」有助檢驗某一因素是否關鍵。其限制在於容易滑向另一極端：把個人抽離其所處的結構條件，彷彿同一人置於任何時代都能造成同樣結果。較穩妥的問法是：當時的結構條件容許哪些選擇？該人物的抉擇在這些條件之下起了多大作用？如此方能兼顧個人能動性與時代限制，而不偏廢其一。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_ca06","topic":"因果分析・導火線與根源","difficulty":"intermediate","question":"香港在第二次世界大戰後人口急增，最主要的直接原因是甚麼？","options":["港英政府主動招募海外移民","香港的出生率突然大幅上升","東南亞華人大規模遷入","內地局勢變動促使大量人口南遷"],"correctIndex":3,"explanation":"戰後香港人口在短時間內倍增，其規模與速度非自然增長所能解釋 —— 出生率的變化屬漸進，無法在數年之內造成如此幅度。主要來源是內地局勢變動所引致的大規模遷入。港英政府當時並無招募移民的政策，而東南亞華人遷港的規模亦遠不足以構成主因。此一人口變化同時是理解其後房屋、教育與工業勞動力等問題的起點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_ca07","topic":"因果分析・導火線與根源","difficulty":"intermediate","question":"分析日本在明治維新後迅速工業化的原因，較全面的說法應同時考慮甚麼？","options":["只考慮日本本土自然資源的豐富程度","只考慮西方國家所提供的技術與資金援助","政府主導的制度改革、既有的社會基礎，以及當時的國際環境","只考慮天皇個人的意志，以及他推行各項改革的決心與魄力"],"correctIndex":2,"explanation":"解釋一個大規模的社會轉型，通常須同時處理制度、社會與外部三個層面。明治政府主動推行的制度改革提供了方向與資源調配的能力；幕末已有的商業網絡、識字率與手工業基礎使改革有所憑藉；而當時列強忙於他處、日本得以爭取到相對從容的外部條件亦不可忽略。任何單因解釋都會留下無法回答的問題 ——例如若僅憑統治者意志即可成事，何以同期其他改革未見同樣結果。此外，日本自然資源並不豐富，該說法與史實不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_pw01","topic":"戰後衝突與聯合國","difficulty":"basic","question":"聯合國安全理事會五個常任理事國所擁有、而其他成員國並無的權力是甚麼？","options":["直接任免秘書長的權力","豁免繳交會費的權力","對實質議案的否決權","單方面修改憲章的權力"],"correctIndex":2,"explanation":"否決權是常任理事國的核心特權：任何一國反對，實質議案即無法通過。此一設計的用意在於確保大國留在體制之內，因為國際聯盟的失敗經驗顯示，缺少大國參與的機制形同虛設。但代價亦隨之而來 —— 凡涉及常任理事國本身利益的議題，安理會往往陷於癱瘓。秘書長由大會依安理會推薦任命，並非由五國直接任免；會費按各國能力分攤，常任理事國並無豁免；憲章修訂亦須經大會多數通過。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_pw02","topic":"戰後衝突與聯合國","difficulty":"basic","question":"與國際聯盟相比，聯合國在結構上的一項重要改進是甚麼？","options":["擁有一支屬於組織本身、毋須成員國同意即可隨時調動的常備軍隊","所有決議均須全體會員國一致通過方能生效","完全取消了大國在組織之中的一切特殊地位","主要大國自始參與，並設有可決議採取集體行動的安全理事會"],"correctIndex":3,"explanation":"國際聯盟的兩項結構弱點，一是美國始終未加入、其後多國退出，二是重要決議須全體一致，令任何一國即可癱瘓議程。聯合國在這兩點上作出調整：主要大國自始參與，而安理會可依多數決通過集體行動，不再要求全體一致。須注意的是，聯合國並未取消大國特權，反而以否決權將其制度化；亦從無自己的常備軍隊，維和部隊須由成員國提供。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_pw03","topic":"戰後衝突與聯合國","difficulty":"basic","question":"「冷戰」一詞所指的是甚麼？","options":["美蘇兩大陣營之間長期的全面對峙，而未直接爆發全面戰爭","聯合國成立之前，各國之間互不往來而各自為政的國際局勢","第二次世界大戰期間盟軍陣營內部的路線分歧","一場在氣候寒冷的高緯度地區進行的長期戰爭"],"correctIndex":0,"explanation":"「冷」字所指的並非氣候，而是對抗的形式：雙方在軍事、經濟、意識形態、外交以至科技各方面全面較量，卻始終避免兩國之間的直接全面戰爭。須留意「未直接爆發全面戰爭」不等於「沒有戰爭」——冷戰期間的地區衝突為數不少，兩大陣營往往透過支持不同一方而間接參與其中。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_pw04","topic":"戰後衝突與聯合國","difficulty":"intermediate","question":"韓戰爆發初期，安全理事會之所以能夠通過組成聯合國軍的決議，主要原因是甚麼？","options":["蘇聯經權衡之後投票贊成該項決議","該項決議已預先取得全體常任理事國的一致贊成","蘇聯當時正杯葛安理會會議而未有出席行使否決權","該項決議屬程序事項而毋須安理會通過"],"correctIndex":2,"explanation":"此事最能說明否決權在實際運作中的關鍵作用。按常規，蘇聯必然否決此類決議；但蘇聯當時因中國代表權問題杯葛安理會，缺席之下決議得以通過。這既顯示制度設計的效力取決於各方是否在場行使權利，亦解釋了何以此後同類的集體行動極為罕見 ——蘇聯此後不再重複同一做法。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_pw05","topic":"戰後衝突與聯合國","difficulty":"intermediate","question":"古巴導彈危機最終得以化解，反映冷戰時期的一項重要特點是甚麼？","options":["聯合國以決議成功強制雙方同時撤走軍備","雙方在核戰邊緣仍保留溝通渠道並願意尋求妥協","雙方經此一役已完全消除彼此之間的敵意","美蘇隨即簽訂全面裁減核武器的正式條約"],"correctIndex":1,"explanation":"此次危機的意義，在於它顯示雙方雖然全面敵對，卻同時明白核戰爭並無勝方，因而在最緊張的時刻仍維持接觸並各自作出讓步。危機之後雙方設立直接通訊聯繫，正是把這次經驗制度化。須避免兩種誤讀：一是以為敵意就此消除 —— 對抗其後持續數十年；二是把功勞歸於聯合國 —— 化解主要靠美蘇之間的直接交涉。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_pw06","topic":"戰後衝突與聯合國","difficulty":"intermediate","question":"聯合國維持和平行動的一項固有限制是甚麼？","options":["自成立以來從未實際派出過任何維和部隊","依據憲章規定只可在歐洲地區範圍內行動","每次行動均須經全體會員國一致通過之後方可正式展開","須經有關方面同意並依賴成員國提供部隊，故難以強制執行"],"correctIndex":3,"explanation":"維和行動的限制源於其性質：它建基於當事方的同意，且所有部隊均由成員國自願提供，聯合國本身並無可調動的常備武力。故當一方不再合作、或成員國不願派兵時，行動即難以推進。這說明維和機制較適用於監督已達成的停火，而非強行終止進行中的戰鬥 ——把兩者混為一談，往往是評價維和成效時失準的起點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_pw07","topic":"戰後衝突與聯合國","difficulty":"hard","question":"有評論指聯合國「既是舞台，也是工具」。此說最恰當的理解是甚麼？","options":["它完全獨立於成員國的意志之外，可自行作出決策並直接付諸執行","它既提供各國表達立場與協商的場合，其決議亦受大國實力關係所左右","它可以直接統治成員國，並凌駕於各國法律之上","它的唯一功能是舉辦會議，並不產生任何實際效果"],"correctIndex":1,"explanation":"「舞台」指其作為公開場合的功能：各國須在此表態，而表態本身即產生外交後果，即使議案未獲通過。「工具」則指其決議可被用以推進特定國家的目標，故決議內容往往反映當時的實力對比。兩者並不矛盾，而是同一機構的兩面。把聯合國理解為超然於成員國之上的權威，或反過來貶為純粹的清談場所，都只看到其中一面。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_hk01","topic":"香港的現代化與蛻變","difficulty":"basic","question":"香港在 1950 年代經濟結構的主要轉變是甚麼？","options":["由以漁業為主轉向以農業為主","由以製造業為主轉向以金融服務為主","由以農業為主轉向以轉口貿易為主","由以轉口貿易為主轉向以製造業為主"],"correctIndex":3,"explanation":"香港長期以轉口貿易為經濟支柱。1950 年代初對外貿易環境變化，轉口業務大幅收縮，本地遂轉向製造業，以紡織製衣為先導，逐步發展出以出口為導向的工業體系。此一轉變之所以可能，與同期大量人口南遷所帶來的勞動力及資金有直接關係。須留意由製造業轉向金融服務屬 1980 年代之後的事，兩次轉型不可混為一談。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_hk02","topic":"香港的現代化與蛻變","difficulty":"intermediate","question":"1953 年石硤尾寮屋區大火之後，港英政府在政策上出現的重要轉變是甚麼？","options":["開始徵收利得稅以填補救災所造成的財政缺口","全面禁止內地人士入境以控制人口進一步增加","開始大規模興建徙置屋邨，由政府直接介入房屋供應","即時推行免費普及教育以取代原有的學費制度"],"correctIndex":2,"explanation":"大火令數萬人一夜之間失去居所，政府原本盡量不介入房屋市場的立場因而難以維持，遂展開徙置屋邨的興建，此為香港公營房屋制度的起點。此事的意義不止於房屋本身 ——它標誌著政府角色由消極轉為主動介入社會事務。免費普及教育屬 1970 年代之後的政策，兩者相隔約二十年，不應歸於同一事件的後果。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_hk03","topic":"香港的現代化與蛻變","difficulty":"intermediate","question":"1970 年代港英政府推行多項社會改革（房屋、教育、廉政等），其背景包括甚麼？","options":["香港人口在該十年間因外移而大幅下降","英國政府決定即時給予香港獨立，並已着手安排政權交接","中英兩國當時已就香港前途問題達成協議","社會事件之後管治壓力上升，同時經濟增長提供了財政條件"],"correctIndex":3,"explanation":"1970 年代的改革須同時由兩方面理解。一方面，1960 年代的社會事件暴露了管治與民生上的積累問題，令政府面對回應訴求的壓力；另一方面，經濟持續增長使庫房有能力承擔大規模社會開支 ——缺少後者，改革即使有意亦難以落實。須注意中英就香港前途的談判始於 1980 年代，在時序上不能作為 1970 年代改革的背景。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_hk04","topic":"香港的現代化與蛻變","difficulty":"intermediate","question":"總督特派廉政專員公署於 1974 年成立，其設立所針對的核心問題是甚麼？","options":["政府稅收長期不足，未能支持房屋與教育等各項開支","公營部門貪污嚴重，而既有的內部監察機制未能奏效","房屋供應嚴重短缺而輪候時間不斷延長","教育水平偏低而未能配合工業發展所需"],"correctIndex":1,"explanation":"成立廉署的關鍵，不僅在於當時貪污嚴重，更在於原先由警隊內部處理貪污的安排已失去公信力。故新機構的設計重點是【獨立於既有部門之外】、直接向總督負責，此一制度安排本身即是對舊機制失效的回應。房屋與教育在同期亦屬重大課題，但各有其專責部門與政策，並非廉署的設立目的。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_hk05","topic":"香港的現代化與蛻變","difficulty":"intermediate","question":"香港自 1980 年代起工業北移，對本地經濟結構的主要影響是甚麼？","options":["本地人口因就業機會減少而大幅下降","本地製造業就業萎縮，服務業所佔比重上升","本地製造業與服務業兩者同時大幅萎縮","本地轉口貿易自此完全停止而不再恢復"],"correctIndex":1,"explanation":"工業生產環節北移之後，本地製造業職位大幅減少，而與生產相關的管理、金融、貿易及物流等服務需求則相應增加，服務業比重因而上升。值得注意的是，轉口貿易並未消失，反而因兩地分工而重新活躍 ——香港轉為承擔貿易、融資與航運的角色。故此一轉變並非「衰落」，而是分工位置的改變。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_hk06","topic":"香港的現代化與蛻變","difficulty":"hard","question":"有論者認為，戰後香港的社會政策發展並非單純出於施政善意。此說的主要依據是甚麼？","options":["所有政策均由英國政府直接指令推行，本地官員完全並無參與制定","政策推行之後對一般市民毫無任何實際的幫助","政策全部由商界主導制定，政府只負責執行程序","多項政策在社會壓力或危機之後推出，兼具回應訴求與穩定管治的作用"],"correctIndex":3,"explanation":"此一論點的依據在於政策推出的時序：公營房屋始於一場大火之後，多項社會改革繼社會事件而來，廉署則在管治威信受質疑之際成立。這種「事件在前、政策在後」的規律，顯示政策同時具有回應訴求與鞏固管治的雙重作用。須留意此說並非否定政策的實際成效 ——指出動機複雜，與承認市民確有得益，兩者並不矛盾；把「動機不純」推論為「毫無幫助」，反而是另一種簡化。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_se01","topic":"東南亞：由殖民地到獨立國家","difficulty":"basic","question":"第二次世界大戰之前，東南亞唯一未曾淪為歐美殖民地的國家是哪一個？","options":["菲律賓（呂宋）","越南（安南）","泰國（暹羅）","印尼（荷屬東印度）"],"correctIndex":2,"explanation":"泰國得以維持形式上的獨立，主要因其位處英國與法國兩大殖民勢力範圍之間，成為雙方之間的緩衝地帶，同時其統治者亦主動推行改革並在外交上作出讓步。須留意「未淪為殖民地」不等於未受影響 ——泰國仍曾割讓邊緣領土並簽訂不平等條約。越南由法國統治，印尼由荷蘭統治，菲律賓則先後受西班牙及美國統治。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_se02","topic":"東南亞：由殖民地到獨立國家","difficulty":"intermediate","question":"日本於第二次世界大戰期間佔領東南亞，對戰後該區獨立運動的影響是甚麼？","options":["對戰後各地的獨立運動並無產生任何實質影響","打破了歐美殖民者不可戰勝的形象，並使本地武裝與政治組織得以壯大","令歐美殖民統治的威信在戰後反而更為鞏固","使各地既有的獨立運動在佔領期間完全停頓，戰後須由頭重新組織"],"correctIndex":1,"explanation":"日本迅速擊敗當地歐美殖民軍隊，在觀感上瓦解了殖民統治不可動搖的印象；佔領期間為便於統治而扶植的本地組織與武裝，亦在戰後成為獨立運動的骨幹。須同時指出，日本佔領本身亦施行嚴苛統治並造成重大苦難，故其作用是客觀後果而非主觀恩惠 ——把它說成「協助獨立」是嚴重的誤讀。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_se03","topic":"東南亞：由殖民地到獨立國家","difficulty":"intermediate","question":"印尼於 1945 年宣布獨立後仍須經歷數年鬥爭方獲承認，主要原因是甚麼？","options":["荷蘭試圖恢復殖民統治，雙方發生武裝衝突及外交角力","印尼社會內部並無獨立意願，宣言只屬少數人主張","聯合國明確反對印尼獨立並拒絕承認其地位","日本拒絕依約撤出印尼並繼續維持軍事佔領"],"correctIndex":0,"explanation":"日本投降後，印尼隨即宣布獨立，但荷蘭並不承認，並試圖以武力重建殖民統治，雙方遂爆發長達數年的武裝衝突。最終促成承認的並非單一因素，而是本地持續抵抗加上國際輿論與外交壓力共同作用的結果。此例說明「宣布獨立」與「取得獨立」之間往往有相當距離 ——前者是單方面聲明，後者須有實力與外部承認為支撐。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_se04","topic":"東南亞：由殖民地到獨立國家","difficulty":"intermediate","question":"東南亞國家獨立之後普遍面對的共同課題包括甚麼？","options":["人口過少而勞動力不足，難以支撐獨立後的工業發展","缺乏任何形式的行政體系，須由零開始建立","建立統一的國家認同、整合多元族群，以及發展本國經濟","完全沒有可供出口的資源，難以賺取外匯"],"correctIndex":2,"explanation":"殖民時期所劃定的疆界往往不按族群或歷史脈絡而定，故新國家內部普遍存在多元族群與宗教，如何建立共同的國家認同成為首要課題。同時，殖民經濟多以出口單一初級產品為主，獨立後須調整此一結構方能自立。須注意殖民統治確實留下了行政體系與基礎建設，問題在於這些體制原為殖民管治而設，未必切合獨立國家的需要 —— 這與「完全沒有」是兩回事。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_se05","topic":"東南亞：由殖民地到獨立國家","difficulty":"intermediate","question":"東南亞國家聯盟於 1967 年成立時的主要考慮是甚麼？","options":["把各成員國逐步合併成為一個單一的聯邦國家","組成一個共同的軍事同盟，以便一致參與冷戰對抗","統一各成員國的貨幣，以建立單一的區內市場","在冷戰格局之下促進區內合作與穩定，減少外部勢力介入"],"correctIndex":3,"explanation":"東盟成立於冷戰高峰期，區內衝突不斷、外部勢力介入頻繁。創始成員的共同考慮，是透過區域合作減低彼此摩擦，並在大國角力之間保持一定自主。故其初期性質是政治協商多於經濟整合，亦刻意避免成為軍事同盟 ——正因結成同盟便等於選邊，反而會把區域捲入對抗。貨幣統一與國家合併從不在其目標之列。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_fl_se06","topic":"東南亞：由殖民地到獨立國家","difficulty":"hard","question":"比較東南亞各國的獨立過程，一個較準確的概括是甚麼？","options":["各國均經歷長期武裝鬥爭之後方才取得獨立","各國因宗主國態度與本地力量的差異，獨立的方式與代價各不相同","各國均以和平談判的方式，從原宗主國手中順利取得完整獨立","各國均在戰後同一年之內先後宣告獨立"],"correctIndex":1,"explanation":"比較題的關鍵，在於辨別哪些是共同之處、哪些是差異。各國的共同點在於同處去殖民化的大潮之中；差異則在於過程 ——宗主國是否願意撤出、本地是否已有組織化的政治或武裝力量、以及冷戰形勢是否令外部勢力介入，三者組合不同，結果由相對和平的權力移交到長期戰爭皆有。凡以「均」、「全部」概括一組差異甚大的個案，通常都是可以被反例推翻的。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "history-floor-batch1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "history-floor-batch1.decisions.json"; a.click();
});
counts();
</script></body></html>
