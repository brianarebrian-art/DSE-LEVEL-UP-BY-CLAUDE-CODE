<script>
const DATA = [{"id":"hist_floor_01","topic":"第一次世界大戰","difficulty":"basic","question":"一九一四年，奧匈帝國皇儲斐迪南在塞拉耶佛遇刺。這件事在一戰的成因之中屬於哪一類？","options":["導火線 —— 觸發戰爭的即時事件","長遠成因 —— 積累多年的結構因素","戰爭的結果之一","戰後和約的其中一項條款"],"correctIndex":0,"explanation":"成因分析須分層：長遠成因（軍備競賽、結盟對峙、帝國爭奪、民族主義）積累多年，導火線則是使積累爆發的那一刻。遇刺本身若無此前的結盟體系，未必會演成全面戰爭 —— 這正是兩者的分別。答卷二論述題時把兩者混為一談，是最常見的失分位。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_02","topic":"第一次世界大戰","difficulty":"basic","question":"一戰前歐洲形成兩大對立陣營。以下哪一項正確描述其中一方？","options":["兩大陣營均由美國牽頭組成","三國同盟由德國、奧匈帝國及意大利組成","三國同盟由英國、法國及俄國組成","三國協約由德國、日本及意大利組成"],"correctIndex":1,"explanation":"三國同盟為德、奧、意；三國協約為英、法、俄。留意兩處易錯：意大利雖屬同盟，開戰後卻轉投協約一方；而德、日、意的組合是【二戰】的軸心國，與一戰陣營相差二十餘年。時序與陣營錯配，是本課最常見的錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_03","topic":"第一次世界大戰","difficulty":"basic","question":"一戰後召開的巴黎和會，其主要工作是甚麼？","options":["劃分非洲殖民地的勢力範圍","成立聯合國並設立安全理事會","處理戰敗國問題並重訂戰後國際秩序","商議如何聯合對抗蘇聯的擴張"],"correctIndex":2,"explanation":"和會處置戰敗國、重劃疆界、訂立賠償，並成立【國際聯盟】。留意聯合國與安全理事會是【二戰】之後的產物，兩個組織相差二十餘年；而劃分非洲殖民地主要是十九世紀末柏林會議的事。分清哪個會議做了哪件事，是這一課的基本功。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_04","topic":"第一次世界大戰","difficulty":"basic","question":"國際聯盟成立之後，在維持和平方面的一項根本弱點是甚麼？","options":["成員國數目太多，無法達成任何決議","總部設於美國，令歐洲國家不願參與","只處理經濟問題，不涉及和平事務","缺乏獨立的執行力量，制裁須靠成員國自願配合"],"correctIndex":3,"explanation":"國聯無常備部隊，制裁能否奏效全繫於成員國是否願意承擔代價；加上若干主要強國始終未有參與或中途退出，威懾力更形不足。留意國聯總部設於【日內瓦】而非美國 —— 美國雖由其總統倡議成立，卻始終未加入，這一點本身就是它的弱點之一。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_05","topic":"第一次世界大戰","difficulty":"basic","question":"「軍備競賽」被列為一戰的長遠成因之一。它如何增加開戰的風險？","options":["各國互相戒懼並依賴既定動員時間表，令危機一起便難以收手","武器產量過剩，各國必須開戰以消耗庫存","軍費開支令各國財政破產，被迫以戰爭解決","各國同意以軍備規模決定殖民地的分配"],"correctIndex":0,"explanation":"軍備競賽的危險不在武器本身，而在它造成的兩種後果：一是安全困境 —— 一方擴軍，另一方視為威脅而跟着擴軍；二是動員時間表一旦啟動便難以中止，令外交迴旋的時間急速壓縮。理解「機制」而非只記住「有軍備競賽」，才答得到卷二的因果題。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_06","topic":"第二次世界大戰","difficulty":"basic","question":"以下哪一項是第二次世界大戰在歐洲爆發的直接事件？","options":["德國吞併奧地利","德國入侵波蘭","日本進攻珍珠港","奧匈皇儲在塞拉耶佛遇刺"],"correctIndex":1,"explanation":"德國入侵波蘭之後，英法對德宣戰，歐洲戰事全面展開。留意三個干擾項都是真實史事，只是位置不同：珍珠港事件令戰事擴及太平洋，屬其後；塞拉耶佛遇刺是【一戰】的導火線；吞併奧地利是開戰之前的擴張步驟。把「真實但屬別的時間」的事排好次序，正是這類題目要練的。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_07","topic":"第二次世界大戰","difficulty":"basic","question":"一九三○年代英法對德國的擴張採取「綏靖政策」。這項政策的內容是甚麼？","options":["與蘇聯結盟共同包圍德國","全面封鎖德國的對外貿易","以讓步滿足其部分要求，希望藉此避免戰爭","立即以武力制止其一切擴張行動"],"correctIndex":2,"explanation":"綏靖的邏輯是：若干要求或屬合理，滿足之可換取和平。慕尼黑協定是其代表。它失敗的原因不在動機而在判斷 —— 讓步被理解為軟弱，反而助長了下一步要求。評價綏靖時，宜同時指出當時的處境（一戰記憶猶新、軍備未足）與其後果，避免只作事後苛責。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_08","topic":"第二次世界大戰","difficulty":"basic","question":"第二次世界大戰結束之後成立的聯合國，其安全理事會有一項與國際聯盟不同的設計。這項設計是甚麼？","options":["全部決議須經全體成員一致通過","設有直屬的常備軍可隨時出兵","禁止任何成員國保有軍隊","設常任理事國並賦予否決權，令主要強國留在體系之內"],"correctIndex":3,"explanation":"否決權常被視為聯合國的缺陷 —— 涉及強權利益的爭端幾乎必然僵持。但它同時是設計上的取捨：正因為大國知道自身利益不會被表決推翻，才願意留在體系之內，避免重蹈國聯主要強國缺席的覆轍。評價一項制度，宜同時看它換取了甚麼。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_09","topic":"第二次世界大戰","difficulty":"basic","question":"第二次世界大戰對殖民地的一項重要影響是甚麼？","options":["歐洲宗主國實力大減，殖民地爭取獨立的機會隨之增加","歐洲宗主國取得更多殖民地，統治更為穩固","殖民地經濟全面工業化，不再依賴宗主國","各殖民地在戰後即時同時宣布獨立"],"correctIndex":0,"explanation":"戰爭嚴重削弱了歐洲各國的財政與軍事能力，維持殖民統治的成本上升而收益下降；同時戰時的佔領與動員亦令殖民地的政治組織成長。但獨立並非同時發生，各地時序與方式差異極大 —— 有的經談判移交，有的經長期武裝衝突。把「機會增加」誤讀為「即時同時獨立」，是常見的過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_10","topic":"第二次世界大戰","difficulty":"basic","question":"「閃電戰」是二戰初期德國採用的作戰方式。它的特點是甚麼？","options":["以游擊方式在敵後長期騷擾","集中裝甲部隊與空軍快速突破，速戰速決","雙方在戰壕之中長期對峙消耗","以海上封鎖迫使對方投降"],"correctIndex":1,"explanation":"閃電戰以裝甲與空中力量配合，追求在對方完成動員之前決出勝負。它與一戰的戰壕戰形成鮮明對照 —— 後者正是因為防守優於進攻而陷入長期消耗。兩種戰法的分別，反映了二十年間軍事技術與戰術思想的改變，是比較題的好材料。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_11","topic":"冷戰","difficulty":"basic","question":"「冷戰」一詞用以形容二戰後美蘇之間的對抗。何以稱為「冷」戰？","options":["雙方關係冷淡但從無任何衝突","戰爭只在冬季進行","兩國之間並無直接的全面武裝衝突，對抗以其他方式進行","對抗主要發生在北極等寒冷地區"],"correctIndex":2,"explanation":"「冷」是相對於「熱戰」而言：美蘇之間並無直接開戰，對抗改以軍備競賽、意識形態宣傳、經濟援助、情報活動，以及在第三地區的代理衝突進行。留意「無直接衝突」不等於「無衝突」—— 韓戰、越戰等局部戰爭正是這種對抗的表現形式。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_12","topic":"冷戰","difficulty":"basic","question":"以下哪一項是冷戰時期美國與蘇聯各自建立的軍事集團？","options":["國際聯盟與聯合國","三國同盟與三國協約","東南亞國家聯盟與歐洲共同體","北大西洋公約組織與華沙條約組織"],"correctIndex":3,"explanation":"北約由美國牽頭，華約由蘇聯牽頭，兩者是冷戰兩極結構的軍事支柱。三個干擾項都是真實組織，但性質與時期各異：國聯與聯合國是全球性和平組織，三國同盟／協約屬一戰前的歐洲陣營，東盟與歐共體則是區域合作組織。分清「軍事集團」與「合作組織」，是答此類題目的關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_13","topic":"冷戰","difficulty":"basic","question":"冷戰時期所謂「代理戰爭」，指的是甚麼？","options":["美蘇透過支持第三地的對立勢力而間接較量","美蘇兩國元首親自率軍作戰","由聯合國代替雙方進行談判","雙方委託中立國代為宣戰"],"correctIndex":0,"explanation":"代理戰爭的特點是：出錢、出武器、出顧問，但不直接交戰，使衝突可控而不致升級為全面戰爭。理解這個機制，就明白何以冷戰期間局部戰爭不斷，而美蘇本土始終未有交火 —— 「冷」與「熱」在同一段歷史中並存，只是發生在不同的地方。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_14","topic":"冷戰","difficulty":"basic","question":"冷戰結束的一項標誌性事件是甚麼？","options":["馬歇爾計劃實施","蘇聯解體","古巴導彈危機","韓戰爆發"],"correctIndex":1,"explanation":"蘇聯解體標誌兩極結構終結。留意三個干擾項都是冷戰【期間】的重要事件，位置不同：馬歇爾計劃屬冷戰初期的經濟手段，韓戰是早期的代理衝突，古巴導彈危機是對峙的高峰。把冷戰的起、中、終三段事件排好次序，是這一課的基本要求。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_15","topic":"冷戰","difficulty":"basic","question":"「緩和」（détente）指冷戰之中的哪一種狀態？","options":["冷戰最緊張、瀕臨開戰的時期","蘇聯完全退出國際事務的時期","美蘇緊張關係相對放鬆、雙方展開談判的時期","美蘇正式結為軍事同盟的時期"],"correctIndex":2,"explanation":"緩和期出現軍備控制協議與高峰會談，戰爭風險下降。但緩和不等於對抗結束 —— 軍備競賽轉入受限制的軌道，雙方在第三地區的競爭仍然持續，其後亦迅速逆轉。答卷二題目時若把緩和寫成冷戰的終結，就混淆了兩個不同階段。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_16","topic":"極權主義興起","difficulty":"basic","question":"一九三○年代的經濟大蕭條，如何有助於極權政權在若干國家取得支持？","options":["各國經濟繁榮，人民有餘裕支持新的政治實驗","國際貿易大幅增加，各國需要強力政府協調","各國議會運作順暢，主動邀請軍方接管","大量失業與生活困頓，令承諾迅速恢復秩序的主張更具吸引力"],"correctIndex":3,"explanation":"經濟危機削弱了人們對既有政治制度解決問題的信心；當議會爭論不休而失業持續，承諾「立刻見效」的主張便顯得可信。理解這條路徑，就明白極權的興起不能只歸因於個別領袖的野心 —— 沒有使人願意接受的條件，野心也無從實現。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_17","topic":"極權主義興起","difficulty":"basic","question":"極權政權在取得政權之後，通常會採取以下哪一項措施以鞏固統治？","options":["控制傳媒與教育，統一對外發布的訊息","擴大議會權力並鼓勵反對黨發展","把行政權力下放予地方自治團體","取消一切軍事與警察機構"],"correctIndex":0,"explanation":"控制資訊是這類政權的共通做法：傳媒統一口徑、教育由小培養認同、異見受壓制。理解「共通做法」的好處，是可以用同一組指標去比較不同政權，而不必逐個死記 —— 卷二比較題正正要求這種可移植的分析框架。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_18","topic":"極權主義興起","difficulty":"basic","question":"「一黨專政」的基本特徵是甚麼？","options":["政黨不參與政治，只負責社會服務","只容許一個政黨合法存在並掌握政權","多個政黨輪流執政但政策相同","由軍方與政黨共同組成聯合政府"],"correctIndex":1,"explanation":"一黨專政之下，其他政黨或被取締、或名存實亡，政權與政黨高度重疊。它與「多黨制中某黨長期執政」有本質分別 —— 後者仍容許合法的反對力量存在。作答時把「事實上長期執政」與「制度上禁止其他政黨」分清楚，判斷才準確。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_19","topic":"極權主義興起","difficulty":"basic","question":"二十世紀初日本軍國主義興起，與以下哪一項國內條件關係最直接？","options":["日本並無常備軍，須臨時徵集","天皇明令禁止軍人參與政治","軍部在憲政架構中地位特殊，文人政府難以有效制衡","議會擁有絕對權力，可隨時解散軍隊"],"correctIndex":2,"explanation":"軍部可以繞過內閣直達最高決策，加上陸海軍大臣的任命慣例足以令內閣倒台，文人政府缺乏有效的制衡手段。制度上的缺口，令經濟與社會不滿可以直接轉化為對外行動，而非停留在國內爭論 —— 這正是「制度條件」比「個別野心」更能解釋歷史的例子。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_20","topic":"國際合作","difficulty":"basic","question":"二戰後歐洲經濟一體化的起步階段，採取的做法是甚麼？","options":["一次過成立單一國家，取消所有成員國政府","先統一貨幣，再商討貿易安排","由聯合國指定成員國強制加入","先就特定產業建立共同管理，再逐步擴展至更廣範圍"],"correctIndex":3,"explanation":"一體化的路徑是由小而大：先把最容易引發衝突的產業置於共同管理之下，再擴展至關稅同盟、共同市場以至更深的政策協調。這種次序的好處是每一步都建基於前一步的成果，令合作有機會累積。留意單一貨幣是【後期】的事，並非起點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_21","topic":"國際合作","difficulty":"basic","question":"二戰之後，美國對西歐提供大規模經濟援助。這項援助的名稱是甚麼？","options":["馬歇爾計劃","凡爾賽條約","門羅主義","大西洋憲章"],"correctIndex":0,"explanation":"馬歇爾計劃在西歐重建中提供資金與物資，並附帶推動受援國之間經濟協調的條件。三個干擾項都是真實文件或政策，但性質完全不同：凡爾賽條約是一戰後的和約，門羅主義是十九世紀美國對美洲的外交立場，大西洋憲章是二戰期間的戰爭目標宣言。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_22","topic":"國際合作","difficulty":"basic","question":"聯合國轄下的專門機構（例如世界衞生組織）主要負責甚麼？","options":["決定安全理事會常任理事國的席位","在特定技術範疇推動跨國合作與制訂共同標準","指揮聯合國的維持和平部隊","審理各國之間的領土爭議"],"correctIndex":1,"explanation":"專門機構把合作延伸至衞生、教育、勞工、氣象等技術範疇。這類合作的特點是：即使政治關係緊張，各國仍有實際誘因參與 —— 疾病與氣象不受國界限制。理解這一點，就明白何以冷戰期間政治對峙，技術合作卻未曾中斷。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_23","topic":"國際合作","difficulty":"basic","question":"「集體安全」的基本構想是甚麼？","options":["由最強的國家單獨負責維持世界秩序","各國同意在受侵略時保持中立","各國共同承諾，任何一國受侵略時其餘各國一同回應","各國各自擴充軍備以自保"],"correctIndex":2,"explanation":"集體安全的邏輯是以「群體回應」嚇阻侵略：侵略者面對的不是單一對手，而是整個體系。它與各自擴軍的均勢邏輯不同，亦與由單一強國維持秩序的做法不同。它的弱點在於執行 —— 需要各國願意為別國承擔代價，而這一點在兩次大戰之間正正做不到。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_24","topic":"中國現代化","difficulty":"basic","question":"洋務運動的基本主張，可以「中學為體、西學為用」概括。這句話的意思是甚麼？","options":["全面採用西方制度，放棄中國傳統","拒絕一切西方事物，只依靠中國固有辦法","把中國的學問輸出到西方","保留中國原有的制度與價值，只在技術器物層面學習西方"],"correctIndex":3,"explanation":"「體」指根本，「用」指應用。洋務派認為制度與價值不必改，只要學到船堅炮利即可自強，故所辦的是船政局、機器局一類事業。甲午戰敗令這條路線受到根本質疑：若制度不變，單靠器物是否足以自強？其後的維新與革命，都是對這個問題的不同回答。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_25","topic":"中國現代化","difficulty":"basic","question":"戊戌變法與辛亥革命在政治主張上有一項根本分別。這項分別是甚麼？","options":["前者主張保留皇室推行立憲，後者主張推翻帝制建立共和","前者主張推翻帝制，後者主張恢復帝制","兩者主張完全相同，只是領導者不同","前者只涉軍事改革，後者只涉經濟改革"],"correctIndex":0,"explanation":"改良與革命的分野，在於是否保留既有政權：維新派要在皇室之下改制，革命派則認為制度的問題出在帝制本身。這一組區分是理解晚清政治的主軸 —— 同樣不滿現狀、同樣要求變革，路徑卻不同，最終結果亦不同。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_26","topic":"中國現代化","difficulty":"basic","question":"一九七八年之後中國推行改革開放。以下哪一項是這個時期的重要措施？","options":["發動大躍進，以全民煉鋼追趕產量","設立經濟特區，引入外資與較靈活的用工制度","成立人民公社，把農業生產全面集體化","推行第一個五年計劃，集中發展重工業"],"correctIndex":1,"explanation":"三個干擾項都是真實政策，但全部屬於一九七八年【之前】：一五計劃在五十年代，人民公社與大躍進在五十年代末。把改革開放的措施與此前的計劃經濟措施排好時序，是本課最基本的要求 —— 時序錯了，因果分析必然跟着錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_27","topic":"中國現代化","difficulty":"basic","question":"五四運動在中國現代化進程之中，最主要的影響屬於哪一個層面？","options":["領土層面 —— 收回了全部租界與割地","貨幣層面 —— 統一了全國的幣制","思想文化層面 —— 推動新思想傳播並改變知識表達的方式","軍事層面 —— 建立了新式陸軍與海軍"],"correctIndex":2,"explanation":"白話文的推廣降低了知識傳播的門檻，新思想得以越出士人階層；同時運動催生了新的政治組織與動員方式。留意它並未直接解決領土或軍事問題 —— 山東問題正是運動的起因而非結果。分清「影響的層面」，答卷二論述題時才不會把功勞算錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_28","topic":"日本現代化","difficulty":"basic","question":"第二次世界大戰後，日本經濟迅速復甦。以下哪一項是促成復甦的外部條件？","options":["日本本土蘊藏豐富的石油與鐵礦","日本在戰後取得大量海外殖民地","日本完全脫離國際貿易，自給自足","戰後的國際安排與開放的外部市場，令日本產品得以出口"],"correctIndex":3,"explanation":"日本天然資源匱乏，復甦高度依賴進口原料與出口製成品，故外部市場的開放是必要條件。同時亦須留意內部因素：產業政策、企業組織形式、高儲蓄與人力資本。評價復甦時把內外因素並列，比只講其中一邊完整得多。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_29","topic":"日本現代化","difficulty":"basic","question":"二十世紀初，日本在亞洲現代化進程之中的位置有何特別之處？","options":["由被要求開放的一方，轉為在區內對外擴張的一方","始終處於被列強侵奪的一方，未有對外擴張","完全拒絕現代化，維持鎖國政策至二十世紀中","放棄本國制度，直接由西方國家管治"],"correctIndex":0,"explanation":"日本與中國同樣在外部壓力下啟動現代化，但走向不同：日本在制度延續之下推進，並在二十世紀初轉為對外擴張的一方。這種「同起點、不同走向」正是卷二比較題的好題材 —— 比較時要沿同一組軸（推動主體、與外部世界的位置、制度連續性）逐項對照。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_30","topic":"日本現代化","difficulty":"basic","question":"戰後日本與其他亞洲國家的關係之中，長期存在一項張力來源。這項來源是甚麼？","options":["亞洲各國禁止日本加入任何國際組織","戰爭時期的歷史問題長期未能徹底解決","日本拒絕與任何亞洲國家建立外交關係","日本完全不與區內國家進行貿易"],"correctIndex":1,"explanation":"戰後日本透過賠償安排、發展援助與區域組織的參與，重新建立了與區內國家的正式關係，經濟連繫亦日益緊密；但歷史問題反覆浮現，成為關係中持續的張力。答「變與不變」類題目時，這正是「不變」的一面 —— 經濟關係大幅轉變，歷史記憶卻長期延續。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_31","topic":"日本現代化","difficulty":"basic","question":"「明治維新」對日本其後的發展有何基本意義？","options":["令日本全面停止與外國接觸","把日本的政治權力交予外國顧問掌管","建立了現代國家的制度基礎，包括中央政府、常備軍與新式教育","使日本回復封建割據，各地大名自治"],"correctIndex":2,"explanation":"維新確立了中央政府的權威、廢藩置縣、建立徵兵制與新式學制，是日本其後工業化與對外擴張的制度前提。理解「制度先行」這一點，就明白何以日本能在數十年間由被要求開放轉為區域強權 —— 器物之外，制度改變才是關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_32","topic":"香港與東南亞","difficulty":"basic","question":"二十世紀五十至七十年代，香港工業以哪一類產業為主？","options":["鋼鐵與造船等重工業","石油開採與煉油業","大規模機械化農業","紡織、製衣、塑膠等輕工業"],"correctIndex":3,"explanation":"香港缺乏煤鐵等天然資源、土地有限，故工業集中於原料進口方便、投資額較小、勞動力密集的輕工業。理解「條件決定產業結構」這一點，比死記行業名稱有用得多 —— 同一套推理可以用來解釋其後為何轉向服務業。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_33","topic":"香港與東南亞","difficulty":"basic","question":"二戰後東南亞國家紛紛脫離殖民統治。以下哪一項是促成這一波去殖民化的條件？","options":["戰爭嚴重削弱了歐洲殖民國家的財政與軍事能力","歐洲殖民國家在戰後國力大增，主動放棄殖民地","聯合國以武力強制各殖民地獨立","東南亞各地在戰前已全部完成獨立"],"correctIndex":0,"explanation":"維持殖民統治的成本上升而收益下降，是最直接的條件；同時戰時佔領打破了「歐洲人不可戰勝」的形象，本地政治組織與武裝力量亦在戰時成長，加上戰後國際輿論轉向民族自決。多個條件同時具備，才構成一波浪潮 —— 單一原因解釋不了。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_34","topic":"香港與東南亞","difficulty":"basic","question":"東南亞國家聯盟（東盟）成立的主要目的是甚麼？","options":["取代聯合國在亞洲的職能","促進區內國家的經濟合作與政治對話","組成軍事同盟以對抗特定國家","把區內國家合併為單一主權國家"],"correctIndex":1,"explanation":"東盟以協商一致與不干預內政為原則，提供持續的對話機制。這個原則既是它的長處 —— 成員國之間長期未有爆發大規模武裝衝突；亦是它的限制 —— 對成員國內部問題幾乎無從介入。評價區域組織時，把同一項原則的兩面一併指出，判斷才完整。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_floor_35","topic":"香港與東南亞","difficulty":"basic","question":"一九九七年之前，香港與中國內地在經濟上形成一種互補關係。八十年代之後這種關係的主要形態是甚麼？","options":["雙方完全停止經濟往來","香港成為內地的糧食供應地","香港廠商把生產工序北移，本地轉向服務業","內地把工廠遷入香港，香港轉為工業中心"],"correctIndex":2,"explanation":"改革開放之後，經濟特區提供了前所未有的制度通道，香港廠商把生產工序北移以降低成本，本地則逐步轉向金融、貿易與專業服務。這一轉變改變了香港自身的產業結構 —— 製造業比重下降、服務業上升，是與五十至七十年代那一段關係最根本的分別。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

const state = {}; DATA.forEach(d => state[d.id] = 'pending');
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  const out = { _meta: { source: "history-floor.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Date().toISOString().slice(0,10) }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "history-floor.decisions.json"; a.click();
});
counts();
</script></body></html>
