<style>

  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif; padding-bottom:96px; }

  .acts .a.on { background:var(--ok); border-color:var(--ok); color:#04140a; } .acts .r.on { background:var(--no); border-color:var(--no); color:#fff; } .acts .p.on { background:var(--wait); border-color:var(--wait); color:#1a1200; }

<header><div class="wrap" style="padding-bottom:0"><h1>👤 人手逐題覆核 — <span style="color:var(--accent)">english</span></h1>
<div class="sub">來源 english-written-batch1.json · 共 3 題已通過機器客觀閘（格式／去重／術語）。<span class="note">機器唔判對錯 —— 每題嘅學術正確與否，由你決定。</span></div></div></header>
<div class="hint">⌨️ 快捷鍵：<b>A</b> 通過 · <b>R</b> 退回 · <b>P</b> 待定 · <b>J / K</b> 上一題／下一題。數學題以原始 $LaTeX$ 顯示（如需精確排版可喺 preview 對照）。</div>

<script>
const DATA = [{"id":"en_long_b1_01","topic":"Genre, Tone & Register","difficulty":"basic","question":"A Form 5 student, Nicholas Yau, wrote the following note to his school's Vice-Principal to request permission to postpone a project deadline:\n\n\"hey sir, cant hand in the geog project on friday cos my group partner bailed on me last min. its not my fault tbh. can u just give us more time? thx\"\n\n(a) Identify THREE features of this note that make it inappropriate for its audience and purpose. (3 marks)\n(b) Rewrite the note so that it is appropriate in tone and register, while keeping the same request and the same reason. Write 60–80 words. (3 marks)","explanation":"This question trains the one thing Paper 2 markers notice first: whether you have read the AUDIENCE, not just the task.\n\nMost candidates who lose marks here can already write correct English. What they do not do is change register when the reader changes. The same request — more time for a project — is entirely reasonable; only the packaging fails.\n\nNotice what the rewrite does NOT do: it does not become longer, more elaborate, or full of formal-sounding vocabulary. It stays short. Formality is not the same as verbosity, and padding a request with \"I would like to humbly beseech your kind consideration\" is its own kind of register error.\n\nThe transferable rule: before writing a single word, decide who reads this, what they need in order to act, and what relationship the language should signal. Everything else follows from those three answers.","type":"long","referenceAnswer":"(a) Three of the following:\n• Salutation is over-familiar (\"hey sir\") where a formal address (\"Dear Mr …\") is required for a senior member of staff.\n• Abbreviated, text-message forms (\"cant\", \"cos\", \"min\", \"u\", \"thx\", \"tbh\") belong to private messaging, not to a written request to a school authority.\n• The tone shifts blame onto a classmate (\"my group partner bailed on me\", \"its not my fault\") rather than taking responsibility for the request.\n• \"can u just give us more time\" is a bare demand; a request to a superior needs a modal softener and a specific proposal.\n• No new deadline is proposed, so the reader cannot act on the request.\n• There is no sign-off identifying the writer, class or subject teacher.\n\n(b) Sample rewrite (72 words):\n\"Dear Mr Cheung,\n\nI am writing to ask whether my group may submit our Geography project on Tuesday 14 October instead of this Friday. One member of the group has been absent this week, and we have not been able to complete the fieldwork section on time. We would be grateful for three extra days, and we will submit the remaining sections on Friday as planned.\n\nYours sincerely,\nNicholas Yau (5C)\"","markingScheme":"自評準則（唔係關鍵字對照，係逐項自問）：\n\n(a) 3 分 —— 每指出一項【並說明點解對呢個讀者／目的唔恰當】得 1 分。只寫「太口語」而唔講點解，計半個點：口語本身唔係錯，錯喺對象係副校長。\n\n(b) 3 分，三條各自問一次：\n1. 語域：全篇有冇殘留縮寫、口語或表情符號？有一個都當未達。\n2. 內容完整：有冇【提出具體新限期】？原文最大問題係讀者收到都唔知要批准啲乜。\n3. 責任語氣：有冇將原因講成事實陳述（「一位組員本週缺席」），而唔係指責同學？\n\n字數：60–80。超出範圍唔扣內容分，但要留意 DSE 卷二超字數會影響組織評分。","suggestedMinutes":8,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_long_b1_02","topic":"Reading Comprehension","difficulty":"intermediate","question":"Read the extract below, then answer the questions.\n\n\"The library at Sha Kok Estate closed in March. The notice on the door said 'temporary'. It has now been eleven months. In that time the reading room has been used twice: once for a district consultation on refuse collection, and once, briefly, as a storage space for chairs.\n\nMrs Poon still walks past it on Tuesdays. She used to bring her grandson here after school, she says, because their flat has one table and her son works nights. When asked where the boy studies now, she gestures at the McDonald's across the road, and then, after a pause, adds that the staff there have never once asked him to leave.\"\n\n(a) Explain how the writer uses the phrase \"The notice on the door said 'temporary'\" to convey a critical attitude. (3 marks)\n(b) Explain the effect of the pause before Mrs Poon's final remark. (3 marks)","explanation":"Paper 1 Part B rewards candidates who can say HOW a text achieves an effect, not merely WHAT the writer thinks.\n\nBoth parts here turn on the same principle: the strongest criticism in journalistic writing is usually the one the writer never states. Quotation marks, a bare factual counter-statement, an unexplained pause — these hand the judgement to the reader, who then owns it.\n\nWhen a question asks about \"attitude\" or \"effect\", resist the urge to name an emotion and stop. Name the DEVICE, quote it, then say what it makes the reader do. Three moves, every time.\n\nOne warning about over-reading. Part (b) tempts you to invent a feeling the text does not support — anger, bitterness, despair. The passage gives you a pause and one added sentence. Build only what those two things can carry. Inventing emotion is the single most common way candidates lose marks on inference questions, and it is entirely avoidable.","type":"long","referenceAnswer":"(a) The criticism is carried by placement and contrast rather than by any judgemental word. The writer quotes the official word \"temporary\" and then, in the very next sentence, supplies the counter-evidence: \"It has now been eleven months.\" The quotation marks distance the writer from the term, presenting it as the authority's claim rather than as fact. Nothing is asserted directly — the reader is left to conclude that \"temporary\" has quietly become permanent, and a conclusion the reader reaches unaided is harder to dismiss than an accusation.\n\n(b) The pause marks the moment Mrs Poon recognises what her own gesture has admitted. Pointing at the McDonald's is offered as a simple answer; the hesitation shows her registering that it is also an indictment. Her added remark — that the staff have never asked him to leave — is phrased as gratitude, but it quietly measures a fast-food outlet against a public library and finds the public service wanting. The pause is what turns a factual reply into a judgement, without her ever having to make one.","markingScheme":"自評準則：\n\n(a) 3 分：\n1. 有冇指出【引號】嘅作用（將「temporary」標示為官方講法而非事實）？\n2. 有冇引用緊接嘅反證（eleven months）並講出兩者嘅落差？\n3. 有冇講到作者【冇直接批評】—— 即效果來自讀者自己得出結論？\n第 3 點係分水嶺。只答「作者諷刺政府」而唔講佢點樣做到，屬於講咗結論冇講手法。\n\n(b) 3 分：\n1. 有冇指出停頓標誌住人物自己意識到啲乜？\n2. 有冇處理「感激」同「控訴」呢個雙重性 —— 佢讚嘅係快餐店，反襯嘅係圖書館？\n3. 有冇避免過度推論（例如寫成「佢好憤怒」）？文本冇支持憤怒，只支持醒覺。\n\n常見失分位：將 (b) 答成「表達佢好無奈」。無奈係情緒標籤，唔係效果分析；題目問 effect，要講嗰個停頓對讀者理解造成咩改變。","suggestedMinutes":10,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_long_b1_03","topic":"Integrated Skills","difficulty":"hard","question":"DATA FILE\n\nSource A — Extract from a school survey (312 respondents, Forms 4–6):\n• 68% said they \"often\" or \"always\" study with background music.\n• Of those, 71% chose instrumental or lo-fi tracks; 29% chose songs with lyrics.\n• 54% of all respondents said they would find a silent study room \"stressful\".\n\nSource B — Note from the school librarian:\n\"We trialled a silent-only rule last term. Usage dropped from about 40 students a day to 12. The ones who stopped coming were mostly Form 4. Several told me they went to fast-food outlets instead, which are noisier, not quieter — so I do not think noise was the real issue. I suspect the rule made the library feel like an exam hall.\"\n\nSource C — Student comment collected by the Student Union:\n\"I can concentrate with music. What I cannot do is concentrate while worrying that someone will tap me on the shoulder.\"\n\nTASK\nYou are the Chairperson of the Student Union. Write a proposal (180–220 words) to the Principal recommending ONE change to the library's rules. Your proposal must:\n• state the recommendation clearly;\n• use evidence from at least TWO of the sources;\n• acknowledge one reasonable objection and respond to it.","explanation":"Paper 3 is not a writing test with data attached. It is a test of whether you can turn evidence into an argument.\n\nThe trap built into this data file is that Sources A and B appear to say the same thing, and Source C looks like a throwaway quotation. In fact the three do different jobs: A establishes scale, B supplies a natural experiment with a counter-intuitive result, and C names the mechanism. A candidate who only stacks A and B has evidence but no explanation. A candidate who reaches C can say WHY the silent rule failed — and a proposal that identifies a cause is far more persuasive than one that only reports a correlation.\n\nNote also what the model response does with the objection. Weak candidates raise an objection they can easily dismiss. Strong candidates raise the one the reader is already thinking of — here, that a divided room will drift — and then answer it with something concrete and reversible. Offering a review mechanism signals that you are arguing in good faith rather than lobbying.\n\nThe underlying skill transfers well beyond this paper: evidence tells you what happened; only a mechanism tells you what to do about it.","type":"long","referenceAnswer":"Sample response (205 words):\n\n\"Dear Dr Lam,\n\nProposal: a designated 'headphones permitted' zone in the library\n\nThe Student Union recommends that the eastern half of the reading room be designated a headphones-permitted zone, with the western half remaining silent.\n\nOur survey of 312 students found that 68% study with background music, and that 54% would find a fully silent room stressful. This is not a marginal preference. The librarian's own trial supports the same conclusion from a different direction: when a silent-only rule was introduced, daily usage fell from about 40 students to 12, and those who left went to noisier fast-food outlets rather than quieter ones. As she notes, noise was evidently not the deciding factor; the atmosphere was.\n\nOne reasonable objection is that a divided room is harder to supervise and may erode the silent area over time. We propose two safeguards: a clear floor marking rather than a movable sign, and a one-term review using the same daily-usage count the librarian already keeps, so the decision can be reversed on evidence rather than impression.\n\nWe believe this change addresses the real barrier identified in the trial — students avoiding a space that felt like an examination hall — without removing the silent option for those who need it.\n\nYours sincerely,\nChairperson, Student Union\"","markingScheme":"自評準則（10 分，四條軸各自問一次）：\n\n1. 建議清晰（2 分）：讀者讀完第一段，知唔知道要批准啲乜？寫「改善圖書館氣氛」唔算建議，寫「東半邊劃為可戴耳機區」先算。\n\n2. 引用資料（3 分）：\n   · 有冇用到至少兩個來源？\n   · 引用嘅係【具體數字或事實】（68%、40→12），定係含糊轉述（「好多人話」）？\n   · 有冇解釋數據點解支持你個建議 —— 唔係貼咗數字就當論證。\n\n3. 處理反對（3 分）：\n   · 你提出嗰個反對，係咪一個【真係合理】嘅反對？寫一個明顯站唔住嘅反對嚟打，係稻草人。\n   · 你嘅回應有冇提出可操作嘅補救，定係淨係話「應該唔會發生」？\n\n4. 語域同格式（2 分）：正式稱謂、有標題、有署名；全篇冇口語同縮寫。\n\n⚠️ 呢份準則係【俾你自己對照】嘅。DSE 卷三由真人評卷，冇任何機器可以按關鍵字判你對錯，本平台亦永遠唔會咁做。\n\n常見失分位：Source C（學生留言）最易被當成裝飾。佢其實提供咗最關鍵嘅一句 —— 問題唔係聲音，係被監視嘅焦慮。用得到呢一點，成篇論證就唔同層次。","suggestedMinutes":15,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "english";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  const out = { _meta: { source: "english-written-batch1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Date().toISOString().slice(0,10) }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "english-written-batch1.decisions.json"; a.click();
});
counts();
</script></body></html>
