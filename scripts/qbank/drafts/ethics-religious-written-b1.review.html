<script>
const DATA = [{"id":"er_w1_01","topic":"規範倫理學","difficulty":"basic","question":"試說明效益主義（Utilitarianism）與義務論（Deontology）在【判斷行為對錯的依據】上的根本分別，並各指出一項常被提出的批評。","explanation":"本題的分數集中在「根本分別」四字。答案若只分別描述兩種理論而不指出其分歧所在，等於答了兩條題而未答本題。最有效的表述是把分歧壓縮成一句對照 —— 一個看後果，一個看行為本身 —— 有了這句，其後的說明才有骨架。\n批評一項須貼緊該理論的結構性弱點，而非泛泛的反對。「效益主義太冷酷」不算批評，因為它未指出理論的哪一部分導致該結果；「效益主義以總量計算，故原則上容許犧牲少數」才是批評，因為它指向了理論的計算方式本身。\n另須留意：舉出批評不等於否定該理論。試卷經常在其後追問「該理論可如何回應此批評」，故作答時宜保持中立語氣，不必急於選邊。","type":"text","referenceAnswer":"判斷依據的根本分別：\n效益主義以【行為的結果】為判斷依據。一個行為是否正確，取決於它所帶來的整體效益 —— 通常理解為快樂的總量減去痛苦的總量。行為本身並無內在的對錯，其道德性質完全由後果決定。\n義務論以【行為本身的性質】為判斷依據。某些行為之所以錯，並非因為其後果不好，而是因為該行為本身違反了道德義務或原則（例如說謊、把人僅僅當作手段）。即使後果良好，違反義務的行為仍屬錯誤。\n\n分別可以一句話概括：效益主義向前看，問這樣做會產生什麼；義務論向內看，問這是一種什麼行為。\n\n常被提出的批評：\n對效益主義 —— 它可能容許犧牲少數人以成全多數人的利益。若計算顯示傷害一名無辜者可帶來更大的整體效益，效益主義似乎難以說明何以不應如此，而這與大多數人的道德直覺相衝突。\n對義務論 —— 它可能導致在極端處境中仍堅持規則而造成明顯的傷害。經典的例子是：即使說謊可以拯救無辜者的性命，嚴格的義務論仍要求不說謊。批評者認為，完全不考慮後果的道德判斷難以在現實中站得住。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"er_w1_02","topic":"規範倫理・理論應用","difficulty":"intermediate","question":"某醫院只有一部維生儀器，而同時有兩名病人需要使用：一名為六十五歲的資深外科醫生，康復後可繼續行醫；另一名為二十歲的學生，康復機會較高但尚未有任何社會貢獻。\n（a）分別以效益主義及義務論的角度，說明應如何處理此情況，並指出各自的推理依據。\n（b）指出效益主義在本個案中所面對的一項計算困難。\n（c）有人主張「以抽籤決定」。試從倫理學角度說明此做法的一項優點及一項缺點。\n（d）試說明何以此類個案不宜期望有一個「正確答案」，並指出倫理學討論在此類處境中的實際作用。","explanation":"（b）的關鍵在於分辨兩種困難。「資料不足」是實踐上的問題，原則上可藉更好的估算改善；「不可通約」則是理論上的問題 —— 即使掌握全部資料，仍無法把兩種性質不同的價值化為同一單位。能夠指出後者，屬本題的高分位。\n（c）的缺點一項最易寫得含糊。抽籤的問題不在於「不夠理性」，而在於它連【醫療上相關】的差異也一併抹去。答案中「把拒絕作不當區分與拒絕作任何區分混為一談」一句，正是要點所在。\n（d）看似開放，實則有明確的評分要求：須先說明兩難的結構（兩個成立的道德要求不能同時滿足），再指出倫理學的作用在於提高抉擇質素而非提供答案。答「因為每個人的價值觀不同，所以沒有標準答案」屬相對主義的滑落，會失去此項分數 —— 兩難之所以無正解，並非因為道德無標準，而恰恰因為有多於一項標準同時成立。","type":"long","referenceAnswer":"（a）效益主義的角度：\n應把儀器分配予能帶來最大整體效益的一方。推理依據是後果的比較 —— 須衡量各自的康復機會、預期存活年數、康復後對他人的貢獻等。若外科醫生康復後可救治更多病人，其效益可能較高；但學生康復機會較高且預期存活年數較長，效益亦可觀。結論取決於實際數字，而非任何一方的身分本身。\n\n義務論的角度：\n應拒絕以「誰較有用」作為分配依據。推理依據是人的內在價值 —— 每一個人皆有不可化約的尊嚴，不能僅被視為達致他人利益的手段。按貢獻排序，等於把人當作工具來評價其存廢，此為義務論所不許。\n義務論者較可能主張：以醫療上的相關準則（例如康復機會、緊急程度）決定，或在條件相若時以隨機方式分配，藉此避免對人的價值作出排序。\n\n（b）計算困難：\n效益主義要求比較兩個結果的總效益，而本個案所需的數據在實踐上無法取得。外科醫生康復後究竟能救治多少病人、學生日後會有何貢獻，皆屬不可知的未來；康復機會的估算亦有相當的不確定性。\n更根本的困難在於【不可通約】：如何把「一名醫生日後可能救治的人數」與「一名學生額外的四十年生命」放在同一個尺度上比較？兩者並非同一種價值，而效益主義的計算預設了它們可以化為同一單位。此為理論層面的困難，並非資料不足所致。\n\n（c）抽籤的做法：\n優點 —— 體現平等。抽籤不預先判定何人的生命較有價值，避免了以社會地位、職業或潛在貢獻為人排序；在無法確定何者為優的處境下，隨機分配保障了雙方獲得同等的機會，程序本身亦透明可核。\n缺點 —— 放棄了相關資訊。若其中一方的康復機會明顯較高，抽籤等於容許儀器被分配予一個較可能無效的用途，造成資源浪費，而該浪費的代價由本可獲救的一方承擔。純粹的隨機化把「拒絕作不當的區分」與「拒絕作任何區分」混為一談。\n\n（d）何以不宜期望有一個正確答案：\n此類個案屬道德兩難 —— 其結構是兩個各自成立的道德要求無法同時滿足。無論選擇哪一方，都必然有一項真實的道德價值被犧牲，故並不存在一個沒有代價的選項。若有，該情境便不成其為兩難。\n\n倫理學討論的實際作用：\n其一，令抉擇的理由變得明確。討論不能消除代價，但可以令決策者清楚知道自己犧牲了什麼、依據什麼而犧牲，而非在未經反省之下作出選擇。\n其二，區分可接受與不可接受的理由。倫理學未必能指出何者為唯一正解，但足以排除某些依據 —— 例如按病人的社會地位或支付能力分配，即屬明確不可接受。能夠劃出這條界線，本身已具實質作用。\n其三，令決定可被檢視。一個講得出理由的決定可以被質疑、被辯護、被修正；一個憑直覺作出的決定則無從討論。\n故倫理學在此類處境中的作用，並非提供答案，而是提高抉擇的質素。","markingScheme":"（a）4 分 —— 效益主義的立場連推理依據（2，須提及後果比較而非只寫「選較有用的一方」）；義務論的立場連推理依據（2，須提及人的內在價值或不可僅作手段）。\n（b）2 分 —— 指出資料不可知的實踐困難（1）；指出不可通約的理論困難（1）。只答前者最多 1 分。\n（c）2 分 —— 優點須扣回平等或避免為人排序（1）；缺點須指出抹去了醫療上相關的差異（1）。答「抽籤不公平」而無說明不給分。\n（d）2 分 —— 說明兩難的結構，兩項道德要求不能同時滿足（1）；指出倫理學的作用在於使理由明確、排除不可接受的依據或令決定可被檢視（1）。以相對主義作結者此項不給分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":18,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"er_w1_03","topic":"佛教","difficulty":"intermediate","question":"（a）簡述四聖諦的內容，並說明四者之間的邏輯關係。\n（b）解釋「緣起」（因緣和合）的概念，並說明它與「無我」之間的關聯。\n（c）有人認為佛教的「苦諦」是一種消極悲觀的人生觀。試回應此說法。","explanation":"（a）的分數並非平均分佈於四諦的內容之上 —— 逐條複述四聖諦屬記誦層面，而「邏輯關係」一問才是本題的考點。把四諦理解為「病狀、病因、痊癒的判斷、療方」這個結構，是最能顯示理解的表述，因為它同時解釋了次序何以不可調換。\n（b）容易寫成兩段互不相干的說明。關鍵在最後那句：緣起是原理，無我是該原理應用於自身所得的結論。若答案只分別解釋兩個詞而未建立關聯，即未回答題目。另須留意無我並非否定人的存在，把它寫成「佛教認為人不存在」是常見的概念錯誤。\n（c）示範一種穩健的回應結構：先指出對方混淆了什麼（診斷與態度），再以文本自身的結構作反證（若真悲觀，何以有滅諦與道諦），最後補充實踐層面的證據（八正道涵蓋日常生活）。三者層次不同，不可重複。","type":"long","referenceAnswer":"（a）四聖諦的內容：\n苦諦 —— 指出生命之中普遍存在苦。此處的苦不限於痛楚，尚包括生老病死之苦、求不得之苦，以及一切因無常而生的不安。\n集諦 —— 指出苦的起因。苦源於貪愛與執取：眾生執著於本質上無常的事物，欲其恆常不變，故生苦。\n滅諦 —— 指出苦可以止息。既然苦有其起因，去除該起因，苦即可滅，此即涅槃。\n道諦 —— 指出止息苦的方法，即八正道：正見、正思惟、正語、正業、正命、正精進、正念、正定。\n\n四者之間的邏輯關係：\n四聖諦並非四項並列的教義，而是一個具次序的診斷結構 —— 苦諦是病狀，集諦是病因，滅諦是可以痊癒的判斷，道諦是療方。\n此一結構的次序不可調換：必須先確認苦的存在，才有探究其成因的必要；必須先確立苦有其成因，才有去除的可能；而滅諦之所以成立，正因集諦已經指出苦並非無緣無故，故並非不可解除。道諦作為方法，只有在前三者成立之後才有意義。\n\n（b）緣起的概念：\n一切現象皆由眾多條件（因緣）和合而生，並無任何事物能夠獨立自存。條件具足則生，條件離散則滅；故一切法皆是相依而有，並無獨立不變的本體。\n\n與無我的關聯：\n無我並非說「沒有這個人」，而是說並無一個獨立、恆常、不依賴條件而自存的「我」。\n此一結論正是緣起的直接推論：若一切現象皆由條件和合而成，則「我」亦不例外 —— 所謂我，不過是身心諸種因素（色、受、想、行、識）依條件聚合而呈現的一個持續過程，其中並無一個不變的核心。\n故緣起是原理，無我是該原理應用於「我」之上所得的結論。二者並非兩項獨立的教義，而是同一個洞見的兩種表述。\n\n（c）回應：\n此說法出於誤解，可從三方面回應。\n\n其一，須分辨「指出苦的存在」與「認為人生只有苦」。苦諦是一項關於處境的診斷，並非一種情緒態度。醫生指出病人患病，並非悲觀；隱瞞病情才是不負責任。佛教之所以由苦諦開始，正因為不正視問題便無從解決。\n\n其二，四聖諦的結構本身即駁倒了悲觀的指控。若佛教真屬悲觀，則說完苦諦與集諦便應結束；而它繼續說滅諦與道諦，明確主張苦可以止息，並提出具體方法。一套主張「問題有解，且解法在此」的教義，其基調是積極而非消極。\n\n其三，佛教所主張的離苦之道，並非逃避現實或否定生活，而是改變面對事物的方式 —— 透過如實觀照無常與緣起，減少不必要的執取。八正道所涵蓋的正語、正業、正命，皆屬日常生活中的實踐，而非出世的退隱。\n\n較公允的說法是：佛教對人生處境的判斷是清醒的，而對改變的可能是樂觀的。把清醒誤認為悲觀，是把診斷與絕望混為一談。","markingScheme":"（a）4 分 —— 四諦內容齊備且準確（2）；邏輯關係，須指出診斷式結構或說明次序不可調換（2）。只複述內容而無關係說明，最多 2 分。\n（b）3 分 —— 緣起的概念，須提及條件和合與無獨立自存（1）；無我的正確理解，須指出並非否定人的存在（1）；二者關聯，須指出無我為緣起應用於自身之結論（1）。\n（c）2 分 —— 指出混淆了診斷與情緒態度（1）；以滅諦與道諦的存在作反證，或指出八正道屬日常實踐（1）。只答「佛教其實很積極」而無論據不給分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":16,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"er_w1_04","topic":"道德概念","difficulty":"intermediate","question":"試區分「良心」（conscience）與「個人喜好」，並說明何以「我覺得這樣做沒有問題」本身不足以構成一項道德理由。","explanation":"本題的難點在於既要否定「我覺得」作為理由，又不能因此否定道德感受的價值。答案的最後一段正是這個分寸所在：感受是信號而非理由，它提出問題而不回答問題。缺了這一段，答案容易滑向「感受完全不重要」，而這在倫理學上並不成立 —— 道德直覺是重要的資料來源，只是不能充當結論。\n三項理由應指向不同層面：一項針對理由的性質（心理狀態 vs 行為性質），一項針對可討論性，一項針對普遍性。若三者都在講「太主觀」，實際上只算一個理由。\n最後那句「一個能夠證成一切的理由，實際上什麼也未曾證成」值得記住，因為它可套用於多種論證評估的題目 —— 凡一項理由對任何結論皆同樣適用，它便沒有區辨力。","type":"text","referenceAnswer":"兩者的分別：\n良心是對行為道德性質的判斷，其內容可以陳述為理由，並可接受檢視 —— 一個人可以解釋自己何以認為某事不當，而該解釋可被質疑、被反駁、被修正。良心亦具有普遍性的指向：若我認為此事對任何人而言皆屬不當，我便不能例外於自己。\n個人喜好則是主觀的傾向，不需要理由，亦不指向他人。我喜歡某種食物，毋須為此提出論據，亦不主張他人應有同樣的喜好。\n\n根本分別在於：良心提出的是一項【可供討論的主張】，喜好陳述的是一項【個人的事實】。\n\n何以「我覺得這樣做沒有問題」不足以構成道德理由：\n其一，它報告的是一種心理狀態，而非一項理由。「我覺得如此」說明了說話者的感受，卻未說明何以事情本身應當如此。道德理由須指向行為的性質或後果，而非指向持有該判斷的人。\n其二，它無法被討論。凡以個人感受作結的主張，對方無從回應 —— 既不能同意亦不能反駁，因為感受本身並無真假可言。而道德判斷的意義正在於它可以被討論、被要求說明理由。\n其三，它不具普遍性。若「我覺得沒問題」即足以證成一項行為，則任何人皆可以同一句話證成任何行為，包括互相衝突的行為。一個能夠證成一切的理由，實際上什麼也未曾證成。\n\n須補充的是：這並不表示道德感受毫無作用。直覺上的不安往往是值得留意的信號，提示某處可能有問題。但信號本身不是理由 —— 感受提出問題，理由回答問題。把前者當成後者，等於在論證尚未開始之時便宣告結束。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"er_w1_05","topic":"道德推理・後設反思","difficulty":"hard","question":"有人提出：「不同文化對道德有不同看法，因此並無普世的道德標準，我們不應批評其他文化的做法。」\n（a）指出此論證的前提與結論，並說明由前提到結論的推理是否成立。\n（b）指出此立場若貫徹到底，會產生哪兩項難以接受的後果。\n（c）文化差異確實存在。試提出一種既能尊重差異、又不至於放棄一切道德判斷的立場，並說明其如何處理（a）所指出的問題。","explanation":"（a）要求先把論證拆成前提與結論，這一步不可略過。原文把兩個不同層次的結論混在一句話之內 —— 一個關於「有沒有標準」（後設倫理），一個關於「應否批評」（規範）—— 而拆開之後，第二步的自相矛盾便立即顯現：一條主張「不應批評」的規則，本身正是一條普世規則。\n地球形狀那個類比值得記住。它精準地隔離了問題所在：分歧的存在是關於【人的信念】的事實，而有無標準是關於【事情本身】的問題，由前者推出後者即為跳步。\n（b）「無法解釋道德改革」這個後果比「無法譴責暴行」更有力，亦較少人想到。後者訴諸直覺（暴行顯然是錯的），對方可以硬撐；前者則指出該立場與我們對歷史的實際判斷不相容，而這個判斷連相對主義者自己通常亦不願放棄。\n（c）的關鍵在於兩層結構。若答案只寫「應該尊重差異但也要有底線」，屬態度而非立場 —— 必須說明底線由何而來（源於人的共通處境，而非某一文化的規定），以及差異落在哪一層。末段承認邊界仍有爭議，是誠實而非失分：一個聲稱解決了所有問題的立場，通常只是把問題藏起來。","type":"long","referenceAnswer":"（a）前提與結論：\n前提一（描述性）：不同文化對道德有不同看法。\n結論一（後設倫理層面）：並無普世的道德標準。\n結論二（規範性）：我們不應批評其他文化的做法。\n\n推理是否成立：兩步推理皆不成立。\n由前提到結論一：這是由「人們的看法不同」推出「並無正確答案」，而此一推論並不成立。不同社會對地球形狀曾有不同看法，並不因此推出地球沒有確定的形狀。分歧的存在只證明有人可能錯了，並不證明無所謂對錯。此為由描述性事實直接推出後設倫理結論的跳步。\n由結論一到結論二：這一步更為明顯地不成立，而且自相矛盾。「我們不應批評」本身即是一項普世的道德主張 —— 它要求所有人、在所有文化中都遵守。若真無普世標準，則這條「不應批評」的規則亦無普世效力，該立場因而取消了自己。\n\n（b）兩項難以接受的後果：\n其一，無法譴責任何暴行。若道德標準僅由文化決定，則某一文化內部所認可的做法，在該文化之內即屬正確 —— 包括奴隸制、對女性的系統性壓迫、以宗教或族群為由的迫害。外人不但無資格批評，甚至無法稱之為錯。此結論與絕大多數人的道德判斷直接衝突。\n其二，無法解釋道德改革。若一個文化的道德標準即由該文化當下的主流意見界定，則凡與主流不同的改革者按定義即屬錯誤。廢奴運動者在當時的社會之中屬少數，按此立場他們並非「先於時代地正確」，而只是「錯誤地違反了本文化的標準」。然而歷史上的道德進步恰恰是由這類人推動的，而我們亦確實認為他們是對的 —— 此一立場無法容納這個判斷。\n\n（c）一種可行的立場：\n可主張【道德標準具有普世的基礎，而其具體實踐容許文化上的多樣】。\n此立場的兩層結構如下：\n第一層 —— 存在若干普世適用的基本要求，例如不可無故施加痛苦、須尊重人的基本尊嚴、承諾應予履行。這些要求之所以普世，並非因為某一文化如此規定，而是因為它們源於人作為有感受、有計劃能力的存在所共有的處境。\n第二層 —— 這些基本要求在不同文化中的具體實現方式可以差異甚大。「尊重長者」是一項廣泛認同的要求，而其表現形式在各社會之間並不相同；「公平分配」的原則普遍成立，而何謂公平的具體制度則有多種合理版本。\n\n如何處理（a）所指出的問題：\n此立場承認前提為真 —— 文化確有差異，而且大部分差異落在第二層，屬實踐方式之別而非基本要求之別。故它並不需要否認文化多樣性。\n同時，它阻斷了由前提到結論的跳步：差異存在於實踐層面，並不推出基本層面亦無標準。表面上的巨大分歧，往往在追問理由之後收窄 —— 各文化皆反對無故殺人，分歧多在於何謂「無故」。\n此立場亦避免了自我取消的困難：它明確承認自己主張若干普世標準，並為此提出理由，而非一面否認普世標準、一面提出一條普世規則。\n須承認此立場並未解決一切問題 —— 哪些要求屬第一層、哪些屬第二層，本身仍須逐項論證，而邊界處往往正是最具爭議之處。但它至少提供了一個可以繼續討論的框架，而非以「無標準」終止討論。","markingScheme":"（a）4 分 —— 正確拆出前提與兩個層次的結論（1）；指出由分歧推出無標準的跳步，須有說明或類比（2）；指出「不應批評」本身即為普世主張而構成自我取消（1）。\n（b）3 分 —— 無法譴責暴行一項（1）；無法解釋道德改革一項（2，須說明改革者按此立場即屬錯誤，而我們實際上判斷他們為對）。只答第一項最多 1 分。\n（c）3 分 —— 提出具兩層結構的立場（1）；說明第一層的普世性從何而來，須訴諸人的共通處境而非文化規定（1）；說明此立場如何同時承認差異又阻斷（a）的跳步（1）。只答「應該互相尊重」不給分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":20,"trapTypes":null,"dnaTag":null,"mother":null}];

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "ethics-religious-written-b1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "ethics-religious-written-b1.decisions.json"; a.click();
});
counts();
</script></body></html>
