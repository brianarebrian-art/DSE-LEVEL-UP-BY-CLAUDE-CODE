<script>
const DATA = [{"id":"tl_w1_01","topic":"營養計算","difficulty":"basic","question":"某包裝食品的營養標籤列明每 100 克含蛋白質 8 克、脂肪 12 克、碳水化合物 60 克。\n（a）計算每 100 克所提供的能量（千卡）。（蛋白質及碳水化合物每克提供 4 千卡，脂肪每克提供 9 千卡）\n（b）計算脂肪所提供的能量佔總能量的百分比，準確至整數。\n（c）世界衞生組織建議脂肪所提供的能量應佔每日總能量攝取的 30% 或以下。試據（b）評論此食品，並指出單憑此一數字作判斷的一項不足。","explanation":"（b）的關鍵在於分母是【總能量】而非總重量。以 12 克除以 100 克得 12% 是最常見的錯誤 —— 該數字算的是重量百分比，而營養建議所指的是供能百分比，兩者概念不同。脂肪每克提供的能量是其餘兩者的兩倍多，故其供能佔比必定高於重量佔比。\n（c）的不足一項是本題的考點。三個可能的答案分別針對【質】（脂肪種類）、【範圍】（單一食品 vs 全日）與【分量】（每 100 克 vs 實際食用量）三個不同層面，任舉其一即可，惟必須說明理由。答「不夠全面」而無所指不會取分。\n此類「先計算、後評論所計數字之限制」的問法在本科相當常見，其用意是提醒學生：營養標籤上的數字是有意義的，但每一個數字都只回答一條特定的問題。","type":"text","referenceAnswer":"（a）蛋白質：8 × 4 = 32 千卡\n脂肪：12 × 9 = 108 千卡\n碳水化合物：60 × 4 = 240 千卡\n總能量 = 32 + 108 + 240 = 380 千卡\n（b）脂肪佔比 = 108 ÷ 380 × 100% = 28.4%，約 28%。\n（c）評論：此食品的脂肪供能比例約為 28%，低於世界衞生組織所建議的 30% 上限，就此單一指標而言屬可接受。\n\n單憑此一數字作判斷的不足（任舉一項）：\n其一，此比例並未反映脂肪的【種類】。飽和脂肪與反式脂肪對健康的影響遠大於不飽和脂肪，而總脂肪的百分比無法區分三者。一款脂肪供能 28% 而以反式脂肪為主的食品，並不比一款供能 32% 而以不飽和脂肪為主的食品為佳。\n其二，此數字只描述該食品本身，而世界衞生組織的建議針對【每日總攝取】。判斷應以全日膳食計算 —— 即使單一食品達標，若全日多項食品的脂肪比例皆接近上限，總量仍可能超標。\n其三，未計實際食用分量。每 100 克的數值不等於一次食用的攝取量；若一包重 200 克而通常一次食完，實際攝取的能量與脂肪皆為表列數值的兩倍。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w1_02","topic":"食物安全","difficulty":"intermediate","question":"（a）說明「危險溫度範圍」的定義，並解釋何以在此範圍內細菌繁殖特別迅速。\n（b）一批熟食於午膳後在室溫存放三小時，其後放入雪櫃，翌日再翻熱食用。試逐步指出此流程中的三個食物安全風險點，並各提出改善方法。\n（c）有人認為「食物翻熱至滾燙即可殺死細菌，所以放多久也不要緊」。試評論此說法。","explanation":"（a）的倍數增長示例是本題的關鍵。細菌繁殖之所以危險，正因為其增長並不符合直覺 —— 多放一小時的後果不是「多一點細菌」，而是數量翻幾番。把 20 分鐘一代的數字實際算出來，比抽象地寫「繁殖迅速」有力得多，亦解釋了兩小時規則的來源。\n（c）的第一個理由是本題最高一檔的內容：毒素耐熱。此點極為重要，因為它推翻了一個相當普遍的生活信念 —— 翻熱處理的是細菌，而不是細菌已經留下的東西。答案若只提芽孢而未提毒素，仍未觸及最根本的漏洞。\n（b）三個風險點須覆蓋流程中的不同環節（存放、冷卻、翻熱）。若三點全部集中於「放太久」，實際上只算一項。此題的設計正是要考生逐步追蹤整個流程，而非只捉最明顯的一處。","type":"long","referenceAnswer":"（a）危險溫度範圍：\n指攝氏 4 度至 60 度之間的溫度範圍。食物處於此範圍之內時，致病細菌繁殖迅速。\n何以繁殖特別迅速：\n此溫度範圍接近人體體溫，正是大部分致病細菌的最適生長溫度。在營養充足、水分充足、酸鹼度適中的熟食之中，細菌可在約 20 分鐘內分裂一次。\n由於分裂屬倍數增長而非線性增長，其後果並不直觀：一個細菌經 20 分鐘變為 2 個、40 分鐘變為 4 個、一小時變為 8 個，兩小時已達 64 個，四小時則超過 4 000 個。時間每延長一倍，數量並非增加一倍，而是以指數上升。這正是「兩小時之內處理」這條規則的來源 —— 它並非任意訂立的緩衝，而是繁殖曲線開始急升的位置。\n\n（b）三個風險點及改善方法：\n風險點一：室溫存放三小時。\n熟食在製作後已無高溫保護，於室溫下正處於危險溫度範圍之內，而三小時已足以令細菌數量增加至可致病的水平。部分細菌（例如金黃葡萄球菌）在繁殖過程中會產生毒素，此點尤其關鍵。\n改善：熟食若不即時食用，應在製成後兩小時之內冷藏；若室溫超過攝氏 32 度，此時限應縮短至一小時。\n\n風險點二：整批熱食直接放入雪櫃。\n大量食物的中心溫度下降緩慢，即使已置於雪櫃，中心部分可能長時間停留於危險溫度範圍之內；同時，熱食會令雪櫃內部溫度上升，影響其他食物。\n改善：分裝為淺而小的容器，增加散熱面積，令中心溫度迅速降至攝氏 4 度以下；亦可先以冰浴或流水冷卻至不燙手再放入雪櫃。\n\n風險點三：翻熱不徹底。\n翻熱時若只加熱至表面熱燙而中心未達足夠溫度，中心的細菌並未被殺死。以微波爐翻熱尤其容易出現此情況，因加熱並不均勻。\n改善：翻熱至中心溫度達攝氏 75 度或以上並維持足夠時間；使用微波爐時應中途攪拌並靜置片刻，令熱量均勻分佈；翻熱以一次為限，不宜反覆。\n\n（c）評論：\n此說法只部分正確，其結論不能成立。\n\n正確的部分：徹底加熱確能殺死大部分致病細菌的活體。就細菌本身而言，充分翻熱是有效的處理。\n\n何以結論不成立：\n其一，部分細菌所產生的【毒素】具耐熱性。金黃葡萄球菌與蠟樣芽孢桿菌在食物存放期間所產生的毒素，即使經過翻熱亦不會被破壞。此時食物之中已無活菌，而毒素仍在 —— 食用後依然引致食物中毒。此為本說法最根本的漏洞：加熱處理的是細菌，而不是細菌已經留下的東西。\n其二，部分細菌會形成【芽孢】。芽孢的耐熱能力遠高於營養體，一般烹煮溫度未必能將其殺滅；食物冷卻後芽孢可再度發芽繁殖。\n其三，此說法會導致錯誤的行為習慣。若相信「翻熱即可」，人們便會放寬對存放時間與溫度的注意，而食物安全的核心恰恰在於【縮短食物處於危險溫度範圍的累積時間】。翻熱是最後一道防線，不是可以取代前面各道防線的萬用手段。\n\n較準確的表述是：徹底翻熱是必要的，但不足以補救不當存放所造成的後果。食物安全須由製作、冷卻、貯存、翻熱各個環節共同保障，任何一環都不能單獨承擔全部責任。","markingScheme":"（a）3 分 —— 溫度範圍正確（1）；指出接近體溫、為致病菌最適生長條件（1）；以倍數增長說明何以時間關鍵，或指出兩小時規則的由來（1）。\n（b）4 分 —— 三個風險點須分屬不同環節，每點連改善方法（各 1 分，共 3 分）；另 1 分予改善方法具體可行（如分裝淺容器、中心溫度 75 度）。三點集中於同一環節者最多 2 分。\n（c）2 分 —— 承認徹底加熱可殺死活菌（1）；指出毒素耐熱或芽孢問題，並說明翻熱不能補救不當存放（1）。只答「不對」不給分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":16,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w1_03","topic":"食物與紡織科學","difficulty":"intermediate","question":"（a）比較棉、聚酯纖維（polyester）及羊毛三種纖維在【吸濕性】、【保暖性】及【易護理程度】三方面的表現。\n（b）某運動品牌推出一款「棉與聚酯混紡」的運動上衣。試說明混紡的原理，並解釋此組合如何互補兩種纖維的不足。\n（c）該品牌在標籤上寫明「須以攝氏 30 度以下冷水洗滌，不可烘乾」。試從纖維特性解釋此指示的理由。","explanation":"（c）末段那句「混紡衣物的護理要求通常須遷就其中最脆弱的一種纖維」是本題的核心觀察，亦是混紡的一項固有代價：性能上取兩者之長，護理上卻須遷就兩者之短。能夠指出這一層，比逐項複述洗滌指示更能顯示理解。\n（b）最後那段關於取捨的補充亦有分數。混紡並非全無代價 —— 它換取的是均衡，而代價是在任何單項上皆非最佳。若答案把混紡寫成純粹的改良而無代價，即屬論述不完整。\n（a）的比較須三種纖維同時處理三個維度。常見的失分是只寫「棉吸汗、聚酯快乾、羊毛保暖」—— 這只覆蓋了三個格子而非九個，而比較題的評分正是按維度而非按纖維。","type":"long","referenceAnswer":"（a）三種纖維的比較：\n吸濕性 —— 棉最佳：纖維素結構含大量親水基團，能吸收自身重量約 8% 至 25% 的水分，貼膚時感覺舒適。羊毛次之，吸濕能力甚至高於棉（可達 30% 以上），惟吸濕後表面仍可保持乾爽感。聚酯纖維最差：疏水性強，吸濕率不足 1%，汗水不被吸收而只能停留於布面或依靠導濕結構轉移。\n\n保暖性 —— 羊毛最佳：纖維表面有鱗片、內部呈捲曲（crimp），可在纖維之間鎖住大量靜止空氣，而空氣是良好的隔熱介質。棉的保暖性中等，纖維較直，鎖住的空氣較少。聚酯纖維本身導熱性中等，其保暖表現高度取決於織物結構 —— 製成蓬鬆的絨面或中空纖維時保暖，製成薄平的織物時則不保暖。\n\n易護理程度 —— 聚酯纖維最佳：抗皺、快乾、尺寸穩定、不易縮水，可機洗機乾。棉居中：易皺、乾得慢、洗後可能縮水。羊毛最須小心：熱水與機械搓揉會令鱗片互相咬合而發生氈縮（felting），造成不可逆的縮小與變硬，多數須手洗或乾洗。\n\n（b）混紡的原理：\n把兩種或以上性質不同的纖維按一定比例混合紡成同一條紗線，令織物同時具備各纖維的部分特性。其目的並非取兩者的平均值，而是【以一種纖維的長處補償另一種的短處】，同時把各自的缺點稀釋至可接受的程度。\n\n此組合如何互補：\n棉補償聚酯的不足 —— 聚酯不吸汗，貼膚時容易產生黏膩感，亦較易積聚靜電；混入棉之後，織物具備一定吸濕能力，貼膚感覺較為舒適，靜電問題亦減輕。\n聚酯補償棉的不足 —— 純棉運動衣吸汗之後會變重、變濕、乾得慢，濕布貼身在運動後容易帶走體溫；混入聚酯之後，織物整體乾得較快、抗皺、洗後不易變形，耐用度亦提高。\n就運動用途而言，此組合的取捨是合理的：既保留了棉的親膚與吸濕，又借助聚酯改善了乾燥速度與耐用度。惟須指出，其吸濕與快乾兩方面皆不及純棉或純聚酯的極端表現 —— 混紡所換取的是均衡，代價是在任何單一項目上皆非最佳。\n\n（c）洗滌指示的理由：\n須以攝氏 30 度以下冷水洗滌 —— 聚酯纖維屬熱塑性纖維，受熱後分子鏈可產生永久變形。高溫洗滌可能令織物起皺、變形或收縮，而此類變形無法透過熨燙復原。此外，高溫亦會加速棉纖維的染料流失與強度下降。\n\n不可烘乾 —— 烘乾機的高溫與翻滾對兩種纖維皆有損害。就聚酯而言，高溫可能令纖維表面軟化，長期會產生起毛球（pilling）；就棉而言，高溫烘乾會令纖維過度失水而變脆，並造成明顯縮水。由於兩種纖維的收縮率不同，同一件混紡衣物在烘乾後會出現不均勻的收縮，導致織物起皺、變形或尺寸失準 —— 此為混紡衣物特有的問題，純纖維織物反而不明顯。\n\n可見洗滌標籤上的指示並非廠商的保守建議，而是由纖維本身的物理與化學性質所決定；混紡衣物的護理要求，通常須遷就其中【最脆弱的一種】纖維。","markingScheme":"（a）3 分 —— 三個維度各 1 分，每項須同時處理三種纖維。只覆蓋兩種者該維度不給分。\n（b）3 分 —— 混紡原理，須指出並非取平均而是互補（1）；棉補償聚酯、聚酯補償棉各一項（1）；指出混紡的代價為單項表現皆非最佳（1）。\n（c）2 分 —— 冷洗理由須扣回聚酯的熱塑性（1）；不可烘乾理由須提及起毛球或兩種纖維收縮率不同（1）。答「會縮水」而無纖維特性說明只給半分計入整體。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":15,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w1_04","topic":"生命週期營養","difficulty":"intermediate","question":"試說明青春期少女與六十五歲以上長者在膳食需要上的三項主要分別，並各說明其生理原因。","explanation":"本題的高分位在鈣質與蛋白質那一項 —— 指出同一種營養素在兩個階段的【目的】不同（建造 vs 保存）。多數答案會寫「兩者都需要鈣」，而止於此便錯過了本題最有意思的一層：需求量相近而理由相反。\n能量一項的補充「能量下降而微量營養素需要未同步下降」亦值得寫出。這一點直接推導出長者膳食的核心原則（營養密度），而該原則正是長者容易出現「熱量足夠而營養不足」的原因。\n作答時每項必須附生理原因，只列分別不給分。例如「少女需要較多鐵」屬結論，「月經流失加上血容量增加」才是原因。","type":"text","referenceAnswer":"三項主要分別及其生理原因：\n\n其一，能量需要。\n青春期少女的能量需要較高。原因是此階段生長速度加快（身高與體重同時快速增加），基礎代謝率較高，加上活動量一般較大，故每日所需能量高於長者。\n長者的能量需要下降。原因是肌肉量隨年齡減少（肌少症），而肌肉是消耗能量的主要組織，故基礎代謝率降低；活動量亦一般減少。\n須留意：能量需要下降而各種微量營養素的需要並未同步下降，故長者的膳食須更著重【營養密度】—— 在較少的分量之中提供足夠的營養素。\n\n其二，鐵質需要。\n青春期少女的鐵質需要顯著較高。原因有二：其一，月經開始後每月有經血流失，鐵質隨之流失；其二，此階段血容量隨身體成長而增加，製造血紅蛋白須要額外的鐵。此為青春期少女最易出現缺乏的營養素之一。\n長者的鐵質需要一般較低（女性停經後尤其明顯），但其吸收能力可能下降，故仍須注意攝取的質素而非只看分量。\n\n其三，鈣質與蛋白質的用途不同。\n青春期是骨質累積的關鍵時期 —— 人一生的骨峰值大部分在此階段形成，故鈣質需要高，目的是【建造】骨質。蛋白質需要亦高，用於肌肉與組織的生長。\n長者的鈣質需要同樣高，但目的是【減緩流失】—— 骨質密度隨年齡下降，尤其女性停經後雌激素減少令骨質流失加速，攝取鈣質與維生素 D 是為了延緩骨質疏鬆。蛋白質需要亦不低，用於減緩肌肉流失，而非增長。\n可見同一種營養素在兩個階段皆屬重點，而其【目的】完全不同：一為建造，一為保存。\n\n（其他可接受的分別：長者因味覺與嗅覺退化、牙齒與咀嚼能力下降、口渴感覺遲鈍，故須注意食物質地、調味與水分攝取；青春期少女則須注意因體型形象壓力而導致的不當節食。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w1_05","topic":"消費與可持續","difficulty":"hard","question":"「快時尚」（fast fashion）以低價、款式更新極快為特徵。\n（a）說明快時尚的營運模式如何造成環境負擔，須指出至少三個環節。\n（b）解釋何以「把舊衣捐出去」並不足以解決此問題，並指出此做法可能產生的一項非預期後果。\n（c）有人主張「消費者只要選購有機棉製品，即可解決問題」。試評論此說法。\n（d）就個人、企業及政策三個層面，各提出一項可行的措施，並說明何以三者缺一不可。","explanation":"（c）與健康管理科那條關於個人責任的題目共用同一個結構：以【材料層面】的改善去回應【速率層面】的問題，屬答非所問。此一分辨值得記住 —— 遇到任何「換一種材料就環保了」的主張，先問一句：這改變了生產與消費的速率嗎？\n（b）的非預期後果一項是本題的高分位。捐衣衝擊接收國本地製衣業，是一個真實而反直覺的後果，亦示範了「善意行為在另一個系統之中可能造成傷害」這一類推理。能夠指出廢物處理負擔一併轉移，屬更完整的答案。\n（d）的重點並非三項措施本身，而是最後那段【何以缺一不可】。三個層面各有其失效模式：個人受制於供應、企業受制於競爭、政策受制於需求。把三者的失效模式逐一寫出，比並列三項措施有力得多 —— 這亦是本科可持續發展議題的核心分析框架。","type":"long","referenceAnswer":"（a）至少三個環節的環境負擔：\n環節一：原料生產。\n棉花種植耗水量極大，並大量使用農藥與化肥，造成水資源壓力與土壤及水體污染。合成纖維（聚酯）則以石油為原料，其生產屬高碳排放，而製品在洗滌過程中會釋出微塑膠纖維，經污水系統進入海洋。\n\n環節二：染整加工。\n染色與後整理是紡織業污染最集中的環節，耗用大量清水，並排出含染料、重金屬與化學助劑的廢水。在環保法規較寬鬆的生產地，此類廢水未必獲得充分處理即排入河道。\n\n環節三：運輸與週轉。\n快時尚的核心是【上新速度】—— 部分品牌每週推出新款，以刺激重複購買。為配合此節奏，供應鏈須頻繁而快速地運輸，部分甚至採用空運，其單位碳排放遠高於海運。\n\n環節四：壽命終結。\n低價與快速更新令衣物的使用壽命大幅縮短，被淘汰的速度遠高於其物理損耗速度。混紡與化學處理令回收困難，大部分最終進入堆填或焚化。\n\n須指出，此四個環節並非各自獨立的問題，而是同一個商業模式的必然結果：低價要求壓縮生產成本（環節一、二），快速更新要求高頻供應（環節三），而低價與快速更新共同縮短了使用壽命（環節四）。\n\n（b）何以捐出舊衣不足以解決：\n其一，它處理的是【已經生產出來的衣物】，而問題的源頭在於【生產與購買的速率】。捐贈只改變舊衣的去向，不減少新衣的產量；若捐出之後隨即再買，總量並無下降。\n其二，捐贈的實際吸納能力有限。捐出的衣物之中，只有一部分品質適合再穿；快時尚產品由於用料與做工的限制，耐用度低，經一輪使用後往往已不具再穿價值。\n其三，捐贈在心理上可能起反作用 —— 它令丟棄變得沒有負擔，於是購買時的顧慮反而減少。\n\n一項非預期後果：\n大量舊衣被輸往接收國之後，可能衝擊當地的紡織與成衣業。廉價（甚至免費）的二手衣物令本地生產者無法競爭，導致本地製衣業萎縮與相關就業流失。原本出於善意的行為，在接收方造成了產業層面的傷害。\n此外，無法轉售的部分最終仍須由接收國處理，等於把廢物處理的負擔一併轉移 —— 而該國的處理設施往往不及輸出國完善。\n\n（c）評論「選購有機棉即可解決問題」：\n此說法只處理了問題的一小部分，不能成立。\n\n合理之處：有機棉在種植階段確實減少了農藥與化肥的使用，對土壤與水體有實質好處。就（a）的環節一而言，此為真實的改善。\n\n何以不足：\n其一，只改善了一個環節。染整、運輸、壽命終結三個環節完全未受影響 —— 一件有機棉 T 恤若經高污染染整、空運到港、穿三次即棄，其總體負擔仍然可觀。\n其二，未觸及消費速率。問題的核心在於【買得太多、用得太短】，而更換材料並不改變這一點。若因為「這是有機棉」而買得更多，總負擔反而上升 —— 此即以道德標籤降低消費心理成本所產生的抵銷效應。\n其三，有機棉本身亦有代價。其單位面積產量一般低於常規棉，故生產同等數量須佔用更多土地與水；「有機」並不等於「無環境成本」，只是成本的分佈不同。\n\n較準確的表述是：選購有機棉是一項有意義的改善，但它是【材料層面】的改善，而快時尚的問題主要在【速率層面】。以前者回應後者，屬答非所問。\n\n（d）三個層面的措施及何以缺一不可：\n\n個人層面：延長每件衣物的使用次數 —— 購買前考慮實際穿著頻率、學習基本修補、選擇耐穿而非應季的款式。\n\n企業層面：延長產品壽命並承擔回收責任 —— 提供維修服務與零件（鈕扣、拉鏈）、設計時採用單一材料以利回收、建立回收計劃並實際處理回收所得，而非僅作宣傳。\n\n政策層面：把外部成本內部化 —— 例如實施生產者延伸責任制度（要求品牌為其產品的壽命終結處理付費）、規管環保聲稱以防止漂綠、或對紡織廢物徵費。\n\n何以三者缺一不可：\n若只有個人層面：個別消費者的選擇無法改變整體供應。市面上若只有低耐用度的產品，願意減少購買並延長使用的消費者亦無從選擇；而個人努力的效果亦會被其餘大多數人的消費所淹沒。\n若只有企業層面：在競爭之中，率先承擔額外成本的企業會處於劣勢。若無政策要求全行業同時遵守，負責任的做法在商業上不可持續 —— 這正是為何自願性的行業承諾長期成效有限。\n若只有政策層面：規管可以設定底線，但無法決定消費者買多少。若購買速率不變，企業只會在合規的前提下繼續生產同樣多的衣物，總量未必下降。\n\n三者的關係是：政策令負責任的做法在商業上可行（拉平競爭條件），企業令消費者有可負責任地選擇的產品（提供選項），而消費者的選擇令這些產品有存在的市場（構成需求）。缺任何一環，其餘兩環的努力皆會落空 —— 這正是環境問題難以由單一層面解決的結構性原因。","markingScheme":"（a）3 分 —— 至少三個環節各 1 分，須連具體的環境負擔；能指出四個環節同源於一個商業模式者，屬完整作答。只寫「污染環境」不給分。\n（b）3 分 —— 指出捐贈處理的是存量而非產生速率（1）；捐贈吸納能力有限或心理上的反效果（1）；非預期後果，須為衝擊接收國產業或廢物負擔轉移（1）。\n（c）2 分 —— 承認有機棉在種植階段的改善（1）；指出其只涵蓋一個環節、未觸及消費速率（1）。全盤否定有機棉者只給半分計入整體。\n（d）2 分 —— 三個層面各有一項可行措施（1）；說明三者缺一不可，須逐一指出各層面單獨行動的失效模式（1）。只答「三方面都要配合」不給分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":18,"trapTypes":null,"dnaTag":null,"mother":null}];

function timing(){
  if(marks.length < 2) return null;

  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "technology-living-written-b1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "technology-living-written-b1.decisions.json"; a.click();
});
counts();
