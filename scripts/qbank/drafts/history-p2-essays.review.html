const DATA = [{"id":"hist_p2_01","topic":"香港的現代化與蛻變","difficulty":"basic","question":"試述二十世紀香港人口變化的主要趨勢，並說明這些變化如何影響香港的城市發展。","explanation":"【卷二論述題・辨識類】官方提問用語：Trace / Describe。\n「試述……並說明」屬兩段式指令：前半要求按時序鋪陳趨勢，後半要求建立因果連繫。只做前半＝只完成一半題目。","type":"long","referenceAnswer":"【核心命題】\n「試述……並說明」屬兩段式指令：前半要求按時序鋪陳趨勢，後半要求建立因果連繫。只做前半＝只完成一半題目。\n\n【必達論點】\n一、須辨明幾個明顯的人口階段，例如戰前的流動人口、1940 年代末至 1950 年代初的大規模遷入、其後的自然增長，以及後期的移民政策調整。\n二、人口壓力如何轉化為具體的城市問題：住屋短缺、寮屋、公共衞生負擔。\n三、須指出政府回應與城市形態的關係，例如公共房屋計劃與新市鎮發展如何改變人口分佈。\n四、宜指出人口結構（而非只是人口數量）的變化，例如勞動人口的年齡與技能構成，如何配合工業化的用工需求。\n\n【常見失分位】\n一、通篇列出人口數字而完全不談城市發展，等於答漏後半題。\n二、把「影響」寫成「同時發生的事」—— 兩件事同時出現不等於有因果關係，須說明機制。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_02","topic":"香港的現代化與蛻變","difficulty":"basic","question":"試解釋香港何以能夠在二十世紀五十至七十年代，由一個轉口港轉型為工業城市。","explanation":"【卷二論述題・解釋類】官方提問用語：Account for。\n「Account for」要求解釋成因，而非描述過程。高下之分在於：能否分辨「外部衝擊」與「本地條件」，並說明兩者如何互相配合。單講其中一邊，論述必然單薄。","type":"long","referenceAnswer":"【核心命題】\n「Account for」要求解釋成因，而非描述過程。高下之分在於：能否分辨「外部衝擊」與「本地條件」，並說明兩者如何互相配合。單講其中一邊，論述必然單薄。\n\n【必達論點】\n一、外部推力：韓戰引致的禁運令轉口貿易的傳統路徑受阻，迫使本地資本另覓出路。\n二、本地條件：南來的資金、機器與企業經驗，加上大量新增而工資偏低的勞動力，構成即時可用的生產要素。\n三、制度與基建：相對簡單而穩定的稅制、可預期的法律環境、以及既有的港口與金融設施，使小型廠商得以低成本起步。\n四、外部市場：歐美市場的需求，以及香港產品在配額與關稅安排下的進入條件，決定了轉型能否持續。\n\n【常見失分位】\n一、只講「香港人勤力」一類性格解釋，缺乏制度與市場條件的分析。\n二、把轉型寫成一次性事件；實際上是持續二十餘年、由多個行業先後接力的過程。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_03","topic":"香港的現代化與蛻變","difficulty":"hard","question":"比較香港在一九五○至一九七○年代與一九八○至一九九七年間，與內地經濟關係的異同。","explanation":"【卷二論述題・比較類】官方提問用語：Compare and contrast。\n比較題必須【逐項對照】，唔可以寫成兩篇各自獨立的段落再讓讀者自行比較。而且題目要求「異同」—— 只寫差異而不寫相同之處，屬答漏一半。","type":"long","referenceAnswer":"【核心命題】\n比較題必須【逐項對照】，唔可以寫成兩篇各自獨立的段落再讓讀者自行比較。而且題目要求「異同」—— 只寫差異而不寫相同之處，屬答漏一半。\n\n【必達論點】\n一、相同之處：兩個時期香港都扮演中介角色，把內地與外部市場連接起來；而兩個時期的關係都受內地本身的政策取向決定，而非由香港單方面選擇。\n二、差異一（性質）：前期以貿易與匯款為主，資本流向大致由外向內；後期則出現大規模的生產轉移，香港廠商把工序北移。\n三、差異二（規模與制度）：改革開放後設立的經濟特區，為兩地經濟關係提供了前所未有的制度通道，這在前期並不存在。\n四、差異三（對香港自身的影響）：後期的關係改變了香港的產業結構本身 —— 製造業比重下降、服務業上升，這是前期未曾出現的結構性後果。\n\n【常見失分位】\n一、寫成「五十年代如何……八十年代如何……」兩段平行敘述，全篇無一句比較。\n二、忽略相同之處，令論述變成單向的「前後不同」。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_04","topic":"香港的現代化與蛻變","difficulty":"intermediate","question":"「二十世紀香港的政治及制度變遷，主要由外部因素推動，而非源於本地社會的訴求。」你在多大程度上同意此說？試就一九○○年至一九九七年間任何兩個階段作答。","explanation":"【卷二論述題・評鑑類】官方提問用語：To what extent do you agree。\n「多大程度上同意」要求的是【程度判斷】，不是二選一。答案應落在「某些方面成立、某些方面不成立」之間，並說明分界線在哪裡。另須留意題目限定「任何兩個階段」—— 只寫一個階段即屬未完成。","type":"long","referenceAnswer":"【核心命題】\n「多大程度上同意」要求的是【程度判斷】，不是二選一。答案應落在「某些方面成立、某些方面不成立」之間，並說明分界線在哪裡。另須留意題目限定「任何兩個階段」—— 只寫一個階段即屬未完成。\n\n【必達論點】\n一、支持此說的證據：戰爭、國際局勢與宗主國本身的政策轉向，往往在短期內促成制度調整，其時機並非由本地訴求決定。\n二、反對此說的證據：本地社會的表達 —— 包括勞資糾紛、社會事件與其後的行政改革訴求 —— 在若干階段確實改變了施政重點。\n三、關鍵在於分辨「觸發時機」與「改革內容」：外部因素往往決定何時改，本地訴求則影響改甚麼。能作此區分者，論述層次明顯較高。\n四、結論須明確落在一個程度上，例如「大體同意，惟後期不成立」，並說明轉折點所在。\n\n【常見失分位】\n一、只寫一個階段，違反題目「任何兩個階段」的限定。\n二、把「多大程度」讀成「同意／不同意」，全篇一面倒，結果無從顯示判斷能力。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_05","topic":"中國現代化","difficulty":"intermediate","question":"「辛亥革命推翻了帝制，卻未能建立一個現代國家。」你在多大程度上同意此說？","explanation":"【卷二論述題・評鑑類】官方提問用語：How far do you agree。\n此說由兩個判斷組成：前半（推翻帝制）幾乎無爭議，後半（未能建國）才是爭論所在。考生須把重心放在後半，並且先界定「現代國家」指甚麼 —— 不作界定，程度判斷便無標準可依。","type":"long","referenceAnswer":"【核心命題】\n此說由兩個判斷組成：前半（推翻帝制）幾乎無爭議，後半（未能建國）才是爭論所在。考生須把重心放在後半，並且先界定「現代國家」指甚麼 —— 不作界定，程度判斷便無標準可依。\n\n【必達論點】\n一、須先確立判準，例如中央權威的有效性、制度化的權力繼承、統一的財政與軍事、以及國民身分的建立。判準一旦列出，後文的評估才有依據。\n二、支持此說：民國初年中央權威迅速瓦解，地方軍事勢力割據，制度化的權力交接始終未能建立。\n三、反對此說：革命確立了共和的正當性，此後任何政權都難以公開回復帝制；同時法律、教育與行政制度的改革並未中斷，屬長期建設的一部分。\n四、宜指出時間尺度的問題：以數年衡量則失敗明顯，以數十年衡量則屬未完成而非失敗。能提出這一層者，判斷明顯較細緻。\n\n【常見失分位】\n一、把全篇寫成辛亥革命的經過敘述，完全不作評估。\n二、不界定「現代國家」而直接下判斷，令程度判斷失去標準。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_06","topic":"中國現代化","difficulty":"basic","question":"試分析五四運動對二十世紀中國現代化進程的影響。","explanation":"【卷二論述題・解釋類】官方提問用語：Analyse。\n「分析影響」要求分層，而非羅列。應分辨思想文化、政治組織與社會三個層面，並指出哪一層的影響最深遠 —— 只並列而不分輕重，等於未作分析。","type":"long","referenceAnswer":"【核心命題】\n「分析影響」要求分層，而非羅列。應分辨思想文化、政治組織與社會三個層面，並指出哪一層的影響最深遠 —— 只並列而不分輕重，等於未作分析。\n\n【必達論點】\n一、思想文化層面：白話文的推廣改變了知識傳播的門檻，使新思想得以越出士人階層。\n二、政治組織層面：運動催生了新的政治組織形式與動員方式，為其後的政黨政治提供了經驗與人才。\n三、社會層面：學生與新興城市群體首次成為可辨認的政治力量，改變了此後政治參與的構成。\n四、須指出影響的兩面性：對傳統的全面否定同時亦帶來文化承續的斷裂，此一代價在評估時不應略去。\n\n【常見失分位】\n一、只寫運動的起因與經過，未觸及「影響」。\n二、把所有其後的變化都歸因於五四，忽略同期其他因素。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_07","topic":"中國現代化","difficulty":"hard","question":"比較晚清政府與南京國民政府的現代化嘗試。何者較為成功？試解釋你的答案。","explanation":"【卷二論述題・比較類】官方提問用語：Compare。\n題目分兩步：先比較，後判斷。判斷「何者較為成功」須先訂立成功的準則，並且準則要對兩者同樣適用 —— 用不同尺去量兩個對象，比較便不成立。","type":"long","referenceAnswer":"【核心命題】\n題目分兩步：先比較，後判斷。判斷「何者較為成功」須先訂立成功的準則，並且準則要對兩者同樣適用 —— 用不同尺去量兩個對象，比較便不成立。\n\n【必達論點】\n一、相同之處：兩者都採取由上而下的改革路徑，都受制於財政不足，亦都面對地方勢力對中央政令的削弱。\n二、差異一：晚清改革在體制正當性受質疑之下推行，改革本身反而加速了政權的瓦解；南京政府則在共和框架下推行，正當性問題性質不同。\n三、差異二：南京政府在關稅自主、法律編纂、幣制與交通建設等具體範疇有可辨認的成果，惟推行範圍集中於部分地區。\n四、差異三：外部條件不同 —— 晚清面對的是列強的直接壓力，南京政府則在日本侵略的持續威脅下推行建設，時間被戰爭截斷。\n\n【常見失分位】\n一、只答「何者較成功」而略去比較，或只比較而不作判斷 —— 兩者都屬答漏一半。\n二、以「最終都失敗了」作結而不作區分，等於迴避題目要求的判斷。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_08","topic":"中國現代化","difficulty":"hard","question":"試評價「文化大革命」對中國現代化的影響。","explanation":"【卷二論述題・評鑑類】官方提問用語：Evaluate。\n「評價」要求下判斷並說明理據，而非單純鋪陳後果。須分辨即時衝擊與長期後果 —— 兩者方向未必一致，能指出此點者，評價層次較高。","type":"long","referenceAnswer":"【核心命題】\n「評價」要求下判斷並說明理據，而非單純鋪陳後果。須分辨即時衝擊與長期後果 —— 兩者方向未必一致，能指出此點者，評價層次較高。\n\n【必達論點】\n一、對教育與專業人才的衝擊：正常教學與科研長期中斷，造成一代人的訓練斷層，其影響延續至其後數十年。\n二、對制度的衝擊：既有行政與法律程序受到破壞，權威依附於個人而非制度，制度化的治理受挫。\n三、對經濟的影響須分區分業討論，不宜一概而論；某些工業部門在此期間仍有推進，須如實指出。\n四、長期後果的另一面：這段經歷本身成為其後推行改革的政治條件之一，令「不再重複」成為共識。此點屬評價中最容易被略去的一環。\n\n【常見失分位】\n一、只作道德譴責而缺乏具體的機制分析。\n二、把整段時期寫成完全停滯，與實際情況不符。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_09","topic":"中國現代化","difficulty":"intermediate","question":"「一九七八年是中國現代化的轉捩點。」你在多大程度上同意此說？","explanation":"【卷二論述題・評鑑類】官方提問用語：To what extent。\n「轉捩點」題型有固定的答題邏輯：須同時處理【變】與【不變】。只講改革開放帶來多少變化，並未證明它是「轉捩點」—— 還須說明此前的軌跡確實被改變，而非延續。","type":"long","referenceAnswer":"【核心命題】\n「轉捩點」題型有固定的答題邏輯：須同時處理【變】與【不變】。只講改革開放帶來多少變化，並未證明它是「轉捩點」—— 還須說明此前的軌跡確實被改變，而非延續。\n\n【必達論點】\n一、支持：資源配置方式、對外經濟關係、以及發展目標的優先次序，在此前後有可辨認的分別。\n二、反對或限定：若干制度性條件（如工業基礎、教育體系的重建、以及此前已開始的對外接觸）在一九七八年之前已經存在，改革是接續而非從零開始。\n三、宜指出「轉捩點」可以是過程而非一個年份：一九七八年是決策的節點，實際轉向則分階段展開。\n四、結論須明確落在一個程度，並說明以甚麼判準得出此程度。\n\n【常見失分位】\n一、只鋪陳改革開放的成果，完全不處理「此前是否已在改變」。\n二、把「轉捩點」等同「重要」—— 重要的事件未必是轉捩點。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_10","topic":"中國現代化","difficulty":"hard","question":"試解釋第一個五年計劃與「大躍進」在成效上何以出現如此明顯的差異。","explanation":"【卷二論述題・解釋類】官方提問用語：Account for。\n題目問「何以出現差異」，即要求【對照式因果分析】：不是分別解釋兩者，而是指出哪些條件在一個存在、在另一個缺席，因而造成分別。","type":"long","referenceAnswer":"【核心命題】\n題目問「何以出現差異」，即要求【對照式因果分析】：不是分別解釋兩者，而是指出哪些條件在一個存在、在另一個缺席，因而造成分別。\n\n【必達論點】\n一、目標設定的性質不同：前者的指標建基於可核算的產能，後者的指標則在動員過程中不斷上調，脫離實際基礎。\n二、技術與外部支援：前者得到系統的外部技術輸入與成套設備，後者在外部支援中斷後仍維持高指標。\n三、資訊機制：上報制度在後一時期失去糾偏能力，錯誤的產量資訊令決策無法及時修正 —— 這是差異的核心機制之一。\n四、資源調配的代價：後者把大量勞動力由農業抽調至其他用途，直接影響糧食生產，形成連鎖後果。\n\n【常見失分位】\n一、分別描述兩個計劃而不作對照，未回應「何以出現差異」。\n二、把差異全部歸因於單一因素（如天氣），忽略決策與資訊機制。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_11","topic":"日本現代化","difficulty":"intermediate","question":"「二十世紀初日本的現代化，只是表面的西化。」試評論此說。","explanation":"【卷二論述題・評鑑類】官方提問用語：Comment on。\n「評論」要求對此說作出判斷，包括指出它在哪些方面有理、哪些方面失實。關鍵在於分辨【制度層面】與【社會價值層面】的現代化程度是否一致 —— 此說的部分成立之處，正在於兩者不一致。","type":"long","referenceAnswer":"【核心命題】\n「評論」要求對此說作出判斷，包括指出它在哪些方面有理、哪些方面失實。關鍵在於分辨【制度層面】與【社會價值層面】的現代化程度是否一致 —— 此說的部分成立之處，正在於兩者不一致。\n\n【必達論點】\n一、此說失實之處：憲政架構、常備軍、工業基礎與現代教育制度均屬實質建設，並非模仿外觀。\n二、此說成立之處：政治參與的擴大與社會結構的變化，明顯落後於制度與工業的現代化，兩者步伐不一。\n三、須指出這種「不一致」本身的後果：制度上的現代國家能力與未相應轉變的社會取向結合，構成其後對外擴張的條件之一。\n四、宜以判準作結：若以國家能力衡量，此說不成立；若以社會與政治的現代性衡量，此說有其道理。\n\n【常見失分位】\n一、只列舉日本的現代化成就以否定此說，未處理其成立之處。\n二、把「西化」與「現代化」當作同義詞使用，令論述失焦。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_12","topic":"日本現代化","difficulty":"intermediate","question":"試說明二十世紀初日本國內的政治、社會及經濟條件，如何導致軍國主義的興起。","explanation":"【卷二論述題・解釋類】官方提問用語：Explain。\n題目已列明三個層面，即三個層面都要處理；並且問的是「如何導致」，要求建立由條件到結果的推導鏈，而非分別描述三種條件。","type":"long","referenceAnswer":"【核心命題】\n題目已列明三個層面，即三個層面都要處理；並且問的是「如何導致」，要求建立由條件到結果的推導鏈，而非分別描述三種條件。\n\n【必達論點】\n一、政治條件：軍部在憲政架構中的特殊地位，使其可以繞過內閣直達最高決策，文人政府缺乏有效制衡手段。\n二、經濟條件：對外部資源與市場的依賴，加上一九三○年代初的經濟衝擊，令「以擴張解決經濟問題」的主張獲得現實基礎。\n三、社會條件：農村困境與城鄉差距，使軍隊成為部分群體的上流途徑，亦令激進主張在特定社群中取得支持。\n四、須指出三者的互相強化：政治上的制衡缺失，令經濟與社會不滿可以直接轉化為對外行動，而非停留在國內爭論。\n\n【常見失分位】\n一、只講軍部的野心，把軍國主義寫成少數人的選擇，忽略使其成為可能的結構條件。\n二、三個層面只答其中一兩個，違反題目的明確限定。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_13","topic":"日本現代化","difficulty":"basic","question":"第二次世界大戰後日本的經濟復甦有多成功？試解釋你的答案。","explanation":"【卷二論述題・評鑑類】官方提問用語：How successful。\n「有多成功」要求先界定成功的量度標準（產出、生活水平、國際地位、抑或分配），再作程度判斷。不訂標準而直接說「非常成功」，並未回答題目。","type":"long","referenceAnswer":"【核心命題】\n「有多成功」要求先界定成功的量度標準（產出、生活水平、國際地位、抑或分配），再作程度判斷。不訂標準而直接說「非常成功」，並未回答題目。\n\n【必達論點】\n一、以產出與國際地位衡量：復甦速度與規模明顯，日本在數十年間重回主要經濟體之列。\n二、須指出外部條件的作用：戰後的國際安排、外部市場的開放，以及區域局勢帶來的需求，都是復甦的條件而非日本單方面的成果。\n三、須指出內部因素：產業政策、企業組織形式、以及高儲蓄與人力資本的配合。\n四、成功的限度：發展模式對外部需求的依賴，以及其後顯現的結構問題，應在評估中一併指出。\n\n【常見失分位】\n一、只列舉增長數字，不作程度判斷。\n二、把復甦完全歸功於外部援助，忽略內部制度與政策。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_14","topic":"日本現代化","difficulty":"hard","question":"比較日本與中國在二十世紀現代化道路上的異同。","explanation":"【卷二論述題・比較類】官方提問用語：Compare and contrast。\n跨單元比較題。必須設定共同的比較軸（例如：改革的推動主體、與外部世界的關係、以及制度連續性），沿同一組軸逐項對照 —— 否則會變成兩篇國別史。","type":"long","referenceAnswer":"【核心命題】\n跨單元比較題。必須設定共同的比較軸（例如：改革的推動主體、與外部世界的關係、以及制度連續性），沿同一組軸逐項對照 —— 否則會變成兩篇國別史。\n\n【必達論點】\n一、相同之處：兩者都在外部壓力下啟動現代化，都以國家為主要推動者，亦都經歷過現代化與傳統秩序之間的張力。\n二、差異一（制度連續性）：日本的現代化在既有政權延續之下推進；中國則經歷多次政權更替，制度建設反覆中斷。\n三、差異二（與外部世界的位置）：日本由被要求開放轉為對外擴張；中國長期處於被侵奪的一方，現代化與救亡糾結一起。\n四、差異三（時序）：兩者的現代化高峰期不同，日本在二十世紀上半葉，中國則在下半葉後期，比較時須注意時段錯位。\n\n【常見失分位】\n一、寫成「日本如何……中國如何……」的並列敘述。\n二、只比較結果而不比較條件，令異同缺乏解釋力。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_15","topic":"東南亞：由殖民地到獨立國家","difficulty":"basic","question":"試解釋第二次世界大戰後東南亞出現去殖民化浪潮的原因。","explanation":"【卷二論述題・解釋類】官方提問用語：Account for。\n「解釋原因」須分辨層次：宗主國一方的條件變化、殖民地一方的力量成長、以及國際環境的轉變。三者缺一，因果解釋都不完整。","type":"long","referenceAnswer":"【核心命題】\n「解釋原因」須分辨層次：宗主國一方的條件變化、殖民地一方的力量成長、以及國際環境的轉變。三者缺一，因果解釋都不完整。\n\n【必達論點】\n一、宗主國一方：戰爭嚴重削弱了歐洲殖民國家的財政與軍事能力，維持殖民統治的成本上升而收益下降。\n二、殖民地一方：戰時日本佔領打破了「歐洲人不可戰勝」的形象，同時本地政治組織與武裝力量在戰時得到成長。\n三、國際環境：戰後兩個主要強國均不支持恢復舊有殖民秩序，國際輿論亦轉向民族自決。\n四、宜指出各地時序與方式的差異，並說明何以差異出現 —— 這正是下一題比較的基礎。\n\n【常見失分位】\n一、把去殖民化寫成單一原因（如「民族主義興起」）的結果。\n二、把整個東南亞當成同質整體，忽略各地情況的重大差異。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_16","topic":"東南亞：由殖民地到獨立國家","difficulty":"hard","question":"比較二十世紀東南亞國家爭取獨立所採取方法的異同。試就任何兩個國家作答。","explanation":"【卷二論述題・比較類】官方提問用語：Compare and contrast。\n題目限定「任何兩個國家」——只寫一個或泛論全區，均屬未回應限定。比較軸宜包括：手段（談判抑或武裝）、動員基礎、以及宗主國的回應方式。","type":"long","referenceAnswer":"【核心命題】\n題目限定「任何兩個國家」——只寫一個或泛論全區，均屬未回應限定。比較軸宜包括：手段（談判抑或武裝）、動員基礎、以及宗主國的回應方式。\n\n【必達論點】\n一、相同之處：兩者的獨立運動都以戰時經驗為轉折，都須解決獨立後政治權力歸屬的問題。\n二、差異（手段）：有的以談判與憲制安排達成移交，有的則經歷長期武裝衝突。須說明造成此差異的條件，而非只作陳述。\n三、差異（宗主國的態度）：不同宗主國對放棄殖民地的意願與能力並不相同，此點往往比殖民地一方的策略更能解釋結果。\n四、差異（獨立後的後果）：取得獨立的方式，影響其後國家建設的起點與內部分裂的程度。\n\n【常見失分位】\n一、只寫一個國家，或泛論「東南亞各國」而無具體對象。\n二、比較手段而不解釋手段何以不同，論述停留在描述層面。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_17","topic":"東南亞：由殖民地到獨立國家","difficulty":"intermediate","question":"「西方殖民統治為東南亞留下的遺產，弊多於利。」此說是否公允？","explanation":"【卷二論述題・評鑑類】官方提問用語：Is it fair to say。\n「是否公允」要求檢視此說本身是否成立，包括它有沒有以偏概全。關鍵在於：「遺產」須分項評估（行政、教育、經濟結構、族群關係、疆界），而非整體打一個分數。","type":"long","referenceAnswer":"【核心命題】\n「是否公允」要求檢視此說本身是否成立，包括它有沒有以偏概全。關鍵在於：「遺產」須分項評估（行政、教育、經濟結構、族群關係、疆界），而非整體打一個分數。\n\n【必達論點】\n一、支持此說：經濟結構被塑造為單一出口導向，獨立後長期難以改變；殖民時期的族群分治政策，成為其後內部衝突的根源之一。\n二、支持此說：疆界的劃定往往按殖民行政方便而非按當地實況，為獨立後留下領土與族群問題。\n三、須處理另一面：行政制度、法律架構與若干基建在獨立後被繼承並繼續運作，此點不宜略去。\n四、公允與否的判斷：此說作為整體判斷失之籠統，但就經濟結構與族群關係而言則有充分根據。能作此區分者，回應最為準確。\n\n【常見失分位】\n一、把「是否公允」讀成「同意與否」，錯過了檢視此說本身是否過於概括的要求。\n二、只列殖民統治的惡果而不處理任何反面證據。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_18","topic":"東南亞：由殖民地到獨立國家","difficulty":"basic","question":"東南亞國家聯盟在推動區域合作方面有多有效？","explanation":"【卷二論述題・評鑑類】官方提問用語：How effective。\n「有多有效」要求先訂立有效性的判準（例如：能否防止成員國之間爆發武裝衝突、能否協調共同立場、能否推動經濟整合），再逐項評估。","type":"long","referenceAnswer":"【核心命題】\n「有多有效」要求先訂立有效性的判準（例如：能否防止成員國之間爆發武裝衝突、能否協調共同立場、能否推動經濟整合），再逐項評估。\n\n【必達論點】\n一、有效之處：為區內成員提供了持續的對話機制，成員國之間長期未有爆發大規模武裝衝突。\n二、有效之處：在對外事務上，集體立場使小國在與區外強權交涉時取得較大的分量。\n三、局限：以協商一致與不干預內政為原則，令組織在成員國內部問題上幾乎無從介入。\n四、局限：經濟整合的深度受成員國發展水平差異所限，與其他區域組織相比進度較慢。\n\n【常見失分位】\n一、只描述東盟的成立與架構，未作有效性評估。\n二、以「非常成功」或「完全失敗」作結，未按判準分項處理。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_19","topic":"第一次世界大戰","difficulty":"intermediate","question":"「第一次世界大戰之所以爆發，結盟制度應負最大責任。」你在多大程度上同意此說？","explanation":"【卷二論述題・評鑑類】官方提問用語：To what extent do you agree。\n「應負最大責任」屬相對判斷 —— 必須把結盟制度與其他因素（軍備競賽、帝國爭奪、民族主義、七月危機中的決策）放在一起比較，才能說明何者為最。只論證結盟制度有責任，並未回應「最大」。","type":"long","referenceAnswer":"【核心命題】\n「應負最大責任」屬相對判斷 —— 必須把結盟制度與其他因素（軍備競賽、帝國爭奪、民族主義、七月危機中的決策）放在一起比較，才能說明何者為最。只論證結盟制度有責任，並未回應「最大」。\n\n【必達論點】\n一、支持：結盟把一場地區爭端轉化為全面戰爭，其連鎖機制是局部衝突升級為大戰的直接通道。\n二、反駁：結盟本身是既有敵對關係的結果而非原因；若無此前的帝國爭奪與軍備競賽，結盟不會形成兩大對立陣營。\n三、另一因素：七月危機中的具體決策 —— 包括動員時間表的僵化 —— 使外交迴旋空間迅速消失，此屬直接原因。\n四、較細緻的判斷：可指出結盟制度是「使戰爭規模擴大」的最大責任者，卻未必是「使戰爭爆發」的最大責任者。能作此區分者，論述層次明顯較高。\n\n【常見失分位】\n一、只論證結盟制度有責任，完全不與其他因素比較。\n二、混淆長遠成因與導火線，把兩者當成同一問題處理。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_20","topic":"第一次世界大戰","difficulty":"intermediate","question":"試檢視巴黎和會對其後國際秩序的影響。","explanation":"【卷二論述題・解釋類】官方提問用語：Examine。\n「檢視」要求逐項審視並指出其得失，而非單向褒貶。須同時處理和會的制度創設（集體安全的嘗試）與其安排所埋下的問題。","type":"long","referenceAnswer":"【核心命題】\n「檢視」要求逐項審視並指出其得失，而非單向褒貶。須同時處理和會的制度創設（集體安全的嘗試）與其安排所埋下的問題。\n\n【必達論點】\n一、制度層面：首次嘗試以常設國際組織維持和平，確立了集體安全的原則，即使其執行機制存在明顯缺陷。\n二、領土與民族安排：以民族自決為原則重劃疆界，但實際劃分無法與族群分佈完全吻合，留下少數族群問題。\n三、對戰敗國的處置：賠償與軍備限制的安排，在戰敗國國內形成持續的不滿，成為其後政治動員的資源。\n四、須指出因果的限度：和會的安排是其後衝突的條件之一，但由條件到結果之間仍有其他選擇，不宜寫成必然。\n\n【常見失分位】\n一、把和會寫成純粹的失敗，忽略其制度創設的意義。\n二、只複述條約條款而不分析影響。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_21","topic":"第二次世界大戰","difficulty":"hard","question":"「《凡爾賽條約》是第二次世界大戰爆發的主要原因。」此說是否有充分理據？","explanation":"【卷二論述題・評鑑類】官方提問用語：Is it justified。\n「是否有充分理據」要求檢驗因果鏈是否成立，而非只問同意與否。中間隔了二十年，故必須說明條約如何經由具體機制影響一九三○年代的決策 —— 否則只是時序上的先後，而非因果。","type":"long","referenceAnswer":"【核心命題】\n「是否有充分理據」要求檢驗因果鏈是否成立，而非只問同意與否。中間隔了二十年，故必須說明條約如何經由具體機制影響一九三○年代的決策 —— 否則只是時序上的先後，而非因果。\n\n【必達論點】\n一、支持的理據：條約條款為戰敗國國內的政治動員提供了持續有效的訴求，「修改條約」成為可號召的目標。\n二、削弱此說的理據：一九三○年代的經濟危機、集體安全機制的失效、以及當時各國的具體政策選擇，都是獨立於條約的因素。\n三、須處理時間跨度的問題：若條約是主因，須解釋何以二十年代並未爆發同類衝突 —— 能提出並回應此一質疑者，論述最為紮實。\n四、較準確的表述：條約提供了條件與訴求，但由條件到戰爭之間，其他因素才是決定性的。\n\n【常見失分位】\n一、把「先發生」當作「導致」，未說明中間的機制。\n二、只複述條約的苛刻條款，未回應「是否主因」的比較要求。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_22","topic":"第二次世界大戰","difficulty":"hard","question":"比較兩次世界大戰之後的和平安排。","explanation":"【卷二論述題・比較類】官方提問用語：Compare and contrast。\n比較軸宜包括：對戰敗國的處置、國際組織的設計、大國的參與程度、以及安排的持久性。沿同一組軸逐項對照，並在結尾指出何以第二次的安排較為持久。","type":"long","referenceAnswer":"【核心命題】\n比較軸宜包括：對戰敗國的處置、國際組織的設計、大國的參與程度、以及安排的持久性。沿同一組軸逐項對照，並在結尾指出何以第二次的安排較為持久。\n\n【必達論點】\n一、對戰敗國的處置：前者以懲罰與賠償為主軸；後者則在佔領與改造之外，同時納入重建援助，使戰敗國得以重新融入國際體系。\n二、國際組織：兩次都建立了維持和平的常設組織，但後者在安全理事會的設計上，讓主要大國同時參與並持有否決權。\n三、大國參與：前者的組織缺少若干主要強國的參與，削弱其執行力；後者則在成立之初已納入主要強國。\n四、持久性的比較與解釋：後者的安排維持較久，原因不只在條款本身，亦在於其後形成的兩極結構抑制了正面衝突。此點屬較高層次的觀察。\n\n【常見失分位】\n一、分別敘述兩次和約而不作對照。\n二、只比較條款而不比較執行機制與大國參與，忽略決定持久性的關鍵。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_23","topic":"第二次世界大戰","difficulty":"hard","question":"試從政治、社會、經濟及文化四方面，評價兩次世界大戰的歷史意義。","explanation":"【卷二論述題・評鑑類】官方提問用語：Assess。\n題目明列四個方面，即四方面都須處理；並且問的是「意義」而非「後果」—— 意義要求判斷其重要程度，而非羅列發生了甚麼。","type":"long","referenceAnswer":"【核心命題】\n題目明列四個方面，即四方面都須處理；並且問的是「意義」而非「後果」—— 意義要求判斷其重要程度，而非羅列發生了甚麼。\n\n【必達論點】\n一、政治：帝國的瓦解與新國家的出現改變了世界政治版圖；國際組織的建立確立了以多邊機制處理衝突的原則。\n二、社會：戰時動員改變了婦女的勞動參與與社會位置；戰後的社會政策擴張，在多國成為長期制度。\n三、經濟：生產與貿易的重心轉移，戰後的國際經濟制度安排改變了各國經濟關係的規則。\n四、文化：戰爭經驗改變了對進步與理性的信心，並在文學、藝術與思想上留下可辨認的痕跡。\n\n【常見失分位】\n一、四方面只答其中兩三個，違反題目明確限定。\n二、把「意義」寫成「後果清單」，未作重要程度的判斷。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_24","topic":"第二次世界大戰","difficulty":"intermediate","question":"兩次世界大戰之間，建立集體安全的努力何以未能成功？","explanation":"【卷二論述題・解釋類】官方提問用語：Why。\n須分辨【設計上的缺陷】與【執行時的選擇】：制度本身的問題與各國不願承擔代價，是兩種不同的失敗原因，兩者都須處理。","type":"long","referenceAnswer":"【核心命題】\n須分辨【設計上的缺陷】與【執行時的選擇】：制度本身的問題與各國不願承擔代價，是兩種不同的失敗原因，兩者都須處理。\n\n【必達論點】\n一、設計缺陷：缺乏獨立的執行力量，制裁的實施依賴成員國自願配合。\n二、成員構成：若干主要強國始終未有參與或中途退出，令組織的代表性與威懾力受限。\n三、執行時的選擇：面對具體侵略事件時，主要國家因國內政治與經濟考慮而不願承擔對抗的代價。\n四、經濟環境：一九三○年代的經濟危機使各國轉向自保，國際合作的政治基礎隨之削弱。\n\n【常見失分位】\n一、把失敗全部歸咎於制度設計，忽略當時的政策選擇。\n二、只舉一兩個事件為例，未提煉出共通的失敗機制。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_25","topic":"冷戰","difficulty":"basic","question":"試解釋冷戰的起源。","explanation":"【卷二論述題・解釋類】官方提問用語：Account for。\n起源題最易犯的錯，是把責任歸於單一方。較穩妥的處理是分辨三個層次：意識形態的根本對立、戰後權力真空所造成的結構性衝突、以及雙方在具體事件中的互相誤讀。","type":"long","referenceAnswer":"【核心命題】\n起源題最易犯的錯，是把責任歸於單一方。較穩妥的處理是分辨三個層次：意識形態的根本對立、戰後權力真空所造成的結構性衝突、以及雙方在具體事件中的互相誤讀。\n\n【必達論點】\n一、意識形態：兩種關於經濟組織與政治正當性的主張互不相容，令任何一方的擴張都被對方讀作威脅。\n二、結構因素：戰後歐洲出現權力真空，兩個主要強國同時填補，接觸面擴大，摩擦隨之而來。\n三、安全困境：一方為求安全而採取的措施，在另一方看來是進攻準備，遂引發對等回應，形成螺旋。\n四、歷史經驗的作用：雙方各自帶著上一場戰爭的教訓進入戰後 —— 一方警惕綏靖，一方警惕被入侵 —— 令妥協的空間進一步收窄。\n\n【常見失分位】\n一、把冷戰的起源寫成單方面的責任，忽略互動過程。\n二、只列舉一連串事件，未指出使這些事件連成冷戰的機制。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_26","topic":"冷戰","difficulty":"hard","question":"「緩和並未真正改變美蘇對抗的本質。」你在多大程度上同意此說？","explanation":"【卷二論述題・評鑑類】官方提問用語：To what extent do you agree。\n此說的關鍵詞是「本質」。須先分辨【對抗的形式】與【對抗的本質】：形式的緩和（協議、會談、貿易）是否等同本質的改變，正是爭論所在。","type":"long","referenceAnswer":"【核心命題】\n此說的關鍵詞是「本質」。須先分辨【對抗的形式】與【對抗的本質】：形式的緩和（協議、會談、貿易）是否等同本質的改變，正是爭論所在。\n\n【必達論點】\n一、支持此說：軍備競賽在緩和期間並未停止，只是轉向受限制的軌道；雙方在第三地區的競爭同時持續甚至加劇。\n二、反對此說：制度化的溝通渠道與軍備控制協議，實際降低了意外升級的風險，這本身是關係性質的改變。\n三、須指出緩和的動機：雙方各有現實的內部理由（經濟壓力、戰略平衡的成本），動機的功利性支持「本質未變」一說。\n四、較細緻的判斷：可指出本質未變而風險管理已變 —— 這正是緩和其後可以迅速逆轉的原因。\n\n【常見失分位】\n一、只列舉緩和時期的協議，未回應「本質」是否改變。\n二、把緩和寫成冷戰的結束，混淆了兩個不同階段。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_27","topic":"冷戰","difficulty":"basic","question":"試分析蘇聯及華沙條約組織瓦解的原因。","explanation":"【卷二論述題・解釋類】官方提問用語：Analyse。\n「分析原因」須分層並排序：長期的結構因素、中期的政策選擇、以及短期的觸發事件。只列舉而不排序，等於未作分析。","type":"long","referenceAnswer":"【核心命題】\n「分析原因」須分層並排序：長期的結構因素、中期的政策選擇、以及短期的觸發事件。只列舉而不排序，等於未作分析。\n\n【必達論點】\n一、結構因素：經濟體系在資源配置與技術更新上的長期困難，加上維持軍事平衡與外部承諾的沉重負擔。\n二、政策選擇：改革同時鬆動了經濟與政治的既有控制，卻未能及時建立替代機制，形成權威真空。\n三、對外政策的轉向：放棄以武力維持東歐既有體制的承諾，使各國的變革得以在短時間內連鎖發生。\n四、民族因素：加盟共和國的民族訴求在控制鬆動後迅速政治化，成為聯盟解體的直接通道。\n\n【常見失分位】\n一、把瓦解歸因於單一領導人的決策，忽略結構條件。\n二、把外部壓力寫成唯一原因，忽略內部的經濟與民族因素。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_28","topic":"戰後衝突與聯合國","difficulty":"hard","question":"比較以色列與阿拉伯國家之間的衝突，與巴爾幹地區種族衝突的成因。","explanation":"【卷二論述題・比較類】官方提問用語：Compare。\n兩個案例的表面同屬「族群衝突」，但成因結構不同。比較軸宜設為：歷史記憶、外部勢力的介入、國家建構的過程、以及territorial 安排的來源。","type":"long","referenceAnswer":"【核心命題】\n兩個案例的表面同屬「族群衝突」，但成因結構不同。比較軸宜設為：歷史記憶、外部勢力的介入、國家建構的過程、以及territorial 安排的來源。\n\n【必達論點】\n一、相同之處：兩者的衝突都涉及對同一片土地的競爭性主張，都以歷史與族群記憶作為動員基礎。\n二、相同之處：兩者的現代形態，都與外部強權此前所作的安排有關 —— 疆界與治理架構並非由當地各方協商產生。\n三、差異：前者長期處於區域國際政治的核心，外部強權的持續介入使衝突國際化；後者則在一個多民族國家解體的過程中爆發，性質上更接近內部秩序崩解。\n四、差異：衝突的單位不同 —— 前者主要是國家之間，後者主要是同一國境內的族群之間，這決定了可用的解決機制並不相同。\n\n【常見失分位】\n一、把兩者都簡化為「宗教衝突」，忽略各自的政治與領土成因。\n二、只描述衝突經過，未比較成因。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_29","topic":"戰後衝突與聯合國","difficulty":"intermediate","question":"聯合國在解決二十世紀下半葉的重大衝突方面有多有效？","explanation":"【卷二論述題・評鑑類】官方提問用語：How effective。\n「有多有效」須先界定聯合國可以做甚麼 —— 它並非主權之上的政府。以「能否阻止一切戰爭」為標準，結論必然是失敗；以「在成員國同意的範圍內能做到甚麼」為標準，評估才有意義。","type":"long","referenceAnswer":"【核心命題】\n「有多有效」須先界定聯合國可以做甚麼 —— 它並非主權之上的政府。以「能否阻止一切戰爭」為標準，結論必然是失敗；以「在成員國同意的範圍內能做到甚麼」為標準，評估才有意義。\n\n【必達論點】\n一、有效之處：在若干衝突中成功促成停火、部署維持和平部隊並監督撤軍，減少了衝突的規模與持續時間。\n二、有效之處：作為持續的協商場所，即使在對立最深的時期亦保持了溝通渠道；並在去殖民化與人道議題上發揮規範作用。\n三、局限：安全理事會的否決權設計，令涉及主要強國利益的衝突幾乎必然陷入僵局。\n四、局限：缺乏獨立的執行力量，行動依賴成員國提供資源與同意，這決定了其有效性的上限。\n\n【常見失分位】\n一、以「未能阻止所有戰爭」作結，等同用一個不可能達到的標準作評估。\n二、只描述聯合國的架構，未作有效性評估。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_30","topic":"戰後衝突與聯合國","difficulty":"intermediate","question":"試解釋南非種族隔離制度何以能夠長期維持，以及它最終得以終結的原因。","explanation":"【卷二論述題・解釋類】官方提問用語：Account for。\n題目有兩問：何以維持、何以終結。兩者要用同一組因素去解釋 —— 說明是哪些條件的變化，令原本支撐制度的力量不再足夠。只答其中一問屬未完成。","type":"long","referenceAnswer":"【核心命題】\n題目有兩問：何以維持、何以終結。兩者要用同一組因素去解釋 —— 說明是哪些條件的變化，令原本支撐制度的力量不再足夠。只答其中一問屬未完成。\n\n【必達論點】\n一、維持的條件：法律與行政體系的全面配合、經濟結構對受管制勞動力的依賴、以及國家強制力的有效運用。\n二、維持的外部條件：冷戰格局曾使若干外部國家淡化對該制度的壓力，優先考慮區域戰略。\n三、終結的內部因素：持續的內部抵抗使管治成本不斷上升，經濟亦因勞動力與技能限制而受制。\n四、終結的外部因素：國際制裁、資本撤離與體育文化上的孤立累積效應；冷戰結束後，外部維持沉默的戰略理由亦不再存在。\n\n【常見失分位】\n一、只答終結原因而略去維持的條件，或反之。\n二、把終結完全歸因於外部制裁，忽略內部抵抗與經濟因素。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_31","topic":"國際合作","difficulty":"intermediate","question":"「戰後歐洲的經濟復甦，主要有賴美國的援助。」你在多大程度上同意此說？","explanation":"【卷二論述題・評鑑類】官方提問用語：To what extent do you agree。\n「主要有賴」屬相對判斷，須把外部援助與歐洲自身的條件（既有工業基礎、技術人力、以及各國本身的政策）放在一起衡量，方能說明「主要」是否成立。","type":"long","referenceAnswer":"【核心命題】\n「主要有賴」屬相對判斷，須把外部援助與歐洲自身的條件（既有工業基礎、技術人力、以及各國本身的政策）放在一起衡量，方能說明「主要」是否成立。\n\n【必達論點】\n一、支持：援助在關鍵時刻解決了外匯與原料短缺，使生產得以重啟；其附帶條件亦推動了成員國之間的經濟協調。\n二、反駁：歐洲的工業基礎、技術人力與制度能力在戰後仍然存在，援助所提供的是重啟的條件而非復甦的內容。\n三、反駁：各國自身的政策選擇 —— 貨幣改革、投資方向、勞資安排 —— 決定了同樣的援助在不同國家產生不同效果。\n四、較細緻的判斷：援助的作用可能在【政治與制度】層面大於【純經濟】層面 —— 它使一體化的合作安排成為可能。\n\n【常見失分位】\n一、只描述援助計劃的內容，未作程度判斷。\n二、把歐洲寫成被動的受援方，忽略各國自身的政策與能力。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_32","topic":"國際合作","difficulty":"basic","question":"試論二十世紀歐洲經濟一體化的進程及其意義。","explanation":"【卷二論述題・解釋類】官方提問用語：Discuss。\n「試論」要求同時處理進程（如何一步步發生）與意義（為何重要），並且兩者要連起來 —— 意義應由進程本身的特徵推導出來，而非另起一段。","type":"long","referenceAnswer":"【核心命題】\n「試論」要求同時處理進程（如何一步步發生）與意義（為何重要），並且兩者要連起來 —— 意義應由進程本身的特徵推導出來，而非另起一段。\n\n【必達論點】\n一、進程的階段性：由特定產業的共同管理，逐步擴展至關稅同盟、共同市場以至更深的政策協調，每一步都建基於前一步的成果。\n二、推動力：戰後避免再戰的政治需要，與擴大市場的經濟需要同時存在，兩者互相支持。\n三、意義（政治）：把原本可能導致衝突的資源與產業置於共同管理之下，使戰爭的物質基礎受到制約。\n四、意義（示範作用）：一體化提供了主權國家自願讓渡部分權限以換取共同利益的實例，對其他區域組織有參照意義；惟亦須指出其代價與爭議。\n\n【常見失分位】\n一、只列出各項條約與年份，未說明意義。\n二、把一體化寫成一路順利的過程，忽略當中的爭議與挫折。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_33","topic":"國際合作","difficulty":"intermediate","question":"試評價二十世紀國際社會及文化合作的成就與局限。試就人口與資源、環境保護、醫學與科技三個範疇中任選其二作答。","explanation":"【卷二論述題・評鑑類】官方提問用語：Evaluate。\n題目要求「成就與局限」兩面，並限定「任選其二」。兩面都要處理、範疇數目要對 —— 這兩項限定是評分時最先檢查的位置。","type":"long","referenceAnswer":"【核心命題】\n題目要求「成就與局限」兩面，並限定「任選其二」。兩面都要處理、範疇數目要對 —— 這兩項限定是評分時最先檢查的位置。\n\n【必達論點】\n一、成就（醫學與科技）：跨國協作在疾病防治上取得可核實的成果，示範了以共同機構處理跨境問題的可行性。\n二、成就（環境保護）：從個別議題出發的國際協議，逐步建立了監測、報告與檢討的常設機制。\n三、局限：合作的深度受制於各國發展階段與利益差異，承擔成本的意願往往與受益程度不成比例。\n四、局限：缺乏約束力的執行機制，令協議的實際效果高度依賴各國自願履行。\n\n【常見失分位】\n一、只答成就而不答局限（或相反），答漏一半。\n二、三個範疇全部略談，違反「任選其二」的限定，反而令論述失去深度。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_34","topic":"國際合作","difficulty":"hard","question":"比較美國與蘇聯在第二次世界大戰後歐洲重建中所扮演的角色。","explanation":"【卷二論述題・比較類】官方提問用語：Compare and contrast。\n比較軸宜設為：資源流向、對受援／受控地區經濟制度的塑造、以及政治目的。須指出兩者在【手段】上不同，但在【以經濟手段服務戰略目的】這一點上相同。","type":"long","referenceAnswer":"【核心命題】\n比較軸宜設為：資源流向、對受援／受控地區經濟制度的塑造、以及政治目的。須指出兩者在【手段】上不同，但在【以經濟手段服務戰略目的】這一點上相同。\n\n【必達論點】\n一、相同之處：兩者都以經濟安排服務於戰略目標，都把重建與各自陣營的鞏固連繫起來。\n二、差異（資源流向）：一方向西歐大規模輸出資本與物資；另一方則在初期由其勢力範圍取得賠償與設備，資源方向相反。\n三、差異（制度塑造）：一方推動市場經濟與多邊貿易安排；另一方則按計劃經濟模式重組受影響國家的經濟制度。\n四、差異（後果）：兩種模式在往後數十年的經濟表現差距，成為冷戰期間雙方各自論證自身制度優越性的依據。\n\n【常見失分位】\n一、只寫美國的角色而略去蘇聯，比較失衡。\n二、把差異寫成道德判斷，而非制度與資源安排的分析。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_35","topic":"國際合作","difficulty":"hard","question":"「二十世紀既是戰爭的世紀，也是合作的世紀。」試就本科所學評論此說。","explanation":"【卷二論述題・評鑑類】官方提問用語：Comment on（引語評論）。\n引語評論題的重點，唔係贊成或反對，而係檢視此說是否成立、以及它是否遺漏了甚麼。此說的關鍵在「也是」二字 —— 須說明戰爭與合作並非兩條平行線，而是互為因果。","type":"long","referenceAnswer":"【核心命題】\n引語評論題的重點，唔係贊成或反對，而係檢視此說是否成立、以及它是否遺漏了甚麼。此說的關鍵在「也是」二字 —— 須說明戰爭與合作並非兩條平行線，而是互為因果。\n\n【必達論點】\n一、成立之處（戰爭一面）：兩次世界大戰與其後的區域衝突，規模與破壞程度均為前所未見。\n二、成立之處（合作一面）：常設國際組織、區域一體化與跨國專門機構的出現，同樣是二十世紀的產物。\n三、關鍵連繫：合作的制度大多是戰爭的直接產物 —— 兩者並非並列，而是後者由前者催生。能指出此因果關係者，回應層次最高。\n四、此說的遺漏：合作的範圍長期受陣營界線所限，「合作的世紀」在冷戰期間有明顯的地理與政治邊界，此點應予補充。\n\n【常見失分位】\n一、把題目讀成「二十世紀好唔好」，寫成泛論。\n二、戰爭與合作分別鋪陳而不建立關係，錯過本題的核心。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_36","topic":"國際合作","difficulty":"basic","question":"試就以下三項中任選其二，說明它們如何促進二十世紀的國際合作：\n(i) 聯合國\n(ii) 歐洲共同體\n(iii) 世界衞生組織","explanation":"【卷二論述題・解釋類】官方提問用語：With reference to TWO of the following（指定選材）。\n「任選其二」屬硬性限定：答一項是未完成，答三項則每項深度不足，兩者都會失分。選材之後，須說明【機制】—— 該組織透過甚麼具體安排促成合作，而非只描述它做過甚麼。","type":"long","referenceAnswer":"【核心命題】\n「任選其二」屬硬性限定：答一項是未完成，答三項則每項深度不足，兩者都會失分。選材之後，須說明【機制】—— 該組織透過甚麼具體安排促成合作，而非只描述它做過甚麼。\n\n【必達論點】\n一、聯合國：提供常設的協商場所與程序，使爭端有一個不必訴諸武力的處理渠道；並透過專門機構把合作延伸至技術範疇。\n二、歐洲共同體：以共同管理特定產業為起點，把成員國的利益綁在一起，令退出的代價高於留下 —— 這是其合作得以持續的機制。\n三、世界衞生組織：建立跨國的疾病監測與資訊通報標準，使各國在缺乏強制力的情況下仍有合作誘因。\n四、每項均須指出局限，例如執行力依賴成員國同意 —— 說明合作的成效與邊界，論述才完整。\n\n【常見失分位】\n一、三項全答，每項都不夠深入。\n二、只描述組織的成立與架構，未說明它「如何」促進合作。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_37","topic":"第二次世界大戰","difficulty":"intermediate","question":"一九四五年是否二十世紀國際秩序的轉捩點？試解釋你的答案。","explanation":"【卷二論述題・評鑑類】官方提問用語：Turning point（轉捩點判斷）。\n轉捩點題的答題邏輯固定：須同時證明【此前的軌跡】與【此後的軌跡】確有分別，而非只證明此後發生了很多事。能指出「哪些方面轉了、哪些方面未轉」者，判斷最為準確。","type":"long","referenceAnswer":"【核心命題】\n轉捩點題的答題邏輯固定：須同時證明【此前的軌跡】與【此後的軌跡】確有分別，而非只證明此後發生了很多事。能指出「哪些方面轉了、哪些方面未轉」者，判斷最為準確。\n\n【必達論點】\n一、轉變之處：權力中心由歐洲移向兩個外部強國；殖民帝國的解體隨即展開；常設的國際安全機制取代了戰前的安排。\n二、未轉之處：以勢力範圍界定國際關係的做法並未消失，只是換了行為者；強權之間的競爭邏輯延續。\n三、須處理時間界定：若干轉變在一九四五年之前已經開始（如殖民體系的動搖），把全部歸於該年並不準確。\n四、結論須明確作出「是」或「在某些方面是」的判斷，並說明判準。\n\n【常見失分位】\n一、只列舉一九四五年後發生的事，未與此前對照。\n二、把「重要的一年」等同「轉捩點」。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hist_p2_38","topic":"日本現代化","difficulty":"intermediate","question":"一九四五年至二○○○年間，日本與其他亞洲國家的關係在哪些方面出現轉變，又在哪些方面維持不變？","explanation":"【卷二論述題・辨識類】官方提問用語：In what ways（變與不變）。\n「變與不變」題要求兩面對稱處理。最常見的失分，是把全篇寫成「不斷改善」的單線敘述 —— 題目明確要求指出【不變】的部分，缺席即屬答漏一半。","type":"long","referenceAnswer":"【核心命題】\n「變與不變」題要求兩面對稱處理。最常見的失分，是把全篇寫成「不斷改善」的單線敘述 —— 題目明確要求指出【不變】的部分，缺席即屬答漏一半。\n\n【必達論點】\n一、轉變（經濟）：由戰時的佔領關係，轉為以投資、技術轉移與貿易為主的經濟連繫，日本成為區內主要的資本與技術來源。\n二、轉變（制度）：透過賠償安排、發展援助與區域組織的參與，日本重新建立了與區內國家的正式關係。\n三、不變（歷史記憶）：戰爭時期的歷史問題長期未能徹底解決，成為關係中反覆出現的張力來源。\n四、不變（結構位置）：日本在區域經濟分工中長期處於較高層級，這種不對稱的結構關係持續存在。\n\n【常見失分位】\n一、只答轉變，完全不處理「維持不變」的部分。\n二、把關係寫成單向改善，忽略反覆出現的張力。","markingScheme":"自評對照表（供學生自行檢視，非考評局評分準則）\n\n〔立場〕全篇有冇一個貫穿始終、可辨認的立場？抑或只在結尾才表態？\n〔史實〕論點有冇具體史實支撐（人物、事件、年份、政策名稱）？史實與論點之間有冇推導關係，抑或只是並列？\n〔覆蓋〕題目所限定的時段、地域、範圍有冇全部處理？有冇答漏其中一半？\n〔反面〕有冇處理與自己立場相反的證據，並說明何以自己的立場仍然成立？\n〔結構〕段落之間有冇遞進？結論是回應題目，抑或只是重複開首？\n\n自評三級：\n・完全掌握 —— 立場明確、史實準確且用於推導、限定範圍全部處理、有反面考量。\n・部分掌握 —— 立場與史實齊備，惟未處理反面觀點，或有一項限定範圍未覆蓋。\n・仍需鞏固 —— 只作史事鋪陳而未回應題目所問的判斷，或立場前後不一致。","suggestedMinutes":45," const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "history-p2-essays.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "history-p2-essays.decisions.json"; a.click();
});
counts();
</script></body></html>
