const DATA = [{"id":"ic_w1_01","topic":"資料表示與處理","difficulty":"basic","question":"（a）把十進制數 202 轉換為八位二進制數。\n（b）把該二進制數轉換為十六進制數。\n（c）若以八位二進制的二補數表示有符號整數，202 這個位模式所代表的數值為何？試說明與（a）的分別。","explanation":"（c）是本題的考點，亦是資料表示這一課題的核心觀念：位元本身沒有意義，意義來自詮釋方式。能夠寫出「同一串位元、兩種讀法」這句話，比記熟轉換步驟更能反映理解。二補數求值的次序固定 —— 取反、加一、再冠上負號；先加一後取反是常見的次序錯誤，得出的數值會差一。（b）的四位分組法值得養成習慣：十六進制與二進制之間毋須經過十進制，一位十六進制數恰好對應四位二進制數。","type":"text","referenceAnswer":"（a）202 = 128 + 64 + 8 + 2\n即 11001010。\n（b）把 11001010 每四位分為一組：1100 | 1010\n1100 = C，1010 = A\n故十六進制為 CA。\n（c）二補數之下，最高位為 1 代表負數。\n求其數值：把 11001010 各位取反得 00110101，加 1 得 00110110 = 54。\n故該位模式代表 −54。\n分別：位模式完全相同，數值卻不同 —— 202 與 −54 的差別不在於資料本身，而在於系統採用哪一套詮釋規則。同一串位元，作無符號整數讀是 202，作二補數讀是 −54。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ic_w1_02","topic":"程式編寫與算法","difficulty":"intermediate","question":"以下偽代碼旨在從一個含 N 個整數的陣列 A 中，找出最大值及其出現的位置。\n\n1  max ← A[1]\n2  pos ← 1\n3  FOR i ← 1 TO N\n4      IF A[i] > max THEN\n5          max ← A[i]\n6      END IF\n7  END FOR\n8  OUTPUT max, pos\n\n（a）指出此段偽代碼的一個邏輯錯誤，並說明其後果。\n（b）改正該錯誤，寫出修正後的相關行數。\n（c）此算法的迴圈由 i = 1 開始。若改為由 i = 2 開始，程式的輸出會否改變？試說明。\n（d）若陣列中最大值出現兩次，此算法會輸出哪一個位置？如欲改為輸出最後一次出現的位置，須作何修改？","explanation":"（a）所指的是一類特別危險的缺陷：程式不會當機，輸出格式正常，其中一個結果甚至正確 —— 只有位置是錯的。測試時若只檢查最大值，這個錯誤可以一直存在。（c）考核的是對初始化的理解：許多人以為由 i = 1 開始是錯，因為「A[1] 與自己比較」，但初始化本身已處理了第一個元素，故兩種寫法皆正確，分別只在效率。（d）示範一個常被忽略的設計決定 —— 大於與大於等於的分別，在數值上完全沒有影響，卻決定了報告第一個抑或最後一個位置。作答時應明確指出「條件由 > 改為 >=」，僅說「改一改條件」不足以取得分數。","type":"long","referenceAnswer":"（a）邏輯錯誤：pos 在第 2 行設定為 1 之後，迴圈內從未更新。\n後果：max 會正確地更新為最大值，但 pos 永遠輸出 1。除非最大值恰好位於第一個位置，否則輸出的位置錯誤，而數值卻正確 —— 這使錯誤更難察覺。\n（b）修正：在第 5 行之後加入一行\n5a      pos ← i\n即 IF 條件成立時，同時更新 max 與 pos。\n（c）不會改變。第 1 行已把 max 設為 A[1]，第 2 行已把 pos 設為 1，即第一個元素已被計算在內。i = 1 那一次迴圈只是把 A[1] 與自己比較，條件 A[1] > max 必定為假，不會執行任何操作。故由 i = 2 開始的輸出完全相同，只是少做一次無用的比較，效率略高。\n（d）現時會輸出第一次出現的位置。原因是條件用嚴格大於（>），第二次遇到同樣的最大值時 A[i] > max 為假，不會更新 pos。\n若要輸出最後一次出現的位置，把第 4 行的條件改為\n4      IF A[i] >= max THEN\n如此，遇到相等的值亦會更新，最終保留的即為最後一次出現的位置。","markingScheme":"（a）2 分 —— 指出 pos 從未在迴圈內更新（1）；說明後果為位置永遠輸出 1 而數值正確（1）。\n（b）2 分 —— 加入 pos ← i（1）；位置正確，即在 max 更新的同一個 IF 區塊之內（1）。\n（c）2 分 —— 判斷「不會改變」（1）；理由為初始化已處理第一個元素、該次比較必為假（1）。答「會改變」全項不給分。\n（d）2 分 —— 指出現時輸出第一次出現的位置及其成因（1）；提出把條件改為 >=（1）。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":14,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ic_w1_03","topic":"資料庫","difficulty":"intermediate","question":"某補習社以單一表格記錄報名資料，欄位如下：\n學生編號、學生姓名、學生電話、課程編號、課程名稱、導師姓名、報讀日期\n\n一名學生可報讀多個課程；一個課程由一名導師任教。\n（a）指出此設計會引致的兩類異常，各舉一例說明。\n（b）把此表格規範化至第三範式，列出所得的各個表格及其主鍵與外來鍵。\n（c）規範化之後，若要列出某導師所教全部學生的姓名，須如何取得資料？指出這相對於原設計的一項代價。","explanation":"（a）要求分辨異常的類別，而不是泛泛地說「資料重複」。三類異常各有明確的定義：更新異常涉及修改時的不一致，刪除異常涉及連帶失去無關資料，插入異常涉及無法記錄尚未關聯的資料。逐類舉例是取分關鍵。（c）是本題較高階的部分：規範化並非沒有代價，能夠指出取捨的存在，比背誦「規範化的好處」更接近考評所要求的理解層次。留意本題採用教育局辭彙表的譯法「規範化」；「第三範式」亦為官方譯名。作答時列出主鍵與外來鍵是格式要求，只寫出三個表格的名稱而無鍵的標示，通常只得一半分數。","type":"long","referenceAnswer":"（a）更新異常：學生的電話號碼在每一筆報讀記錄中重複出現。該學生若更換電話，須逐筆修改；漏改任何一筆，同一名學生便會出現兩個不同的電話號碼，資料自相矛盾。\n刪除異常：若某課程只有一名學生報讀，刪除該筆報名記錄時，課程名稱與導師姓名亦會一併消失，即失去與報名無關的課程資料。\n（另可接受插入異常：新開設而尚未有人報讀的課程，在此設計下無法記錄。）\n（b）規範化至第三範式後得三個表格：\n學生表 —— 學生編號（主鍵）、學生姓名、學生電話\n課程表 —— 課程編號（主鍵）、課程名稱、導師姓名\n報名表 —— 學生編號（外來鍵，參照學生表）、課程編號（外來鍵，參照課程表）、報讀日期；主鍵為「學生編號 + 課程編號」的複合鍵。\n（c）須把三個表格連接：先在課程表中找出該導師所教的課程編號，再經報名表取得對應的學生編號，最後在學生表中查出姓名。\n代價：查詢須跨越多個表格作連接運算，寫法較原設計複雜，執行時亦需較多處理時間。原設計把全部資料放在一起，單一查詢即可取得，讀取較快 —— 這正是規範化的取捨：以查詢的複雜度換取資料的一致性與儲存效率。","markingScheme":"（a）4 分 —— 兩類異常各 2 分：正確命名該類異常（1）、以本題資料舉出具體例子（1）。只寫「資料重複」不給分。\n（b）3 分 —— 三個表格各 1 分，須同時標明主鍵；報名表未標出複合主鍵或外來鍵者，該項扣分。\n（c）1 分 —— 說明須跨表連接，並指出查詢複雜度或執行速度上的代價。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":14,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ic_w1_04","topic":"網絡與互聯網","difficulty":"intermediate","question":"一個大小為 12 MB 的檔案，經一條頻寬為 8 Mbps 的連線傳送。\n（a）在不計任何額外開銷的情況下，計算理論上所需的傳送時間。\n（b）實際量得的傳送時間為 16 秒。試提出兩個可能的原因。\n（注意：1 MB = 8 Mb）","explanation":"本題最常見的失分並非概念而是單位：MB 為位元組（byte），Mbps 為每秒位元（bit），兩者相差八倍。若直接把 12 除以 8 得 1.5 秒，數字看似合理，其實已錯了一個數量級。養成習慣，先把兩邊化為同一單位再相除。（b）要求提出的是實際情況與理論值之間的差距成因，答案應指向「傳送的位元多於檔案本身」或「可用頻寬少於標稱值」兩條路線之一；答「因為網速慢」屬複述現象，並未說明原因。","type":"text","referenceAnswer":"（a）檔案大小 = 12 MB = 12 × 8 = 96 Mb\n傳送時間 = 96 Mb ÷ 8 Mbps = 12 秒。\n（b）可能原因（任舉兩項）：\n一、通訊協定的額外開銷。實際傳送的資料除檔案內容外，還包括各層封包的標頭、確認訊息與重傳，故實際傳送量大於 96 Mb。\n二、頻寬並非由該次傳送獨佔。同一條連線上若有其他裝置或應用程式同時使用，可用頻寬會低於 8 Mbps。\n（其他可接受的答案包括：網絡擁塞導致封包遺失與重傳、伺服器或接收端的處理速度成為瓶頸、無線訊號干擾令有效傳輸率下降。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ic_w1_05","topic":"資訊保安與道德","difficulty":"hard","question":"某中學計劃推行一個手機應用程式，讓學生以指紋登入查閱成績。校方表示：「資料只儲存在學校自己的伺服器，所以絕對安全，無須加密。」\n（a）指出校方這句話中的一個邏輯漏洞。\n（b）說明對稱加密與非對稱加密的分別，並指出在「學生手機與學校伺服器之間傳送成績」這個情境下，宜採用何種方式，理由為何。\n（c）指紋屬生物辨識資料。與密碼相比，指紋在保安上有何一項優點及一項獨有的風險？\n（d）根據香港《個人資料（私隱）條例》的保障資料原則，校方在收集學生指紋之前，至少須履行哪兩項責任？","explanation":"（a）考核的是辨認推理跳步的能力：校方的前提（資料存於自家伺服器）與結論（無須加密）之間缺了一整段 —— 傳輸途中的風險完全未被觸及。此類題目的作答方法是先把對方的推理拆成前提與結論，再指出中間缺了什麼。（b）不能只背誦兩種加密的定義，必須回答「在這個情境下用哪一種」；能指出實務上採混合方式，並說明各自解決了什麼問題，屬完整作答。（c）的「獨有風險」一詞是關鍵限定 —— 答「可能被駭客盜取」並非指紋獨有，密碼同樣會被盜；指紋的獨特之處在於不可更換。（d）須舉出兩項【收集之前】的責任，事後補做的措施不符合題意。","type":"long","referenceAnswer":"（a）漏洞在於把「儲存位置」等同於「安全」。資料的風險不限於伺服器本身：資料在學生手機與伺服器之間傳送的過程中會經過網絡，若未加密即可被截取；伺服器本身亦可能因設定錯誤、軟件漏洞或內部人員濫權而外洩。擁有伺服器並不等於控制了全部風險，故「所以無須加密」這個推論不成立。\n（b）對稱加密以同一條密鑰進行加密與解密，運算速度快，適合處理大量資料，但雙方必須先安全地交換該密鑰，而交換本身即為弱點。\n非對稱加密使用一對密鑰：公開密鑰用於加密，私人密鑰用於解密。公開密鑰可公開傳送，故解決了密鑰交換的問題，但運算較慢。\n本情境宜採混合方式：先以非對稱加密安全地交換一條臨時的對稱密鑰，其後的成績資料再以對稱加密傳送。如此既解決了密鑰交換問題，又保持傳送效率。此即現行安全連線的通行做法。\n（c）優點：指紋無須記憶，亦不能像密碼一樣被學生互相告知或寫在紙上，可減少共用帳戶的情況。\n獨有風險：指紋不可更換。密碼一旦洩漏可以立即更改，但指紋外洩之後，該學生終身無法更換這項識別資料，影響並不限於本系統。\n（d）其一，明確告知收集目的及資料將如何使用，並確保收集的資料不超乎所需 —— 若查閱成績可用密碼達成，收集指紋是否必要，本身須先論證。\n其二，取得有效同意。學生為未成年人，須同時取得家長或監護人的同意，並提供不使用指紋的替代登入方式，令同意不至於形同強制。\n（另可接受：訂明保存期限並於期滿後刪除；採取切實可行的保安措施防止未獲授權的查閱。）","markingScheme":"（a）2 分 —— 指出儲存位置不等於安全（1）；具體點出傳輸途中或伺服器本身仍有風險（1）。\n（b）3 分 —— 對稱與非對稱的分別，須提及密鑰數目與速度（1）；指出密鑰交換問題（1）；就本情境作出選擇並說明理由，混合方式屬完整作答（1）。\n（c）2 分 —— 優點 1 分；風險須為指紋獨有（不可更換）方給 1 分，泛指「會被盜」不給分。\n（d）3 分 —— 兩項責任各 1 分，須為收集前的責任；另 1 分予「必要性」或「提供替代方式」等能顯示理解比例原則的論點。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":16,"trapTypes":null,"dnaTag":null,"mother":null}];

// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "ict-written-b1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "ict-written-b1.decisions.json"; a.click();
});
counts();
</script></body></html>
