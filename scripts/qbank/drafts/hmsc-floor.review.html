<script>
const DATA = [{"id":"hm_floor_01","topic":"三級預防分類","difficulty":"basic","question":"公共衞生的「一級預防」，其主要目標是甚麼？","options":["在疾病發生之前減低患病的風險","在疾病早期階段及早發現並治療","在患病之後減少併發症與失能","為末期病人提供紓緩性的照顧"],"correctIndex":0,"explanation":"三級預防按「疾病進程的哪一個階段」劃分。一級預防在疾病尚未發生時介入，目的是減低風險，例子有接種疫苗、健康教育、改善環境衞生。二級預防針對已經開始但尚未顯現症狀的疾病，透過篩查及早發現並治療。三級預防針對已確診的病人，目標是減少併發症與失能，例如中風後的康復治療。紓緩照顧一般歸入三級預防的範疇。分辨的關鍵不在於措施本身，而在於介入時病人處於哪一個階段——同一項措施用於不同對象，可以屬於不同級別。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_02","topic":"三級預防分類","difficulty":"basic","question":"「二級預防」的核心工作是甚麼？","options":["及早偵測尚未出現症狀的疾病","消除令人患病的環境風險因素","訓練已失能人士恢復生活自理","制訂全民適用的健康政策方針"],"correctIndex":0,"explanation":"二級預防的重點是「早」——疾病其實已經開始，但病人自己未察覺，透過篩查在症狀出現之前發現它，此時治療的效果通常最好。常見例子有子宮頸細胞檢查、大腸癌篩查、定期血壓與血糖檢查。消除環境風險因素是在疾病未開始時介入，屬一級預防；訓練失能人士恢復自理是在確診之後，屬三級預防；制訂全民健康政策則多屬一級預防的層面。留意二級預防的前提是該疾病有一段可偵測而未有症狀的時期，並且早治療確實比遲治療有效——不符合這兩個條件的疾病，大規模篩查未必有益。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_03","topic":"三級預防分類","difficulty":"basic","question":"為長期臥床的病人定時翻身、預防褥瘡，屬於哪一級預防？","options":["三級預防","一級預防","二級預防","不屬於任何預防層級"],"correctIndex":0,"explanation":"病人已經確診並且長期臥床，介入的目的是減少因臥床而引致的併發症與進一步失能，因此屬三級預防。這一條容易答錯，是因為「預防褥瘡」四字之中有「預防」二字，令人直覺歸入一級。但判斷級別要看服務對象處於疾病進程的哪一階段，而不是看措施名稱有沒有「預防」。同一道理：為健康人士推廣運動是一級，為已確診糖尿病人做足部護理以防截肢是三級。答題時先問一句「這個人現在算病了沒有」，再決定級別，比記例子清單可靠。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_04","topic":"三級預防分類","difficulty":"intermediate","question":"衞生署為初生嬰兒安排接種疫苗，屬於哪一級預防？","options":["一級預防","二級預防","三級預防","二級與三級之間"],"correctIndex":0,"explanation":"接種對象是尚未患病的嬰兒，目的是令他們日後不會感染該疾病，即在疾病發生之前就把風險降低，屬典型的一級預防。要留意疫苗與篩查的分別：疫苗改變的是「會不會病」，篩查改變的是「幾時發現」，前者屬一級，後者屬二級。另外，即使疫苗保護率並非百分之百，仍然屬一級預防——級別的判定看介入的時機與目的，並不取決於成效的高低。這一點在答比較題時值得指出，可以顯示對分類原則的理解而非死記例子。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_05","topic":"三級預防分類","difficulty":"intermediate","question":"政府為五十歲以上市民提供免費大腸癌篩查，屬於哪一級預防？","options":["二級預防","一級預防","三級預防","一級與三級並重"],"correctIndex":0,"explanation":"篩查的對象是沒有症狀的市民，目的是在病變未引起不適之前把它找出來，及早處理，這正是二級預防的定義。有學生會因為「參加篩查的人未病」而答一級，但一級預防要改變的是患病的風險本身，例如改善飲食或戒煙；篩查並不降低患癌的機會，它只令發現的時間提前。這個分別在答題時要講清楚：一級改變「會不會發生」，二級改變「幾時發現」，三級改變「發生之後有多嚴重」。三句話可以貫穿整個課題。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_06","topic":"三級預防分類","difficulty":"intermediate","question":"物理治療師為中風後的病人進行步行訓練，協助他重新自行外出，屬於哪一級預防？","options":["三級預防","一級預防","二級預防","康復治療不屬預防範疇"],"correctIndex":0,"explanation":"病人已經中風，介入的目標是減少殘留的失能、提升自理與生活質素，屬三級預防。康復治療經常被誤以為「不算預防」，但三級預防所預防的並非疾病本身，而是疾病帶來的失能與依賴——這正是它與一、二級的分別所在。從整全健康的角度看，這一項介入同時觸及身體（行動能力）與社交（能否外出與人接觸）兩個層面，答論述題時把兩者一併指出，比只寫「幫助康復」更能取分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_07","topic":"三級預防分類","difficulty":"intermediate","question":"在中學推行禁煙教育，同時為已吸煙的學生提供戒煙輔導。就三級預防而言，這項計劃的性質是甚麼？","options":["同時包含一級與二級預防的元素","純粹屬於一級預防，並無其他元素","純粹屬於二級預防，並無其他元素","三個預防級別的元素都沒有涉及"],"correctIndex":0,"explanation":"同一項計劃可以橫跨多於一個級別，判斷時要按服務對象分開來看。對未吸煙的學生而言，禁煙教育是在行為未開始前降低風險，屬一級預防；對已吸煙的學生而言，戒煙輔導是在健康損害尚未明顯之際及早介入，減低日後患病的機會，一般歸入二級預防的範疇。這一條的用意是打破「一項措施只對應一個級別」的直覺——實際的公共衞生計劃大多是多層並行的。答題時應先分清對象，再逐一判定級別，而不是為整個計劃硬套一個標籤。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_08","topic":"三級預防分類","difficulty":"intermediate","question":"改善舊區的排水與垃圾收集系統，以減少蚊患及傳染病傳播，屬於哪一級預防？","options":["一級預防","二級預防","三級預防","屬市政服務而非預防"],"correctIndex":0,"explanation":"改善環境是在疾病發生之前移除傳播的條件，令居民根本不會受感染，屬一級預防。這一條同時示範了一個重要觀念：預防未必以個人為單位。健康教育針對個人行為，環境改善針對整個社區所共處的條件，兩者同屬一級預防，但後者不需要每個居民各自作出改變便能生效，覆蓋面往往更廣。答論述題談公共衞生成效時，指出環境層面的介入不依賴個人自律這一點，是相當有力的分析。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_09","topic":"三級預防分類","difficulty":"hard","question":"「定期量度血壓」這項行為，對甲（血壓正常的成年人）與乙（已確診高血壓並服藥的病人）而言，分別屬於哪一級預防？","options":["對甲屬二級，對乙屬三級","對甲屬一級，對乙屬二級","對甲乙皆屬二級預防","對甲屬一級，對乙屬一級"],"correctIndex":0,"explanation":"同一項措施的級別取決於服務對象所處的階段，而非措施本身。對甲而言，他尚未確診，量血壓的作用是在高血壓引起症狀之前把它找出來，屬二級預防。對乙而言，他已確診並在治療之中，量血壓的作用是監察病情、調校藥物、減少中風與腎衰竭等併發症，屬三級預防。要留意甲的情況並非一級——一級預防要降低患高血壓的風險本身，例如減鹽、運動、控制體重；量度這個動作並不改變風險，只改變發現的時機。本題正是要檢驗這個分類原則有沒有真正掌握，而不是背例子。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_10","topic":"整全健康・概念應用","difficulty":"basic","question":"世界衞生組織對「健康」的定義，包含哪三個方面的安寧？","options":["身體、心理與社交","身體、經濟與教育","心理、社交與經濟","身體、心理與經濟"],"correctIndex":0,"explanation":"世界衞生組織把健康界定為身體、心理及社交三方面的完全安寧，而不僅是沒有疾病或虛弱。這個定義的關鍵在於後半句：健康並非「沒有病」這個消極狀態，而是一個積極的、多維度的狀態。因此一個各項檢查都正常、卻長期孤獨或焦慮的人，按此定義並不算健康。經濟與教育並不是健康的組成部分，但它們是重要的「健康的社會決定因素」——影響一個人能否獲得健康的外在條件，這是另一個課題，答題時不要把兩者混為一談。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_11","topic":"整全健康・概念應用","difficulty":"basic","question":"一名中六學生因為模擬試成績不理想而持續失眠、情緒低落。就整全健康而言，這主要屬於哪一個方面？","options":["心理健康","社交健康","身體健康","與健康無關"],"correctIndex":0,"explanation":"情緒低落與因壓力而起的失眠，主要反映心理健康的狀況。要補充的是，整全健康的三個方面互相影響而非各自獨立：長期失眠會削弱免疫力與專注力，屬身體層面的後果；情緒低落亦可能令人退出社交活動，屬社交層面的後果。答應用題時應先指出主要受影響的方面，再說明它如何牽動其餘兩方面——這種「主次分明兼顧關聯」的寫法，比單獨指出一個方面更能拿到分析分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_12","topic":"整全健康・概念應用","difficulty":"basic","question":"一名退休人士加入義工隊，每週與街坊一同探訪獨居長者。這主要促進了他健康的哪一方面？","options":["社交健康","身體健康","僅對受訪長者有益","與自身健康無關"],"correctIndex":0,"explanation":"社交健康指一個人與他人建立及維持關係、在群體中擔當角色的能力。參與義工隊令這名退休人士有穩定的人際接觸、有被需要的角色，正是社交健康的核心內容。退休往往同時帶來社會角色的失去，因此這類參與對長者的健康特別重要。要留意這項活動並非只令受訪者得益——這正是本題要指出的一點；同時探訪需要外出步行，亦附帶身體層面的好處，但那是次要的。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_13","topic":"整全健康・概念應用","difficulty":"intermediate","question":"整全健康觀與傳統醫學模式的主要分別在於甚麼？","options":["前者視健康為多維度的積極狀態","前者主張毋須依賴任何醫療服務","前者只重視心理而不理會身體","兩者在本質上並無實際分別"],"correctIndex":0,"explanation":"傳統醫學模式以疾病為中心，健康即是沒有病，介入的重點是診斷與治療。整全健康觀則把健康看成身體、心理與社交三方面的積極狀態，關注的不只是病人，也包括未病者的生活條件、心理狀況與社會連繫。要留意整全觀並不否定醫療的價值——它是把醫療放進一個更闊的框架之中，而非取代它。同樣，它亦不是重心理而輕身體，三個方面在整全觀之中地位相當。分辨這兩個模式時，問一句「這個框架關心的是疾病，還是人的整體狀態」，最能抓住重點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_14","topic":"整全健康・概念應用","difficulty":"intermediate","question":"一名長者患有需長期服藥的慢性病，但情緒穩定、朋友眾多、每日仍能自理起居。就整全健康而言，對他最恰當的判斷是甚麼？","options":["身體方面受限，心理與社交方面良好","因患有慢性病，故三方面皆不健康","因情緒與社交良好，故完全健康","慢性病人不適用整全健康的框架"],"correctIndex":0,"explanation":"整全健康的三個方面應分開評估，不應以其中一項概括全部。這名長者身體方面確有限制，但心理與社交狀況良好，整體上仍可過有質素的生活。這正是整全健康觀最實用的地方：慢性病無法治癒，若以「有病即不健康」來衡量，病人便永遠處於失敗的位置；而按三維度分別評估，照顧的目標便可以放在維持與提升仍然良好的方面。答論述題時，指出「健康是連續體而非有病無病的二分」，是這個課題的核心分析點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_15","topic":"整全健康・概念應用","difficulty":"intermediate","question":"「健康是一個連續體」這個說法，最主要的意思是甚麼？","options":["健康程度可以逐步移動而非二分","健康狀況一旦下降便無法回升","健康只有健康與患病兩種狀態","健康程度完全由遺傳因素決定"],"correctIndex":0,"explanation":"把健康理解為連續體，意思是每個人在任何時刻都處於「極差」與「極佳」之間的某一點，並且這個位置會隨生活條件、照顧與自身努力而移動。這個觀念有兩個實際作用：其一，即使患病亦有改善的空間，照顧因此有意義；其二，即使未患病亦有提升的空間，健康促進因此有意義。若把健康看成有病與無病的二分，這兩件事都會失去理據。連續體的方向可以雙向移動，並非只降不升；而遺傳只是影響健康的因素之一，環境與生活方式同樣重要。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_16","topic":"整全健康・概念應用","difficulty":"intermediate","question":"社區中心為獨居長者同時安排定期覆診接送、興趣班及家居安全評估。這套服務最能體現甚麼？","options":["兼顧身體、心理與社交的整全照顧","以治療疾病為唯一目標的醫療模式","集中處理長者的經濟困難","把照顧責任全數交回家人承擔"],"correctIndex":0,"explanation":"三項服務各自對應不同的方面：覆診接送保障治療的延續，屬身體層面；興趣班提供人際接觸與生活內容，兼及心理與社交；家居安全評估減低跌倒風險，同時屬身體層面與環境層面的介入。三者合起來，正是整全照顧的具體做法——不只處理疾病，而是照顧一個人生活的整體。答應用題時逐項對應到相應的方面，比籠統地寫「服務全面」清楚得多，亦更容易取分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_17","topic":"整全健康・概念應用","difficulty":"intermediate","question":"「健康促進」與「疾病治療」的主要分別在於甚麼？","options":["前者着眼於提升整體健康水平","前者只適用於已確診的病人","前者由醫生獨力負責推行","兩者的服務對象完全相同"],"correctIndex":0,"explanation":"健康促進的目標是令人由「不算差」移向「更好」，對象包括未患病的人，手段涵蓋教育、環境改善與政策；疾病治療則針對已出現的病症，目標是消除或控制它。兩者的對象與時機都不同，但並非互相排斥——一個完整的健康系統兩者兼備。健康促進的推行亦不限於醫生，學校、社區組織、僱主以至政策制訂者都有角色，這一點在論述題中值得指出，因為它反映健康並非單靠醫療服務就能達致。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_18","topic":"照顧倫理與健康決定因素","difficulty":"basic","question":"照顧倫理中的「尊重自主」原則，主要指甚麼？","options":["尊重服務使用者為自己作決定的權利","照顧者可按專業判斷代為決定","服務使用者須自行承擔照顧責任","家屬的意願優先於使用者本人"],"correctIndex":0,"explanation":"尊重自主指服務使用者有權在充分知情的前提下，就自己的身體與照顧安排作決定，包括拒絕某項治療的權利。要留意「自主」並不等於「自己照顧自己」——一個需要別人協助起居的人，同樣可以自主地決定接受哪些協助。這個原則的落實依賴知情同意：先提供足夠而可理解的資訊，再由本人決定。當本人的決定與家屬意願或照顧者的專業判斷相左時，正是這個原則發揮作用的時刻；若一律以專業或家屬意見為準，原則便形同虛設。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_19","topic":"照顧倫理與健康決定因素","difficulty":"basic","question":"下列哪一項屬於「健康的社會決定因素」？","options":["居住環境的擠迫與衞生狀況","個人的血型與遺傳基因","身體對藥物的代謝速度","先天的免疫系統強弱"],"correctIndex":0,"explanation":"健康的社會決定因素，指影響健康而本身屬社會條件的因素，例如收入、教育程度、就業狀況、居住環境與能否獲得醫療服務。居住環境的擠迫與衞生直接影響傳染病傳播與精神壓力，屬典型的社會決定因素。其餘三項均屬生物或生理層面的因素，雖然同樣影響健康，但並非社會條件。分辨的方法很直接：問一句「這項因素可否透過政策或社會資源分配去改變」——可以的，多屬社會決定因素。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_20","topic":"照顧倫理與健康決定因素","difficulty":"basic","question":"照顧倫理中的「不傷害」原則，其基本要求是甚麼？","options":["避免對服務使用者造成可預見的傷害","在任何情況下都不可施行入侵性程序","照顧者須為所有意外結果承擔法律責任","只要出於好意便毋須考慮後果"],"correctIndex":0,"explanation":"不傷害原則要求照顧者避免造成可預見的傷害，並在無法完全避免時把傷害減至最低。它並非禁止一切具風險的程序——手術、注射本身有風險，但若預期利益明顯大於風險，仍然可以進行，這正是它與行善原則需要一併衡量的原因。要留意「出於好意」不足以構成理據：判斷的依據是後果的預期，而非動機的善惡。這個分別在討論強制餵食、約束衣等具爭議的照顧措施時尤其關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_21","topic":"照顧倫理與健康決定因素","difficulty":"intermediate","question":"一名意識清醒的長者拒絕接受醫生建議的手術，家人則堅持要做。就照顧倫理而言，處理這情況時應以甚麼為首要考慮？","options":["長者本人在知情下所作的決定","家人所表達的一致意願","醫生的專業判斷應為最終標準","以少數服從多數的方式決定"],"correctIndex":0,"explanation":"長者意識清醒，具備作決定的能力，尊重自主原則要求以他本人在知情下的決定為首要考慮，包括拒絕治療的決定。這並不表示家人與醫生的意見沒有價值——醫生有責任充分說明手術的利弊與不做的後果，家人的關心亦應獲聆聽，但兩者的角色是提供資訊與支援，而非代為決定。要留意這個原則的前提是當事人有決定能力；若能力受損，處理方式便不同，須依循預設醫療指示或代作決定的機制。答題時先確認決定能力，再談原則，次序不能倒轉。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_22","topic":"照顧倫理與健康決定因素","difficulty":"intermediate","question":"研究顯示，基層家庭兒童的蛀牙率明顯高於中產家庭。從健康決定因素的角度，最恰當的解釋是甚麼？","options":["經濟條件影響飲食選擇與牙科服務的可及性","基層家庭的家長普遍不重視子女健康","兩類家庭兒童的體質存在先天差異","數字差異只是統計上的偶然波動"],"correctIndex":0,"explanation":"社會決定因素的分析要求先看結構性條件，再談個人行為。經濟條件透過幾條途徑影響蛀牙率：能否負擔定期牙科檢查與治療、能否選購較昂貴而含糖較少的食物、家長工時長短是否容許督促子女刷牙。把差異歸咎於家長不重視，是典型的「責備受害者」，它把結構問題誤讀為態度問題，亦令有效的政策介入無從談起。體質差異的說法缺乏證據支持；而群體之間持續而一致的差距，亦不能用偶然波動解釋。答論述題時能指出「責備受害者」這個陷阱，是本課題的關鍵分析點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_23","topic":"照顧倫理與健康決定因素","difficulty":"intermediate","question":"「知情同意」要有效，必須具備哪些條件？","options":["資訊充分、當事人有能力、自願作出決定","只需當事人在同意書上簽署作實","只需家屬代為表示同意即可","只需醫護人員認為方案對當事人有利"],"correctIndex":0,"explanation":"知情同意有三個必要條件，缺一不可。其一是資訊充分且可理解——包括方案的性質、預期效果、風險與可行的替代方案。其二是當事人具備決定能力，即能理解資訊並衡量後果。其三是自願，即決定不受壓力或誤導所左右。簽署同意書只是把同意記錄下來的形式，若當事人根本不明白內容，這份文件並不構成有效的同意。家屬代為同意僅在當事人欠缺決定能力時、按既定機制才適用；而照顧者認為有利，屬行善原則的考慮，不能取代當事人的意願。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_24","topic":"照顧倫理與健康決定因素","difficulty":"intermediate","question":"照顧倫理中的「公義」原則，在資源分配上主要要求甚麼？","options":["按需要公平分配，不因身分而有差別","一律平均分配予每一名服務使用者","優先照顧付款能力較高的使用者","由前線照顧者按個人喜好決定"],"correctIndex":0,"explanation":"公義原則要求資源分配以需要為依據，並且不因性別、年齡、種族、經濟狀況或社會地位而有差別待遇。要留意「公平」與「平均」並不相同：需要程度不一的人若各得相同份額，結果反而不公平——需要多的人不足，需要少的人有餘。因此公義原則在實踐上常指向「按需分配」而非「人人一份」。以付款能力決定優次，違反不因經濟狀況差別待遇這一要求；而由前線照顧者按個人喜好決定，則缺乏可交代的準則，同樣不符合公義原則。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"hm_floor_25","topic":"照顧倫理與健康決定因素","difficulty":"intermediate","question":"一名照顧者為方便管理，在未經評估的情況下為長者長期使用約束衣。這做法主要違反了哪些倫理原則？","options":["尊重自主與不傷害","公義與保密","保密與行善","僅屬行政程序上的疏忽"],"correctIndex":0,"explanation":"長期約束在未經評估與同意之下施行，剝奪了長者對自己身體與行動的決定權，違反尊重自主；長期約束亦會帶來肌肉萎縮、關節僵硬、褥瘡與情緒困擾等可預見的傷害，違反不傷害。要留意「為方便管理」這個理由本身正是問題所在——它以照顧者的便利取代了使用者的利益，而倫理判斷的依據應是後者。保密涉及私隱資料的處理，公義涉及資源分配，兩者與本個案的核心無關。把這件事僅僅當作程序疏忽，會低估它對當事人造成的實質損害。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "hmsc-floor.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "hmsc-floor.decisions.json"; a.click();
});
counts();
</script></body></html>
