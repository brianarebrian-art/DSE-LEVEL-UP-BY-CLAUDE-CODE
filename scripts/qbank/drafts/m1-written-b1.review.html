<script>
const DATA = [{"id":"m1_w1_01","topic":"排列與組合","difficulty":"basic","question":"某委員會由 7 名男生及 5 名女生組成，現須從中選出 4 人組成一個小組。\n（a）共有多少種選法？\n（b）若小組必須至少有 1 名女生，共有多少種選法？","explanation":"（b）示範的是「至少」型問題的標準處理方式：正面計算須把一名、兩名、三名、四名女生四種情況逐一相加，而取補集只需計算一個數。凡題目出現「至少一個」，先考慮補集通常較快，而且較少出錯。另須留意本題屬組合而非排列 —— 小組成員之間並無職位之分，故次序不計；若題目改為「選出主席、秘書、司庫、委員各一名」，答案便須改用排列。","type":"text","referenceAnswer":"（a）由 12 人中選 4 人，不計次序：\nC(12, 4) = 12 × 11 × 10 × 9 ÷ (4 × 3 × 2 × 1) = 495 種。\n（b）以「全部」減去「一名女生也沒有」較快：\n全男生的選法 = C(7, 4) = 35 種。\n至少一名女生 = 495 − 35 = 460 種。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w1_02","topic":"二項分佈","difficulty":"intermediate","question":"某工廠生產的燈泡，經檢驗發現不合格的比率為 0.05，且各燈泡是否合格互相獨立。現隨機抽取 20 個燈泡。\n（a）說明為何不合格燈泡的數目 X 服從二項分佈，並寫出其參數。\n（b）求恰有 2 個不合格的概率，準確至四位小數。\n（c）求至少有 1 個不合格的概率，準確至四位小數。\n（d）該廠聲稱「每 20 個燈泡之中平均只有 1 個不合格」。此說法與本題所給的比率是否一致？試以計算說明。","explanation":"（a）不是形式上的鋪墊。二項分佈有四項成立條件，評卷要求逐項對應題目所給的資料，而不是背誦定義；例如「互相獨立」一項必須引用題目中「互相獨立」這句，否則等於未經驗證便套用公式。（c）示範補集法：直接把 X = 1 至 20 逐項相加不切實際，而 1 − P(X = 0) 只需一步。（d）考核的是對「平均值」的理解 —— 平均值是長期的期望，並非每一次的實際數目，能夠指出這一點的答案，較僅寫「一致」為佳。","type":"long","referenceAnswer":"（a）每次檢驗只有「合格」與「不合格」兩種結果；試驗次數固定為 20；各次試驗互相獨立；每次不合格的概率固定為 0.05。四項條件齊備，故 X 服從二項分佈，X ~ B(20, 0.05)。\n（b）P(X = 2) = C(20, 2) × 0.05² × 0.95¹⁸\n= 190 × 0.0025 × 0.397214\n= 0.1887（準確至四位小數）。\n（c）P(X ≥ 1) = 1 − P(X = 0) = 1 − 0.95²⁰ = 1 − 0.358486 = 0.6415（準確至四位小數）。\n（d）二項分佈的平均值 E(X) = np = 20 × 0.05 = 1。\n該廠所指的「平均 1 個」與本題所給的比率完全一致。惟須注意「平均為 1」並不代表每次抽 20 個都恰好有 1 個 —— 由（b）可見恰有 2 個的概率接近 0.19，並非罕見情況。","markingScheme":"（a）3 分 —— 列出二項分佈的條件並逐項對應題目資料（2）；寫出 X ~ B(20, 0.05)（1）。\n（b）2 分 —— 正確列式含 C(20, 2)、0.05²、0.95¹⁸（1）；0.1887（1）。\n（c）2 分 —— 使用補集 1 − P(X = 0)（1）；0.6415（1）。\n（d）1 分 —— 計算 E(X) = np = 1 並作出一致的結論；能同時指出「平均值不等於每次的實際數目」者，此項屬完整作答。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":13,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w1_03","topic":"正態分佈","difficulty":"intermediate","question":"某校中六學生的數學科測驗分數服從正態分佈，平均值為 62 分，標準差為 12 分。\n（a）求隨機抽出一名學生，其分數高於 80 分的概率。\n（b）若學校決定把分數最高的 10% 學生列入資優班，求入選的最低分數，準確至整數。\n（c）另一位教師建議：「把及格線由 50 分下調至 44 分，及格人數應會增加約一倍。」試以計算檢驗此說法是否成立。","explanation":"（c）是本題的重心，考核的是對正態曲線形狀的理解，而非查表技巧。曲線在平均值附近最密、兩尾最疏，所以同樣是下調 6 分，若由 62 分調至 56 分，人數的增幅會遠大於由 50 分調至 44 分。憑直覺推論「分數線降低，人數自然大增」是一種把分佈當成均勻分佈的誤解。作答時必須把兩個概率都算出來再比較，僅憑說理而無數值不會取得分數。另須留意（b）屬反向查表 —— 由概率反求 z 值，方向與（a）相反，代入時容易把 1.2816 誤作 z = 0.10 對應的數值。","type":"long","referenceAnswer":"（a）z = (80 − 62) ÷ 12 = 1.5\nP(Z > 1.5) = 1 − 0.9332 = 0.0668。\n（b）設最低分數為 k，則 P(X > k) = 0.10，即 P(Z > z) = 0.10。\n查表得 z = 1.2816。\nk = 62 + 1.2816 × 12 = 62 + 15.38 = 77.4，即約 77 分。\n（c）及格線 50 分：z = (50 − 62) ÷ 12 = −1，P(X > 50) = P(Z > −1) = 0.8413。\n及格線 44 分：z = (44 − 62) ÷ 12 = −1.5，P(X > 44) = P(Z > −1.5) = 0.9332。\n0.9332 ÷ 0.8413 ≈ 1.11，即及格人數只增加約一成，並非一倍。\n該說法不成立。原因在於 50 分已在平均值以下一個標準差，該處的累積概率已達 0.84；再下調 6 分所覆蓋的只是分佈的尾部，人數本來就少，故增幅有限。","markingScheme":"（a）2 分 —— z = 1.5（1）；0.0668（1）。\n（b）3 分 —— 建立 P(X > k) = 0.10（1）；反查得 z = 1.2816（1）；k ≈ 77（1）。\n（c）3 分 —— 兩個概率各 1 分；比較後指出增幅約一成、並解釋與分佈形狀有關（1）。只寫「不成立」而無計算不給分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":13,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w1_04","topic":"指數對數微積分","difficulty":"intermediate","question":"某培養皿中的細菌數目為 N(t) = 500e^(0.4t)，其中 t 以小時計。\n（a）求 dN/dt。\n（b）求 t = 5 時細菌數目的瞬時增長率，準確至最接近的整數。\n（c）指出增長率與細菌數目之間的關係。","explanation":"（c）是本題唯一需要觀察而非計算的部分：把（a）的結果與原式並列，即可看出兩者只差一個常數倍。能夠寫出 dN/dt = 0.4N 這一行，比用文字描述「增長愈來愈快」更能顯示理解。留意 e^(0.4t) 的導數是 0.4e^(0.4t) 而非 e^(0.4t) —— 漏掉鏈式法則帶出的 0.4 是此類題目最常見的失誤，而且答案表面上仍然合理，不易自行察覺。","type":"text","referenceAnswer":"（a）dN/dt = 500 × 0.4 × e^(0.4t) = 200e^(0.4t)。\n（b）t = 5 時：dN/dt = 200e^2 = 200 × 7.389056 = 1477.8，即約 1478 隻每小時。\n（c）由（a）可見 dN/dt = 200e^(0.4t) = 0.4 × 500e^(0.4t) = 0.4N。\n即瞬時增長率與當時的細菌數目成正比，比例常數為 0.4。數目愈多，增長愈快，這正是指數增長的定義性特徵。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w1_05","topic":"微積分應用","difficulty":"hard","question":"某公司生產一款商品，每月產量為 x 件時，總成本為 C(x) = 0.5x² + 20x + 800 元，而每件的售價為 P(x) = 120 − 0.5x 元。\n（a）寫出每月總收益 R(x) 及利潤 Q(x) 的算式。\n（b）求使利潤最大的產量，並以二階導數驗證所得為極大值。\n（c）求該最大利潤。\n（d）另一位經理主張「產量愈高，利潤愈高」。試以（a）所得的算式指出此主張錯在何處。","explanation":"本題的難點在（a）：容易誤以為總收益等於售價本身，而忽略須乘以數量。P(x) 是單價，R(x) = x·P(x) 才是收益，這一步錯了則其後全部計算皆隨之而錯，而且過程看起來完全正常。（b）的二階導數並非可有可無的裝飾 —— 題目明文要求驗證，只寫「x = 50 時利潤最大」而無 Q″(x) \u003c 0 一行，會失去驗證分。（d）要求把數學結果翻譯回商業語言，並指出兩個機制：售價隨產量下跌，以及成本的平方項。只答「因為是拋物線」屬形式描述，未觸及成因。","type":"long","referenceAnswer":"（a）R(x) = x × P(x) = x(120 − 0.5x) = 120x − 0.5x²\nQ(x) = R(x) − C(x) = (120x − 0.5x²) − (0.5x² + 20x + 800) = −x² + 100x − 800\n（b）Q′(x) = −2x + 100\n令 Q′(x) = 0，得 x = 50。\nQ″(x) = −2 \u003c 0，故 x = 50 為極大值。\n（c）Q(50) = −(50)² + 100(50) − 800 = −2500 + 5000 − 800 = 1700 元。\n（d）Q(x) = −x² + 100x − 800 是一條開口向下的拋物線，並非遞增函數。x 小於 50 時利潤隨產量上升，x 大於 50 之後利潤反而下跌。\n成因有二：其一，售價 P(x) = 120 − 0.5x 隨產量上升而下跌，收益的增長逐漸放緩；其二，成本中的 0.5x² 一項令成本以加速的方式上升。兩者疊加，越過 x = 50 之後成本的增速超過收益的增速，利潤即轉為下降。故「產量愈高利潤愈高」只在 x 小於 50 的範圍內成立。","markingScheme":"（a）3 分 —— R(x) = x·P(x) 而非 P(x)（1）；展開為 120x − 0.5x²（1）；Q(x) = −x² + 100x − 800（1）。\n（b）3 分 —— Q′(x) = −2x + 100（1）；x = 50（1）；Q″(x) = −2 \u003c 0 作驗證（1）。缺二階導數驗證扣此分。\n（c）1 分 —— 1700 元。\n（d）3 分 —— 指出 Q(x) 為開口向下的拋物線、並非遞增（1）；售價隨產量下跌一點（1）；成本含平方項令成本加速上升一點（1）。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":16,"trapTypes":null,"dnaTag":null,"mother":null}];

// ── 審核用時自動記錄 ──────────────────────────────────────────────────────

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,

}

  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "m1-written-b1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "m1-written-b1.decisions.json"; a.click();
});
counts();
</script></body></html>
