<script>
const DATA = [{"id":"csd-b2-01","topic":"「一國兩制」與憲制秩序","difficulty":"basic","question":"《基本法》第一條訂明香港特別行政區是中華人民共和國不可分離的部分。此條文置於全文之首，最能說明甚麼？","options":["國家主權是特區一切制度安排的前提","特區政府的組織方式優先於主權問題","條文的先後次序只反映起草時的習慣，並無實質意義","第一條只適用於對外事務，不涉及內部制度"],"correctIndex":0,"explanation":"《基本法》以第一條確立特區的憲制地位，其後各章才處理政治體制、居民權利與經濟文化事務。這種編排說明主權歸屬是全部制度安排的前提，而非其中一項並列的內容。\n\n【干擾項剖析】「組織方式優先」把先後次序倒轉，屬張冠李戴；「只反映起草習慣」否定條文編排的規範意義，屬過度推論；「只適用於對外事務」把第一條的適用範圍任意收窄，屬半對半錯——條文本身並無此限制。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-02","topic":"「一國兩制」與憲制秩序","difficulty":"basic","question":"全國人民代表大會及其常務委員會與香港特別行政區立法會，在立法權限上的根本分別是甚麼？","options":["前者行使國家層面的立法權，後者依《基本法》授權就特區自治範圍內事務立法","兩者權限相同，只是適用地域不同","立法會可以修改《基本法》，全國人大不可","前者只處理外交，後者處理其餘一切事務"],"correctIndex":0,"explanation":"全國人大是國家最高權力機關，行使國家層面的立法權，並擁有《基本法》的修改權；立法會的立法權來自《基本法》的授權，範圍限於特區自治事務。兩者並非平行關係，而是授權與被授權的關係。\n\n【干擾項剖析】「權限相同、只是地域不同」把授權關係說成平行關係，屬半對半錯；「立法會可修改《基本法》」與《基本法》的修改程序不符，屬張冠李戴；「前者只處理外交」把國家最高權力機關的職能大幅收窄，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-03","topic":"「一國兩制」與憲制秩序","difficulty":"intermediate","question":"有評論認為，「高度自治」等同「完全自治」。從《基本法》的授權結構分析，此說法的主要問題在於：","options":["自治權來自中央授權，授權的範圍與界限由《基本法》規定","高度自治只涉及經濟事務，不涉及行政事務","《基本法》從未使用「高度自治」一詞","完全自治的地區在世界上並不存在"],"correctIndex":0,"explanation":"特區的自治權並非固有，而是由中央依《基本法》授予；凡授權必有範圍，因此「高度」與「完全」在法理上有本質分別。分析此類說法，關鍵在於權力來源而非權力大小。\n\n【干擾項剖析】「只涉經濟事務」與《基本法》所列的自治範圍不符，屬半對半錯；「從未使用該詞」與條文事實相反，屬張冠李戴；「完全自治的地區並不存在」即使屬實亦與授權結構無關，屬正確但無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-04","topic":"「一國兩制」與憲制秩序","difficulty":"intermediate","question":"《基本法》規定特區可以「中國香港」的名義參與若干國際組織及國際會議。此項安排最能反映「一國兩制」的哪一個特點？","options":["在維護國家主權的前提下，保留特區原有的對外聯繫","特區在國際上享有與主權國家相同的地位","特區的對外事務完全由特區自行決定","國家主權在對外事務上不適用於特區"],"correctIndex":0,"explanation":"「中國香港」這個名稱本身同時包含兩重意思：「中國」標示主權歸屬，「香港」標示特區的獨立參與資格。名稱的組合方式正是「一國」與「兩制」關係的縮影。\n\n【干擾項剖析】「與主權國家相同地位」忽略名稱中的「中國」二字，屬過度推論；「完全自行決定」與外交事務屬中央管理的規定不符，屬半對半錯；「主權在對外事務上不適用」與第一條直接抵觸，屬張冠李戴。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-05","topic":"「一國兩制」與憲制秩序","difficulty":"hard","question":"比較《基本法》中「中央管理的事務」與「特區自治範圍內的事務」，下列哪項對兩者關係的理解最準確？","options":["兩者由同一部法律劃分，界線本身即是中央授權的體現","兩者是兩套互不相干的法律體系，各自獨立運作","凡《基本法》未明文列出的事務，一律歸特區自治","兩者的界線由特區政府按實際需要自行調整"],"correctIndex":0,"explanation":"劃分兩類事務的是同一部《基本法》，而《基本法》由全國人大制定。因此界線的存在本身，已經說明自治範圍是被劃定的而非自有的。理解此點，才能解釋為何界線爭議須依《基本法》的解釋機制處理。\n\n【干擾項剖析】「兩套互不相干的體系」忽略兩者同源於一部法律，屬張冠李戴；「未列出即歸自治」把剩餘權力預設歸於特區，與授權原則相反，屬過度推論；「由特區自行調整」把界線的決定權移交被授權方，屬半對半錯——特區確可在自治範圍內施政，但無權移動範圍本身。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-06","topic":"法治、權利與責任","difficulty":"basic","question":"法治的其中一項核心要求是「法律面前人人平等」。此項要求最直接的意思是：","options":["法律的適用不因身分、地位或財富而有所不同","所有人所受的刑罰輕重必須完全一致","法律必須經全民投票通過才可生效","任何人都可以自行決定是否遵守法律"],"correctIndex":0,"explanation":"平等適用針對的是法律的「適用對象」，而非「處理結果」。法官仍須按案情、動機與情節量刑，因此結果可以不同，但適用標準必須一致。\n\n【干擾項剖析】「刑罰完全一致」把適用平等誤解為結果平等，屬半對半錯；「須全民投票」把立法程序與法治原則混為一談，屬張冠李戴；「自行決定是否遵守」與法律的約束力直接相反，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-07","topic":"法治、權利與責任","difficulty":"basic","question":"《基本法》保障香港居民享有多項權利與自由。這些權利與自由的行使，一般須符合甚麼條件？","options":["須依法行使，並不得損害國家安全、公共秩序或他人的權利","可以不受任何限制地行使","只有永久性居民才享有，非永久性居民一概不享有","須事先取得政府逐次批准"],"correctIndex":0,"explanation":"權利的保障與界限同時存在。《基本法》既列明各項自由，亦訂明其行使須依法進行；界限本身是權利制度的組成部分，而非對權利的否定。\n\n【干擾項剖析】「不受任何限制」忽略權利之間會互相衝突，屬過度推論；「只有永久性居民享有」與條文中多項權利的適用範圍不符，屬半對半錯；「逐次批准」把依法行使誤解為逐次審批，屬張冠李戴。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-08","topic":"法治、權利與責任","difficulty":"intermediate","question":"法院在審理案件時，須根據法律與證據作出裁決，而不受任何一方的意見左右。此項安排的主要作用是：","options":["使裁決結果可以預期，市民得以據此安排自己的行為","確保每宗案件的判決都能令雙方滿意","加快案件的審理速度","減少政府在司法程序上的開支"],"correctIndex":0,"explanation":"可預期性是法治的核心功能之一。若裁決可因外部意見而改變，市民便無從判斷何種行為合法，法律的指引作用亦隨之失效。\n\n【干擾項剖析】「令雙方滿意」把司法標準改為當事人感受，屬張冠李戴；「加快速度」與審理效率有關，但並非獨立審判的目的，屬正確但無關；「減少開支」同屬無關，屬正確但無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-09","topic":"法治、權利與責任","difficulty":"intermediate","question":"某人認為：「我有言論自由，所以我發表任何內容都不須承擔後果。」此推論的錯誤在於：","options":["把「享有權利」與「免除責任」混為一談","言論自由並不受《基本法》保障","只有經政府登記的言論才受保障","言論自由僅適用於書面而不適用於口頭表達"],"correctIndex":0,"explanation":"權利與責任是同一制度的兩面。誹謗、煽動或披露他人私隱等行為之所以須負責任，並非因為言論自由不存在，而是因為自由的行使不得損害他人的合法權益。\n\n【干擾項剖析】「不受保障」與條文事實相反，屬張冠李戴；「須經登記」把自由改為許可制，屬過度推論；「僅適用於書面」任意區分表達形式，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-10","topic":"法治、權利與責任","difficulty":"hard","question":"在討論權利限制是否恰當時，常用的分析角度包括：限制是否有法律依據、目的是否正當、手段與目的是否相稱。若某項限制有清晰法律依據、目的亦屬正當，但為達到該目的而採取了遠超所需的措施，則問題出在：","options":["相稱性——手段的強度與所欲達到的目的不成比例","合法性——限制欠缺法律依據","正當性——目的本身不能成立","以上三項均不成立，該限制並無問題"],"correctIndex":0,"explanation":"三個角度須逐一檢視，任何一項不通過，整項限制即有可議之處。題幹已明確交代前兩項成立，唯一未通過的是手段與目的之間的比例關係。\n\n【干擾項剖析】「欠缺法律依據」與題幹「有清晰法律依據」直接矛盾，屬張冠李戴；「目的不能成立」同樣與題幹相反；「並無問題」忽略第三項未通過，屬過度推論。此題考的是能否按已知條件逐項排除，而非背誦三項標準的名稱。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-11","topic":"香港社會與參與","difficulty":"basic","question":"市民透過參與地區組織、諮詢委員會或公眾諮詢表達意見，這類參與對公共政策的主要作用是：","options":["讓政策制定者掌握不同持份者的實際處境與需要","直接取代政府的決策權","確保所有意見都必然被完全採納","使政策不再需要考慮資源限制"],"correctIndex":0,"explanation":"公眾參與的功能在於輸入資訊與反映需要，使決策建基於更完整的認識；決策權仍在有關機關，而資源限制亦不會因參與而消失。\n\n【干擾項剖析】「直接取代決策權」把諮詢等同決策，屬過度推論；「必然被完全採納」忽略不同持份者的意見會互相衝突，屬過度推論；「不再考慮資源限制」與公共政策的基本條件相反，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-12","topic":"香港社會與參與","difficulty":"intermediate","question":"評估一項社會政策時，若只考慮受惠人數而不考慮受影響群體的分佈，最可能出現的問題是：","options":["忽略成本與效益在不同群體之間分配不均","高估政策的行政成本","令政策無法通過立法程序","使政策的目標無法量化"],"correctIndex":0,"explanation":"人數是總量指標，無法顯示誰承擔成本、誰取得效益。兩項政策即使受惠人數相同，若成本集中於某一群體，其社會影響會截然不同。\n\n【干擾項剖析】「高估行政成本」與分佈問題無關，屬正確但無關；「無法通過立法程序」把分析缺陷誤作程序障礙，屬張冠李戴；「目標無法量化」與是否考慮分佈並無因果關係，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-13","topic":"香港社會與參與","difficulty":"intermediate","question":"香港人口高齡化持續，其中一項直接影響是勞動人口比例下降。若只以增加退休年齡作為唯一應對措施，可能未足夠的原因是：","options":["高齡化同時帶來醫療與長者照顧需求上升，並非單靠勞動供應可解決","延遲退休會令勞動人口比例進一步下降","高齡化與勞動人口比例並無關係","延遲退休在香港並無先例可循"],"correctIndex":0,"explanation":"高齡化是一組互相關連的變化，勞動供應只是其中一環。醫療、住屋、照顧人手與財政承擔同時受影響，因此單一措施難以覆蓋整體需要。\n\n【干擾項剖析】「令比例進一步下降」把因果方向弄反，屬張冠李戴；「並無關係」與題幹前提矛盾；「並無先例」即使屬實亦不構成措施不足的理由，屬正確但無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-14","topic":"香港社會與參與","difficulty":"hard","question":"兩項關於青年就業的調查結論不一致：甲調查以全港青年為對象，乙調查只訪問了求職網站的登記用戶。在比較兩者可信度時，最應優先檢視的是：","options":["樣本能否代表所要推論的群體","兩項調查的發表日期先後","兩項調查的問卷長度","兩項調查的資助來源是否相同"],"correctIndex":0,"explanation":"乙調查的受訪者已具備「正在求職且會使用該網站」這項共同特徵，據此推論全港青年會出現系統性偏差。代表性問題影響結論能否成立，須先於其他因素檢視。\n\n【干擾項剖析】「發表日期」屬時效問題，重要但不改變代表性缺陷，屬正確但無關；「問卷長度」影響作答質素而非樣本結構，屬張冠李戴；「資助來源」關乎潛在利益衝突，值得留意，但不能取代代表性這項更根本的檢查，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-15","topic":"改革開放與國家發展","difficulty":"basic","question":"改革開放初期設立經濟特區，其中一項主要考慮是：","options":["先在有限範圍內試行新制度，總結經驗後再推廣","一次過在全國同步推行相同政策","把所有工業集中於沿海城市","取消全國各地的地區差異"],"correctIndex":0,"explanation":"特區的作用在於控制風險：範圍有限，失誤的影響可控；成效清楚，經驗可供複製。這種「先試後推」的方式，是理解其後多輪改革安排的基礎。\n\n【干擾項剖析】「全國同步推行」與試點的定義相反，屬張冠李戴；「所有工業集中沿海」把區位選擇誇大為全部集中，屬過度推論；「取消地區差異」與因地制宜的做法相反，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-16","topic":"改革開放與國家發展","difficulty":"basic","question":"衡量一個國家的發展水平時，除了國內生產總值總量，還常用人均國內生產總值。加入「人均」這一項的主要作用是：","options":["排除人口規模的影響，使不同國家之間更具可比性","顯示財富在國內的分配是否平均","反映一個國家的環境代價","計算政府的財政盈餘"],"correctIndex":0,"explanation":"總量受人口規模影響極大，人口眾多的國家即使人均水平不高，總量仍可名列前茅。除以人口之後，比較的是平均而非規模。\n\n【干擾項剖析】「顯示分配是否平均」是常見誤解——人均是平均數，恰恰掩蓋分配差異，須用堅尼系數一類指標，屬半對半錯；「環境代價」與「財政盈餘」均非該指標所量度，屬正確但無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-17","topic":"改革開放與國家發展","difficulty":"intermediate","question":"改革開放後，大量農村人口流向城市。此現象對城市與農村同時帶來的影響，下列哪項最為完整？","options":["城市獲得勞動力但公共服務承受壓力，農村勞動力減少但獲得匯款收入","城市與農村同時受惠，並無任何代價","只有城市受影響，農村不受影響","人口流動對兩者均無明顯影響"],"correctIndex":0,"explanation":"人口流動是雙向影響的過程：遷入地與遷出地各自同時得到與付出。答題時若只列一方的得益或一方的代價，分析即不完整。\n\n【干擾項剖析】「並無任何代價」忽略公共服務與家庭分離的壓力，屬過度推論；「只有城市受影響」忽略遷出地的變化，屬半對半錯；「均無明顯影響」與題幹前提矛盾。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-18","topic":"改革開放與國家發展","difficulty":"intermediate","question":"有資料顯示某地區工業產值十年間大幅上升，同期該地區的河流水質指標則持續轉差。單憑這兩項資料，可以合理推論的是：","options":["兩者在時間上同時出現，但資料本身未能證明因果關係","工業產值上升必然是水質轉差的唯一原因","水質轉差導致工業產值上升","該地區的環保政策必然完全失效"],"correctIndex":0,"explanation":"同時出現只說明相關，未排除其他來源（例如人口增長、農業排放或上游影響），亦未確立方向。資料回應題常設此陷阱，考的是能否分辨相關與因果。\n\n【干擾項剖析】「必然是唯一原因」把相關升格為唯一因果，屬過度推論；「水質轉差導致產值上升」把因果方向倒轉，屬張冠李戴；「環保政策必然完全失效」在缺乏政策資料下作出結論，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-19","topic":"改革開放與國家發展","difficulty":"intermediate","question":"「共同富裕」強調在發展的同時處理分配問題。此提法與單純追求增長的分別在於：","options":["它同時關注財富的創造與分享，而非只看總量增加","它主張停止經濟增長","它只適用於農村地區","它以取消所有收入差距為目標"],"correctIndex":0,"explanation":"增長回答「有多少」，分配回答「歸誰所有」。兩者是不同問題，一項政策可以在前者取得成績而在後者未見進展。\n\n【干擾項剖析】「停止經濟增長」與「共同」二字所預設的發展前提相反，屬張冠李戴；「只適用於農村」任意收窄適用範圍，屬半對半錯；「取消所有收入差距」把縮小差距推到極端，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-20","topic":"改革開放與國家發展","difficulty":"intermediate","question":"粵港澳大灣區建設中，香港常被形容為具備「國際聯繫」與「專業服務」的優勢。此說法所依據的主要條件是：","options":["普通法制度、自由港地位與國際化的專業人才市場","香港的土地面積與自然資源","香港的人口總數在區內最多","香港的製造業規模在區內領先"],"correctIndex":0,"explanation":"所謂優勢須有具體制度或資源支撐。普通法制度令跨境合約與爭議解決具可預期性，自由港地位便利貨物與資金流動，專業人才市場則提供服務能力。\n\n【干擾項剖析】「土地與自然資源」恰恰不是香港的條件，屬張冠李戴；「人口總數最多」與區內實況不符；「製造業規模領先」與香港以服務業為主的結構不符，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-21","topic":"改革開放與國家發展","difficulty":"hard","question":"比較「經濟特區」與「自由貿易試驗區」兩種安排，兩者在制度設計上的共通邏輯是：","options":["以有限地域承載制度試驗，把不確定性控制在可管理的範圍內","兩者都以吸引外來旅客為首要目標","兩者都要求區內企業由政府全資擁有","兩者都不設任何監管要求"],"correctIndex":0,"explanation":"兩者所試驗的內容不同——前者側重生產與外資，後者側重貿易便利化與制度開放——但設計邏輯一致：先劃定範圍，再在範圍內放寬，最後評估是否推廣。比較題的關鍵在於找出層次更高的共通點，而非羅列表面差異。\n\n【干擾項剖析】「吸引旅客」與兩者的定位均不符，屬張冠李戴；「政府全資擁有」與引入多元資本的做法相反；「不設監管要求」把放寬誤解為無管理，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-22","topic":"科技創新與綜合國力","difficulty":"basic","question":"「綜合國力」一詞所涵蓋的範圍，最準確的理解是：","options":["包括經濟、科技、教育、國防與文化影響力等多個方面","僅指軍事力量的強弱","僅指國內生產總值的排名","僅指人口規模的大小"],"correctIndex":0,"explanation":"「綜合」二字本身已說明此概念是多維度的合成，任何單一指標都無法代表整體。理解此點，才能解釋為何各國會在不同維度上各有長短。\n\n【干擾項剖析】三個干擾項各自抽取一個維度充當全部，同屬「以偏概全」的半對半錯：軍事、經濟總量與人口都是組成部分，但都不等於整體。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-23","topic":"科技創新與綜合國力","difficulty":"basic","question":"基礎研究與應用研究的主要分別在於：","options":["前者以認識現象與原理為目標，後者以解決特定問題為目標","前者由政府進行，後者由企業進行","前者不需要經費，後者需要經費","前者只在大學進行，後者只在工廠進行"],"correctIndex":0,"explanation":"分別在於研究目的，而非執行機構或經費來源。基礎研究的成果往往在多年後才顯現用途，這正是它常須依靠長期而穩定資助的原因。\n\n【干擾項剖析】「由誰進行」「在何處進行」把目的上的分別換成主體或地點上的分別，屬張冠李戴；「不需要經費」與研究活動的實況相反，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-24","topic":"科技創新與綜合國力","difficulty":"intermediate","question":"有意見認為，一個國家只要專利申請數量上升，創新能力就必然同步提升。此推論未夠嚴謹，主要因為：","options":["專利數量反映申請活動，未必反映技術價值與實際應用","專利數量與創新完全無關","專利只可由外國企業申請","專利數量無法統計"],"correctIndex":0,"explanation":"數量是投入或活動的指標，價值須另以引用率、轉化率或產業應用等資料佐證。分析此類主張時，應追問指標所量度的究竟是甚麼。\n\n【干擾項剖析】「完全無關」把「未必等同」推到另一極端，屬過度推論；「只可由外國企業申請」與事實不符，屬張冠李戴；「無法統計」與題幹前提矛盾。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-25","topic":"科技創新與綜合國力","difficulty":"intermediate","question":"科技發展帶來便利，同時亦引起私隱與資料安全的憂慮。處理此類議題時，較全面的思考方式是：","options":["同時考慮技術效益、受影響群體與規管安排三方面","只考慮技術效益，其餘留待日後處理","只考慮風險，暫停一切相關技術","交由使用者自行承擔全部風險"],"correctIndex":0,"explanation":"議題分析要求同時處理利益、代價與制度回應三者。只取其一，結論便會偏向該面向，難以支撐評鑑題所要求的多角度論述。\n\n【干擾項剖析】「只考慮效益」與「只考慮風險」是同一種片面，方向相反而已，同屬半對半錯；「由使用者承擔全部風險」迴避了規管安排這一環，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-26","topic":"科技創新與綜合國力","difficulty":"intermediate","question":"某國在若干高技術產品上依賴進口。從國家發展角度看，此情況的主要風險是：","options":["供應一旦中斷，相關產業鏈會受制於外部因素","進口產品的價格必然高於本地生產","依賴進口必然導致失業率上升","進口本身在任何情況下都應該避免"],"correctIndex":0,"explanation":"風險在於自主性而非價格。當關鍵環節掌握在外部，供應條件的變化會直接傳導至本地產業，因此才有「補齊短板」一類的政策考慮。\n\n【干擾項剖析】「價格必然較高」與比較優勢原理相反，屬過度推論；「必然導致失業上升」把單一因素絕對化；「任何情況都應避免」否定國際分工的整體效益，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-27","topic":"科技創新與綜合國力","difficulty":"hard","question":"評估「科技自立自強」這項發展方向時，若有人主張「凡關鍵技術一律必須完全自主，不應與外國合作」，此主張的分析缺陷在於：","options":["把「降低受制風險」推展為「拒絕一切合作」，忽略兩者可以並存","關鍵技術並不存在自主的可能","國際合作在任何領域都不可行","自主研發的成本必然低於合作研發"],"correctIndex":0,"explanation":"自主與合作並非二選一。降低單一來源的依賴，與在其他環節維持交流，可以同時進行；把程度問題（減少依賴）轉為絕對問題（完全隔絕），是評鑑題最常見的推論失誤。\n\n【干擾項剖析】「不存在自主可能」與「合作在任何領域都不可行」是兩個相反方向的絕對化陳述，同屬過度推論；「成本必然較低」加入了題幹並未提供的成本比較，屬正確但無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-28","topic":"經濟全球化","difficulty":"basic","question":"經濟全球化其中一項明顯特徵，是生產過程被拆分到不同國家進行。此安排的主要誘因是：","options":["各地在成本、技術與資源上條件不同，分工可降低整體成本","所有國家的生產條件完全相同","拆分生產可以完全消除運輸需要","跨國生產不受任何政策影響"],"correctIndex":0,"explanation":"分工的前提正是條件不同：若各地成本與技術完全一樣，把生產拆開只會徒增協調與運輸成本。理解此點，才能解釋供應鏈為何會隨成本結構改變而重新佈局。\n\n【干擾項剖析】「條件完全相同」與分工的前提相反，屬張冠李戴；「完全消除運輸需要」恰恰相反——跨國分工令運輸需求增加，屬過度推論；「不受任何政策影響」忽略關稅與貿易安排的作用，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-29","topic":"經濟全球化","difficulty":"intermediate","question":"全球化為部分行業帶來增長，同時令另一些行業面對競爭壓力。分析此現象時，較準確的說法是：","options":["全球化的得益與代價在不同行業與群體之間分佈不均","全球化令所有行業同時受惠","全球化令所有行業同時受損","全球化對各行業的影響完全相同"],"correctIndex":0,"explanation":"「有人得益、有人承受代價」是全球化議題的分析起點。若把影響描述為一致，便無法解釋為何同一國家之內會出現截然不同的立場。\n\n【干擾項剖析】「全部受惠」與「全部受損」是同一種一律化的兩個方向，同屬過度推論；「影響完全相同」忽略行業之間的差異，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-30","topic":"經濟全球化","difficulty":"intermediate","question":"有國家因擔心本地產業受影響而提高進口關稅。此措施對本地消費者的直接影響通常是：","options":["進口商品價格上升，選擇減少","進口商品價格下降，選擇增加","對消費者完全沒有影響","本地商品價格必然同時下降"],"correctIndex":0,"explanation":"關稅提高進口成本，成本一般會轉嫁到零售價；同時部分進口商可能退出市場，令選擇減少。保護本地產業與消費者負擔之間的取捨，是此類議題的核心。\n\n【干擾項剖析】「價格下降」把關稅的作用方向弄反，屬張冠李戴；「完全沒有影響」忽略成本轉嫁，屬過度推論；「本地商品必然同時下降」與競爭壓力減弱後的一般情況相反，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-31","topic":"經濟全球化","difficulty":"intermediate","question":"比較「跨國企業在當地設廠」與「單純向當地出口商品」兩種模式，前者對當地的額外影響通常包括：","options":["帶來就業與技術轉移，同時涉及土地與環境的使用","只帶來稅收，沒有其他影響","令當地完全不需要進口任何商品","使當地企業自動獲得同等技術"],"correctIndex":0,"explanation":"設廠涉及生產要素在當地投入，因此影響面比出口廣：既有就業與技術外溢的可能，也有土地佔用與環境負荷。比較題須同時指出兩面。\n\n【干擾項剖析】「只帶來稅收」漏掉生產活動本身的影響，屬半對半錯；「完全不需要進口」把單一投資推展為整體自給，屬過度推論；「自動獲得同等技術」忽略技術轉移須具備吸收能力，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-32","topic":"經濟全球化","difficulty":"hard","question":"有評論以「全球化令世界更平等」為題。若要嚴謹評估此說法，最必要的一步是：","options":["先釐清「平等」所指的是國家之間、國家之內，還是兩者兼指","先統計全球跨國企業的總數","先確認評論作者的國籍","先比較各國的國土面積"],"correctIndex":0,"explanation":"同一組資料可以同時支持相反結論：國家之間的差距收窄，與國家之內的差距擴大，兩者可以並存。不先界定量度對象，任何比較都不成立。\n\n【干擾項剖析】「統計企業總數」與平等的量度無直接關係，屬正確但無關；「確認作者國籍」是針對人而非針對論證，屬張冠李戴；「比較國土面積」與議題無關。此題考的是評鑑前的概念界定，屬公社科延伸回應題的常見要求。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-33","topic":"互聯相依的世界","difficulty":"basic","question":"「互聯相依」用以描述當代國際關係，其核心意思是：","options":["各國在經濟、環境與公共衞生等領域互相影響，難以單獨應對","各國的政策完全一致","國際問題只須由大國處理","各國之間不再存在利益分歧"],"correctIndex":0,"explanation":"互相依存並不等於立場一致。正因為各國同時互相影響而又各有利益，國際合作才既有必要，亦有難度。\n\n【干擾項剖析】「政策完全一致」與「不再存在利益分歧」把互賴誤解為一致，同屬過度推論；「只須由大國處理」與跨境問題影響所有國家的事實不符，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-34","topic":"互聯相依的世界","difficulty":"intermediate","question":"跨境傳染病爆發時，單一國家即使防控得力，仍可能再次面對輸入風險。此現象最能說明：","options":["公共衞生風險具跨境性質，防控成效受其他地區影響","防控措施本身沒有作用","輸入風險與人員流動無關","單一國家的措施可完全隔絕外部風險"],"correctIndex":0,"explanation":"此現象說明的是防控成效的邊界，而非措施無效。措施可以降低本地傳播，但無法改變外部環境，因此才需要跨境協作與資訊通報。\n\n【干擾項剖析】「措施沒有作用」把「不能完全隔絕」推到「完全無效」，屬過度推論；「與人員流動無關」與輸入的定義相反，屬張冠李戴；「可完全隔絕」與題幹前提矛盾。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-35","topic":"互聯相依的世界","difficulty":"intermediate","question":"國際組織在處理跨境議題時，其決議的執行往往依賴成員國自願配合。此安排帶來的主要限制是：","options":["當個別成員國不配合時，整體成效會被削弱","決議內容必然不合理","國際組織無法召開會議","跨境議題會自動獲得解決"],"correctIndex":0,"explanation":"此限制源自國際體系的結構：主權國家並無上級強制機關。理解此點，才能解釋為何同一議題上會出現「有共識但無進展」的情況。\n\n【干擾項剖析】「內容必然不合理」把執行問題誤作內容問題，屬張冠李戴；「無法召開會議」與事實不符；「自動獲得解決」與題幹所述限制方向相反，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-36","topic":"互聯相依的世界","difficulty":"hard","question":"評鑑「國際援助是否有效」時，若只以援助金額作為指標，最主要的分析缺陷是：","options":["金額量度投入，未能顯示受助地區的實際改善","金額資料一般無法取得","援助金額與受助人口數目無關","援助必然由受助國自行決定用途"],"correctIndex":0,"explanation":"投入與成效是兩個層次。同額援助可因用途、管理與當地條件不同而產生極大差異，故評鑑須輔以成果指標，例如就學率、嬰兒死亡率或潔淨水覆蓋率。\n\n【干擾項剖析】「無法取得」與事實不符，屬張冠李戴；「與人口數目無關」把人均換算問題誤作相關性問題，屬半對半錯；「必然自行決定用途」把援助條件一律化，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-37","topic":"可持續發展與公共衞生","difficulty":"basic","question":"可持續發展要求在滿足當代需要的同時，不損害後代滿足其需要的能力。此定義所強調的核心是：","options":["代際之間的公平","單一年度的經濟增長率","國家之間的軍事平衡","城市人口的密度"],"correctIndex":0,"explanation":"定義同時涵蓋當代與後代，因此重點在時間跨度上的公平，而非任何單一時點的表現。此點是理解各項可持續發展政策取捨的基礎。\n\n【干擾項剖析】「單一年度增長率」把跨代考量壓縮為短期指標，屬半對半錯；「軍事平衡」與「人口密度」與定義無關，屬正確但無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-38","topic":"可持續發展與公共衞生","difficulty":"intermediate","question":"減少碳排放的措施往往在短期內增加企業成本，長期則可降低環境代價。此情況說明的政策難題是：","options":["成本與效益出現在不同時間，影響各方的支持意願","減排措施在技術上不可行","環境代價無法量度","企業成本與環境並無關連"],"correctIndex":0,"explanation":"時間錯配是環境政策的典型困難：承擔成本的一方即時感受壓力，而效益則分散於未來且未必由同一方享有。此點解釋了為何過渡安排與補償機制常成為爭議焦點。\n\n【干擾項剖析】「技術上不可行」與題幹所述「長期可降低代價」矛盾；「無法量度」與現有環境指標不符，屬張冠李戴；「並無關連」與題幹前提直接相反。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-39","topic":"可持續發展與公共衞生","difficulty":"intermediate","question":"公共衞生政策中的「預防」與「治療」，在資源運用上的主要分別是：","options":["預防針對尚未患病的人群，成效較難即時可見","預防的成本必然高於治療","治療不需要任何公共資源","預防只適用於傳染病"],"correctIndex":0,"explanation":"預防的成效體現為「沒有發生的病例」，本質上難以直接觀察，這正是預防項目在資源競逐中較易被壓縮的原因。理解此點有助評鑑衞生資源分配。\n\n【干擾項剖析】「成本必然較高」未經比較即下結論，屬過度推論；「不需要公共資源」與事實不符，屬張冠李戴；「只適用於傳染病」忽略慢性病預防，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b2-40","topic":"可持續發展與公共衞生","difficulty":"hard","question":"某地推行「污染者自付」原則，向排放者按排放量收費。有意見批評此措施會令低收入家庭負擔加重。要回應此批評而不放棄該原則，較可行的方向是：","options":["保留收費訊號，同時以收入補助或退款方式抵銷受影響家庭的負擔","取消收費，改以呼籲市民自願減排","把收費全部轉嫁予企業，家庭一律豁免","提高收費水平，令所有人同樣減少排放"],"correctIndex":0,"explanation":"收費的作用在於改變相對價格，從而改變行為；補助則針對負擔能力。兩者分開處理，可以同時保留誘因與照顧公平，這是評鑑題所要求的「兼顧多方」思路。\n\n【干擾項剖析】「取消收費」放棄了原則本身，未回應題幹要求；「一律豁免家庭」會令家庭排放失去價格訊號，屬半對半錯；「提高收費令所有人同樣減少」忽略不同家庭的承受能力差異，反而加重原有批評，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "csd";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "csd-batch2.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()) }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "csd-batch2.decisions.json"; a.click();
});
counts();
</script></body></html>
