<script>
const DATA = [{"id":"ict_floor_01","topic":"網絡計算","difficulty":"basic","question":"1 位元組（byte）等於多少位元（bit）？","options":["8 位元","4 位元","16 位元","1,024 位元"],"correctIndex":0,"explanation":"1 位元組固定等於 8 位元，這是資訊科技科所有容量與速率換算的基礎。要特別留意單位符號的大小寫：小寫 b 代表位元（bit），大寫 B 代表位元組（byte）。網絡速率通常以 Mbps（每秒兆位元）表示，而檔案大小通常以 MB（兆位元組）表示，兩者相差 8 倍。1,024 是「千」與「兆」等前綴之間的進位倍數，並非位元組與位元之間的關係，混淆這兩個數字是計算傳輸時間時最常見的失分原因。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_02","topic":"網絡計算","difficulty":"basic","question":"一個大小為 2 KB 的檔案，相當於多少位元組？（以 1 KB = 1,024 位元組計）","options":["2,048 位元組","2,000 位元組","1,024 位元組","16,384 位元組"],"correctIndex":0,"explanation":"以二進位前綴計算，1 KB = 1,024 位元組，所以 2 KB = 2 × 1,024 = 2,048 位元組。2,000 是把前綴當成十進位的 1,000；1,024 漏了乘以 2；16,384 則是額外再乘了 8，把答案化成了位元而非位元組。作答時應先看題目要求的是位元還是位元組，再決定是否需要乘以 8。試卷有時會明確指定 1 KB = 1,000 位元組，屆時應依題目所給的定義計算，不要沿用習慣。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_03","topic":"網絡計算","difficulty":"basic","question":"以每秒 500 KB 的實際速率下載一個 2,000 KB 的檔案，忽略額外開銷，所需時間是多少？","options":["4 秒","2.5 秒","40 秒","1,500 秒"],"correctIndex":0,"explanation":"時間等於資料量除以速率：2,000 ÷ 500 = 4 秒。由於題目所給的檔案大小與速率同樣使用 KB，兩者單位一致，不需要任何換算，可以直接相除。2.5 秒是把分子分母倒轉；40 秒多乘了 10；1,500 秒則是把兩者相減。這一條的用意正是先建立「時間 = 資料量 ÷ 速率」這個關係，之後遇上單位不一致的題目，才在此基礎上加入換算的步驟。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_04","topic":"網絡計算","difficulty":"intermediate","question":"一條 16 Mbps 的網絡連線，其理論上的最高傳輸速率換算成每秒位元組是多少？","options":["2 MB/s","16 MB/s","128 MB/s","8 MB/s"],"correctIndex":0,"explanation":"Mbps 的 b 是小寫，代表位元；MB/s 的 B 是大寫，代表位元組。由位元換成位元組要除以 8，所以 16 ÷ 8 = 2 MB/s。16 MB/s 是把兩個單位當成相同；128 MB/s 是乘了 8 而非除以 8，方向剛好相反；8 MB/s 是把 16 減去 8。這條題目解釋了一個日常現象：家中的網絡計劃標榜 100 Mbps，但下載時見到的速度大約只有 12 MB/s，並非商戶誇大，而是兩個數字用的單位本來就不同。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_05","topic":"網絡計算","difficulty":"intermediate","question":"以一條 4 Mbps 的連線傳送一個 5 MB 的檔案，忽略額外開銷，所需時間約為多少？（以 1 MB = 8 Mb 計）","options":["10 秒","1.25 秒","1.6 秒","40 秒"],"correctIndex":0,"explanation":"檔案大小以位元組計，連線速率以位元計，必須先統一單位。5 MB = 5 × 8 = 40 Mb，再除以速率：40 ÷ 4 = 10 秒。1.25 秒是完全略過換算，直接以 5 ÷ 4 計算；1.6 秒是把 4 除以 2.5；40 秒則停在換算後的中間值 40 Mb，忘記了再除以速率。做這類題目建議固定三個步驟：先看單位是否一致，再換算，最後才相除——把換算獨立成一步，可避免在心算之中漏掉乘以 8。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_06","topic":"網絡計算","difficulty":"intermediate","question":"某公司需要在 20 秒之內傳送一個 30 MB 的檔案。忽略額外開銷，所需的最低連線速率是多少？（以 1 MB = 8 Mb 計）","options":["12 Mbps","1.5 Mbps","24 Mbps","600 Mbps"],"correctIndex":0,"explanation":"本題把「時間 = 資料量 ÷ 速率」倒過來用：速率 = 資料量 ÷ 時間。先換算資料量：30 MB = 30 × 8 = 240 Mb，再除以時間：240 ÷ 20 = 12 Mbps。1.5 Mbps 是略過了乘以 8 的換算；24 Mbps 是誤用 480 Mb；600 Mbps 是把兩者相乘而非相除。留意答案的單位是 Mbps 而非 MB/s——題目問「連線速率」，網絡連線一律以位元計，所以最後必須留在位元的單位上。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_07","topic":"網絡計算","difficulty":"intermediate","question":"在同一條 10 Mbps 的連線上，連續傳送 6 個各為 2.5 MB 的檔案。忽略額外開銷，總共需時多少？（以 1 MB = 8 Mb 計）","options":["12 秒","2 秒","1.5 秒","120 秒"],"correctIndex":0,"explanation":"先求總資料量：6 × 2.5 = 15 MB，換算為 15 × 8 = 120 Mb，再除以速率：120 ÷ 10 = 12 秒。2 秒只計了單一檔案；1.5 秒略過了換算；120 秒停在中間值 120 Mb。另一條路徑是先算單一檔案的時間（2.5 × 8 ÷ 10 = 2 秒），再乘以 6，同樣得 12 秒——兩條路徑必須一致，若不一致代表某一步出錯。要留意「連續傳送」表示檔案逐個排隊使用同一條連線，時間相加；若題目改為多條連線同時傳送，計法便完全不同。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_08","topic":"網絡計算","difficulty":"intermediate","question":"某網絡連線的標稱速率為 20 Mbps，但由於協定額外開銷，實際可用的傳輸速率只有標稱值的 80%。傳送一個 10 MB 的檔案實際需時多少？（以 1 MB = 8 Mb 計）","options":["5 秒","4 秒","6.25 秒","3.2 秒"],"correctIndex":0,"explanation":"先求實際速率：20 × 80% = 16 Mbps。再換算資料量：10 MB = 80 Mb。最後相除：80 ÷ 16 = 5 秒。4 秒是用了標稱速率 20 Mbps 而忽略開銷，這正是本題要考的一步；6.25 秒是把 80% 當成除以 0.8 之外又多除一次；3.2 秒則是誤把 80% 應用於檔案大小。額外開銷指協定本身所佔用的位元（例如封包的標頭與確認訊息），這些位元佔用頻寬但不屬於使用者的資料，所以實際速率必然低於標稱速率。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_09","topic":"網絡計算","difficulty":"hard","question":"甲、乙兩地之間有兩個傳送方案。方案一：以 8 Mbps 連線直接傳送一個 90 MB 的檔案。方案二：先在本機把檔案壓縮至原大小的 40%，壓縮需時 30 秒，再以同一條連線傳送。哪一個方案較快，快多少？（以 1 MB = 8 Mb 計）","options":["方案二快，快 24 秒","方案一快，快 24 秒","方案二快，快 54 秒","兩個方案所需時間相同"],"correctIndex":0,"explanation":"方案一：90 MB = 720 Mb，720 ÷ 8 = 90 秒。方案二：壓縮後為 90 × 40% = 36 MB = 288 Mb，傳送需 288 ÷ 8 = 36 秒，加上壓縮的 30 秒，合共 66 秒。90 − 66 = 24 秒，方案二較快。54 秒只比較了傳送時間（90 − 36）而漏計壓縮所用的 30 秒，這正是本題的陷阱：壓縮省下的是傳送時間，但壓縮本身亦要花時間，兩者必須一併計算。由此亦可見壓縮並非永遠划算——若連線速率夠高，或壓縮率不理想，壓縮所花的時間可能超過所省下的時間。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_10","topic":"資料表示計算","difficulty":"basic","question":"二進位數 1011 換算成十進位是多少？","options":["11","13","1,011","7"],"correctIndex":0,"explanation":"由右至左，各位的權值依次為 1、2、4、8。1011 各位為 1、1、0、1，所以數值 = 8 + 0 + 2 + 1 = 11。13 是把權值 2 與 4 的位置調亂；1,011 是直接照抄數字而未作換算；7 則是 0111 的值，把首位的 1 讀漏了。做二進位換算時建議由右至左寫出權值再逐位相加，比由左至右心算穩妥，因為位數一多，由左至右容易數錯權值。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_11","topic":"資料表示計算","difficulty":"basic","question":"十進位數 26 換算成 8 位元二進位是多少？","options":["00011010","00011011","00010110","00101100"],"correctIndex":0,"explanation":"以權值分解：26 = 16 + 8 + 2，對應的權值位置為 16、8、2，其餘為 0，寫成 8 位元即 00011010。00011011 多算了權值 1，其值為 27；00010110 的值為 22；00101100 的值為 44。可用除二取餘法核對：26 除 2 餘 0、13 除 2 餘 1、6 餘 0、3 餘 1、1 餘 1，由下至上讀出即 11010，補足至 8 位元前面加三個 0。兩種方法所得必須一致，這是最有效的自我檢查方式。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_12","topic":"資料表示計算","difficulty":"basic","question":"十六進位數 2F 換算成十進位是多少？","options":["47","31","25","215"],"correctIndex":0,"explanation":"十六進位每一位的權值是 16 的乘冪。2F 的高位為 2，權值 16，低位 F 代表 15，權值 1，所以數值 = 2 × 16 + 15 = 47。31 是把 F 誤當作 15 而高位只乘 1；25 是把 F 當成 5；215 是把兩位當成十進位數字直接拼接。十六進位常用於表示位元組，因為每一個十六進位數字剛好對應 4 個位元，兩個數字便是一個位元組，比寫出 8 個 0 與 1 簡潔得多。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_13","topic":"資料表示計算","difficulty":"intermediate","question":"以 ASCII 編碼儲存字串 \"DSE2026\"（不含引號，每個字符佔 1 位元組），共需多少位元？","options":["56 位元","7 位元","49 位元","28 位元"],"correctIndex":0,"explanation":"字串 DSE2026 共有 7 個字符：D、S、E、2、0、2、6。每個字符佔 1 位元組即 8 位元，所以合共 7 × 8 = 56 位元。7 位元只計了字符數目而未乘以 8；49 位元誤用每字符 7 位元（那是標準 ASCII 的編碼位數，但題目已指明每字符佔 1 位元組）；28 位元則假設每字符 4 位元。要留意數字字符「2」與數值 2 並不相同——在字串之中，2 只是一個與字母同等地位的字符，同樣佔一個位元組。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_14","topic":"資料表示計算","difficulty":"intermediate","question":"一幅未經壓縮的點陣圖像的色深為 8 位元。該圖像最多可以表示多少種不同顏色？","options":["256 種","255 種","128 種","512 種"],"correctIndex":0,"explanation":"n 個位元可以組成 2 的 n 次方個不同組合，每個組合代表一種顏色。色深 8 位元即 2 的 8 次方 = 256 種。255 種是最容易中招的一項：255 是 8 位元所能表示的最大數值，但可表示的數值【個數】是 256 個，因為要連 0 一併計算——「最大值」與「總數」相差 1，這個分別在色深、記憶體定址、無正負號整數範圍等題目上會重複出現。128 種是 2 的 7 次方，512 種是 2 的 9 次方，都是位元數算多或算少了一個。要記住這個關係是指數而非倍數：色深由 8 位元增至 16 位元，顏色數並非增加一倍，而是由 256 種增至 65,536 種，這亦解釋了為何提高色深會令檔案大小明顯上升。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_15","topic":"資料表示計算","difficulty":"intermediate","question":"使用 8 位元二補數表示帶正負號的整數，可以表示的數值範圍是甚麼？","options":["−128 至 127","−127 至 128","−128 至 128","0 至 255"],"correctIndex":0,"explanation":"8 位元共有 2 的 8 次方 = 256 個不同組合。二補數把其中一半分配給負數、一半分配給零與正數，但由於零佔用了正數那一邊的一個組合，正數只剩 127 個，負數則有 128 個，因此範圍是 −128 至 127。−127 至 128 把不對稱的方向弄反；−128 至 128 合共 257 個數值，超出 256 個組合，一望即知不可能；0 至 255 是無正負號 8 位元的範圍，並非二補數。這個「負數比正數多一個」的不對稱正是二補數的特徵，值得記牢。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_16","topic":"資料表示計算","difficulty":"intermediate","question":"一段單聲道的數碼錄音，取樣頻率為 8,000 Hz，每個樣本 8 位元，長度 10 秒。忽略檔案標頭，其資料量是多少？","options":["80,000 位元組","640,000 位元組","10,000 位元組","80,000 位元"],"correctIndex":0,"explanation":"先求總位元數：取樣頻率 × 每樣本位元數 × 秒數 = 8,000 × 8 × 10 = 640,000 位元。題目問的是位元組，所以再除以 8：640,000 ÷ 8 = 80,000 位元組。640,000 位元組是停在了位元的中間值而誤標為位元組；80,000 位元同樣是單位寫錯；10,000 位元組是漏了乘以每樣本位元數。單聲道表示只有一條聲道，若題目改為立體聲，總量要再乘以 2——讀題時應留意聲道數目這一項，它經常被略過。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_17","topic":"資料表示計算","difficulty":"intermediate","question":"以 8 位元無正負號二進位計算 11010110 + 00101011。在只保留 8 位元的情況下，結果是甚麼？","options":["00000001，並產生溢位","11111011，並產生溢位","11111010，沒有溢位","10000001，沒有溢位"],"correctIndex":0,"explanation":"先以十進位核對：11010110 = 214，00101011 = 43，相加為 257。但 8 位元無正負號可表示的範圍只到 255，257 已經超出上限，因此必然發生溢位。逐位相加（由右至左）：0+1 得 1；1+1 得 0 並進位；此後每一位都是 0 加 1 再加進位，結果為 0 而進位持續傳遞，直至最高位進位溢出 8 位元之外。保留的 8 位元為 00000001，即十進位 1，正好是 257 − 256。溢位的意思並非計算出錯，而是結果超出了所分配的位元數所能表示的範圍，多出的最高位進位被捨棄。實際程式中若不檢查溢位，一個看似合理的加法便會得出遠小於預期的數值，這是資訊科技科要求理解位元數限制的原因。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_18","topic":"邏輯與算法","difficulty":"basic","question":"對於邏輯運算 AND，在甚麼情況下輸出為 1？","options":["兩個輸入都是 1 的時候","至少有一個輸入是 1 的時候","兩個輸入都是 0 的時候","兩個輸入互不相同的時候"],"correctIndex":0,"explanation":"AND 只有在所有輸入皆為 1 時輸出才是 1，其餘三種組合的輸出都是 0。「至少有一個輸入是 1」描述的是 OR；「兩個輸入互不相同」描述的是 XOR（互斥或）；「兩個輸入都是 0」則是 NOR 輸出 1 的條件。記憶方法可借助日常語言：AND 對應「而且」，兩個條件都要滿足；OR 對應「或者」，滿足其一即可。三個基本閘的真值表建議完整背熟，因為化簡布林表達式時要反覆用到。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_19","topic":"邏輯與算法","difficulty":"basic","question":"邏輯運算 NOT 1 OR 0 的結果是甚麼？（NOT 優先於 OR）","options":["0","1","既非 0 亦非 1","無法確定"],"correctIndex":0,"explanation":"按運算次序先計 NOT：NOT 1 = 0。然後計 OR：0 OR 0 = 0。答案為 0。若誤把括號理解成 NOT (1 OR 0)，則先算 1 OR 0 = 1，再取反得 0，本題碰巧同值，但換成其他數字便會不同，所以仍應嚴格按次序運算。布林運算的優先次序是 NOT 最高，其次 AND，最後 OR，與算術中先乘除後加減的道理相同；不確定時加上括號，是考試中最穩妥的做法。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_20","topic":"邏輯與算法","difficulty":"basic","question":"以「線性搜尋」在一個含 200 個元素的未排序陣列中尋找某個值，在最壞情況下需要比較多少次？","options":["200 次","100 次","8 次","1 次"],"correctIndex":0,"explanation":"線性搜尋由第一個元素開始逐一比較。最壞情況是目標值位於最後一個位置，或根本不在陣列之中，兩種情況都必須把 200 個元素全部比較一次，所以答案是 200 次。100 次是平均情況而非最壞情況，題目問的是最壞情況；8 次接近二分搜尋的次數，但二分搜尋要求資料已排序，而本題明言未排序；1 次是最好情況，即目標剛好在第一個位置。作答時必須先看清楚問的是最好、平均還是最壞情況——三者的答案完全不同。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_21","topic":"邏輯與算法","difficulty":"intermediate","question":"根據德摩根定律，NOT (A AND B) 等價於下列哪一項？","options":["(NOT A) OR (NOT B)","(NOT A) AND (NOT B)","NOT (A OR B)","A OR B"],"correctIndex":0,"explanation":"德摩根定律有兩條：NOT (A AND B) = (NOT A) OR (NOT B)，以及 NOT (A OR B) = (NOT A) AND (NOT B)。關鍵在於取反之後，AND 與 OR 必須互換，只把每個變數取反而保留原運算是最常見的錯誤——(NOT A) AND (NOT B) 其實等於 NOT (A OR B)，是另一條定律的右邊。可用日常語言理解：「並非（下雨而且颳風）」的意思是「不下雨，或者不颳風」，只要其中一項不成立即可，並不需要兩項都不成立。不肯定時可畫出四行真值表逐行核對，比記口訣可靠。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_22","topic":"邏輯與算法","difficulty":"intermediate","question":"布林表達式 A OR (A AND B) 可化簡為甚麼？","options":["A","B","A AND B","A OR B"],"correctIndex":0,"explanation":"這是吸收律。逐一驗證：若 A = 1，則整條式子為 1 OR（任何值）= 1，與 A 相同；若 A = 0，則 A AND B = 0，整條式子為 0 OR 0 = 0，同樣與 A 相同。兩種情況下結果都等於 A，故可化簡為 A，B 的值完全不影響結果。A OR B 在 A = 0 而 B = 1 時為 1，但原式此時為 0，可見不等價；A AND B 在 A = 1 而 B = 0 時為 0，原式此時為 1，同樣不等價。化簡之後電路所需的邏輯閘減少，這正是布林代數在硬件設計上的實際用途。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_23","topic":"邏輯與算法","difficulty":"intermediate","question":"以「冒泡排序」對一個含 6 個元素的陣列排序，第一趟（first pass）需要進行多少次相鄰元素的比較？","options":["5 次","6 次","15 次","36 次"],"correctIndex":0,"explanation":"冒泡排序每一趟都把相鄰的兩個元素逐對比較。6 個元素可以組成 5 對相鄰組合（第 1 與第 2、第 2 與第 3⋯⋯第 5 與第 6），所以第一趟需要 5 次比較，比元素數目少一。6 次是把元素數目直接當成比較次數；15 次是完成整個排序所需的總比較次數（5+4+3+2+1）；36 次是 6 的平方。第一趟結束後，最大的元素必定已被移到最後一個位置，所以第二趟只需比較 4 次，其後每趟遞減一次——這個遞減正是總次數為 15 的由來。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_24","topic":"邏輯與算法","difficulty":"intermediate","question":"對一個已排序、含 64 個元素的陣列進行二分搜尋，在最壞情況下需要多少次比較？","options":["7 次","6 次","32 次","64 次"],"correctIndex":0,"explanation":"二分搜尋每比較一次便把搜尋範圍減半：64 → 32 → 16 → 8 → 4 → 2 → 1，共 6 次減半之後剩下 1 個元素，仍須再比較該元素一次才能確定，所以最壞情況為 7 次。6 次只數了減半的次數而漏了最後一次比較；32 次是元素數目的一半；64 次是線性搜尋的最壞情況。這條題目說明二分搜尋的威力：陣列由 64 個增至 1,024 個元素，元素數目多了 16 倍，比較次數卻只由 7 次增至 11 次——但前提是資料必須已經排序。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"ict_floor_25","topic":"邏輯與算法","difficulty":"intermediate","question":"一個邏輯電路的輸出為 (A AND B) OR (NOT A AND B)。當 A = 0、B = 1 時，輸出是多少？","options":["1","0","視乎 A 的值而定","電路存在矛盾"],"correctIndex":0,"explanation":"代入 A = 0、B = 1。左半部：A AND B = 0 AND 1 = 0。右半部：NOT A = 1，所以 NOT A AND B = 1 AND 1 = 1。最後取 OR：0 OR 1 = 1，輸出為 1。順帶一提，這條式子可化簡為 B：無論 A 是 0 還是 1，總有一半成立而另一半為 0，結果永遠等於 B，所以 A 對輸出並無影響——這亦說明為何選項之中「視乎 A 的值而定」並不正確。逐步代入再化簡核對，是處理邏輯電路題最穩妥的方法。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

function timing(){

  };
}

    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "ict-floor.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "ict-floor.decisions.json"; a.click();
});
counts();
</script></body></html>
