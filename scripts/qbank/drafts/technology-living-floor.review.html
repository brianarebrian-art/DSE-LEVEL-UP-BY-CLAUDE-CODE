<script>
const DATA = [{"id":"tl_floor_01","topic":"營養素","difficulty":"basic","question":"六大類營養素之中，有些能為人體提供能量，有些則不能。以下哪一種營養素不能為人體提供能量？","options":["維生素","蛋白質","脂肪","碳水化合物"],"correctIndex":0,"explanation":"能提供能量的只有三類：碳水化合物及蛋白質各約每克 4 千卡，脂肪約每克 9 千卡。維生素、礦物質和水均不提供能量，但它們是各種代謝反應所必需的 —— 沒有維生素，人體連釋放能量的過程也無法順利進行。「不提供能量」與「不重要」是兩回事，這一點常被混淆。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_02","topic":"營養素","difficulty":"basic","question":"維生素 A 主要有助維持人體哪一方面的健康？","options":["牙齦健康及傷口的癒合過程","視力，尤其在昏暗環境中的視覺，以及皮膚和黏膜","血液的凝固功能，使傷口能夠止血","鈣質的吸收，使骨骼能正常鈣化"],"correctIndex":1,"explanation":"維生素 A 參與視網膜感光物質的合成，故缺乏時最早出現的徵狀是夜盲；它同時維持皮膚及黏膜的完整。其餘三項各有所屬：血液凝固屬維生素 K，促進鈣吸收屬維生素 D，牙齦與傷口癒合屬維生素 C。四者的功能互相對調，是本課最常見的失分位，宜逐個記牢其代表徵狀。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_03","topic":"營養素","difficulty":"basic","question":"膳食纖維主要來自哪一類食物？","options":["牛奶、芝士及乳製品","食油、牛油及其他油脂","蔬菜、水果及全穀類食物","瘦肉、魚類及家禽"],"correctIndex":2,"explanation":"膳食纖維是植物細胞壁的成分，因此只存在於植物性食物之中；動物性食物無論多瘦、多新鮮，一律不含纖維。留意「肉類有筋，所以有纖維」是常見誤解 —— 肉的筋是結締組織，屬蛋白質，人體消化方式與膳食纖維完全不同。精製穀物在加工時已把麩皮去掉，故白米、白麵包的纖維遠低於全穀類。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_04","topic":"人生階段營養","difficulty":"basic","question":"世界衞生組織建議嬰兒出生後首六個月採用哪一種餵哺方式？","options":["母乳餵哺，另加清水以補充水分","配方奶餵哺，另加米糊以增加飽足感","母乳餵哺，另加稀釋果汁以補充維生素","全母乳餵哺，不需另加任何食物或飲料"],"correctIndex":3,"explanation":"母乳本身已含足夠水分，即使在炎熱天氣亦不需另加清水；額外餵水反而佔去胃容量，減少吸吮，令奶量下降。固體食物一般在約六個月大才引入，因為此前嬰兒的消化系統及吞嚥協調尚未成熟。至於果汁，即使稀釋亦只提供糖分而非必需營養，並不適合此階段。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_05","topic":"人生階段營養","difficulty":"basic","question":"青春期的少女比同齡少男較容易缺乏哪一種礦物質？","options":["鐵質","碘質","鈉質","氟質"],"correctIndex":0,"explanation":"月經開始後每月固定失血，而血液中的血紅蛋白正以鐵為核心，故少女的鐵質需要量高於同齡少男，缺乏時會出現疲倦、面色蒼白及專注力下降。留意膳食中的鐵分兩種：來自紅肉的血基質鐵吸收率較高，來自深綠色蔬菜及豆類的非血基質鐵吸收率較低，但與含維生素 C 的食物同吃可提高吸收。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_06","topic":"人生階段營養","difficulty":"basic","question":"兒童每日需要充足的鈣質，主要用於甚麼？","options":["製造消化食物所需的酵素","建造及強化骨骼與牙齒","把氧氣由肺部運送到全身","調節體溫並帶走代謝廢物"],"correctIndex":1,"explanation":"骨骼在兒童及青少年階段迅速增長，成年前所累積的骨質量會影響日後患骨質疏鬆的風險，故這段時期的鈣質攝取特別關鍵。其餘三項各有所屬：運送氧氣靠鐵質，調節體溫及運走廢物靠水分，酵素則主要由蛋白質構成。另須留意鈣質必須有維生素 D 配合才能有效吸收，兩者宜一併考慮。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_07","topic":"人生階段營養","difficulty":"basic","question":"長者較容易出現脫水的情況，其中一個原因是甚麼？","options":["長者飲用的水不能經腸道吸收進入血液","長者體內的水分比例較年輕人高，故流失更快","口渴的感覺隨年齡減弱，缺水時往往仍不覺得渴","長者的體溫較高，體內水分蒸發得特別快"],"correctIndex":2,"explanation":"口渴是身體的警號，而這個警號在長者身上變得遲鈍，因此不能靠「等到覺得渴才飲」。實際體內水分比例是隨年齡【下降】而非上升，儲備因而更少，一旦流失就更快出現問題。照顧長者時宜定時提供飲品，並留意湯水、粥品及水果亦是水分來源。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_08","topic":"人生階段營養","difficulty":"basic","question":"孕婦應避免進食未經徹底煮熟的食物，主要原因是甚麼？","options":["未煮熟的食物味道較重，容易加劇孕吐的情況","未煮熟的食物能量密度較高，令體重增加過多","未煮熟的食物纖維含量較高，會妨礙鐵質的吸收","孕期免疫力較低，食源性疾病會同時威脅母體及胎兒"],"correctIndex":3,"explanation":"孕期的免疫反應會受到調節，對某些病原體的抵抗力下降，而部分食源性病原體可穿過胎盤影響胎兒，後果可以遠比一般成年人食物中毒嚴重。故此高風險食物 —— 生的或半熟的肉類、蛋類、未經消毒的奶類及軟芝士、生的貝類 —— 在孕期應予避免。這是「風險後果嚴重」而非「風險機會特別高」的考慮。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_09","topic":"膳食計劃","difficulty":"basic","question":"為一個家庭編製膳食計劃時，最先要確定的是甚麼？","options":["各成員的年齡、健康狀況及活動量","廚房現有的餐具及器皿數量","每一餐上菜的先後次序","食物擺盤時的顏色配搭"],"correctIndex":0,"explanation":"膳食計劃的起點是「為誰而設」：一個做體力勞動的成年人、一個發育中的青少年、一個患高血壓的長者，三者的能量與營養需要並不相同，同一份餐單不可能同時最適合三人。先定需要，再定食物，最後才輪到烹調與呈現 —— 次序倒轉，往往就是設計題失分的地方。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_10","topic":"膳食計劃","difficulty":"basic","question":"早餐對學生特別重要，主要原因是甚麼？","options":["早餐所含的維生素比一日其他餐次都要多","經過整夜空腹後補充能量，有助維持上午的專注力","早餐的食物一般較容易消化，可減輕腸胃負擔","早餐可以代替午餐，以減少全日的總能量攝取"],"correctIndex":1,"explanation":"大腦主要以葡萄糖為燃料，而經過一夜之後血糖及肝糖儲備均處於低位，若不進食，上午的記憶、專注及情緒都會受影響。留意所謂「不吃早餐可減重」是常見誤解：空腹到中午容易令下一餐份量失控，全日總攝取未必減少。一份合適的早餐應同時提供穀物、蛋白質食物及蔬果。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_11","topic":"膳食計劃","difficulty":"basic","question":"為一位需要限制鈉攝取量的人設計膳食，下列哪一種調味方法最合適？","options":["以雞粉代替食鹽為食物調味","以蠔油代替食鹽為食物調味","以香草、薑蔥蒜及檸檬汁等天然材料提味","以豉油代替食鹽為食物調味"],"correctIndex":2,"explanation":"三種「代替品」全部本身含鈉甚高：豉油、雞粉及蠔油的鈉含量往往比同等調味效果的食鹽有過之而無不及，換了等於沒有換。真正有效的方法是改用不含鈉的味道來源 —— 香草的香氣、薑蔥蒜的辛香、檸檬汁及醋的酸味都能提升風味，並可配合蒸、焗等保留原味的烹調方法，逐步把口味調淡。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_12","topic":"膳食計劃","difficulty":"basic","question":"在學校午餐的餐單中加入水果作為餐後食品，最主要的營養理由是甚麼？","options":["提供優質蛋白質以支持生長","提供必需脂肪酸以維持細胞功能","提供鈣質以強化骨骼及牙齒","提供維生素、礦物質及膳食纖維"],"correctIndex":3,"explanation":"水果的強項在於維生素（尤其維生素 C）、鉀等礦物質，以及果肉與果皮所含的膳食纖維，同時水分含量高而能量密度低，適合作為餐後之選。其餘三項應由別的食物提供：蛋白質來自肉、魚、蛋及豆類，必需脂肪酸來自植物油及深海魚，鈣質則主要來自奶類及其代替品。設計餐單時應清楚每一項食物所擔當的角色。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_13","topic":"膳食計劃","difficulty":"basic","question":"營養標籤上的數值有些以「每 100 克」列出，有些則以「每食用分量」列出。選購同類食品時，這一點提醒消費者甚麼？","options":["必須換算至同一基準，數字才可以直接對照","只需比較包裝上印得較大的那組數字","只需比較兩件產品的售價高低","只需比較兩者配料表的長短"],"correctIndex":0,"explanation":"「每食用分量」由生產商自行界定，兩件產品的分量大小可以相差甚遠；若一件標示每 30 克含糖 6 克，另一件標示每 100 克含糖 12 克，直接比較 6 與 12 會得出完全相反的結論。正確做法是一律換算至每 100 克再比。這亦說明營養標籤要連同分量一起讀，單看數字並不足夠。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_14","topic":"食物科學","difficulty":"basic","question":"烹調新鮮蔬菜時宜「大火快炒」或「少水快煮」，主要為了保留哪一類營養素？","options":["礦物質之中的鈣質及其吸收率","水溶性維生素，例如維生素 C 及維生素 B 雜","脂肪及其所攜帶的脂溶性成分","膳食纖維及其保水的能力"],"correctIndex":1,"explanation":"水溶性維生素怕熱、怕水、怕久煮：長時間浸煮會令它們溶入水中隨湯棄去，高溫久煮則會令其分解。故此縮短加熱時間、減少用水，甚至留起煮菜水作湯底，都能減少損失。至於膳食纖維及礦物質，性質相對穩定，一般烹調不會令它們大量流失。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_15","topic":"食物科學","difficulty":"basic","question":"乳酪、豉油、麵豉等發酵食品的製作，主要依靠甚麼？","options":["加入化學防腐劑","持續的冷凍處理","特定微生物的活動","長時間的高溫消毒"],"correctIndex":2,"explanation":"發酵是由選定的細菌、酵母或霉菌分解食物中的糖或蛋白質，產生酸、酒精及各種風味物質。所產生的酸能同時抑制腐敗菌及致病菌，故發酵既造風味，亦是一種古老的保存方法。留意這與「食物變壞」的分別不在於有沒有微生物，而在於微生物是否受控、是哪一種 —— 前者是刻意接種並控制條件，後者是任由環境中的雜菌生長。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_16","topic":"食物科學","difficulty":"basic","question":"油炸食物時若油溫過低，最可能出現甚麼情況？","options":["食物外層迅速焦黑，內部仍未熟透","油會立即大量冒煙並有起火危險","食物完全不會變色，亦不會被加熱","食物吸收較多油分，成品油膩而不鬆脆"],"correctIndex":3,"explanation":"油溫足夠時，食物表面的水分會迅速汽化，形成一層向外的蒸氣，阻止油分大量滲入，同時令表層脫水變脆。油溫不足則水分蒸發緩慢，油有時間滲入食物內部，成品因而油膩。相反的問題 —— 外焦內生、油冒煙起火 —— 屬油溫【過高】的徵狀，兩者的處理方法剛好相反，不可混淆。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_17","topic":"食物科學","difficulty":"basic","question":"把蔬菜灼水後立即放入冰水中冷卻（過冷河），主要目的是甚麼？","options":["迅速停止加熱，保住顏色與爽脆的質感","讓蔬菜吸收更多水分，以增加重量","把蔬菜表面的農藥殘餘完全洗走","提高蔬菜所含的維生素的總含量"],"correctIndex":0,"explanation":"離水之後的蔬菜仍有餘熱，若任其自然冷卻，加熱其實並未停止，顏色會由翠綠轉為黃綠，質感亦會變得軟身。冰水令中心溫度迅速下降，把加熱鎖定在恰好的一刻。留意烹調過程只會令營養素減少或保持，不可能憑空增加；而農藥殘餘應在烹調【之前】以流動清水徹底沖洗處理。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_18","topic":"食物科學","difficulty":"basic","question":"食物的水分含量高，對其保存有甚麼影響？","options":["水分越高，食物內酵素的活動越慢","微生物較易生長，食物較易腐壞","水分能隔絕空氣，食物反而較耐存放","對保存沒有影響，只影響食物的口感"],"correctIndex":1,"explanation":"微生物生長需要水，而且需要的是可供利用的「自由水」。乾製、醃製及加糖之所以能保存食物，原理相同：不是把微生物殺死，而是把水分抽走或以鹽、糖把水「綁住」，令微生物無水可用。酵素活動同樣需要水，水分越高活動越快，故高水分食物的自然變質亦較迅速。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_19","topic":"食物安全","difficulty":"basic","question":"預先包裝食物上的「此日期前最佳」與「此日期前食用」兩種標示，分別在哪裡？","options":["「此日期前最佳」關乎安全，過期即有中毒風險","兩者都只是建議，過期後一律仍可安全食用","「此日期前食用」關乎食用安全，「此日期前最佳」關乎品質","兩者意思完全相同，只是不同廠商的寫法"],"correctIndex":2,"explanation":"「此日期前食用」用於容易腐壞、過期後可能危害健康的食物，例如冷藏肉類及即食沙律，過了這個日期就不應食用，即使外觀氣味正常。「此日期前最佳」則指品質最佳的期限，過期後可能風味、口感或營養有所下降，但在包裝完好及貯存得宜的前提下未必不安全。把兩者對調，是實際生活中最容易出事的一種混淆。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_20","topic":"食物安全","difficulty":"basic","question":"家用雪櫃的冷藏格（非冷凍格），溫度一般應保持在甚麼範圍？","options":["攝氏 10 度或以下","攝氏零下 18 度或以下","攝氏 15 至 20 度","攝氏 4 度或以下"],"correctIndex":3,"explanation":"細菌繁殖最快的溫度範圍大約由攝氏 4 度至 60 度，故冷藏格必須保持在攝氏 4 度或以下，把繁殖速度壓下來。留意攝氏零下 18 度是【冷凍格】的標準，兩者不可混淆：冷藏只是減慢細菌繁殖，冷凍則使其近乎停止，但兩者都不能把已有的細菌殺死。此外雪櫃不宜塞得太滿，否則冷空氣無法流通，實際溫度會高於設定。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_21","topic":"食物安全","difficulty":"basic","question":"已切開的西瓜或已開封的飲品，應該怎樣處理？","options":["加蓋或包好後立即冷藏，並在短時間內食用完","放在室溫陰涼處即可，數天之內食用完","加蓋後放回原處，可一直存放至包裝上的到期日","放入冷凍格結成冰塊，需要時解凍再食用"],"correctIndex":0,"explanation":"完整的果皮及密封的包裝本身就是屏障；一旦切開或開封，食物表面即暴露於空氣、刀具及手部的微生物之下，包裝上原印的到期日亦隨即失效 —— 那個日期是為【未開封】的狀態而定的。故此開封後應立即冷藏，並按食物種類在一至兩日內食用完，而非依賴原有標示。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_22","topic":"食物安全","difficulty":"basic","question":"以下關於清洗蔬果的說法，哪一項正確？","options":["應以熱水浸泡，因為熱水可去除所有農藥殘餘","應以流動清水徹底沖洗，必要時去皮，以減少泥土及殘餘","應以洗潔精浸洗，因為洗潔精可以分解表面的農藥","只要是有機種植的蔬果，就完全不需要清洗"],"correctIndex":1,"explanation":"流動清水的沖刷力量能帶走泥土、微生物及部分表面殘餘，必要時可用刷洗或去皮進一步減少。洗潔精並非為食用而設，本身可能殘留在蔬果表面，反而構成新的問題。有機種植只是不使用某些合成農藥，並不代表沒有泥土及環境中的微生物。至於熱水浸泡，除了未必更有效，還會令蔬菜變軟並流失水溶性維生素。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_23","topic":"食物安全","difficulty":"basic","question":"在餐廳用膳後把剩餘的食物打包帶回家，安全的做法是甚麼？","options":["直接放入雪櫃，翻熱時稍為加溫便可食用","只要外觀及氣味正常，可以不必翻熱直接食用","盡快放入雪櫃冷藏，翻熱時必須徹底熱透","放在室溫過夜待完全放涼，第二天再翻熱"],"correctIndex":2,"explanation":"食物在攝氏 4 度至 60 度之間停留越久，細菌繁殖越多，故關鍵是縮短這段時間 —— 打包後盡快冷藏，不要等到完全放涼。翻熱則須徹底熱透至中心溫度達攝氏 75 度或以上，稍為加溫只會把食物帶進最適合細菌繁殖的溫度範圍，比不加熱更危險。另須留意部分細菌所產生的毒素耐熱，翻熱亦不能消除，所以及早冷藏比事後補救重要。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_24","topic":"纖維與布料","difficulty":"basic","question":"纖維一般分為天然纖維與人造纖維兩大類。以下哪一種屬於天然纖維？","options":["尼龍","聚酯纖維","腈綸","羊毛"],"correctIndex":3,"explanation":"天然纖維直接取自動物或植物：動物性的有羊毛與蠶絲，植物性的有棉與麻。尼龍、聚酯纖維及腈綸均由石油化工原料聚合而成，屬合成纖維。另有一類「再生纖維」（如人造絲）以天然纖維素為原料經化學處理製成，來源天然而製法人造，歸入人造纖維一類 —— 這一類最容易被錯誤歸邊。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_25","topic":"纖維與布料","difficulty":"basic","question":"棉纖維取自植物的哪一部分？","options":["種子上的絨毛","植物的莖部","植物的葉部","植物的根部"],"correctIndex":0,"explanation":"棉是包裹在棉籽外的絨毛，屬種子纖維；亞麻及苧麻則取自植物莖部的韌皮，屬莖纖維。兩者的結構分別解釋了它們的手感：棉纖維中空而帶天然扭曲，故柔軟保暖；麻纖維長而直、細胞壁厚，故挺身、涼快而易皺。把「棉」與「麻」的來源對調，是本課常見的錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_26","topic":"纖維與布料","difficulty":"basic","question":"羊毛衣物若用熱水洗滌並用力搓揉，最可能出現甚麼問題？","options":["衣物明顯伸長並變得寬闊","出現氈化，衣物變厚變硬並縮小","顏色變得比原來更加鮮艷","纖維變得比原來更有彈性"],"correctIndex":1,"explanation":"羊毛纖維表面覆有一層互相重疊的鱗片，遇熱、遇水再加上機械摩擦，鱗片會互相卡緊而不能復位，纖維因而糾纏收緊，這個不可逆的過程稱為氈化。故羊毛宜用溫水或冷水、輕手手洗或用羊毛程序，並平放晾乾以免因自身重量拉長。一旦氈化，無法還原。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_27","topic":"纖維與布料","difficulty":"basic","question":"衣物洗滌標籤上的符號中，一個盆狀的圖案代表甚麼？","options":["乾洗的方式，以及可用的溶劑種類","漂白的處理，以及可用的漂白劑種類","水洗的方式，包括可否水洗及水溫上限","熨燙的方式，包括熨斗的溫度上限"],"correctIndex":2,"explanation":"洗滌標籤的五個基本符號各有形狀，記住形狀就不必逐個查：盆代表水洗，三角形代表漂白，正方形代表乾燥，熨斗代表熨燙，圓形代表專業護理即乾洗。符號上的數字表示溫度上限，符號被打上交叉則表示不可作該項處理。選購及護理衣物時先看標籤，可避免一次洗壞。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_28","topic":"服裝與時裝","difficulty":"basic","question":"服裝設計的基本元素包括線條、顏色、質感，以及以下哪一項？","options":["售價與折扣","品牌與商標","產地與工廠","形狀與輪廓"],"correctIndex":3,"explanation":"設計元素是設計師可以直接操控、並構成視覺效果的成分：線條引導視線，顏色影響情緒與視覺重量，質感決定光影與手感，形狀與輪廓則決定衣服在人體上呈現的整體外形。售價、品牌及產地屬市場及生產的範疇，會影響消費決定，卻不是構成外觀的設計元素。答設計題時把兩者分清，論述才會準確。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_29","topic":"服裝與時裝","difficulty":"basic","question":"量度身圍尺寸時，軟尺應該怎樣放置？","options":["貼身而不勒緊，並保持水平","盡量拉緊，以取得最小的數字","隔着厚身外套量度以策安全","傾斜地繞過身體以取較大數字"],"correctIndex":0,"explanation":"量度的目的是取得身體的真實尺寸，再由紙樣加上鬆份，故量度時不應人為地放大或縮小。拉得過緊會令成品過窄，隔着厚衣量度則會令成品過闊；軟尺傾斜則量得的並非該處的水平圍度。標準做法是穿着貼身內衣、身體自然站直、軟尺水平環繞，並在同一姿勢下完成全部量度。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_30","topic":"服裝與時裝","difficulty":"basic","question":"同一款式的衣服，採用直度條紋與採用橫度條紋，視覺效果有何不同？","options":["條紋方向只影響布料成本，不影響外觀","直紋使身形看來較修長，橫紋使身形看來較寬闊","直紋使身形看來較寬闊，橫紋使身形看來較修長","兩者的視覺效果完全相同，並無分別"],"correctIndex":1,"explanation":"線條會引導視線移動的方向：直線帶動視線上下走，使身形在感覺上被拉長；橫線帶動視線左右走，使身形在感覺上被加寬。這是線條作為設計元素最直接的應用，同一原理亦見於剪接線、鈕門位置及圖案的排列方向。留意條紋方向確實會影響用料 —— 橫紋衣片對條需要額外布料 —— 但那是生產考慮，並非視覺效果。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_31","topic":"服裝與時裝","difficulty":"basic","question":"試身時除了確認尺碼是否合適，還應該注意甚麼？","options":["店內的燈光是否足夠明亮","同一款式還剩下多少件存貨","活動時是否舒適，例如舉手、坐下有沒有拉扯","衣物的吊牌是否印刷精美"],"correctIndex":2,"explanation":"靜止站立時合身，不等於穿着時合用。衣服是在人體活動之下工作的：舉手時肩袖會否扯起衣身、坐下時腰圍及大腿位會否過緊、彎腰時背部會否外露，這些都要在試身室裏做一次才知道。合身度包括長度、圍度、鬆份及活動空間四方面，只看尺碼標籤上的數字並不足夠。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_32","topic":"精明消費","difficulty":"basic","question":"香港消費者委員會的其中一項主要職能是甚麼？","options":["直接向消費者退回有問題貨品的款項","代替法院裁決消費者與商戶的糾紛","為商戶制定各類貨品的統一售價","為消費者提供產品測試及比較資料"],"correctIndex":3,"explanation":"消費者委員會的工作包括產品及服務測試、發布比較報告、處理及調解投訴、進行研究並就消費政策提出意見。留意「調解」與「裁決」不同：委員會可協助雙方溝通並促成和解，但沒有司法權力強制任何一方，亦不能代商戶退款。分清哪一個機構有哪一種權力，遇到消費糾紛時才知道應該找誰。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_33","topic":"精明消費","difficulty":"basic","question":"進行網上購物時，在付款之前應先確認甚麼？","options":["商戶的退換貨安排，以及付款頁面的保安","商品相片的解像度是否足夠清晰","網站的背景顏色配搭是否美觀","該商品在社交媒體上的讚好數目"],"correctIndex":0,"explanation":"網上購物看不到實物，退換安排就是最重要的保障，應在付款前查清楚是否接受退貨、期限多久、運費由誰承擔。付款保安則要留意網址是否以加密協定連接、商戶資料是否齊全，避免在來歷不明的頁面輸入信用卡資料。至於相片、版面及讚好數目，全部可以由賣方自行製作或購買，不能作為可靠依據。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_34","topic":"精明消費","difficulty":"basic","question":"預先包裝食物的配料表上，各項配料一般按甚麼次序排列？","options":["按配料名稱的筆畫或字母次序排列","按重量由多至少排列","按加入製作過程的先後次序排列","按各項配料的價格由高至低排列"],"correctIndex":1,"explanation":"法例規定配料須按加入時的重量由多至少排列，這一點讓消費者無須看數字也能大致判斷成分比例：若「糖」排在頭三位，該產品的糖分多半不低；若「水」排第一，則產品含水量最高。留意「按加入次序」是常見誤解 —— 先加或後加與含量多少並無關係。此外複合配料須把其本身的成分一併列出，故配料表越長，加工程度往往越高。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_floor_35","topic":"精明消費","difficulty":"basic","question":"把仍可穿着的舊衣物捐贈或轉贈他人，在可持續消費上屬於哪一項做法？","options":["減少，從源頭上減少購買的數量","棄置，交由堆填區作最終處理","重用，延長物品原有的使用壽命","回收，把物料分解後再造成新產品"],"correctIndex":2,"explanation":"重用是指物品以原有形態繼續被使用，不需經過分解或再加工，因而所耗能源最少。回收則要把纖維分解重造，過程本身消耗能源及水，而混紡布料更難以分離，回收率遠低於一般想像。至於減少，是三者之中最根本的一項 —— 買得少，其後的重用與回收壓力自然減輕。三者的優先次序是先減少、再重用、後回收。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "technology-living";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  const out = { _meta: { source: "technology-living-floor.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Date().toISOString().slice(0,10) }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "technology-living-floor.decisions.json"; a.click();
});
counts();
</script></body></html>
