const DATA = [{"id":"floor3_va_fa_01","topic":"形式分析・元素與原則","difficulty":"basic","question":"在視覺藝術的形式分析中，「線條」屬於下列哪一個範疇？","options":["視覺元素 —— 構成作品的基本材料，與形狀、色彩、質感、空間並列","構圖原則 —— 組織畫面的方法，與平衡、對比、節奏並列","創作媒介 —— 藝術家所使用的物料，與油彩、水墨、金屬並列","藝術風格 —— 特定時期的表現方式，與印象派、立體派並列"],"correctIndex":0,"explanation":"形式分析把作品拆成兩層：【視覺元素】是構成作品的基本材料（線條、形狀、色彩、明暗、質感、空間），【構圖原則】則是組織這些元素的方法（平衡、比例、對比、統一、節奏、強調）。線條屬前者。分清兩層很重要：描述「畫中有粗黑的輪廓線」是指出元素，而「粗黑輪廓線把視線引向中央人物」才是指出原則如何運作 —— 評賞題要求的是後者。媒介指物料，風格指時代或流派的表現方式，兩者都不是形式分析的層次。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_fa_02","topic":"形式分析・元素與原則","difficulty":"intermediate","question":"一幅畫作左右兩邊的物件在大小、數量與位置上並不相同，但整體看來仍然穩定。這最可能運用了甚麼原則？","options":["不對稱平衡 —— 以視覺重量而非鏡像對稱取得穩定","對稱平衡 —— 中軸兩邊的元素完全相同並互相呼應","重複 —— 同一形狀規律地出現以產生秩序感","漸變 —— 元素的大小或色彩循序改變以產生深度"],"correctIndex":0,"explanation":"平衡分對稱與不對稱兩種。對稱平衡靠中軸兩邊完全相同，穩定但容易呆板；不對稱平衡則靠【視覺重量】的相抵 —— 一件大而色淡的物件，可以與另一邊一件細小但色彩鮮艷或質感強烈的物件取得平衡。題幹明言兩邊大小數量位置皆不同而整體仍然穩定，正是不對稱平衡的定義。重複與漸變都是製造秩序與動勢的原則，但它們本身並不解釋「兩邊不同卻仍穩定」這個現象。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_fa_03","topic":"形式分析・元素與原則","difficulty":"intermediate","question":"藝術家把畫面中唯一的紅色物件放在大片灰藍色調之中。這最直接運用了哪一個原則？","options":["對比與強調 —— 以色彩差異令該物件成為視覺焦點","統一 —— 令畫面各部分和諧一致而不突出任何一處","比例 —— 令各物件之間的大小關係符合真實比例","節奏 —— 令視線沿着重複的元素在畫面中移動"],"correctIndex":0,"explanation":"紅與灰藍在色相環上接近互補，並置時互相加強，令紅色物件從冷調背景中跳出來。這同時運用了【對比】（差異）與【強調】（把差異用於指定視覺焦點）—— 兩者常一併出現：對比製造差異，強調決定差異用在哪裏。統一追求的是和諧一致，與題幹描述的「唯一一件突出物件」方向相反；比例處理大小關係；節奏處理視線的移動路徑，都不是本題所描述的手法。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_fa_04","topic":"形式分析・元素與原則","difficulty":"hard","question":"一位評賞者寫道：「這幅畫令人感到孤獨。」單憑這句，在形式分析上有甚麼不足？","options":["只描述了感受，未指出是畫面中哪些視覺元素與原則造成該感受","感受並非藝術評賞的一部分，評賞應完全避免主觀反應","句子太短，評賞必須以指定的字數與段落格式書寫","未提及藝術家的姓名與創作年份，資料不完整"],"correctIndex":0,"explanation":"形式分析的核心要求是把【感受】與【證據】扣連：說「感到孤獨」只是結論，必須進一步指出畫面中甚麼造成這個感受 —— 例如大片留白令人物顯得渺小、冷色調降低溫度感、人物背向觀者切斷了交流、視平線壓低令空間顯得空曠。感受本身並非問題，主觀反應正是評賞的起點；問題在於缺少由畫面事實出發的推導。其中兩項把形式分析誤當成格式要求或資料著錄，兩者都不是它的內容。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_fa_05","topic":"形式分析・元素與原則","difficulty":"basic","question":"在色彩理論中，紅、黃、藍被稱為三原色。原因是甚麼？","options":["它們無法由其他顏色混合而成，卻可混出其他色相","它們是自然界中最常出現的三種顏色，因而最為重要","它們在色相環上互相相鄰，因而形成和諧的色彩組合","它們的明度最高，因而在畫面中最為顯眼"],"correctIndex":0,"explanation":"傳統顏料色彩理論中，三原色的定義正是「不能由其他顏色混合得出，但可以混合出其他色相」。兩兩相混得出三間色（橙、綠、紫），原色與相鄰間色再混得出複色。要留意這是【顏料】的減色系統；光的加色系統以紅、綠、藍為原色，混合後愈加愈亮，最終得白光 —— 兩套系統的原色不同，因為一套是吸收光，另一套是發出光。其餘三項與原色的定義無關：三原色在色相環上互相分隔而非相鄰，明度亦各不相同。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_fa_06","topic":"形式分析・元素與原則","difficulty":"intermediate","question":"藝術家以近處物件清晰、遠處物件模糊而偏藍的手法表現距離。這種技法稱為甚麼？","options":["空氣透視 —— 以清晰度與色彩的變化表現深度","線性透視 —— 以匯聚於消失點的線條表現深度","重疊 —— 以物件互相遮擋的關係表現前後次序","短縮法 —— 以物體沿視線方向壓縮表現伸向觀者"],"correctIndex":0,"explanation":"空氣透視（又稱大氣透視）利用大氣中的水氣與塵埃散射光線這個真實現象：距離愈遠，物件的輪廓愈模糊、對比愈低、色彩愈偏冷偏藍。它與線性透視是兩套獨立而可並用的深度手法 —— 線性透視處理【形狀與線條】的匯聚，空氣透視處理【清晰度與色彩】的變化。重疊是最簡單的深度線索，只交代前後次序而不交代距離遠近；短縮法處理單一物體沿視線方向的壓縮。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_fa_07","topic":"形式分析・元素與原則","difficulty":"hard","question":"一件裝置藝術要求觀眾走進作品之內。這最直接改變了作品與觀眾之間的哪一種關係？","options":["由觀者在作品之外觀看，變為觀者身處作品之內並成為作品的一部分","由作品有固定形狀，變為作品完全沒有實體而只存在於概念之中","由作品由藝術家創作，變為作品完全由觀眾創作而藝術家不參與","由作品可以買賣收藏，變為作品在法律上不再屬於任何人所有"],"correctIndex":0,"explanation":"裝置藝術的核心特徵是佔據並改造一個【空間】，觀眾必須進入該空間，於是觀看的位置由外部轉為內部：觀眾的身體、移動路線甚至其他觀眾的存在，都成為作品經驗的一部分。這與傳統繪畫與雕塑「觀者在作品之外」的關係根本不同。其餘三項各自過度推論：裝置仍有實體，只是形態不限於畫框或基座；藝術家仍然決定整體構思與條件，觀眾的參與是在其設定之內；至於買賣與擁有權，裝置一樣可以被收藏，只是收藏的往往是說明書與再現的權利。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_fa_08","topic":"形式分析・元素與原則","difficulty":"intermediate","question":"在一幅人像作品中，人物佔據畫面約九成而背景幾乎不可見。這個構圖選擇最可能產生甚麼效果？","options":["觀者被迫近距離面對人物，親密感與壓迫感同時增強","觀者可以清楚了解人物身處的環境與社會身份","觀者的視線被引導向畫面深處，空間顯得遼闊","觀者難以辨認人物的表情，作品傾向抽象"],"correctIndex":0,"explanation":"構圖的取景距離直接決定觀者與被畫者的心理距離。人物佔滿畫面等同於把觀者推到極近的位置，面孔的細節無所遁形，親密與壓迫兩種感受同時產生 —— 這正是不少現代肖像刻意採用的策略。有一項方向相反：背景幾乎不可見，正正剝奪了交代環境與身份的線索；另一項與滿框構圖矛盾，深遠空間需要留出背景；還有一項不成立，人物放大反而令表情更清晰，抽象與否取決於描繪方式而非取景距離。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_hc_01","topic":"藝術史・技法與風格","difficulty":"basic","question":"印象派畫家常在戶外直接寫生，並以細碎筆觸捕捉光線變化。促成這種轉變的其中一項技術條件是甚麼？","options":["錫管顏料的發明令顏料便於攜帶且不易乾涸","照相機的發明令畫家不再需要學習素描基礎","油彩的發明令畫家首次可以描繪細緻的光影","畫布的發明令畫家不再需要在牆壁上作畫"],"correctIndex":0,"explanation":"十九世紀中葉錫管顏料面世之前，畫家須自行研磨顏料並以豬膀胱盛載，難以攜帶且極易乾涸，戶外寫生因而幾乎不可行。錫管令顏料可以隨身攜帶、隨時開合，加上便攜畫架與鐵路網絡的擴展，畫家才能到郊外反覆觀察同一景物在不同時刻的光色變化。有一項倒果為因：照相的普及確實促使繪畫尋找攝影做不到的方向，但並不代表素描不再重要。其中兩項的年代嚴重錯置 —— 油彩與畫布早在文藝復興時期已廣泛使用，並非十九世紀的新事物。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_hc_02","topic":"藝術史・技法與風格","difficulty":"intermediate","question":"立體派作品常在同一畫面上同時呈現物件的多個角度。這種做法挑戰了甚麼傳統？","options":["文藝復興以來以單一固定視點為基礎的線性透視","以顏料的物質性作為作品主題的傳統","以宗教題材作為繪畫唯一合法內容的傳統","以雕塑而非繪畫作為最高藝術形式的傳統"],"correctIndex":0,"explanation":"線性透視自文藝復興確立以來，預設了一個固定的觀看位置：整幅畫的所有形狀都按同一視點推導。立體派把物件拆解再重組，讓正面、側面、俯視同時出現在一個平面上，等於宣告畫面不必再模擬「一隻眼睛在一個時刻所見」，而可以呈現對物件的整體認知。這是對五百年來繪畫空間慣例的根本質疑。其餘三項與立體派的核心關注並不對應：顏料物質性是抽象表現主義的關注，宗教題材的壟斷早在立體派之前數百年已鬆動，繪畫與雕塑的高下之爭亦非其議題。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_hc_03","topic":"藝術史・技法與風格","difficulty":"intermediate","question":"中國水墨畫講求「留白」。留白在畫面上的作用是甚麼？","options":["未着墨處本身參與構圖，可讀為雲霧、水面或空間，並予人想像餘地","未着墨處純粹是尚未完成的部分，畫家因時間不足而留下","未着墨處用以標示作品的邊界，功能相當於畫框","未着墨處是為題字與鈐印預留的位置，並無構圖意義"],"correctIndex":0,"explanation":"在中國水墨的視覺觀念中，紙的空白並非「沒有畫」，而是畫面的積極組成部分：它可以被讀成雲霧、水面、天空或無限的空間，並與墨色形成虛實相生的關係。畫少而意多，觀者的想像正是在這些空白處展開，這與西方傳統中傾向填滿畫面的取向構成鮮明對比。有一項把美學選擇誤讀為未完成；另一項把留白誤當成邊框；還有一項雖然觸及題款鈐印這個真實慣例，但把留白的作用窄化為「預留位置」，忽略了它本身的構圖與意境功能。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor3_va_hc_04","topic":"藝術史・技法與風格","difficulty":"hard","question":"評賞一件當代藝術作品時，只描述其視覺元素而不提及創作脈絡，可能有甚麼問題？","options":["當代作品的意義往往依賴其提問的社會議題與藝術史脈絡，只談形式會錯失核心","當代作品完全沒有可供分析的視覺元素，形式分析在原則上並不適用","形式分析只適用於古代作品，當代作品必須改用完全不同的評賞方法","描述視覺元素本身屬於主觀判斷，因此不能用於任何時期的作品評賞"],"correctIndex":0,"explanation":"當代藝術經常以【提問】而非【技巧展示】為核心：一件現成物、一段錄像或一場行為，其意義大量來自它針對甚麼議題、回應藝術史上哪一個主張、在甚麼場域展出。若只描述「這是一個白色方形物件」，等於錯過作品真正在說甚麼。要留意這不代表形式分析失效 —— 形式仍然是意義的載體，恰當的做法是【形式與脈絡並用】。其餘三項都把這一點推得過頭：當代作品當然有視覺元素，形式分析亦非古代專用，而描述視覺元素是可查證的觀察而非主觀判斷。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

function timing(){

  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);

  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),

    fastestSeconds: Math.round(gaps[0]*10)/10,

}
