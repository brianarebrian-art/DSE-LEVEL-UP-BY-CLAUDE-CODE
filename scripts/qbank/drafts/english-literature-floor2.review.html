<script>
const DATA = [{"id":"floor6_elit_ti_01","topic":"Theme & irony","difficulty":"basic","question":"某角色宣稱「我絕不會出賣朋友」，隨即做出相反的事。這屬於哪一種反諷？","options":["Dramatic irony — the audience grasps a truth the speaker does not","Verbal irony — the speaker says the opposite of what they mean","Situational irony — an outcome reverses what everyone expected","No irony at all — the character has simply changed their mind"],"correctIndex":0,"explanation":"戲劇性反諷源於觀眾與角色之間的【認知落差】：觀眾看得見即將發生的事，說話者卻看不見，同一句話因而帶有說話者自己並未察覺的第二層意思。言語反諷要求角色在說話當下就有意表達相反的意思，而此處的宣告看來出於真誠；情境反諷處理的是事件結果的逆轉而非認知落差；至於「改變主意」則須有重新考慮的過程，但背叛緊接發生。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor6_elit_ti_02","topic":"Theme & irony","difficulty":"intermediate","question":"文學作品的「主題」與「情節」有何分別？","options":["Plot is what happens; theme is the idea about life the events explore","Plot is the idea explored; theme is the sequence of events narrated","Plot belongs to novels and theme to poems, each to its own genre","They are two names for the same thing used in different traditions"],"correctIndex":0,"explanation":"情節回答的是【發生了甚麼】—— 事件的次序與因果關係。主題回答的是【在講一個關於甚麼的想法】：野心的代價、信任的脆弱、責任與慾望之間的拉扯。一部作品可以承載多個主題，而主題須以命題形式表述而非一個詞語：「愛情」是題目，「愛情無法在隱瞞之中存活」才是主題。這個分別在考試中至為關鍵，因為以複述情節代替指出主題，正是最常見的失分方式。其中兩項分別把兩個概念綁定於文類或視為同義詞，兩者皆不成立。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor6_elit_ti_03","topic":"Theme & irony","difficulty":"intermediate","question":"一部小說以「救援船在主角放棄希望之後一小時抵達」作結。這個結局最可能達到甚麼效果？","options":["Situational irony that sharpens the theme of how narrowly outcomes turn","Verbal irony, since the narrator says the opposite of what is meant","Dramatic irony, since the reader knew the ship's position throughout","Comic relief, since the arrival resolves the tension happily"],"correctIndex":0,"explanation":"預期與實際之間的逆轉屬【情境】反諷，而把它安排在放棄之後一小時，正是力量所在：這個差距小得近乎偶然，結局因而把「結果往往取決於無人能控制的毫釐之差」這個想法推到讀者面前。言語反諷要求說話者言此意彼，此處並無；戲劇性反諷要求讀者一直知道船的位置，題幹並未如此交代；至於喜劇性緩和，要求緊張被化為輕鬆，而這個結局是把它加深而非化解。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor6_elit_ti_04","topic":"Theme & irony","difficulty":"hard","question":"學生寫道：「這部小說的主題是死亡。」這樣表述主題有何不足？","options":["It names a topic rather than a claim, so it says nothing the work argues","Death is too common a subject to serve as a theme in any work","A theme must always be positive, and death cannot be one","A theme must be stated in a single word, so the sentence is too long"],"correctIndex":0,"explanation":"主題是作品就其題目所提出的【一個主張】，而非題目本身。「死亡」說明了小說關乎甚麼；主題則要說出小說對此提出了甚麼 —— 例如死亡揭示一個人生前究竟以甚麼為重心，或悲傷比親情更能把人繫在一起。表述為主張之後，主題才可以放回文本檢驗：哪些場景支持它、哪些使它複雜化。有一項把常見誤當成不適用；另一項憑空加了一條並不存在的規則，事實上大量主題都是沉重的；還有一項把要求說反了，一個詞語正正是問題所在。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor6_elit_de_01","topic":"Device & effect","difficulty":"basic","question":"一首詩把悲傷寫成「肋骨後面卡着的一塊石」。這是甚麼手法，效果何在？","options":["Metaphor — it gives an abstract feeling weight, place and presence","Simile — it compares two unlike things using the word \"like\" or \"as\"","Personification — it gives human qualities to an inanimate object or idea","Alliteration — it repeats initial consonant sounds for a musical effect"],"correctIndex":0,"explanation":"詩句說悲傷【就是】一塊石而非「像」一塊石，故屬暗喻。效果在於把一個抽象概念移入身體：石有重量、有固定位置、堅硬，悲傷因而同時獲得三者，由一個名詞變成讀者感覺得到的東西。「肋骨後面」再加一重準確 —— 那正是呼吸與心跳所在，於是這感覺持續而無從迴避。明喻須有「像」或「如」；擬人是把人的特質賦予物，方向相反；押頭韻處理的是聲音重複，這句並非以此為重心。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor6_elit_de_02","topic":"Device & effect","difficulty":"intermediate","question":"一篇短篇小說全由一個後來被發現誤解了事件的敘述者講述。這個選擇的主要效果是甚麼？","options":["It forces the reader to reread and judge, since the account is flawed","It makes the plot far clearer, since a single voice removes all confusion","It proves the narrator is lying deliberately in order to deceive the reader","It shows the author lacked the skill to construct a reliable account of events"],"correctIndex":0,"explanation":"不可靠敘述者把工作交回讀者手上：一旦知道敘述有偏差，先前每一項細節都要重新掂量 —— 看它在敘述者【之外】透露了甚麼，而非透過敘述者告訴我們甚麼。效果不是混亂而是主動判斷，而「所述」與「所發生」之間的落差往往正是作品的意義所在：自我欺瞞、認知有限、了解他人之難。要留意不可靠不等於說謊：敘述者可以真誠而只是弄錯了、年紀太小，或身在其中而看不清。有一項把效果說反；另一項假定了有意欺騙；還有一項把有意為之的技法誤讀為能力不足。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor6_elit_de_03","topic":"Device & effect","difficulty":"intermediate","question":"一齣戲在三個不同場景重複出現「一道關上的門」這個意象。最可能的用意是甚麼？","options":["To build a motif whose accumulated meaning comments on the action","To economise on staging by reusing the same piece of scenery","To signal to the audience that each scene has ended","To fill time between scenes without advancing the plot"],"correctIndex":0,"explanation":"重複出現的意象會成為【母題】：每一次出現都承接前一次所積累的意義，因此到第三次時，那道門已不只是一道門 —— 它可以是拒之門外、是被拒絕的一個決定、是被封死的一段人生。劇作家用的是累積，意義屬於整個模式而非任何單一次出現。答好這類題的方法是追蹤每次出現之間的變化：誰在哪一邊、門有沒有打開、是誰選擇關上。其餘三項把一個結構性手法降格為實務、程序或填充時間的安排，都無法解釋為何偏偏是這個意象反覆出現。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "english-literature";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
// ── 審核用時自動記錄 ──────────────────────────────────────────────────────
// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "english-literature-floor2.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "english-literature-floor2.decisions.json"; a.click();
});
counts();
</script></body></html>
