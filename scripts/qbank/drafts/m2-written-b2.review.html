const DATA = [{"id":"m2_w2_01","topic":"微分法","difficulty":"basic","question":"設 y = ln(3x² + 1)。\n(a) 求 dy/dx。\n(b) 求曲線在 x = 1 處的切線方程。","explanation":"(a) 須用鏈式法則：ln u 的導數為 (1/u)·(du/dx)。最常見的錯誤是只寫 1/(3x² + 1) 而漏了乘內函數的導數 6x。\n(b) 求切線方程須要三樣東西：切點的 x 坐標（題目已給）、切點的 y 坐標（代入原函數，不是代入導函數）、以及斜率（代入導函數）。有考生把 dy/dx 在 x = 1 的值誤當成 y 坐標，此錯誤源於未分辨「函數值」與「導數值」。\n代入前先化簡：3(1)² + 1 = 4，故 y = ln 4，斜率 = 6/4 = 3/2。","type":"text","referenceAnswer":"(a) 設 u = 3x² + 1，則 y = ln u。\ndy/dx = (1/u)·(du/dx) = (1/(3x² + 1))·(6x) = 6x / (3x² + 1)\n\n(b) 當 x = 1：\n切點的 y 坐標：y = ln(3(1)² + 1) = ln 4\n斜率：dy/dx = 6(1) / (3(1)² + 1) = 6/4 = 3/2\n\n切線方程（點斜式）：\ny − ln 4 = (3/2)(x − 1)\n即 y = (3/2)x − 3/2 + ln 4\n（亦可寫成 3x − 2y + 2ln 4 − 3 = 0。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m2_w2_02","topic":"向量","difficulty":"intermediate","question":"設 a = 3i + 4j，b = i − 2j。\n(a) 求 |a| 及 |b|。\n(b) 求 a · b，並求 a 與 b 的夾角（準確至 0.1°）。\n(c) 求 b 在 a 方向上的投影長度。\n(d) 有學生答「a · b 為負數，所以兩向量互相垂直」。請指出錯誤並說明點積的正負代表甚麼。","explanation":"(d) 是本題的判別點。點積為【零】才代表垂直；點積為負代表夾角為鈍角（大於 90°），為正則代表銳角。把「負」與「零」混淆，是把符號與大小兩件事混為一談。\n(c) 的投影長度須留意符號：b 在 a 方向上的投影為 (a · b)/|a|，此處為負值，代表投影的方向與 a 相反。題目問「長度」，故取絕對值 1；但若題目問「投影」（帶符號的純量投影），則應保留 −1。作答時宜同時指出方向，以免因題意詮釋不同而失分。","type":"long","referenceAnswer":"(a) |a| = √(3² + 4²) = √25 = 5\n|b| = √(1² + (−2)²) = √5 ≈ 2.236\n\n(b) a · b = (3)(1) + (4)(−2) = 3 − 8 = −5\n\ncos θ = (a · b) / (|a||b|) = −5 / (5 × √5) = −5 / (5√5) = −1/√5 ≈ −0.4472\nθ = 116.6°（準確至 0.1°）\n\n(c) b 在 a 方向上的純量投影 = (a · b) / |a| = −5 / 5 = −1\n投影長度 = |−1| = 1\n（負號表示投影的方向與 a 相反，即 b 有一個分量指向 a 的反方向。）\n\n(d) 說法錯誤。兩向量互相垂直的條件是點積【等於零】，而非點積為負。\n點積的正負意義如下：\na · b > 0：夾角為銳角（0° ≤ θ \u003c 90°）\na · b = 0：兩向量互相垂直（θ = 90°）\na · b \u003c 0：夾角為鈍角（90° \u003c θ ≤ 180°）\n本題 a · b = −5 \u003c 0，故夾角為鈍角，與 (b) 所得的 116.6° 一致，並非垂直。","markingScheme":"(a) 2 分 —— |a| = 5（1）；|b| = √5（1）。\n(b) 3 分 —— a · b = −5（1）；正確代入 cos θ 公式（1）；116.6°（1）。\n(c) 1 分 —— 投影長度 1（指出負號代表方向相反亦可）。\n(d) 2 分 —— 指出垂直的條件是點積等於零（1）；列出正／零／負分別對應銳角／垂直／鈍角，並回扣本題為鈍角（1）。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":13,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m2_w2_03","topic":"線性方程組","difficulty":"intermediate","question":"考慮方程組：\nx + 2y − z = 3\n2x + 3y + z = 5\n3x + 5y + kz = 8\n(a) 當 k = 0 時，求方程組的解。\n(b) 求 k 的值，使方程組有無限多組解。\n(c) 當 k 取 (b) 所求的值時，寫出解的一般形式。\n(d) 說明「無限多組解」與「無解」在幾何上的分別。","explanation":"(b) 的關鍵觀察是第三條方程等於首兩條之和：(1) + (2) 得 3x + 5y + 0·z = 8。故當 k = 0 時第三條方程與前兩條線性相關，並不提供新資訊，方程組退化為兩條方程三個未知數，因而有無限多組解。\n此觀察亦解釋了 (a) 的陷阱：題目在 (a) 已指定 k = 0，而該情況正正就是 (b) 的答案 —— 若在 (a) 得出唯一解，即代表運算出錯。這種「前後互相檢驗」的結構在歷屆常見，作答時應留意 (a) 的結果是否與 (b) 相容。\n(d) 須落到平面的相對位置：無限多組解對應三個平面相交於一條直線（或重合）；無解對應三個平面沒有公共點，例如兩兩相交而形成三稜柱狀，或有兩個平面平行。","type":"long","referenceAnswer":"(a) 當 k = 0，方程組為：\n(1) x + 2y − z = 3\n(2) 2x + 3y + z = 5\n(3) 3x + 5y = 8\n\n觀察：(1) + (2) 得 3x + 5y = 8，與 (3) 完全相同。\n故 (3) 並不提供新資訊，方程組實際只有兩條獨立方程、三個未知數，有無限多組解。\n\n(b) k = 0。\n理由：(1) + (2) 得 3x + 5y + 0·z = 8。若第三條方程為此式的倍數（此處為一倍），則第三條方程線性相關，不提供新資訊。比較係數：x 項 3 對 3、y 項 5 對 5、常數項 8 對 8 皆吻合，故只需 z 項的係數 k = 0。\n\n(c) 令 z = t（t 為任意實數）。\n由 (1)：x + 2y = 3 + t\n由 (2)：2x + 3y = 5 − t\n\n以 2 × (1) − (2)：\n2(x + 2y) − (2x + 3y) = 2(3 + t) − (5 − t)\ny = 6 + 2t − 5 + t = 1 + 3t\n\n代回 (1)：x + 2(1 + 3t) = 3 + t\nx = 3 + t − 2 − 6t = 1 − 5t\n\n一般解為：\nx = 1 − 5t，y = 1 + 3t，z = t，其中 t 為任意實數。\n\n(d) 幾何意義：\n每一條三元一次方程代表三維空間中的一個平面。\n無限多組解：三個平面有無限多個公共點，即三平面相交於同一條直線（或其中有平面重合）。解集在幾何上是一條直線（或一個平面）。\n無解：三個平面沒有任何公共點。常見情形有二 —— 其一是有兩個平面互相平行而不重合；其二是三個平面兩兩相交，但三條交線互相平行而不重合，圍成一個三稜柱狀，故無公共點。\n關鍵分別在於：前者的公共部分非空且為無限集，後者的公共部分為空集。","markingScheme":"(a) 2 分 —— 察覺 (1) + (2) 等於 (3)（1）；判斷有無限多組解（1）。答出唯一解者本部分不得分。\n(b) 2 分 —— 由 (1) + (2) 得 3x + 5y + 0·z = 8（1）；k = 0（1）。\n(c) 2 分 —— 設參數並解得 y = 1 + 3t（1）；x = 1 − 5t 且三式齊全（1）。\n(d) 2 分 —— 無限多組解對應三平面交於一直線（或重合）（1）；無解對應三平面無公共點，並舉出至少一種情形（1）。只寫「一個有解一個冇解」不得分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":14,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m2_w2_04","topic":"三維向量","difficulty":"intermediate","question":"設 A(1, 0, 2)、B(3, 2, 1)、C(2, −1, 4) 為空間中三點。\n(a) 求向量 AB 與 AC。\n(b) 求 AB × AC（叉積）。\n(c) 求三角形 ABC 的面積。","explanation":"(a) 的方向不可弄錯：AB = B 的位置向量減 A 的位置向量，即「終點減起點」。寫成 A − B 會令 (b)(c) 的符號全錯，雖然 (c) 因取模長而數值仍對，但 (b) 的答案會整體反號。\n(c) 最常見的失分是漏了二分之一。叉積的模長等於以兩向量為鄰邊的【平行四邊形】面積，而三角形只佔其一半。此步在歷屆反覆出現，且往往出現在 (a)(b) 全對的答卷上 —— 建議在計算前先寫下「三角形面積 = ½|AB × AC|」這一行，把二分之一固定在算式之內，而非留待最後才補。","type":"text","referenceAnswer":"(a) AB = (3 − 1, 2 − 0, 1 − 2) = (2, 2, −1)\nAC = (2 − 1, −1 − 0, 4 − 2) = (1, −1, 2)\n\n(b) AB × AC = |i　j　k ; 2　2　−1 ; 1　−1　2|\ni 分量：(2)(2) − (−1)(−1) = 4 − 1 = 3\nj 分量：−[(2)(2) − (−1)(1)] = −[4 + 1] = −5\nk 分量：(2)(−1) − (2)(1) = −2 − 2 = −4\n\n故 AB × AC = 3i − 5j − 4k = (3, −5, −4)\n\n(c) |AB × AC| = √(3² + (−5)² + (−4)²) = √(9 + 25 + 16) = √50 = 5√2\n\n三角形 ABC 的面積 = ½ |AB × AC| = ½ × 5√2 = (5√2)/2 ≈ 3.54 平方單位。\n（須注意叉積的模長為平行四邊形的面積，三角形只佔一半。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m2_w2_05","topic":"微積分應用","difficulty":"hard","question":"一個無蓋長方體容器的底為正方形，容積固定為 32 000 cm³。設底邊長為 x cm，高為 h cm。\n(a) 以 x 表示 h。\n(b) 以 x 表示所需鐵皮的總面積 S。\n(c) 求令 S 最小的 x 值，並求最小面積。\n(d) 說明如何驗證所求的確為最小值而非最大值，並解釋為何本題不必檢查 x 的端點。","explanation":"(b) 是本題最高頻的失分位：容器【無蓋】，故總面積為一個底面加四個側面，即 x² + 4xh，而非 2x² + 4xh。有考生機械地套用長方體表面積公式而多算了頂面，其後所有步驟即使完全正確，答案亦必然錯誤。作答時應先在草稿畫出展開圖，數清面數。\n(d) 的兩問各有重點。驗證極小可用二階導數：S″ = 2 + 256 000/x³，對所有 x > 0 皆為正，故該駐點為極小值。至於端點，本題的定義域為開區間 x > 0：當 x → 0⁺ 時 S → ∞（側面極高），當 x → ∞ 時 S → ∞（底面極大），兩端皆發散而無極值，故唯一的駐點必為全域最小值。此一論證比單純寫「因為 S″ > 0」更完整，亦是題目特別要求說明的原因。","type":"long","referenceAnswer":"(a) 容積 V = x²h = 32 000\n故 h = 32 000 / x²\n\n(b) 容器無蓋，故所需鐵皮包括一個正方形底面及四個長方形側面：\nS = x² + 4xh\n代入 h：\nS = x² + 4x(32 000 / x²) = x² + 128 000 / x\n（x > 0）\n\n(c) dS/dx = 2x − 128 000 / x²\n令 dS/dx = 0：\n2x − 128 000 / x² = 0\n2x³ = 128 000\nx³ = 64 000\nx = 40\n\n代入求最小面積：\nS = 40² + 128 000 / 40 = 1 600 + 3 200 = 4 800\n最小面積為 4 800 cm²（此時 h = 32 000 / 1 600 = 20 cm）。\n\n(d) 驗證為極小值：\nS″ = d²S/dx² = 2 + 256 000 / x³\n當 x = 40 時，S″ = 2 + 256 000 / 64 000 = 2 + 4 = 6 > 0。\n二階導數為正，故該駐點為極小值。\n（事實上 S″ = 2 + 256 000/x³ 對所有 x > 0 皆為正。）\n\n不必檢查端點的理由：\n本題的定義域為開區間 x > 0，並無端點可供代入。而在兩端的極限行為為：\n當 x → 0⁺ 時，128 000/x → ∞，故 S → ∞；\n當 x → ∞ 時，x² → ∞，故 S → ∞。\n兩端皆發散至無窮大，並不存在極值。故在 x > 0 之內只有一個駐點，而該駐點為極小值，它必然同時是全域最小值。","markingScheme":"(a) 1 分 —— h = 32 000 / x²。\n(b) 2 分 —— 辨認無蓋，面積為 x² + 4xh（1）；化簡為 x² + 128 000/x（1）。用 2x² + 4xh 者本部分不得分，其後各部分按錯誤結果從寬給分。\n(c) 3 分 —— 正確求導 2x − 128 000/x²（1）；x = 40（1）；4 800 cm² 連單位（1）。\n(d) 3 分 —— 求 S″ 並指出於 x = 40 時為正（1）；說明定義域為開區間 x > 0、無端點（1）；以兩端極限皆發散至無窮，論證唯一駐點即全域最小值（1）。只寫「因為 S″ > 0」最多得 1 分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":15,"trapTypes":null,"dnaTag":null,"mother":null}];

function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "m2-written-b2.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "m2-written-b2.decisions.json"; a.click();
});
counts();
</script></body></html>
