const DATA = [{"id":"clit_floor_01","topic":"先秦兩漢文學","difficulty":"basic","question":"「昔我往矣，楊柳依依；今我來思，雨雪霏霏。」（《詩經・小雅・采薇》）　這四句在時間上作了怎樣的安排？","options":["以「昔」與「今」對舉，把出征時與歸來時兩個時刻互相映照","順序描寫同一日之內由早到晚的景物變化","依次描寫春、夏、秋、冬四季的不同景色","先寫將要發生的事，再回頭補敘從前的事"],"correctIndex":0,"explanation":"「昔」與「今」把兩個相隔多年的時刻並排放在一起：去時楊柳輕柔，歸來時雨雪紛飛，同一個人前後的處境由景物自行說明，全篇不着一「苦」字。這正是《詩經》最常用的手法之一 —— 以景物的對照承載時間與心情的變化。讀這類句子時先找出時間標記（昔、今、初、既），對照的結構便會浮現。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_02","topic":"先秦兩漢文學","difficulty":"basic","question":"《楚辭》與《詩經》在語言形式上有一項明顯分別。這項分別是甚麼？","options":["兩者形式完全相同，只是內容不同","《楚辭》句式參差，多用「兮」字；《詩經》以四言為主","《楚辭》全用四言，《詩經》全用七言","《楚辭》不押韻，《詩經》嚴格押韻"],"correctIndex":1,"explanation":"《詩經》以四言為基本句式，節奏整齊；《楚辭》句式長短不一，並大量使用語助詞「兮」，讀來迴環往復。這種形式上的鬆動，正配合楚辭鋪陳想像、抒發個人情志的需要 —— 形式與內容互相配合，是賞析時應該連起來看的一點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_03","topic":"先秦兩漢文學","difficulty":"basic","question":"「學而不思則罔，思而不學則殆。」（《論語》）　這兩句在句式上有甚麼特點？","options":["前後兩句意思完全相同，屬於重複強調","前一句描寫景物，後一句抒發個人情感","前後兩句結構相同而意思相對，屬於對舉","前一句提出疑問，後一句隨即作出解答"],"correctIndex":2,"explanation":"兩句字數相同、結構相同，只把「學」與「思」的位置對調，意思便由一面轉到另一面，合起來說明兩者缺一不可。這種對舉句式在先秦諸子散文中極為常見，好處是易記而意思完整。留意對舉並非重複：若兩句意思相同，就只是同義反覆，沒有推進；正因為它們相反相成，才構成一個完整的主張。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_04","topic":"先秦兩漢文學","difficulty":"basic","question":"先秦諸子散文之中，《莊子》的行文特色最突出的一點是甚麼？","options":["全篇以嚴格的邏輯推論展開","以整齊對偶的駢句為主","通篇引用歷代帝王的言論","大量運用寓言故事說理，想像奇特"],"correctIndex":3,"explanation":"《莊子》說理極少直陳，多先講一個故事 —— 鯤鵬、庖丁、蝴蝶 —— 讓道理從故事中自然浮現。這種手法既避免了說教，又留下想像空間。答此類題目時宜同時指出手法與效果：寓言不只是修辭，它決定了讀者接受道理的方式。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_05","topic":"先秦兩漢文學","difficulty":"basic","question":"漢賦在寫作上的一項普遍特徵是甚麼？","options":["鋪陳排比，極力描寫事物的繁盛","篇幅短小，語言樸素含蓄","以敘述人物生平為主要內容","句句押韻且限定五言"],"correctIndex":0,"explanation":"賦體重在「鋪采摛文」：把宮室、田獵、都邑的景象逐項鋪開，堆疊辭藻以顯氣勢。這種寫法適合表現盛世的宏大，但亦容易流於堆砌 —— 後世對漢賦的批評多在於此。理解一種文體的長處與其代價，往往是同一件事的兩面。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_06","topic":"唐詩","difficulty":"basic","question":"近體詩之中，「律詩」的基本篇幅是多少句？","options":["句數不限","八句","四句","十二句"],"correctIndex":1,"explanation":"律詩為八句，每兩句一聯，依次為首聯、頷聯、頸聯、尾聯，其中頷聯與頸聯須對仗；絕句則為四句。分清律詩與絕句的句數與對仗要求，是讀唐詩的基本功 —— 因為對仗的位置直接影響全詩的結構與節奏。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_07","topic":"唐詩","difficulty":"basic","question":"王維的山水詩常被評為「詩中有畫」。這個評語主要指他的作品具備甚麼特點？","options":["句式參差，接近散文","以敘述完整故事為主","善以簡潔的意象構成清晰畫面，重視色彩與空間","大量使用典故與議論"],"correctIndex":2,"explanation":"王維寫景往往只用幾個意象，卻能定出畫面的位置與層次 —— 遠近、明暗、動靜安排分明，讀者幾乎可以按句「看見」。答這類題目時，宜舉出具體詩句說明畫面如何構成，只覆述「詩中有畫」四字並不算賞析。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_08","topic":"唐詩","difficulty":"basic","question":"「國破山河在，城春草木深。」（杜甫《春望》）　「國破」與「山河在」並列，造成甚麼效果？","options":["說明山河亦已一同毀壞，與國家同歸於盡","表示國家雖然殘破，但國力其實仍然強盛","描寫春日景色格外優美，詩人心情因而愉快","山河依舊而國事已非，以不變者襯出變者，倍見悲涼"],"correctIndex":3,"explanation":"一句之內放了兩件相反的事：人事已經破碎，山河卻仍然在那裏。正因為山河不變，人事的變才顯得刺目 —— 這是以不變襯變。下句同理：城裏春天照舊來到，草木照舊生長，可是「深」字暗示無人打理，繁茂反而見出荒涼。讀杜甫這類句子，要留意景語背後往往藏着一個沒有說出口的對照。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_09","topic":"唐詩","difficulty":"basic","question":"「白髮三千丈，緣愁似個長。」（李白《秋浦歌》）　「三千丈」一語運用了甚麼手法？","options":["誇張，以極端的長度形容愁緒之深","白描，如實記錄頭髮生長的實際長度","用典，借用古人的故事來寄託情志","對偶，上下兩句字數相同而詞性相對"],"correctIndex":0,"explanation":"沒有人的白髮有三千丈，讀者一望而知這不是實寫；正因為明知不實，才逼人去問：甚麼樣的愁才配得上這個長度。誇張的作用不在於數字本身，而在於它逼出的那個問題。留意下句「緣愁似個長」已把答案交代：長的其實是愁，白髮只是愁的量度。誇張與失實的分別，正在於讀者一開始就知道它不是事實。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_10","topic":"唐詩","difficulty":"basic","question":"唐詩中的「意象」一詞，指的是甚麼？","options":["詩人生平的經歷","滲透了作者情感的具體物象","詩歌的整體篇章結構","詩句所用的平仄格式"],"correctIndex":1,"explanation":"意象由兩部分構成：可見的「象」（明月、孤舟、落葉）與附着其上的「意」（思鄉、漂泊、遲暮）。同一物象在不同語境可承載不同情感，故賞析時不可脫離全篇孤立解讀 —— 這正是意象與單純景物描寫的分別。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_11","topic":"宋詞","difficulty":"basic","question":"「莫聽穿林打葉聲，何妨吟嘯且徐行。」（蘇軾《定風波》）　這兩句寫出詞人面對風雨時怎樣的態度？","options":["責怪同行的人事先沒有帶備雨具，心中不忿","因為突然遇上風雨，決定折返原來的地方","不為外來的干擾所動，從容自若地繼續前行","急於尋找可以避雨的地方，情緒相當緊張"],"correctIndex":2,"explanation":"「莫聽」是不去理會，「何妨」是不妨如此，兩個詞都不是硬撐，而是把風雨放到一邊。加上「徐行」二字 —— 不是加快腳步，也不是站住不動，而是照原來的步調走下去，態度便完全寫出來了。賞析這類句子要留意動詞與副詞：態度往往就藏在「徐」、「莫」、「何妨」這幾個字的分寸之間。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_12","topic":"宋詞","difficulty":"basic","question":"「兩情若是久長時，又豈在朝朝暮暮。」（秦觀《鵲橋仙》）　這兩句對「相聚」抱持怎樣的看法？","options":["必須朝夕相處，感情才有可能維持下去","感情能否長久純屬命定，人力無法左右","一旦分離，感情必然隨時日而消失","感情能否長久才是關鍵，是否朝夕相對並非最重要"],"correctIndex":3,"explanation":"全詞寫牛郎織女一年一會，末二句卻不嘆其短，反而翻轉一層：若感情本身經得起時間，一年一會亦不減其重；若經不起，日日相對亦是徒然。這種在結尾處推翻一般想法的寫法，正是此詞歷來為人傳誦的原因。答賞析題時要指出的不只是「表達真摯感情」，而是它把價值由「相處的時間」移到「感情的質地」之上。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_13","topic":"宋詞","difficulty":"basic","question":"李清照《聲聲慢》開首連用十四個疊字。這種寫法最直接的效果是甚麼？","options":["以聲音的重複，摹寫尋覓不得而心緒不定的狀態","顯示作者詞彙豐富","使全詞符合詞牌的字數要求","點明作品的創作年代"],"correctIndex":0,"explanation":"「尋尋覓覓，冷冷清清，淒淒慘慘戚戚」十四字，由動作而環境而心情，層層向內收。疊字造成的遲滯節奏，本身就是那份茫然的聲音形式 —— 讀出來的感覺，就是內容的一部分。賞析疊字時，宜同時說明它造成的節奏與所寫的心境如何吻合。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_14","topic":"宋詞","difficulty":"basic","question":"詞在形式上通常分為上下兩部分，稱為甚麼？","options":["正文與跋語","上片與下片（又稱上闋、下闋）","首聯與尾聯","起句與結句"],"correctIndex":1,"explanation":"上下片的分界不只是排版：上片多寫景或敘事，下片多轉入抒情或議論，兩者之間往往有一個明顯的轉折。賞析長調時，先找出上下片如何銜接，通常就找到了全詞的結構關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_15","topic":"宋詞","difficulty":"basic","question":"蘇軾《念奴嬌·赤壁懷古》屬於「懷古」一類作品。懷古詞的基本寫法是甚麼？","options":["專門記述作者的日常生活","全篇描寫自然景物而不涉人事","由眼前的古蹟引出歷史人事，再轉回自身的感慨","純粹考證歷史事件的真偽"],"correctIndex":2,"explanation":"懷古的結構通常是三層：登臨所見 → 追想當年人事 → 對照自身處境。第三層才是重心 —— 寫古人是為了寫自己。若賞析時只複述所懷的歷史，便錯過了這類作品真正的落點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_16","topic":"元曲戲劇","difficulty":"basic","question":"元雜劇的劇本之中，「賓白」指的是甚麼？","options":["演出時的音樂伴奏","劇本開首的故事提要","觀眾的即場反應","人物的說白，即唱詞以外的對話與獨白"],"correctIndex":3,"explanation":"元雜劇由「曲」與「白」兩部分構成：曲是唱詞，賓白是說白，另有「科」表示動作與表情。三者分工明確，讀劇本時先分清哪一段是唱、哪一段是說，人物關係與情節推進才理得順。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_17","topic":"元曲戲劇","difficulty":"basic","question":"元雜劇每一本通常由一個角色主唱到底。這種安排對劇本造成甚麼影響？","options":["全劇的情感與敘述集中於該角色，其餘角色多以說白配合","劇情可以同時展開多條分量相同的主線","每一折都必須換由另一個角色主唱","劇本因此不需要用到任何說白"],"correctIndex":0,"explanation":"一人主唱是元雜劇的基本體制：主唱者若為旦角則稱旦本，為末角則稱末本。由於唱詞最能抒情，全劇的情感重量便集中在這一個角色身上，其餘人物主要以說白推動情節。理解這一點，才能明白《竇娥冤》何以能把冤情寫得如此集中 —— 體制本身就把舞台交給了她。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_18","topic":"元曲戲劇","difficulty":"basic","question":"散曲與雜劇同屬元曲，兩者最主要的分別是甚麼？","options":["兩者只是名稱不同","散曲只供清唱，不用於搬演故事；雜劇是完整的戲劇","散曲用文言，雜劇用白話","散曲只在宮廷演出，雜劇只在民間"],"correctIndex":1,"explanation":"散曲有小令與套數之別，重在抒情，不設腳色與情節；雜劇則有完整的故事、人物與科白，須登場搬演。同屬「曲」而用途不同，故形式要求亦異 —— 分清這一點，才不會把散曲的賞析方法套到雜劇上。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_19","topic":"元曲戲劇","difficulty":"basic","question":"元雜劇的劇本由「唱」、「科」、「白」三部分組成。其中「科」指的是甚麼？","options":["角色所說的話，用以交代情節與對答","每支曲子所依據的曲牌的名稱","動作與表情的提示，相當於今日的舞台指示","角色所唱的曲詞，是全劇抒情的主體"],"correctIndex":2,"explanation":"三者分工清楚：唱是曲詞，白是說話，科則標明角色要做甚麼動作、有甚麼表情，例如「做哭科」、「做跪科」。讀劇本時把「科」跳過，等於只讀對白而看不見演出 —— 人物是笑着說還是哭着說，意思可以完全相反。故賞析元雜劇時，科的提示與唱詞同樣是可以引用的證據。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_20","topic":"元曲戲劇","difficulty":"basic","question":"元雜劇中的「旦」與「末」分別指甚麼？","options":["「旦」為主角，「末」為配角","「旦」指唱段，「末」指說白","「旦」為悲劇，「末」為喜劇","「旦」為女性腳色，「末」為男性腳色"],"correctIndex":3,"explanation":"旦、末是腳色行當的名稱，按性別與身分再細分為正旦、正末、外末等。元雜劇通常由正旦或正末一人主唱全本，故判別誰是主唱腳色，往往就掌握了全劇的敘述視角。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_21","topic":"明清小說","difficulty":"basic","question":"明清長篇小說多採用「章回體」。章回體的形式特徵是甚麼？","options":["全書分回，每回設對偶回目，回末常留懸念","全書不分段落，一氣呵成","每回均以詩歌形式寫成","按人物分卷而不按情節"],"correctIndex":0,"explanation":"章回體源出說書：每回結尾一句「欲知後事如何，且聽下回分解」，正是說書人留住聽眾的辦法；對偶的回目則概括該回內容，便於記憶與檢索。理解它的口頭傳統來源，就明白這種形式何以如此重視懸念與節奏。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_22","topic":"明清小說","difficulty":"basic","question":"《紅樓夢》以哪一個家族的興衰作為全書的主線？","options":["孫悟空師徒","賈府","梁山泊眾人","曹操一族"],"correctIndex":1,"explanation":"全書以賈府由盛轉衰為骨幹，人物命運與家族興替互相牽動。與《水滸傳》《三國演義》以群體行動或歷史事件為主線不同，《紅樓夢》把重心放在日常生活與人物內心，這是它在小說史上的突破所在。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_23","topic":"明清小說","difficulty":"basic","question":"《儒林外史》在寫法上最突出的一項特點是甚麼？","options":["以編年方式記述朝代更替","全書以詩詞唱和構成","以諷刺筆法揭示科舉制度下讀書人的處境","以神魔鬥法作為主要情節"],"correctIndex":2,"explanation":"作者極少直接評論，而是把人物的言行如實鋪陳，讓可笑與可悲自行浮現 —— 范進中舉一段即為典型。這種「不著一字而褒貶自見」的手法，正是諷刺小說的精髓：作者退到幕後，判斷交還讀者。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_24","topic":"明清小說","difficulty":"basic","question":"《三國演義》被稱為「歷史演義」小說。所謂「演義」，其寫法特點是甚麼？","options":["完全按正史記載，不作任何增刪","全部情節皆為虛構，與史實無關","只記述戰爭而不寫人物","以史實為框架，加入虛構情節與人物刻畫"],"correctIndex":3,"explanation":"演義在史實的骨架上敷演血肉：赤壁之戰確有其事，草船借箭則屬虛構。這種虛實相間的寫法，使人物形象鮮明、情節緊湊，但亦令不少讀者把小說情節當作史實。答題時宜點明兩者的分別。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_25","topic":"明清小說","difficulty":"basic","question":"《西遊記》取材自唐代僧人西行求法的史事，但全書性質屬於甚麼？","options":["神魔小說 —— 以虛構的神怪情節寄寓人情世態","歷史演義 —— 依史實骨架敷演而少涉神怪","世情小說 —— 專寫市井家庭的日常人倫","公案小說 —— 以斷案與伸冤為主要情節"],"correctIndex":0,"explanation":"史事只提供了一條路線，全書的主體是虛構的神魔情節與人物性格。孫悟空的反抗、豬八戒的世俗、取經路上的種種考驗，寄託的是作者對人性與社會的看法。分清「取材」與「性質」是第一步；再把它與《三國演義》的歷史演義、《金瓶梅》的世情小說並置，四類小說的分工就清楚了。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_26","topic":"文學體裁","difficulty":"basic","question":"「嗟夫！予嘗求古仁人之心，或異二者之為，何哉？」（范仲淹《岳陽樓記》）　這一句在全文之中起甚麼作用？","options":["總結全文並補記寫作的年月與緣由","由前文的寫景抒情轉入議論，是全篇的轉折所在","繼續鋪寫洞庭湖在不同天氣之下的景色","交代滕子京重修岳陽樓一事的來龍去脈"],"correctIndex":1,"explanation":"「嗟夫」是一聲慨嘆，把讀者由景物拉回作者；「予嘗求」轉為第一人稱的思索；「何哉」以問句開出下文的答案。三個信號疊在一起，說明文章至此換了層次 —— 由看景變為論人。讀古文時先找這類轉折標記（嗟夫、然則、是故、噫），全篇的結構便會一目了然。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_27","topic":"文學體裁","difficulty":"basic","question":"「記」這種文體，一般用來做甚麼？","options":["置於書籍之前，說明成書緣起與內容大旨","刻於器物或居室之上，用以自警或述志","記述事物、遊歷或建築，並常於文末寄寓議論","臣下向君主陳情或進言，語氣須恭謹得體"],"correctIndex":2,"explanation":"記體看似寫實，重心卻常在末段的議論 ——《岳陽樓記》寫景兩段之後才落到「先天下之憂而憂」。讀記體文章，宜先問：作者為甚麼要寫這個地方？答案通常就在轉入議論的那一句。其餘三項分別是「表」（如《出師表》）、「序」與「銘」（如《陋室銘》）的功能，四者同屬古代常見文體，最易互相混淆。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_28","topic":"文學體裁","difficulty":"basic","question":"「賦」與「詩」在形式上的一項主要分別是甚麼？","options":["賦必為四句，詩不限句數","賦不可押韻，詩必須押韻","賦只能寫景，詩只能抒情","賦介乎詩文之間，篇幅較長而多鋪陳"],"correctIndex":3,"explanation":"賦講求鋪陳排比，句式較自由，可韻可散，篇幅往往遠長於詩。它的功能在於把一個對象「攤開來寫」，故適合表現繁盛的場面。體裁的選擇本身就是一種判斷：作者要鋪陳，才選賦。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_29","topic":"文學體裁","difficulty":"basic","question":"「傳」這種文體的基本內容是甚麼？","options":["記述人物的生平事跡與性格","記述山川地理","記述典章制度沿革","記述曆法與天象"],"correctIndex":0,"explanation":"傳以人為中心，選取足以顯出性格的事跡加以敘述。史傳求真，文學性的傳（如唐傳奇中的人物傳）則容許虛構。判別一篇「傳」的性質，先看它有沒有可查證的史料依據。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_30","topic":"文學體裁","difficulty":"basic","question":"「序」放在書籍或文集之前，其主要作用是甚麼？","options":["作為書中的第一篇正文","說明成書緣起、內容大旨或寫作背景","列出全書的錯字更正","記錄書籍的售價"],"correctIndex":1,"explanation":"序可由作者自撰，亦可請人代作。前者多交代寫作動機與甘苦，後者多評介其價值。讀一部作品之前先讀序，往往能省下不少摸索 —— 它是作者或評者為讀者預設的入口。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_31","topic":"寫作手法","difficulty":"basic","question":"「借景抒情」這種手法的特點是甚麼？","options":["只寫景物而完全不涉情感","直接以第一人稱陳述心情","不直接說出情感，而藉描寫景物使情感自然流露","先議論後寫景，兩者各自獨立"],"correctIndex":2,"explanation":"景與情之間須有呼應：寫蕭瑟之景而心情低沉，讀者不必被告知也能感受。判別是否借景抒情，要看景物的選擇與情感是否一致 —— 若隨手鋪陳景物而與情感無關，那只是寫景，不算借景抒情。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_32","topic":"寫作手法","difficulty":"basic","question":"「感時花濺淚，恨別鳥驚心。」（杜甫《春望》）　這兩句把人的情感放在甚麼之上？","options":["放在事件的敘述過程之中逐步交代","放在議論說理的推論之中加以說明","完全沒有寫到情感，只是客觀寫景","放在花與鳥之上，使外物彷彿也在悲傷"],"correctIndex":3,"explanation":"花本不會流淚，鳥本不會驚心；詩人把自己的感受移到外物身上，於是整個春天都跟着他一同悲傷。這種寫法使情感由一個人的心事擴大成眼前的整片景象，力量因而加倍。留意它與單純把物寫成人不同：這裏是把「我」的情緒交託給物，物所帶的仍是詩人的悲，故稱移情。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_33","topic":"寫作手法","difficulty":"basic","question":"「可憐身上衣正單，心憂炭賤願天寒。」（白居易《賣炭翁》）　這兩句寫出賣炭翁怎樣的處境？","options":["衣單本應盼暖，卻因怕炭賤而盼天寒，願望與自身處境相違","賣炭翁身體強壯，並不害怕天氣寒冷","賣炭翁本來就喜歡寒冷的天氣","賣炭翁已經賺得足夠的錢過冬"],"correctIndex":0,"explanation":"一個人身上衣服單薄，理應盼望天暖；他卻盼天寒 —— 因為天寒炭才賣得起價。願望與身體的需要正好相反，而他仍然這樣盼，可見生計已迫到甚麼地步。全句沒有加上任何評語，處境卻已交代得清清楚楚。這種把矛盾直接擺出來而不加解釋的寫法，比任何議論都有力。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_34","topic":"寫作手法","difficulty":"basic","question":"「採菊東籬下，悠然見南山。」（陶淵明《飲酒》）　「悠然」二字所寫的是甚麼？","options":["東籬一帶四周無人的安靜環境","詩人當時從容自得的心境","南山在雲霧之中若隱若現的樣子","採菊這個動作進行得十分緩慢"],"correctIndex":1,"explanation":"「悠然」貼着「見」字，寫的是看的那個人 —— 不是刻意去望，抬頭剛好看見，心境從容，故有此二字。歷來論者重視「見」而不作「望」，正因為「望」是有心去找，「見」是無心而遇，與「悠然」相配。判斷這類詞語時，先看它修飾的是哪一個字，歸屬定了，意思自然清楚。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_35","topic":"寫作手法","difficulty":"basic","question":"「伏筆」在敘事作品中的作用是甚麼？","options":["打斷情節以插入議論","重複前文已寫的內容","先埋下線索，為後文的發展作準備，使情節前後呼應","在文末總結全文主旨"],"correctIndex":2,"explanation":"伏筆的要求是「伏」—— 初讀不覺其重要，讀到後文才恍然。若埋得太露即成預告，失去效果；埋得太隱則讀者無從呼應。分寸的拿捏，正是敘事技巧的高下所在。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_36","topic":"文學鑑賞","difficulty":"basic","question":"在賞析文章中引用作品原文之後，必須做甚麼？","options":["把原文再用白話完整地複述一次","指出這段原文出自哪一個版本的選集","說明自己讀到這段原文時有多感動","說明這段原文如何支持自己所提出的論點"],"correctIndex":3,"explanation":"引文本身不會替作者說話：同一句可以支持幾種讀法，若不指出它憑哪一點支持自己的論點，等於把工作留給讀者做。故引用之後最重要的一步是分析 —— 這個字為甚麼用得準、這個安排造成甚麼效果、它如何印證前面的判斷。至於複述原文，只是把文言換成白話，並沒有推進論證。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_37","topic":"文學鑑賞","difficulty":"basic","question":"分析作品的「主旨」，指的是甚麼？","options":["作者透過整篇作品所要表達的中心思想或情感","作品的字數與篇幅","作品所用的所有修辭手法","作品的出版年份"],"correctIndex":0,"explanation":"主旨須由全篇歸納，不可憑一兩句斷定 —— 尤其當作品有轉折時，前半的表述往往正是要被推翻的。歸納主旨的方法：先找出全篇的轉折點，再看轉折之後作者落在哪裡。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_38","topic":"文學鑑賞","difficulty":"basic","question":"賞析人物形象時，除了作者的直接描述之外，還應該注意甚麼？","options":["作者本人是否喜歡這個人物，並據此判斷褒貶","人物的言行、與他人的關係，以及環境對他的襯托","該人物在全書之中出場的總次數與篇幅比例","該人物是否確有其人，以及史書如何記載"],"correctIndex":1,"explanation":"直接描述容易，但往往不及間接呈現有力：一個人物說了甚麼、做了甚麼、別人如何反應，比作者說他「善良」更能立住形象。賞析時多從言行入手，判斷才有依據。其餘三項都是常見的歧路：出場次數多寡不等於形象是否鮮明；文學人物不必以史實衡量；而作者的褒貶亦須由文本推斷，不能反過來當作前提。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_39","topic":"文學鑑賞","difficulty":"basic","question":"比較兩篇作品時，最基本的要求是甚麼？","options":["判定哪一篇的作者名氣較大","計算兩篇的字數差距","設定共同的比較角度，逐項對照","分別複述兩篇的內容"],"correctIndex":2,"explanation":"比較必須沿同一組軸展開 —— 題材、手法、情感、結構 —— 逐項對照。若寫成兩段各自獨立的介紹再讓讀者自行比較，即使兩段都寫得好，仍然沒有完成「比較」這個動作。這是卷二比較題最常見的失分位。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"clit_floor_40","topic":"文學鑑賞","difficulty":"basic","question":"賞析作品的「結構」，主要看甚麼？","options":["作品使用的紙張與字體","作者寫作時所用的時間","作品被引用的次數","各部分的安排次序、詳略輕重與彼此之間的銜接"],"correctIndex":3,"explanation":"結構分析要回答的是「為甚麼這樣排」：何以先寫景後抒情、何以此處詳而彼處略、段與段之間靠甚麼銜接。同樣的材料換一個次序，效果可以完全不同 —— 結構本身就是一種表達。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "chinese-literature";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  const out = { _meta: { source: "chinese-literature-floor.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Date().toISOString().slice(0,10) }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "chinese-literature-floor.decisions.json"; a.click();
});
counts();
</script></body></html>
