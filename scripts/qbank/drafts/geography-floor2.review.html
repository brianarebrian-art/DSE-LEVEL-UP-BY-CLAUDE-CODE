<script>
const DATA = [{"id":"floor2_geo_pc_01","topic":"地理過程・因果鏈","difficulty":"basic","question":"在乾旱地區，日夜溫差極大是岩石風化的主要原因之一。這種風化屬於哪一類？","options":["物理風化 —— 岩石反覆熱脹冷縮而崩解","化學風化 —— 岩石與水起化學反應而溶解","生物風化 —— 植物根部撐裂岩石","侵蝕 —— 岩石被水流搬走"],"correctIndex":0,"explanation":"日間岩石受熱膨脹、夜間冷卻收縮，礦物顆粒的膨脹係數不同，反覆數千次後產生內部應力，岩石表層剝落崩解。整個過程只涉及物理力，岩石的化學成分並無改變，故屬物理（機械）風化。乾旱地區水分稀少，化學風化反而不活躍。要分清風化與侵蝕：風化是岩石【原地】分解，侵蝕則涉及物質被【搬離】原處，兩者是先後相接的兩個環節，不可混為一談。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_pc_02","topic":"地理過程・因果鏈","difficulty":"intermediate","question":"河流上游的坡度較陡，下游較平緩。這對河流的搬運與沉積有何影響？","options":["上游流速快、搬運力強；下游流速減慢，較大顆粒先沉積","上游流速慢，沉積為主；下游流速快，侵蝕為主","上下游流速相同，沉積分佈平均","流速與顆粒沉積次序無關"],"correctIndex":0,"explanation":"坡度陡則重力分量大，流速快，河流的搬運能力（能搬多大顆粒）與搬運量同時提高，因此上游以侵蝕與搬運為主。進入下游後坡度變緩、流速下降，河流無力再托住較重的顆粒，於是按顆粒由大至小依次沉積 —— 這正是三角洲與氾濫平原沉積物由內向外逐漸變幼的成因。有一項把上下游的特徵完全倒轉；其中兩項與河流作用的基本原理相違。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_pc_03","topic":"地理過程・因果鏈","difficulty":"intermediate","question":"大量砍伐山坡上的森林後，該地區山泥傾瀉的風險上升。最直接的原因是甚麼？","options":["樹根不再固結土壤，且雨水直接沖刷坡面，土壤抗剪強度下降","樹木減少令地表蒸散作用減弱，當地降雨量因而大幅上升並沖垮坡面","砍伐令土壤中的礦物成分改變，岩石因此變軟而失去承托力","砍伐機械的重量壓實土層，令山坡的坡度在短期內明顯變陡"],"correctIndex":0,"explanation":"樹木對山坡的穩定有兩重作用：根系在土層中形成網狀結構，把鬆散土粒固結；樹冠則截留雨水，減慢雨滴打擊地面的力度並延緩入滲。砍伐後兩者同時失去，雨水直接沖刷坡面並大量入滲，土壤含水量上升、重量增加而抗剪強度下降，一旦超過臨界值即發生滑動。降雨量主要受大尺度氣候與地形控制，砍伐對本地降雨的影響遠不及上述機制直接；砍伐不會改變岩石礦物成分，亦不會改變坡度。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_pc_04","topic":"地理過程・因果鏈","difficulty":"hard","question":"城市中心的氣溫常較周邊郊區為高，形成「城市熱島」。下列哪一條因果鏈最完整地解釋這個現象？","options":["建築物與路面吸熱多、蒸發散熱少，加上人為排熱，令市區積聚並釋放更多熱能","市中心的海拔一般高於周邊郊區，氣溫因而隨着高度上升而變得較高","市區上空的雲量比郊區多，雲層把地面輻射反射回來，阻擋熱能向外散失","市區種植的樹木比郊區密集得多，植物呼吸作用所釋出的熱能令氣溫上升"],"correctIndex":0,"explanation":"城市熱島由幾條機制疊加而成：混凝土與瀝青的熱容量大、顏色深，日間吸收並儲存大量太陽輻射，入夜緩慢釋放；不透水面令雨水迅速排走，缺乏植被與水體，蒸發散熱（潛熱）大幅減少；空調、車輛與工業排出人為熱；密集高樓形成「峽谷效應」，令輻射在建築之間反覆反射而難以散失。有一項與事實不符 —— 熱島與海拔無關；另一項因果倒轉，雲量並非熱島的成因；還有一項在方向與量級上都不成立，市區植被通常較少，而植物呼吸產熱微不足道。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_pc_05","topic":"地理過程・因果鏈","difficulty":"basic","question":"板塊互相碰撞的聚合型板塊邊界，最常出現下列哪一組地貌與現象？","options":["褶皺山脈、海溝、地震與火山活動","中洋脊與新海洋地殼的形成","廣闊的平坦沖積平原","大規模的冰川侵蝕地貌"],"correctIndex":0,"explanation":"聚合型邊界上兩塊板塊相向移動：密度較大的海洋板塊俯衝至另一板塊之下形成海溝，俯衝板塊下沉時受熱熔融，岩漿上升形成火山；上覆地層受擠壓而褶皺隆起成山脈；板塊摩擦積聚的應力釋放時造成地震。中洋脊屬於【張裂型】邊界的特徵，方向剛好相反；沖積平原由河流沉積形成，冰川地貌由冰的侵蝕造成，兩者都與板塊邊界類型無直接關係。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_pc_06","topic":"地理過程・因果鏈","difficulty":"intermediate","question":"熱帶雨林的土壤養分大部分儲存於植被而非土壤本身。砍伐後土地迅速失去生產力，最主要的原因是甚麼？","options":["養分的主要儲存庫（植被）被移走，加上高溫多雨令表土養分迅速淋溶流失","砍伐令地面失去覆蓋，土壤溫度下降，分解者活動減慢而停止釋出養分","砍伐後土壤中的黏土含量上升，養分被黏土顆粒牢固吸附而無法被吸收","雨林土壤本身極為肥沃，砍伐令養分下沉並鎖在植物根系觸及不到的深層"],"correctIndex":0,"explanation":"雨林的養分循環非常緊密：落葉在高溫多濕下迅速被分解者分解，養分幾乎立即被密集的淺根系吸收回植體，因此養分主要「存」在生物量之中，土壤本身反而貧瘠。砍伐移走了這個儲存庫，同時失去樹冠遮擋，暴雨直接沖刷地面，可溶養分隨下滲水流被淋溶至深層而流失，數年之內即難以耕作。有一項方向寫反 —— 失去遮蔭後土壤溫度上升；其中兩項與雨林土壤（多為貧瘠的磚紅壤）的實況不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_pc_07","topic":"地理過程・因果鏈","difficulty":"hard","question":"在河曲（曲流）的發育過程中，凹岸與凸岸分別發生甚麼作用？","options":["凹岸流速快、侵蝕形成陡崖；凸岸流速慢、沉積形成點沙洲","凹岸水流較慢而沉積成沙洲；凸岸水流較急而侵蝕成陡直的河崖","兩岸的流速相同，故同時受到側向侵蝕，河道因而不斷向兩邊變闊","兩岸的流速同樣緩慢，故同時發生沉積，河道因而不斷收窄以至淤塞"],"correctIndex":0,"explanation":"水流進入彎道時，慣性把流速最快的主流帶向外側（凹岸），該處水深流急，側向侵蝕強烈，河岸被掏空後崩塌形成陡直的河崖。內側（凸岸）水淺流緩，河流無力再托住負載，於是沉積成弧形的點沙洲。兩岸一侵一積，令河曲的曲度不斷加大，最終可能截彎取直而形成牛軛湖。有一項把凹凸兩岸的作用完全倒轉 —— 這是本課題最常見的失分位；其中兩項忽略了同一斷面上流速分佈並不均勻，正是這個不均勻才造就曲流。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_01","topic":"數據與環境管理","difficulty":"basic","question":"某市過去十年的空氣質素健康指數（AQHI）由平均 6.2 降至 4.1。單憑這項數據，可以合理得出甚麼結論？","options":["整體空氣質素有所改善，但未能判斷改善的成因","減排政策必然是這次改善的唯一成因，其他因素可以排除","該市的空氣污染問題已徹底解決，往後不必再作監測","該市的經濟活動必然已大幅萎縮，工業排放隨之停止"],"correctIndex":0,"explanation":"指數由 6.2 降至 4.1 只顯示【結果】，並未提供任何關於成因的資訊。改善可能來自減排政策，也可能來自產業結構轉變、鄰近地區排放下降、氣象條件差異，甚至監測站選址改動。數據回應題的紀律是：讀出數據支持得到的結論，不多不少。有一項把單一成因強加於數據之上；另一項過度推論 —— 指數下降不等於問題解決，4.1 仍屬中等水平；還有一項則是把相關當作因果，且方向純屬臆測。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_02","topic":"數據與環境管理","difficulty":"intermediate","question":"一幅氣候圖顯示某地全年高溫，雨量集中於夏季，冬季近乎無雨。這最可能是哪一種氣候？","options":["熱帶季風氣候","熱帶雨林氣候","地中海式氣候","溫帶海洋性氣候"],"correctIndex":0,"explanation":"判讀氣候圖要同時看兩條線索：溫度水平與雨量的【季節分配】。全年高溫排除了溫帶類型；雨量高度集中於夏季、冬季近乎無雨，是季風環流的典型特徵 —— 夏季風由海洋吹向陸地帶來大量水汽，冬季風由內陸吹出而乾燥。熱帶雨林氣候全年高溫【多雨】，並無明顯乾季；地中海式氣候的雨量集中於【冬】季，剛好相反，而且夏季炎熱乾燥；溫帶海洋性氣候全年溫和而雨量平均。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_03","topic":"數據與環境管理","difficulty":"intermediate","question":"推行「污者自付」原則（例如按垃圾量收費）的主要環境管理邏輯是甚麼？","options":["把外部成本內部化，令排污者在決策時把環境代價計算在內","透過罰款懲罰市民的浪費行為，並藉此為政府庫房增加一筆穩定收入","把處理污染的責任完全轉移給私營廢物處理商，政府不再承擔任何角色","限制市民的消費自由，藉着壓抑整體經濟活動來間接減少廢物產生"],"correctIndex":0,"explanation":"污染屬於典型的負外部性：排污者承擔的私人成本低於社會實際承受的成本，因此排污量高於社會最適水平。按量收費把處理與環境代價直接加到排污者身上，令私人成本貼近社會成本，排污者在決策時自然會減少產生廢物 —— 這就是「內部化」。增加收入是副產品而非目的；責任並非轉移給企業，而是落在實際製造污染的一方；限制消費自由亦非政策目標，市民仍可自由選擇，只是需為自己造成的代價付費。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_04","topic":"數據與環境管理","difficulty":"hard","question":"兩個城市的人均碳排放相同，但甲市總排放遠高於乙市。這最可能反映甚麼？","options":["甲市人口遠多於乙市","甲市的能源效率遠低於乙市","甲市的工業比重遠高於乙市","甲市的統計方法有誤"],"correctIndex":0,"explanation":"總排放 = 人均排放 × 人口。既然兩市人均排放相同，總排放的差異只能來自人口規模，這是由定義直接推出的結論，無需任何額外假設。能源效率與工業比重確實會影響排放，但它們的影響已經反映在【人均】數字之中；人均既然相同，就不能再用來解釋差異。統計有誤是一個沒有證據支持的推測，而且在數據本身完全自洽的情況下並無提出的理由。人均與總量的分辨，是環境數據題最常設的陷阱。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_05","topic":"數據與環境管理","difficulty":"basic","question":"可持續發展要求同時兼顧三個面向。除環境保護與經濟發展外，第三個面向是甚麼？","options":["社會公平 —— 包括代際與代內的資源分配","軍事安全 —— 確保國家邊境與資源不受外來威脅","科技領先 —— 確保本國在關鍵技術上長期壓倒其他國家","人口增長 —— 確保勞動人口持續擴大以支撐經濟"],"correctIndex":0,"explanation":"可持續發展的經典定義是「既滿足當代人的需要，又不損害後代滿足其需要的能力」，其核心正是【代際公平】；而在同一代之內，資源與污染負擔應否公平分配，則是【代內公平】。三個面向（環境、經濟、社會）必須同時兼顧，只顧其一而犧牲其餘並不算可持續 —— 例如以嚴重污染換取經濟增長，或以剝奪基層生計的方式推行環保，兩者同樣不符合定義。其餘三項均非可持續發展框架的組成部分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_06","topic":"數據與環境管理","difficulty":"intermediate","question":"在解讀一幅只顯示絕對數值的環境污染分佈圖時，最需要補充哪一項資料才能作出公平比較？","options":["各地區的面積或人口，以便換算成密度或人均數值","各地區的歷史名稱與行政沿革，以便追溯污染的長期來源","製圖者的姓名與所屬機構，以便評估這幅地圖是否可信","地圖所用的印刷顏色與圖例樣式，以便判斷閱讀是否清晰"],"correctIndex":0,"explanation":"絕對數值不能直接比較大小懸殊的區域：一個面積或人口大十倍的地區，即使管理更佳，總量仍可能較高。要作公平比較，必須把絕對值換算為【相對】指標 —— 除以面積得污染密度，除以人口得人均排放，視乎所問的是環境負荷還是責任歸屬而定。這與上一條「人均與總量」屬同一個判讀原則。其餘三項與數據的可比性無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_07","topic":"數據與環境管理","difficulty":"hard","question":"某項環境政策實施後，該地區的污染指數下降，但同期鄰近地區的污染指數上升。這最可能說明甚麼？","options":["污染可能只是轉移到規管較寬鬆的地區，並未在整體上減少","該政策必定完全成功，鄰區的變化與本地政策並無任何關連","鄰近地區的居民必定較不重視環保，故其污染指數自然上升","兩地的數據必定互相矛盾，其中一方的監測結果應予推翻"],"correctIndex":0,"explanation":"這是環境管理上典型的「污染轉移」：規管收緊令高污染的生產活動遷往規管較寬鬆的地方，本地指數改善，但區域整體的排放未必下降，甚至可能因運輸增加而上升。評估政策成效因此必須看【適當的空間尺度】，只看行政區內的數字容易得出過於樂觀的結論。有一項忽略了同期鄰區惡化這項關鍵資料；另一項把結構性的產業轉移歸咎於居民態度，缺乏證據；還有一項誤把「兩地變化方向相反」當成數據矛盾，但兩者其實可以同時為真，而且正好構成轉移的證據。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_geo_dm_08","topic":"數據與環境管理","difficulty":"intermediate","question":"在環境影響評估中，設立「基線調查」的主要目的是甚麼？","options":["記錄工程開始前的環境狀況，作為日後判斷影響的比較基準","預先證明該工程在施工與運作期間不會造成任何環境影響","透過提交大量前期資料，加快主管當局對該工程的審批程序","計算工程的建造成本與日後的維修開支，以便評估財政可行性"],"correctIndex":0,"explanation":"基線調查在工程動工前記錄空氣、水質、噪音、生態等各項指標的既有水平。有了這個參照點，日後的監測數據才能回答「變化了多少、是否由本工程造成」；若沒有基線，任何事後數字都無從判斷究竟是工程影響還是本來如此。基線調查的作用是【提供比較基準】，而非預先為工程背書 —— 把它當成「證明無影響」，正好顛倒了評估的方向。加快審批與計算成本均非其目的。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "geography-floor2.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "geography-floor2.decisions.json"; a.click();
});
counts();
</script></body></html>
