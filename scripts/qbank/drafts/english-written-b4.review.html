const DATA = [{"id":"en_w4_01","topic":"Tenses","difficulty":"basic","question":"Explain the difference in meaning between 'I have lived in Hong Kong for ten years' and 'I lived in Hong Kong for ten years'. State what each tells the listener about the speaker's present situation.","explanation":"Candidates often answer that one is present perfect and the other past simple, which names the forms without explaining the difference in meaning. The point to reach is that the present perfect connects a past action to the present moment, while the past simple closes it off.","type":"text","referenceAnswer":"'I have lived in Hong Kong for ten years' uses the present perfect. It states that the living began ten years ago and continues now: the speaker is still in Hong Kong, and the ten years are still running. The listener understands the situation to be unfinished.\n'I lived in Hong Kong for ten years' uses the past simple. It places the whole period in a closed stretch of past time: the speaker lived there for ten years and no longer does. The listener understands that the situation has ended, and may reasonably ask where the speaker lives now.\nThe general principle: the present perfect links a past event to the present, which is why it is used for experience, for change up to now, and for unfinished periods. The past simple separates the event from the present, which is why it is used with finished time and with completed situations.\nA test that makes the difference visible: 'for ten years, and I am still here' works with the first sentence but contradicts the second. Conversely 'for ten years, before I moved to Singapore' fits the second but not the first.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w4_02","topic":"Word Formation","difficulty":"basic","question":"From the word 'compete', form a noun referring to a person, a noun referring to the activity, and an adjective. Then explain why knowing word families is useful in an examination even when the exact word is not known.","explanation":"The second part carries the weight. The useful insight is that suffixes are systematic: recognising them allows a reader to work out both the meaning and the grammatical role of an unfamiliar word from its parts.","type":"text","referenceAnswer":"Forms: person — competitor; activity — competition; adjective — competitive. (A second adjective, 'competing', is also acceptable, as is the noun 'competitiveness' for the quality.)\nWhy word families help:\nFirst, suffixes carry grammatical information consistently. The endings -or and -er commonly mark a person or an agent, -tion and -ment mark a process or its result, and -ive, -ous and -al mark adjectives. A reader who meets an unknown word ending in -tion can tell it is a noun and place it correctly in the sentence, even without knowing the exact sense.\nSecond, they carry meaning. If the root is recognised, the family gives access to several words at once: knowing 'compete' makes 'competitor', 'competition', 'competitive' and 'uncompetitive' broadly intelligible. Learning one root is more efficient than learning four separate items.\nThird, they support editing. In a cloze or error-correction task the required word class is often clear from the sentence structure, and the candidate need only put the known root into the right form, rather than search for a wholly different word.\nA caution: the patterns are regular but not universal. Some forms are irregular, and some do not exist at all. Where a formed word looks doubtful, it is safer to rephrase than to invent a form.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w4_03","topic":"Vocabulary","difficulty":"intermediate","question":"'Thin', 'slim' and 'skinny' all describe a body of small width, yet they are not interchangeable. Explain the difference, and state what this shows about learning vocabulary from a dictionary definition alone.","explanation":"The concept being tested is connotation. Candidates who treat the three as synonyms have missed that words carry attitude as well as denotation, and that attitude is what makes one appropriate and another offensive in the same sentence.","type":"text","referenceAnswer":"The three share a denotation, that is, the literal quality described, but differ in connotation, the attitude they carry.\n'Slim' is favourable. It suggests an attractive and often deliberate leanness, and would be received as a compliment.\n'Thin' is broadly neutral. It states the fact without evident approval or disapproval, and can be used in description or in medical contexts.\n'Skinny' is unfavourable. It suggests being too lean, to the point of looking unwell or unappealing, and said to someone's face it would usually offend.\nThe consequence is that the three cannot be exchanged even where the literal meaning fits. 'You look slim today' is a compliment; 'You look skinny today' expresses concern or criticism, though the person described has not changed.\nWhat this shows about dictionary learning:\nA short definition records denotation and often omits connotation, so a learner who relies on it may produce sentences that are literally accurate yet socially wrong. The same applies to register: some words fit conversation, others only formal writing.\nThe practical implication is that vocabulary should be learnt in context rather than as isolated pairs of equivalents. Reading how a word is actually used, noting who says it, to whom, and whether the attitude is positive, shows what a definition cannot. Example sentences, collocations and usage notes in a good dictionary exist precisely to supply this, and are more valuable than the definition line itself.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w4_04","topic":"Reading Comprehension","difficulty":"intermediate","question":"In a reading paper, a question asks for the main idea of a paragraph. Explain how the main idea differs from a detail, and describe a reliable method for locating it.","explanation":"A frequent error is to choose the most striking sentence, or a statistic, as the main idea. The distinction required is between the claim a paragraph makes and the material that supports it.","type":"text","referenceAnswer":"The difference:\nThe main idea is the single claim the paragraph exists to make. Every other sentence in the paragraph should serve it.\nA detail is material that supports that claim: an example, a statistic, a quotation, a comparison or a concession. A detail may be the most memorable sentence in the paragraph without being its main idea, which is why memorability is a poor guide.\nA further test: the main idea is general enough to cover the whole paragraph. If a candidate's answer is true of only one or two sentences, it is a detail. If it is so general that it would fit the whole passage, it is the topic rather than this paragraph's idea.\nA reliable method:\nFirst, read the paragraph through without stopping, so that its shape is clear before any sentence is weighed.\nSecond, ask what the paragraph is about in a single noun phrase. That gives the topic, not yet the idea.\nThird, ask what the paragraph says about that topic. The answer, expressed as a full sentence, is the main idea. Requiring a full sentence prevents a topic from being mistaken for an idea.\nFourth, test the candidate sentence against the rest. Take each remaining sentence and ask whether it supports the proposed idea. If several do not, the proposal is wrong and should be revised.\nFifth, check the first and last sentences. In expository writing the main idea is often stated in one of them, though not always; where the paragraph opens with an example, it may appear only at the end, and where the paragraph turns on a contrast, it may follow a word such as 'however'.\nA warning: where none of the sentences states the idea directly, it must be inferred and expressed in the candidate's own words. This is normal in more demanding passages, and looking for a sentence to copy will fail.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w4_05","topic":"Cloze & Usage","difficulty":"intermediate","question":"In an open cloze task, a candidate must supply words that have been removed from a passage. Describe three kinds of clue in the surrounding text that indicate what is required, and explain why reading the whole passage first is worthwhile.","explanation":"This is a strategy question. Strong answers distinguish grammatical clues, which narrow the word class, from lexical and logical clues, which fix the meaning; weak answers advise guessing from the general sense.","type":"text","referenceAnswer":"First kind: grammatical clues. The structure around the gap usually fixes the word class. A gap after 'the' and before a noun calls for an adjective; a gap after a preposition calls for a noun or a gerund; a gap between subject and object calls for a verb, and the subject fixes its number. Identifying the class first eliminates most wrong answers before meaning is considered.\nSecond kind: collocational clues. English words keep regular company. 'Make' goes with 'a decision', 'depend' with 'on', 'interested' with 'in'. Where the gap sits beside a word with strong partners, the range of possibilities is narrow, and often only one word is idiomatic even though several are grammatically possible.\nThird kind: logical and cohesive clues. Linking words signal the relation between ideas: 'however' and 'nevertheless' mark contrast, 'therefore' and 'consequently' mark result, 'moreover' marks addition. If the sentence after the gap contradicts the one before, a contrastive link is needed; if it draws a conclusion, a resultative one. Reference words such as 'this', 'these' and 'such' likewise point back to something identifiable earlier.\nWhy read the whole passage first:\nFirst, several answers depend on information outside the sentence containing the gap. A pronoun's referent, the tense of a narrative, or whether the writer is arguing for or against a position may only become clear later.\nSecond, the writer's stance determines which of two grammatically acceptable words is right. A passage critical of a policy will not take an approving word, though the sentence alone would permit it.\nThird, reading first prevents an early wrong answer from shaping later ones. Candidates who fill gaps in order tend to defend an early choice and bend subsequent answers to it, whereas a reader who knows the whole argument sees at once that it does not fit.\nA practical order: read through once for sense; fill the gaps that are certain; return to the doubtful ones with the whole passage in mind; then read through once more to check that the completed text reads naturally.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w4_06","topic":"Reading · Inference & Implication","difficulty":"intermediate","question":"Distinguish between what a text states, what it implies, and what a reader assumes. Explain why the distinction matters in answering inference questions.","explanation":"The commonest failure in inference questions is importing outside knowledge and presenting it as inference. The answer must show that a legitimate inference is supported by the text, whereas an assumption is brought to it.","type":"text","referenceAnswer":"What a text states is set down in words and can be pointed to. 'The shop closed in March' is stated.\nWhat a text implies is not written but follows from what is written, taken with the rest of the passage. If the passage adds that the owner had been ill since January and that no one else could run the counter, the text implies a reason for the closure without saying so.\nWhat a reader assumes is brought from outside: general knowledge, experience or expectation. A reader who concludes that the shop closed because of online competition, where the passage mentions no such thing, has assumed rather than inferred.\nWhy the distinction matters:\nFirst, an inference question asks for what the text supports, not for what is true in the world. An answer may be entirely plausible in reality and still be wrong, because the passage does not support it. Candidates who read widely are particularly liable to this error, since their knowledge supplies attractive answers the text has not earned.\nSecond, the distinction gives a usable test. For any proposed answer, ask which words in the passage would have to be there for it to follow. If they can be pointed to, it is an inference; if the support has to be supplied from elsewhere, it is an assumption and should be rejected however reasonable it sounds.\nThird, it explains why more than one answer can seem right. Distractors in inference questions are usually assumptions that are plausible but unsupported. Knowing that plausibility is not the criterion is what allows a candidate to discard them.\nA practical procedure: underline the words that support the chosen answer before committing to it. If nothing can be underlined, the answer is an assumption.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w4_07","topic":"Reading · Tone & Attitude","difficulty":"hard","question":"A writer describes a new development as 'an ambitious scheme that will no doubt transform the district, if it is ever finished'. Identify the writer's attitude and explain, with reference to the language, how it is conveyed.","explanation":"The sentence is constructed so that a surface of approval is undercut at the end. Candidates who read only the first half will report enthusiasm. The answer must show how each element contributes and, in particular, how the final clause retrospectively changes the rest.","type":"text","referenceAnswer":"Attitude: sceptical, and mildly mocking. The writer doubts that the scheme will be completed and treats the claims made for it as inflated.\nHow the language conveys it:\nFirst, the final clause does the decisive work. 'If it is ever finished' introduces doubt about the most basic condition of all, namely completion. 'Ever' is not a neutral marker of time here; it implies a long wait and possibly none at all. Because the clause comes last, it is read back over everything before it and changes how the earlier words are taken.\nSecond, 'no doubt' becomes ironic in that light. Used straightforwardly it asserts confidence, but a writer who ends by doubting completion cannot sincerely be certain of transformation. The phrase therefore reads as a report of what others claim rather than what the writer believes, and the distance between the two is where the irony lies.\nThird, 'ambitious' is doing double duty. It can praise boldness of vision, but it is also the standard word for a plan that may exceed what its promoters can deliver. Placed beside a doubt about completion, the second sense comes forward.\nFourth, the structure itself carries meaning. A long approving clause followed by a short conditional produces a deflating effect: the sentence builds and then punctures. Had the doubt come first, the effect would have been an objection followed by concession, which reads as balanced rather than mocking.\nWhat the answer should avoid: reporting the attitude as 'negative' without more. The writer is not hostile to the development and makes no criticism of its merits; the scepticism is directed at the likelihood of delivery. Precision about the target of an attitude is part of identifying it correctly.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w4_08","topic":"DSE Paper 1 Reading","difficulty":"hard","question":"In a reading examination, a candidate is asked to give the meaning of an underlined word 'as it is used in the passage'. Explain why the dictionary meaning may not earn the mark, and set out how such a question should be approached.","explanation":"The phrase 'as it is used in the passage' is the instruction being tested. Candidates who supply a general definition have answered a different question. The answer should explain polysemy and figurative use, and give a procedure ending in a substitution check.","type":"text","referenceAnswer":"Why a dictionary meaning may fail:\nFirst, most common words carry several senses. 'Run' may mean to move quickly, to manage a business, to operate a machine, or of a colour, to spread when wet. A dictionary lists all of them, and the question asks which one is at work here. Reproducing the first or the most familiar sense will be wrong whenever the passage uses another.\nSecond, a word may be used figuratively. If a passage describes a policy as having 'starved' a service of funds, the literal sense of depriving of food is not what is meant, and offering it shows the figure has not been recognised.\nThird, the sense may be narrowed by the subject. In a passage on shipping, 'draft' means the depth of a vessel in the water; in a passage on writing, an early version. The general definition is too broad to earn the mark in either.\nFourth, examiners are testing whether the candidate can read the context. Supplying a memorised definition demonstrates vocabulary knowledge but not the skill the question is designed to assess.\nHow to approach the question:\nFirst, read the whole sentence containing the word, and the sentences on either side. The sense is fixed by its neighbours, not by the word alone.\nSecond, identify the word class as used here. The same form may be noun or verb, and settling this eliminates several senses immediately.\nThird, look for signals in the context: what the word is applied to, what it is contrasted with, and whether the surrounding language is literal or figurative.\nFourth, express the meaning in the candidate's own words, of the same word class as the original. If the word is a verb, the answer should be a verb.\nFifth, apply the substitution check. Put the proposed meaning back into the sentence in place of the original word. If the sentence remains grammatical and says the same thing, the answer is sound; if it becomes awkward or changes the sense, it is not.\nA caution on copying: taking a phrase from elsewhere in the passage often fails, because it may be a related idea rather than a definition. The answer must be a meaning, not a reference.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
