const DATA = [{"id":"bafs_acct_b1_01","topic":"財務報表","difficulty":"basic","question":"晴天文具店為李小姐獨資經營。2026 年 12 月 31 日，該店各項結餘如下：\n設備（成本）\\$60,000\n設備累計折舊 \\$18,000\n存貨 \\$25,000\n應收賬款 \\$16,000\n銀行存款 \\$9,000\n現金 \\$1,500\n應付賬款 \\$13,500\n長期銀行貸款（2031 年到期）\\$30,000\n資本（2026 年 1 月 1 日）\\$40,000\n本年度淨利 \\$22,000\n提用 \\$12,000\n（a）編製晴天文具店於 2026 年 12 月 31 日的財務狀況表。\n（b）計算該店的營運資金。\n（c）解釋為何長期銀行貸款列作非流動負債。","explanation":"本題考核財務狀況表的基本結構：資產按非流動及流動分類，負債按償還期分類，資本部分須顯示期初資本、本年度淨利與提用如何得出期末資本。資產總值等於負債及資本總額，是檢查編製是否正確的第一步。提用應從資本中扣除，不應列作費用。","type":"long","referenceAnswer":"（a）晴天文具店財務狀況表（2026 年 12 月 31 日）\n非流動資產：設備（成本）\\$60,000，減累計折舊 \\$18,000，賬面淨值 \\$42,000\n流動資產：存貨 \\$25,000；應收賬款 \\$16,000；銀行存款 \\$9,000；現金 \\$1,500；流動資產合計 \\$51,500\n資產總值 \\$93,500\n流動負債：應付賬款 \\$13,500\n非流動負債：長期銀行貸款 \\$30,000\n負債總額 \\$43,500\n資本：期初資本 \\$40,000，加本年度淨利 \\$22,000，減提用 \\$12,000，期末資本 \\$50,000\n負債及資本總額 \\$93,500\n（b）營運資金 = 流動資產 − 流動負債 = \\$51,500 − \\$13,500 = \\$38,000。\n（c）該貸款於 2031 年才須償還，即在報告期末後超過十二個月，故屬非流動負債。只有須於報告期末後十二個月內償還的部分，才列作流動負債。","markingScheme":"（a）6 分：資產、負債按流動／非流動正確分類（2 分）；設備以成本減累計折舊列示（1 分）；資本部分列出期初資本、淨利、提用及期末資本（2 分）；兩邊總額相等（1 分）。\n（b）2 分：公式 1 分，答案 1 分。\n（c）2 分：指出十二個月的分界（1 分），並聯繫到本題的還款年份（1 分）。\n建議用時 15 分鐘。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案列出必達步驟與數字，交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":15,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"bafs_acct_b1_02","topic":"財務報表","difficulty":"intermediate","question":"陳先生獨資經營旺角單車行。以下資料摘自 2026 年 12 月 31 日的試算表及附註：\n汽車（成本）\\$120,000\n汽車累計折舊（2026 年 1 月 1 日）\\$36,000\n存貨（2026 年 12 月 31 日）\\$38,000\n應收賬款 \\$45,000\n本年已付租金 \\$39,000\n應付賬款 \\$27,600\n銀行透支 \\$5,200\n現金 \\$800\n資本（2026 年 1 月 1 日）\\$98,000\n提用 \\$24,000\n附註：\n1. 汽車按成本以直線法每年折舊 15%。\n2. 呆賬準備須維持於應收賬款的 4%；年初並無呆賬準備。\n3. 本年已付租金涵蓋 2026 年 1 月至 2027 年 1 月，共 13 個月。\n4. 2026 年 12 月的電費 \\$2,400 尚未支付。\n5. 計入上述所有調整後，本年度淨利為 \\$41,800。\n（a）計算 2026 年 12 月 31 日的：(i) 汽車累計折舊；(ii) 呆賬準備；(iii) 預付租金。\n（b）編製旺角單車行於 2026 年 12 月 31 日的財務狀況表。\n（c）解釋為何應收賬款須減去呆賬準備後才列入財務狀況表。","explanation":"本題考核期末調整如何進入財務狀況表：本年折舊加入累計折舊、呆 31,500；非流動資產合計 \\$79,500\n流動資產：存貨 \\$7,200；預付保險 \\$1,800；銀行存款 \\$14,300；現金 \\$2,200；流動資產合計 \\$25,500\n資產總值 \\$105,000\n流動負債：應付賬款 \\$9,600；應計工資 \\$4,200；銀行貸款一年內到期部分 \\$12,000；流動負債合計 \\$25,800\n非流動負債：銀行貸款 \\$48,000\n負債總額 \\$73,800\n資本：期初資本 \\$30,000，加額外注入資本 \\$10,000，加本年度淨利 \\$8,600，減提用 \\$17,400（現金 \\$15,000 及貨品 \\$2,400），期末資本 \\$31,200\n負債及資本總額 \\$105,000\n（c）營運資金 = \\$25,500 − \\$25,800 = −\\$300。\n流動負債略高於流動資產，即使把全部流動資產變現，亦不足以清還一年內到期的債務。咖啡室的流動資產大部分是現金及銀行存款，存貨少、沒有應收賬款，日常收款快，短期內未必立即出現困難；但只要現金收入稍為放緩，便可能無法按時償還貸款分期或支付供應商。\n改善方法（任答兩項並加以說明）：東主再注入現金資本；減少提用；與銀行商討延長還款期，減少一年內到期的部分；以長期融資取代短期負債。","markingScheme":"（a）2 分：流動部分及金額 1 分；非流動部分及金額 1 分。\n（b）9 分：兩項非流動資產以淨值列示 2 分；流動資產 2 分；流動負債包括貸款一年內到期部分 2 分；資本部分列出額外注入資本 1 分及提用含貨品 1 分；總額相等 1 分。\n（c）5 分：營運資金計算 1 分；解釋負數的含意 1 分；結合本題資料評論 1 分；兩項改善方法各 1 分。\n建議用時 24 分鐘。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案列出必達步驟與數字，交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":24,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"bafs_acct_b1_04","topic":"財務報表","difficulty":"intermediate","question":"青衣五金行為獨資商店。截至 2026 年 12 月 31 日止年度的資料如下：\n銷貨 \\$480,000\n銷貨退回 \\$6,000\n存貨（2026 年 1 月 1 日）\\$42,000\n購貨 \\$318,000\n購貨退出 \\$4,500\n進貨運費 \\$3,500\n存貨（2026 年 12 月 31 日）\\$51,000\n租金 \\$72,000\n工資 \\$54,000\n水電費 \\$9,800\n送貨運費 \\$4,200\n設備折舊 \\$6,000\n已收佣金 \\$3,000\n（a）計算銷貨成本。\n（b）編製青衣五金行截至 2026 年 12 月 31 日止年度的收益表。\n（c）解釋為何進貨運費計入銷貨成本，而送貨運費則列作費用。","explanation":"本題考核收益表的兩個層次：先以淨銷貨減銷貨成本得出毛利，再加其他收入、減各項費用得出淨利。計算淨購貨時須減購貨退出、加進貨運費。常見錯誤是把送貨運費計入銷貨成本，或忘記從銷貨中扣除銷貨退回。","type":"long","referenceAnswer":"（a）淨購貨 = \\$318,000 − \\$4,500 + \\$3,500 = \\$317,000；銷貨成本 = \\$42,000 + \\$317,000 − \\$51,000 = \\$308,000。\n（b）青衣五金行收益表（截至 2026 年 12 月 31 日止年度）\n銷貨 \\$480,000，減銷貨退回 \\$6,000，淨銷貨 \\$474,000\n銷貨成本：期初存貨 \\$42,000，加淨購貨 \\$317,000，可供銷售貨品 \\$359,000，減期末存貨 \\$51,000，銷貨成本 \\$308,000\n毛利 \\$166,000\n加：已收佣金 \\$3,000，合計 \\$169,000\n減：費用 —— 租金 \\$72,000；工資 \\$54,000；水電費 \\$9,800；送貨運費 \\$4,200；設備折舊 \\$6,000；費用合計 \\$146,000\n本年度淨利 \\$23,000\n（c）進貨運費是把貨品運到店舖、使其可供出售所必須的成本，屬購入貨品成本的一部分，故計入銷貨成本並影響毛利。 function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "bafs-accounts-b1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "bafs-accounts-b1.decisions.json"; a.click();
});
counts();
</script></body></html>
