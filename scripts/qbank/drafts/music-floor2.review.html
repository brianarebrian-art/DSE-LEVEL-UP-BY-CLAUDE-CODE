const DATA = [{"id":"floor2_mus_hf_01","topic":"和聲・和弦與曲式","difficulty":"basic","question":"大三和弦由哪三個音程關係的音組成？","options":["根音、根音上方大三度、根音上方完全五度","根音、根音上方小三度、根音上方完全五度","根音、根音上方大三度、根音上方大六度","根音、根音上方完全四度、根音上方完全五度"],"correctIndex":0,"explanation":"三和弦由根音向上疊置兩個三度而成。大三和弦的下方三度是【大】三度（四個半音）、上方三度是小三度（三個半音），根音到五音合共七個半音，即完全五度。以 C 大三和弦為例，就是 C、E、G。有一項描述的是【小】三和弦（下方為小三度，如 C、E♭、G）—— 大小三和弦的唯一分別就在這個三音，而它決定了和弦是明亮還是暗淡，這正是本課題的核心。其中兩項所列的音程組合都不構成三度疊置的三和弦。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_mus_hf_02","topic":"和聲・和弦與曲式","difficulty":"basic","question":"在大調中，以第五級音為根音所建立的三和弦稱為甚麼？","options":["屬和弦（dominant），最常見的功能是解決到主和弦","主和弦（tonic），最常見的功能是確立全曲的調性中心","下屬和弦（subdominant），最常見的功能是離開主和弦","導音和弦（leading-tone），最常見的功能是作為經過和弦"],"correctIndex":0,"explanation":"大調音階上第五級所建的三和弦稱為屬和弦（V）。它包含導音（第七級），該音有強烈傾向上行半音解決到主音，因此屬和弦本身帶有明顯的張力，最典型的去向是 V → I，即完全終止。主和弦建於第一級，下屬和弦建於第四級，導音和弦建於第七級，三者的級數都與題目所問不符。掌握 I、IV、V 三個主要和弦的級數與功能，是理解和聲進行的起點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_mus_hf_03","topic":"和聲・和弦與曲式","difficulty":"intermediate","question":"樂句以屬和弦進行到主和弦（V–I）作結，這種終止式稱為甚麼？","options":["完全終止（perfect cadence），予人明確結束的感覺","半終止（imperfect cadence），予人樂句未完待續的感覺","變格終止（plagal cadence），常用於聖詠的「阿們」處","假終止（interrupted cadence），予人意料之外的轉折感"],"correctIndex":0,"explanation":"終止式由樂句最後兩個和弦的關係界定。V–I 是完全終止：屬和弦的張力得到解決，聽感上最為完滿，因此常用於樂曲或段落的結束。半終止結束【於】V（如 I–V），張力未解決，聽起來像逗號而非句號；變格終止是 IV–I，聲響較柔和；假終止是 V–vi，本應解決到 I 卻轉去 vi，因而產生意外感。判斷終止式的方法固定：先找出最後兩個和弦的級數，再對照上述四種組合。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_mus_hf_04","topic":"和聲・和弦與曲式","difficulty":"intermediate","question":"三段體（ternary form）的結構是甚麼？","options":["ABA —— 呈示一個段落，轉入對比段落，再回到原段落","AB —— 呈示一個段落，然後轉入對比段落並就此結束","ABACA —— 主題段落與多個不同的對比段落交替出現","AAB —— 同一段落重複一次，然後轉入新的段落作結"],"correctIndex":0,"explanation":"三段體的核心是【再現】：A 段呈示主要素材，B 段以不同的調性、織體或情緒作對比，然後 A 段回歸，令樂曲首尾呼應而結構完整。這種「離開再回來」的原則是西方音樂結構最基本的一種。AB 是二段體，沒有再現；ABACA 是迴旋曲式，主題與【多個】不同插段交替；AAB 屬另一種結構（如巴洛克的某些歌曲形式）。辨認曲式的方法是先聽出各段的材料是否相同，再標記字母。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_mus_hf_05","topic":"和聲・和弦與曲式","difficulty":"intermediate","question":"和弦的「轉位」（inversion）指的是甚麼？","options":["和弦音的排列改變，令根音以外的音成為最低音","和弦的根音改變，令整個和弦移到另一個音高上","和弦由大和弦變成小和弦，因而聲響由明亮轉為暗淡","和弦的音數由三個增至四個，因而張力顯著增加"],"correctIndex":0,"explanation":"轉位只改變和弦音的【垂直排列】，不改變和弦的成分與名稱。以 C 大三和弦（C、E、G）為例：C 在最低是原位；E 在最低是第一轉位；G 在最低是第二轉位 —— 三者仍然是 C 大三和弦。轉位的作用在於令低音線條更流暢，避免低音大幅跳進。有一項描述的是移調；另一項描述的是改變和弦的三音（大小和弦的分別）；還有一項描述的是加入七音構成七和弦，三者都不是轉位。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_mus_hf_06","topic":"和聲・和弦與曲式","difficulty":"hard","question":"在大調中，以第二、三、六級音為根音所建立的三和弦，其性質是甚麼？","options":["三者都是小三和弦，與建於一、四、五級的大三和弦形成對比","三者都是大三和弦，與建於一、四、五級的和弦性質相同","三者都是減三和弦，因而在大調中極少被使用","三者都是增三和弦，因而聲響帶有明顯的不穩定感"],"correctIndex":0,"explanation":"在大調中，各級三和弦的性質由音階本身的全音半音排列決定，結果固定為：I、IV、V 為大三和弦；ii、iii、vi 為小三和弦；vii° 為減三和弦。因此第二、三、六級所建的都是小三和弦 —— 這正是大調作品中能夠出現柔和暗淡色彩的來源，例如 vi 級常用作假終止的落腳點。其中兩項與上述固定排列不符；增三和弦並非自然大調音階內任何一級的原生和弦，須經變化音才能構成。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_mus_hf_07","topic":"和聲・和弦與曲式","difficulty":"hard","question":"一段音樂由 C 大調轉入 G 大調。這兩個調的關係是甚麼？","options":["G 大調是 C 大調的屬調，兩者的調號只差一個升號","G 大調是 C 大調的關係小調，兩者共用完全相同的調號","G 大調是 C 大調的同名調，兩者的主音完全相同","G 大調是 C 大調的下屬調，兩者的調號只差一個降號"],"correctIndex":0,"explanation":"G 是 C 上方的完全五度，因此 G 大調是 C 大調的屬調；在五度圈上相鄰一格，調號由零個升號變成一個升號（F♯）。轉入屬調是古典時期最常見的轉調方向，奏鳴曲式呈示部第二主題往往就在屬調上。有一項不成立 —— C 大調的關係小調是 A 小調（同為零升零降），而且關係調必為一大一小；另一項的同名調指主音相同（如 C 大調與 C 小調），G 與 C 主音不同；還有一項方向倒轉，C 大調的下屬調是 F 大調（一個降號）。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_mus_hf_08","topic":"和聲・和弦與曲式","difficulty":"intermediate","question":"在樂曲中使用「持續低音」（pedal point）的常見效果是甚麼？","options":["低音長時間維持同一個音，上方和聲變化因而產生張力與期待","低音不斷快速跳動，因而令樂曲的節奏感顯著加強","低音完全消失一段時間，因而令織體變得輕盈通透","低音與旋律始終保持同度進行，因而令音響更為厚重"],"correctIndex":0,"explanation":"持續低音是低聲部持續維持同一個音（最常用主音或屬音），而上方各聲部的和聲繼續變化。由於上方和聲有時與這個持續音不協和，張力逐步累積，聽者會期待它最終解決 —— 因此屬持續音常見於樂段或全曲結束之前，用以蓄勢；主持續音則常用於確立調性中心。其餘三項所描述的低音行為（快速跳動、完全消失、與旋律同度）都不是持續低音，也不會產生上述的張力累積效果。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
