<script>
const DATA = [{"id":"econ_floor_01","topic":"生產可能線（PPF）","difficulty":"basic","question":"一個經濟體的產量組合正好落在生產可能線之上（線上的任何一點），這代表甚麼？","options":["現有資源已被充分而有效地運用","現有資源仍有一部分閒置未用","該經濟體並不需要付出機會成本","該經濟體的產量從此無法再增加"],"correctIndex":0,"explanation":"生產可能線顯示在既有資源與技術之下，兩種產品所有可達到的最大產量組合。線上的點代表資源已全部投入而且沒有浪費；線內的點代表有資源閒置或效率不足；線外的點在現階段做不到。要留意「充分運用」並不等於「沒有機會成本」——正因為資源已經用盡，要多生產一種產品就必須減產另一種，機會成本正是這條線要表達的核心訊息。至於產量能否再增加，取決於資源或技術會否改變，那是整條線移不移動的問題，並非線上某一點本身可以決定。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_02","topic":"生產可能線（PPF）","difficulty":"basic","question":"一條呈直線的生產可能線，反映兩種產品之間的機會成本有甚麼特性？","options":["隨其中一種產品增產而遞增","保持固定，不因產量組合改變","隨其中一種產品增產而遞減","在所有產量組合下都等於零"],"correctIndex":1,"explanation":"生產可能線的斜率就是機會成本。直線的斜率處處相同，所以無論在哪一點多生產一單位某產品，須放棄的另一種產品數量都一樣。這隱含一個假設：資源可以在兩種用途之間完全互換。現實中資源多數各有專長，把本來適合種米的土地改去建廠房，效率會愈來愈差，所以典型的生產可能線是向原點凸出的曲線，機會成本遞增。直線只是一個簡化情況，不是常態。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_03","topic":"生產可能線（PPF）","difficulty":"basic","question":"位於生產可能線以外（右上方）的產量組合，代表甚麼？","options":["已經達到最有效率的生產點","資源運用未達最有效的水平","以現有資源與技術無法達到","只會在完全競爭市場中出現"],"correctIndex":2,"explanation":"生產可能線是一條界線：線上與線內是做得到的，線外是做不到的。線外的組合並非「效率低」，而是根本超出現有生產能力。要達到那一點，必須整條線先向外移動，即資源增加或技術進步。把「線外」與「線內」的意思調轉，是這一課最常見的失分位——線內是有能力做卻做不好，線外是想做也做不到，兩者性質完全不同。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_04","topic":"生產可能線（PPF）","difficulty":"intermediate","question":"某國只在稻米生產上取得重大技術突破，布匹的生產技術完全不變。該國的生產可能線會如何變動？","options":["整條線位置不變，只是沿線移動位置","布匹一端向外伸展，稻米一端維持原位","整條線平行向外移動，兩端同幅增加","稻米一端向外伸展，布匹一端維持原位"],"correctIndex":3,"explanation":"生產可能線的兩個端點，分別代表把全部資源投入單一產品時的最大產量。稻米技術改良後，全力生產稻米的最大產量上升，所以稻米那一端向外伸展；布匹技術不變，全力生產布匹的最大產量不變，那一端維持原位。結果是整條線變得傾斜而非平行外移。只有當資源總量增加、或技術進步同時惠及兩種產品時，才會出現整條線平行外移。至於「沿線移動」是指在同一條線上改變產量組合，那是選擇問題，與技術改變無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_05","topic":"生產可能線（PPF）","difficulty":"intermediate","question":"某國的生產可能線上有兩點：甲點為 40 部電腦與 20 噸小麥，乙點為 25 部電腦與 50 噸小麥。由甲點移至乙點，每多生產一噸小麥的機會成本是多少部電腦？","options":["0.5 部電腦","2.0 部電腦","15 部電腦","30 部電腦"],"correctIndex":0,"explanation":"機會成本等於放棄的數量除以得到的數量。由甲點到乙點，電腦由 40 部減至 25 部，即放棄 15 部；小麥由 20 噸增至 50 噸，即得到 30 噸。因此每多生產一噸小麥，須放棄 15 ÷ 30 = 0.5 部電腦。最常見的錯誤是把兩個數字倒轉相除，得出 2.0，但那是「每部電腦的機會成本為 2 噸小麥」，並非題目所問。讀題時應先確認要求的是哪一種產品的機會成本，該產品的增加量就是分母。至於 15 與 30 只是變動的總量，不是每一單位的機會成本。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_06","topic":"生產可能線（PPF）","difficulty":"intermediate","question":"生產可能線之所以存在，最根本的原因是甚麼？","options":["市場價格暫時定得太低而造成短缺","資源相對於人的慾望而言是稀缺的","政府對生產施加了各種法例的限制","生產者刻意減產以抬高市場的價格"],"correctIndex":1,"explanation":"稀缺是經濟學的起點：資源有限而慾望無限，所以必須取捨，生產可能線正是把這種取捨畫出來。稀缺與短缺是兩個不同概念，考試常混用：稀缺是永久狀態，任何價格下都存在；短缺則是價格低於均衡水平時，需求量超過供應量的暫時現象，價格上調即可消除。法例限制與生產者減產都只會令實際產量落在線內，或令整條線移動，並不能解釋這條線為何一開始就存在。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_07","topic":"生產可能線（PPF）","difficulty":"hard","question":"甲、乙兩國的資源與技術本來完全相同。甲國把較大比例的資源用於生產資本財（機器、廠房），乙國則集中生產消費財。若其他條件不變，數年之後兩國的生產可能線最可能出現甚麼情況？","options":["兩國的線外移幅度大致相同","乙國的線外移幅度大於甲國","甲國的線外移幅度大於乙國","兩國的線都會向內收縮回落"],"correctIndex":2,"explanation":"資本財本身不供即時消費，但可以擴大日後的生產能力。甲國今日犧牲較多消費，換來的是數年後更多機器與廠房，可達到的最大產量組合整體上升，因此生產可能線外移較多。這正是這條線的跨期含意：今日在線上選擇哪一點，會影響明日這條線本身的位置。要補充的是，乙國並非做錯選擇——它以將來較慢的增長，換取今日較高的消費水平，這是一個取捨而非錯誤。答論述題時若寫成「乙國決策失誤」，會失去分析分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_08","topic":"宏觀計算（高階）","difficulty":"basic","question":"某住戶的可支配收入由 \\$10,000 增加至 \\$12,000，同期消費開支由 \\$8,000 增加至 \\$9,600。其邊際消費傾向（MPC）是多少？","options":["0.2","0.6","1.25","0.8"],"correctIndex":3,"explanation":"邊際消費傾向等於消費的變動除以可支配收入的變動。消費增加 \\$9,600 − \\$8,000 = \\$1,600，收入增加 \\$12,000 − \\$10,000 = \\$2,000，所以 MPC = 1,600 ÷ 2,000 = 0.8。留意這裏用的是「變動量」而非「總量」：若誤用 \\$8,000 ÷ \\$10,000 = 0.8 雖然數值碰巧相同，計算的其實是平均消費傾向，遇上其他數字就會出錯。另一個常見錯誤是把分子分母倒轉，得出 1.25。餘下的 0.2 是邊際儲蓄傾向，即 1 − MPC。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_09","topic":"宏觀計算（高階）","difficulty":"basic","question":"在一個簡單封閉經濟中，邊際儲蓄傾向（MPS）為 0.25。其支出乘數是多少？","options":["4","0.75","1.25","25"],"correctIndex":0,"explanation":"在簡單封閉經濟中，乘數等於 1 ÷ MPS，也等於 1 ÷ (1 − MPC)。代入 MPS = 0.25，乘數 = 1 ÷ 0.25 = 4。0.75 其實是 MPC，即 1 − 0.25，是計算途中的一個中間值而非答案；1.25 是把 1 加上 0.25；25 則是把小數誤讀成百分比。理解乘數為何大於 1 比記公式重要：一筆新開支成為某人的收入，該人再花掉其中 75% 成為下一個人的收入，如此遞減下去，總增幅是原本注入的四倍。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_10","topic":"宏觀計算（高階）","difficulty":"basic","question":"某經濟體去年的名義本地生產總值為 \\$500 億，今年為 \\$540 億。名義本地生產總值的增長率是多少？","options":["7.4%","8%","40%","4%"],"correctIndex":1,"explanation":"增長率等於變動量除以基期數值，再化成百分比。變動量為 \\$540 億 − \\$500 億 = \\$40 億，基期為去年的 \\$500 億，所以增長率 = 40 ÷ 500 = 8%。7.4% 是誤用今年的數值作分母（40 ÷ 540）；40% 是把變動的絕對數字直接當成百分比；4% 則是把 \\$40 億讀成百分比。凡計算增長率、通脹率或失業率的變動，分母一律是變動前的數值——這是同一個原則，記一次可以用在全卷。另外要留意，這條計算的是名義增長，未扣除物價變動，不能直接說生活水平上升了 8%。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_11","topic":"宏觀計算（高階）","difficulty":"intermediate","question":"某經濟體一年內的數據如下：私人消費 \\$400 億、投資 \\$120 億、政府開支 \\$180 億、出口 \\$260 億、進口 \\$210 億。以支出法計算，本地生產總值是多少？","options":["\\$700 億","\\$1,170 億","\\$750 億","\\$960 億"],"correctIndex":2,"explanation":"支出法的公式是 GDP = C + I + G + (X − M)。代入數字：400 + 120 + 180 + (260 − 210) = 400 + 120 + 180 + 50 = \\$750 億。三個干擾項各對應一個常見錯誤：\\$1,170 億是把進口加上去而非減去；\\$960 億是漏了減進口；\\$700 億是把整項淨出口一併漏掉。進口之所以要減，是因為 C、I、G 之中已經包含了購買外國貨品的開支，而那些貨品並非本地生產，若不扣除便會高估本地產出。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_12","topic":"宏觀計算（高階）","difficulty":"intermediate","question":"某經濟體的消費物價指數由二零二四年的 120 升至二零二五年的 126。二零二五年的通脹率是多少？","options":["26%","6%","4.8%","5%"],"correctIndex":3,"explanation":"通脹率是物價指數的百分比變動，而非指數點數的變動。指數上升 126 − 120 = 6 點，以基期 120 為分母，通脹率 = 6 ÷ 120 = 5%。6% 是把 6 點直接當成百分比，這是最常見的陷阱：指數本身沒有單位，點數變動要除以基期才有意義。4.8% 是誤用 126 作分母。26% 則是把指數數值本身讀成通脹率，忘記了基年指數定為 100，126 代表物價比基年高 26%，那是累積的物價升幅，不是這一年的通脹率。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_13","topic":"宏觀計算（高階）","difficulty":"intermediate","question":"某經濟體的勞動人口為 500 萬人，其中 480 萬人有工作。該經濟體的失業率是多少？","options":["4%","4.17%","20%","96%"],"correctIndex":0,"explanation":"失業率等於失業人數除以勞動人口。失業人數 = 500 萬 − 480 萬 = 20 萬，失業率 = 20 ÷ 500 = 4%。4.17% 是誤用就業人數 480 萬作分母；20% 是把 20 萬直接當成百分比；96% 是就業率而非失業率。要特別留意分母是「勞動人口」而不是「總人口」——學生、退休人士、以及沒有找工作的人都不計入勞動人口，所以失業率的高低亦受誰被界定為勞動人口影響。一個放棄求職的人會從失業人數中消失，失業率反而下跌，但就業情況並無改善。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_14","topic":"宏觀計算（高階）","difficulty":"intermediate","question":"某簡單封閉經濟的消費函數為 C = 100 + 0.6Y（單位：億元），投資 I = 60 億元，並無政府部門。均衡國民收入 Y 是多少？","options":["\\$160 億","\\$400 億","\\$266.7 億","\\$640 億"],"correctIndex":1,"explanation":"均衡的條件是總產出等於總開支，即 Y = C + I。代入消費函數：Y = 100 + 0.6Y + 60，整理得 Y − 0.6Y = 160，即 0.4Y = 160，所以 Y = 400。\\$160 億只是自主開支的總和（100 + 60），是計算途中的中間值；\\$266.7 億是誤把 160 除以 0.6；\\$640 億是把乘數 1 ÷ 0.4 = 2.5 誤算成 4 再乘以 160。另一條路徑是先求乘數 1 ÷ (1 − 0.6) = 2.5，再乘以自主開支 160，同樣得 400——兩條路徑必須一致，若不一致代表其中一步出錯，這是自我檢查的好方法。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_15","topic":"貿易與市場失靈","difficulty":"basic","question":"經濟學上的「共用品」具備以下哪一組特性？","options":["非競爭性與排他性","競爭性與排他性","非競爭性與非排他性","競爭性與非排他性"],"correctIndex":2,"explanation":"共用品有兩個必要特性。非競爭性指一個人享用不會減少其他人可享用的數量，例如國防或街燈的照明。非排他性指無法把不付錢的人排除在外。兩者同時成立，私人市場便難以收費，也就難以有足夠誘因去生產，這是市場失靈的一種，通常由政府提供。只有其中一項特性的，並非共用品：收費而又不擠迫的橋樑是非競爭但可排他，擠迫的公海漁場是競爭但難排他，兩者各有不同的政策問題。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_16","topic":"貿易與市場失靈","difficulty":"basic","question":"市民接種疫苗，除保護自己之外，亦降低身邊其他人受感染的機會。這種落在第三者身上的好處，在經濟學上稱為甚麼？","options":["生產者盈餘","外部成本","私人利益","外部利益"],"correctIndex":3,"explanation":"外部利益指某項行為為交易雙方以外的第三者帶來的好處。接種疫苗的人自己得到保護，那是私人利益；同時使他人染病機會下降，這部分好處並無反映在他所付的價格之中，屬於外部利益。由於決定接種與否時，個人只會考慮私人利益，社會整體的接種量會低於社會最適水平，這正是政府為疫苗提供資助或免費接種的理據。相對地，外部成本是加諸第三者的損害，例如工廠排污；生產者盈餘則是價格與供應價之間的差額，與第三者無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_17","topic":"貿易與市場失靈","difficulty":"basic","question":"政府對某入口商品徵收關稅，最直接的效果是甚麼？","options":["該入口商品在本地的售價上升","該入口商品在本地的售價下跌","本地同類生產者的產量下降","本地消費者的選擇因此增加"],"correctIndex":0,"explanation":"關稅是對入口商品徵收的稅，會推高該商品在本地市場的售價。價格上升之後，本地消費者購買量減少，本地同類生產者則因為競爭壓力減輕而增產——所以本地生產者的產量是上升而非下降。消費者的選擇亦會因入口減少而收窄。分析關稅時應按次序推：先看價格，再看買賣雙方的反應，最後才看政府收入與整體福利，不要一步跳到結論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_18","topic":"貿易與市場失靈","difficulty":"intermediate","question":"甲國生產任何一種產品所用的資源都少於乙國。根據國際貿易理論，下列哪項判斷最準確？","options":["甲國自行生產一切較為有利","兩國仍可按比較優勢分工並得益","乙國沒有可能從貿易中得益","貿易只會令甲國單方面受損"],"correctIndex":1,"explanation":"甲國在兩種產品上都有絕對優勢，但絕對優勢並非貿易的基礎。決定分工的是比較優勢，即機會成本較低的一方。即使乙國樣樣都較低效，它總有一種產品的機會成本相對較低，在那方面專業生產再與甲國交換，雙方都可以消費到超出各自生產可能線的組合。這是這一課最重要的一點：貿易的得益來自機會成本的差異，而非誰的生產力較高。只有當兩國的機會成本完全相同時，才沒有分工的空間。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_19","topic":"貿易與市場失靈","difficulty":"intermediate","question":"一條鄉村的居民都希望村口有街燈，但各人都盤算由別人付錢，自己照樣享用。這種情況在經濟學上稱為甚麼？","options":["邊際報酬遞減","價格分歧問題","免費乘車問題","規模經濟效益"],"correctIndex":2,"explanation":"免費乘車問題源於共用品的非排他性：街燈一旦點亮，不付錢的人同樣照得到，沒有人能被排除。既然如此，每個居民的理性選擇都是不出錢，結果是雖然人人都想要，街燈卻無人肯付費而建不成。這說明市場在共用品上會失靈，需要由政府以稅收統一支付。要注意問題不在於居民自私或不合作，而在於物品本身的性質令個人理性與集體利益背道而馳——答題時指出這一點，比單純寫「大家都不肯付錢」更能拿到分析分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_20","topic":"貿易與市場失靈","difficulty":"intermediate","question":"某工廠在生產過程中排放污染，造成外部成本。政府若要令產量回到社會最適水平，理論上應採取哪種做法？","options":["取消一切與該廠有關的稅項","按外部成本的大小向該廠津貼","規定該廠必須增加其產量","按外部成本的大小向該廠徵稅"],"correctIndex":3,"explanation":"外部成本令私人成本低於社會成本，廠商只按私人成本決定產量，結果生產過多。若政府徵收相當於外部成本的稅項，廠商所面對的成本便會提高至社會成本的水平，它自行選擇的產量就會回落到社會最適水平——這就是把外部成本「內部化」。津貼的方向相反，只會令產量更高；規定增產同樣加劇問題；取消稅項則等於進一步壓低私人成本。要留意這是理論上的做法，實際困難在於外部成本的金額難以準確量度。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_21","topic":"貿易與市場失靈","difficulty":"intermediate","question":"進口配額與關稅同樣可以限制入口數量，但兩者有一項重要分別。下列哪項描述正確？","options":["關稅為政府帶來收入，配額則不會","配額為政府帶來收入，關稅則不會","兩者都不會影響入口商品的售價","兩者都會令本地生產者減少產量"],"correctIndex":0,"explanation":"關稅按入口數量徵稅，每一單位入口都為政府帶來稅收。配額只是規定入口上限，政府並無收取款項；因供應受限而抬高的價格，其得益歸於獲配額的入口商，而非庫房。這是兩者最實在的分別。至於相同之處：兩者都會推高本地售價、減少入口，並令本地同類生產者增產而非減產。若配額以拍賣方式分配，政府亦可取得收入——但那是額外的制度安排，並非配額本身的特性。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_22","topic":"微觀計算（高階）","difficulty":"basic","question":"某商店以每件 \\$45 的價格售出 200 件貨品。其總收益是多少？","options":["\\$4,500","\\$9,000","\\$245","\\$900"],"correctIndex":1,"explanation":"總收益等於價格乘以銷售量，即 \\$45 × 200 = \\$9,000。\\$4,500 是誤乘 100；\\$245 是把價格與數量相加；\\$900 是漏了一個零。要留意總收益並非利潤——利潤要再減去總成本。試卷經常在同一條題目中同時給出價格、數量與成本數字，讀題時必須先確認所問的是收益、成本還是利潤，再選對應的公式。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_23","topic":"微觀計算（高階）","difficulty":"basic","question":"某廠商生產 250 單位產品，總成本為 \\$20,000。其平均成本是多少？","options":["\\$800","\\$8","\\$80","\\$12.5"],"correctIndex":2,"explanation":"平均成本等於總成本除以產量，即 \\$20,000 ÷ 250 = \\$80。\\$12.5 是把分子分母倒轉（250 ÷ 20,000 × 1,000），\\$8 與 \\$800 則是小數點放錯位置。平均成本的用途在於與價格比較：價格高於平均成本代表有經濟利潤，低於平均成本代表虧損。但決定短期是否停產的界線並非平均成本，而是平均變動成本——這一點在計算題中經常被混淆，值得分開記清楚。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_24","topic":"微觀計算（高階）","difficulty":"basic","question":"某廠商一年的總收益為 \\$150,000，總成本為 \\$118,000。其利潤是多少？","options":["\\$150,000","\\$268,000","\\$118,000","\\$32,000"],"correctIndex":3,"explanation":"利潤等於總收益減總成本，即 \\$150,000 − \\$118,000 = \\$32,000。\\$268,000 是把兩個數字相加；另外兩項則是把成本或收益本身當成利潤。要補充一點：經濟學所講的成本包括隱含成本，例如東主自己投入的時間與資金若用於其他用途本可賺取的回報。所以會計上有盈餘，經濟利潤仍可能是零甚至負數，這是經濟學與會計學在「成本」一詞上的關鍵分別。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_25","topic":"微觀計算（高階）","difficulty":"intermediate","question":"某廠商生產 10 單位時總成本為 \\$800，生產 11 單位時總成本為 \\$860。第 11 單位的邊際成本是多少？","options":["\\$60","\\$80","\\$78.2","\\$860"],"correctIndex":0,"explanation":"邊際成本是多生產一單位所引致的總成本增加，即 \\$860 − \\$800 = \\$60。\\$80 是產量 10 單位時的平均成本（800 ÷ 10）；\\$78.2 是產量 11 單位時的平均成本（860 ÷ 11）；\\$860 是總成本本身。三個干擾項都對應同一個誤解：把平均值當成邊際值。邊際看的是「多一單位帶來的變動」，平均看的是「攤分到每一單位」，兩者在數值上通常不同，只有在平均成本處於最低點時才相等。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_26","topic":"微觀計算（高階）","difficulty":"intermediate","question":"某勞動市場的均衡工資為每小時 \\$40。政府訂立每小時 \\$55 的最低工資。在 \\$55 的水平，勞動需求量為 8,000 人，勞動供應量為 11,000 人。結果是甚麼？","options":["出現 3,000 人的短缺","出現 3,000 人的過剩，即失業","出現 19,000 人的過剩","市場不會出現任何變化"],"correctIndex":1,"explanation":"最低工資是價格下限，訂於均衡之上才會生效。在 \\$55 時，願意工作的有 11,000 人，僱主只願聘 8,000 人，供應量超過需求量 3,000 人，形成勞動市場的過剩，這 3,000 人便是失業。19,000 是把兩個數字相加而非相減。價格上限與價格下限的方向必須分清：上限訂於均衡之下會造成短缺，下限訂於均衡之上會造成過剩。同時要注意，最低工資對已受聘的 8,000 人是工資上升，得益與損失同時存在，答論述題時兩面都要交代。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"econ_floor_27","topic":"微觀計算（高階）","difficulty":"intermediate","question":"某商品的價格由 \\$20 升至 \\$25，供應量由 400 件增至 500 件。以百分比法（以原值為基數）計算，供應價格彈性是多少？","options":["4，富彈性","0.25，缺乏彈性","1，單位彈性","0.8，缺乏彈性"],"correctIndex":2,"explanation":"供應價格彈性等於供應量的百分比變動除以價格的百分比變動。供應量變動 = (500 − 400) ÷ 400 = 25%；價格變動 = (25 − 20) ÷ 20 = 25%。兩者相除得 25% ÷ 25% = 1，屬單位彈性。0.25 是只計了其中一項的百分比變動；4 是把 100 除以 25；0.8 是誤用 400 ÷ 500。要留意供應彈性恆為正數，因為價格與供應量同向變動，這與需求彈性須取絕對值不同。彈性等於 1 是分界線：大於 1 為富彈性，小於 1 為缺乏彈性。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "economics";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
// ── 審核用時自動記錄 ──────────────────────────────────────────────────────
// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "economics-floor.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "economics-floor.decisions.json"; a.click();
});
counts();
</script></body></html>
