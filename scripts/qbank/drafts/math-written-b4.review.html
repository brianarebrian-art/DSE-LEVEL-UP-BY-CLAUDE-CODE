<script>
const DATA = [{"id":"math_w4_01","topic":"數系","difficulty":"basic","question":"試說明有理數與無理數的分別，並解釋為何 $\\sqrt{2}$ 屬無理數（只需說明判別方向，不需完整證明）。另舉出一個常被誤認為無理數的有理數。","explanation":"本題考核定義的準確性。常見錯誤是把有理數定義為「小數會終止的數」—— 循環小數同樣是有理數。正確的定義須以「可否寫成兩個整數之比」為準。\n最後一問針對一個實際的誤解：$0.333\\ldots$、$\\sqrt{4}$ 一類數看似「不整齊」或「帶根號」，實則為有理數。\n\nCasio 提示（fx-50FH II / 3650P）：機上顯示 $\\sqrt{2} = 1.414213562$，只有十位數字。⚠️ 顯示屏截斷並不代表小數在該處終止 —— 單憑計算器顯示【不能】判斷一個數是否無理數，兩者是不同層次的問題。","type":"text","referenceAnswer":"定義上的分別：\n有理數是可以寫成 $\\frac{p}{q}$ 形式的數，其中 $p$、$q$ 為整數且 $q \\neq 0$。\n無理數則不能寫成任何兩個整數之比。\n以小數形式判別：有理數的小數展開必定【終止】或【循環】；無理數的小數展開既不終止亦不循環。\n⚠️ 常見的錯誤定義：把有理數說成「小數會終止的數」。這是錯的 —— $\\frac{1}{3} = 0.333\\ldots$ 並不終止，但它明顯是兩個整數之比，屬有理數。循環小數全部都是有理數。\n\n為何 $\\sqrt{2}$ 屬無理數（判別方向）：\n採用反證法。假設 $\\sqrt{2}$ 為有理數，則可寫成最簡分數 $\\frac{p}{q}$，其中 $p$、$q$ 互質。\n兩邊平方得 $2 = \\frac{p^2}{q^2}$，即 $p^2 = 2q^2$。\n由此 $p^2$ 為偶數，故 $p$ 亦為偶數（奇數的平方必為奇數）。\n設 $p = 2m$，代入得 $4m^2 = 2q^2$，即 $q^2 = 2m^2$，同理 $q$ 亦為偶數。\n但 $p$ 與 $q$ 同為偶數，與「互質」矛盾。\n矛盾源於最初的假設，故 $\\sqrt{2}$ 不可能為有理數。\n\n常被誤認為無理數的有理數：\n例一：$\\sqrt{4} = 2$。帶根號並不等於無理 —— 完全平方數的平方根是整數。同理 $\\sqrt{0.25} = 0.5$、$\\sqrt[3]{8} = 2$ 皆為有理數。\n例二：$0.\\overline{3} = 0.333\\ldots = \\frac{1}{3}$。小數無限延伸，但因循環而仍屬有理數。\n例三：$\\frac{22}{7}$。此數常被當成 $\\pi$，但它本身是兩個整數之比，屬有理數；$\\pi$ 才是無理數，兩者只是數值接近（$\\frac{22}{7} \\approx 3.142857$，$\\pi \\approx 3.141593$）。\n判別的關鍵：不在於「看起來整齊與否」，亦不在於「有沒有根號」，而在於【能否寫成兩個整數之比】。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_02","topic":"因數與倍數","difficulty":"basic","question":"兩盞燈分別每 12 秒及每 18 秒閃一次，並在某一刻同時閃亮。\n(a) 求兩燈下次同時閃亮所需的時間。\n(b) 在其後的 3 分鐘內，兩燈共同時閃亮多少次？\n(c) 試說明本題應用的是最小公倍數而非最大公因數，並指出兩者各自適用於哪一類問題。","explanation":"(c) 是本題的重點。學生常把兩者混淆，因為兩者都由質因數分解求得。\n判別準則：問「幾時再一齊發生」屬倍數問題（LCM）；問「最大可以分成幾多份而不剩」屬因數問題（HCF）。\n(b) 須留意 3 分鐘 = 180 秒，而 $180 \\div 36 = 5$ —— 但須考慮起點是否計算在內。\n\nCasio 提示（fx-50FH II / 3650P）：機上並無 LCM／HCF 專用鍵。求 LCM 可先用質因數分解，或利用關係 $\\text{LCM} \\times \\text{HCF} = a \\times b$ —— 本題 $12 \\times 18 = 216$，$\\text{HCF} = 6$，故 $\\text{LCM} = 216 \\div 6 = 36$。此一關係只適用於【兩個】數，三個或以上並不成立。","type":"text","referenceAnswer":"(a) 兩燈同時閃亮的時刻，必須同時是 12 的倍數與 18 的倍數，即 12 與 18 的公倍數。下一次即最小公倍數。\n質因數分解：\n$12 = 2^2 \\times 3$\n$18 = 2 \\times 3^2$\nLCM 取各質因數的最高次冪：$2^2 \\times 3^2 = 4 \\times 9 = 36$。\n故 36 秒後兩燈再次同時閃亮。\n（核對：$36 \\div 12 = 3$ 次，$36 \\div 18 = 2$ 次，皆為整數 ✓）\n\n(b) 3 分鐘 $= 180$ 秒。\n同時閃亮的時刻為 $36, 72, 108, 144, 180$ 秒。\n$180 \\div 36 = 5$，故共 5 次。\n⚠️ 題目說「在其後的 3 分鐘內」，即由起始那一刻【之後】起計，故起點那一次不計入。若題目改為「包括起點在內」，則答案為 6 次。此類題目須留意起點是否計算在內。\n\n(c) 為何用最小公倍數：\n本題問的是「兩個周期性事件何時再次同時發生」。第一盞燈在 $12, 24, 36, \\ldots$ 秒閃亮，第二盞在 $18, 36, 54, \\ldots$ 秒閃亮。要兩者同時，該時刻必須【同時屬於兩張倍數表】，即為公倍數；「下一次」即最小的公倍數。\n最大公因數在此完全用不上 —— $\\text{HCF}(12, 18) = 6$，而 6 秒時第一盞燈尚未閃過第一次，第二盞亦未閃，兩者皆不會在 6 秒閃亮。\n\n兩者各自適用的問題類型：\n最小公倍數（LCM）適用於【合併／重複／同步】類問題：\n· 周期性事件何時再次同時發生（本題、巴士班次、行星會合）\n· 用相同的長方形磚鋪成最小的正方形，正方形邊長為兩邊長的 LCM\n· 通分母時所取的最小公分母\n共通特徵：答案【大於或等於】原有的數。\n\n最大公因數（HCF）適用於【分割／分配】類問題：\n· 把兩批不同數量的物品分成若干份相同的組合而無剩餘，最多可分幾組\n· 把一塊長方形地板用最大的正方形磚鋪滿而不用切割，磚的邊長為兩邊長的 HCF\n· 分數約至最簡時所除的數\n共通特徵：答案【小於或等於】原有的數。\n\n快速判別法：先問「答案應該比原本嘅數大定細？」\n要同步、要合併 → 答案較大 → LCM。\n要分割、要平均分 → 答案較小 → HCF。\n本題 36 秒 > 18 秒，符合 LCM 的方向；若誤用 HCF 得 6 秒，比兩個周期都短，一看即知不合理。此為一個有用的自我檢查。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_03","topic":"近似與誤差","difficulty":"basic","question":"某長方形的長量得為 $8.4$ 厘米、闊量得為 $5.2$ 厘米，兩者皆準確至最接近的 $0.1$ 厘米。\n(a) 寫出長與闊的可能範圍。\n(b) 求面積的最大可能值與最小可能值（準確至小數點後兩位）。\n(c) 試說明為何「面積 $= 8.4 \\times 5.2 = 43.68$ 平方厘米」這一寫法並不恰當。","explanation":"本題考核誤差傳遞。(a) 的關鍵是「準確至 0.1」表示絕對誤差上限為 $0.05$，而非 $0.1$。\n(c) 的重點在於有效數字：兩個兩位有效數字的量相乘，結果不可能有四位有效數字的精確度。寫出 43.68 等於聲稱了一個並不存在的精確度。\n\nCasio 提示（fx-50FH II / 3650P）：可直接計 $8.45 \\times 5.25$ 與 $8.35 \\times 5.15$。⚠️ 計算器會顯示十位數字，但顯示位數【不等於】有效數字 —— 輸入資料只有兩位有效數字，輸出無論顯示幾多位，可信的仍然只有兩位。這一點計算器不會提醒，須由使用者自行判斷。","type":"text","referenceAnswer":"(a) 「準確至最接近的 $0.1$ 厘米」表示真值與量得值相差不超過 $0.1 \\div 2 = 0.05$ 厘米。\n長 $L$：$8.35 \\leq L \u003c 8.45$（厘米）。\n闊 $W$：$5.15 \\leq W \u003c 5.25$（厘米）。\n\n(b) 面積 $= L \\times W$。由於兩者皆為正數，面積隨長與闊同時增大而增大。\n最大可能面積 $= 8.45 \\times 5.25 = 44.3625 \\approx 44.36$ 平方厘米。\n最小可能面積 $= 8.35 \\times 5.15 = 43.0025 \\approx 43.00$ 平方厘米。\n故面積介乎約 $43.00$ 至 $44.36$ 平方厘米之間。\n（嚴格而言上界為開區間，因 $L \u003c 8.45$；但按一般慣例取 $44.36$ 作為最大可能值。）\n\n(c) 為何該寫法不恰當：\n其一，它聲稱了一個不存在的精確度。\n$8.4$ 與 $5.2$ 各有兩位有效數字，其真值本身已有 $\\pm 0.05$ 的不確定。相乘之後，結果的不確定範圍由 $43.00$ 至 $44.36$，跨度約 $1.36$ 平方厘米。在此情況下寫「$43.68$」，等於聲稱結果精確到小數點後兩位，即誤差不超過 $0.005$ —— 比實際的不確定範圍細了二百多倍。\n其二，多出的數字並無資料支持。$43.68$ 之中的「$6$」與「$8$」，並非由量度得來，而是由計算器的乘法運算產生。輸入的資料本身不含這些位數的資訊，輸出自然亦不會有。計算不會【創造】精確度。\n其三，會誤導後續使用者。若此數字被寫入報告並用於其後的計算，讀者會以為量度相當精確，而實際上真值可能是 $43.1$，亦可能是 $44.3$。\n\n恰當的寫法：\n方式一（有效數字）：面積約為 $44$ 平方厘米（兩位有效數字，與輸入資料一致）。\n方式二（範圍）：面積介乎 $43.00$ 至 $44.36$ 平方厘米之間。\n方式三（帶誤差）：面積約為 $(43.7 \\pm 0.7)$ 平方厘米。\n三者皆誠實地反映了資料的精確度。\n通則：運算結果的有效數字位數，不應多於輸入資料之中最少的那一項。乘除運算尤其如此。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_04","topic":"一次函數","difficulty":"intermediate","question":"某電話台有兩個收費計劃。計劃甲：月費 $\\$60$，另每分鐘 $\\$0.5$。計劃乙：無月費，每分鐘 $\\$1.1$。\n(a) 分別寫出兩個計劃的月費總額 $y$ 與通話時間 $x$（分鐘）的函數關係。\n(b) 求兩個計劃收費相同時的通話時間。\n(c) 試說明應如何按通話習慣選擇計劃。","explanation":"本題考核一次函數的實際詮釋。(a) 須正確辨認常數項（月費）與斜率（每分鐘收費）。\n(b) 即求兩直線的交點。\n(c) 是重點：學生須指出交點【兩側】的優劣相反，並以斜率解釋原因 —— 計劃甲起點較高但增長較慢，故通話愈多愈划算。\n\nCasio 提示（fx-50FH II / 3650P）：可用 TABLE 模式同時觀察兩個函數，Start 50、End 150、Step 10，找出收費相等的大概位置，再以代數解精確值。⚠️ TABLE 只能逐個函數輸入，須分兩次；若步長太大會跳過交點，故只宜用作核對。","type":"text","referenceAnswer":"(a) 計劃甲：$y_A = 60 + 0.5x$。\n計劃乙：$y_B = 1.1x$。\n（$x \\geq 0$，以分鐘計。）\n說明：$60$ 為常數項，即通話時間為零時仍須繳付的月費，對應圖像的 $y$ 截距；$0.5$ 為斜率，即每增加一分鐘所增加的費用。計劃乙的 $y$ 截距為 $0$，斜率為 $1.1$。\n\n(b) 收費相同即 $y_A = y_B$：\n$60 + 0.5x = 1.1x$\n$60 = 1.1x - 0.5x$\n$60 = 0.6x$\n$x = 100$ 分鐘。\n此時收費 $= 1.1 \\times 100 = \\$110$（核對：$60 + 0.5 \\times 100 = 60 + 50 = \\$110$ ✓）。\n故通話 100 分鐘時，兩個計劃收費相同，皆為 $\\$110$。\n\n(c) 如何選擇：\n關鍵在於比較兩條直線的斜率與截距。\n計劃甲：起點高（$\\$60$）但斜率低（$0.5$）—— 先付一筆固定費用，之後每分鐘較便宜。\n計劃乙：起點低（$\\$0$）但斜率高（$1.1$）—— 不用即不付，但每分鐘較貴。\n兩者在 $x = 100$ 處相交，而交點兩側的優劣【相反】：\n當 $x \u003c 100$（每月通話少於 100 分鐘）：選【計劃乙】較便宜。\n例：$x = 50$ 時，甲 $= 60 + 25 = \\$85$，乙 $= \\$55$，乙便宜 $\\$30$。\n當 $x > 100$（每月通話多於 100 分鐘）：選【計劃甲】較便宜。\n例：$x = 200$ 時，甲 $= 60 + 100 = \\$160$，乙 $= \\$220$，甲便宜 $\\$60$。\n當 $x = 100$：兩者相同，可按其他因素（例如服務條款、合約期）決定。\n背後的原理：斜率較小的計劃，其優勢隨用量增加而累積。每多通話一分鐘，計劃甲比計劃乙少付 $1.1 - 0.5 = \\$0.6$。要抵銷起初多付的 $\\$60$ 月費，須通話 $60 \\div 0.6 = 100$ 分鐘 —— 這正是交點的由來，亦說明了為何交點的位置等於「固定費用差額 ÷ 每分鐘費用差額」。\n實際建議：用戶應先查看過去數月的實際通話分鐘數。若長期穩定在 100 分鐘以下，選乙；長期高於 100 分鐘，選甲；若上落甚大，則須計算平均值，並留意若干月份可能蝕底。\n⚠️ 須留意本模型的假設：兩個計劃的通話質素、覆蓋範圍、附加服務皆相同，且沒有合約期限制。實際選擇時這些因素同樣重要，而它們並不出現在函數之中。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_05","topic":"不等式","difficulty":"intermediate","question":"解不等式 $\\frac{2x-1}{3} - \\frac{x+2}{4} \\leq 1$，並在數線上表示解集。另說明在解不等式時，哪一種運算須把不等號方向反轉，以及為何。","explanation":"本題的計算部分不難，重點在最後一問。學生多數記得「乘以負數要調轉」，但說不出原因。\n正確的解釋是：乘以負數會把數線上的次序整體翻轉 —— 原本較大的數，乘負之後變成較小。\n須同時指出：加減任何數、乘除正數皆【不需】調轉。\n\nCasio 提示（fx-50FH II / 3650P）：可把求得的臨界值 $x = 10$ 代回原式核對等號成立；再代入 $x = 0$（應成立）與 $x = 12$（應不成立）驗證方向。⚠️ 計算器只能驗算個別數值，不能解不等式，方向對錯必須自行判斷。","type":"text","referenceAnswer":"解不等式：\n$\\frac{2x-1}{3} - \\frac{x+2}{4} \\leq 1$\n兩邊同乘 12（正數，方向【不變】）：\n$4(2x-1) - 3(x+2) \\leq 12$\n$8x - 4 - 3x - 6 \\leq 12$\n$5x - 10 \\leq 12$\n$5x \\leq 22$\n$x \\leq \\frac{22}{5} = 4.4$\n\n數線表示：\n在 $4.4$ 處畫一個【實心】圓點（因為含等號，$4.4$ 本身屬解集），由該點向【左】畫箭頭，表示所有小於或等於 $4.4$ 的實數。\n\n核對：\n代入 $x = 4.4$：$\\frac{8.8-1}{3} - \\frac{4.4+2}{4} = \\frac{7.8}{3} - \\frac{6.4}{4} = 2.6 - 1.6 = 1$ ✓（等號成立）\n代入 $x = 0$：$\\frac{-1}{3} - \\frac{2}{4} = -0.333 - 0.5 = -0.833 \\leq 1$ ✓\n代入 $x = 6$：$\\frac{11}{3} - \\frac{8}{4} = 3.667 - 2 = 1.667 > 1$ ✗（不屬解集，方向正確）\n\n哪一種運算須反轉不等號：\n【乘以或除以一個負數】時，必須把不等號方向反轉。\n其餘運算皆不需要：\n· 兩邊同加或同減任何數（不論正負）—— 方向不變\n· 兩邊同乘或同除一個【正】數 —— 方向不變\n\n為何：\n乘以負數會把整條數線的次序【翻轉】。\n以具體數字說明：已知 $3 \u003c 5$。\n兩邊同乘 $-1$：左方得 $-3$，右方得 $-5$。\n而 $-3 > -5$ —— 原本較小的 3 變成較大的 $-3$，次序倒轉了。\n若不調轉不等號而寫成 $-3 \u003c -5$，便是一個錯誤的陳述。\n\n幾何上的理解：在數線上，乘以 $-1$ 相當於以原點為中心作反射。反射之後，原本在左邊的點去了右邊，原本在右邊的去了左邊 —— 所有「誰比誰大」的關係一律對調。乘以任何負數皆可視為「乘 $-1$ 再乘一個正數」，前者翻轉次序，後者只改變距離而不改變次序，故整體效果就是翻轉一次。\n相反，乘以正數只是把各點按同一比例拉遠或推近，左右次序保持不變，故不等號方向不變。\n\n實際的常見陷阱：\n解 $-2x > 6$ 時，兩邊除以 $-2$：\n正確：$x \u003c -3$（方向反轉）\n錯誤：$x > -3$\n檢查方法：代入一個值。取 $x = -4$：$-2 \\times (-4) = 8 > 6$ ✓，故 $-4$ 屬解集。而 $-4 \u003c -3$，符合「$x \u003c -3$」，確認正確答案為前者。\n養成代值核對的習慣，可以在不確定方向時自行判斷，不必靠記憶。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_06","topic":"函數與建模","difficulty":"intermediate","question":"某小販以每件 $\\$x$ 出售一種飲品，實測每日銷量約為 $(200 - 4x)$ 件，每件成本為 $\\$10$。\n(a) 寫出每日利潤 $P$ 以 $x$ 表示的函數。\n(b) 求使利潤最大的售價及該最大利潤。\n(c) 試指出此模型的兩項限制。","explanation":"(b) 可用配方法或頂點公式 $x = -\\frac{b}{2a}$。\n(c) 是本題的重點，亦是「建模」與「純粹解方程」的分別所在。學生須指出模型的假設 —— 例如線性需求只在某一價格範圍內合理、$x$ 須令銷量為正、以及模型忽略了競爭與季節等因素。\n\nCasio 提示（fx-50FH II / 3650P）：可用 TABLE 模式輸入 $P(x) = -4x^2 + 240x - 2000$，Start 25、End 35、Step 1，觀察在 $x = 30$ 附近取得最大值，用以核對代數結果。⚠️ 若步長為 1 而頂點落在非整數處，表中便看不到真正的最大值，故只可用作核對而非求解。","type":"text","referenceAnswer":"(a) 每件利潤 $= $ 售價 $-$ 成本 $= x - 10$。\n每日銷量 $= 200 - 4x$ 件。\n每日利潤：\n$P(x) = (x - 10)(200 - 4x)$\n$= 200x - 4x^2 - 2000 + 40x$\n$= -4x^2 + 240x - 2000$。\n\n(b) 方法一（頂點公式）：\n$a = -4$，$b = 240$。\n$x = -\\frac{b}{2a} = -\\frac{240}{2(-4)} = \\frac{240}{8} = 30$。\n由於 $a = -4 \u003c 0$，拋物線開口向下，故 $x = 30$ 為極大點。\n方法二（配方法）：\n$P(x) = -4(x^2 - 60x) - 2000 = -4\\left[(x-30)^2 - 900\\right] - 2000 = -4(x-30)^2 + 3600 - 2000 = -4(x-30)^2 + 1600$。\n由於 $-4(x-30)^2 \\leq 0$，故 $P(x) \\leq 1600$，等號在 $x = 30$ 時成立。\n最大利潤 $= \\$1600$，售價為 $\\$30$。\n核對：$x = 30$ 時銷量 $= 200 - 120 = 80$ 件，每件賺 $30 - 10 = \\$20$，總利潤 $= 80 \\times 20 = \\$1600$ ✓。\n\n(c) 模型的限制：\n限制一：線性需求的假設只在有限的價格範圍內合理。\n模型假設每加價 $\\$1$，銷量即減少固定的 4 件，此一關係在觀測範圍之外未必成立。極端情況可見其不合理：$x = 50$ 時銷量為 $200 - 200 = 0$ 件，$x = 60$ 時更得出 $-40$ 件 —— 負數銷量並無意義。同樣，$x$ 極低時模型預測銷量接近 200 件，但實際上需求受人口、時間與飲用量限制，不會無限上升。\n故模型只在約 $10 \u003c x \u003c 50$ 的範圍內有意義，而其準確度亦只在實際觀測過的價格附近較高。\n限制二：模型忽略了大量實際因素。\n包括：競爭對手的定價（對手減價會令同一售價下的銷量下跌）、天氣與季節（炎熱日子飲品需求大增）、位置與人流、顧客對價格變動的心理反應（例如 $\\$29$ 與 $\\$30$ 在感覺上的差距大於 $\\$1$）、以及品牌與口碑的長期影響。這些因素全部不在函數之中，而它們在真實經營裡往往比價格本身影響更大。\n（其他可接受的限制：假設成本固定為每件 $\\$10$，忽略了大批入貨的折扣與存貨損耗；假設價格可以任意設定，忽略了實際上多以 $\\$0.5$ 或 $\\$1$ 為單位；假設每日情況相同，忽略了平日與假日的分別。）\n須補充的一點：指出限制並非否定模型的價值。此模型的用處，在於它指出了一個重要的結構 —— 加價會減少銷量，兩者的乘積存在一個最佳點，而該點既不在最高價亦不在最低價。這一洞察即使在模型不準確時仍然成立。恰當的做法是把 $\\$30$ 視為一個【參考起點】，再按實際觀察調整，而非當成精確的答案。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_07","topic":"數列","difficulty":"intermediate","question":"某數列首三項為 $3, 7, 11$。\n(a) 若該數列為等差數列，求第 20 項及首 20 項之和。\n(b) 有學生由首三項斷定該數列必為等差數列。試評論此一推論。","explanation":"(b) 是本題的重點：有限項數不能決定整個數列。學生須舉出一個首三項同為 $3, 7, 11$ 但並非等差的數列作反例。\n此點與 §16 常見的推論謬誤同源 —— 由有限的觀察推出全稱結論。\n\nCasio 提示（fx-50FH II / 3650P）：等差數列求和可用 $S_n = \\frac{n}{2}[2a + (n-1)d]$，把 $a$、$d$ 分別存入記憶 A、B，再把公式存為 PROG 程式以 $n$ 為輸入。⚠️ 切勿逐項相加 20 次 —— 既慢，而且中途出錯不易察覺。","type":"text","referenceAnswer":"(a) 若為等差數列：\n首項 $a = 3$。\n公差 $d = 7 - 3 = 4$（核對：$11 - 7 = 4$ ✓）。\n第 $n$ 項：$T_n = a + (n-1)d$。\n$T_{20} = 3 + 19 \\times 4 = 3 + 76 = 79$。\n首 $n$ 項之和：$S_n = \\frac{n}{2}[2a + (n-1)d]$。\n$S_{20} = \\frac{20}{2}[2(3) + 19(4)] = 10 \\times [6 + 76] = 10 \\times 82 = 820$。\n（亦可用 $S_n = \\frac{n}{2}(a + T_n) = \\frac{20}{2}(3 + 79) = 10 \\times 82 = 820$ ✓，兩式互相核對。）\n\n(b) 評論：\n此一推論【不成立】。首三項只提供三個資料點，而符合這三點的數列有無限多個，等差數列只是其中之一。\n更準確的講法是：首三項與「等差」這一假設【相容】，但並未證明它。\n反例一：考慮 $T_n = n^3 - 6n^2 + 15n - 7$。\n$T_1 = 1 - 6 + 15 - 7 = 3$ ✓\n$T_2 = 8 - 24 + 30 - 7 = 7$ ✓\n$T_3 = 27 - 54 + 45 - 7 = 11$ ✓\n$T_4 = 64 - 96 + 60 - 7 = 21$（而等差數列的第 4 項應為 15）\n首三項完全相同，第四項已經分道揚鑣。\n反例二：更簡單的構造 —— 直接定義數列為「$3, 7, 11$，其後每項皆為 $11$」。首三項同樣符合，但顯然並非等差。\n一般性的說明：給定任意 $k$ 個數，必定可以找到一條 $k-1$ 次多項式穿過這 $k$ 點，亦可以構造無限多條其他規律。因此無論觀察多少項，皆不能【邏輯上】確定其後的項。\n那麼實務上應如何處理？\n其一，若題目【明示】為等差數列，則可直接使用公式，此時假設由題目提供，並非由學生推斷。本題 (a) 正是如此，故 (a) 的做法完全正確。\n其二，若題目只給出若干項而問「下一項是甚麼」，最合理的做法是找出最簡單而符合已知項的規律，並【註明所作的假設】。這是一個合理的猜測，不是證明。\n其三，若需要確定，必須有數列的定義式或遞歸關係，而非僅有若干項。\n結論：數學上「符合已知資料」與「已被證明」是兩件事。前者只表示未被推翻，後者才是確立。這一分別在數列、在統計推論、以至在任何由觀察推導規律的場合，同樣適用。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_08","topic":"軌跡與坐標","difficulty":"hard","question":"設 $A(-2, 0)$ 及 $B(4, 0)$ 為兩定點。動點 $P$ 使 $PA = PB$。\n(a) 求 $P$ 的軌跡方程，並描述其幾何意義。\n(b) 若改為 $PA = 2PB$，求 $P$ 的軌跡方程，並指出其為何種圖形。\n(c) 試比較兩者，並說明條件的細微改變如何令軌跡的性質完全不同。","explanation":"(a) 為垂直平分線，(b) 則為圓（阿波羅尼奧斯圓）。兩者的分別在於：$PA = PB$ 時平方展開後 $x^2$、$y^2$ 項互相抵銷，剩下一次方程；$PA = 2PB$ 時係數不同，平方項無法抵銷，故得二次方程。\n(c) 要求學生指出【為何】會有此分別，而非只描述結果。\n\nCasio 提示（fx-50FH II / 3650P）：可代入具體點核對。(a) 取 $x = 1$、$y = 3$，計 $PA = \\sqrt{9+9}$、$PB = \\sqrt{9+9}$，兩者相等 ✓。(b) 求得圓心與半徑之後，取圓上一點代回 $PA = 2PB$ 驗證。⚠️ 計算器只能驗證個別點，不能推導軌跡方程。","type":"text","referenceAnswer":"(a) 設 $P(x, y)$。\n$PA = \\sqrt{(x+2)^2 + y^2}$，$PB = \\sqrt{(x-4)^2 + y^2}$。\n由 $PA = PB$，兩邊平方：\n$(x+2)^2 + y^2 = (x-4)^2 + y^2$\n$x^2 + 4x + 4 + y^2 = x^2 - 8x + 16 + y^2$\n$x^2$ 與 $y^2$ 兩邊【完全抵銷】：\n$4x + 4 = -8x + 16$\n$12x = 12$\n$x = 1$。\n幾何意義：軌跡為直線 $x = 1$，即一條垂直於 $x$ 軸的直線。\n此線正是線段 $AB$ 的【垂直平分線】—— $A(-2,0)$ 與 $B(4,0)$ 的中點為 $\\left(\\frac{-2+4}{2}, 0\\right) = (1, 0)$，而 $AB$ 沿 $x$ 軸，其垂直平分線自然是過 $(1,0)$ 而垂直於 $x$ 軸的直線，即 $x = 1$ ✓。\n\n(b) 由 $PA = 2PB$，兩邊平方：\n$(x+2)^2 + y^2 = 4\\left[(x-4)^2 + y^2\\right]$\n$x^2 + 4x + 4 + y^2 = 4(x^2 - 8x + 16) + 4y^2$\n$x^2 + 4x + 4 + y^2 = 4x^2 - 32x + 64 + 4y^2$\n移項：\n$0 = 3x^2 - 36x + 60 + 3y^2$\n兩邊除以 3：\n$x^2 - 12x + 20 + y^2 = 0$\n配方：\n$(x - 6)^2 - 36 + y^2 + 20 = 0$\n$(x-6)^2 + y^2 = 16$。\n圖形：以 $(6, 0)$ 為圓心、半徑 $4$ 的【圓】。\n核對：取圓上一點 $(10, 0)$。$PA = |10 - (-2)| = 12$，$PB = |10 - 4| = 6$，$PA = 2PB$ ✓。\n再取 $(2, 0)$：$PA = 4$，$PB = 2$，$PA = 2PB$ ✓。\n\n(c) 比較與說明：\n表面上，兩個條件只差一個係數（$1$ 對 $2$），但軌跡由【直線】變成【圓】—— 由一次曲線變成二次曲線，性質完全不同。\n原因在代數步驟之中：\n情況 (a)：$(x+2)^2 + y^2 = (x-4)^2 + y^2$。兩邊的 $x^2$ 係數皆為 $1$、$y^2$ 係數皆為 $1$，相減之後【全部抵銷】，只剩下 $x$ 的一次項與常數，故得一次方程，圖像為直線。\n情況 (b)：$(x+2)^2 + y^2 = 4\\left[(x-4)^2 + y^2\\right]$。右方的 $x^2$ 係數變成 $4$，左方仍為 $1$，相減之後剩下 $3x^2$；$y^2$ 同理剩下 $3y^2$。二次項無法抵銷，故必然得出二次方程，而 $x^2$ 與 $y^2$ 係數相同且同號，圖像即為圓。\n一般化：若條件為 $PA = kPB$（$k > 0$），則\n· $k = 1$ 時，二次項抵銷，軌跡為 $AB$ 的垂直平分線（直線）。\n· $k \\neq 1$ 時，二次項不抵銷，軌跡為一個圓，稱為【阿波羅尼奧斯圓】。\n可見 $k = 1$ 是一個【臨界值】：它是唯一令二次項消失的取值。當 $k$ 由 $0.99$ 變至 $1$ 再變至 $1.01$，軌跡由一個很大的圓，瞬間變成直線，再變回另一側的一個很大的圓。直線可理解為「半徑無限大的圓」，此一觀點令兩種情況統一起來。\n更廣泛的啟示：\n數學中此類「臨界值」甚為常見 —— 一個參數在某一特定取值時，方程的次數、解的個數或圖形的類型會突然改變。例如二次方程 $ax^2+bx+c=0$ 在 $a = 0$ 時退化為一次方程；判別式 $b^2-4ac$ 在等於零時解由兩個變成一個。\n因此，解題時遇到含參數的條件，應養成習慣問一句：【這個參數有沒有某些取值會令情況本質上改變？】此一問題往往正是題目的考點所在。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_09","topic":"三維三角學","difficulty":"hard","question":"一個長方體的長、闊、高分別為 $6$、$8$、$10$ 厘米。設 $A$ 為底面一角，$G$ 為與之相對的頂面角（體對角線的另一端）。\n(a) 求底面對角線的長度。\n(b) 求體對角線 $AG$ 的長度。\n(c) 求 $AG$ 與底面所成的角（準確至小數點後一位）。\n(d) 試說明為何處理三維問題時，須先辨認一個包含所求角的直角三角形。","explanation":"本題考核三維問題的標準處理方法：把三維問題化為一連串二維直角三角形。\n(c) 的關鍵在於辨認正確的直角三角形 —— 由 $A$、底面對角線的另一端、以及 $G$ 三點組成，其中垂直邊為高 $10$，水平邊為底面對角線 $10$。\n學生常見錯誤是用長或闊（$6$ 或 $8$）作水平邊，而非底面對角線。\n\nCasio 提示（fx-50FH II / 3650P）：⚠️ 計算 $\\tan^{-1}$ 之前，必須確認角度單位為 DEG（顯示屏有 D 標示）。若停留在 RAD 模式，(c) 會得出 $0.785$ 而非 $45.0$ —— 該數值看似合理，但單位完全錯誤。此為三角題最常見而最難自行察覺的失分原因。","type":"text","referenceAnswer":"設長方體的底面為 $6 \\times 8$ 的長方形，高為 $10$。\n\n(a) 底面對角線：\n底面為長方形，兩邊為 $6$ 與 $8$，對角線由畢氏定理：\n$d = \\sqrt{6^2 + 8^2} = \\sqrt{36 + 64} = \\sqrt{100} = 10$ 厘米。\n\n(b) 體對角線：\n考慮直角三角形，其一邊為底面對角線（水平，長 $10$），另一邊為高（垂直，長 $10$），斜邊即 $AG$。\n兩者互相垂直（底面對角線在水平面內，高垂直於水平面）。\n$AG = \\sqrt{10^2 + 10^2} = \\sqrt{100 + 100} = \\sqrt{200} = 10\\sqrt{2} \\approx 14.14$ 厘米。\n（亦可直接用公式 $AG = \\sqrt{6^2+8^2+10^2} = \\sqrt{200}$，此式正是把上述兩步合併。）\n\n(c) $AG$ 與底面所成的角：\n所求的角，是 $AG$ 與它在底面上的投影之間的夾角。$AG$ 在底面的投影，正是底面對角線。\n在 (b) 所述的直角三角形中：\n· 鄰邊（底面對角線）$= 10$\n· 對邊（高）$= 10$\n$\\tan\\theta = \\frac{\\text{對邊}}{\\text{鄰邊}} = \\frac{10}{10} = 1$\n$\\theta = \\tan^{-1}(1) = 45.0°$。\n⚠️ 常見錯誤：以長 $6$ 或闊 $8$ 作鄰邊，得 $\\tan^{-1}(10/8) = 51.3°$ 或 $\\tan^{-1}(10/6) = 59.0°$ —— 兩者皆錯，因為 $AG$ 在底面的投影是【對角線】而非任何一條邊。\n\n(d) 為何須先辨認直角三角形：\n其一，三角比只在直角三角形中有定義。\n$\\sin$、$\\cos$、$\\tan$ 的基本定義（對邊、鄰邊、斜邊之比）以直角三角形為前提。若所辨認的三角形並非直角三角形，這些比值便不能直接使用，須改用正弦定律或餘弦定律 —— 而後兩者在 DSE 三維題中較少直接適用，因為所需的邊角資料往往不齊。\n其二，三維圖形本身無法直接量度角度。\n立體圖形中的線與面之間的關係，肉眼在平面圖上容易誤判。把問題化為一個【平面上的】直角三角形，即把三維問題轉為熟悉的二維計算，可靠得多。\n其三，辨認的過程本身就是解題的關鍵步驟。\n三維題的難點通常不在計算，而在【找出正確的三角形】。本題 (c) 即為例子：計算只是一步 $\\tan^{-1}(1)$，但若三角形認錯，該步無論多準確都是錯的。\n\n辨認的通用方法（以「直線與平面的夾角」為例）：\n第一步，找出該直線在平面上的【投影】。方法是由直線的端點向平面作垂線，垂足與另一端點的連線即為投影。本題中，由 $G$ 向底面作垂線，垂足正是底面對角線的另一端，故投影即底面對角線。\n第二步，所求的角，就是原直線與其投影之間的夾角。\n第三步，原直線、投影、以及那條垂線，三者恰好構成一個直角三角形，直角在垂足處。\n第四步，把已知的長度填入該三角形，選用適當的三角比求角。\n此一程序適用於絕大部分「直線與平面夾角」的題目，值得熟記。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"math_w4_10","topic":"排列與組合","difficulty":"hard","question":"有 5 名男生及 4 名女生排成一行拍照。\n(a) 求所有可能的排法。\n(b) 若 4 名女生必須相鄰，求排法數目。\n(c) 若任何兩名女生皆不可相鄰，求排法數目。\n(d) 試說明 (b) 與 (c) 所用的方法為何不同，並指出 (c) 不可用「總數減去 (b)」求得的原因。","explanation":"(b) 用【捆綁法】：把 4 名女生視為一個整體，與 5 名男生共 6 個單位排列，再乘以女生內部的排法。\n(c) 用【插空法】：先排 5 名男生，形成 6 個空位，再由其中選 4 個放女生。\n(d) 是本題的重點。「不可相鄰」的反面並非「全部相鄰」—— 兩者之間存在大量中間情況（例如恰好兩名女生相鄰）。此為典型的邏輯陷阱。\n\nCasio 提示（fx-50FH II / 3650P）：$9! = 362880$ 可用階乘鍵直接求得。⚠️ 階乘增長極快，$14!$ 已超出十位顯示而轉為科學記數法，$70!$ 更會溢位報錯。遇到大數階乘時，宜先約簡再計算 —— 例如 $\\frac{9!}{5!} = 9 \\times 8 \\times 7 \\times 6$，直接計四個數的積，比先求兩個階乘再相除安全得多。","type":"text","referenceAnswer":"(a) 9 人排成一行，全部相異：\n$9! = 362880$ 種。\n\n(b) 捆綁法：\n第一步，把 4 名女生視為一個整體（一個「大單位」）。此時要排列的是：5 名男生 ＋ 1 個大單位 $= 6$ 個單位。\n$6! = 720$ 種。\n第二步，大單位內部，4 名女生自己亦可互換位置：\n$4! = 24$ 種。\n由乘法原理：\n$6! \\times 4! = 720 \\times 24 = 17280$ 種。\n\n(c) 插空法：\n第一步，先排 5 名男生：$5! = 120$ 種。\n第二步，5 名男生排好後，形成 6 個空位（兩端各一，中間四個）：\n$\\_ \\; B \\; \\_ \\; B \\; \\_ \\; B \\; \\_ \\; B \\; \\_ \\; B \\; \\_$\n第三步，由這 6 個空位中選 4 個放女生，且每個空位最多放一人（如此便保證任何兩名女生之間必隔著至少一名男生）。\n選位並安排 4 名相異的女生，即排列：$P(6, 4) = 6 \\times 5 \\times 4 \\times 3 = 360$ 種。\n總數 $= 5! \\times P(6,4) = 120 \\times 360 = 43200$ 種。\n\n(d) 為何方法不同，以及為何不可相減：\n方法不同的原因：\n「必須相鄰」是一個【正面】的、集中的條件 —— 它指定 4 名女生佔據連續的 4 個位置。既然位置連續，最自然的做法就是把她們當成一個整體先安排位置，再處理內部次序。此即捆綁法。\n「不可相鄰」則是一個【分散】的條件 —— 它要求任何兩名女生之間至少隔一人。直接數符合此條件的排法非常困難，因為限制同時作用於多對女生。改為先安排男生、再把女生「插」入既有的空位，則限制自動被滿足（每個空位最多一人，即保證有間隔）。此即插空法。\n兩種方法的共通策略是：把難以直接處理的限制，轉化為一個【自動滿足限制】的構造程序。\n\n為何不可用「總數減 (b)」：\n此一想法假設了「全部相鄰」與「全部不相鄰」互為補集，即兩者合起來涵蓋所有情況。但事實並非如此。\n考慮以下排法：$G_1 G_2 B_1 G_3 B_2 G_4 B_3 B_4 B_5$。\n· 它【不屬於】(b)：4 名女生並非全部相鄰（$G_3$ 與 $G_4$ 被男生分開）。\n· 它亦【不屬於】(c)：$G_1$ 與 $G_2$ 相鄰，違反「任何兩名女生皆不相鄰」。\n此排法落在兩者之外，故 (b) 與 (c) 並非互補。\n驗證：$362880 - 17280 = 345600 \\neq 43200$。兩者相差 $302400$，正是那些「部分相鄰」的情況 —— 恰有兩名相鄰、恰有三名相鄰、分成兩對相鄰等等。\n\n正確的互補關係：\n(b) 的補集是「並非全部 4 名女生相鄰」，數目為 $362880 - 17280 = 345600$。\n(c) 的補集是「至少有兩名女生相鄰」，數目為 $362880 - 43200 = 319680$。\n兩個補集各自對應不同的條件，不可混用。\n\n一般性的教訓：\n使用「總數減去反面」（補集法）之前，必須確認所減的集合【真的是】所求集合的補集，即兩者合起來恰好涵蓋全部、且互不重疊。\n判別方法：寫出一個具體的例子，檢查它是否必然落入兩者之一。若能找到一個兩者皆不屬的例子，補集關係即不成立。\n此一檢查只需數秒，卻可避免一整題的方向性錯誤。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "math";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
// ── 審核用時自動記錄 ──────────────────────────────────────────────────────
// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，

  const out = { _meta: { source: "math-written-b4.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "math-written-b4.decisions.json"; a.click();
});
