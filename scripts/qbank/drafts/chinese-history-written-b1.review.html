<script>
const DATA = [{"id":"chh_w1_01","topic":"秦漢至隋唐制度","difficulty":"basic","question":"試指出隋唐科舉制度與魏晉九品中正制在【選任準則】及【選任權歸屬】兩方面的分別，並說明科舉制對中央集權的作用。","explanation":"本題要求比較兩項制度，而比較題的評分關鍵在於【逐項對應】—— 兩個制度須就同一個維度並列說明，而非各自描述一遍。答案分「準則」與「權力歸屬」兩段，正是因為題目已經指定了這兩個維度；把兩項制度的內容各寫一大段而不作對照，即使史實無誤亦難取高分。\n作用一項須寫出機制而非結論。「加強中央集權」是結論，「取錄權收歸中央，官員的升遷繫於朝廷，故忠誠對象由家族轉向皇帝」才是機制。留意科舉在唐代仍未完全取代門蔭，世族的影響力至唐末方明顯下降；若行文寫成「科舉一出，門閥即滅」，屬過度推論。","type":"text","referenceAnswer":"選任準則的分別：\n九品中正制以家世門第為重要依據，中正官品評人物時，家世往往壓倒才學，形成「上品無寒門，下品無勢族」的局面。\n科舉制以考試成績為準，應試者按試卷所顯示的學養與文才取錄，家世並非正式的評定標準。\n選任權歸屬的分別：\n九品中正制的品評權在地方中正官手中，而中正官多出自當地世族，故選任權實際上落在地方門閥。\n科舉制的取錄權收歸中央，由朝廷統一設科、命題、閱卷與授官，地方無從左右。\n對中央集權的作用：\n其一，切斷世族壟斷仕途的途徑，削弱門閥的政治基礎，使地方勢力難以世代把持官位。\n其二，官員的出身與升遷繫於朝廷，忠誠對象由家族轉向皇帝，中央對官僚系統的控制因而加強。\n其三，向寒門開放入仕之路，擴大了統治基礎，使更多士人願意經體制內的途徑求取功名，而非依附地方勢力。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chh_w1_02","topic":"晚清變局","difficulty":"intermediate","question":"試就洋務運動作答：\n（a）指出洋務運動的兩項主要內容，並說明其所依據的基本主張。\n（b）從三個方面評述洋務運動的成效與局限。\n（c）有論者認為「甲午戰敗證明洋務運動完全失敗」。試評論此說法。","explanation":"（b）要求「三個方面」，故必須自行設定三個分析維度並逐一評述。軍事、經濟、制度是最穩妥的一組，因為三者恰好覆蓋了洋務運動的實際內容，而且能自然帶出「器物層面有成而制度層面未動」這條主線。每個方面都要成效與局限兼備 —— 只寫成效或只寫局限，該項最多取一半分數。\n（c）屬史事評價題，最忌一面倒。良好的答案通常分兩層：先承認批評成立之處，再指出其過度之處，最後提出一個更準確的表述。留意本題的關鍵在「完全」二字 —— 題目要評論的並非「洋務運動有否失敗」，而是「是否完全失敗」，兩者是不同的問題。能夠抓住這個限定詞，即已把握了評論的方向。","type":"long","referenceAnswer":"（a）兩項主要內容：\n其一，創辦軍事工業與新式海陸軍。設立江南製造總局、福州船政局等，並籌建北洋、南洋等水師，以求取得可與列強相抗的武備。\n其二，興辦民用企業與新式教育。開辦輪船招商局、開平礦務局等官督商辦企業，並設立同文館、派遣幼童留學，以培養通曉洋務的人才。\n基本主張：「中學為體，西學為用」。即中國固有的政治制度與綱常倫理為根本，不容更動；西方所長僅在船堅炮利與器物技術，取其技術以自強即可。\n（b）三個方面的成效與局限：\n軍事方面 —— 成效：建立了近代軍事工業的基礎，北洋艦隊一度為亞洲規模較大的海軍力量。局限：艦船購自外洋而維修補給依賴外人，軍費屢遭挪用，各支水師互不統屬，難以協同作戰。\n經濟方面 —— 成效：官督商辦企業引入近代生產與經營方式，開礦、航運、電報等新式行業自此起步，客觀上促成了中國近代工業的萌芽。局限：官督商辦體制之下，官方掌握決策而商股承擔風險，經營受官場積習牽制，效率有限；企業亦多為壟斷性質，未能形成競爭。\n制度方面 —— 成效：設立總理衙門與新式學堂，開始培養通曉外語與技術的專門人才。局限：政治制度、科舉取士與官僚體制均未觸動，新式人才在舊體制內難以晉升，所學亦難以推廣。\n（c）此說法過於絕對，須分兩層評論。\n第一層，就其自身目標而言，洋務運動確實失敗。它以「自強」為目的，而甲午一戰，經營三十年的北洋艦隊全軍覆沒，敗於同樣起步不久的日本，說明僅以器物技術求自強的路徑無法達到預期效果。就此而論，批評成立。\n第二層，「完全失敗」則不能成立。運動所建立的近代工業、交通、電報與新式學堂並未隨戰敗而消失，反而成為此後改革的物質與人才基礎；經此一役，朝野始知變法不能止於器物，戊戌變法與清末新政的思想動力，正由此而生。\n更公允的評價是：洋務運動失敗於它自我設定的限度 ——「中體西用」預先排除了制度變革，而甲午的意義正在於證明這條界線劃錯了。指出這一點，比單以成敗論定更能說明該運動在近代史上的位置。","markingScheme":"（a）3 分 —— 兩項主要內容各 1 分，須有具體事例（機構、企業或學堂名稱）；「中學為體，西學為用」的主張並說明其含意（1）。\n（b）4 分 —— 三個方面各須成效與局限，齊備者每方面 1 分（共 3 分）；另 1 分予能點出「器物有成而制度未動」這條貫串三者的主線。\n（c）3 分 —— 承認批評成立的一面並舉出甲午的證據（1）；指出「完全失敗」不成立並舉出延續下來的影響（1）；提出更準確的表述，指出其失敗於自設的限度（1）。一面倒的答案最多 1 分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":18,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chh_w1_03","topic":"辛亥革命","difficulty":"intermediate","question":"（a）指出辛亥革命爆發的三項主要背景因素，並說明其中一項如何直接促成武昌起義。\n（b）辛亥革命推翻了帝制，卻未能建立穩固的共和政體。試從兩個角度解釋此結果。\n（c）試評述辛亥革命在中國近代史上的歷史意義。","explanation":"（a）的第二部分要求指出「直接促成」的一項，這與「背景因素」並非同一層次：背景是長期積累的條件，直接促成則須交代一條可以追蹤的因果鏈 —— 鐵路國有引發保路運動，朝廷調兵入川，武昌空虛，革命黨乘機起事。凡題目出現「直接」二字，答案就要有這樣一條逐步推進的敘述，而非再列一項長期因素。\n（b）示範歷史科的一項基本判斷：政權更替與權力結構的改變並非同一回事。帝制被推翻是頂端的變化，而支撐舊秩序的軍隊、官僚與地方勢力仍在，故新制度無所憑依。能夠把「名號改變」與「實力結構未變」分開陳述，是本題取分的關鍵。\n（c）宜正反兼備。只頌其功而不言其限，或只論其未竟而不認其成，都不是評述。末段的綜合尤為重要 —— 它把前面三點連成一個判斷，而非停留在羅列。","type":"long","referenceAnswer":"（a）三項主要背景因素：\n其一，清廷改革的失信。庚子之後推行新政，然一九一一年五月組成的內閣十三人之中，皇族佔多數，時人稱之為「皇族內閣」，立憲派對朝廷經和平途徑實現改革的期望因而落空，部分轉而同情革命。\n其二，革命思想與組織的積累。興中會、同盟會相繼成立，革命團體在海外籌款、在新軍中發展成員，並先後發動多次起義；雖屢遭挫敗，卻使革命主張廣為傳播，亦訓練了骨幹。\n其三，社會經濟矛盾激化。列強勢力深入，賠款負擔沉重，苛捐雜稅轉嫁民間，民生困苦，地方對中央的離心力上升。\n直接促成武昌起義的一項：鐵路國有政策所引發的保路運動。一九一一年五月清廷宣布幹線鐵路收歸國有，並將築路權轉予外國銀行團，四川等省紳商群起反對，釀成大規模風潮。清廷抽調湖北新軍入川鎮壓，武昌兵力因而空虛，革命黨人遂得乘機於十月十日發動起義。\n（b）兩個角度：\n角度一 —— 革命力量本身的局限。同盟會成員來源複雜，缺乏統一的組織紀律與明確的施政綱領；革命主要依靠新軍與會黨，未能深入動員農村。武昌起義後各省雖紛紛響應，然多由原有的督撫、諮議局或立憲派人士主持，實際權力並未轉移至革命黨手中。\n角度二 —— 舊有勢力的延續。清帝退位以袁世凱掌握北洋軍為條件，政權實際由手握軍隊者接收。帝制雖除，而軍隊私屬、地方割據、官僚結構等基礎並未觸動；共和只換了名號，支撐舊秩序的實力結構原封不動，故此後有洪憲帝制與軍閥混戰之局。\n（c）歷史意義可從三方面評述：\n其一，結束了在中國延續二千餘年的君主專制制度，此為最直接而不可逆的成果。此後無論政局如何反覆，帝制均不再具備正當性 —— 袁世凱稱帝迅速失敗，即為明證。\n其二，使共和觀念深入人心。民主共和成為此後各種政治主張都須援引的話語，即使實際政治遠未達致，觀念上的轉變已不可回頭。\n其三，未能完成反帝反封建的任務。不平等條約依舊，列強勢力未減，農村社會結構亦無改變，故其成果有限。\n綜合而言，辛亥革命的意義在於它拆除了舊制度的頂端，卻未觸及其基礎；正因如此，它既是近代中國政治轉型的起點，亦是此後數十年動盪的起點。","markingScheme":"（a）4 分 —— 三項背景因素各 1 分，須有具體史實；直接促成武昌起義的因果鏈完整（1）。只寫「清廷腐敗」等籠統說法不給分。\n（b）3 分 —— 革命力量本身的局限（1）；舊有勢力延續、袁世凱掌握北洋軍（1）；明確指出帝制已除而支撐舊秩序的實力結構未變（1）。\n（c）2 分 —— 正面意義至少兩項（1）；指出未竟之處並作出綜合判斷（1）。一面倒者最多 1 分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":16,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chh_w1_04","topic":"中共建國至改革","difficulty":"intermediate","question":"試指出一九七八年以後中國經濟改革在【農村】及【對外開放】兩方面的主要措施，並說明兩者在改革次序上的關係。","explanation":"本題的分數集中在最後一問。前兩部分屬史實記述，只要措施具體、名稱準確即可取分；而「次序上的關係」則要求解釋為何是這個先後，而非另一個。答案的兩條理由都值得記住：農村改革先行，是因為改動小、見效快，且為城市改革提供基礎；對外開放採試點方式，是為了把制度風險限制在局部。\n中國歷史科的評卷相當重視能否指出貫串性的模式，而「先局部試驗、後全面推開」正是這一段歷史最明顯的一條。作答時若只列措施而不觸及次序背後的邏輯，通常只能取得一半分數。留意家庭聯產承包責任制並非把土地私有化 —— 所有權仍屬集體，寫成「分田到戶即土地私有」屬史實錯誤。","type":"text","referenceAnswer":"農村方面：\n推行家庭聯產承包責任制。土地所有權仍屬集體，而經營權下放至農戶；農戶完成國家徵購與集體提留之後，餘下產品可自行支配。此舉把勞動所得與付出直接掛鈎，扭轉了人民公社時期「幹多幹少一個樣」的狀況，農業產量與農民收入隨之上升。其後又逐步放開農產品價格，並容許鄉鎮企業發展，吸納農村剩餘勞動力。\n對外開放方面：\n先設經濟特區，一九八零年起在深圳、珠海、汕頭、廈門設立，繼而開放沿海港口城市，再擴及沿海經濟開放區，形成由點到線、由線到面的格局。特區以優惠稅制與較靈活的管理制度吸引外資、引進技術與管理經驗。\n次序上的關係：\n兩者並非並行的平等關係，而是先易後難、由局部到全局的安排。農村改革先行，因為它所需的制度改動較小、見效較快，而農業增產亦為城市改革與工業發展提供了糧食與原料的基礎，並釋放出勞動力。\n對外開放則採取先行試點的方式，把制度風險限制在特定地域之內；特區的做法一旦證明可行，再逐步推廣。這種「先局部試驗、後全面推開」的方式，貫穿整個改革過程，亦是理解此段歷史的一條主線。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chh_w1_05","topic":"宋元明清","difficulty":"hard","question":"宋代與明代同樣加強君主權力，但採取的方式並不相同。\n（a）分別說明宋太祖與明太祖在削弱大臣權力方面所採取的主要措施。\n（b）比較兩者在【手段】及【後果】上的分別。\n（c）有論者認為「宋代重文輕武導致積弱，故其集權措施得不償失」。試評論此說法。","explanation":"（b）是本題的核心，而比較的維度已由題目指定：手段與後果。良好的答案會為兩種手段各找到一個概括性的說法 —— 宋為「分權制衡」，明為「廢除與監控」—— 因為有了概括，比較才不至於淪為史實的並排羅列。後果一項尤須注意明代的弔詭之處：廢相本為集權，結果卻造成宦官專權，即措施產生了與其目的相反的效果。能指出這一點，屬高層次的分析。\n（c）示範評論題的一種穩健結構：承認、補充、重新界定。第三點最關鍵 —— 它指出批評者把兩個不同的問題放在同一天平上比較，因而所謂「得不償失」的計算本身不成立。歷史評價題經常需要這一步：不是判斷結論的對錯，而是先檢查用以判斷的尺是否合適。","type":"long","referenceAnswer":"（a）宋太祖：\n以「杯酒釋兵權」解除禁軍將領的兵權，改由資歷較淺者統兵；設樞密院掌調兵之權，而統兵之權另屬三衙，使調兵者不統兵、統兵者不調兵。\n又分割宰相職權：政事歸中書，軍事歸樞密院，財政歸三司，宰相不再總攬全局。\n地方方面，派文臣出任知州，另設通判監察，並將地方精兵收歸中央編為禁軍，財賦大部上繳。\n明太祖：\n以胡惟庸案為契機，廢除自秦漢以來的丞相之職，並廢中書省，六部直接向皇帝負責，行政大權集於一身。\n又廢行中書省，改設承宣布政使司、提刑按察使司、都指揮使司分掌地方民政、司法與軍事，三者互不統屬。\n另設錦衣衛，後又有東廠，以特務機構直接監察百官。\n（b）手段上的分別：\n宋太祖採【分權制衡】—— 職權並未取消，而是拆散於不同機構，使任何一方均不能獨大。宰相仍在，只是其權被分割；將領仍在，只是調兵與統兵分離。\n明太祖採【廢除與監控】—— 直接取消丞相一職，使中間層不復存在，並以特務機構補足監察。前者是把權力打散，後者是把權力收回並加以監視。\n後果上的分別：\n宋代的分權制衡有效防止了權臣與藩鎮之患，終宋一代未有武將篡位；但機構重疊、事權分散，行政效率低下，冗官冗費日增，軍事指揮亦因分權而失卻機動。\n明代廢相之後，皇帝直領六部，決策效率視乎皇帝本人的勤怠而定；至明中葉皇帝怠政，內閣與宦官遂填補權力真空，形成宦官專權之局 —— 廢相本為集權，最終卻造成另一種權力旁落。\n（c）此說法有其根據，但論斷過於簡化，須分三點評論。\n其一，「重文輕武導致積弱」有事實支持。以文臣統軍、將領頻繁調動以防其擁兵自重，確實削弱了軍隊的戰鬥力與指揮的連貫性；北宋對遼、夏用兵屢屢受挫，與此不無關係。\n其二，然而積弱的成因並非單一。北宋所面對的是遊牧政權騎兵之利與燕雲十六州失守後的地理劣勢，此為唐末五代遺留的形勢，非集權措施所致；冗官冗兵所造成的財政負擔，亦有其制度以外的成因。\n其三，評價集權措施不能只計代價而不計其所避免的後果。唐末五代八十餘年間，藩鎮割據、武人擅權、政權頻繁更迭，宋初的措施正是針對此一局面而設，而它確實達到了目的 —— 兩宋三百餘年，未有武將篡奪之事。若無此制度，宋代能否維持長期統一，本身即為疑問。\n故較公允的表述是：宋代的集權措施解決了它所要解決的問題，代價則落在軍事效能與行政成本之上。所謂「得不償失」，是以後見之明，把它未能解決的問題（外患）與它成功解決的問題（內亂）放在同一天平上比較，而這兩者並非同一個問題。","markingScheme":"（a）4 分 —— 宋太祖的措施 2 分（軍權與相權各 1 分，須具體）；明太祖的措施 2 分（廢丞相 1 分，地方分權或特務機構 1 分）。\n（b）3 分 —— 手段的概括對比，宋為分權、明為廢除與監控（1）；宋代後果，內亂已防而效率低下（1）；明代後果，廢相反致宦官專權（1）。\n（c）3 分 —— 承認重文輕武對軍力的影響（1）；補充積弱的其他成因（1）；指出評價須計及所避免的後果，或指出批評者混淆了兩個不同問題（1）。一面倒者最多 1 分。\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":18,"trapTypes":null,"dnaTag":null,"mother":null}];

  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "chinese-history-written-b1.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "chinese-history-written-b1.decisions.json"; a.click();
});
counts();
</script></body></html>
