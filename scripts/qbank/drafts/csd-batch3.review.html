<script>
const DATA = [{"id":"csd-b3-01","topic":"「一國兩制」與憲制秩序","difficulty":"basic","question":"《基本法》規定香港特別行政區享有高度自治權。就「高度自治」的來源而言，下列哪一項理解最為準確？","options":["高度自治權是特區成立之時本身已經擁有的固有權力，中央只作確認","高度自治權由中央授予，並非特區固有的權力","高度自治權由《基本法》與國際條約共同賦予，兩者缺一不可","高度自治權的具體範圍由特區按其實際需要自行界定及調整"],"correctIndex":1,"explanation":"單一制國家之下，地方行政區域的權力來自中央授權。特區的高度自治權由全國人民代表大會透過《基本法》授予，並非特區自身固有，亦不能由特區自行擴充。\n\n【干擾項剖析】「固有權力」把授權關係說成天然存在，屬概念倒置；「由國際條約共同賦予」混淆了《中英聯合聲明》的歷史背景與現行憲制依據；「範圍由特區自行界定」與授權關係直接矛盾——授權者才能界定授權範圍。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-02","topic":"「一國兩制」與憲制秩序","difficulty":"intermediate","question":"有評論認為，行政長官既要向中央人民政府負責，亦要向香港特別行政區負責，此一「雙負責」安排會令問責變得含糊。就《基本法》的制度設計而言，下列哪一項回應最為恰當？","options":["兩重負責意味行政長官可按事情性質自行選擇向哪一方交代","兩重負責只是條文上的禮節性表述，並不產生任何具體的制度要求","兩重負責針對不同事項，各有明確對象與範圍，並非同一事項的兩個標準","兩重負責在同一事項上必然互相衝突，故實際運作中只有向中央負責一項生效"],"correctIndex":2,"explanation":"行政長官向中央負責，主要涉及《基本法》所定屬於中央事權的事項，例如執行中央發出的指令、就特區整體施政向中央述職；向特區負責則體現於須向立法會作施政報告、答覆質詢及受監督。兩者對象與事項不同，屬分工而非同一事項的雙重標準。\n\n【干擾項剖析】「必然衝突」把制度分工誤讀為零和關係，屬過度推論；「只是禮節性表述」否定條文的規範效力，與述職、答覆質詢等具體安排不符；「可自行選擇」把制度義務說成個人裁量，屬張冠李戴。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-03","topic":"「一國兩制」與憲制秩序","difficulty":"intermediate","question":"全國人民代表大會常務委員會對《基本法》條文作出解釋後，香港法院在其後審理同類案件時應如何處理？","options":["法院可自行決定是否採納，因為司法獨立令法院不受任何解釋約束","該解釋只對內地各級法院具有效力，對香港特別行政區法院並無約束力","法院只在中央就該案另行發出具體指令時，方須依照該解釋處理","須以該解釋為準，並按解釋適用於其後的案件"],"correctIndex":3,"explanation":"《基本法》的解釋權屬於全國人民代表大會常務委員會。人大釋法一經作出，即構成條文含義的權威說明，香港法院在其後的案件中須以之為準。司法獨立指法院審判時不受干預，與條文由誰作最終解釋屬兩個不同層次的問題。\n\n【干擾項剖析】「可自行決定是否採納」把司法獨立擴大為不受任何規範約束，屬過度推論；「須另有指令才跟從」增添了條文並無的前提條件；「只適用於內地法院」直接與解釋權的憲制安排相悖。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-04","topic":"「一國兩制」與憲制秩序","difficulty":"hard","question":"有意見認為，中央對特區的全面管治權與特區的高度自治權互相排斥，二者不可並存。就制度邏輯而言，下列哪一項評價最為合理？","options":["二者屬互不相干的兩套平行制度，各自在自己的範圍之內獨立運作","二者屬同一制度的兩個層次：全面管治權是授權的來源，高度自治權是授權的內容","二者能否並存，完全取決於特區政府與中央之間的政治關係是否良好","二者確實互相排斥，故實際運作之中必然有一方會被架空而形同虛設"],"correctIndex":1,"explanation":"授權關係之下，授權者保有全面管治權，被授權者行使獲授的自治權，兩者是同一制度的上下兩層，而非互相競爭的兩種權力。若無授權主體，高度自治權便無從產生；若授權後不予落實，授權亦失去意義。\n\n【干擾項剖析】「必有一方形同虛設」把層次關係誤讀為此消彼長，屬過度推論；「取決於政治關係」把憲制安排說成情勢產物，混淆了規範與事實；「平行而互不相干」否定授權關係本身，與單一制國家結構不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-05","topic":"法治、權利與責任","difficulty":"basic","question":"法治的層次由低至高可分為「有法可依」、「有法必依」、「以法限權」及「以法達義」。下列哪一項最能體現「以法限權」？","options":["立法機關通過新條例，逐項訂明各類違法行為的罰則","政府部門的決定可由法院覆核，越權者其決定會被撤銷","市民違反交通規則後被警方檢控並須繳付定額罰款","政府增撥資源大量增聘執法人員，以加強日常巡查工作"],"correctIndex":1,"explanation":"「以法限權」的核心在於法律約束的對象是公權力本身。司法覆核容許法院審查行政決定是否越權，正是以法律限制政府權力的制度體現。\n\n【干擾項剖析】市民被檢控屬「有法必依」，約束對象是市民而非政府；訂立條例及罰則屬「有法可依」，只是規則的存在；增聘執法人員屬執行力度問題，與是否限制公權力無關。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-06","topic":"法治、權利與責任","difficulty":"intermediate","question":"有市民認為「我有言論自由，所以我發表任何內容都不應受法律追究」。就權利與責任的關係而言，此說的主要問題在於甚麼？","options":["言論自由只在私人場合之內適用，於公開場合發表則不受保障","權利的主體只限於已成年的市民，未成年人並不享有言論自由","言論自由並非香港現行法律所保障的權利，故此說本身並無法律依據","混淆了權利受保障與權利不受任何限制，忽略行使權利時對他人權利的責任"],"correctIndex":3,"explanation":"權利受保障不等於權利絕對。行使言論自由時，若損害他人名譽、煽動他人犯罪或危害公共安全，仍須承擔相應法律責任。權利與責任並存，正是公民身分的基本內容。\n\n【干擾項剖析】「並非法律所保障」與《基本法》及相關人權條文不符，屬事實錯誤；「只屬於成年人」把權利主體任意收窄；「只在私人場合適用」把保障範圍倒轉——公開表達正是言論自由的典型情境。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-07","topic":"法治、權利與責任","difficulty":"intermediate","question":"司法獨立的制度保障包括法官的任免程序、任期保障及薪酬不受隨意削減。這些安排的共同用意最能說明甚麼？","options":["減少法官在審判時受外來壓力影響的可能","確保法官所作的判決，能夠與政府當時的政策方向保持一致","令法官可以按個人專長，自行決定接手審理哪一類案件","提高司法機構處理案件的行政效率，縮短案件輪候的時間"],"correctIndex":0,"explanation":"上述安排均針對同一風險：若法官的職位或待遇可被任意處置，判決便可能因顧慮而傾斜。保障任期與薪酬，是為了令法官在裁決時無須考慮個人得失。\n\n【干擾項剖析】「與政策方向一致」正是司法獨立要避免的情況，屬概念倒置；「提高行政效率」與獨立性無關，屬張冠李戴；「自行決定審理哪些案件」涉及案件分配，並非獨立性的內容。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-08","topic":"法治、權利與責任","difficulty":"hard","question":"某條例授權部門首長在「有需要時」限制某項活動，但未訂明何謂「有需要」，亦無覆核途徑。就法治原則而言，此一立法設計最值得關注之處是甚麼？","options":["權力範圍不確定且缺乏制衡，市民無法預知法律後果，亦難以挑戰決定","條例授權的對象是部門首長而非法院，凡行政授權皆屬違憲","條例以中文訂立而未有英文本，故其適用範圍受到語文限制","條例並未訂明任何罰則，因此該項授權條文並不具備法律效力"],"correctIndex":0,"explanation":"法治要求法律具備可預見性，並要求公權力受到制衡。條文以「有需要時」授權而不加界定，市民無從預知何種情況會受限制；同時欠缺覆核途徑，決定即使越權亦難以糾正。兩者結合，正是「以法限權」失效的典型情境。\n\n【干擾項剖析】「授權對象非法院即必然違憲」把行政授權一概否定，屬過度推論——行政機關獲授權本身並不違憲，問題在於界限與制衡；「無罰則即無效力」混淆了授權條文與罰則條文；「以中文訂立故適用受限」與法例的語文地位不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-09","topic":"香港社會與參與","difficulty":"basic","question":"人口老化會同時影響勞動力供應與公共開支。就其對公共財政的影響而言，下列哪一項推論最為直接？","options":["醫療及安老開支會顯著上升，但稅收總額不會因人口結構改變而受影響","納稅人口比例下降，而醫療及安老服務開支上升，收支壓力同時來自兩端","納稅人口比例會下降，但公共服務的開支水平可以維持完全不變","人口老化只改變人口的年齡分佈，對公共財政收支並無實質影響"],"correctIndex":1,"explanation":"人口老化的結構性影響是雙向的：勞動年齡人口比例下降令稅基收窄，而長者人口增加令醫療、安老及福利開支上升。分析公共財政壓力時，兩端須同時考慮，只計其一會低估影響。\n\n【干擾項剖析】「只有開支上升」與「只有稅收下降」各自只取一端，屬分析不完整；「並無實質影響」與人口結構同財政收支的關係不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-10","topic":"香港社會與參與","difficulty":"basic","question":"公民參與可分為不同形式，例如投票、參與公眾諮詢、加入志願組織及向立法會議員反映意見。這些形式的共同特徵是甚麼？","options":["均須事先具備相關專業資格或受過專門訓練，方可正式參與","均只能由已登記為選民的市民進行，其他居民並無參與途徑","均是在既定制度渠道之內，就公共事務表達意見或作出貢獻","均會直接改變政府的最終決定，參與者實質上握有決策權"],"correctIndex":2,"explanation":"上述活動的共通點在於：均屬制度容許的渠道，而參與者藉此就公共事務發聲或付出。參與門檻、參與者身分及成效各有不同，但性質一致。\n\n【干擾項剖析】「需具專業資格」與志願服務、公眾諮詢的開放性不符；「只限已登記選民」只適用於投票，屬以偏概全；「直接改變政府決定」誇大了參與的效果——參與提供意見與影響，並不等同決定權。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-11","topic":"香港社會與參與","difficulty":"intermediate","question":"有研究指出，房屋負擔能力下降會同時影響青年的居住安排、成家時間及儲蓄模式。此一觀察最能說明社會議題的哪一項特性？","options":["社會議題的成因必然只有一個，找出該成因即可完全解決問題","社會議題所產生的影響只會出現在經濟層面，不涉其他生活範疇","青年面對的困難與房屋政策分屬不同範疇，兩者互不相干","單一議題往往牽連多個生活範疇，難以只用單一政策工具處理"],"correctIndex":3,"explanation":"房屋負擔能力屬經濟議題，但其影響延伸至居住、家庭與理財決定，跨越經濟、社會及人生規劃多個層面。這種連鎖性說明處理社會議題時，須考慮政策的跨範疇影響。\n\n【干擾項剖析】「成因必然只有一個」與題幹所示的多重影響相反，屬簡化推論；「互不相干」直接否定題幹所述的關聯；「只在經濟層面」忽略了成家時間等非經濟影響，屬半對半錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-12","topic":"香港社會與參與","difficulty":"intermediate","question":"政府就一項規劃方案進行公眾諮詢，收到大量意見後修訂了部分內容。有意見批評諮詢「只是形式」。要判斷此批評是否成立，最應該檢視下列哪一項？","options":["收集到的主要意見與最終修訂之間有否對應關係，以及未採納者有否交代理由","諮詢期是否安排在長假期之內進行，以致市民難以抽空回應","政府在展開諮詢之前，是否已經擬備了方案的初步草稿","參與是次諮詢的市民人數，是否超過同類諮詢的一般水平"],"correctIndex":0,"explanation":"判斷諮詢是否流於形式，關鍵在於意見與結果之間有否可追溯的關係：哪些意見被採納、哪些未被採納及其理由。有此交代，諮詢便具實質作用；若結果與意見完全無關且不作說明，形式化的批評方能成立。\n\n【干擾項剖析】參與人數多寡不等於意見有否被考慮；諮詢期時間安排可能影響參與度，但屬程序便利問題，並非實質性的判準；諮詢前備有初稿屬正常做法，本身並不構成形式化。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-13","topic":"改革開放與國家發展","difficulty":"basic","question":"改革開放初期設立經濟特區，其主要作用最能以下列哪一項概括？","options":["即時全面取代原有的計劃經濟體制，令全國同步進入市場經濟","專門用作吸納農村的剩餘勞動力，本身並無政策試驗的作用","在可控範圍內先行試驗新的經濟政策，取得經驗後再逐步推廣","把全國各地的經濟政策一次過同步改變，令改革在同一時間展開"],"correctIndex":2,"explanation":"經濟特區的核心作用在於「先行先試」：在有限地域試行外資引進、企業管理及市場機制等新做法，觀察成效與問題後再決定是否推廣。這種漸進方式可控制改革風險。\n\n【干擾項剖析】「一次過同步改變」與設立特區的局部性直接矛盾；「即時全面市場化」誇大了初期改革的幅度；「並無政策試驗作用」否定了特區設立的主要目的，屬以次要功能取代主要功能。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-14","topic":"改革開放與國家發展","difficulty":"intermediate","question":"國家推行區域協調發展策略，例如粵港澳大灣區建設。就「協調」二字的政策含義而言，下列哪一項理解最為準確？","options":["區內各地的發展速度必須完全一致，任何一地都不可以領先或落後","各地按自身優勢分工並加強互聯互通，以整體效益為目標，而非各自獨立發展","由區內單一城市主導全部規劃，其餘城市按其安排作依附式發展","區內各地取消自身既有產業，全部改由中央統一分配新的分工"],"correctIndex":1,"explanation":"區域協調的重點在於分工與聯通：各地保留並發揮自身優勢，同時透過基礎設施、要素流動及制度銜接形成整體。目標是整體效益提升，而非速度劃一或角色取代。\n\n【干擾項剖析】「速度完全一致」把協調誤解為平均主義；「單一城市主導、其餘依附」與優勢互補的原則相反；「取消自身產業統一安排」與保留各地優勢的做法直接矛盾。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-15","topic":"改革開放與國家發展","difficulty":"intermediate","question":"評估脫貧政策的成效時，除了統計脫貧人數，還應考慮甚麼，方能判斷成果是否穩固？","options":["脫貧人口的收入來源是否穩定，以及有否防止返貧的後續支援","獲派往參與扶貧工作的官員人數，是否足以覆蓋所有目標地區","單一年度之內的脫貧人數，是否已經達到歷年以來的最高水平","扶貧政策文件的內容是否足夠詳盡，各項措施有否逐一列明"],"correctIndex":0,"explanation":"脫貧人數屬結果指標，但若收入來源不穩定或缺乏後續支援，已脫貧者可能因病、因災或因產業變動而返貧。判斷成果是否穩固，須看收入的持續性與防返貧機制，而非單一時點的數字。\n\n【干擾項剖析】文件篇幅與官員人數屬投入面，與成效並無必然關係；「單一年度達到最高」把短期峰值當成穩固，正是題目要求排除的判斷方式。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-16","topic":"改革開放與國家發展","difficulty":"hard","question":"有意見認為，經濟增長速度放緩即代表發展政策失敗。就國家由高速增長轉向高質量發展的政策取向而言，此說的主要問題是甚麼？","options":["以單一速度指標評價一項目標已包含結構、環境與分配的政策，評價標準與政策目標不對應","增長速度放緩必然由外部環境變化造成，與內部政策調整無關","經濟增長速度在任何發展階段之中，都不屬於值得參考的指標","高質量發展本身必然會帶來比過去更高的經濟增長速度"],"correctIndex":0,"explanation":"高質量發展的目標包括產業結構升級、環境承載、區域協調及收入分配等多個面向，其中部分目標與短期增速之間存在取捨。以單一速度指標判斷成敗，等於用與政策目標不一致的標準作評價。\n\n【干擾項剖析】「任何情況下都不重要」把批評矯枉過正，增速仍是重要指標之一；「必然帶來更高增速」把兩者關係說成必然，屬過度推論；「必然由外部因素造成」把成因單一化，忽略了主動調整的可能。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-17","topic":"科技創新與綜合國力","difficulty":"basic","question":"「創新驅動發展」強調由要素投入轉向創新推動。此一轉變的主要原因最能以下列哪一項說明？","options":["創新可以完全取代經濟體對資本投入的需求，令投資變得多餘","單靠增加土地、勞動力及資本投入，長遠會遇到報酬遞減與資源約束","創新驅動的模式只適用於服務業，並不適用於製造業的發展","增加土地、勞動力及資本的投入，在任何發展階段都不會帶來增長"],"correctIndex":1,"explanation":"以要素投入推動增長，在發展初期成效明顯，但當土地、勞動力及資本的可增幅度受限，且邊際報酬下降時，增長便難以為繼。轉向創新，目的是提高同樣投入之下的產出效率。\n\n【干擾項剖析】「任何階段都不能帶來增長」與發展初期的實際情況不符；「完全取代對資本的需求」誇大了創新的作用——創新本身亦需投資；「只適用於服務業」與製造業技術升級的事實相反。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-18","topic":"科技創新與綜合國力","difficulty":"intermediate","question":"綜合國力並非只由經濟規模決定，還包括科技水平、教育質素、文化影響力及國防能力等。此一概念設計的用意最能說明甚麼？","options":["綜合國力各項組成部分的重要性完全相同，不存在任何輕重之分","國家實力屬多維度概念，單一指標不足以反映整體狀況","經濟規模與國家實力之間並無關係，故不應納入綜合國力的考慮","綜合國力最終只能以軍事力量衡量，其餘各項均屬次要的參考"],"correctIndex":1,"explanation":"綜合國力之所以稱為「綜合」，正因為國家實力由多個相互支撐的方面構成：經濟提供物質基礎，科技與教育決定長遠潛力，文化影響力與國防能力則涉及對外關係。只看其中一項，會得出片面結論。\n\n【干擾項剖析】「與經濟規模並無關係」把多維度誤解為排除經濟；「重要性完全相同」增添了概念本身並無的假設；「只能以軍事力量衡量」正是綜合國力概念要糾正的單一化理解。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-19","topic":"科技創新與綜合國力","difficulty":"intermediate","question":"數字經濟發展同時帶來效率提升與新的治理課題，例如個人資料保障與平台市場地位。就政策取態而言，下列哪一項最能反映「發展與規範並重」？","options":["先讓市場全面放任發展，待出現嚴重問題之後才回過頭來考慮規範","暫停一切數字經濟活動，直至相關法規全部訂立完備之後方再開展","只集中訂立各項規則，同時不鼓勵任何新技術在市場上的應用","在鼓勵技術應用的同時，訂立資料使用與市場競爭的規則，令發展有可預期的邊界"],"correctIndex":3,"explanation":"「並重」指兩者同時進行而非先後取捨：規則提供可預期的邊界，令投資與應用有依據；發展則令規則有實際對象。兩者互為條件。\n\n【干擾項剖析】「暫停至法規完備」把並重變成先規範後發展；「先放任後規範」則變成先發展後規範；「只訂規則不鼓勵應用」放棄了發展一端。三者均為先後取捨，並非並重。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-20","topic":"科技創新與綜合國力","difficulty":"hard","question":"有評論以某國專利申請數量高於他國，直接推論該國創新能力較強。就指標運用而言，此推論最主要的漏洞是甚麼？","options":["只有已發展經濟體所公布的專利數據才可靠，其餘一律不宜採用","專利申請數量必然與該經濟體的研發開支成正比，兩者可互相推算","申請數量屬數量指標，未反映專利的質素、實際應用程度及對生產力的影響","專利數量與創新能力之間完全無關，任何情況下都不應作為參考"],"correctIndex":2,"explanation":"專利申請數量可反映創新活動的活躍程度，但同一數量之下，專利的技術含量、獲批比例、是否轉化為產品及對生產力的貢獻可以差距極大。以單一數量指標推論能力強弱，忽略了質的維度。\n\n【干擾項剖析】「完全無關」把批評推到另一極端，屬矯枉過正；「只有發達國家數據可靠」引入了與論證無關的前提；「必然與研發開支成正比」把兩個變項的關係說成必然，本身亦是同類的推論錯誤。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-21","topic":"經濟全球化","difficulty":"basic","question":"全球生產鏈是指一件產品的不同工序分散於多個國家或地區完成。此一安排的主要經濟誘因是甚麼？","options":["減少國際貿易的需要，令各地可以在本地市場之內自給自足","令每一個參與的國家都能夠獨立完成整件產品的全部生產工序","各地按自身成本與技術優勢承擔不同工序，令整體生產成本下降","確保產品的所有生產工序都集中在同一地點，以便統一管理"],"correctIndex":2,"explanation":"分散工序的誘因在於比較優勢：勞動密集工序移向工資較低的地區，技術密集工序留在技術水平較高的地區，整體成本因而下降。\n\n【干擾項剖析】「各自獨立生產整件產品」正是全球生產鏈的相反做法；「集中在同一地點」與「分散於多個國家」的定義直接矛盾；「減少國際貿易的需要」推論倒轉——工序分散反而增加中間產品的跨境流動。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-22","topic":"經濟全球化","difficulty":"basic","question":"經濟全球化令各地經濟聯繫加深。就其影響而言，下列哪一項描述最為全面？","options":["只會影響已發展經濟體的產業結構，對發展中經濟體並無影響","只會帶來經濟增長與技術轉移，並不存在任何值得關注的負面影響","同時帶來機遇與風險：市場擴大與技術轉移之外，亦令外部衝擊更易傳導","只會帶來外部衝擊與產業萎縮，參與其中的經濟體並無任何得益"],"correctIndex":2,"explanation":"經濟聯繫加深是雙向的：出口市場擴大、資金與技術流入屬機遇；但同一條聯繫亦令外地的金融波動、需求萎縮或供應中斷更快傳到本地。全面的評價須同時包含兩面。\n\n【干擾項剖析】「只帶來增長」與「只帶來衝擊」各執一端，均屬片面；「只影響已發展經濟體」與發展中經濟體同樣參與全球生產鏈的事實不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-23","topic":"經濟全球化","difficulty":"intermediate","question":"有意見認為，某經濟體因引入外資而出現本地傳統行業萎縮，故應全面限制外資。就政策評估而言，此一結論的主要不足是甚麼？","options":["本地傳統行業的萎縮必然與外資無關，兩者之間並不存在關聯","外資的引入對任何經濟體而言都必然有害，故限制外資永遠正確","只計算受影響行業的損失，未同時衡量新增就業、技術轉移及消費者得益等其他影響","政策評估只應計算得益的一面，任何負面影響都不應納入考慮"],"correctIndex":2,"explanation":"政策評估須計算全部得失，並比較不同群體所受影響。只列出受損的一方而不計新增就業、技術外溢及價格下降的得益，會令結論偏向一邊。合理做法是同時評估，再考慮如何補償受影響者。\n\n【干擾項剖析】「必然有害」與「必然無關」都把複雜關係說成必然，屬過度推論；「不應考慮負面影響」把評估的另一半刪去，同樣片面。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-24","topic":"經濟全球化","difficulty":"hard","question":"近年部分經濟體提高關稅並推動生產回流，同時亦繼續參與區域貿易協定。就此一現象，下列哪一項解讀最為謹慎？","options":["區域貿易協定持續簽訂，證明各國對貿易政策的取態並無任何分歧","全球化並非單向推進或單向倒退，而是在不同領域與夥伴之間重新調整聯繫的深度","經濟全球化已經完全終結，各國正逐步回到自給自足的封閉狀態","關稅措施只屬象徵性的表態，對實際的貿易格局並無任何影響"],"correctIndex":1,"explanation":"同一經濟體既提高關稅又簽訂區域協定，說明其調整是有選擇性的：對某些產品或夥伴收緊，對另一些則加深合作。以「終結」或「無影響」概括，都忽略了這種選擇性。\n\n【干擾項剖析】「完全終結」與繼續參與區域協定的事實矛盾；「只是象徵性」低估了關稅對貿易流向的實際作用；「並無分歧」則忽略了關稅措施本身正正反映分歧。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-25","topic":"互聯相依的世界","difficulty":"basic","question":"傳染病可於短時間內跨境傳播。此一特性最能說明當代世界的哪一項特徵？","options":["公共衞生純屬各國的內部事務，並不涉及任何國際協作的層面","傳染病只會影響設有大型交通樞紐的城市，其他地區並不受波及","各國的公共衞生問題互不相干，一地的疫情不會影響其他地方","各地在人員與貨物往來上高度連繫，一地的公共衞生狀況會影響其他地方"],"correctIndex":3,"explanation":"跨境傳播之所以可能，正因為人員與貨物往來頻繁；連繫愈密，一地的疫情愈易影響他地。這說明公共衞生已不能只按國界處理。\n\n【干擾項剖析】「互不相干」與跨境傳播的事實直接矛盾；「只影響交通樞紐」把影響範圍任意收窄；「純屬內政」與需要國際通報及協作的做法不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-26","topic":"互聯相依的世界","difficulty":"intermediate","question":"一條跨境河流流經上游甲國及下游乙國。甲國在上游興建水壩以發電及灌溉，乙國則憂慮枯水期水量減少。就此類爭議的性質而言，下列哪一項理解最為準確？","options":["上游國家對流經其境內的河段擁有完全支配權，下游國家並無提出訴求的依據","同一水源令兩國的用水決定互相牽動，故爭議須經協商機制處理而非單方面決定","此類爭議純屬兩國的內部工程問題，與相互依存的概念並無實質關係","下游國家的用水需要必然優先於上游國家，上游興建任何設施皆屬不當"],"correctIndex":1,"explanation":"跨境河流是典型的共用資源：上游的取水與蓄水直接改變下游可得的水量，而下游的需求亦會約束上游的開發選擇。雙方的決定互相牽動，正是相互依存的具體形態，故通常須以流域協議、資料通報及分水安排等協商機制處理。\n\n【干擾項剖析】「上游完全支配」忽略了下游同樣依賴該水源；「下游必然優先」則把優先次序倒過來絕對化，同樣未經衡量；「純屬內部工程問題」否定了跨境影響的存在，與題幹所述的憂慮直接矛盾。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-27","topic":"互聯相依的世界","difficulty":"intermediate","question":"某地依賴單一國家供應大部分能源。就風險管理而言，下列哪一項措施最能針對此一結構性弱點？","options":["即時停止一切能源進口，全部改由本地現有的發電設施供應","拓展供應來源並提高本地可再生能源比重，降低對單一來源的依賴","增加本地的能源消耗總量，藉此提高向供應國議價時的談判籌碼","與現有的單一供應國簽訂更長年期的合約，藉此維持現時的供應關係"],"correctIndex":1,"explanation":"問題的根源在於「單一來源」而非「進口」本身。分散供應來源並發展本地可再生能源，直接降低單一中斷所造成的衝擊，屬對症下藥。\n\n【干擾項剖析】延長合約只是鎖定現狀，並未解除集中風險；「增加消耗提高議價能力」會加深依賴，方向相反；「停止一切進口」在本地供應不足時並不可行，屬極端而非對策。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-28","topic":"互聯相依的世界","difficulty":"hard","question":"就跨境環境污染，甲國認為責任應按當前排放量分擔，乙國則認為應按歷史累積排放量分擔。此一分歧的性質最準確可描述為甚麼？","options":["此一爭議與環境問題並無關係，其實質只是兩國之間的經濟競爭","兩國之中必然有一方在數據上說謊，故爭議屬誠信問題而非原則問題","雙方對「責任」的界定標準不同，故爭議不能單靠補充數據解決","雙方只是對排放數據有分歧，只要公布一套雙方接受的準確數據即可解決"],"correctIndex":2,"explanation":"兩種主張各自建基於不同的分配原則：一以當前狀況為準，一以歷史責任為準。即使雙方接受同一套排放數據，仍會得出不同結論，因為分歧在於評價標準而非事實本身。\n\n【干擾項剖析】「公布數據即可解決」誤把價值分歧當成事實分歧；「必然有一方說謊」把立場差異說成誠信問題；「純屬經濟競爭」否定爭議的環境內容，屬過度化約。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-29","topic":"可持續發展與公共衞生","difficulty":"basic","question":"處理都市固體廢物有「源頭減廢」與「末端處理」兩種取向。就可持續發展的角度而言，先行推動源頭減廢的主要理由是甚麼？","options":["源頭減廢的成本必然低於末端處理，故無須考慮其他因素","源頭減廢可以在短期之內完全取代所有廢物處理設施的需要","減少廢物產生本身，可同時降低所需的處理設施容量與長遠的環境負荷","末端處理技術在任何情況下都無法有效處理都市固體廢物"],"correctIndex":2,"explanation":"源頭減廢針對的是廢物的產生量，而末端處理針對的是已產生的廢物。減少產生量之後，所需的堆填或焚化容量隨之下降，土地佔用、排放及後代所承接的處理負擔亦一併減輕。這正好對應可持續發展中「不損害後代滿足其需要的能力」一點。\n\n【干擾項剖析】「末端處理任何情況下都無效」否定了處理設施的實際作用，屬矯枉過正；「短期內完全取代」誇大了減廢的速度與幅度，現有廢物仍須處理；「成本必然較低故無須考慮其他因素」把單一準則絕對化，迴避了實際比較。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-30","topic":"可持續發展與公共衞生","difficulty":"intermediate","question":"國家提出於二○三○年前達到碳達峰、二○六○年前實現碳中和。就兩個目標的關係而言，下列哪一項理解最為準確？","options":["兩個目標所指的其實是同一件事，分別只在於訂立的目標年份不同","碳達峰要求排放總量立即下降至歷史最低水平，不容許任何過渡期","碳達峰是排放量由升轉降的轉折點，碳中和則要求排放與吸收相抵，屬先後銜接的兩個階段","碳中和是指排放總量下降至零，因此並不需要任何吸收或抵銷措施"],"correctIndex":2,"explanation":"碳達峰指排放總量到達最高點之後開始回落，屬趨勢的轉折；碳中和則指餘下排放被林木、海洋及技術手段所吸收，淨排放為零。前者是後者的必要前提，兩者屬階段關係。\n\n【干擾項剖析】「意思相同」抹去了兩個階段的分別；「降至零故不需吸收」誤解了「中和」——中和容許有排放，但須被抵銷；「立即降至最低」把達峰誤解為即時大幅減排。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-31","topic":"可持續發展與公共衞生","difficulty":"intermediate","question":"評估一項環保政策時，若只計算其減排量而不計算執行成本與對低收入家庭的影響，此一評估的主要問題是甚麼？","options":["只取單一維度，忽略了政策的成本承擔與分配後果，難以判斷整體是否值得推行","環保政策的評估不應考慮任何經濟因素，否則會削弱環保的目標","只要措施能夠減少排放，則無論須付出多大代價都必然值得推行","減排量本身並非有效的評估指標，故評估時不應把它納入考慮"],"correctIndex":0,"explanation":"政策評估通常須兼顧成效、成本與公平三方面。只計減排量，無法知道所付代價是否相稱，亦看不到成本是否不成比例地落在低收入家庭身上。\n\n【干擾項剖析】「並非有效指標」否定了減排量的價值，屬矯枉過正；「不應考慮經濟因素」刪去成本一環，正是題目指出的問題；「任何成本都必然值得」則預設了結論，迴避了評估本身。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-32","topic":"可持續發展與公共衞生","difficulty":"hard","question":"某項公共衞生措施能顯著降低傳染風險，但同時限制部分個人活動。就政策取捨而言，下列哪一項分析框架最為合理？","options":["比較措施的預期公共健康得益與所限制權利的程度，並檢視有否侵害較小而效果相若的替代方案","凡是涉及限制個人活動的公共衞生措施，一律不應推行","應由受影響人數最多的一方單方面決定是否推行該項措施","凡是能夠降低傳染風險的措施一律應該推行，不必考慮其他因素"],"correctIndex":0,"explanation":"公共衞生措施的正當性通常按三點檢視：目的是否正當、手段與目的是否相稱、有否侵害較小而同樣有效的替代方案。此框架同時處理得益與代價，亦要求檢視替代選項，較單邊取態合理。\n\n【干擾項剖析】「一律不應推行」與「一律應推行」各自取消了取捨本身；「由人數最多一方決定」以多寡取代理據，忽略了少數群體所承受的代價。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-33","topic":"資料回應・數據詮釋","difficulty":"basic","question":"下表為某虛構城市的假設數據：\n\n年份　　人均收入（指數）　　收入最高兩成與最低兩成的收入比\n2016　　100　　　　　　　　　6.2\n2021　　118　　　　　　　　　7.4\n\n單就上表所示，下列哪一項結論最為穩妥？","options":["期內人均收入上升，而高低收入群組之間的差距同時擴大","期內低收入群組的實際收入下降，故收入比才會由六點二升至七點四","期內收入差距擴大，是由該市稅制在同期作出的改變所直接造成","期內全部市民的收入都上升了百分之十八，升幅在各收入組別之間一致"],"correctIndex":0,"explanation":"表中兩欄各自說明一件事：人均收入指數由 100 升至 118，屬總體上升；收入比由 6.2 升至 7.4，屬差距擴大。兩者可同時成立，故合併陳述最為穩妥。\n\n【干擾項剖析】「所有市民都上升百分之十八」把平均數當成每個人的數值，屬以偏概全；「低收入群組收入下降」無法由收入比推出——比率上升亦可能因高收入群組升幅較大所致；「由稅制改變造成」引入表中完全沒有的成因，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-34","topic":"資料回應・數據詮釋","difficulty":"intermediate","question":"一份報告以「受訪者中有七成支持該政策」作結論。要判斷此一數字能否代表全港意見，最應優先查明下列哪一項？","options":["受訪者如何抽選、樣本規模及回應率，即樣本能否代表整體","該份報告的出版日期是否在近期，資料會否因時間過久而失去時效","報告所示的支持比率是否高於五成，即支持者是否已構成多數","該份報告的篇幅是否足夠詳細，有否逐項交代研究的背景與方法"],"correctIndex":0,"explanation":"由樣本推論整體是否成立，取決於抽樣方法：若受訪者並非隨機抽選，或回應率極低，比率再高亦不能代表全港。故應先查抽樣與樣本特性。\n\n【干擾項剖析】出版日期影響時效性，但不解決代表性；篇幅屬呈現方式，與推論效力無關；「是否高於五成」只是描述該數字本身，並未回答它能否代表整體。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-35","topic":"資料回應・數據詮釋","difficulty":"intermediate","question":"某資料顯示，甲地的網絡使用率與其平均學歷同時上升。有評論據此推論「上網會令學歷提高」。此推論的主要問題是甚麼？","options":["兩者同時上升只屬相關，未能確立因果，亦可能同受經濟發展等第三項因素影響","只要兩項數據在同一時期同向變動，兩者之間的因果關係即可成立","網絡使用率與平均學歷這兩項數據，在同一時期之內不可能同時上升","網絡使用率並非可以客觀量度的指標，故此推論欠缺可靠的資料基礎"],"correctIndex":0,"explanation":"兩個變項同向變動只說明存在相關，未能說明何者導致何者，亦未排除第三因素同時推高兩者的可能。要確立因果，須另有證據處理時序與其他解釋。\n\n【干擾項剖析】「不可能同時上升」與資料相反；「並非可量度的指標」與使用率本身就是數據不符；「同時上升即可成立因果」正是題目要指出的錯誤推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-36","topic":"資料回應・數據詮釋","difficulty":"hard","question":"兩份報告就同一議題得出相反結論。甲報告以全港隨機抽樣的問卷為據，乙報告以某網上論壇的留言分析為據。就資料可靠性而言，下列哪一項判斷最為合理？","options":["凡結論相反的兩份報告，其中必有一份是刻意造假以誤導讀者","兩份報告的可靠程度完全相同，因為兩者的結論都有實際數據支持","甲報告在代表性上較強，但仍須檢視問題措辭與回應率；乙報告反映論壇使用者的意見，不宜推及全港","乙報告所處理的留言數量可能較多，故其結論必然比甲報告更可靠"],"correctIndex":2,"explanation":"隨機抽樣的目的正是令樣本結構接近整體，故甲報告在代表性上較強；但代表性並非唯一考慮，問題措辭與回應率同樣影響結果。乙報告的資料來自自我選擇的論壇使用者，只能反映該群體。\n\n【干擾項剖析】「數量較多必然更可靠」把樣本量當成唯一準則，忽略了抽樣方式；「完全相同」把「有數據」等同「同樣可靠」；「必有一份造假」把方法差異說成誠信問題，屬過度推論。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-37","topic":"多角度評鑑・持份者權衡","difficulty":"intermediate","question":"政府計劃在市區一幅土地上興建公共設施。居民、商戶、環保團體及使用者對方案各有不同關注。就多角度評鑑而言，下列哪一項做法最為恰當？","options":["在評估報告之中避免提及任何反對意見，以免方案的推展受阻","以表態支持人數最多的一方作準，其餘持份者的意見不予考慮","只考慮設施直接使用者的意見，因為受影響的實際上只有他們","逐一列出各持份者的關注與理據，比較其影響程度，再說明取捨的理由"],"correctIndex":3,"explanation":"多角度評鑑的要求是：識別各持份者、理解其理據、比較影響，並在無法兼顧時說明取捨依據。關鍵在於理據與影響程度，而非人數多寡或立場親疏。\n\n【干擾項剖析】「以人數最多為準」以數量取代理據；「只考慮直接使用者」錯誤地假設其他持份者不受影響；「避免提及反對意見」則放棄了評鑑本身，屬立場先行。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-38","topic":"多角度評鑑・持份者權衡","difficulty":"hard","question":"就一項發展方案，本地商戶關注短期營業損失，環保團體關注長期生態影響。有意見認為「兩者關注的時間尺度不同，故無法比較」。下列哪一項回應最為合理？","options":["既然兩者無法比較，便應直接擱置方案，等待更多資料出現後再議","短期影響必然比長期影響重要，因為短期影響較為確定而可以量度","時間尺度不同並不等於無法比較，可就影響的可逆轉程度、受影響範圍及可否補償等共通面向作衡量","長期影響必然比短期影響重要，因為長期影響持續的時間較為長久"],"correctIndex":2,"explanation":"時間尺度只是其中一個面向。即使長短不同，仍可就影響是否可逆、涉及範圍多廣、能否以補償處理等共通標準作比較。以此為基礎，取捨便有理據可循。\n\n【干擾項剖析】「無法比較故擱置」把方法困難當成結論；「短期必然較重要」與「長期必然較重要」各自把一個面向絕對化，同樣迴避了實質比較。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-39","topic":"概念應用・當代世界","difficulty":"basic","question":"「相互依存」指各方在資源、市場或技術上彼此需要。下列哪一項情境最能體現此一概念？","options":["甲地自行生產並消費其所需的全部物品，不假外求亦不對外輸出","甲地出口原材料至乙地加工，乙地製成品再銷回甲地市場","甲地與乙地之間並無任何貿易、人員或技術上的實際往來","甲地單方面向乙地提供物資援助，而乙地並無任何形式的回報"],"correctIndex":1,"explanation":"相互依存的關鍵在於「相互」：雙方各有對方所需，關係是雙向的。原材料與市場互換，正是雙向需要的典型情境。\n\n【干擾項剖析】「自行生產並消費全部所需」屬自給自足，與依存相反；「單方面提供援助而無回報」只有單向關係；「並無任何往來」則連關係都不存在。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"csd-b3-40","topic":"概念應用・當代世界","difficulty":"intermediate","question":"應用「持份者」概念分析一項公共政策時，最容易被忽略的通常是哪一類人？","options":["最初提出並持續推動該項政策的主要倡議者及其團體","未有組織代表、發聲渠道較少，但實際受政策影響的群體","負責執行該項政策的政府部門，以及其前線工作人員","在傳媒及網絡平台上就該議題發表意見最多的一方"],"correctIndex":1,"explanation":"持份者分析的常見盲點在於：受影響程度與發聲能力並不對等。有組織、有渠道的一方容易被納入討論，而缺乏代表的群體即使受影響甚深，亦可能在分析中缺席。\n\n【干擾項剖析】執行部門、傳媒上活躍的一方及政策倡議者，均屬本身已有渠道進入討論的持份者，正正是最不容易被忽略的幾類。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "csd";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
// ── 審核用時自動記錄 ──────────────────────────────────────────────────────
// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "csd-batch3.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "csd-batch3.decisions.json"; a.click();
});
counts();
