<script>
const DATA = [{"id":"en_w1_01","topic":"Word Formation","difficulty":"basic","question":"Complete each sentence with the correct form of the word in brackets. Write the word only.\n1. The committee reached a decision after a long ______ (DISCUSS).\n2. Her ______ (ABLE) to stay calm under pressure impressed the interviewers.\n3. The instructions were so ______ (CLEAR) that nobody knew what to do. (Use a negative prefix.)\n4. He spoke ______ (CONFIDENT) even though he had not prepared.\n5. The scheme was widely criticised as ______ (PRACTICAL). (Use a negative prefix.)","explanation":"Word-formation items are decided by grammar before vocabulary. Read what sits immediately before and after the gap — an article or adjective points to a noun, a verb points to an adverb, \"so … that\" points to an adjective. Only then ask which affix carries the meaning. Two traps appear here: ABLE to ability involves a spelling change that a mechanical -ity ending would miss, and PRACTICAL takes im-, not un-, because English negative prefixes are not interchangeable. Writing a correctly spelt word of the wrong part of speech scores nothing, which is why the grammatical decision comes first.","type":"text","referenceAnswer":"1. discussion (noun after \"a long\")\n2. ability (noun as subject of the sentence; note the spelling change from ABLE)\n3. unclear (adjective with a negative prefix; \"so ______ that\" needs an adjective)\n4. confidently (adverb modifying the verb \"spoke\")\n5. impractical (adjective; the prefix for PRACTICAL is im-, not un-)\n\nEach answer is fixed by two things: the part of speech the slot requires, and the meaning the sentence needs. Decide the part of speech first from the words around the gap, then choose the affix.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w1_02","topic":"Reading · Inference & Implication","difficulty":"intermediate","question":"Read the passage, then answer the questions.\n\n\"The school announced the new timetable on a Friday afternoon, three days before it took effect. A notice appeared on the board outside the staff room; no email was sent. When a group of students asked whether they could discuss it, they were told the consultation period had closed. Several teachers said afterwards that they had learnt of the change at the same time as the students.\"\n\n(a) What can be inferred about how the decision was made? Support your answer with two details from the passage.\n(b) The writer mentions that the notice appeared \"on a Friday afternoon, three days before it took effect\". What is the effect of including this detail?\n(c) Identify the writer's attitude towards the school. Quote one phrase that reveals it and explain how it does so.","explanation":"Inference questions ask what the passage makes it reasonable to conclude, not what it states. The commonest error is answering (a) by copying a sentence out; a quotation is evidence for an inference, never the inference itself. Part (b) tests why a detail is there at all — every specific in a short passage is chosen, and the answer should say what work the choice does. Part (c) is the hardest, because the passage contains no adjective of judgement: the attitude is carried by selection, by which facts the writer chose to place side by side. Answering \"the writer is angry\" overstates it; the register is restrained, and saying so is part of a full answer.","type":"long","referenceAnswer":"(a) It can be inferred that the decision was made by a small group without consulting those affected. Two supporting details: the teachers \"learnt of the change at the same time as the students\", which shows staff were not involved in making it; and students were told \"the consultation period had closed\", although no student appears to have been aware that one was open.\n(b) The timing detail makes the announcement look designed to limit response. A Friday afternoon is the point in the week when the fewest people are present, and three days leaves no working time to object before the change begins. Stating the two facts together lets the reader draw that conclusion without the writer asserting it.\n(c) The attitude is critical, though expressed indirectly. The phrase \"no email was sent\" reveals it: the writer records the absence of the obvious means of reaching everyone, and a plain statement of what was not done invites the reader to judge it. Nothing in the sentence is openly hostile, which is what makes the criticism effective.","markingScheme":"(a) 3 marks — a defensible inference about how the decision was made (1); two supporting details drawn from the passage (1 each). A quotation offered without an inference earns nothing.\n(b) 2 marks — identifying the effect as limiting the chance to respond (1); linking it to both the day of the week and the three-day gap (1).\n(c) 3 marks — the attitude named as critical or disapproving (1); one relevant phrase quoted (1); an explanation of how that phrase carries the attitude (1). Naming an attitude with no textual evidence earns nothing.\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":14,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w1_03","topic":"Genre, Tone & Register","difficulty":"intermediate","question":"Your school library has decided to close two hours earlier on weekdays because of staffing costs. Many students use it after lessons.\n\nWrite a letter of about 200 words to the school principal, asking for the decision to be reconsidered. You should:\n- state clearly what you are writing about and why;\n- give two reasons, each supported with something concrete;\n- propose one workable alternative;\n- close appropriately.\n\nSign your letter \"Chris Wong\".","explanation":"Register is the part candidates most often misjudge, and it is judged against the reader, not against a fixed idea of \"formal English\". A principal is a senior reader who can reverse the decision, so the letter needs to be courteous and to give reasons that person could act on. The second thing worth attention is the alternative: the question supplies the constraint (staffing costs) precisely so that a proposal can be tested against it. Answering as though the constraint had not been stated is what separates a competent letter from a strong one. Length matters too — at 200 words there is room for two developed reasons, not four listed ones.","type":"long","referenceAnswer":"This task is self-assessed. Rather than a model letter to copy, here is what a strong response contains — compare your own work against each point.\n\nFormat: a salutation to a named or titled reader (\"Dear Principal\"), a clear opening line naming the subject, paragraphs that each do one job, and a sign-off that matches the salutation (\"Yours sincerely\" with a named reader).\n\nRegister: formal but not stiff. A letter to a principal asking for a reversal should be respectful and specific. Contractions, exclamation marks and rhetorical questions (\"Don't you think this is unfair?\") push the register too low. Legalistic or over-elaborate vocabulary pushes it too high and reads as insincere.\n\nContent: two reasons, each anchored to something concrete — for example, students who travel far and cannot study at home, or the period before examinations when the after-school hours matter most. A general claim that \"students need the library\" is not yet a reason.\n\nThe alternative: one proposal that acknowledges the stated constraint. Since the reason given was staffing cost, a workable alternative addresses cost — a student volunteer rota supervised by one member of staff, or later opening only in the weeks before examinations. A proposal that ignores the constraint (\"just hire more staff\") does not answer the situation.\n\nClose: a specific request, such as asking for the matter to be raised at the next meeting.\n\nCommon weaknesses: writing an essay about the value of reading instead of a letter; giving three or four thin reasons instead of two developed ones; and proposing an alternative that costs more than the decision was meant to save.","markingScheme":"Compare your own letter against four areas. Nothing here is machine-marked; you decide where your work stands.\n\nFormat and conventions — salutation, opening statement of purpose, paragraphing, matching sign-off, correct signature.\nRegister and tone — consistently formal and respectful, no contractions or exclamations, no over-formal padding.\nContent — two reasons, each supported by something concrete rather than asserted; one alternative that responds to the stated cost constraint.\nLanguage — sentence variety, accurate tenses and articles, vocabulary suited to a formal letter.\n\nA fair way to self-assess: read your letter as the principal. Would you know within the first two lines what is being asked? Is there a proposal you could act on tomorrow?\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":30,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w1_04","topic":"Cloze & Usage","difficulty":"intermediate","question":"Fill each blank with ONE word only.\n\n\"Although the trial was small, the results were consistent (1) ______ earlier findings. The researchers were careful (2) ______ to overstate what they had shown, pointing out that the sample (3) ______ drawn entirely from one district. They now intend to repeat the study (4) ______ a larger group, and have made their data available so (5) ______ others can check the analysis.\"","explanation":"Open cloze rewards reading the whole sentence before writing anything. Blank (2) is the one most often missed: the sentence says the researchers avoided overstating, so a negative is required, yet the gap sits in a position where a positive reading looks grammatical. Blank (3) tests agreement across a distance — the subject is \"the sample\", singular, even though \"findings\" and \"researchers\" are the nearest plurals. Blank (5) is a reminder that some conjunctions are two words and the second half can be tested on its own. Where more than one word fits, as in (4), examiners accept any answer that is both grammatical and consistent with the meaning.","type":"text","referenceAnswer":"(1) with — the fixed collocation is \"consistent with\", not \"consistent to\".\n(2) not — \"careful not to overstate\"; the sentence needs a negative before the infinitive.\n(3) was — the passive \"was drawn\", agreeing with the singular \"sample\".\n(4) with — \"repeat the study with a larger group\"; \"on\" is also defensible.\n(5) that — \"so that\" introduces a clause of purpose.\n\nEach blank is decided by structure rather than by meaning alone: a fixed collocation (1), a negative infinitive (2), verb form and agreement (3), a preposition (4) and a two-word conjunction (5).","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"en_w1_05","topic":"Integrated Skills","difficulty":"hard","question":"DATA FILE\n\nSource A — Extract from a district survey (150 respondents aged 12–18)\n- 68% say they would use a late-night study space if one existed\n- 41% say the main obstacle to studying at home is lack of quiet space\n- 22% report travelling more than 40 minutes to reach the nearest public library\n\nSource B — Comment from a district councillor\n\"We have space in the community hall on three evenings a week. What we do not have is supervision. Any proposal has to answer that before it answers anything else.\"\n\nSource C — Note from a school social worker\n\"Late opening helps the students who need it most, but it also carries risk. Young people going home after ten at night need a plan for getting there safely, and someone has to be responsible for knowing who is still in the building.\"\n\nTASK\nYou are the chairperson of a student union. Write a proposal of about 250 words to the district council, arguing for a supervised evening study space in the community hall.\n\nYou must:\n- use at least two figures from Source A, and say what each one shows;\n- respond directly to the constraint raised in Source B;\n- address at least one of the concerns in Source C;\n- write in a register suitable for a council submission.","explanation":"Integrated tasks are marked on whether the sources were used, not on whether they were mentioned. The single most useful habit is to treat each source as setting a question the writing must answer: Source A asks \"is there a need, and what kind\"; Source B asks \"who supervises\"; Source C asks \"what happens when it ends\". A proposal that answers all three reads as considered even if the prose is plain. The register point is worth noting separately: this is a submission to a body that will weigh it against other calls on the same space, so an argument that anticipates the objection is stronger than one that presses the need harder. Blind copying from the data file is the failure this task is designed to expose — a percentage carried across without interpretation adds nothing.","type":"long","referenceAnswer":"This task is self-assessed. What follows is what a strong proposal does, point by point.\n\nUsing the data: a figure must be interpreted, not merely quoted. \"68% would use the space\" states demand; \"41% cite lack of quiet space at home\" explains why the demand exists and shows the need is about conditions rather than preference; \"22% travel more than 40 minutes\" establishes that the existing provision does not reach this group. A proposal that lists all three percentages without saying what each shows has copied rather than used the data.\n\nAnswering Source B: the councillor names supervision as the first obstacle, so the proposal must put supervision early and make it concrete — who supervises, on what rota, at what cost, and who is accountable. A vague promise that \"supervision can be arranged\" does not meet the constraint the source sets out.\n\nAnswering Source C: the social worker raises two distinct concerns, safe travel home and knowing who remains in the building. A strong answer picks at least one and proposes something specific, such as a sign-in and sign-out register with a fixed closing routine, or grouped departures at a set time.\n\nRegister: a council submission is formal, impersonal and organised under headings or clearly signposted paragraphs. First-person appeals (\"we really need this\") weaken it; so does emotive language. The reader is deciding whether to allocate a public resource and needs to see that the risks have been thought through.\n\nCommon weaknesses: quoting all three figures with no interpretation; arguing at length that studying is important, which nobody disputes; and leaving supervision to the last line, when Source B places it first.","markingScheme":"Self-assess against four areas.\n\nUse of the data file — at least two figures from Source A, each interpreted rather than quoted; the constraint in Source B answered concretely; at least one concern from Source C addressed with a specific measure.\nTask fulfilment — the piece reads as a proposal to a council, not as an essay; it makes a request the reader could act on.\nOrganisation — a clear structure, one idea per paragraph, the supervision question placed early because Source B places it first.\nLanguage and register — formal, impersonal, accurate; no emotive appeals; vocabulary suited to a public submission.\n\nA fair self-check: cover the data file and reread your proposal. If it still makes sense unchanged, the sources were probably decorative rather than used.\n本題所列分數為本平台練習用尺度，並非香港考試及評核局的分數分配。參考答案只列必達步驟與判準，刻意不提供可直接抄錄的完整答卷。交卷後請逐項對照自評，機器不會為本題評分。","suggestedMinutes":35,"trapTypes":null,"dnaTag":null,"mother":null}];

const state = {}; DATA.forEach(d => state[d.id] = 'pending');
// ── 審核用時自動記錄 ──────────────────────────────────────────────────────
// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）

const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };

  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;

  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
