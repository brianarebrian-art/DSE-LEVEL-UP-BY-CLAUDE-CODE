<script>
const DATA = [{"id":"chist_floor_01","topic":"先秦政治","difficulty":"basic","question":"春秋時期，若干強大的諸侯以「尊王攘夷」為口號。這個口號的用意是甚麼？","options":["以擁戴周天子之名，取得號令其他諸侯的正當性","公開主張廢除周天子，另行擁立新的共主","主張各諸侯國合併為一國，結束分封的局面","主張把王位讓予外族首領，以換取邊境和平"],"correctIndex":0,"explanation":"周天子此時實力已經衰微，名分卻仍在。霸主打着尊王的旗號，既不必推翻既有秩序，又可借天子之名召集諸侯、討伐異己，權力因而有了說法。這正是「禮崩樂壞」時期的特徵：舊制度的形式仍在使用，實質卻已被借用來服務新的權力。答題時若只寫「抵抗外族」，便漏掉了「尊王」那一半，而那一半才是政治上的關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_02","topic":"先秦政治","difficulty":"basic","question":"宗法制度以「嫡長子繼承」為核心原則。這項原則主要解決了甚麼問題？","options":["官員貪污與行政效率低下的問題","繼承次序的爭議，使權力與身分的傳遞有明確依據","土地不足以分配予所有人口的問題","各諸侯國之間度量衡不統一的問題"],"correctIndex":1,"explanation":"宗法制度確立大宗與小宗的尊卑秩序，規定由嫡長子繼承，其餘諸子分立為小宗。這樣一來，繼承次序有客觀依據，可以減少因爭位而起的內部衝突。它與封建制度互為表裏：封建解決土地與權力的分配，宗法解決繼承與身分名分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_03","topic":"先秦政治","difficulty":"basic","question":"商鞅在秦國推行變法，其中「獎勵耕戰」的措施，直接鼓勵人民做甚麼？","options":["研習儒家經典，以備日後出仕","開鑿運河及修築長城等大型工程","努力生產糧食及在戰場上立功，以換取爵位與賞賜","遷居至城市經商，以增加國家稅收"],"correctIndex":2,"explanation":"「耕」指農業生產，「戰」指軍功。商鞅把爵位與賞賜同這兩件事直接掛鈎：多產糧者可免徭役，斬敵首者可獲爵位。此舉把國家所需的糧食與兵源，轉化為個人可以爭取的實際利益，是秦國國力迅速上升的重要原因之一。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_04","topic":"先秦政治","difficulty":"basic","question":"春秋時期出現「霸主」，這些霸主在名義上仍然尊奉周天子。這種情況反映了甚麼？","options":["周天子重新掌握了全國的軍事與財政大權","各諸侯國已正式廢除周王室的名號","霸主已經統一全國，建立新的王朝","周天子的實際權力已經衰落，但其名分仍有號召作用"],"correctIndex":3,"explanation":"「尊王攘夷」正是這種局面的寫照：霸主憑實力號令諸侯，卻仍要打着周天子的旗號。這說明周王室的實權已經旁落，但其正當性尚未消失，仍可作為政治動員的名義。名分與實力分離，是理解春秋政局的關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_05","topic":"先秦政治","difficulty":"basic","question":"戰國時期各國相繼變法，內容雖然不同，但普遍有一個共通方向。這個方向是甚麼？","options":["加強君主與中央的權力，削弱世襲貴族","恢復西周的封建與宗法舊制","把政治權力交予各地商人團體","放棄農業，全面發展手工業與貿易"],"correctIndex":0,"explanation":"無論是魏國的李悝、楚國的吳起，還是秦國的商鞅，變法的共同結果都是把權力由世襲貴族手上收歸君主。措施包括按功授爵而非按血統、以官僚取代封君治理地方、統一賦稅與法令。理解這條主線，就能明白何以戰國之後會走向中央集權的帝制。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_06","topic":"秦漢至隋唐制度","difficulty":"basic","question":"秦朝在全國推行郡縣制，取代封建。郡縣制與封建最根本的分別在於甚麼？","options":["郡縣制只在邊疆地區實行","郡縣長官由中央任免，不得世襲","郡縣制之下不必向中央繳納賦稅","郡縣長官須由當地百姓選舉產生"],"correctIndex":1,"explanation":"封建之下，諸侯世代相傳，中央難以撤換；郡縣之下，守令由皇帝任免，任期屆滿即調動。這一點改變了權力的來源：官員的位置來自朝廷而非血統，因此必須向上負責。此後兩千年的中央集權，制度基礎就在於此。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_07","topic":"秦漢至隋唐制度","difficulty":"basic","question":"漢武帝頒行「推恩令」，容許諸侯把封地分給各個兒子。這項措施實際上產生了甚麼效果？","options":["諸侯獲得自行任免中央官員的權力","朝廷取消了全部諸侯的爵位","諸侯封地逐代分割而變小，勢力自然削弱","諸侯的封地因合併而擴大"],"correctIndex":2,"explanation":"表面上這是恩典：從前只有嫡長子承襲，如今諸子皆可分得土地。但封地總量不變，分得越多、每份越小，數代之後諸侯已無力對抗中央。此舉的高明之處，在於不必動武、不必背上苛待宗室之名，而收削藩之效。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_08","topic":"秦漢至隋唐制度","difficulty":"basic","question":"唐代三省之中，門下省的主要職能是甚麼？","options":["草擬詔令，決定政策內容","執行詔令，統轄六部","負責考核官員及審理刑獄","審核詔令，認為不當者可以駁回"],"correctIndex":3,"explanation":"三省分工是：中書省草擬、門下省審核、尚書省執行。門下省的封駁之權，使詔令在頒行之前多一道制衡；三個環節互相牽制，可以減少決策失誤，但同時亦令行政程序變長。理解這個分工，是掌握唐代中央制度的起點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_09","topic":"秦漢至隋唐制度","difficulty":"basic","question":"隋唐科舉制與漢代察舉制，在選拔官員的方式上最主要的分別是甚麼？","options":["科舉以考試成績取人，察舉靠地方長官推薦","科舉只錄取宗室子弟，察舉面向全民","科舉由地方自行決定，察舉由中央統一舉辦","兩者的分別只在於名稱，程序完全相同"],"correctIndex":0,"explanation":"察舉以「孝廉」等名目由地方長官推薦，標準較主觀，日久易被門第與人際關係左右；科舉則設統一考試，以成績為據，寒門子弟因而多了一條上升途徑。這一改變擴闊了統治階層的來源，是理解唐宋社會流動的關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_10","topic":"秦漢至隋唐制度","difficulty":"basic","question":"唐代中葉推行兩稅法，改以土地與資產多寡作為徵稅依據。這項改變回應了甚麼實際問題？","options":["朝廷決定全面免除農民的賦稅","土地兼併令原有按人丁徵稅的辦法難以維持","人口大幅增加，朝廷須增設新的稅目","對外貿易興盛，須改為徵收關稅"],"correctIndex":1,"explanation":"租庸調制建基於均田制，按人丁徵收。當土地兼併日益嚴重，農民失地而戶籍失實，按人丁徵稅便收不上來。兩稅法改按土地與資產徵收、一年分夏秋兩次繳納，等於承認了土地已經集中的現實。制度隨現實而改，是這一課的重點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_11","topic":"宋元明清","difficulty":"basic","question":"宋太祖以「杯酒釋兵權」收回將領兵權，並確立重文輕武的方針。這項方針最主要想防止甚麼？","options":["外族入侵中原，佔領首都","地方百姓拒絕繳納賦稅","武將擁兵自重，重演唐末五代的藩鎮割據","文官結黨營私，把持朝政"],"correctIndex":2,"explanation":"唐末以來，藩鎮割據、軍人擁立，政權更迭頻繁。宋初的制度設計正是針對這一病根：收兵權於中央、以文臣統兵、將領常調不久任。此舉確實避免了內部軍人專權，但同時削弱了軍隊的戰力，形成宋代對外長期被動的局面 —— 制度往往在解決一個問題的同時製造另一個。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_12","topic":"宋元明清","difficulty":"basic","question":"王安石變法之中的「青苗法」，主要針對農民的哪一個困境？","options":["耕地面積不足，無法種植足夠糧食","缺乏農具與耕牛，無法開墾荒地","稅率過高，收成大部分須上繳","青黃不接時被迫向富戶借高利貸"],"correctIndex":3,"explanation":"「青黃不接」指舊糧已盡、新苗未熟的那一段時間。農民在此時最缺現金，往往要向富戶借貸，利息極重，一旦還不起便要賣地。青苗法由官府在此時貸出錢穀，收取較低利息，用意是把這一段的高利貸需求接過來。理解政策所針對的具體困境，比記住政策名稱重要得多。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_13","topic":"宋元明清","difficulty":"basic","question":"明太祖廢除丞相一職，把六部直接置於皇帝之下。這項改動對皇權有甚麼影響？","options":["皇權大為集中，但皇帝的日常政務負擔亦大增","皇權受到削弱，六部得以自行決策","皇帝從此不再參與行政事務","地方督撫取得任免中央官員之權"],"correctIndex":0,"explanation":"丞相原是皇帝與六部之間的中介，既分擔政務，亦在一定程度上制衡皇權。廢相之後，六部直達御前，權力盡歸皇帝，但所有奏章亦須皇帝親自處理。其後設立內閣以協助票擬，正是這個負擔的直接後果 —— 制度上被廢除的職能，實際上會以另一種形式回來。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_14","topic":"宋元明清","difficulty":"basic","question":"清代設立軍機處，由皇帝親信大臣承旨辦事。軍機大臣的權力性質是甚麼？","options":["由科舉考試成績最優者自動出任","只負責承旨擬辦，本身並無決策權","可以否決皇帝的旨意","握有獨立的兵權與財權"],"correctIndex":1,"explanation":"軍機處的特點是「述而不作」：軍機大臣把皇帝的意旨草擬成文，迅速下達，本身不設官署、無屬員、亦無定制。正因為它沒有制度化的權力，皇帝反而可以完全掌握。這與唐代三省互相制衡的設計恰恰相反，是清代皇權高度集中的標誌。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_15","topic":"宋元明清","difficulty":"basic","question":"明清科舉以八股文取士，考生須按固定格式作答。這種做法對讀書人的學習方向有甚麼影響？","options":["科舉錄取名額大增，讀書人數目下降","考試內容每年更換，讀書人無從準備","讀書人集中鑽研應試格式與指定經籍，學問範圍收窄","讀書人普遍轉向研習自然科學與技術"],"correctIndex":2,"explanation":"格式一旦固定，備試的最有效方法就是熟習格式本身。考生把精力放在破題、承題、起講等程式，以及指定經籍的註疏之上，其他學問自然相對受冷落。這並非說當時無人研究實學，而是制度的誘因把大多數人引向同一條路 —— 考試怎樣考，人就怎樣學。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_16","topic":"晚清變局","difficulty":"basic","question":"《南京條約》是中國近代第一條不平等條約。以下哪一項是該條約的內容？","options":["准許外國在中國內地開設工廠","清廷須派遣留學生前往歐洲","列強共同保證中國的領土完整","開放五口通商，並割讓香港島"],"correctIndex":3,"explanation":"條約主要內容包括：開放廣州、廈門、福州、寧波、上海五口通商，割讓香港島，賠款，以及協定關稅。當中「協定關稅」影響最深遠 —— 中國從此不能自主決定稅率。至於在內地設廠，是《馬關條約》之後的事，兩者相隔半個世紀，不可混淆。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_17","topic":"晚清變局","difficulty":"basic","question":"洋務運動以「自強」、「求富」為口號。它所引進的主要是甚麼？","options":["西方的軍事技術與機器工業","西方的議會制度與憲法","西方的教育制度與科舉改革","西方的宗教信仰與社會習俗"],"correctIndex":0,"explanation":"洋務派的基本主張是「中學為體、西學為用」：制度與價值仍守中國舊有，只在器物層面學習西方。因此所辦的是船政局、機器局、招商局一類事業。甲午戰敗令這條路線受到根本質疑 —— 若制度不變，單靠器物是否足以自強？其後的維新與革命，都是對這個問題的回答。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_18","topic":"晚清變局","difficulty":"basic","question":"戊戌變法在推行約一百日之後即告失敗。變法的主要主張是甚麼？","options":["把全國土地平均分配予農民","仿效外國推行君主立憲，並改革教育與行政","推翻清廷，建立共和政體","全面恢復明代的政治制度"],"correctIndex":1,"explanation":"維新派主張在保留皇室的前提下改革制度：設議院、改科舉、辦新式學堂、裁汰冗員。這與洋務運動只學器物不同，已觸及制度層面；但亦與革命派主張推翻帝制不同。分清「改良」與「革命」兩條路線，是理解晚清政治最重要的一組區分。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_19","topic":"晚清變局","difficulty":"basic","question":"《馬關條約》簽訂之後，列強在中國掀起劃分勢力範圍的浪潮。這反映了甚麼？","options":["清廷主動邀請列強分區管理中國","中國的對外貿易額大幅下降","清廷的軍事與外交弱點已完全暴露，列強因而加緊侵奪","列強決定共同協助中國推行現代化"],"correctIndex":2,"explanation":"甲午一役，清廷敗於此前被視為東亞小國的日本，其虛弱程度再無可掩飾。列強由此判斷清廷已無力抵抗，遂爭相租借港灣、修築鐵路、劃定勢力範圍。這一段是理解其後義和團與辛丑條約的直接背景：民間的排外情緒，正是在瓜分危機之下急速升溫。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_20","topic":"辛亥革命","difficulty":"basic","question":"孫中山提出的三民主義，包括民族、民權、民生三項。其中「民權主義」主要主張甚麼？","options":["以武力驅逐所有外國人離開中國","平均分配土地，消除貧富差距","恢復漢族的傳統禮儀與服飾","建立共和政體，主權屬於全體國民"],"correctIndex":3,"explanation":"三項各有所指：民族主義針對滿清統治與列強壓迫，民權主義針對君主專制，民生主義針對土地與貧富問題。把三者分清是答題的基本功 —— 平均地權屬民生主義，不屬民權主義；而民權主義的核心，是把主權由君主移交國民。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_21","topic":"辛亥革命","difficulty":"basic","question":"一九一一年武昌起義爆發之後，短時間內多個省份宣布獨立。這反映了當時的甚麼情況？","options":["清廷對地方的控制力已經十分薄弱","革命黨在各省均已掌握軍政大權","列強公開出兵支持革命","清廷主動宣布放棄統治"],"correctIndex":0,"explanation":"武昌起義本身規模有限，但引發連鎖反應。各省宣布獨立者，既有革命黨人，亦有原有的立憲派與地方軍政人物 —— 他們未必認同革命的主張，只是判斷清廷已無力維持。這說明清朝的崩解，與其說是被推翻，不如說是無人再願意支撐。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_22","topic":"辛亥革命","difficulty":"basic","question":"中華民國成立之後，袁世凱取代孫中山出任臨時大總統。促成這一結果的主要條件是甚麼？","options":["列強一致反對孫中山出任總統","袁世凱掌握北洋軍，是當時實力最強的一方","袁世凱在同盟會之中資歷最深","孫中山在選舉之中落敗"],"correctIndex":1,"explanation":"革命陣營當時缺乏足以統一全國的武力，而清廷則須靠袁世凱的北洋軍支撐。雙方各有所需：革命方要清帝退位，袁世凱要總統之位。這宗交易令共和迅速成立，卻亦把新政權的實權交到舊有軍事集團手上，為其後的政局動盪埋下伏線。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_23","topic":"辛亥革命","difficulty":"basic","question":"辛亥革命結束了在中國實行兩千多年的哪一種政治制度？","options":["郡縣地方行政制度","宗法家族制度","君主專制的帝制","科舉取士制度"],"correctIndex":2,"explanation":"自秦統一以來，帝制延續兩千餘年，辛亥革命使之終結，此後任何政權都難以公開回復帝制 —— 袁世凱稱帝迅速失敗，正說明這一點。至於科舉，早在一九○五年已停辦；郡縣式的地方行政則以另一種形式延續至今。分清哪一項被終結，是本題的關鍵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_24","topic":"民國發展","difficulty":"basic","question":"新文化運動主張以白話文取代文言文。這一主張的主要用意是甚麼？","options":["保存古代典籍的原貌，避免後人任意改動文字","統一各地方言的讀音，使全國語音趨於一致","提高考試的文字難度，以便篩選真正的人才","使書面語接近口語，讓一般人也能讀能寫，思想得以廣泛傳播"],"correctIndex":3,"explanation":"文言與口語長期分家，能讀能寫者只限於少數受過長期訓練的人；改用白話，等於把識字與表達的門檻大幅拉低。新思想若只能以文言傳播，受眾便被限制在原有的士人圈子之內，運動所追求的社會改造亦無從談起。故白話文運動並非單純的文體之爭，而是要換一批能夠參與討論的人。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_25","topic":"民國發展","difficulty":"basic","question":"五四運動最初由北京的學生發起，其後迅速擴大。這裏所謂「擴大」，具體表現是甚麼？","options":["上海等地的工人罷工、商人罷市，運動由學界擴及社會各階層","各省的軍閥先後宣布獨立，脫離北京政府的管轄","政府主動下令全國各地響應學生所提出的訴求","各國駐華使館聯合發表聲明，公開支持學生"],"correctIndex":0,"explanation":"運動之所以能迫使政府讓步，關鍵在於它不再只是校園之內的事：工人罷工影響生產，商人罷市影響市面，壓力由多方同時施加。研究群眾運動時要留意這一點 —— 訴求是否正當是一回事，能否形成足夠壓力是另一回事，而後者往往取決於有多少不同群體加入。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_26","topic":"民國發展","difficulty":"basic","question":"一九三六年西安事變的直接結果是甚麼？","options":["日本被迫撤出東北","促成國共停止內戰、共同抗日","國民政府正式向日本宣戰","中共放棄根據地，接受國民政府改編"],"correctIndex":1,"explanation":"事變之後，內戰停止，第二次國共合作隨之形成。留意「直接結果」四字：正式對日宣戰是在一九四一年珍珠港事件之後，與西安事變相隔五年；日本撤出東北則要待一九四五年戰爭結束。答此類題目時，先確認題目問的是即時結果還是長遠影響。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_27","topic":"民國發展","difficulty":"basic","question":"南京國民政府時期，中國在對外關係上取得的一項具體進展是甚麼？","options":["成為國際聯盟的常任理事國","與日本簽訂互不侵犯條約","逐步收回關稅自主權","廢除了全部外國在華的租界"],"correctIndex":2,"explanation":"關稅自主是自《南京條約》以來被剝奪的權利，南京政府透過逐一改訂條約，於一九三○年代初大致恢復，是「改訂新約運動」較明顯的成果。至於租界，要到一九四三年才在戰時陸續交還；其餘兩項則與史實不符。評價這一時期，宜同時看到其成果與其未竟之處。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_28","topic":"中共建國至改革","difficulty":"basic","question":"一九五四年，中華人民共和國頒布第一部憲法。這部憲法確立了甚麼為最高國家權力機關？","options":["國務院轄下的各部及委員會","由各省推舉組成的省長會議","重新設立的科舉考試機構","全國人民代表大會"],"correctIndex":3,"explanation":"一九五四年憲法把國家的組織形式以成文法確定下來：人民代表大會制度為國家的根本政治制度，全國人民代表大會為最高國家權力機關，國務院則是最高國家行政機關，兩者的層級不可對調。留意科舉早於一九○五年已經停辦，與此期全無關係；把不同時代的制度混在一起，是本科常見的錯。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_29","topic":"中共建國至改革","difficulty":"basic","question":"一九七八年十一屆三中全會之後，中國在農村推行家庭聯產承包責任制。這項制度改變了甚麼？","options":["把生產經營的決定權交回農戶，並容許保留超額收成","把全部農地收歸國家直接經營","取消農業稅，並向農戶發放補貼","把農民全部遷入城市從事工業"],"correctIndex":0,"explanation":"人民公社時期，生產由集體統一安排，個人努力與所得之間關係薄弱。承包制把土地經營權下放到農戶，完成定額之後的收成歸自己，等於把努力與回報重新連上。理解這一點，就明白何以農業產出在短期內明顯上升 —— 改變的不是土地本身，而是誰承擔後果。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_30","topic":"中共建國至改革","difficulty":"basic","question":"文化大革命對中國的教育造成一項直接影響。這項影響是甚麼？","options":["恢復以科舉方式選拔各級官員","高等院校一度停止招生，正常教學中斷達數年之久","全面推行九年免費義務教育，入學率大幅上升","大量增設研究院所，研究人員數目倍增"],"correctIndex":1,"explanation":"高考中斷、院校停招、教師與知識分子受衝擊，使一代人的正規教育出現斷層，其後果在人才供應上持續多年。一九七七年恢復高考，正是為了修補這一斷層，故兩件事應連起來理解。留意九年免費教育與研究體系擴充均屬其後的發展，時序不可前置。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_31","topic":"中共建國至改革","difficulty":"basic","question":"「文化大革命」對中國的教育造成了甚麼直接影響？","options":["義務教育年限由六年延長至九年","大量學生獲派往歐美留學","正常教學與招生長期中斷，造成人才培養的斷層","高等院校數目大幅增加"],"correctIndex":2,"explanation":"大專院校停止正常招生多年，中小學教學亦嚴重受擾。其後果不止於當時：一代人的專業訓練出現缺口，而這批人本應在其後數十年成為各行業的骨幹。評價這段歷史時，須把即時的衝擊與這種延後才顯現的長期代價分開來看。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_32","topic":"香港與兩岸","difficulty":"basic","question":"一八九八年《展拓香港界址專條》與此前兩條條約在性質上有一項重要分別。這項分別是甚麼？","options":["新界由英國與清廷共同管治","新界的主權即時交還中國","該條約並未涉及任何土地","新界屬租借而非割讓，並訂有九十九年期限"],"correctIndex":3,"explanation":"香港島（一八四二）與九龍（一八六○）屬割讓，理論上無期限；新界（一八九八）則為租借，訂明九十九年。正因為租期有明確終點，一九九七這個年份才成為其後談判的起點 —— 一項條約的性質，可以在近百年後決定政治日程。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_33","topic":"香港與兩岸","difficulty":"basic","question":"香港開埠之後，港英政府把香港闢為「自由港」。這項安排的主要作用是甚麼？","options":["船貨進出基本免收關稅，吸引各地商船以此為轉口中心","向所有入境的居民徵收人頭稅，以增加政府收入","限制外國商船進入，以保障本地商人的利益","以高關稅保護本地製造業，扶植工業的發展"],"correctIndex":0,"explanation":"香港本身資源有限、腹地不大，自由港政策把地理位置的優勢轉化為制度上的優勢：貨物毋須繳付關稅即可轉運，商人自然選擇經此進出。轉口貿易因而成為香港早期經濟的支柱，亦奠定了其後「中介」角色的基礎。留意自由港的邏輯與保護關稅剛好相反，兩者不可混為一談。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_34","topic":"香港與兩岸","difficulty":"basic","question":"二十世紀五十至七十年代，香港由轉口港轉型為工業城市。以下哪一項是這次轉型的重要條件？","options":["內地在此期間全面開放對外貿易","大量南來的資金、技術與勞動力","英國政府提供的大額工業補貼","本地豐富的煤鐵等天然資源"],"correctIndex":1,"explanation":"轉型的條件由兩方面構成：外部的推力（韓戰引致的禁運令轉口貿易受阻）與本地的要素（南來的資本、機器、企業經驗，加上大量新增而工資偏低的勞動力）。香港本身並無煤鐵，工業以輕工業為主；而內地全面開放對外貿易，要待一九七八年之後。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_35","topic":"香港與兩岸","difficulty":"basic","question":"一九四九年之後，海峽兩岸長期處於分治狀態。造成這一局面的直接原因是甚麼？","options":["聯合國決議把台灣列為託管地","兩岸在一九四九年簽訂分治協議","國共內戰結束後，國民政府遷往台灣","台灣在戰後由日本繼續管治"],"correctIndex":2,"explanation":"一九四五年台灣已由日本交還中國；一九四九年內戰結束，國民政府遷台，兩岸自此分治。答此類題目要留意「直接原因」與「背景」之別：日本殖民統治的五十年是背景，內戰的結局才是直接原因。至於託管與分治協議，均與史實不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_36","topic":"晚清變局","difficulty":"basic","question":"義和團事件之後，清廷與列強簽訂《辛丑條約》。該條約對清政府造成的最直接影響是甚麼？","options":["須把香港島割讓予英國，開啟割地之始","須開放五個沿海口岸，准許外商通商居住","須承認朝鮮獨立，放棄對其宗主地位","須支付巨額賠款，並容許外國在京畿一帶駐兵"],"correctIndex":3,"explanation":"賠款額之巨使清廷財政長期受制，而外國駐兵於京畿更直接削弱其自衞能力，清政府自此在對外事務上愈發被動，這亦是其後新政與立憲之議轉趨迫切的背景。其餘三項均為真實條款，但分屬別的條約：割讓香港島與開放五口出自《南京條約》，承認朝鮮獨立出自《馬關條約》。把條約與條款對錯號，是本課最常見的失分位。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_37","topic":"辛亥革命","difficulty":"basic","question":"同盟會於一九○五年在東京成立。它的性質是甚麼？","options":["由多個革命團體合併而成的全國性革命組織","清廷為推行新政而設立的官方機構","主張保留皇帝而實行君主立憲的改良團體","由外國商人在華設立的商業組織"],"correctIndex":0,"explanation":"同盟會把興中會、華興會、光復會等分散的革命力量集合起來，並提出綱領與機關報，使革命由各自為戰轉為有共同目標的運動，是辛亥革命得以在多省響應的組織基礎。留意它與立憲派的分別在於【目標】而非手段：立憲派主張保留皇帝而限制其權力，革命派則要推翻帝制另建共和，兩者當時並存而互相論戰，不可混為一談。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"chist_floor_38","topic":"民國發展","difficulty":"basic","question":"軍閥割據時期的基本特徵是甚麼？","options":["地方行政由科舉出身的文官體系全面掌握","各地軍事實力人物各據地盤，中央政府號令難行","全國由單一政黨統一管治，政令上下貫通","政權由議會多數黨組成，並按期改選更替"],"correctIndex":1,"explanation":"帝制結束之後，統一的權威未能重建，掌握軍隊者即掌握實權，各據一方而互相攻伐，中央政府雖然名義存在，實際能夠支配的範圍有限。這一局面直接造成賦稅繁重、交通阻斷與民生困苦，亦解釋了為何其後「統一」成為各方共同訴求。留意科舉已於一九○五年停辦，以文官體系描述此期並不符史實。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function mark(i, v){ const d = DATA[i]; state[d.id] = v; const el = document.getElementById('c'+i);

  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  const out = { _meta: { source: "chinese-history-floor.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Date().toISOString().slice(0,10) }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "chinese-history-floor.decisions.json"; a.click();
});
counts();
</script></body></html>
