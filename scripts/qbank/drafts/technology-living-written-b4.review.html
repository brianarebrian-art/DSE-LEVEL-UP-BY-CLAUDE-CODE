<script>
const DATA = [{"id":"tl_w4_01","topic":"膳食營養素","difficulty":"basic","question":"膳食纖維不能被人體消化吸收，卻仍被視為重要的膳食成分。試說明其兩項作用。","explanation":"答案須指出具體的生理作用，不可只答「幫助消化」。宜分別交代不可溶與可溶纖維的不同作用，以顯示理解並非一般常識層面。","type":"text","referenceAnswer":"作用一：增加糞便體積並縮短通過腸道的時間。\n不可溶性纖維吸水後膨脹，令糞便體積增加、質地較軟，對腸壁形成機械刺激，促進蠕動。結果是排便較為規律，可減少便秘，亦縮短腸內容物與腸壁接觸的時間。\n作用二：減慢醣類與脂肪的吸收速度。\n可溶性纖維在腸道內形成黏稠的膠狀物，令食糜與消化酶的接觸變慢，葡萄糖進入血液的速度因而減緩，餐後血糖升幅較平穩。此類纖維亦可與膽鹽結合並隨糞便排出，肝臟須動用膽固醇合成新的膽鹽，有助降低血液膽固醇水平。\n（其他可接受的作用：增加飽足感，有助控制總能量攝取；為腸道細菌提供發酵基質。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w4_02","topic":"成衣與時尚","difficulty":"basic","question":"同一款外套分別以棉與聚酯纖維製造。試就吸濕性與護理兩方面，比較兩種纖維的表現。","explanation":"本題要求比較，答案須兩種纖維並列，並以纖維結構解釋表現差異，不可只列結果。「較易乾」須說明原因，方為完整。","type":"text","referenceAnswer":"吸濕性：\n棉屬纖維素纖維，分子鏈上有大量親水基團，水分子可進入纖維內部，故吸濕能力高。穿著時汗水被吸入纖維，貼膚感覺乾爽，適合炎熱天氣與貼身衣物；但吸水後纖維膨脹，衣物變重，且水分留在纖維內部，乾燥緩慢。\n聚酯纖維屬合成纖維，分子結構緊密而疏水，吸濕能力極低。汗水不進入纖維，只沿纖維之間的空隙流動，故衣物本身不易濕重，乾燥快；但若織物結構密實，汗水無法排出，貼膚會有黏膩與悶熱之感。\n護理：\n棉耐高溫，可用較高水溫洗滌及熨燙，但易皺、乾燥時間長，且反覆洗滌後可能縮水，故多須預縮處理。\n聚酯纖維不易皺、快乾、尺寸穩定，洗後多數免燙；但耐熱性低，高溫熨燙會令纖維熔化或起硬塊，故須低溫並墊布。此外，聚酯纖維易吸附油污，去油漬較棉困難，亦較易產生靜電與起毛球。\n綜合：棉勝在舒適與耐熱，聚酯勝在快乾與易於打理。實務上常採用混紡，以兼取兩者之長。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w4_03","topic":"生命週期營養","difficulty":"intermediate","question":"青春期青少年的能量與蛋白質需要量高於兒童期。試說明此一轉變的生理原因，並指出為青少年設計膳食時須特別注意的兩項營養素。","explanation":"本題有兩問。第二部分須說明【為何】該營養素特別重要，只列出名稱不予高分；宜結合青春期的生理變化作答，例如骨骼累積與月經失血。","type":"text","referenceAnswer":"生理原因：\n其一，生長速率達到出生後的第二個高峰。身高與體重在數年間快速增加，新組織的合成需要大量蛋白質作為原料，亦需要相應的能量支持合成過程。\n其二，體成分改變。肌肉組織比例上升，而肌肉的維持與增長需要蛋白質；同時基礎代謝率隨去脂體重上升而增加，靜止狀態下的能量消耗高於兒童期。\n其三，活動量通常較高，加上生長本身的能量成本，總需要量因而上升。\n須特別注意的營養素：\n一、鈣。骨骼質量在青春期大幅累積，成年後的骨峰值有相當部分在此階段形成。此時攝取不足，日後難以補回，會提高中老年骨質疏鬆的風險。宜從奶類及其製品、深綠色蔬菜、連骨小魚、加鈣豆製品攝取，並注意維生素D 有助鈣的吸收。\n二、鐵。男性因肌肉量增加而血容量上升，女性則因月經開始而持續失血，兩者的鐵需要量均高於兒童期。攝取不足會引致缺鐵性貧血，影響專注力與體能。宜攝取紅肉、動物肝臟等吸收率較高的血紅素鐵；若以植物來源為主，宜同餐配搭含維生素C 的食物以提升吸收率，並避免同餐飲用濃茶。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w4_04","topic":"食物科學","difficulty":"intermediate","question":"製作蛋糕時，打發蛋白可令成品膨鬆。試說明蛋白能夠形成穩定泡沫的原理，並指出製作時若混入蛋黃，為何會導致失敗。","explanation":"本題考核蛋白質變性與界面作用，答案須說明機制，不可只答「打入空氣」。第二部分必須指出脂質如何干擾蛋白質在氣液界面的排列，答「蛋黃太油」而無機制者不予高分。","type":"text","referenceAnswer":"形成穩定泡沫的原理：\n蛋白的主要成分是水與球狀蛋白質。攪打時，機械力把空氣打入液體，形成大量氣泡；同時攪打的剪切力令球狀蛋白質的結構部分展開，此即機械變性。展開後的蛋白質分子露出原本藏於內部的疏水部分與親水部分，前者朝向氣泡內的空氣，後者留在水相之中，於是蛋白質整齊地排列在氣液界面之上。\n隨著攪打繼續，相鄰的展開蛋白質分子之間形成新的鍵結，在氣泡表面交織成具彈性的薄膜，把空氣包裹固定。泡沫因而不易破裂或合併。入爐加熱後，氣泡中的空氣與水蒸氣受熱膨脹，蛋白質進一步凝固，薄膜定型，成品的膨鬆結構得以保留。\n混入蛋黃為何導致失敗：\n蛋黃含大量脂質與卵磷脂。脂質分子同樣具備疏水性，會搶先佔據氣液界面的位置，並插入正在形成的蛋白質薄膜之中，阻礙相鄰蛋白質分子彼此接合。薄膜因而出現斷口，無法連成完整而有彈性的結構。\n結果是：氣泡雖然打得起，但迅速破裂或合併成大泡，體積難以達到所需程度，靜置片刻即出水塌陷。故製作時須確保分蛋徹底，並且器皿與打蛋器不可沾有油脂。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w4_05","topic":"膳食計劃","difficulty":"intermediate","question":"為一個雙職家庭設計一週膳食計劃時，除營養均衡外，尚須考慮哪些實際條件？試指出三項，並分別說明其如何影響計劃的可行性。","explanation":"本題考核計劃的可行性，答案必須把條件與可行性連繫起來。只列出「時間」「金錢」「口味」而無說明者，未達要求。宜指出一份營養上完美但無法執行的計劃，實際效果為零。","type":"text","referenceAnswer":"條件一：可用的備餐時間與其分布。\n雙職家庭平日晚上可用時間有限，若計劃中多數菜式需時一小時以上，執行數天後便會放棄，改為外賣。故計劃須把費時的菜式安排於假日，平日則以三十分鐘內可完成者為主，並善用一次烹調、分次食用的做法。時間條件決定計劃能否維持，其重要性不低於營養設計本身。\n條件二：預算及食材價格的波動。\n膳食計劃須在家庭可負擔的範圍之內，否則同樣無法持續。宜以當造food材為主，因其價格較低而品質較佳；並安排同一批食材在數餐之內用盡，減少因分量買太多而變壞的浪費。若計劃頻繁使用價格高昂或須專門採購的材料，執行成本將超出預期。\n條件三：家庭成員的飲食限制與接受程度。\n包括過敏、宗教規定、長者的咀嚼與吞嚥能力、以及兒童對某些食物的抗拒。若計劃中有成員不能或不願進食的項目，實際上該餐須另行處理，等於計劃失效。設計時宜先確認限制，再在可接受的範圍內求變化。\n（其他可接受的條件：廚房設備與儲存空間；採購的便利程度；成員的作息是否一致，能否同桌用膳。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w4_06","topic":"消費與可持續","difficulty":"intermediate","question":"「快時尚」模式以低價、款式更替迅速為特徵。試分析此一模式對環境造成壓力的兩個環節，並指出消費者層面可行的兩項應對方式。","explanation":"本題須指出【環節】，即壓力在生產或消費流程的哪一步產生，而非只說「污染環境」。應對方式須是消費者層面可行者，提出「立法規管」屬另一層次，不符題目要求。","type":"text","referenceAnswer":"環節一：纖維生產與染整。\n棉花種植需要大量水與農藥；合成纖維以石油為原料，生產過程耗能。其後的染整工序用水量大，並排出含染料與助劑的廢水，若處理不足會影響水體。由於快時尚追求低成本與短交期，此環節的環保投入往往被壓縮。\n環節二：使用期短與棄置。\n款式更替快令衣物的實際穿著次數大幅減少，部分衣物僅穿數次即被棄置。合成纖維在堆填區難以分解；混紡衣物因纖維成分難以分離，回收處理困難。加上洗滌時脫落的微塑膠纖維會隨污水進入水體，此一環節的壓力並不止於棄置一刻。\n消費者層面的應對：\n一、以「每次穿著成本」取代「售價」作為購買準則。\n計算方式為售價除以預計穿著次數。一件較貴但會穿五十次的外套，每次成本低於一件便宜而只穿三次者。此一轉換令耐穿、百搭、易於配襯的款式在決策中佔優，自然減少購買量。\n二、延長現有衣物的使用期。\n包括按標籤正確洗滌以減少損耗、學習簡單修補、把不再合穿的衣物轉贈或交予回收，以及在購入前先檢視衣櫃是否已有同類款式。此類做法不需額外開支，而效果直接作用於使用期短這一環節。\n（其他可接受的做法：選購單一成分而非混紡的衣物以利回收；優先考慮二手或租賃。）","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w4_07","topic":"營養計算","difficulty":"hard","question":"某午餐包含：白飯 200 克（每 100 克含碳水化合物 28 克、蛋白質 3 克、脂肪 0.3 克）、蒸魚 80 克（每 100 克含蛋白質 20 克、脂肪 5 克）、炒菜 150 克（每 100 克含碳水化合物 4 克、蛋白質 2 克，烹調另加植物油 10 克）。植物油每 100 克含脂肪 100 克。\n(a) 計算此餐的碳水化合物、蛋白質及脂肪總量（克，準確至小數點後一位）。\n(b) 已知碳水化合物與蛋白質每克提供 4 千卡，脂肪每克提供 9 千卡。計算此餐的總能量（千卡，準確至整數）。\n(c) 計算脂肪所提供的能量佔總能量的百分比（準確至小數點後一位）。\n(d) 一般建議脂肪應佔每日總能量的 20% 至 30%。試就計算結果評論此餐，並提出一項具體改善建議。","explanation":"本題的常見錯誤有三。其一，忘記把每 100 克的數值按實際分量換算，直接把表列數字相加。其二，漏計烹調用油 —— 油的分量雖小，但每克提供 9 千卡，對脂肪比例影響極大，此處正是設計陷阱所在。其三，(c) 的分母誤用「食物總重量」而非「總能量」。\n(d) 須就計算結果作答，不可憑印象評論；改善建議須具體可行，並且與計算所顯示的問題對應。","type":"long","referenceAnswer":"(a) 逐項換算：\n碳水化合物 = 白飯 200 ÷ 100 × 28 = 56.0 克；炒菜 150 ÷ 100 × 4 = 6.0 克；合計 62.0 克。\n蛋白質 = 白飯 200 ÷ 100 × 3 = 6.0 克；蒸魚 80 ÷ 100 × 20 = 16.0 克；炒菜 150 ÷ 100 × 2 = 3.0 克；合計 25.0 克。\n脂肪 = 白飯 200 ÷ 100 × 0.3 = 0.6 克；蒸魚 80 ÷ 100 × 5 = 4.0 克；食油 10 克 × 100% = 10.0 克；合計 14.6 克。\n\n(b) 總能量 = (62.0 + 25.0) × 4 + 14.6 × 9 = 348.0 + 131.4 = 479.4 ≈ 479 千卡。\n\n(c) 脂肪能量 = 14.6 × 9 = 131.4 千卡。\n百分比 = 131.4 ÷ 479.4 × 100% = 27.4%。\n\n(d) 評論：脂肪佔總能量 27.4%，落在建議的 20% 至 30% 之內，故【就脂肪比例而言此餐並無超標】。\n值得注意的是，全餐 14.6 克脂肪之中有 10 克來自烹調用油，佔六成八。即是說，比例之所以仍然合格，是因為主菜採用蒸而非煎炸；若同一份魚改以煎製，脂肪即會明顯超出範圍。\n具體改善建議：增加蔬菜分量至 200 克左右，同時把炒菜改為快灼後淋少量油拌勻。此舉可提高膳食纖維與維生素攝取，並把用油量由 10 克減至約 5 克，使脂肪比例降至約 20%，更接近範圍下限，而總能量亦相應下降。\n（亦可接受：指出白飯 200 克提供的碳水化合物偏高而蛋白質來源單一，建議部分白飯改為糙米並加入豆製品。）","markingScheme":"(a) 3 分 —— 碳水化合物 62.0 克（1）；蛋白質 25.0 克（1）；脂肪 14.6 克（1）。\n   各項須列出換算步驟；若步驟正確而算術有誤，該項給 0 分但不影響其餘各項。\n   ⚠️ 脂肪一項若漏計 10 克食油（得 4.6 克），該分不給，並影響 (b)(c)。\n(b) 2 分 —— 列式 (62.0 + 25.0) × 4 + 14.6 × 9（1）；答 479 千卡（1）。\n   採用 (a) 之錯誤數值但方法正確者，(b) 可給方法分。\n(c) 1 分 —— 14.6 × 9 ÷ 479 × 100% = 27.4%。分母須為總能量。\n(d) 2 分 —— 指出 27.4% 落在 20% 至 30% 建議範圍之內（1）；提出具體改善並說明理由（1）。\n   ⚠️ 答「脂肪過高，應減油」得 0 分 —— 與計算結果相反。\n   可接受的建議須針對其他不足之處，例如蔬菜分量偏少、或指出雖在範圍內但用油量集中於單一菜式。","suggestedMinutes":12,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"tl_w4_08","topic":"食物與紡織科學","difficulty":"hard","question":"食物加工與紡織加工皆會運用「改變材料結構以取得所需性質」的原理。試各舉一例說明，並指出兩者在原理上的共通之處。","explanation":"本題要求跨範疇的原理比較，難點在第三部分。若只寫出兩個例子而不提煉共通原理，屬未完成。共通之處宜落在「化學成分不變而結構改變」這一層次。","type":"text","referenceAnswer":"食物加工的例子：搓揉麵糰以形成麵筋。\n小麥麵粉中的麥穀蛋白與麥膠蛋白，加水後開始水合。搓揉所施加的機械力令這些蛋白質分子舒展、對齊，並在彼此之間形成二硫鍵與其他鍵結，交織成連續而具彈性的網絡。此一網絡能夠保留發酵所產生的二氧化碳，麵包因而膨脹並具有咀嚼的韌性。所加的仍然是同一批麵粉與水，蛋白質的化學種類並未改變，改變的是其空間排列。\n紡織加工的例子：加捻成紗。\n棉纖維本身短而鬆散，單根纖維的強度有限，無法直接織造。紡紗時把大量纖維並列並施加捻度，纖維因而傾斜排列並互相抱合，纖維之間的摩擦力大幅上升，外力作用時由整束纖維共同承擔。紗線的強度遂遠高於同等重量的散纖維。此處棉纖維的化學成分（纖維素）完全不變，改變的同樣是排列方式。\n共通之處：\n其一，兩者皆不改變材料的化學本質，而是改變其【組織結構】—— 分子或纖維之間的相對位置與連接方式。所得的新性質（彈性、保氣性、抗拉強度）來自結構，而非來自新的物質。\n其二，兩者皆以機械力作為改變結構的手段，且效果與施力的程度相關，並存在最佳範圍。搓揉不足則麵筋未成形，過度則網絡斷裂、麵糰變黏；加捻不足則紗線鬆散易斷，過度則紗線變硬、扭結，織物手感粗糙。兩者皆呈現「適量則佳、過猶不及」的關係。\n其三，兩者的結構改變均需固定方可保存。麵糰經烘焗使蛋白質凝固而定型；紗線則經加熱定型或織造後的整理工序穩定其捻度。若缺此一步，結構會隨時間鬆弛回復。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "technology-living-written-b4.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "technology-living-written-b4.decisions.json"; a.click();
});
counts();
</script></body></html>
