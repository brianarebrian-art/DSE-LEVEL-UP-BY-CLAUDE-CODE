orrectIndex":0,"explanation":"制度評價的完整性在於能否解釋【變化】：任何制度若只有優點，便沒有理由被取代。郡縣制強化了中央控制，同時也令地方缺乏自主而在王朝末年難以自救；科舉打破門第壟斷，明清時期卻因八股取士而窒礙思想。指出局限並非否定制度，而是說明它在甚麼條件下有效、在甚麼條件下失效 —— 這正是「評價」與「介紹」的分別。其餘三項各自走向另一極端：全盤否定、認為無關、或把客觀誤解為只講缺點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_mc_01","topic":"近現代變局・評價","difficulty":"intermediate","question":"評價洋務運動時，指出它「只學技術而不改制度」。這個評價的依據是甚麼？","options":["其重點在興辦軍工與新式企業，政治體制與科舉取士基本維持不變","其重點在改革政治體制與法律制度，但完全沒有引入任何西方技術","其重點在推行議會與選舉制度，但軍事上仍然保留傳統裝備","其重點在廢除科舉與改革學制，但原有的官僚體系維持不變"],"correctIndex":0,"explanation":"洋務運動以「師夷長技以制夷」為方針，重點在造船、製械、辦礦、興學堂等器物層面，而「中學為體、西學為用」正是其自我定位：制度與價值不動，只取技術。甲午戰敗令這條路線受到嚴重質疑 —— 同樣引進西方技術的日本因明治維新改革了制度而勝出，對比之下促成其後的維新變法主張制度改革。要留意評價須有具體依據：說「只學技術」，就要指出它辦了甚麼、沒有改甚麼。其餘三項與洋務運動的實際內容不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_mc_02","topic":"近現代變局・評價","difficulty":"hard","question":"在因果分析中，把一場歷史變局歸因於單一原因，通常有甚麼問題？","options":["歷史變局多由長期結構因素與短期觸發因素交互造成","歷史事件根本沒有原因可言，因此任何形式的歸因都必然錯誤","單一歸因的篇幅太過簡短，未能達到論述題所要求的字數","單一歸因必然把責任推給個別人物，因而對當事人並不公允"],"correctIndex":0,"explanation":"史學上通常把成因分為【長期結構因素】（如財政積弱、土地兼併、外部壓力累積）與【短期觸發因素】（某次戰敗、某項政令、某個突發事件）。只講觸發因素，會令事件顯得偶然，彷彿沒有那一件事就不會發生；只講結構因素，則無法解釋為何偏偏在那個時刻爆發。兩者兼顧，才能同時回答「為何會發生」與「為何在此時發生」。第二項否定因果本身；第三項把史學方法問題降格為字數；第四項則假設單一歸因必然指向個人，但單一歸因同樣可以是結構性的。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_mc_03","topic":"近現代變局・評價","difficulty":"intermediate","question":"使用歷史材料時，一份當事人的回憶錄有何特點須要注意？","options":["當事人親歷其事，細節具價值，但立場與記憶偏差同樣須要考慮","當事人親歷其事，所述必為事實，可直接作為結論的依據","回憶錄屬個人記述，完全沒有史料價值，應一律不予採用","回憶錄的可信度只取決於作者的官職高低，官職愈高愈可信"],"correctIndex":0,"explanation":"回憶錄屬第一手材料，提供的細節、氛圍與動機往往是官方檔案所欠缺的，價值明確。但同時須留意三重限制：作者身處事件之中，立場可能影響取捨；回憶多在事後多年寫成，記憶會隨時間重構；書寫本身可能帶有自辯或塑造形象的動機。因此正確用法是【與其他來源互相印證】，而非單獨採信或一概否定。第二項與第三項分別是全盤採信與全盤否定，都放棄了史料批判；第四項以官職代替內容分析，官職高低與記述是否可靠並無必然關係。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
