<script>
const DATA = [{"id":"floor4_chist_ai_01","topic":"古代制度・因果","difficulty":"basic","question":"秦朝推行郡縣制，取代西周的分封制。這項改變在中央與地方關係上最主要的影響是甚麼？","options":["地方長官由中央任免而不世襲，中央對地方的控制大幅加強","地方長官由當地世家大族推舉產生，中央必須尊重地方既有的勢力","地方保有獨立的軍隊與財政，可自行決定是否服從中央的政令","中央與地方的權力完全對等，一切重大事務均須雙方協商後決定"],"correctIndex":0,"explanation":"分封制之下，諸侯受封土地與人民，爵位世襲，其領地實質上是一個個小型政權，中央難以直接管治；日久之後諸侯坐大，正是春秋戰國分裂的制度根源。郡縣制則把地方官員改為【由中央任免、有任期、不世襲】，官員的權力來自朝廷授予而非血緣繼承，中央因而能直接控制地方。這項制度為此後兩千年的中央集權奠下基礎。其餘三項描述的分別是推舉制、割據狀態與聯邦式安排，皆非郡縣制的特徵。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_ai_02","topic":"古代制度・因果","difficulty":"intermediate","question":"漢武帝推行「推恩令」，容許諸侯把封地分給眾子。其實際效果是甚麼？","options":["封地不斷細分而力量分散，諸侯勢力在不動武的情況下被削弱","諸侯的封地不斷合併擴大，兵力與財力因而顯著增強","諸侯的爵位被即時廢除，封地全部收歸中央直接管轄","中央須向諸侯增撥土地作為補償，國庫負擔因而加重"],"correctIndex":0,"explanation":"推恩令的巧妙之處在於【以恩惠之名行削弱之實】。原本封地由嫡長子一人繼承，勢力得以保持；改為諸子分封之後，一代之後封地被分成數塊，兩三代之後便細碎得不足為患。由於此令表面上惠及眾子，諸侯難以名正言順地反對，中央因而避免了七國之亂那樣的武力衝突。這是制度設計以誘因取代強制的典型例子。有一項描述的是直接廢除，與推恩令的漸進手法相反；其中兩項與史實方向相違。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_ai_03","topic":"古代制度・因果","difficulty":"intermediate","question":"隋唐科舉制與魏晉九品中正制相比，在選拔人才上的關鍵分別是甚麼？","options":["前者以考試成績取士，後者以門第評品，出身的作用大幅下降","前者以門第高低取士，後者以考試成績取士，兩者恰好相反","兩者同樣以考試取士，分別僅在於考試的科目數量不同","兩者同樣以推薦取士，分別僅在於推薦人的官職高低不同"],"correctIndex":0,"explanation":"九品中正制由中正官按門第與鄉評把士人分為九等，制度運行日久，「上品無寒門、下品無勢族」，實際上成為世家壟斷仕途的工具。科舉改為【以考試成績取士】，理論上向各階層開放，寒門子弟得以憑學問晉身，士族對官位的壟斷因而鬆動。要注意這是相對而非絕對的變化：備考需要長期脫產讀書，家境仍然重要，唐代的世家影響力亦未即時消失 —— 但選拔的【標準】由血統轉為才學，這是制度上的根本轉折。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_ai_04","topic":"古代制度・因果","difficulty":"hard","question":"評價一項古代制度時，若只列出其優點而不提及其局限，會有甚麼問題？","options":["未能解釋該制度為何最終被取代或改革，論述因而不完整","所有古代制度都有害無益，因此不應提及任何優點","古代制度與現代無關，因此優點與局限都不必討論","列出優點屬於主觀判斷，只有列出缺點才算客觀"],"correctIndex":0,"explanation":"制度評價的完整性在於能否解釋【變化】：任何制度若只有優點，便沒有理由被取代。郡縣制強化了中央控制，同時也令地方缺乏自主而在王朝末年難以自救；科舉打破門第壟斷，明清時期卻因八股取士而窒礙思想。指出局限並非否定制度，而是說明它在甚麼條件下有效、在甚麼條件下失效 —— 這正是「評價」與「介紹」的分別。其餘三項各自走向另一極端：全盤否定、認為無關、或把客觀誤解為只講缺點。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_mc_01","topic":"近現代變局・評價","difficulty":"intermediate","question":"評價洋務運動時，指出它「只學技術而不改制度」。這個評價的依據是甚麼？","options":["其重點在興辦軍工與新式企業，政治體制與科舉取士基本維持不變","其重點在改革政治體制與法律制度，但完全沒有引入任何西方技術","其重點在推行議會與選舉制度，但軍事上仍然保留傳統裝備","其重點在廢除科舉與改革學制，但原有的官僚體系維持不變"],"correctIndex":0,"explanation":"洋務運動以「師夷長技以制夷」為方針，重點在造船、製械、辦礦、興學堂等器物層面，而「中學為體、西學為用」正是其自我定位：制度與價值不動，只取技術。甲午戰敗令這條路線受到嚴重質疑 —— 同樣引進西方技術的日本因明治維新改革了制度而勝出，對比之下促成其後的維新變法主張制度改革。要留意評價須有具體依據：說「只學技術」，就要指出它辦了甚麼、沒有改甚麼。其餘三項與洋務運動的實際內容不符。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_mc_02","topic":"近現代變局・評價","difficulty":"hard","question":"在因果分析中，把一場歷史變局歸因於單一原因，通常有甚麼問題？","options":["歷史變局多由長期結構因素與短期觸發因素交互造成","歷史事件根本沒有原因可言，因此任何形式的歸因都必然錯誤","單一歸因的篇幅太過簡短，未能達到論述題所要求的字數","單一歸因必然把責任推給個別人物，因而對當事人並不公允"],"correctIndex":0,"explanation":"史學上通常把成因分為【長期結構因素】（如財政積弱、土地兼併、外部壓力累積）與【短期觸發因素】（某次戰敗、某項政令、某個突發事件）。只講觸發因素，會令事件顯得偶然，彷彿沒有那一件事就不會發生；只講結構因素，則無法解釋為何偏偏在那個時刻爆發。兩者兼顧，才能同時回答「為何會發生」與「為何在此時發生」。有一項否定因果本身；另一項把史學方法問題降格為字數；還有一項則假設單一歸因必然指向個人，但單一歸因同樣可以是結構性的。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor4_chist_mc_03","topic":"近現代變局・評價","difficulty":"intermediate","question":"使用歷史材料時，一份當事人的回憶錄有何特點須要注意？","options":["當事人親歷其事，細節具價值，但立場與記憶偏差同樣須要考慮","當事人親歷其事，所述必為事實，可直接作為結論的依據","回憶錄屬個人記述，完全沒有史料價值，應一律不予採用","回憶錄的可信度只取決於作者的官職高低，官職愈高愈可信"],"correctIndex":0,"explanation":"回憶錄屬第一手材料，提供的細節、氛圍與動機往往是官方檔案所欠缺的，價值明確。但同時須留意三重限制：作者身處事件之中，立場可能影響取捨；回憶多在事後多年寫成，記憶會隨時間重構；書寫本身可能帶有自辯或塑造形象的動機。因此正確用法是【與其他來源互相印證】，而非單獨採信或一概否定。其中兩項分別是全盤採信與全盤否定，都放棄了史料批判；有一項以官職代替內容分析，官職高低與記述是否可靠並無必然關係。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_chist_ai_05","topic":"古代制度・因果","difficulty":"intermediate","question":"唐代三省六部制之中，中書、門下、尚書三省的分工如何體現制衡？","options":["中書草擬、門下審議、尚書執行，政令須經三道關口方能推行","三省各自獨立草擬政令，互不干涉，因而效率最高","三省同時執行同一政令，以確保政令必定得到落實","三省輪流掌管全部政務，每省任期屆滿即交由下一省"],"correctIndex":0,"explanation":"三省的分工把決策過程拆成三個環節：中書省草擬詔令，門下省審議並可以封駁（退回不同意的詔令），尚書省負責執行。關鍵在於【審議】這一環 —— 門下省有權駁回，等於在皇帝與執行之間加了一道複核，減少草率決策。同時，相權由一人分散到三省長官，皇權因而相對加強。要留意這套制度的制衡是行政程序上的，並非現代意義的分權，最終決定權仍在皇帝。其餘三項分別描述了無分工、重複執行與輪流當值，都不是三省制的結構。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_chist_ai_06","topic":"古代制度・因果","difficulty":"hard","question":"一項制度在推行初期成效顯著，其後逐漸失效。分析這種變化時應着眼於甚麼？","options":["制度所依賴的條件是否改變，以及有無人找到規避的方法","推行該制度的人是否品德敗壞，制度成效全由人的品格決定","該制度的條文是否寫得夠長，條文愈詳盡則愈不會失效","該制度是否由開國君主所創，開國制度必然較後世穩固"],"correctIndex":0,"explanation":"制度失效通常有兩條路徑。一是【前提改變】：均田制依賴國家掌握足夠的無主土地，人口增長與土地兼併之後前提不再成立，制度隨之瓦解。二是【被規避】：任何規則一經運行，相關的人便會摸索它的邊界，九品中正制原意兼顧鄉評，運行日久卻被門第操控。分析制度變化，正是要追問這兩點，而非停在「後人不肖」。有一項把制度問題化約為個人品德，正是傳統史論最常見的簡化；其中兩項所提的條文長度與創制者身分，與制度能否持續並無必然關係。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_chist_ai_07","topic":"古代制度・因果","difficulty":"intermediate","question":"秦漢以後，中央集權不斷加強而相權不斷削弱。這條長期趨勢的主要動力是甚麼？","options":["皇帝為防範權臣，持續把相權分割並另設近臣機構代行","歷代宰相能力持續下降，因而無法承擔原有的職權","地方勢力持續坐大，中央被迫把相權轉移至地方","人口持續增長令政務繁重，宰相因而主動請求減權"],"correctIndex":0,"explanation":"這條趨勢的動力來自皇權與相權之間的結構性張力。漢代設內朝以分外朝之權，唐代以三省分割相權，宋代設參知政事與樞密使進一步分割，明代索性廢除丞相而設內閣，清代再設軍機處 —— 每一步都是把原本集中的相權拆散，或另設一個更接近皇帝的機構代行其職。認清這條線索，便能理解為何看似不同的制度改革，方向卻高度一致。有一項以個人能力解釋長期制度趨勢；另一項與中央集權加強的事實相反；還有一項所述的主動請求並無史實依據。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_chist_mc_04","topic":"近現代變局・評價","difficulty":"intermediate","question":"評價一場改革運動時，指出它「失敗」之後，還應該進一步說明甚麼？","options":["以甚麼標準判斷失敗，以及它在哪些方面仍然留下了影響","該運動的領袖姓名與生卒年份，資料愈齊備愈客觀","同時期外國有無類似運動，有則說明中國必然落後","該運動失敗即證明其主張錯誤，不必再作任何討論"],"correctIndex":0,"explanation":"「失敗」不是一個自明的結論，而是一個需要界定的判斷：以達成原定目標為標準，還是以對後續發展的影響為標準？戊戌變法以前者論確實失敗（百日而終），但它把制度改革的主張帶入公共討論，並促成其後的清末新政與立憲運動，以後者論則留下實質影響。完整的評價要同時交代標準與影響，否則「失敗」二字會掩蓋掉真正需要分析的部分。有一項以資料齊備冒充客觀；另一項以外國作參照推出價值判斷；還有一項把結果等同對錯，正是評價題最需要避免的簡化。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_chist_mc_05","topic":"近現代變局・評價","difficulty":"hard","question":"以今日的價值標準去評價古人的行為，這種做法有何風險？","options":["忽略當時的可選項目限制，把不存在的選擇當成當事人拒絕","完全沒有風險，道德標準古今一致，可以直接套用評價","會令評價過於寬鬆，因為今人的標準必然低於古人","會令史料無法解讀，因為古文必須以古代標準理解"],"correctIndex":0,"explanation":"時代錯置的核心問題不在於今人有沒有資格批評，而在於【可選項目集】不同：批評一位十九世紀官員「為何不推行民主選舉」，等於假設當時存在一條他選擇不走的路，但那條路在當時的認知與制度條件之下並不存在。合理的做法是先問：在當時的條件下，他有哪些實際可行的選項，他選了哪一個，同時代有無人作出不同選擇。這樣既保留評價，又不把不存在的選擇算到當事人頭上。有一項否認脈絡差異；另一項的方向不成立；還有一項把價值評價與文本解讀兩件事混為一談。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_chist_mc_06","topic":"近現代變局・評價","difficulty":"intermediate","question":"兩份史料對同一事件的記載互相矛盾。研究者應該怎樣處理？","options":["比較兩者的來源、成書時間與立場，再尋找第三方材料互相印證","選擇年代較早的一份，年代愈早則記載必然愈為可靠","選擇篇幅較長的一份，記載愈詳細則必然愈接近事實","兩份同時放棄，凡有矛盾的史料一律不可用於研究"],"correctIndex":0,"explanation":"史料矛盾是常態而非例外，處理方法是【史料批判】：這份材料由誰寫、為誰而寫、何時寫成、作者身處事件的甚麼位置、有無利害關係。年代較早未必較可靠 —— 當事人即時的記述可能立場鮮明；篇幅較長亦未必較準確 —— 詳細的細節可能是後世的追記或想像。最有力的做法是尋找立場不同的第三方材料，看哪一份記載得到獨立印證。矛盾本身往往就是線索：它顯示事件在當時已有爭議，而爭議的內容值得追問。有一項放棄了整個研究工作。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
