<script>
const DATA = [{"id":"elit_w4_01","topic":"Drama","difficulty":"basic","question":"In a play, a character speaks a long passage alone on stage. Explain two things a soliloquy can do that dialogue cannot.","explanation":"The answer must turn on what the convention makes possible, not on what any particular soliloquy happens to contain. Saying that a soliloquy 'tells the audience what the character is thinking' is only half an answer until it explains why that could not be achieved in dialogue.","type":"text","referenceAnswer":"First, it grants access to thought that the speaker has reason to hide. In dialogue every line is heard by another character, so a speaker with something to conceal will shape what is said. Alone, the character has no listener to manage, and the audience may take the words as sincere. This is how a play lets us know a plan before its victim does.\nSecond, it creates dramatic irony by separating what the audience knows from what the other characters know. Once the audience holds information withheld on stage, every later scene is read twice over: for what is said, and for what the audience knows lies behind it. Suspense of this kind cannot be produced by dialogue, since dialogue distributes knowledge evenly to everyone present.\n(Other acceptable points: it can slow stage time to let a decision be weighed aloud; it can address the audience directly and so implicate them in a judgement.)","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"elit_w4_02","topic":"Literary Devices","difficulty":"basic","question":"Distinguish between a simile and a metaphor, and explain why the difference matters to a reader rather than being merely a matter of labelling.","explanation":"Many answers stop at 'a simile uses like or as'. That is the definition, not the reason it matters. Marks depend on showing what changes in the reader's experience when the comparison is stated openly rather than asserted as identity.","type":"text","referenceAnswer":"Definition: a simile announces a comparison, using like or as; a metaphor asserts one thing as another without announcing that a comparison is being made.\nWhy the difference matters: a simile keeps the two terms apart. The reader is told that a resemblance is being proposed and can weigh how far it holds, so the writer's hand remains visible and the claim stays open to question. A metaphor collapses the two terms. Because nothing signals that a comparison is under way, the identification is absorbed before it is examined, and the reader is more likely to accept the attributes carried across without noticing the transfer.\nThe practical consequence is one of control. A simile invites judgement and is useful where a writer wants the reader to test the likeness; a metaphor shapes perception more quietly and is useful where a writer wants an association taken for granted. Naming the device is therefore not the point; the point is that the two devices place the reader in different positions.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"elit_w4_03","topic":"Characterisation","difficulty":"intermediate","question":"A novelist tells us that a character is generous, but every scene shows the character calculating what a kindness will be worth. Explain how a reader should handle this conflict, and what the technique achieves.","explanation":"The question tests the distinction between telling and showing, and the status of the narrator. Weak answers simply declare that the narrator is lying. A stronger answer asks whose judgement the statement represents and treats the gap itself as the meaningful element.","type":"text","referenceAnswer":"How to handle the conflict: give priority to what is shown. A direct statement of a quality is a summary, and a summary can be mistaken, partial, or coloured by the speaker's sympathies. Dramatised behaviour is evidence the reader can weigh independently. Where the two disagree, the reader should ask not which is true but who is making the claim and why it is being made.\nWhat the technique achieves: three things.\nFirst, it characterises the narrator as well as the character. If the narrator is a participant, the misdescription reveals that narrator's limited judgement or willingness to flatter. If the narrator seems detached, the gap may register a social convention: the community calls such conduct generosity because it does not look closely.\nSecond, it makes the reader an active judge. Having found one summary unreliable, the reader tests the next, and the book's assertions stop being taken on trust.\nThird, it can be a quiet form of satire. A society that mistakes calculation for generosity is being described without any narrator having to say so, which makes the criticism harder to dismiss than direct comment.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"elit_w4_04","topic":"Themes","difficulty":"intermediate","question":"Explain the difference between the subject of a work and its theme, and show why stating a theme as a single word is usually inadequate.","explanation":"The distinction is frequently blurred in examination answers, which name a topic ('love', 'war') and treat the task as complete. The required insight is that a theme is a proposition the work advances about its subject, and a proposition cannot be carried by one noun.","type":"text","referenceAnswer":"The subject is what the work is about: the material it handles, which can usually be named in a noun or two, such as ambition, exile, or a family quarrel. The theme is what the work says about that subject, and it therefore takes the form of a statement that could in principle be disputed.\nWhy a single word is inadequate: 'ambition' tells a reader only where to look. It is equally true of a work that presents ambition as the engine of achievement and of one that presents it as self-destruction; since the word fits both, it distinguishes nothing and cannot be tested against the text. A theme stated as a proposition — for instance, that ambition destroys a person most surely when it is rewarded — commits the reader to a claim that the work's events, structure and ending can be brought to support or to refute.\nA practical test follows: if the statement of theme cannot be contradicted, it is not yet a theme. 'This play is about power' admits no counter-position. 'This play shows power as something that changes whoever holds it, regardless of intention' does, and can be argued.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"elit_w4_05","topic":"Device & effect","difficulty":"intermediate","question":"A poem describes a deserted house in four calm stanzas, then ends with a single short line. Explain how the change in line length can carry meaning, and state what an answer must do to make such a claim convincing.","explanation":"This question has two parts: the effect, and the standard of proof. The second part matters because claims about form are easy to assert and hard to support; candidates often write that a device 'creates impact' without showing the connection to what the poem is saying.","type":"text","referenceAnswer":"How the change carries meaning: four stanzas of even length establish a rhythm the reader comes to expect, and reading settles into it. A single short line breaks that expectation, and the silence that follows is longer than the reader has been trained to expect. The eye and the voice both stop early. If the final line names something the calm description has been avoiding, the abruptness enacts the interruption rather than merely reporting it, and the reader experiences the break before interpreting it.\nWhat makes such a claim convincing: three requirements.\nFirst, the claimed effect must be tied to the poem's content at that exact point. If the short line says something consistent with the preceding calm, the break has no interpretive work to do, and the claim collapses.\nSecond, the argument must survive a counter-test: ask what would be lost if the line were expanded to the length of the others. An answer that cannot say what is lost has not shown that the form is doing anything.\nThird, the terms must be precise. 'Creates impact' describes the reader's reaction without identifying a cause; naming the broken expectation and the early silence identifies one.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"elit_w4_06","topic":"Shakespeare","difficulty":"intermediate","question":"Shakespeare frequently moves between verse and prose within a single play. Explain two reasons a dramatist might make such a switch, and why reading the switch as a simple marker of social rank can mislead.","explanation":"The rank explanation is the one most often repeated and is only roughly true. The question deliberately asks for its limits, so an answer that offers rank alone has answered half the question at best.","type":"text","referenceAnswer":"First reason: register and occasion. Verse suits public utterance, formal address, and heightened feeling; its regularity lends weight and suggests that the speaker is composing rather than merely talking. Prose suits quick exchange, comic business, plain information and intimacy. A switch can therefore mark a change of situation rather than of speaker.\nSecond reason: a change in a character's state of mind. A speaker who has spoken in verse and drops into prose may be exhausted, feigning madness, or speaking with a candour that formality would not allow. Because the audience has heard the earlier verse, the drop is audible, and the shift itself becomes information about the character.\nWhy the rank reading misleads: it treats a flexible resource as a fixed rule. High-ranking characters speak prose when joking, conspiring, or writing letters; low-ranking characters are given verse at moments of dignity or grief. If rank determined the choice, those cases would be errors, whereas they are among the most pointed uses of the technique. The switch is best read as marking the kind of speech occurring, with rank as one influence among several.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"elit_w4_07","topic":"Theme & irony","difficulty":"hard","question":"A short story ends with the narrator declaring that everything has worked out for the best, while the events described suggest the opposite. Explain how a reader establishes that the irony is the author's design rather than the reader's invention.","explanation":"This is a question about evidence, not about the meaning of irony. The risk it targets is circularity: a reader who has decided the narrator is unreliable can read any statement as ironic. A strong answer sets out tests that could fail.","type":"text","referenceAnswer":"The problem: if any statement may be taken as meaning its opposite, no reading can be wrong, and the interpretation becomes unfalsifiable. The reader therefore needs evidence internal to the story that the gap was constructed.\nFirst test: consistency of the discrepancy. An isolated mismatch may be carelessness or the reader's misreading. A pattern — the narrator repeatedly reporting outcomes in terms the narrated facts do not support — indicates arrangement, because accidents do not recur in one direction.\nSecond test: whether the text supplies the means of detection. Ironic design usually plants the corrective within the same narration: a detail the narrator records without appearing to notice, a remark by another character left unanswered, a date or sum that does not agree with the summary. If the reader's counter-evidence comes only from outside the story, the irony is being supplied by the reader.\nThird test: the placement of the discrepancy. Irony concentrated at points of maximum consequence, such as a closing judgement, is more likely designed than irony scattered at random, since a writer arranging an effect will place it where it bears most weight.\nFourth test: economy of explanation. Ask which reading leaves fewer details unaccounted for. If taking the narrator at face value requires dismissing several recorded facts as irrelevant, while the ironic reading gives each of them a function, the ironic reading explains more of the text and is preferred on that ground.\nWhere these tests fail, the honest conclusion is that the ending is ambiguous rather than ironic; ambiguity is a real possibility and should not be resolved by preference.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"elit_w4_08","topic":"Poetry","difficulty":"hard","question":"Two readers disagree about a poem: one finds it a lament, the other a celebration. Both cite lines from the text. Explain how such a disagreement can be productive rather than a sign that one reader is simply wrong.","explanation":"The danger at both extremes is real: declaring one reader wrong ignores the cited evidence, while declaring both correct abandons the text as a check. The answer should hold a middle position and state what would still count as a bad reading.","type":"text","referenceAnswer":"Why the disagreement can be productive:\nFirst, it may have located a genuine feature of the poem rather than an error in one reader. Poems about loss commonly hold gratitude and grief together, since what is mourned must first have been valued. If both readings rest on lines actually present, the likeliest explanation is that the poem sustains both, and the disagreement has identified its central tension.\nSecond, the argument forces each reader back to the text with a specific question. To defend a reading against a rival, each must explain the lines the other has cited, which is more demanding than assembling only the congenial evidence. Interpretation improves under that pressure in a way it does not when unopposed.\nThird, the dispute clarifies what kind of claim is being made. One reader may be describing the speaker's stated attitude, the other the effect of the poem's imagery and movement. Those are different questions, and once separated the apparent contradiction may dissolve without either side conceding.\nWhat still counts as a bad reading: the position is not that all readings are equal. A reading remains inadequate if it must ignore or explain away substantial parts of the poem, if it depends on a sense the words cannot carry, or if it rests on assumptions about the author rather than on the text. Productive disagreement occurs between readings that both account for the whole poem; it is not a licence to say anything.","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
const SUBJECT = "english-literature";
const state = {}; DATA.forEach(d => state[d.id] = 'pending');
// ── 審核用時自動記錄 ──────────────────────────────────────────────────────
// 點解要自動計：2026-08-27 公社科首批 40 條，目的之一係量度真實審核速度，
// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}
const list = document.getElementById('list');
const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "english-literature-written-b4.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "english-literature-written-b4.decisions.json"; a.click();
});
counts();
</script></body></html>
