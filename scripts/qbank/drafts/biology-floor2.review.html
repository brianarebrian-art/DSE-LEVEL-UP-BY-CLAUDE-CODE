const DATA = [{"id":"floor2_bio_gl_01","topic":"遺傳推理","difficulty":"basic","question":"一對表現型正常的夫婦生下一名患白化病的子女。白化病由常染色體隱性基因控制。這對夫婦的基因型最可能是甚麼？","options":["兩人都是雜合子（Aa × Aa）","兩人都是純合顯性（AA × AA）","一人純合顯性、一人純合隱性（AA × aa）","兩人都是純合隱性（aa × aa）"],"correctIndex":0,"explanation":"患病子女的基因型必為 aa，兩個隱性等位基因分別來自父與母，故雙親各自至少帶有一個 a。但雙親表現型正常，不可能是 aa，因此各自必為 Aa。AA × AA 的子代全部帶有顯性等位基因，不可能出現患者；AA × aa 的子代全為 Aa，同樣不會發病；aa × aa 的雙親自己就會發病，與題幹的「表現型正常」矛盾。這類題的解法固定：先由患者反推其基因型，再向上追溯雙親必須提供甚麼等位基因。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_gl_02","topic":"遺傳推理","difficulty":"intermediate","question":"兩隻雜合黑毛豚鼠（Bb）交配，黑色對白色為完全顯性。預期子代中黑毛與白毛的比例是多少？","options":["3 : 1","1 : 1","2 : 1","1 : 2"],"correctIndex":0,"explanation":"Bb × Bb 的旁氏表給出 1 BB : 2 Bb : 1 bb。由於黑色為完全顯性，BB 與 Bb 同樣表現黑毛，故表現型比例為 3 黑 : 1 白。要留意 1 : 2 : 1 是【基因型】比例，3 : 1 才是【表現型】比例，兩者混淆是本課題最常見的失分位。1 : 1 是測交（Bb × bb）的結果；2 : 1 只在某種基因型致死時才會出現，本題並無此條件。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_gl_03","topic":"遺傳推理","difficulty":"intermediate","question":"一名血型為 O 型的母親與一名 AB 型的父親生育。他們的子女可能出現哪些血型？","options":["只有 A 型與 B 型","只有 O 型與 AB 型","A、B、AB、O 四種都有可能","只有 AB 型"],"correctIndex":0,"explanation":"母親 O 型的基因型為 ii，只能提供 i；父親 AB 型的基因型為 I^A I^B，可提供 I^A 或 I^B。子代因此為 I^A i（A 型）或 I^B i（B 型），各佔一半。子代不可能是 O 型（需要兩個 i，但父親提供不到），亦不可能是 AB 型（需要同時得到 I^A 與 I^B，但母親提供不到）。ABO 血型同時涉及複等位基因與共顯性：I^A 與 I^B 互為共顯性，兩者對 i 均為顯性。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_gl_04","topic":"遺傳推理","difficulty":"hard","question":"某種植物的花色由一對等位基因控制，紅花（RR）與白花（rr）雜交，子一代全部為粉紅花。子一代自交，子二代的表現型比例是多少？","options":["1 紅 : 2 粉紅 : 1 白","3 紅 : 1 白","1 紅 : 1 白","全部粉紅"],"correctIndex":0,"explanation":"子一代全為粉紅，代表這是【不完全顯性】：雜合子 Rr 的表現型介乎兩個純合子之間，而非與顯性純合子相同。Rr × Rr 的基因型比例為 1 RR : 2 Rr : 1 rr，由於三種基因型各有不同表現型，表現型比例同樣是 1 紅 : 2 粉紅 : 1 白。3 : 1 是完全顯性下的結果，與「子一代全為粉紅」直接矛盾；1 : 1 是測交結果；「全部粉紅」忽略了自交會令隱性等位基因重新配對。判斷關鍵在子一代：出現中間表現型即代表不完全顯性。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_gl_05","topic":"遺傳推理","difficulty":"basic","question":"在人類中，男性的性染色體組合是 XY，女性是 XX。決定子女性別的是哪一方的配子？","options":["父親的精子，因為精子可帶 X 或 Y","母親的卵子，因為卵子可帶 X 或 Y","雙方各佔一半機會","由受精後的環境決定"],"correctIndex":0,"explanation":"母親為 XX，減數分裂後所有卵子都帶 X；父親為 XY，精子有一半帶 X、一半帶 Y。因此子女得到 X 精子便是女性（XX），得到 Y 精子便是男性（XY），性別由精子決定。留意「由精子決定」與「男女出生比例約各半」並不矛盾：正因為 X 與 Y 精子各佔一半，比例才接近 1 : 1。至於環境決定性別的機制在部分爬行類存在，但人類並非如此。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_gl_06","topic":"遺傳推理","difficulty":"intermediate","question":"血友病是 X 染色體上的隱性遺傳病。一名帶因（攜帶者）母親與一名正常父親生育，他們的兒子患血友病的機會是多少？","options":["二分之一","四分之一","零","全部"],"correctIndex":0,"explanation":"母親為 X^H X^h（帶因），兒子的 X 染色體必定來自母親，因此有一半機會得到 X^h 而發病（X^h Y）。父親只向兒子提供 Y，不影響結果。要分清問題問的是「兒子之中的比例」還是「全部子女之中的比例」：在【所有子女】之中患病的機會是四分之一，但題目限定於【兒子】，故為二分之一。X 連鎖隱性病在男性較常見，正因為男性只有一條 X，沒有另一條可作補償。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_gl_07","topic":"遺傳推理","difficulty":"hard","question":"研究人員讓一株高莖植物與一株矮莖植物雜交，子代中高莖與矮莖各佔約一半。若高莖對矮莖為完全顯性，該高莖親本的基因型是甚麼？","options":["雜合子（Tt）","純合顯性（TT）","純合隱性（tt）","無法判斷"],"correctIndex":0,"explanation":"矮莖親本必為 tt，只能提供 t。子代出現矮莖（tt），代表高莖親本亦提供了一個 t，故高莖親本必為 Tt。若高莖親本是 TT，所有子代都會得到 T 而全為高莖，與觀察到的一半矮莖矛盾。這正是【測交】的原理：用純合隱性個體與待測個體雜交，由子代是否出現隱性表現型，即可判斷待測個體是純合還是雜合，是遺傳學上判定未知基因型的標準做法。「無法判斷」忽略了子代數據本身已提供足夠資訊。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_pc_01","topic":"生理機制・因果鏈","difficulty":"basic","question":"劇烈運動時，呼吸速率會加快。觸發這個反應的直接刺激是甚麼？","options":["血液中二氧化碳濃度上升","血液中氧氣濃度上升","體溫下降","肌肉中肝醣含量上升"],"correctIndex":0,"explanation":"運動時肌肉呼吸作用加劇，產生大量二氧化碳並釋入血液。二氧化碳溶於血漿形成碳酸，令血液 pH 下降；延髓的呼吸中樞對這個變化最為敏感，於是加快呼吸速率，把多餘的二氧化碳呼出。留意主要刺激是二氧化碳【上升】而非氧氣下降 —— 這是常見的直覺陷阱：身體監測的是廢物累積，不是燃料短缺，因為二氧化碳的變化更快、更靈敏。體溫在運動時上升而非下降；肌肉肝醣在運動時被消耗，含量下降。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_pc_02","topic":"生理機制・因果鏈","difficulty":"intermediate","question":"進食後血糖上升，胰島素分泌增加。胰島素令血糖下降的主要機制是甚麼？","options":["促進肝細胞與肌肉細胞吸收葡萄糖並合成肝醣","促進肝細胞把儲存的肝醣分解為葡萄糖並釋入血液","抑制腎小管重吸收葡萄糖，令多餘的糖分隨尿液排出體外","加快小腸絨毛吸收葡萄糖的速率，令糖分更快進入血液循環"],"correctIndex":0,"explanation":"胰島素由胰島的 β 細胞分泌，作用是提高細胞膜對葡萄糖的通透性，令肝細胞與肌肉細胞加快吸收血中葡萄糖，並把它轉化為肝醣儲存，血糖因而回落 —— 這是一個典型的負回饋：血糖上升觸發胰島素，胰島素令血糖下降，血糖回落又令胰島素分泌減少。「促進肝醣分解」是升糖素的作用，方向剛好相反；抑制腎小管重吸收會令葡萄糖從尿液流失，那是糖尿病的病徵而非胰島素的正常作用；加快小腸吸收只會令血糖更高。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_pc_03","topic":"生理機制・因果鏈","difficulty":"intermediate","question":"天氣寒冷時，皮膚的血管會收縮。這個反應如何幫助維持體溫？","options":["減少流經皮膚表面的血量，降低輻射散熱","增加流經皮膚的血量，令皮膚保暖","令汗腺分泌更多汗液以隔熱","加快細胞呼吸作用直接產生熱能"],"correctIndex":0,"explanation":"血管收縮令流經皮膚表層微血管的血量減少，皮膚溫度隨之下降，皮膚與環境之間的溫差縮小，輻射與傳導散失的熱能因而減少，核心體溫得以維持。留意收縮的目的是【減少】而非增加皮膚血流；出汗會加快散熱，在寒冷時反而受抑制；至於加快呼吸作用產熱是另一條獨立的反應途徑（顫抖與代謝率上升），並非血管收縮本身的機制。這條因果鏈的每一環都要說清楚：血流減少 → 皮膚溫度下降 → 溫差縮小 → 散熱減少。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_pc_04","topic":"生理機制・因果鏈","difficulty":"hard","question":"一名學生長時間沒有飲水。下列哪一條因果鏈最準確描述身體的反應？","options":["血液水勢下降 → 下視丘偵測 → 腦下垂體釋出抗利尿激素 → 腎小管重吸收更多水 → 尿量減少","血液水勢上升 → 下視丘偵測到變化 → 腦下垂體釋出更多抗利尿激素 → 腎小管重吸收增加 → 尿量減少","血液水勢下降 → 腎臟自行分泌抗利尿激素 → 腎小管重吸收減少 → 尿量增加而變稀","血液水勢下降 → 抗利尿激素分泌減少 → 腎小管對水的通透性下降 → 尿量反而減少"],"correctIndex":0,"explanation":"缺水令血液中溶質相對濃度上升、水勢下降。下視丘的滲透壓感受器偵測到這個變化，促使腦下垂體後葉釋出抗利尿激素；該激素令腎小管（尤其集尿管）對水的通透性提高，重吸收更多水回血液，尿液因而變少而濃。其餘三項各有一處斷裂：有一項的起點方向寫反；另一項把分泌器官錯配為腎臟，而且結論與抗利尿激素的作用矛盾；還有一項在中段把激素方向寫反，卻仍得出尿量減少的結論 —— 前後不能自洽。答這類題要逐環檢查方向是否一致。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_pc_05","topic":"生理機制・因果鏈","difficulty":"basic","question":"小腸絨毛的表面有大量微絨毛。這個結構特徵的主要功能是甚麼？","options":["大幅增加吸收養分的表面積","分泌消化酶以分解蛋白質","把食物向前推進","防止細菌進入血液"],"correctIndex":0,"explanation":"微絨毛是絨毛表面細胞膜的細小突起，令吸收表面積再增加約二十倍。表面積愈大，單位時間內能通過的養分分子愈多，吸收效率因而提高 —— 這是「結構配合功能」的典型例子，與肺泡、根毛的原理相同。推進食物靠腸壁的肌肉層作蠕動，並非微絨毛；消化酶由腺體及腸壁細胞分泌，微絨毛本身不是分泌結構；阻擋細菌主要靠黏液層與免疫細胞。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_pc_06","topic":"生理機制・因果鏈","difficulty":"intermediate","question":"劇烈運動後肌肉出現酸痛，與下列哪一項最直接相關？","options":["氧氣供應不足時進行無氧呼吸並積聚乳酸","肌肉細胞內二氧化碳完全耗盡","血液中葡萄糖濃度上升至異常水平","肌肉細胞停止進行細胞呼吸"],"correctIndex":0,"explanation":"劇烈運動時，循環系統供氧的速率追不上肌肉的需求，肌肉細胞在有氧呼吸之外同時進行無氧呼吸。無氧呼吸把葡萄糖分解為乳酸，每分子葡萄糖只釋出約 2 個 ATP，遠少於有氧呼吸，並且乳酸積聚令肌肉感到疲勞酸痛，形成所謂「氧債」，運動後需持續大口喘氣把乳酸氧化清除。二氧化碳在運動時是【產生】而非耗盡；血糖在運動時傾向下降；細胞呼吸若真的停止，肌肉便無法收縮。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor2_bio_pc_07","topic":"生理機制・因果鏈","difficulty":"hard","question":"光照增強時，植物的光合作用速率上升，但升至某一點後不再增加。若此時提高二氧化碳濃度，速率再次上升。這說明了甚麼？","options":["在該點之後，二氧化碳濃度成為限制因子","光照強度在該點之後仍然是唯一限制因子","光合作用不受二氧化碳濃度影響","該植物已達到其最大可能的光合作用速率"],"correctIndex":0,"explanation":"限制因子的定義是：在眾多影響因素之中，數值最接近不足水平、因而決定整體速率的那一個。曲線平坦代表再增加光照也無濟於事，光已不再是限制因子；而一提高二氧化碳濃度速率便回升，正好證明此時是二氧化碳在拖住速率。有一項與觀察結果直接矛盾；另一項被實驗本身推翻；還有一項亦被推翻 —— 速率既然能再上升，先前的平台便不是最大值。這個「換一個因子試試」的實驗設計，正是辨認限制因子的標準做法。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];
