er must be traceable to the passage, not to the reader's own views","Personal opinion is always wrong, so it cannot earn any credit","The answer is too short, since opinions are briefer than inferences","Inference questions never have a correct answer, so any response is arbitrary"],"correctIndex":0,"explanation":"推斷是一種受約束的閱讀：答案必須由文本推導得出，讀者可以帶入一般常識，但不可帶入個人信念。兩個對該題目意見相左的讀者，應該仍然得出相同的推斷，因為證據就是文本本身。寫下個人看法等於用自己的前提取代了文本的前提，答案因而無法追溯到所讀的內容。個人意見本身並無錯，在議論寫作中自有其位置；問題在於用在一項要求證據的任務上。長短與此無關，而推斷題確實有站得住的答案。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor7_p1_vr_01","topic":"Reading · Vocabulary & Reference","difficulty":"basic","question":"在「委員會否決了該提案，因為它成本太高」一句中，「它」指甚麼？","options":["The proposal — the nearest preceding noun that fits the sense","The committee — the subject of the main clause","The rejection — the action described by the verb","It refers to nothing specific and is used only for grammar"],"correctIndex":0,"explanation":"指代題的答法是把候選項同時放進【位置】與【意義】兩重檢驗。最接近的前置名詞是「該提案」，而意義上亦通：提案可以成本高，而委員會成本高並不能解釋否決。兩重檢驗不一致時以意義為準 —— 英文作者並不總是把代詞緊貼其指代對象。實用的做法是把候選項代回句中，看推理是否仍然成立。「否決」是動作而非句中的名詞；至於無所指的 it，出現在 it is raining 一類句式，並非此處。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor7_p1_vr_02","topic":"Reading · Vocabulary & Reference","difficulty":"intermediate","question":"文中「the drug arrests the spread of infection」一句使用了 arrest 一詞。此處取哪一個意思？","options":["To stop or check a process from continuing","To take someone into custody by legal authority","To attract and hold someone's attention","To place under formal charge in a court of law"],"correctIndex":0,"explanation":"詞義題考的是讀者會否讓【句子】決定詞義，而非直接取該詞最常見的意思。arrest 最常指拘捕，但此處它的受詞是「感染的擴散」，並不能被拘捕，而主語是藥物而非執法人員。此處所需的是較舊的一個義項 —— 使某個過程停止，這個用法在醫學寫作中仍然通行。方法始終一致：先看該詞支配甚麼、由甚麼發出，再選出這兩者容許的義項。有一項「吸引注意」是該詞的真實義項，但與此處的主語受詞不合。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor7_p1_vr_03","topic":"Reading · Vocabulary & Reference","difficulty":"hard","question":"為何單憑詞典釋義去答語境詞義題會有風險？","options":["A word may carry several senses, and only the context selects the right one","Dictionary definitions are frequently inaccurate and should not be trusted","Examiners require answers in the student's own words, never a definition","Words in reading passages never carry their dictionary meanings"],"correctIndex":0,"explanation":"大部分常用英文詞都有多個義項，而詞典會把它們一併列出，並不會為某一個句子排出先後。直接取第一條，或取自己剛好認得的那條，正是這類題目失分的方式。可靠的做法是先讀前後文，推出該詞在此處必須是甚麼意思，文章才說得通，然後才回頭核對詞典是否有對應的義項。詞典並非不可靠，問題亦不在於措辭；有一項則說得過頭 —— 文章中的詞語通常確實用着詞典列出的某一個義項，只是未必是第一個。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_p1_tone_04","topic":"Reading · Tone & Attitude","difficulty":"basic","question":"一篇報道寫道：「這份報告在數字上，可以說相當有創意。」語氣是甚麼？","options":["Ironic understatement — the hedge accuses the report of distorting data","Admiring — the writer praises an imaginative way of presenting figures","Neutral — the writer records only that the figures were unusual","Apologetic — the writer regrets having to mention the report"],"correctIndex":0,"explanation":"「shall we say」這類緩衝語（hedge）在此並非表示不確定，而是【明知而故意輕描淡寫】，把嚴重的指控包裝成溫和的措辭，讀者反而更清楚意識到指控的分量。判斷語氣要看用詞與所指事實之間的落差：把「數據造假」說成「有創意」，落差本身就是評價。若真屬中立記述，作者會直接寫出數字有何異常，而不會使用這種修飾。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_p1_tone_05","topic":"Reading · Tone & Attitude","difficulty":"intermediate","question":"在一篇評論文章之中，哪一項最能可靠地顯示作者的態度？","options":["The loaded words chosen where neutral ones were available","The number of paragraphs into which the column is divided","The tense of the verbs used in the opening sentence","Whether the writer's name appears above or below the text"],"correctIndex":0,"explanation":"態度主要由【選詞】承載：同一件事可以說成「示威」或「暴動」、「節省」或「吝嗇」，作者在有中性選項的情況下仍選了帶評價色彩的一個，這個選擇本身即是態度。分析時應指出中性的替代說法是甚麼，再說明作者所選之詞多帶了甚麼含意。段落數目、時態與署名位置屬於版面與文法安排，與作者立場並無穩定關係。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_p1_tone_06","topic":"Reading · Tone & Attitude","difficulty":"hard","question":"一封信以這句作結：「相信此事現在將會得到它至今未曾得到的重視。」語氣傳達了甚麼？","options":["Restrained complaint — polite in form, reproachful in substance","Warm gratitude — the writer thanks the reader for prompt handling","Genuine uncertainty — the writer does not know what will happen next","Open hostility — the writer states plainly that the reader has failed"],"correctIndex":0,"explanation":"這句話的關鍵在【禮貌形式與實質內容的分離】：「相信」屬客套，而「至今未曾得到」則直指對方一直疏忽。正式書信常以這種方式表達不滿 —— 措辭保持得體，指控卻已完整送到。判斷這類語氣，要把句子拆成「表面說法」與「實際斷言」兩層：表面是對將來的期望，實際是對過去的批評。若屬公開敵意，作者會直接指出失職而不加修飾；若屬真正不確定，則不會出現對過去的判斷。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_p1_inf_04","topic":"Reading · Inference & Implication","difficulty":"intermediate","question":"「她把鎖檢查了兩次，臨出門前又檢查了第三次。」可以合理推斷甚麼？","options":["She is anxious about security, though the text never says so","The lock is broken and will not fasten however often it is tried","She is leaving the flat permanently and will not return to it","She has been burgled before, which the passage states directly"],"correctIndex":0,"explanation":"合理推斷須由【文本提供的證據】出發：反覆檢查同一把鎖是行為描寫，指向的是心理狀態 —— 對安全的不安。文本沒有說明原因，因此推斷應停在「焦慮」，不應延伸至鎖已損壞、永久離開或曾經被竊等額外情節，那些都需要文中另有線索支持。留意末項的說法連文本有沒有直接寫出都判斷錯了，屬於把推斷與原文陳述混淆。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"floor8_p1_inf_05","topic":"Reading · Inference & Implication","difficulty":"hard","question":"「有根據的推斷」與「過度推斷」的分界在哪裏？","options":["A supported inference stays within what the text's evidence can carry","A supported inference is whichever reading most candidates choose","A supported inference is always the most dramatic of the readings","A supported inference must appear word for word in the passage"],"correctIndex":0,"explanation":"分界在於【證據所能承載的範圍】：推斷可以超出字面，但不可以超出證據。實用的檢查方法是逐句問「文中哪一句支持這一點」—— 若指得出，屬合理推斷；若要補上文本沒有的前提才成立，即為過度推斷。多數人選的答案未必正確，戲劇性亦不是準則；而要求逐字寫出，則把推斷降格為抄錄，等於取消了推斷這回事。","type":"mc","referenceAnswer":null,"markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

const diffZh = { easy:'補底 L4', medium:'普通 L5', hard:'拔尖 5**', basic:'補底 L4', intermediate:'普通 L5' };
// 質量憲章元數據標籤（審批人參考 —— 唔會入庫）
const trapZh = { correct:'正解', half_right:'半對半錯', over_interpretation:'過度推論', irrelevant:'無關干擾', concept_swap:'概念偷換', concept_reversal:'概念顛倒', keyword_misread:'審題字詞' };
const dnaZh = { CMT:'🧠 CMT 概念盲區 (A)', TMR:'🎯 TMR 審題陷阱 (B)', MEC:'🧮 MEC 運算粗心 (C)' };
DATA.forEach((d, i) => {
  const el = document.createElement('div'); el.className = 'card'; el.id = 'c'+i; el.dataset.i = i;
  const trapTag = (oi) => d.trapTypes && d.trapTypes[oi] && d.trapTypes[oi] !== 'correct'
    ? ` <span style="font-size:12px;color:var(--wait);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap">${trapZh[d.trapTypes[oi]]||escape(d.trapTypes[oi])}</span>`
    : '';
  const typeZh = { mc:'選擇題', text:'文字題', long:'長題目' };
  el.innerHTML = `<div class="meta"><span class="badge">#${i+1}</span><span class="badge">${d.id}</span><span class="badge">${d.topic}</span><span class="badge">${diffZh[d.difficulty]||d.difficulty}</span>${d.type!=='mc'?`<span class="badge" style="color:var(--accent)">${typeZh[d.type]||d.type}</span>`:''}${d.dnaTag?`<span class="badge" style="color:var(--wait)">${dnaZh[d.dnaTag]||d.dnaTag}</span>`:''}${d.mother?`<span class="badge">模板 ${escape(d.mother)}</span>`:''}</div>
  <div class="q">${escape(d.question)}</div>
  ${d.type === 'mc'
    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "english-floor2.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "english-floor2.decisions.json"; a.click();
});
counts();
</script></body></html>
