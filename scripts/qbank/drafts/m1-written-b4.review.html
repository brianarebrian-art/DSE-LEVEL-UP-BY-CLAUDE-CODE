const DATA = [{"id":"m1_w4_01","topic":"排列與組合","difficulty":"basic","question":"由 8 名學生中選出 3 名組成委員會。\n(a) 若三人職位相同，有多少種選法？\n(b) 若三人分別擔任主席、秘書及司庫，有多少種選法？\n(c) 試說明為何 (b) 的答案是 (a) 的 6 倍。","explanation":"本題考核組合與排列的分別。(c) 是關鍵：學生須指出每一個組合可以排出 3! = 6 種不同的職位安排，故排列數 = 組合數 × 3!。\n只答「因為要排次序」而未指出 3! 的來源，未算完整。\n\nCasio 提示（fx-50FH II / 3650P）：nCr 與 nPr 為機上直接鍵入之運算符。輸入 8，按 nCr，輸入 3，得 56；輸入 8，按 nPr，輸入 3，得 336。切勿以階乘逐項展開，既慢且易錯。","type":"text","referenceAnswer":"(a) 職位相同，即只需選出哪三人，次序無關，屬組合。\nC(8, 3) = 8! / (3! × 5!) = 56 種。\n\n(b) 三個職位不同，選出三人之後仍須決定誰任何職，次序有關，屬排列。\nP(8, 3) = 8 × 7 × 6 = 336 種。\n\n(c) 兩者的關係：\n先按 (a) 選出三人，共 56 種選法。對於【每一個】已選出的三人組合，把三人分配到主席、秘書、司庫三個不同職位，是三個相異物件的全排列，共 3! = 3 × 2 × 1 = 6 種。\n因此總數 = 56 × 6 = 336，與 (b) 相符。\n一般關係：P(n, r) = C(n, r) × r!。組合只問「選了誰」，排列則在此之上再問「誰做哪一個」。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w4_02","topic":"二項式定理","difficulty":"basic","question":"在 $(2x + 3)^6$ 的展開式中，求 $x^4$ 項的係數。並說明為何直接把六個括號逐一相乘並非可取的做法。","explanation":"本題考核通項公式的運用。常見錯誤有二：其一，忘記把係數 2 一併取冪，只計 C(6, 4)；其二，混淆 $r$ 的定義，把 $x^4$ 對應錯誤的項。\n通項為 $T_{r+1} = C(6, r)(2x)^{6-r}(3)^r$，須 $6 - r = 4$，故 $r = 2$。\n\nCasio 提示（fx-50FH II / 3650P）：以 nCr 求 C(6, 2) = 15，再與 $2^4$、$3^2$ 相乘。建議把 $C(6,r) \\times 2^{6-r} \\times 3^r$ 存為 PROG 程式，以 $r$ 為輸入 —— 一旦題目要求多個項（例如求常數項與 $x^2$ 項），可大幅減少重複按鍵所引致的錯誤。","type":"text","referenceAnswer":"通項：$T_{r+1} = C(6, r) \\, (2x)^{6-r} \\, 3^{r}$。\n$x$ 的冪為 $6 - r$。要得 $x^4$，須 $6 - r = 4$，即 $r = 2$。\n代入：$T_3 = C(6, 2) \\times (2x)^4 \\times 3^2 = 15 \\times 16x^4 \\times 9 = 2160 x^4$。\n故 $x^4$ 項的係數為 $2160$。\n\n為何不宜逐一相乘：\n其一，$(2x+3)^6$ 展開後共有 $2^6 = 64$ 個乘積項，須逐項合併同類項，步驟繁多。\n其二，題目只要求【一項】的係數，其餘 6 項的計算全屬多餘。通項公式可以直接取出所需的一項。\n其三，步驟愈多，出錯機會愈大，而錯在中途往往難以察覺。\n其四，若指數改為 12 或 20，逐一相乘在考試時間內根本不可行，而通項公式的工作量完全不變。\n核對：把 $r = 0$ 至 $6$ 各項的係數相加，應等於 $(2 + 3)^6 = 5^6 = 15625$（即令 $x = 1$）。此為驗算展開式是否正確的快捷方法。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w4_03","topic":"二項分佈","difficulty":"intermediate","question":"某測驗有 10 條多項選擇題，每題有 4 個選項，其中 1 個正確。某學生完全不懂，全部隨機作答。設 $X$ 為答對的題數。\n(a) 說明 $X$ 服從何種分佈，並寫出其參數。\n(b) 求 $P(X = 3)$（準確至四位小數）。\n(c) 求 $P(X \\ge 1)$（準確至四位小數）。\n(d) 求 $X$ 的期望值與方差。\n(e) 該測驗以答對 5 題或以上為及格。試評論「隨機作答亦有機會及格」這一說法。","explanation":"(a) 須驗證二項分佈的四項條件：試驗次數固定、每次只有成功與失敗、各次獨立、成功概率不變。只寫「二項分佈」而不驗證條件者，未達要求。\n(c) 的關鍵在於使用互補事件：$P(X \\ge 1) = 1 - P(X = 0)$，而非逐項相加 1 至 10。兩者數學上等價，但後者有十次出錯機會。\n(e) 要求學生把計算結果轉化為判斷 —— 「有機會」與「機會有多大」是兩回事。\n\nCasio 提示（fx-50FH II / 3650P）：二項概率無內建函數，須以 nCr 配合冪運算逐項計算。建議把 $C(10, r) \\times 0.25^{r} \\times 0.75^{10-r}$ 存為 PROG 程式，以 $r$ 為輸入。(e) 須累加 $r = 5$ 至 $10$ 共六項，有程式可省下大量按鍵。","type":"long","referenceAnswer":"(a) $X$ 服從二項分佈。驗證四項條件：\n其一，試驗次數固定為 $n = 10$。\n其二，每題只有兩個結果 —— 答對或答錯。\n其三，各題的作答互相獨立（隨機作答，一題的結果不影響另一題）。\n其四，每題答對的概率固定為 $p = 1/4 = 0.25$。\n故 $X \\sim B(10, 0.25)$。\n\n(b) $P(X = 3) = C(10, 3) (0.25)^3 (0.75)^7$\n$= 120 \\times 0.015625 \\times 0.1334839...$\n$= 0.2503$（準確至四位小數）。\n\n(c) 使用互補事件：\n$P(X \\ge 1) = 1 - P(X = 0) = 1 - C(10,0)(0.25)^0(0.75)^{10} = 1 - (0.75)^{10}$\n$= 1 - 0.0563135... = 0.9437$（準確至四位小數）。\n說明：若逐項計算 $P(X=1)$ 至 $P(X=10)$ 再相加，答案相同，但需計十項，每項都是一次出錯機會，且耗時甚多。互補事件只需一項。\n\n(d) $E(X) = np = 10 \\times 0.25 = 2.5$。\n$\\mathrm{Var}(X) = np(1-p) = 10 \\times 0.25 \\times 0.75 = 1.875$。\n（標準差 $\\approx 1.369$。）\n\n(e) 評論：\n先計算及格概率：\n$P(X \\ge 5) = \\sum_{r=5}^{10} C(10, r)(0.25)^r (0.75)^{10-r} \\approx 0.0781$。\n即約 7.8%。\n該說法【字面上成立】—— 概率並非零，隨機作答確實有可能及格。但單說「有機會」並未說出重點：\n其一，機會約為十三分之一，即平均應考十三次方有約一次及格。以此作為應試策略並不可行。\n其二，期望答對題數僅 2.5 題，距及格線 5 題相差一倍，即「典型情況」遠低於及格。\n其三，及格所需的 5 題，在分佈上屬於右尾；$X = 5$ 已在期望值之上約 1.8 個標準差。\n結論：正確的講法是「隨機作答及格的概率約為 7.8%，屬小概率事件，不應視為可行途徑」。把「概率大於零」等同於「有機會做到」，是把【可能性】與【合理期望】混為一談。","markingScheme":"(a) 2 分 —— 指出 $X \\sim B(10, 0.25)$（1）；驗證條件：10 次固定、每題答對或答錯、各題獨立、每題答對概率固定為 $1/4$（1）。\n   ⚠️ 只寫分佈名稱而不驗條件，只得 1 分。\n(b) 1 分 —— $C(10,3)(0.25)^3(0.75)^7 = 0.2503$。\n(c) 2 分 —— 列出 $1 - P(X=0)$（1）；$1 - (0.75)^{10} = 1 - 0.0563 = 0.9437$（1）。\n   逐項相加而答案正確者，兩分照給；但若中途出錯，方法分不予補償。\n(d) 2 分 —— $E(X) = np = 2.5$（1）；$\\mathrm{Var}(X) = np(1-p) = 1.875$（1）。\n(e) 1 分 —— 須以數字支持判斷：$P(X \\ge 5) \\approx 0.0781$，即約 7.8%，故「有機會」屬實但機會甚微；並須指出十次應考約只有一次及格。\n   ⚠️ 答「有機會，所以可以靠估」不給分 —— 未以數量判斷。\n   ⚠️ 答「不可能及格」亦不給分 —— 與計算結果不符。","suggestedMinutes":12,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w4_04","topic":"正態分佈","difficulty":"intermediate","question":"某廠生產的螺絲長度服從正態分佈，平均數 $\\mu = 20$ 毫米，標準差 $\\sigma = 0.4$ 毫米。合格範圍為 $19.2$ 至 $20.6$ 毫米。\n(a) 求一枚螺絲不合格的概率（準確至四位小數）。\n(b) 若工廠希望不合格率降至 1% 以下，在不改變平均數的前提下，標準差最多可為多少？（準確至小數點後三位）","explanation":"(a) 的陷阱在於合格範圍【並非】對稱於平均數：下限距平均數 $0.8 = 2\\sigma$，上限距平均數 $0.6 = 1.5\\sigma$。學生若誤以為對稱而只計一邊再乘二，答案必錯。\n(b) 須逆向運用標準正態表：先找出對應 1% 總不合格率的 $z$ 值，再由較嚴格的一邊（此處為上限，因其 $z$ 較小）決定 $\\sigma$。\n\nCasio 提示（fx-50FH II / 3650P）：機上無正態分佈函數，$z$ 值須查表。建議把 $z = (x - \\mu)/\\sigma$ 存為 PROG 程式，以 $x$ 為輸入，$\\mu$、$\\sigma$ 先存入記憶 A、B。逆向題（(b)）則以 $\\sigma = (x - \\mu)/z$ 計算，同一程式改寫即可。","type":"text","referenceAnswer":"(a) 先把兩個界限標準化。\n下限：$z_1 = (19.2 - 20)/0.4 = -0.8/0.4 = -2.00$。\n上限：$z_2 = (20.6 - 20)/0.4 = 0.6/0.4 = 1.50$。\n注意兩者與平均數的距離【並不相同】，故不可只計一邊再乘二。\n$P(\\text{合格}) = P(-2.00 \u003c Z \u003c 1.50) = \\Phi(1.50) - \\Phi(-2.00)$\n$= 0.9332 - 0.0228 = 0.9104$。\n$P(\\text{不合格}) = 1 - 0.9104 = 0.0896$。\n（亦可分別計算兩尾：下尾 $0.0228$ ＋ 上尾 $1 - 0.9332 = 0.0668$，合共 $0.0896$，相符。）\n\n(b) 設新的標準差為 $\\sigma$，平均數維持 $20$。\n兩個界限距平均數分別為 $0.8$（下）與 $0.6$（上）。由於上限距離較近，上尾必然是較大的一尾，故總不合格率主要由上尾決定。\n保守做法：要求【上尾單獨】不超過 1%，則下尾必然更小，總和亦必小於 2%；但題目要求總數低於 1%，故須更嚴。\n採用以下處理：令上尾概率為 $\\alpha_2$、下尾為 $\\alpha_1$，要求 $\\alpha_1 + \\alpha_2 \u003c 0.01$。由於 $0.8/0.6 = 4/3$，下尾對應的 $z$ 恆為上尾的 $4/3$ 倍，下尾概率遠小於上尾。試以上尾 $z = 2.40$（對應 $\\alpha_2 = 0.0082$）：\n則 $\\sigma = 0.6/2.40 = 0.25$，下尾 $z = 0.8/0.25 = 3.20$，$\\alpha_1 = 0.0007$。\n總和 $= 0.0082 + 0.0007 = 0.0089 \u003c 0.01$ ✓。\n再試 $z = 2.36$（$\\alpha_2 = 0.0091$）：$\\sigma = 0.6/2.36 = 0.2542$，下尾 $z = 3.147$，$\\alpha_1 \\approx 0.0008$，總和 $\\approx 0.0099 \u003c 0.01$ ✓（剛好）。\n再放寬至 $z = 2.35$（$\\alpha_2 = 0.0094$）：$\\sigma = 0.2553$，下尾 $z = 3.134$，$\\alpha_1 \\approx 0.0009$，總和 $\\approx 0.0103 > 0.01$ ✗。\n故標準差最多約為 $\\sigma = 0.254$ 毫米。\n\n說明：本題須以試值逼近，因為兩尾的 $z$ 由同一個 $\\sigma$ 同時決定，無法直接解出。實務上亦常用此法。若題目容許近似，可先忽略極小的下尾，以上尾 $z = 2.33$（$\\alpha = 0.0099$）估得 $\\sigma \\approx 0.257$，再檢查總和是否仍低於 1% 並作調整。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w4_05","topic":"概率分佈（高階）","difficulty":"intermediate","question":"二項分佈與泊松分佈皆可用以描述計數資料。試說明兩者適用情況的分別，並指出在何種條件下可以用泊松分佈近似二項分佈。","explanation":"答案須指出二項分佈有固定的試驗次數上限，而泊松分佈沒有 —— 此為兩者最根本的分別。近似條件須具體（$n$ 大、$p$ 小、$np$ 適中），並說明 $\\lambda = np$ 的來源。\n\nCasio 提示（fx-50FH II / 3650P）：泊松概率 $P(X = r) = e^{-\\lambda}\\lambda^{r}/r!$ 須以 $e^x$ 鍵配合階乘計算。建議把此式存為 PROG 程式，以 $r$ 為輸入、$\\lambda$ 存入記憶 A。比較兩種分佈的數值時，可省下大量重複輸入。","type":"text","referenceAnswer":"適用情況的分別：\n二項分佈 $B(n, p)$ 適用於：試驗次數 $n$ 固定且已知；每次試驗只有成功與失敗兩個結果；各次獨立；成功概率 $p$ 不變。其取值範圍為 $0$ 至 $n$，有明確的上限。\n例：抽驗 50 件產品之中有多少件次品（最多 50 件）。\n泊松分佈 $\\mathrm{Po}(\\lambda)$ 適用於：在固定的時間或空間區間之內，某事件發生的【次數】；事件獨立發生；平均發生率 $\\lambda$ 固定；理論上次數並無上限。\n例：一小時內到達某櫃位的顧客人數（並無「最多幾多人」這一自然上限）。\n最根本的分別在於：二項分佈須先有一個可數的試驗總數，泊松分佈則沒有 —— 我們無法說「這一小時內共進行了 $n$ 次到達試驗」。\n泊松近似二項的條件：\n當 $n$ 甚大、$p$ 甚小，而 $np$ 維持適中時，$B(n, p)$ 可用 $\\mathrm{Po}(\\lambda)$ 近似，其中 $\\lambda = np$。\n常用的經驗準則為 $n \\ge 50$ 且 $p \\le 0.1$（或 $np \\le 10$）。\n$\\lambda = np$ 的來源：兩者的期望值必須相同。二項分佈的期望值為 $np$，泊松分佈的期望值為 $\\lambda$，故令 $\\lambda = np$。\n須留意方差並不完全相同：二項為 $np(1-p)$，泊松為 $\\lambda = np$。當 $p$ 很小時 $(1-p) \\approx 1$，兩者方差接近，近似方為合理；若 $p$ 不小，方差差距明顯，近似即失效。此點正是「$p$ 須甚小」這一條件的理由。\n近似的實際用途：當 $n$ 甚大時，$C(n, r)$ 的數值極大而 $p^r$ 極小，計算器容易溢位或失去精度；泊松公式只涉及 $e^{-\\lambda}$、$\\lambda^r$ 與 $r!$，數值規模合理得多。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w4_06","topic":"積分","difficulty":"intermediate","question":"某產品的邊際成本函數為 $C'(x) = 3x^2 - 12x + 20$（單位：元／件），其中 $x$ 為產量（件）。已知生產 2 件時的總成本為 \\$100。\n(a) 求總成本函數 $C(x)$。\n(b) 求固定成本。\n(c) 求產量由 4 件增至 6 件時所增加的成本。","explanation":"本題考核不定積分與定積分的分工。(a) 須用不定積分並以已知條件定出積分常數 —— 忘記積分常數是最常見的錯誤。\n(b) 固定成本即 $C(0)$，亦即該積分常數本身。\n(c) 可用 $C(6) - C(4)$，亦可直接用定積分 $\\int_4^6 C'(x)\\,dx$；後者不需先求積分常數，較快。\n\nCasio 提示（fx-50FH II / 3650P）：機上有定積分功能鍵（$\\int dx$），可直接求 (c) 的數值積分，用以核對手算結果。輸入被積函數、下限 4、上限 6 即可。⚠️ 但 (a) 要求函數形式，必須手算 —— 計算器只能給數值，不能給符號答案。","type":"text","referenceAnswer":"(a) 總成本為邊際成本的不定積分：\n$C(x) = \\int (3x^2 - 12x + 20)\\,dx = x^3 - 6x^2 + 20x + k$，其中 $k$ 為積分常數。\n代入已知條件 $C(2) = 100$：\n$2^3 - 6(2)^2 + 20(2) + k = 100$\n$8 - 24 + 40 + k = 100$\n$24 + k = 100$，故 $k = 76$。\n因此 $C(x) = x^3 - 6x^2 + 20x + 76$。\n\n(b) 固定成本即產量為零時的成本：\n$C(0) = 0 - 0 + 0 + 76 = \\$76$。\n觀察：固定成本【就是】積分常數 $k$。這並非巧合 —— 不定積分的常數項不隨 $x$ 變化，正好對應「不隨產量變化的成本」這一經濟意義。若答 (a) 時漏掉 $k$，(b) 便會得出固定成本為零，而這在經濟上幾乎不可能。\n\n(c) 方法一（用 (a) 的結果）：\n$C(6) = 216 - 216 + 120 + 76 = 196$。\n$C(4) = 64 - 96 + 80 + 76 = 124$。\n增加的成本 $= 196 - 124 = \\$72$。\n方法二（直接用定積分）：\n$\\int_4^6 (3x^2 - 12x + 20)\\,dx = [x^3 - 6x^2 + 20x]_4^6$\n$= (216 - 216 + 120) - (64 - 96 + 80) = 120 - 48 = \\$72$。\n兩法相符。\n說明：方法二不需要求出積分常數，因為常數在相減時抵銷。若題目只問「增加的成本」而不問總成本函數，直接用定積分可省去求 $k$ 的步驟。此亦說明定積分與不定積分的分工 —— 前者求變化量，後者求函數本身。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w4_07","topic":"正態分佈計算","difficulty":"hard","question":"某公開試的分數服從正態分佈，平均分 $\\mu = 52$，標準差 $\\sigma = 14$。\n(a) 求分數高於 70 分的考生比例（準確至四位小數）。\n(b) 若最高的 5% 考生可獲頒獎學金，求最低的獲獎分數（準確至整數）。\n(c) 某校有 240 名考生，其分數分佈與全港相同。求該校獲獎學金人數的期望值。\n(d) 該校校長聲稱：「我校今年有 18 人獲獎，遠高於預期，證明教學有顯著改善。」試評論此說。","explanation":"(a)(b) 分別為正向與逆向的標準化運算，學生須分清「由分數求概率」與「由概率求分數」兩個方向。\n(c) 為二項分佈期望值的簡單應用。\n(d) 是本題的重點，亦是與一般計算題的分別所在：學生須把 18 與期望值 12 比較，並意識到隨機波動的存在 —— 高於期望不等於證明了甚麼。此處須用到 (c) 的方差。\n\nCasio 提示（fx-50FH II / 3650P）：$z = (x - \\mu)/\\sigma$ 與其逆式 $x = \\mu + z\\sigma$ 建議一併存為 PROG 程式，$\\mu$、$\\sigma$ 分別存入記憶 A、B。(a)(b) 只是同一程式的兩個方向，設定一次即可反覆使用，避免每次重新輸入 52 與 14。","type":"long","referenceAnswer":"(a) $z = (70 - 52)/14 = 18/14 = 1.2857$。\n$P(X > 70) = P(Z > 1.29) = 1 - \\Phi(1.29) = 1 - 0.9015 = 0.0985$。\n即約 9.85% 的考生分數高於 70。\n\n(b) 最高 5% 即上尾概率為 $0.05$，對應 $\\Phi(z) = 0.95$，查表得 $z = 1.645$。\n$x = \\mu + z\\sigma = 52 + 1.645 \\times 14 = 52 + 23.03 = 75.03$。\n最低獲獎分數約為 $75$ 分。\n\n(c) 每名考生獲獎的概率為 $0.05$，各人獨立，故獲獎人數 $Y \\sim B(240, 0.05)$。\n$E(Y) = np = 240 \\times 0.05 = 12$ 人。\n\n(d) 評論：\n先量度 18 與期望值的距離。\n$\\mathrm{Var}(Y) = np(1-p) = 240 \\times 0.05 \\times 0.95 = 11.4$，標準差 $= \\sqrt{11.4} \\approx 3.376$。\n$18$ 高於期望 $12$ 共 $6$ 人，即 $6/3.376 \\approx 1.78$ 個標準差。\n在正態近似之下，單尾概率約為 $P(Z > 1.78) \\approx 0.0375$，即約 3.8%。\n此說的問題：\n其一，「遠高於預期」誇大了差距。1.78 個標準差雖然偏高，但並非罕見 —— 大約每 26 年就會出現一次同等或更高的結果，【即使教學完全沒有改變】。把一次落在此範圍的結果稱為「遠高於」，並不準確。\n其二，「證明」一詞過強。即使差異具統計顯著性（本例在 5% 水平下勉強達到），亦只表示「不太可能純由隨機造成」，而非證明成因為教學改善。\n其三，未排除其他解釋。該屆學生的入學成績可能較高；校外補習、家庭背景、同屆人數變化、甚至該年試卷的難度分佈，皆可影響結果。單年單校的數據無法分辨這些因素。\n其四，存在選擇性報告的風險。若校長只在成績好的年份作此聲稱，而成績回落時不提，則一連串的年度之中總會出現若干個「高於預期」的年份，此類挑選本身即會製造出看似有力的證據。\n較穩妥的檢驗方法：\n其一，觀察多年趨勢。若連續數年皆高於期望，隨機波動的解釋力便大幅下降。\n其二，與同區同類學校比較。若全區今年皆上升，則成因在該校之外。\n其三，比較該屆學生入學時的成績與畢業時的表現（增值分析），方能把學校的貢獻與生源的差異分開。\n結論：18 人高於期望 12 人，是一個【值得留意但未足以下結論】的訊號。正確的講法是：「今年結果高於期望，我們會持續觀察數年並與同類學校比較，以確認是否屬實質改善。」","markingScheme":"(a) 2 分 —— $z = (70 - 52)/14 = 1.2857$（1）；$P = 1 - \\Phi(1.29) = 1 - 0.9015 = 0.0985$（1）。\n   接受 $0.0985$ 至 $0.0999$ 之間的答案（視乎查表位數）。\n(b) 2 分 —— 指出所需 $z = 1.645$（1）；$x = 52 + 1.645 \\times 14 = 75.03 \\approx 75$（1）。\n   ⚠️ 用 $z = 1.96$（雙尾）者不給分 —— 本題為單尾。\n(c) 2 分 —— 指出人數服從 $B(240, 0.05)$（1）；$E = 240 \\times 0.05 = 12$（1）。\n(d) 3 分 —— 計算標準差 $\\sqrt{240 \\times 0.05 \\times 0.95} \\approx 3.376$（1）；\n   指出 18 僅高於期望約 1.78 個標準差，屬隨機波動的合理範圍（1）；\n   指出單年單校數據不足以支持因果結論，並提出至少一項改善檢驗方法（1）。\n   可接受的方法：比較多年趨勢；與同區同類學校比較；檢視該屆入學成績是否較高。\n   ⚠️ 只答「樣本太小」而無任何數量支持，只得 1 分。\n   ⚠️ 完全同意校長說法者，(d) 不給分。","suggestedMinutes":14,"trapTypes":null,"dnaTag":null,"mother":null},{"id":"m1_w4_08","topic":"指數對數微積分","difficulty":"hard","question":"某細菌數量按 $N(t) = 500 e^{0.4t}$ 增長，其中 $t$ 以小時計。\n(a) 求 $t = 3$ 時的瞬時增長率。\n(b) 求數量達到 5000 所需的時間（準確至小數點後兩位）。\n(c) 試說明為何 $N'(t)/N(t)$ 為常數，並解釋此一性質的意義。","explanation":"(c) 是本題的核心。學生須認識到指數增長的定義性質，正是【相對增長率恆定】—— 絕對增長量不斷上升，但每一單位現有數量所產生的增長維持不變。\n(b) 須運用對數解方程，常見錯誤是把 $\\ln 10$ 與 $\\log 10$ 混淆。\n\nCasio 提示（fx-50FH II / 3650P）：$e^x$ 與 $\\ln$ 為機上直接功能鍵。⚠️ 留意 $\\log$ 鍵為【以 10 為底】，$\\ln$ 鍵方為自然對數；本題須用 $\\ln$。若誤按 $\\log$，(b) 會得出 $t \\approx 2.50$ 而非正確的 $5.76$ —— 兩者相差超過一倍，而答案本身看來仍然合理，故不易察覺。","type":"text","referenceAnswer":"(a) 微分：$N'(t) = 500 \\times 0.4 \\, e^{0.4t} = 200 e^{0.4t}$。\n代入 $t = 3$：$N'(3) = 200 e^{1.2} = 200 \\times 3.32012 = 664.02$。\n即在第 3 小時，細菌數量的瞬時增長率約為每小時 664 個。\n\n(b) 解 $500 e^{0.4t} = 5000$。\n$e^{0.4t} = 10$。\n兩邊取自然對數：$0.4t = \\ln 10 = 2.302585$。\n$t = 2.302585 / 0.4 = 5.7565 \\approx 5.76$ 小時。\n（核對：$500 e^{0.4 \\times 5.7565} = 500 e^{2.3026} = 500 \\times 10.0 = 5000$ ✓。）\n\n(c) 計算：\n$\\dfrac{N'(t)}{N(t)} = \\dfrac{200 e^{0.4t}}{500 e^{0.4t}} = \\dfrac{200}{500} = 0.4$。\n指數項在分子與分母中完全抵銷，故此比值恆為 $0.4$，與 $t$ 無關。\n意義：\n其一，$N'(t)/N(t)$ 稱為【相對增長率】（或比增長率），即單位時間內、每一個現有個體所貢獻的增長。本例為 0.4，即每小時增長相當於現有數量的 40%。\n其二，此一性質正是指數增長的【定義性特徵】。微分方程 $N'(t) = 0.4 N(t)$ 的意思是：增長速度與當時的數量成正比。凡滿足此一條件的函數，必為指數函數形式 $N(t) = N_0 e^{kt}$。反之亦然。\n其三，須分清【絕對】與【相對】增長。絕對增長率 $N'(t)$ 隨時間不斷上升 —— 由 $t=0$ 的 200 增至 $t=3$ 的 664，再增至 $t=10$ 的約 10,920。但相對增長率始終維持 0.4。數量愈多，每小時新增的個體愈多，正因為基數變大，而非每個個體繁殖得更快。\n其四，實際意義：此模型假設資源無限、每個個體的繁殖能力不受族群密度影響。真實的細菌培養在養分耗盡或代謝產物累積之後，相對增長率會下降，此時指數模型即不再適用，須改用邏輯斯蒂模型一類有上限的模型。指出模型的適用範圍，與計算本身同樣重要。\n其五，倍增時間為常數。由 $e^{0.4T} = 2$ 得 $T = \\ln 2 / 0.4 \\approx 1.73$ 小時 —— 無論由 500 增至 1000，抑或由 50,000 增至 100,000，所需時間相同。這是相對增長率恆定的另一種表述方式。","markingScheme":null,"suggestedMinutes":null,"trapTypes":null,"dnaTag":null,"mother":null}];

// 用嚟推算餘下 2,562 條 MC 需要幾多人手。結果冇人記得計時，個數字要靠
// commit 時間戳倒推，只夾到一個上限。靠人記住撳錶就一定會漏 —— 所以改由
// 頁面自己記，匯出時一併帶出。呢個唔係監察，係令「一條題要審幾耐」呢個
// 規劃前提有真實數據，唔使再估。
const marks = [];              // 每次落決定嘅時間戳
let firstMarkAt = null;
function noteMark(){ const t = Date.now(); if(firstMarkAt===null) firstMarkAt=t; marks.push(t); }
function timing(){
  if(marks.length < 2) return null;
  const gaps = []; for(let i=1;i<marks.length;i++) gaps.push((marks[i]-marks[i-1])/1000);
  gaps.sort((x,y)=>x-y);
  const med = gaps.length%2 ? gaps[(gaps.length-1)/2] : (gaps[gaps.length/2-1]+gaps[gaps.length/2])/2;
  return {
    totalSeconds: Math.round((marks[marks.length-1]-firstMarkAt)/1000),
    decisions: marks.length,
    medianSecondsPerQuestion: Math.round(med*10)/10,
    fastestSeconds: Math.round(gaps[0]*10)/10,
  };
}

    ? `<ul>${d.options.map((o,oi)=>`<li class="${oi===d.correctIndex?'correct':''}">${escape(o)}${trapTag(oi)}</li>`).join('')}</ul>`
    : `<div class="exp" style="border-left:3px solid var(--ok);padding-left:12px;margin:12px 0">
         <div style="color:var(--ok);font-weight:600;margin-bottom:4px">參考答案（學生提交後見到，用嚟自評）</div>
         ${escape(d.referenceAnswer || '（缺失 —— 呢條唔應該過到閘，請退回）')}
       </div>
       ${d.markingScheme ? `<div class="exp" style="border-left:3px solid var(--line);padding-left:12px;margin:12px 0">
         <div style="color:var(--dim);font-weight:600;margin-bottom:4px">評分準則 / 步驟分</div>${escape(d.markingScheme)}</div>` : ''}
       <div style="color:var(--wait);font-size:13px;margin:8px 0">
         ⚠️ ${d.type === 'long' ? '長題目' : '文字題'}：機器【永不】批改，學生對照參考答案自評。
         批呢類題請重點睇「參考答案本身啱唔啱、夠唔夠學生自己判斷」。${d.suggestedMinutes ? ` · 建議用時 ${d.suggestedMinutes} 分鐘` : ''}
       </div>`}
  <div class="exp">💡 ${escape(d.explanation)}</div>
  <div class="acts"><button class="a" onclick="mark(${i},'approved')">✅ 通過</button><button class="r" onclick="mark(${i},'rejected')">❌ 退回</button><button class="p on" onclick="mark(${i},'pending')">⏳ 待定</button></div>`;
  list.appendChild(el);
});
function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let cur = 0;
function mark(i, v){ const d = DATA[i]; if(state[d.id]!==v) noteMark(); state[d.id] = v; const el = document.getElementById('c'+i);
  el.classList.toggle('approved', v==='approved'); el.classList.toggle('rejected', v==='rejected');
  el.querySelector('.a').classList.toggle('on', v==='approved'); el.querySelector('.r').classList.toggle('on', v==='rejected'); el.querySelector('.p').classList.toggle('on', v==='pending');
  counts(); }
function counts(){ let a=0,r=0,p=0; for(const k in state){ if(state[k]==='approved')a++; else if(state[k]==='rejected')r++; else p++; }
  document.getElementById('cA').textContent=a; document.getElementById('cR').textContent=r; document.getElementById('cP').textContent=p; }
function focusCard(i){ cur=Math.max(0,Math.min(DATA.length-1,i)); document.getElementById('c'+cur).scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase();
  if(k==='j'){focusCard(cur+1);} else if(k==='k'){focusCard(cur-1);}
  else if(k==='a'){mark(cur,'approved');focusCard(cur+1);} else if(k==='r'){mark(cur,'rejected');focusCard(cur+1);} else if(k==='p'){mark(cur,'pending');} });
document.getElementById('exp').addEventListener('click', ()=>{
  // 簽名日期用香港時間 —— toISOString() 喺 HKT 00:00-08:00 會報前一日，
  // 令簽名日期同簽名人當日嘅日曆對唔上（同 sensei-golive.mjs 同一修正）。
  const out = { _meta: { source: "m1-written-b4.json", subject: SUBJECT, reviewer: document.getElementById('rev').value.trim(), reviewedAt: new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong'}).format(new Date()), timing: timing() }, decisions: state };
  const blob = new Blob([JSON.stringify(out,null,2)+'\n'], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "m1-written-b4.decisions.json"; a.click();
});
counts();
</script></body></html>
